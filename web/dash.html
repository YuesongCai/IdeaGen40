/* ══════════ 追问记录 — 历次追问的运营视图 ══════════
 * 追问本身也是底账：一次追问 = 有人问了什么、系统当时把哪些材料交给了模型、
 * 模型引用了其中哪几件、答的是什么。这四样凑齐，事后才有办法判断某个回答
 * 是「有据」还是「听起来有据」——只看答案是判断不出来的。
 * 列表 → 详情 → 它当时拿到的材料 → 点进那件材料本身，一路可以往下追。 */
var ASKLOG=null,askLogErr='',askLogOpen={};
function openAskLogDrawer(){pushDrawer({t:'asklog',p:''})}
/* 全局入口：列出这一期能问的所有对象。四类都来自后端 SUBJECT_KINDS，
   页面不自造类型，也不承诺它答不了的东西。 */
function openAskPicker(){pushDrawer({t:'askpick',p:''})}
function askPickerBody(){
  var subs=askSubjects();
  if(!subs.length)return '<div class="empty-sm">本期还没有可追问的对象——周跑尚未产出主题与持仓。</div>';
  var groups={},order=[];
  subs.forEach(function(x){if(!groups[x.group]){groups[x.group]=[];order.push(x.group)}groups[x.group].push(x)});
  /* 全局入口要知道读者正站在哪一页：从持仓页点开，先列持仓；从证据页点开，
     先列选取策略。同一份清单，只是把手边的那组提到前面。 */
  var PREFER={holdings:'持仓',evidence:'选取策略',method:'这一步',overview:'这一步'};
  var first=PREFER[current];
  if(first&&groups[first])order=[first].concat(order.filter(function(g){return g!==first}));
  return '<div class="quiet" style="margin-bottom:var(--space-2)">'
      +'挑一个对象追问，答案只依据这次运行封存的材料 '
      +glossMark('封存的材料 = 运行日志、当期研报正文、评分与判定记录。材料里没有的，它会直说记录中不存在，不补全，也不用之后发生的事情回答。页面上那个绿色按钮问的是同一件事，只是替你把对象填好了。')
      +'</div>'
    +order.map(function(g){
      return '<div class="askpick-g">'+esc(g)+'</div>'
        +groups[g].map(function(x){
          return '<button type="button" class="askpick-i" data-el="ask.pick.'+esc(x.kind)+'"'
            +' onclick="truncDrawers(0);openAskDrawer(\''+jss(x.kind)+'\',\''+jss(String(x.id))+'\')">'
            +'<b>'+esc(x.label)+'</b><span>'+esc(x.sub)+'</span></button>';
        }).join('');
    }).join('')
    +'<div style="margin-top:var(--space-5);padding-top:var(--space-4);border-top:1px solid var(--color-border-subtle)">'
      +'<button type="button" class="exp-btn" data-el="ask.log" onclick="truncDrawers(0);openAskLogDrawer()">追问记录 ›</button>'
    +'</div>';
}
function ensureAskLog(){
  if(ASKLOG!==null)return ASKLOG;
  if(ensureAskLog._busy)return null;
  ensureAskLog._busy=true;
  fetch('/api/asks?limit=100').then(function(r){return r.json()}).then(function(j){
    ASKLOG=j.asks||[];askLogErr=j.error||'';ensureAskLog._busy=false;renderDrawers();
  }).catch(function(e){
    ASKLOG=[];askLogErr=String(e&&e.message||e);ensureAskLog._busy=false;renderDrawers();
  });
  return null;
}
function askLogSubject(a){
  var k=a.kind||'',id=a.id||'';
  if(k==='topic')return '主题 '+id;
  if(k==='selection')return '选题这一步';
  if(k==='selector')return '策略 '+(selMetaOf(id)[1]||id);
  if(k==='idea')return '想法 '+id;
  return (k?k+' ':'')+id;
}
/* 材料 → 它自己所在的那一层。追问详情不是终点，是入口。 */
function askMatOpen(m){
  var src=String(m.source||''),k=String(m.kind||'');
  if(k==='journal')return "openRunLogStacked()";
  /* 语料浏览器要按期查库，必须带上这次运行的 as_of——不带就取不到清单。 */
  if(k==='doc'){
    var ao=((S||{}).weekly||{}).as_of||'';
    return ao?("openCorpus('"+ao+"')"):'';
  }
  if(k==='selector'){
    var sm=src.match(/C_selectors\/([A-Za-z0-9_]+)\.json/);
    if(sm)return "openBookDrawer('"+sm[1]+"')";
    return "openStageStacked(4)";
  }
  if(k==='pool')return "openStageStacked(3)";
  if(k==='verdict'||k==='counting')return "openStageStacked(1)";
  if(k==='candidate')return "openStageStacked(3)";
  return '';
}
function askMatKindZH(k){
  return {journal:'运行日志',verdict:'打分产物',counting:'对照臂产物',
          selector:'策略判决',pool:'候选池',doc:'研报原文',
          candidate:'候选条目'}[k]||k||'材料';
}
function toggleAskLog(i){askLogOpen[i]=!askLogOpen[i];renderDrawers()}
function askLogDrawerBody(d){
  var rows=ensureAskLog();
  if(rows===null)return '<div class="empty-sm">正在读取追问记录……</div>';
  if(askLogErr)return '<div class="empty-sm">追问记录读不到：'+esc(askLogErr)+'</div>';
  if(!rows.length){
    return '<div class="empty-sm">还没有人问过这个系统任何问题。'
      +'在主题、策略或某一仓上点「问它当时怎么想」，问过的每一次都会记到这里，'
      +'连同当时交给模型的材料清单。</div>';
  }
  var head='<div class="quiet" style="margin-bottom:var(--space-3)">'
    +'共 <b class="num">'+fmtInt(rows.length)+'</b> 次追问 · 最近的在最上面 '
    +'<span class="gloss gm" title="每一条都记下了：问了什么、系统把哪些材料交给了模型、模型引用了其中哪几件、答的是什么。把「交给了什么」和「引用了什么」分开记，是为了让「答得对不对」和「有没有依据」可以分开检验——引用 2 件和只有 2 件可引用，是两回事。">ⓘ</span></div>';
  var list=rows.map(function(a,i){

    var st=a.context_stats||{};
    var sub='<div class="al-meta">'
      +'<span class="al-time mono">'+esc(hktFmt(a.ts,true))+'</span>'
      +'<span class="tag">'+esc(askLogSubject(a))+'</span>'
      +(a.model?'<span class="tag mono">'+esc(a.model)+'</span>':'')
      +'<span class="al-n">'+(prov.length?('交给 '+prov.length+' 件材料 · 引用 '+(a.cited||[]).length+' 件')
        :(st.n_materials?('交给 '+fmtInt(st.n_materials)+' 件材料 · 引用 '+(a.cited||[]).length+' 件'):''))
      +(st.n_docs?' · 含研报 '+fmtInt(st.n_docs)+' 篇':'')+'</span>'
      +'</div>';
    var body='';
    if(open){
      body='<div class="al-body">'
        +'<div class="al-sec">问</div><div class="al-q">'+esc(a.question||'')+'</div>'
        +'<div class="al-sec">答</div><div class="al-a">'+askAnswerHTML(a.answer||'',a.provenance||[])+'</div>';
      if(prov.length){
        body+='<div class="al-sec">它当时拿到的材料 · '+prov.length+' 件'
          +'<span class="gloss gm" title="这是问答发生时系统实际交给模型的全部材料。带「引用」的是模型在答案里指名用到的；其余是它可以看、但没有用上的。">ⓘ</span></div>'
          +'<div class="al-mats">'+prov.map(function(m){
            var go=askMatOpen(m);
            var isC=!!cited[m.id];
            return '<'+(go?'button type="button"':'div')+' class="al-mat'+(isC?' cited':'')+'"'
              +(go?' onclick="'+go+'"':'')
              +' title="'+esc(m.source||'')+(go?'　点击打开这件材料所在的那一层':'')+'">'
              +'<span class="mid mono">'+esc(m.id)+'</span>'
              +'<span class="mk">'+esc(askMatKindZH(m.kind))+'</span>'
              +'<span class="mt">'+esc(m.title||'')+'</span>'
              +(isC?'<span class="mc">引用</span>':'')
              +(go?'<span class="mg">›</span>':'')
              +'</'+(go?'button':'div')+'>';
          }).join('')+'</div>';
      }else{
        body+='<div class="al-sec">它当时拿到的材料</div>'
          +'<div class="card-note">这一条追问发生在系统开始记录材料清单之前，'
          +'只留下了引用编号（'+esc((a.cited||[]).join('、')||'无')+'）。'
          +'之后的追问都会完整记下交给模型的每一件材料。</div>';
      }

    }
    return '<div class="al-row'+(open?' open':'')+'">'
      +'<button type="button" class="al-head" onclick="toggleAskLog('+i+')">'
      +'<span class="al-chev">'+(open?'▾':'▸')+'</span>'
      +'<span class="al-main"><span class="al-qline">'+esc(String(a.question||'').slice(0,72))
      +(String(a.question||'').length>72?'…':'')+'</span>'+sub+'</span>'
      +'</button>'+body+'</div>';
  }).join('');
  return head+'<div class="al-list">'+list+'</div>'
    +epi('追问记录与运行产物一起打包在审计包的 06_追问记录.jsonl 里，可离线复核');
}

/* ══════════ 合并前的原始提案 ══════════
 * 候选池一个标的只有一行：合并后的论点 + 赔率中位数。那是「拿来挑」的正确单位，
 * 却正好把「这条想法是怎么来的」抹掉了——四种方法对同一个标的写了四套不同的
 * 理由，合并就是这些差异消失的地方。这一层把它们原样取回来，每条带上它当时
 * 引用的研报，点开就是那篇研报本身。 */
var PROPS={},propsErr={};
function openProposalsDrawer(code){pushDrawer({t:'props',p:bareCode(code)})}
function ensureProposals(code){
  if(PROPS[code]!==undefined)return PROPS[code];
  if(ensureProposals['_'+code])return null;
  ensureProposals['_'+code]=1;
  fetch('/api/proposals?instrument='+encodeURIComponent(code),{cache:'no-store'})
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
    .then(function(j){
      if(j.error){propsErr[code]=j.error;PROPS[code]={proposals:[],docs:{}}}
      else PROPS[code]=j;
      ensureProposals['_'+code]=0;renderDrawers();
    })
    .catch(function(e){propsErr[code]=(e&&e.message)||String(e);PROPS[code]={proposals:[],docs:{}};
      ensureProposals['_'+code]=0;renderDrawers()});
  return null;
}
function propOdds(x){
  var up=x.upside_pct,dn=x.downside_pct;
  var rr=(up!==null&&up!==undefined&&dn)?Math.abs(up/dn):null;
  return '<div class="pr-odds">'
    +'<span>上行 <b class="num up">'+fmtPct(up)+'</b></span>'
    +'<span>下行 <b class="num down">'+fmtPct(dn)+'</b></span>'
    +'<span>概率 <b class="num">'+fmtProb(x.p_up)+' / '+fmtProb(x.p_base)+' / '+fmtProb(x.p_down)+'</b>'
    +'<span class="gloss gm" title="上行 / 持平 / 下行三种情景的概率，由生成方法当时给出">ⓘ</span></span>'
    +(rr!==null?'<span>赚亏比 <b class="num">'+rr.toFixed(2)+'</b></span>':'')
    +(x.horizon_days?'<span>期限 '+fmtInt(x.horizon_days)+' 天</span>':'')
    +'</div>';
}
function proposalsDrawerBody(d){
  var code=String(d.p||'');
  var r=ensureProposals(code);
  if(r===null&&!propsErr[code])return '<div class="empty-sm">正在取回 '+esc(code)+' 合并前的原始提案……</div>';
  if(propsErr[code])return '<div class="empty-sm">取不到原始提案：'+esc(propsErr[code])+' '
    +glossMark('原始提案存在这次运行的生成产物里，需要后端现场读取。')+'</div>';
  var ps=(r&&r.proposals)||[],docs=(r&&r.docs)||{};
  if(!ps.length){
    return '<div class="empty-sm">本期生成产物里没有 '+esc(code)+' 的提案记录 '
      +glossMark('候选池里的这一行可能来自更早一期的持仓，而不是本期新写的想法。')+'</div>';
  }
  var byM={},order=[];
  ps.forEach(function(x){var m=x.method||'—';if(!byM[m]){byM[m]=[];order.push(m)}byM[m].push(x)});

/* ══════════ 问它当时怎么想 — 只依据封存材料的追问抽屉 ══════════ */
/* 追问必须按当期上下文回答，不得以当前推测替代。
   实现是检索+严格接地：/api/ask/context 只取那次运行封存的材料，
   /api/ask 的回答被限定在这些材料里，材料没有的它必须明说没有。 */
var ASKCTX={},ASKLOAD={},ASKH={},ASKS={};
/* 静态快照没有后端：/api/* 在 Pages 上返回的是 404 页面（HTML），
   直接 .json() 会炸成「Unexpected token '<'」——那是把「这里没有这个功能」
   说成了「接口坏了」。凡是要现场取材料的入口，先问这一句。 */
function isSnapshot(){return !!window.__STATIC__}
var SNAP_WHERE='要追问请在运行台打开：本机 http://localhost:8765/review，或飞书里那条隧道地址。';
function askSubjName(pstr){var i=pstr.indexOf(':');return i<0?pstr:pstr.slice(i+1)}
function askSubjKind(pstr){var i=pstr.indexOf(':');return i<0?'':pstr.slice(0,i)}
function askRunId(){return ((S||{}).weekly||{}).run_id||''}
function askKey(pstr){return askRunId()+'|'+pstr}
var ASK_KIND_ZH={topic:'主题',idea:'想法',selector:'选取策略'};
function ensureAskCtx(key,kind,id){
  if(ASKCTX[key])return ASKCTX[key];
  if(isSnapshot())return null;
  if(!ASKLOAD[key]){
    ASKLOAD[key]=true;
    fetch('/api/ask/context?run_id='+encodeURIComponent(askRunId())+'&kind='+encodeURIComponent(kind)+'&id='+encodeURIComponent(id),{cache:'no-store'})
      .then(function(r){return r.json().then(function(b){return {ok:r.ok,b:b}})})
      .then(function(res){
        if(res.b&&!res.b.error)ASKCTX[key]={c:res.b};
        else ASKCTX[key]={c:null,err:(res.b&&res.b.error)||('HTTP '+(res.ok?'格式不对':'错误'))};
      })
      .catch(function(e){ASKCTX[key]={c:null,err:e&&e.message?e.message:String(e)}})
      .then(function(){ASKLOAD[key]=false;renderDrawers()});
  }
  return null;
}
function askScrollBottom(){

/* ── 追问：全站唯一的入口组件 ─────────────────────────────────
   这套系统里最有价值的能力是「问它当时怎么想」——答案只从那次运行封存的
   材料里来，不用事后信息，不现编。但它此前只有 4 个入口，全部埋在下钻两层
   之后的抽屉里，而且同一个功能有三个名字（按钮「问它当时怎么想」、抽屉
   标题「问当时的它」、记录入口「会话记录」）。
   现在收敛为：一个组件、一个名字、一个图标、一个稳定的 element_id。
   凡是后端认的四类对象（主题 / 想法 / 选取策略 / 选主题这一步），
   在页面上出现的地方就该带上它。 */
var ASK_ICON='<svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true" style="flex:none">'
  +'<path d="M1.6 2.2h8.8v5.6H5.2L2.8 9.9V7.8H1.6z" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/>'
  +'<path d="M4.7 4.1a1.3 1.3 0 0 1 2.4.6c0 .9-1.2.9-1.2 1.6" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/>'
  +'<circle cx="5.9" cy="7" r=".5" fill="currentColor"/></svg>';
/* 默认文案随对象类型走，但一律以「问它为什么」开头：形状与图标全站统一，
   话术贴着读者此刻正看着的那个东西说，不让他自己去翻译「它」是谁。 */
var ASK_LABEL={
  topic:'问它为什么选它',
  idea:'问它为什么选它',
  selector:'问它为什么这么选',
  selection:'问它为什么选这几个主题'
};
/* 「1284.58s」要读者自己心算。秒只在真的只有几十秒时才是好单位。 */
function fmtDur(sec){
  var v=Number(sec);
  if(!isFinite(v)||v<0)return '—';
  if(v<60)return v.toFixed(1)+' 秒';
  var m=Math.floor(v/60),r=Math.round(v%60);
  if(m<60)return m+' 分 '+r+' 秒';
  return Math.floor(m/60)+' 小时 '+(m%60)+' 分';
}
function askBtn(kind,id,opts){

  var snap=(typeof isSnapshot==='function')&&isSnapshot();
  return '<button type="button" class="ask-btn'+(opts.cls?' '+opts.cls:'')+(snap?' off':'')+'"'
    +' data-el="ask.'+esc(kind)+'"'
    +' aria-label="'+esc(label+'：'+String(id))+'"'
    +' title="'+esc(snap
        ? '静态快照答不了追问——它要现场取那次运行封存的研报原文与打分记录。点开看在哪能问。'
        : label+'——只依据本次运行当时封存的材料作答，不使用事后信息')+'"'
    +' onclick="'+(opts.stop?'event.stopPropagation();':'')+'openAskDrawer(\''+jss(kind)+'\',\''+jss(String(id))+'\')">'
    +ASK_ICON+'<span>'+esc(label)+'</span></button>';

/* 可追问对象清单：全局入口据此列出「能问什么」。四类都来自后端
   SUBJECT_KINDS，前端不自造类型。 */
function askSubjects(){
  var out=[],w=(S||{}).weekly||{};
  out.push({kind:'selection',id:'topics',group:'这一步',
            label:'本期为什么选这几个主题',sub:'选主题这一步的完整依据'});
  topicChosen('hgep').forEach(function(t){
    out.push({kind:'topic',id:t,group:'宏观主题',
              label:topicLabel(t)||t,sub:'为什么它入选、依据哪几篇研报'});
  });
  currentBooks().forEach(function(b){
    var m=selMetaOf(b.selector);
    out.push({kind:'selector',id:b.selector,group:'选取策略',
              label:m[1],sub:m[3]||'为什么这样选'});
  });
  /* 持仓按共识度排：被越多账本独立选中的标的越值得先问一句为什么。
     字母序不携带信息。 */
  var held={};
  (aggBooks()||{books:[]}).books.forEach(function(b){
    (b.open_positions||[]).forEach(function(pos){
      var c=bareCode(pos.code);
      if(!held[c])held[c]={n:0,theme:pos.theme_id||''};
      held[c].n++;
    });
  });
  var nb=currentBooks().length||1;
  Object.keys(held).sort(function(a,b){
    return held[b].n-held[a].n || (a<b?-1:1);
  }).forEach(function(c){
    out.push({kind:'idea',id:'pool:'+c,group:'持仓',label:c,
              sub:held[c].n+'/'+nb+' 个账本选中'
                 +(held[c].theme?' · '+(topicLabel(held[c].theme)||held[c].theme):'')});
  });
  return out;
}
function askSend(pstr,q){
  q=(q||'').trim();if(!q)return;
  var key=askKey(pstr),st=ASKS[key]=ASKS[key]||{};
  if(st.busy)return;
  st.busy=true;st.pending=q;st.draft='';
  renderDrawers();askScrollBottom();
  var hist=(ASKH[key]||[]).filter(function(h){return h.a}).map(function(h){return {q:h.q,a:h.a}});
  fetch('/api/ask',{method:'POST',cache:'no-store',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({run_id:askRunId(),kind:askSubjKind(pstr),id:askSubjName(pstr),question:q,history:hist})})
    .then(function(r){return r.json().then(function(b){return {ok:r.ok,b:b}})})
    .then(function(res){
      var h=ASKH[key]=ASKH[key]||[];
      if(res.b&&res.b.answer)h.push({q:q,a:res.b.answer,cited:res.b.cited||[],model:res.b.model,via:res.b.answered_by});
      else h.push({q:q,err:(res.b&&res.b.error)||('HTTP 错误（'+(res.ok?'响应格式不对':'请求失败')+'）')});
    })
    .catch(function(e){(ASKH[key]=ASKH[key]||[]).push({q:q,err:e&&e.message?e.message:String(e)})})
    .then(function(){st.busy=false;st.pending=null;renderDrawers();askScrollBottom()});
}
function askSendFromInput(pstr){

/* ── 整行可点的键盘补位 ──────────────────────────────────────────────
 * 页面上绝大多数可点的东西都是真的 <button>——但有三类做不成：整行可点的表格行、
 * 研报行、可排序表头。它们只有 onclick / addEventListener，Tab 停不下来、回车也
 * 没反应。而「打开这一仓」「展开这篇研报」「按上行排序」在别处没有等价入口，
 * 也就是说纯键盘的人到不了。
 * 不去改每一个生成器（它们散在十几处），统一在渲染之后补上：可聚焦 + 回车/空格
 * 触发 + 同一套焦点环。 */
var ROW_CLICKABLE='.doc-row[onclick],.cal-main.expandable[onclick],tr.expandable[onclick],#candTable th.sortable';
function armRowKeys(){
  var list=document.querySelectorAll(ROW_CLICKABLE);
  for(var i=0;i<list.length;i++){
    var el=list[i];
    if(el.hasAttribute('tabindex'))continue;
    el.setAttribute('tabindex','0');
    /* <tr> 和 <th> 不加 role=button：它们得继续被读成表格行、表头，
       否则读屏就报不出行列关系。div 就没有这层身份，加上才说得清它可以按。 */
    if(el.tagName==='DIV')el.setAttribute('role','button');
  }
}
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter'&&e.key!==' ')return;
  var t=e.target;
  if(!t||!t.matches||!t.matches(ROW_CLICKABLE))return;
  e.preventDefault();
  t.click();
});
if(window.MutationObserver){
  var _armQueued=false;
  new MutationObserver(function(){
    if(_armQueued)return;
    _armQueued=true;
    requestAnimationFrame(function(){_armQueued=false;armRowKeys()});
  }).observe(document.body,{childList:true,subtree:true});
  armRowKeys();
}

function plainRunError(e){
  if(!e)return null;

  if(e.indexOf('没有任何语料')>=0)return '当期语料缺失，无法运行，记为失败。';
  if(e.indexOf('killed')>=0||e.indexOf('hung')>=0||e.indexOf('timeout')>=0)return '运行中途挂起，由超时保护终止。';
  if(e.indexOf('wisburg')>=0&&e.indexOf('0 行')>=0)return '研报源本期返回 0 条，按异常处理。';
  return e;
}

function calDrawerBody(){
  var runs=S.runs||[],gaps=S.gaps||[],feeds=S.feeds||[];
  var curPeriod=(S.schedule||{}).current_period;
  var periods={};
  runs.forEach(function(r){
    if(r.kind!=='weekly'&&r.kind!=='weekly_missed')return;
    if(!periods[r.as_of])periods[r.as_of]={as_of:r.as_of,attempts:[],missed:false};
    if(r.kind==='weekly_missed')periods[r.as_of].missed=true;
    else periods[r.as_of].attempts.push(r);
  });
  gaps.forEach(function(g){
    if(!periods[g])periods[g]={as_of:g,attempts:[],missed:true};
    else periods[g].missed=true;
  });
  /* 上一次成功的周跑（weekly 摘要），runs 表可能已滚出 */
  var wsum=S.weekly||{};
  if(wsum.as_of&&!periods[wsum.as_of]){
    periods[wsum.as_of]={as_of:wsum.as_of,attempts:[],missed:false,
      summaryOk:!!wsum.ok,summaryCalls:wsum.calls,summaryRunId:wsum.run_id};
  }
  /* 本期结果只存在于心跳 outcomes 里（失败的 weekly 尝试不写 runs 表）时，也要在周历里出现 */
  var wkOut=hbOutcome('weekly');
  if(wkOut&&wkOut.period&&!periods[wkOut.period]){
    periods[wkOut.period]={as_of:wkOut.period,attempts:[],missed:false,hbAction:wkOut.action};
  }else if(wkOut&&wkOut.period&&periods[wkOut.period]&&!periods[wkOut.period].attempts.length){
    periods[wkOut.period].hbAction=wkOut.action;
  }
  /* 盯市一行置顶 */
  var todayStr=(function(){var p=hktParts();return p.y+'-'+String(p.m).padStart(2,'0')+'-'+String(p.d).padStart(2,'0')})();
  var mons=runs.filter(function(r){return r.kind==='monitor'});
  var monsToday=mons.filter(function(r){return (r.started_at||'').length&&hktDateOf(r.started_at)===todayStr});
  var latestMon=mons[0]||null;
  var monLine='';
  if(mons.length){
    var monBad=latestMon&&!latestMon.ok;
    monLine='<div class="cal-row"><div class="cal-main" style="cursor:default">'
      +'<span class="cal-date num">盯市</span>'
      +(monBad?badge('warning','有告警'):badge('success','正常'))
      +'<span class="cal-text">当日盯市 '+monsToday.length+' 次 · 最近 '+hktFmt(latestMon.started_at,false)
      +(monBad?'　·　'+esc(plainRunError(latestMon.error)||''):'')+'</span>'
      +'<button type="button" class="exp-btn" style="margin-left:auto;flex:none" onclick="openRunLogStacked(\''+jss(latestMon.run_id)+'\')">日志 ›</button>'
      +'</div></div>';
  }
  var plist=Object.keys(periods).sort().reverse().map(function(k){return periods[k]});
  var calRows=plist.map(function(p,pi){
    var label=p.as_of.slice(5);
    var isCur=p.as_of===curPeriod;
    var att=p.attempts.slice().sort(function(a,b){return String(b.started_at||'').localeCompare(String(a.started_at||''))});
    var okRun=att.find(function(r){return r.ok});
    var flying=att.find(function(r){return !r.ended_at});
    var state,chip;
    if(p.missed){chip=badge('error','永久缺失');state='该期已错过且不补跑：当期研报无法按原深度取回，补跑将引入前视。'}
    else if(okRun){chip=badge('success','完成');state='运行完成，模型调用 '+fmtInt(okRun.calls)+' 次。'}
    else if(p.summaryOk){chip=badge('success','完成');state='运行完成'+(p.summaryCalls?'，模型调用 '+fmtInt(p.summaryCalls)+' 次':'')+'（取自周跑摘要，明细已超出近 30 条运行记录窗口）。'}
    else if(p.hbAction==='failed'){chip=badge('error','失败');state='心跳记录：本期周跑失败，runs 表无该次尝试明细。'}
    else if(p.hbAction){chip=badge('neutral',esc(p.hbAction));state='心跳记录结果：'+esc(p.hbAction)+'。'}
    else if(flying){
      var mins=flying.started_at?Math.max(0,Math.round((Date.now()-new Date(flying.started_at).getTime())/60000)):null;
      chip=badge('info','进行中',true);
      state='选仓进行中'+(mins!==null?'，已运行 '+mins+' 分钟':'')+(att.length>1?'（第 '+att.length+' 次尝试，上次：'+(plainRunError(att[att.length-1].error)||'失败')+'）':'')+'。';
    }
    else{chip=badge('error','失败');state=plainRunError(att[0]&&att[0].error)||'运行失败，原因见展开。'}
    /* 展开:运行尝试 + 该期数据源 + 错误原文 */
    var attHtml=att.length?att.map(function(r){
      return '<div style="padding:4px 0">'
        +'<span class="mono" style="color:var(--color-text-tertiary)">'+esc(r.run_id)+'</span>　'
        +hktFmt(r.started_at,true)+' → '+(r.ended_at?hktFmt(r.ended_at,true):'仍在跑')
        +' · 调用 '+fmtInt(r.calls)+' 次'
        +'　<button type="button" class="exp-btn" onclick="event.stopPropagation();openRunLogStacked(\''+jss(r.run_id)+'\')">日志 ›</button>'
        +(r.error?'<div style="color:var(--color-text-tertiary);font-size:12px;line-height:18px">错误原文：'+esc(r.error)+'</div>':'')
        +'</div>';
    }).join(''):(p.summaryRunId
      ?'<div class="quiet">明细运行记录已超出近 30 条窗口，journal 快照仍可读：<button type="button" class="exp-btn" onclick="event.stopPropagation();openRunLogStacked(\''+jss(p.summaryRunId)+'\')">run '+esc(p.summaryRunId)+' 的日志 ›</button></div>'
      :'<div class="quiet">该期无运行记录。</div>');
    var pfSeen={};
    var pf=feeds.filter(function(f){
      if(f.as_of!==p.as_of)return false;
      var k=f.feed+'|'+f.n_rows+'|'+f.ok;
      if(pfSeen[k])return false;pfSeen[k]=1;return true;
    });
    var pfHtml=pf.length
      ?'<div style="margin-top:6px;padding-top:6px;border-top:1px solid var(--color-border-subtle)">该期数据源：'
        +pf.map(function(f){
          var nm=(FEED_NAMES[f.feed]||[f.feed])[0];
          return '<span style="white-space:nowrap">'+esc(nm)+' <span class="num">'+fmtInt(f.n_rows)+'</span> 条'
            +(f.ok?'':'<span style="color:var(--color-feedback-error-text)">（异常：'+esc(plainFeedError(f.error)||'')+'）</span>')+'</span>';
        }).join('　·　')
      +'</div>':'';
    return '<div class="cal-row">'
      +'<div class="cal-main expandable" onclick="toggleCal('+pi+')" title="展开本期完整记录">'
        +'<span class="cal-date num">'+esc(label)+(isCur?'<span class="tag tag-brand" style="margin-left:6px">本周</span>':'')+'</span>'
        +chip
        +'<span class="cal-text">'+esc(state)+'</span>'
        +(function(){var rid=(okRun&&okRun.run_id)||p.summaryRunId;return rid?'<button type="button" class="exp-btn" style="margin-left:auto;flex:none" onclick="event.stopPropagation();openRunLogStacked(\''+jss(rid)+'\')">日志 ›</button><span class="exp-btn" style="flex:none">详情 ›</span>':'<span class="exp-btn" style="margin-left:auto;flex:none">详情 ›</span>'})()
      +'</div>'
      +'<div class="cal-detail" data-cal="'+pi+'" style="display:none">'+attHtml+pfHtml+'</div>'
    +'</div>';
  }).join('');

  /* ⓘ 必须挂在一个锚点上：孤零零一个图标浮在区块开头，读者不知道它在解释什么。
     标签留在外面，说明全部收进 ⓘ。 */
  return '<div class="card-note" style="margin-bottom:var(--space-3)">按期记录'
    +'<span class="gloss gm" title="每期一行，展开可见该期运行、数据与错误。时间为 HKT。">ⓘ</span></div>'
    +monLine
    +(calRows||'<div class="empty-sm">暂无周跑记录</div>');
}

/* ── 可信度与局限抽屉：未验证假设 + 已修复缺陷 + 历史回测 ── */
/* 「已知局限」原本是一个叫「可信度与局限」的抽屉，挂着 8 个入口、4 种文案
   （可信度与局限 › / 可信度与局限 → / 尚不排名的依据 ⓘ / 完整回测 ›），
   读者会以为点进去是四个不同的地方。它讲的是「凭什么信」，本来就属于证据
   这一页，不该是抽屉——抽屉留给某一个具体对象的详情。 */
/* 归因（主题层）：每个宏观主题都挂着一个可交易的指示 ETF，所以每笔持仓
   都有一个可定价的反事实——在完全相同的持有窗口里改持该主题的 ETF。
   差额就是「挑了具体标的」在「认出主题」之上多买到的东西。
   关键在对照臂：buy_all 不做任何挑选，仍然跑赢指示标的，各臂的超额都含着
   这同一份，所以挑选本身只能记在 vs 对照那一列。
   措辞严格跟随服务端 note：这是四层里的一层，市场 beta 层和「风控 vs
   买入持有」那层都还没做。不写清楚，它会被当成「归因做完了」。 */
function attributionCard(){
  var a=(((S||{}).backtest||{}).summary||{}).attribution_theme_layer;
  if(!a||!a.arms)return '';
  var arms=a.arms, ctl=a.control, c=arms[ctl];
  var names=Object.keys(arms);
  /* 判定必须取「相对对照」那一列自己的，不能借用顶层 verdict——顶层说的是
     「相对指示标的」，把它挂在另一列旁边就是把一个判定放在它并不适用的
     数字上。我先前正是这么写的，界面上出现过一句「目前只有 X、Y 为正」。

     而且这一列是三态，不是两态：样本够看见预注册的优势、优势却没出现
     （no_edge_detected），和样本还不够（underpowered），是两个相反的结论。
     把前者说成「数据还不够」，是往人们希望的方向说假话。 */
  var byCol=function(v){return names.filter(function(k){
    return k!==ctl && arms[k].verdict_over_control===v; })};
  var noEdge=byCol('no_edge_detected'), under=byCol('underpowered');
  var beat=byCol('not_ruled_out').filter(function(k){
    return arms[k].excess_over_control_pct>0;
  }).sort(function(x,y){return arms[y].excess_over_control_pct-arms[x].excess_over_control_pct});
  var needs=under.map(function(k){return arms[k].n_needed_for_edge}).filter(function(x){return x});
  var haves=under.map(function(k){return arms[k].n}).filter(function(x){return x});
  var rng=function(a){return a.length?(Math.min.apply(null,a)===Math.max.apply(null,a)
      ? fmtInt(a[0]) : fmtInt(Math.min.apply(null,a))+'–'+fmtInt(Math.max.apply(null,a))):''};
  var lead='';
  if(c){
    lead='<b>'+esc(selMetaOf(ctl)[1]||ctl)+'</b>（把候选池里每一条都买下、不做任何挑选）'
      +'相对主题指示标的多出 <span class="num '+pctCls(c.mean_excess_pct)+'">'
      +fmtGapPp(c.mean_excess_pct,{signed:true})+'</span>。'
      +'各选取策略的超额都含着这一份，所以「挑选」本身只能看它相对这个对照还多出多少。'
      +(beat.length
         ? '目前 <b>'+beat.map(function(k){return esc(selMetaOf(k)[1]||k)}).join('、')
           +'</b> 的优势尚未被排除。' : '')
      +(noEdge.length
         ? '其中 <b>'+noEdge.length+'</b> 个臂的样本已足以检出预注册的优势，'
           +'<b>而优势没有出现</b>——这是「没看出优势」，不是「还看不出来」。' : '')
      +(under.length
         ? '其余 '+under.length+' 个样本仍不足，还需 '+rng(needs)+' 笔已计价持仓'
           +(haves.length?'（现有 '+rng(haves)+' 笔）':'')+'。' : '');
  }
  var rows=names.sort(function(x,y){
      var ax=arms[x].excess_over_control_pct,ay=arms[y].excess_over_control_pct;
      return (ay===null||ay===undefined?-1e9:ay)-(ax===null||ax===undefined?-1e9:ax);
    }).map(function(k){
      var v=arms[k],isCtl=(k===ctl);
      return '<tr'+(isCtl?' style="background:var(--color-surface-subtle)"':'')+'>'
        +'<td class="primary">'+esc(selMetaOf(k)[1]||k)+(isCtl?' '+badge('neutral','对照'):'')+'</td>'
        +'<td class="r num '+pctCls(v.mean_held_pct)+'">'+fmtPct(v.mean_held_pct)+'</td>'
        +'<td class="r num '+pctCls(v.mean_indicator_pct)+'">'+fmtPct(v.mean_indicator_pct)+'</td>'
        +'<td class="r num '+pctCls(v.mean_excess_pct)+'">'+fmtPct(v.mean_excess_pct)+'</td>'
        +'<td class="r num '+pctCls(v.excess_over_control_pct)+'">'
          +(isCtl?'<span class="card-note">基准</span>'
                 :(v.excess_over_control_pct===null||v.excess_over_control_pct===undefined
                    ?'—':fmtPct(v.excess_over_control_pct)))+'</td>'
        +'<td class="r num">'+fmtInt(v.n)+'</td>'
        +'<td title="这一列的判定针对「相对对照」，也就是挑选本身的贡献">'
          +(isCtl?''
            :(v.verdict_over_control==='underpowered'
                ?'<span title="'+esc('还需约 '+fmtInt(v.n_needed_for_edge||0)+' 笔已计价持仓才够判断，现有 '+fmtInt(v.n||0)+' 笔')+'">'
                  +badge('neutral','样本不足 · 还需 '+fmtInt(v.n_needed_for_edge||0)+' 笔')+'</span>'
              :(v.verdict_over_control==='no_edge_detected'
                ?'<span title="'+esc('样本已足以检出预注册的优势（需约 '+fmtInt(v.n_needed_for_edge||0)+' 笔，现有 '+fmtInt(v.n||0)+' 笔），而优势没有出现。这是一个结论，不是数据缺口。')+'">'
                  +badge('neutral','没看出优势')+'</span>'
                :(v.verdict_over_control?badge('warning','未被排除'):''))))+'</td>'
      +'</tr>';
    }).join('');
  return '<div class="card section">'
    +'<div class="card-title-row"><h2 class="card-title" style="margin-bottom:0">价值出在哪一段</h2>'
    +'<span class="card-note">每笔持仓 vs 同窗口改持该主题指示 ETF · '+fmtInt(a.n_positions||0)+' 笔</span></div>'
    +(lead?'<div style="font:400 15px/23px var(--font-sans);color:var(--color-text-primary);margin:var(--space-2) 0 var(--space-3)">'+lead+'</div>':'')
    /* 这一句不折叠：它是这张卡最容易被误读的地方。 */
    +'<div class="card-note" style="color:var(--color-feedback-warning-text)">'
      +'这是四层归因里的<b>一层</b>——市场 beta 层、以及区分风控与买入持有的那层都还没有做，'
      +'不能据此说归因已经完成。'+(under.length?'另有 '+under.length+' 个臂在这一层上样本不足。':'')
      +'<span class="gloss gm" title="'+esc(a.note||'')+'">ⓘ</span></div>'
    +foldBlock('evidence.attribution.detail','逐臂明细','持有 · 主题指示 · 超额 · 相对对照',
      '<div class="table-wrap"><table><thead><tr>'
        +'<th>选取策略</th><th class="r">实际持有</th><th class="r" title="同一持有窗口内改持该主题的指示 ETF">主题指示</th>'
        +'<th class="r" title="实际持有减去主题指示：挑了具体标的比只认出主题多买到的部分">超额</th>'
        +'<th class="r" title="再减去对照臂的超额：这一列才是「挑选」本身的贡献">相对对照</th>'
        +'<th class="r">笔数</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>'
      +(a.unmatched_positions?'<div class="card-note" style="margin-top:var(--space-2)">'
        +fmtInt(a.unmatched_positions)+' 笔持仓没有匹配到主题指示标的，未计入。</div>':''))
  +'</div>';
}
function limitsCard(){
  var assum=S.assumptions||[],fixes=S.fixes||[];
  if(!assum.length&&!fixes.length)return '';
  var doneN=fixes.filter(function(f){return (f.state||'').indexOf('✅')>=0}).length;
  return '<div class="card section">'
    +'<div class="card-title-row"><h2 class="card-title" style="margin-bottom:0">已知局限</h2>'
    +'<span class="card-note gloss gm" title="这套方法目前哪些前提还没被验证，以及已经发现并修掉的缺陷">ⓘ</span></div>'
    +'<div style="font:400 15px/23px var(--font-sans);color:var(--color-text-primary);margin:var(--space-2) 0 var(--space-3)">'
      +assum.length+' 条前提尚未验证；'+fixes.length+' 个已发现的缺陷里修好了 '+doneN+' 个。</div>'
    +foldBlock('evidence.limits.detail','逐条明细','未验证假设 · 已修复缺陷',trustBody())
  +'</div>';
}
function trustDrawerBody(){
  var assum=S.assumptions||[],fixes=S.fixes||[];
  var aRows=assum.map(function(a,ai){
    var qa=assumQA(a.claim||'');
    var q=qa?qa[0]:a.claim;
    var ans=a.status||(qa?qa[1]:'—');
    var big=/最大风险|地基/.test(a.nature||'');
    return '<div class="cal-row">'
      +'<div class="cal-main expandable" onclick="toggleQa('+ai+')" title="展开原始记录">'
        +(big?badge('warning','核心假设'):badge('neutral','待验证'))
        +'<span class="cal-text"><b style="color:var(--color-text-primary);font-weight:500">'+esc(q)+'</b><br>'+esc(ans)+'</span>'
        +'<span class="exp-btn" style="margin-left:auto;flex:none">›</span>'
      +'</div>'
      +'<div class="cal-detail" data-qa="'+ai+'" style="display:none;padding-left:0">'
        +'<div style="font:400 12px/18px var(--font-sans);color:var(--color-text-tertiary)">原始记录：'+esc(a.claim)+' · '+esc(a.nature||'')+' · '+esc(a.status||'')+'</div>'
      +'</div>'
    +'</div>';
  }).join('');
  var fRows=fixes.map(function(f,fi){
    var st=f.state||'';var chip;
    if(st.indexOf('✅')>=0)chip=badge('success','已修');
    else if(st.indexOf('🟡')>=0)chip=badge('warning',st.replace(/🟡\s*/,'')||'部分');
    else if(st.indexOf('❌')>=0)chip=badge('error','未开始');
    else chip=badge('neutral',st||'—');
    return '<div class="cal-row">'
      +'<div class="cal-main expandable" onclick="toggleFix('+fi+')" title="展开修复方式">'
        +chip
        +'<span class="cal-text">'+esc(plainFix(f.issue||''))+'</span>'
        +'<span class="exp-btn" style="margin-left:auto;flex:none">›</span>'
      +'</div>'
      +'<div class="cal-detail" data-fix="'+fi+'" style="display:none;padding-left:0">'
        +'<div style="font:400 12px/18px var(--font-sans);color:var(--color-text-tertiary)">原始记录：'+esc(f.issue)+'　·　修法：'+esc(f.how||'—')+'</div>'
      +'</div>'
    +'</div>';
  }).join('');
  var doneN=fixes.filter(function(f){return (f.state||'').indexOf('✅')>=0}).length;
  return ''
    +'<div class="trust-grid">'
      +'<div><h3 class="trust-h">未验证假设 · '+assum.length+'</h3>'+(aRows||'<div class="empty-sm">暂无</div>')+'</div>'
      +'<div><h3 class="trust-h">已修复缺陷 · '+doneN+' / '+fixes.length+'</h3>'+(fRows||'<div class="empty-sm">暂无</div>')+'</div>'
    +'</div>';
}
/* 抽屉与页内段共用同一份正文，两处不会各自演化。 */
function trustBody(){return trustDrawerBody()}
function hktDateOf(iso){
  var d=new Date(iso);if(isNaN(d))return '';
  return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Hong_Kong',year:'numeric',month:'2-digit',day:'2-digit'}).format(d);
}
function toggleCal(i){var el=document.querySelector('.cal-detail[data-cal="'+i+'"]');if(el)el.style.display=el.style.display==='none'?'':'none'}
function toggleQa(i){var el=document.querySelector('.cal-detail[data-qa="'+i+'"]');if(el)el.style.display=el.style.display==='none'?'':'none'}
function toggleFix(i){var el=document.querySelector('.cal-detail[data-fix="'+i+'"]');if(el)el.style.display=el.style.display==='none'?'':'none'}

/* ── 全局帮助滑出面板:Routine 手册 / 名词表 ── */
var helpOpen=false, helpTab='what';
function toggleHelp(){helpOpen=!helpOpen;renderHelp()}
function setHelpTab(t){helpTab=t;renderHelp()}
function renderHelp(){
  var root=$('helpRoot');
  if(!root)return;
  if(!helpOpen){root.innerHTML='';return}
  root.innerHTML='<div class="toc-scrim" onclick="toggleHelp()"></div>'
    +'<div class="help-panel" role="dialog" aria-label="帮助">'
    +'<div class="toc-h"><span>帮助</span><button type="button" class="copy-btn" onclick="toggleHelp()" aria-label="关闭帮助">关闭</button></div>'
    +'<div class="help-tabs">'
      +'<button type="button" class="help-tab'+(helpTab==='what'?' on':'')+'" onclick="setHelpTab(\'what\')">这是什么</button>'
      +'<button type="button" class="help-tab'+(helpTab==='gloss'?' on':'')+'" onclick="setHelpTab(\'gloss\')">名词表</button>'

function copyCmd(btn,text){
  function done(){btn.textContent='已复制';btn.classList.add('copied');
    setTimeout(function(){btn.textContent='复制';btn.classList.remove('copied')},1600)}
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done,function(){fallbackCopy(text);done()});
  }else{fallbackCopy(text);done()}
}
function fallbackCopy(text){
  var ta=document.createElement('textarea');
  ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy')}catch(e){}
  document.body.removeChild(ta);
}

/* ── 语料浏览器:每一条研报都能溯源 ─────────────────────────── */
var corpusOpen=false,corpusCache={},corpusQuery='',corpusTier=null,corpusAsOf=null,corpusLoading=false,corpusError=null;
var docReg={},docCache={};
function openCorpus(asOf){
  corpusOpen=true;corpusAsOf=asOf;corpusQuery='';corpusTier=null;corpusError=null;
  if(isSnapshot()&&!corpusCache[asOf]){
    corpusLoading=false;corpusError='静态快照不带语料清单——清单要现场查库。'+SNAP_WHERE;
    renderCorpus();return;
  }
  if(!corpusCache[asOf]){
    corpusLoading=true;renderCorpus();
    fetch('/api/corpus?as_of='+encodeURIComponent(asOf),{cache:'no-store'}).then(function(r){
      if(!r.ok)throw new Error('HTTP '+r.status);return r.json();
    }).then(function(j){corpusCache[asOf]=j;corpusLoading=false;renderCorpus()})
    .catch(function(e){corpusLoading=false;corpusError=e&&e.message?e.message:String(e);renderCorpus()});
  }else renderCorpus();
}
function closeCorpus(){corpusOpen=false;renderCorpus()}
function setCorpusTier(t){corpusTier=t;renderCorpus()}
function corpusInput(el){corpusQuery=el.value;renderCorpusList()}
function corpusFiltered(){
  var d=corpusCache[corpusAsOf];if(!d)return [];
  var q=corpusQuery.trim().toLowerCase();
  return (d.docs||[]).filter(function(x){
    if(corpusTier&&x.tier!==corpusTier)return false;
    if(!q)return true;
    return ((x.title||'')+' '+(x.institution||'')).toLowerCase().indexOf(q)>=0;
  });
}
function renderCorpus(){
  var root=$('corpusRoot');if(!root)return;
  if(!corpusOpen){root.innerHTML='';return}
  var d=corpusCache[corpusAsOf];
  var body;
  if(corpusLoading){
    body='<div class="quiet" style="padding:var(--space-6) 0">正在读取语料清单……</div>';
  }else if(corpusError){
    body=isSnapshot()
      ?'<div class="quiet" style="padding:var(--space-6) 0">'+esc(corpusError)+'</div>'
      :'<div class="quiet" style="padding:var(--space-6) 0">取不到语料清单——服务没响应（'+esc(corpusError)+'）。'
        +'<button type="button" class="exp-btn" onclick="openCorpus(\''+jss(corpusAsOf)+'\')">再试一次</button></div>';
  }else if(d&&(d.docs||[]).length){
    var counts={1:0,2:0,3:0};(d.docs||[]).forEach(function(x){counts[x.tier]=(counts[x.tier]||0)+1});
    /* 服务端会把认不出的期次退回到最近一期。退回本身是对的，但不说出来，
     * 读者会以为自己看的是点进来的那一期。 */
    body=(d.as_of_invalid?'<div class="card-note" style="color:var(--color-feedback-warning-text);margin-bottom:6px">'
        +'请求的期次「'+esc(d.as_of_invalid)+'」认不出来，下面显示的是最近一期（'+esc(d.as_of||'')+'）。</div>':'')
      +'<input type="search" class="corpus-search" placeholder="搜标题或机构……" value="'+esc(corpusQuery)+'" oninput="corpusInput(this)" aria-label="搜索语料">'
      +'<div class="tier-chips">'
      +[[null,'全部 '+fmtInt((d.docs||[]).length)],[1,'T1 一手 '+fmtInt(counts[1]||0)],[2,'T2 投行 '+fmtInt(counts[2]||0)],[3,'T3 资讯 '+fmtInt(counts[3]||0)]]
        .map(function(c){return '<button type="button" class="tier-chip'+(corpusTier===c[0]?' on':'')+'" onclick="setCorpusTier('+(c[0]===null?'null':c[0])+')">'+c[1]+'</button>'}).join('')
      +'</div><div id="corpusList" class="scroll-thin" style="flex:1;overflow-y:auto;min-height:0"></div>';
  }else{
    body='<div class="quiet" style="padding:var(--space-6) 0">本期暂无语料。</div>';
  }
  var win=(d&&d.window&&d.window.length)?('（窗口 '+esc(d.window[d.window.length-1].slice(5))+' ~ '+esc(d.window[0].slice(5))+'）'):'';
  root.innerHTML='<div class="toc-scrim" onclick="closeCorpus()"></div>'
    +'<div class="help-panel corpus-panel" role="dialog" aria-label="语料浏览器">'
    /* 标题写服务端实际返回的期次，不是请求的那个——否则退回之后标题还在骗人 */
    +'<div class="toc-h"><span>'+esc((d&&d.as_of)||corpusAsOf||'')+' 期语料'+(d?' · '+fmtInt(d.n)+' 条'+win:'')+'</span>'
    +'<button type="button" class="copy-btn" onclick="closeCorpus()">关闭</button></div>'
    +body+'</div>';
  if(d&&!corpusLoading&&!corpusError)renderCorpusList();
}
function renderCorpusList(){
  var el=$('corpusList');if(!el)return;
  var arr=corpusFiltered();
  var cap=300,shown=arr.slice(0,cap);
  el.innerHTML=(shown.map(function(x,i){return docRowHTML(x,'cb'+i)}).join('')
      ||'<div class="quiet" style="padding:var(--space-4) 0">没有匹配——换个词试试。</div>')
    +(arr.length>cap?'<div class="quiet" style="padding:8px 0">只显示前 '+cap+' 条（共 '+fmtInt(arr.length)+' 条匹配）——继续输入缩小范围</div>':'');
}
/* 共用文档组件:一份渲染,两个入口(语料浏览器 / 主题证据清单) */
function docRowHTML(d,uid){
  docReg[uid]=d;
  return '<div class="doc-row" onclick="toggleDoc(\''+uid+'\')" title="展开摘要与凭据">'
    +'<span class="num" style="font-family:var(--font-mono);color:var(--color-text-tertiary);flex:none">'+esc((d.published_d||'').slice(5))+'</span>'
    +tierTag(d.tier)
    /* 机构名前原本是一个全角空格 U+3000。它不是 CSS 眼里的可折叠空白，所以换行时
       不会被吞掉——标题正好断在它前面时，那一格宽的字符就挂在行外，整行溢出 12px
       （12px 字号 = 12px 全角空格，数字对得上）。改成真正的间距。 */
    +'<span class="doc-title">'+esc(d.title||'')
    +(d.institution?'<span style="color:var(--color-text-tertiary);margin-left:8px">'+esc(d.institution)+'</span>':'')+'</span>'
    +'</div><div class="doc-detail" id="docd-'+uid+'" style="display:none"></div>';
}
function toggleDoc(uid){
  var el=$('docd-'+uid);if(!el)return;
  if(el.style.display!=='none'){el.style.display='none';return}
  el.style.display='';
  if(el.getAttribute('data-loaded'))return;
  var d=docReg[uid]||{};
  if(d.retrieval!==undefined||d.sha!==undefined){
    el.innerHTML=docDetailHTML(d,uid);el.setAttribute('data-loaded','1');
  }else{
    el.innerHTML='<span class="quiet">正在取这篇的档案……</span>';
    fetchDoc(d.doc_id).then(function(j){
      docReg[uid]=j;el.innerHTML=docDetailHTML(j,uid);el.setAttribute('data-loaded','1');
    }).catch(function(e){
      el.innerHTML='<span class="quiet">'+(isSnapshot()
        ?'静态快照不带研报档案——原文要现场查库。'+esc(SNAP_WHERE)
        :'档案读取失败，服务无响应。')+'</span>';
    });
  }
}
function fetchDoc(id){
  if(docCache[id])return Promise.resolve(docCache[id]);
  if(isSnapshot())return Promise.reject(new Error('静态快照不带研报档案'));
  return fetch('/api/doc?id='+encodeURIComponent(id),{cache:'no-store'}).then(function(r){
    if(!r.ok)throw new Error('HTTP '+r.status);return r.json();
  }).then(function(j){docCache[id]=j;return j});
}
function docDetailHTML(d,uid){
  var sha=String(d.sha||d.content_hash||'').slice(0,12);
  var hasBody=(d.body_len||0)>0;
  return (d.summary?'<div>'+esc(d.summary)+'</div>':'<div class="quiet">没有存摘要</div>')
    +'<div class="doc-cred scroll-thin">检索式：'+esc(d.retrieval||'—')+(sha?' · sha '+esc(sha):'')+'</div>'
    +(hasBody
      ?(d.body!==undefined
        ?'<div style="margin-top:6px"><button type="button" class="exp-btn" onclick="toggleDocBody(\''+uid+'\')">读全文（'+fmtInt(d.body_len)+' 字）›</button></div>'
          +'<div class="doc-body scroll-thin" id="docb-'+uid+'" style="display:none">'+esc(d.body)+'</div>'
        :'<div style="margin-top:6px"><button type="button" class="exp-btn" onclick="loadDocBody(\''+uid+'\')">读全文（'+fmtInt(d.body_len)+' 字）›</button></div>'
          +'<div id="docb-'+uid+'"></div>')
      :'<div class="quiet" style="margin-top:6px">只存了标题与摘要（全文仅对每日重点深抓）</div>');
}
function toggleDocBody(uid){
  var el=$('docb-'+uid);if(el)el.style.display=el.style.display==='none'?'':'none';
}
function loadDocBody(uid){
  var d=docReg[uid]||{};
  var el=$('docb-'+uid);if(!el)return;
  el.innerHTML='<span class="quiet">正在取全文……</span>';
  fetchDoc(d.doc_id).then(function(j){
    docReg[uid]=j;
    el.outerHTML='<div class="doc-body scroll-thin" id="docb-'+uid+'">'+esc(j.body||'（全文为空）')+'</div>';
  }).catch(function(){
    el.innerHTML='<span class="quiet">取不到全文——服务没响应，稍后再试。</span>';
  });
}

/* ── 1s ticker: countdown + clock ────────────────────────────── */
function tick(){
  if(!S)return;
  var nr=nextRunInfo();
  if(nr)document.querySelectorAll('.js-cd').forEach(function(el){el.textContent=cdShort(nr.secs)});
  var p=hktParts();
  document.querySelectorAll('.js-now').forEach(function(el){
    el.textContent=String(p.H).padStart(2,'0')+':'+String(p.M).padStart(2,'0');
  });
}

/* ════════════════════ ③ 准则 — 用一句话教它怎么选 ════════════════════

   和用它的代码放在一起，被覆盖时要么一起在要么一起不在，不会出现「样式没了但

   +'.ph-def b{font-weight:600;color:var(--color-text-primary)}'

var PH={data:null,say:'',arm:'',busy:false,err:'',proposal:null,accepted:false,
        loaded:false,bound:false};

var PH_EG=[
  '我不买已经被讲烂的东西，我要的是被迫的卖家——有人被条款逼着必须动手，那才是价格还没反应的地方',
  '政策我只信已经拨了钱的，喊话不算——要能指到预算科目和执行日期',
  '同一个主题里，我要买离受益最近的那一层，不要买沾边的'
];

function phLoad(force){
  if(PH.loaded&&!force)return;
  PH.loaded=true;
  fetch('/api/philosophy',{cache:'no-store'})
    .then(function(r){return r.json()})
    .then(function(b){PH.data=b;
      if(!PH.arm)PH.arm=b.default_arm||'';
      /* 待确认的提案在服务端留着：换个浏览器、隔一天回来，那句话还在等你拍板。 */
      if(!PH.proposal&&b.pending&&b.pending.length)PH.proposal=b.pending[0];
      renderRules()})
    .catch(function(e){PH.err='读不到准则列表：'+(e&&e.message||e);renderRules()});
}

function phPost(op,body,done){
  PH.busy=true;PH.err='';renderRules();
  fetch('/api/philosophy/'+op,{method:'POST',cache:'no-store',
    headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})})
    .then(function(r){return r.json().then(function(b){return {ok:r.ok,b:b}})})
    .then(function(res){PH.busy=false;done(res.b||{},res.ok)})
    .catch(function(e){PH.busy=false;PH.err=(e&&e.message)||String(e);renderRules()});
}

function phSay(){var el=$('phSay');PH.say=el?el.value:PH.say;return PH.say}
function phFill(i){PH.say=PH_EG[i];renderRules();var el=$('phSay');if(el){el.focus();
  el.setSelectionRange(el.value.length,el.value.length)}}

function phPropose(){
  var say=(phSay()||'').trim();
  if(!say){PH.err='还没有内容。';return renderRules()}
  PH.problems=null;
  phPost('propose',{say:say,arm:PH.arm},function(b){
    if(b.error){PH.err=b.error;return renderRules()}
    if(b.ok===false){PH.problems=b;return renderRules()}
    PH.proposal=b;PH.accepted=false;PH.problems=null;
    renderRules();setTimeout(function(){scrollToEl($('sec_rules_teach'))},0);
  });
}

function phActivate(){
  if(!PH.proposal)return;
  phPost('activate',{id:PH.proposal.id,accept_rewrites:PH.accepted},function(b){
    if(b.error){PH.err=b.error;return renderRules()}
    PH.proposal=null;PH.say='';PH.accepted=false;
    phLoad(true);
  });
}

function phDiscard(){
  if(!PH.proposal)return;
  var back=PH.proposal.said;
  phPost('discard',{id:PH.proposal.id},function(){
    PH.proposal=null;PH.say=back;PH.accepted=false;renderRules();
  });
}

function phRetire(id){
  if(!window.confirm('停用这条准则？\n\n该臂今后不再生成想法，已写下的持仓与业绩留在账本中。'))return;
  phPost('retire',{id:id},function(b){
    if(b.error){PH.err=b.error;return renderRules()}
    phLoad(true);
  });
}

function phToggleAccept(){PH.accepted=!PH.accepted;renderRules()}

/* ── 第一屏：说一句话 ── */
function phTeachCard(){
  var d=PH.data||{};
  if(PH.proposal)return phReviewCard();
  var blocked=d.can_propose===false;
  var h='<div class="card section">'
   +'<h2 class="card-title">用一句话写下你判断一笔交易的准则 '
     +'<span class="gloss gm" style="font-size:14px;vertical-align:middle" '
     +'title="系统会把它蒸馏成可执行的要求，并派生一条臂来执行。">ⓘ</span></h2>';
  if(blocked){
    h+='<div class="empty">'+esc(d.why_not||'这台机器上说不了新准则。')+'</div></div>';
    return h;
  }
  h+='<textarea class="ph-say" id="phSay" data-el="rules.say" oninput="PH.say=this.value"'
   +' placeholder="'+esc('比如：'+PH_EG[0])+'">'+esc(PH.say)+'</textarea>'
   +'<div class="card-note" style="margin-top:8px">越具体越有效 '
   +'<span class="gloss gm" title="「要谨慎一点」无法执行；「必须指名一个被期限逼着动手的主体」可以。">ⓘ</span></div>'
   +'<div class="ph-eg">'+PH_EG.map(function(t,i){
        return '<button type="button" data-el="rules.eg'+i+'" onclick="phFill('+i+')">'
          +esc(t.length>34?t.slice(0,34)+'…':t)+'</button>'}).join('')+'</div>';
  /* 加到哪一条臂上，是有意义的选择而不是内部细节：加到「约束边界」是改一副已有的
     推理骨架，加到「AI 端到端」是给一个本来不设骨架的方法加上唯一一条。这四个
     名字面板别处已经在用（写想法那一段就是它们），所以问的是他答得上来的问题。 */
  var arms=d.arms||[];
  if(arms.length>1){
    var picked0=arms.filter(function(a){return a.arm===PH.arm})[0];
    h+='<div class="ph-pick"><span class="card-note">加到哪种生成方式上'
     +(picked0&&picked0.note?'<span class="gloss gm" title="'+esc(picked0.note)+'">ⓘ</span>':'')+'</span>'
     +'<span class="ph-seg">'+arms.map(function(a){
        return '<button type="button" class="seg-btn'+(a.arm===PH.arm?' on':'')+'"'
          +' data-ph-arm="'+esc(a.arm)+'" data-el="rules.arm.'+esc(a.arm)+'"'
          +(a.note?' title="'+esc(a.note)+'"':'')
          +(PH.busy?' disabled':'')+'>'+esc(a.label)+'</button>'}).join('')+'</span></div>';
    /* 释义收进 ⓘ 是对的（页面在做减法），但它挂在标签上、且只显示当前选中的那条，
       于是「选之前看不到这一项是什么意思」——而最该被看到的正是「AI 端到端」：
       加到它上面是给一个刻意不设骨架的方法加上唯一一条，问的是另一个问题。
       所以每个按钮自带 title，标签上那个 ⓘ 留着不动：可见文本一个字没多，
       但四个选项现在各自解释自己。 */
  }
  if(PH.problems){
    h+='<div class="ph-warn" style="margin-top:var(--space-4)">'
     +'<div class="ph-step-h" style="margin-bottom:6px">这条准则无法执行</div>'
     +'<ul class="ph-list">'+(PH.problems.problems||[]).map(function(x){
        return '<li>'+esc(x)+'</li>'}).join('')+'</ul>'
     +'<div class="card-note" style="margin-top:8px;color:#7a5410">'
     +esc(PH.problems.hint||'')+'</div></div>';
  }
  if(PH.err)h+='<div class="ph-err" style="margin-top:var(--space-3)">'+esc(PH.err)+'</div>';
  h+='<div class="ph-acts"><button type="button" class="ph-go" data-el="rules.try"'
   +(PH.busy?' disabled':'')+' onclick="phPropose()">'
   +(PH.busy?'正在蒸馏…':'生成草案')+'</button>'
   +(PH.busy?'<span class="card-note">约二十秒</span>':'')+'</div>';
  return h+'</div>';
}

/* ── 第二屏：它听懂成了什么，以及点下去会发生什么 ── */
function phReviewCard(){
  var p=PH.proposal||{};
  var rw=p.rewrites||[];
  var h='<div class="card section">'
   +'<h2 class="card-title">草案已生成，请核对</h2>'
   +'<div class="ph-hero" style="margin-bottom:var(--space-4)">你写的准则：'
   +'<span style="color:var(--color-text-primary)">「'+esc(p.said||'')+'」</span>'
   +(p.arm_label?'<br>加到：<span style="color:var(--color-text-primary)">'
     +esc(p.arm_label)+'</span>':'')+'</div>'

   +'<div class="ph-step"><div class="ph-step-h"><span class="ph-step-n">1</span>'
   +'系统据此执行的要求</div><ul class="ph-list">'
   +(p.understood||[]).map(function(x){return '<li>'+esc(x)+'</li>'}).join('')
   +(p.refuses||[]).map(function(x){return '<li>'+esc(x)+'</li>'}).join('')
   +'</ul></div>'

   +'<div class="ph-step"><div class="ph-step-h"><span class="ph-step-n">2</span>'
   +'今后每条想法都必须回答</div><div>'
   +(p.must_answer||[]).map(function(f){
      return '<div class="ph-field"><code>'+esc(f.field)+'</code><span>'+esc(f.desc)+'</span></div>'
    }).join('')
   +'</div><div class="card-note" style="margin-top:8px">'
   +'每条想法还要写清它在<b>哪一篇材料</b>里读到这些，那个文献号会被逐个核对，'
   +'对不上的整条丢弃。这是必要的：必填字段不会让模型在材料里找不到时省略，'
   +'只会让它写点什么出来——首次实测它就点名了一家材料里根本没提的机构，'
   +'而编一个文献号是查得出来的。<br>'
   +'但一篇真实的材料不等于它支持挂在上面的那句话。所以这些字段是给你'
   +'<b>核对</b>用的，不是可以直接相信的；丢弃率本身说明语料撑不撑得起这条准则。'
   +'</div></div>';

  if(rw.length){
    h+='<div class="ph-step"><div class="ph-step-h"><span class="ph-step-n">3</span>'
     +'你的准则有部分被改写</div><div class="ph-warn"><ul class="ph-list">'
     +rw.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul></div>'
     +'<label class="ph-check" data-el="rules.accept"><input type="checkbox"'
     +(PH.accepted?' checked':'')+' onchange="phToggleAccept()">'
     +'<span>我已核对，改写符合我的原意。</span></label>'
     +'<div class="card-note" style="margin-top:6px">改写是否成立只有你能判断。'
     +'不符合原意就换一个说法重写。</div></div>';
  }

  var n=rw.length?4:3;
  h+='<div class="ph-step"><div class="ph-step-h"><span class="ph-step-n">'+n+'</span>'
   +'生效后会发生什么</div><div class="ph-then"><ul class="ph-list">'
   +'<li>从今天起，新增一条依据该准则生成想法的臂。</li>'
   +'<li>原臂一字不改，继续运行，作为对照。</li>'
   +'<li>两条臂读同一批研报、同一份可买清单、同一天成交，差异仅在这条准则。</li>'
   +'<li>四周后这里给出两条臂的对比；跑不赢的可随时停用。</li>'
   +'</ul></div></div>';

  if(PH.err)h+='<div class="ph-err" style="margin-top:var(--space-3)">'+esc(PH.err)+'</div>';
  var lock=rw.length&&!PH.accepted;
  h+='<div class="ph-acts">'
   +'<button type="button" class="ph-go" data-el="rules.go"'
   +((PH.busy||lock)?' disabled':'')+' onclick="phActivate()">'
   +(PH.busy?'正在生效…':'确认生效')+'</button>'
   +'<button type="button" class="ph-alt" data-el="rules.redo"'
   +(PH.busy?' disabled':'')+' onclick="phDiscard()">重写</button>'
   +(lock?'<span class="card-note">需先核对上方改写并勾选，方可生效</span>':'')
   +'</div>';
  return h+'</div>';
}

/* ── 在跑的准则 ── */
function phRunningCard(){
  var live=(PH.data||{}).live||[];
  var h='<div class="card section"><div class="card-title-row">'
   +'<h2 class="card-title" style="margin-bottom:0">在跑的准则</h2>'
   +'<span class="card-note">'+live.length+' 条</span></div>';
  if(!live.length){
    return h+'<div class="empty">尚未注入任何准则。当前只有四种内置生成方式在运行。</div></div>';
  }
  h+=live.map(function(c){
    var when=c.runs>0?('已跑 '+c.runs+' 期')
      :'尚未运行，下一次周跑（周三）首次生成';
    return '<div class="ph-rule">'
      +'<div class="ph-rule-said">「'+esc(c.said)+'」</div>'
      +'<div class="ph-meta">'+esc(c.since)+' 起 · '
      +(c.arm_label?esc(c.arm_label)+' · ':'')+esc(when)
      +(c.must_answer&&c.must_answer.length
        ? ' · 每条想法必答：'+c.must_answer.map(function(f){return esc(f.field)}).join(' / ')
        : '')+'</div>'
      +'<div class="ph-acts" style="margin-top:var(--space-3)">'
      +'<button type="button" class="ph-alt" data-el="rules.retire"'
      +' data-ph-id="'+esc(c.id)+'"'+(PH.busy?' disabled':'')+'>停用</button>'
      +(c.runs>0?'':'<span class="card-note">停用后，该准则已写下的持仓与业绩留在账本中</span>')
      +'</div></div>';
  }).join('');
  return h+'</div>';
}

/* 停用按钮走事件委托，id 从不进入 JS 字符串字面量。
   内联 `onclick="phRetire('…')"` 是双层上下文——HTML 属性里套一个 JS 字符串——
   而 esc() 在那里不够：HTML 解析器会先把 &#39; 解回单引号再交给 JS，引号原样
   落进字面量。jss() 能修这一层，但更根本的问题是：那样一来「安全」就挂在
   「id 里没有引号」这条写入时的正则上，而正则和这个渲染点之间隔着数据库、
   迁移脚本和导入工具。把不变量挂在没人会去维护的地方，迟早会断在这里而不是
   断在正则上。委托之后这个上下文不存在，id 里是什么字符都无所谓。 */
function phBind(){
  if(PH.bound)return;
  var host=$('view-rules');if(!host)return;
  PH.bound=true;
  host.addEventListener('click',function(e){
    var t=e.target;if(!t||!t.closest)return;
    var r=t.closest('[data-ph-id]');
    if(r&&host.contains(r)&&!r.disabled)return phRetire(r.getAttribute('data-ph-id'));
    var a=t.closest('[data-ph-arm]');
    if(a&&host.contains(a)&&!a.disabled){PH.arm=a.getAttribute('data-ph-arm');
      PH.problems=null;renderRules()}
  });
}

function renderRules(){
  var el=$('view-rules');if(!el)return;
  /* 面板每 60 秒整页重渲染一次。这一屏和别处不同：别处是只读的，重画一遍没有
     代价；这里有一个人正在往框里打字，重画会把他打了一半的话连同光标一起换掉。
     所以正在输入时整块跳过——PH.say 由 oninput 实时同步，跳过不会丢状态。 */
  var ta=$('phSay');
  if(ta&&document.activeElement===ta){PH.say=ta.value;return}
  /* 公开快照是导出的静态 HTML，没有后端可写。视图在快照里根本不注册（见
     VIEWS.push 的条件），这里再兜一层，免得别处误调。 */
  if(isSnapshot())return;
  phLoad();
  if(!PH.data&&!PH.err){el.innerHTML='<div class="card section"><div class="empty">正在读…</div></div>';return}
  /* 不再写一遍标题：页眉的 pageTitle 已经是「准则」，renderProcess 也是这个规矩。 */
  /* 准则和臂是两个东西——准则是他说的那句话，臂是由它派生、参与统计检验的对照
     单位——所以不能统一成一个词：那会把「我写了一条准则」和「这条准则的样本量
     还不够」糊成一句。但两个陌生词交替出现而从不说关系，更糟。所以这里定义一次，
     常驻在两种状态之上，之后各用各的。 */
  var html='<div class="ph-def">系统现在有四种固定的生成方式。'
    +'<b>每条准则派生一条对照臂</b>，<b>原臂冻结不动</b> '
    +glossMark('两条臂与原臂同批、同料、同规则并跑，唯一差异是这条准则；两条臂的净值之差即这条准则的净效应。')+'</div>';
  html+=secWrap('rules','teach',phTeachCard());
  html+=secWrap('rules','running',phRunningCard());
  el.innerHTML=html;
  phBind();
  buildNav();
}

  'week/overview':['overview','verdict'],  'week/mainline':['method','mainline'],

var mapped=LEGACY_SEC[initHash+'/'+initSec];

/* 滚动时更新侧栏高亮：rAF 节流，滚动本身不做任何计算。 */
(function(){
  var queued=false;
  window.addEventListener('scroll',function(){
    if(queued)return;queued=true;
    requestAnimationFrame(function(){queued=false;markActiveSection()});
  },{passive:true});
})();
</script>
