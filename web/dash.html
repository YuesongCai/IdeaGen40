/* 概览：一个零背景的人在这一屏里要拿到三件事 ——
   这是什么、它管用吗、还在不在跑。别的都不属于这里。 */
/* ── 「原来可以问它」：只讲一次的上手引导 ─────────────────────
 * 追问是这个面板最不像别的看板的地方，也最容易被整页略过：按钮再显眼也
 * 答不了「点了会发生什么」。第一次来的人给一句话——问的是什么、答案从
 * 哪来——之后就靠形状认它。关掉一次，永不再来。
 * localStorage 读写都包在 try 里：隐私模式下会抛，不能因为这个把首屏搞挂。 */
var ASK_HINT_KEY='ideagen.askHint.v1';
function askHintOff(){
  try{return localStorage.getItem(ASK_HINT_KEY)==='1'}catch(e){return true}
}
function dismissAskHint(){
  try{localStorage.setItem(ASK_HINT_KEY,'1')}catch(e){}
  renderAll();
}
function askHintHTML(){
  if(askHintOff())return '';
  return '<div class="orient" role="note">'
    +'<div class="o-body">'
      /* 这个是示意用的样子货，不是按钮：aria-hidden 让读屏软件不去念一个
         点不动的「按钮」，data-sample 让选择器和埋点能把它和真按钮分开。
         它刚把我自己的测试骗过去了——同名不同物，迟早也会骗到别人。 */
      +'<p>页面上凡是带 <span class="ask-btn sm" data-sample="1" aria-hidden="true" style="pointer-events:none;vertical-align:middle">'
        +ASK_ICON+'<span>问它为什么选它</span></span> 的地方，都能就地问一句。</p>'
      +'<p><b>答案只依据那次运行当时封存下来的研报与打分记录</b> '
      +glossMark('材料里没有的，它会直说记录中不存在——不补全，也不拿事后发生的事情圆场。')+'</p>'
    +'</div>'
    +'<button type="button" class="orient-x" data-el="ask.hint.dismiss" onclick="dismissAskHint()">知道了</button>'
  +'</div>';
}
/* ── 概览重构：头条从「收益率」换成「证据进度」────────────────────
 * 这一页此前的头条是 books_aggregate 的合计收益率，配一句「跑输 SPY N 个
 * 百分点」的结论体。三个问题叠在一起：
 *   ① 那个数 92% 是没投出去的钱吃的货币市场利息（+0.36pp / +0.39pp），
 *      只有 +0.03pp 来自选出来的持仓；
 *   ② 对手方是满仓的指数，自己是四周分批、上个月大部分时间在现金里；
 *   ③ 本期持仓平均只持有 1 天——用一天的行情做一个月判断的头条。
 * 于是卡片必须在大数字下面写三行小字把它逐条收回去。一个数字加三行撤回，
 * 净信息量为零，而且占掉了整块首屏。
 *
 * 真正回答「它管用吗」的数一直算着，只是没有任何屏幕指向它：
 *   live_vs_backfill: n_live=1 / n_backfill=5 / usable=false / 还需 3 期
 * 六期里只有 08-26 一期是当期实跑，其余五期是事后补跑。「还不知道，因为
 * 只跑了 1 期真的，还差 3 期」——这是个确定的、有内容、能倒计时的答案，
 * 比一个自己撤回的百分号强。头条给它。 */
function evidenceProgressCard(){
  var sm=(((S||{}).backtest||{}).summary)||{};
  var lb=sm.live_vs_backfill;
  if(!lb)return '';
  var nLive=Number(lb.n_live_periods||0);
  var nBack=Number(lb.n_backfill_periods||0);
  /* periods_needed 是后端 max(0, 门槛 − 已有)，即「还差几期」，不是总数。
   * 当成总数写会把 3 印成 2。门槛本身要写出来，否则读者无从判断 3 是多是少。 */
  var need=Number(lb.periods_needed||0);
  var gate=nLive+need;
  var cls=sm.period_classification||{};
  var order=Object.keys(cls).sort();
  var done=order.length||(nLive+nBack);

  var headline=lb.usable
    ? '实跑期次已达 '+fmtInt(nLive)+' 期，可以开始读了'
    : '还不能说它管用——'+fmtInt(done)+' 期里只有 <b>'+fmtInt(nLive)+' 期</b>是当期实跑';

  /* 一格 = 一期。虚线格是还没到的那几期，「还差 3 期」因此是看得见的
     长度，而不是一句需要读者自己在脑子里换算的话。 */
  var cells=order.map(function(d){
    var live=cls[d]==='live';
    return '<span class="ev-cell'+(live?' live':'')+'" title="'+esc(d)
      +' 期 · '+(live?'当期实跑':'事后补跑')+'"></span>';
  }).join('')
  +(need>0?'<span style="width:10px"></span>'+new Array(need+1).join(
      '<span class="ev-cell todo" title="还没跑到的实跑期次"></span>'):'');

  var nr=(typeof nextRunInfo==='function')?nextRunInfo():null;
  var nextLine=nr
    ? '下一期 <b class="num">'+esc(nr.date)+'</b>（'+nr.wd+' '+nr.hm+'）跑完，实跑 +1'
      +'　还有 <span class="js-cd num">'+cdShort(nr.secs)+'</span>'
    : '下次运行时刻未知（接口未提供时刻表）';

  return '<div class="card section" id="evProgress">'
    +'<div class="card-title-row"><h2 class="card-title" style="margin-bottom:0">它管用吗</h2>'
      +'<span class="card-note">证据进度，不是业绩</span></div>'
    +'<div style="font:600 22px/30px var(--font-sans);color:var(--color-text-primary);margin:var(--space-2) 0 0">'
      +headline+'</div>'
    +'<div class="ev-prog">'+cells+'</div>'
    +'<div class="ev-legend">'
      +'<span><i class="live"></i>当期实跑 '+fmtInt(nLive)+' 期</span>'
      +'<span><i></i>事后补跑 '+fmtInt(nBack)+' 期</span>'
      +(need>0?'<span><i class="todo"></i>还需 '+fmtInt(need)+' 期（门槛 '+fmtInt(gate)+' 期）'
        +'<span class="gloss gm" title="四周是一轮完整的分批周期。不到一轮时每条持仓都还开着，那时的胜率量的是持仓开着的那几天，不是一个月的判断。">ⓘ</span></span>':'')
    +'</div>'
    +'<div style="margin-top:var(--space-3);font:400 13px/19px var(--font-sans);color:var(--color-text-secondary)">'
      +esc(nr?'':'')+nextLine+'</div>'
    /* 「补跑为什么不算数」必须和进度条同框。不写，读者会把 6 期当 6 期，
       而这一整张卡的前提就是它们不等价。 */
    +'<div style="margin-top:var(--space-3);padding-top:var(--space-3);'
      +'border-top:1px solid var(--color-border-subtle);'
      +'font:400 12px/18px var(--font-sans);color:var(--color-text-tertiary)">'
      +'补跑期次的文档输入按 as-of 严格卡死在当期，但模型权重已经见过那之后的世界——'
      +'这一项用代码消不掉，所以补跑只能用来搭管线，不能用来下结论。'
      +'<button type="button" class="exp-btn" onclick="gotoSection(\'evidence\',\'ranking\')">'
      +'实跑 / 补跑 逐条对照 ›</button>'
    +'</div>'
  +'</div>';
}

/* 目前学到了什么。概览只说「还不知道」而不给任何内容，是一页正确的空白；
 * 这套东西六期下来确实挖出了一条东西，而它连同三项证伪一起，才是诚实的
 * 全貌。三项证伪必须和发现同框——分开放，被引用的永远只有前半句。 */
function learnedCard(){
  var sm=(((S||{}).backtest||{}).summary)||{};
  var rp=sm.ranking_power;
  if(!rp||!rp.pooled)return '';
  var q1=rp.pooled.Q1||{},q5=rp.pooled.Q5||{};
  var nP=Number(rp.periods_scored||0);
  var nTB=Number(rp.periods_top_beats_bottom||0);
  var nBM=Number(rp.periods_top_beats_benchmark||0);
  var vc=rp.volatility_control||{};
  var ratio=vc.vol_ratio_top_over_bottom;

  var ex=sm.exposure||{};
  var evArm=(ex.arms||{}).ev_rank||{};
  var rvArm=evArm.return_per_vol, rvBM=ex.benchmark_return_per_vol;

  var rb=sm.robustness_drop_top||{};
  var rbEv=(rb.arms||{}).ev_rank||{};
  var dropN=Number(rb.top_n||0);
  var kept=(rbEv.excluded||{}).mean_return_pct;
  var full=(rbEv.full||{}).mean_return_pct;
  var ctlKept=((rb.arms||{}).buy_all||{}).excluded||{};

  var fal=[];
  if(ratio) fal.push('<b>一阶上它在排风险。</b>顶格分位持仓入场前的 '
    +fmtInt(vc.lookback_days||60)+' 日波动是末位分位的 <b class="num">'+Number(ratio).toFixed(1)+' 倍</b>——'
    +'上涨窗口里把风险从低到高排一遍，本来就会得到一条漂亮的收益阶梯。');
  if(rvArm!=null&&rvBM!=null) fal.push('<b>风险调整后仍跑输指数。</b>单位波动收益 <b class="num">'
    +Number(rvArm).toFixed(3)+'</b>，同期 '+esc(benchName())+' 是 <b class="num">'+Number(rvBM).toFixed(3)+'</b>。'
    +'（这里不用 beta 折算那一列——它假设 beta=1，而这个组合的 beta 大于 1，那列偏乐观。）');
  if(kept!=null&&full!=null&&ctlKept.mean_return_pct!=null)
    fal.push('<b>优势无法被证明能离开少数标的存活。</b>剔掉最常持有的 '+dropN+' 个标的后，它剩 <b class="num">'
      +Number(kept).toFixed(2)+'%</b>，全量基准剩 <b class="num">'+Number(ctlKept.mean_return_pct).toFixed(2)+'%</b>——'
      +'原本 '+Number(full).toFixed(2)+'% 对基准的领先收敛到几乎没有。'
      +'而被剔除的正是上面那批高波动标的，两条独立检验指向同一批名字。'
      /* 措辞必须压住：回测给的判定是 underpowered——剔除后剩下的样本量本来就
       * 不足以分辨两组，所以它证明的是「优势无法被证明存活」，不是「优势是假的」。
       * 写成后者，就是拿一个不显著的检验去下一个显著的结论。 */
      +(rbEv.verdict==='underpowered'
        ? '<span style="color:var(--color-text-tertiary)">（剔除后只剩 '
          +fmtInt((rbEv.excluded||{}).n)+' / '+fmtInt((rbEv.full||{}).n)
          +' 笔，样本已不足以分辨两组——这说明优势没能被证明存活，不等于它已被证伪。）</span>'
        : ''));

  return '<div class="card section" id="learned">'
    +'<div class="card-title-row"><h2 class="card-title" style="margin-bottom:0">目前唯一站得住的发现</h2>'
      +'<span class="card-note">六期挖出来的，连同它没通过的三关</span></div>'
    +'<div style="font:600 17px/25px var(--font-sans);color:var(--color-text-primary);margin:var(--space-2) 0 var(--space-2)">'
      /* 标题放名字，定义挂 gloss：score_label 是一整句定义（「候选自陈情景的概率
       * 加权期望回报」），直接当标题印，一行里会出现两个「候选」，而且读者拿到
       * 的是解释、不是这条东西叫什么。 */
      +'期望值分数能把候选排出次序'
      +'<span class="gloss gm" title="'+esc((rp.score_label||'')+'——'+(rp.ex_ante||''))+'">ⓘ</span></div>'
    +'<div style="font:400 14px/21px var(--font-sans);color:var(--color-text-secondary)">'
      +'按每期内部切五分位：顶格 <b class="num up">'+Number(q5.mean_return_pct||0).toFixed(2)+'%</b>'
      +'（'+fmtInt(q5.n)+' 笔），末位 <b class="num">'+Number(q1.mean_return_pct||0).toFixed(2)+'%</b>'
      +'（'+fmtInt(q1.n)+' 笔）；<b>'+fmtInt(nP)+' 期全部顶格高于末位</b>'
      +(nP?('，'+fmtInt(nBM)+' 期顶格跑赢同期 '+esc(benchName())):'')+'。'
      +'<span class="gloss gm" title="'+esc(rp.note||'')+'">ⓘ</span>'
    +'</div>'
    +(fal.length?'<ul class="fal-list">'+fal.map(function(t){return '<li>'+t+'</li>'}).join('')+'</ul>':'')
    +'<div style="margin-top:var(--space-3);padding-top:var(--space-3);'
      +'border-top:1px solid var(--color-border-subtle);'
      +'font:400 13px/19px var(--font-sans);color:var(--color-text-primary)">'
      +'所以能说的只有 <b>「值得往前跑一段看看」</b>。'
      +'<span style="color:var(--color-text-tertiary)">这条排序是看过这六期的结果之后才挑出来检验的，'
      +'对那次搜索是样本内的；它按探索类注册，只有往后的实跑期次才算证据。</span>'
      +'<span class="gloss gm" title="'+esc(rp.provenance_warning||'')+'">ⓘ</span>'
      +'<button type="button" class="exp-btn" onclick="gotoSection(\'evidence\',\'ranking\')">完整检验 ›</button>'
    +'</div>'
  +'</div>';
}

/* 回测里十条策略的次序。这是 NAV 那一层唯一没被「大部分时间是现金」污染的
 * 东西——逐日计价、每期投 1/slots、空档位现金，分母写在标题上。
 * 概览放的是次序和一个入口，不是那张全表：证据页那张才是可下钻的对象。 */
function armOrderCard(){
  var ex=(((S||{}).backtest||{}).summary||{}).exposure;
  if(!ex||!ex.arms)return '';
  var rows=Object.keys(ex.arms).map(function(k){
    var v=ex.arms[k]||{};
    return {k:k,ret:Number(v.return_pct),vol:v.realized_vol_pct,rv:v.return_per_vol};
  }).filter(function(r){return isFinite(r.ret)});
  if(!rows.length)return '';
  rows.push({k:'__bm__',ret:Number(ex.benchmark_pct),vol:ex.benchmark_vol_pct,
             rv:ex.benchmark_return_per_vol,bm:true});
  rows.sort(function(a,b){return b.ret-a.ret});
  var mx=Math.max.apply(null,rows.map(function(r){return Math.abs(r.ret)}))||1;

  var CTL={buy_all:1,random_pick:1,mom_21:1,generated_ai_native:1,generated_carl_constraint:1};
  var body=rows.map(function(r){
    var name=r.bm?('同期 '+benchName()+' · 满仓')
      :((typeof backtestArmName==='function')?backtestArmName(r.k):r.k);
    var cls=r.bm?'bm':(CTL[r.k]?'ctl':'');
    var w=Math.max(1,Math.abs(r.ret)/mx*100);
    var tip=(r.vol!=null&&r.rv!=null)
      ?(name+'：实现波动 '+Number(r.vol).toFixed(1)+'%，单位波动收益 '+Number(r.rv).toFixed(3))
      :name;
    return '<div class="rank-row '+cls+'" title="'+esc(tip)+'">'
      +'<span class="rn">'+esc(name)+'</span>'
      +'<span class="rank-bar"><i style="width:'+w.toFixed(1)+'%"></i></span>'
      +'<span class="rv '+pctCls(r.ret)+'">'+(r.ret>=0?'+':'')+r.ret.toFixed(2)+'%</span>'
    +'</div>';
  }).join('');

  var inv=ex.mean_invested_frac!=null?(Number(ex.mean_invested_frac)*100).toFixed(1)+'%':null;
  return '<div class="card section" id="armOrder">'
    +'<div class="card-title-row"><h2 class="card-title" style="margin-bottom:0">回测里，十条选取策略的次序</h2>'
      +'<span class="card-note">'+fmtInt(ex.days)+' 天 · 逐日计价</span></div>'
    +'<div class="quiet" style="margin-bottom:var(--space-3)">'
      +'按初心的分批设计复算：每期投 1/'+fmtInt(ex.slots)+' 本金、等权、持有 '
      +fmtInt(ex.horizon_days)+' 天，空档位放现金。'
      +(inv?'区间平均投出 <b>'+inv+'</b>——分批组合开头必然欠投，不标出来就等于让每个组合替自己的建仓期背锅。':'')
      +'<span class="gloss gm" title="这条曲线曾经是假数：早前的实现把每期的 30 天平均收益按「周」复利，而这些 30 天窗口彼此高度重叠，同一段行情被计了四次，量级放大约四倍。现在按逐日计价重算，次序全部保住、量级掉一个数量级。">ⓘ</span>'
    +'</div>'
    +body
    +'<div class="card-note" style="margin-top:var(--space-3)">'
      +'读次序，别读数值——这是六期的样本内回测，其中 5 期是补跑。'
      +'<button type="button" class="exp-btn" onclick="gotoSection(\'evidence\',\'backtest\')">回测口径与局限 ›</button>'
    +'</div>'
  +'</div>';
}

/* 账面。它从头条降到这里，因为它现在量的主要不是判断的质量：合计里绝大部分
 * 是没投出去的钱吃的利息，而本期持仓只持有了几天。数字全留着——Jon 只看
 * NAV，删掉会让他问「钱呢」——但不再摆成结论，也不再配那条「组合 vs 满仓
 * 指数」的净值曲线：那张图是同一个错误比较的图像版。 */
function ledgerCard(ag){
  if(!ag)return '';
  var ret=aggReturnPct(ag);
  var gain=(ag.lastEquity!==null&&ag.capital)?(ag.lastEquity-ag.capital):null;
  var pos=(ag.unrealized||0)+(ag.realized||0);
  var pp=function(v){return ag.capital?(v/ag.capital*100):0};
  var dep=(ag.capital&&ag.deployed!==undefined)?(ag.deployed/ag.capital*100):null;
  var pr=(typeof periodAt==='function')?periodAt(curPeriod()):null;
  var md=pr?Number(pr.mark_days||0):null;

  var split='';
  if(gain!==null&&ag.capital&&Math.abs(gain-pos)/Math.abs(gain||1)>=0.05){
    split='<div style="font:400 14px/21px var(--font-sans);color:var(--color-text-secondary);margin-top:var(--space-2)">'
      +'其中 <b class="num">'+(pp(gain-pos)>=0?'+':'')+pp(gain-pos).toFixed(2)+' pp</b> 是未投出资金的货币市场利息，'
      +'只有 <b class="num '+pctCls(pos)+'">'+(pp(pos)>=0?'+':'')+pp(pos).toFixed(2)+' pp</b> 来自选出来的持仓。'
      +'<span class="gloss gm" title="'+esc(cashRateNote())
      +'这部分收益与选股好坏无关——它衡量的是钱停着的时间，不是判断的质量。">ⓘ</span></div>';
  }

  return '<div class="card section" id="ledger">'
    +'<div class="card-title-row"><h2 class="card-title" style="margin-bottom:0">账面</h2>'
      +'<span class="card-note">纸面成交，非实盘</span></div>'
    +'<div style="display:flex;flex-wrap:wrap;align-items:baseline;gap:var(--space-2) var(--space-5);margin-top:var(--space-2)">'
      +'<span style="font:400 13px/18px var(--font-sans);color:var(--color-text-tertiary)">'
        +'全部 '+currentBooks().length+' 个组合 · 至今合计</span>'
      +'<span class="num '+pctCls(ret)+'" style="font:600 26px/32px var(--font-sans)">'
        +(ret===null?'—':fmtPct(ret))+'</span>'
      +(dep!==null?'<span style="font:400 13px/18px var(--font-sans);color:var(--color-feedback-warning-text)">'
        +'已投出 '+dep.toFixed(0)+'%</span>':'')
      +(md!==null?'<span style="font:400 13px/18px var(--font-sans);color:'
        +(md<=1?'var(--color-feedback-warning-strong)':'var(--color-text-tertiary)')+'">'
        +'本期持仓持有 '+fmtInt(md)+' 天</span>':'')
    +'</div>'
    +split
    /* 「跑输基准 N 个百分点」的结论体从这里去掉了。把一个四周分批、上个月
       大半时间在现金里的账户和满仓指数相减，得到的差主要是仓位不是判断；
       它此前是首屏最大的一行字，也是最容易被读错的一行。基准仍然给，但
       只作为同期参照放在事实行里，不做结论。 */
    +'<div class="card-note" style="margin-top:var(--space-3)">'
      +'浮动盈亏 <span class="num '+pctCls(ag.unrealized)+'">'+signedMoney(ag.unrealized)+'</span>'
      +' · 已实现 <span class="num '+pctCls(ag.realized)+'">'+signedMoney(ag.realized)+'</span>'
      +' · 在场 '+fmtInt(ag.openN||0)+' 仓'
      +' · 本金 '+fmtMoney(ag.capital)
      +(benchReturnPct()!==null?' · 同期 '+esc(benchName())+'（满仓）<span class="num">'
        +fmtPct(benchReturnPct())+'</span>'
        +'<span class="gloss gm" title="并列给出，不相减：这个组合按设计四周分批建仓，区间内平均只有一部分本金在场，而基准全程满仓。两者相减得到的差主要来自仓位节奏，不是选股判断。">ⓘ</span>':'')
      +' · 已计佣金与滑点 '+glossMark(COST_GLOSS)
      +'<button type="button" class="exp-btn" data-el="week.headline.trust" onclick="openTrustDrawer()">可信度与局限 ›</button>'
    +'</div>'
  +'</div>';
}
function renderOverview(){
  var root=$('view-overview');
  if(!S){root.innerHTML='';return}
  var w=S.weekly||{};
  var ag=aggBooks();
  var period=w.as_of||((S.schedule||{}).current_period)||'—';
  root.innerHTML=
     '<div class="wk-h1">'
      +'<button type="button" class="wk-p-btn num" onclick="goto(\'periods\')"'
      +' title="这一期在四周阶梯里的位置——以及另外几期">'+esc(period)+'</button>'
      +' 期'+periodBadge()+'</div>'
    +'<div style="font:400 14px/21px var(--font-sans);color:var(--color-text-tertiary);margin:2px 0 var(--space-4)">'
      /* 建仓前组合数是 0，直接印出来就成了「0 个选取策略各管一个组合」。
       * 已经跑完的选取策略数（筛选C）才是这句话要说的东西；两者都没有时
       * 就不带数字，而不是报一个 0。 */
      +(function(){
        var nb=currentBooks().length;
        var ns=((S.weekly||{}).selectors||[]).length;
        var n=nb||ns;
        return '每周三自动读研报、选宏观主题、写出想法并建仓；'
          +(n?(n+' 个选取策略各管一个组合，比较哪种选得更好。')
             :'多个选取策略各管一个组合，比较哪种选得更好。')
          +(!nb&&ns?'（本期策略已跑完，组合在建仓后出现）':'');
      })()
      +'</div>'
    +askHintHTML()
    /* 结论层：三张卡按「问题 → 目前的答案 → 答案的强度」排。
       ① 它管用吗 —— 证据进度（实跑 / 补跑 / 还差几期），头条。
       ② 目前学到了什么 —— 唯一站得住的发现，连同它没通过的三关。
       ③ 回测里的次序 —— NAV 那一层唯一没被「大部分时间是现金」污染的东西。
       此前这里是一个 92% 由货币基金利息构成的收益率大字，加三行把它收回去
       的小字，再加一条把分批组合和满仓指数画在一起的净值曲线。 */
    +secWrap('overview','verdict',evidenceProgressCard()+learnedCard()+armOrderCard())
    /* 账面从头条降级到这里，作为事实而不是结论。数字一个没删。 */
    +secWrap('overview','ledger',ledgerCard(ag))
    /* 运维层：这台机器在不在跑、每一期跑成了没有。状态条是这一层的结论，
       两个明细收在它底下。 */
    +secWrap('overview','health',
       statusStrip()
       +'<div class="card section" style="margin-top:calc(-1 * var(--space-3));padding-top:var(--space-3)">'
         +foldBlock('overview.status.detail','系统自检',
            '心跳时刻 · 平台端口 · 数据源健康',statusDrawerBody())
         +foldBlock('overview.runs.detail','运行记录',
            '每一期跑成了没有 · 失败原因 · 逐步日志 · 永久缺失的期次',
            calDrawerBody(),(periodList()||[]).length?((periodList()||[]).length+' 期'):'')
       +'</div>');
}
/* 持仓：PM 的职业本能 —— 现在拿着什么、压在哪几个宏观判断上。 */
function renderHoldings(){
  var root=$('view-holdings');
  if(!S){root.innerHTML='';return}
  root.innerHTML=ladderStrip()
    +secWrap('holdings','exposure',holdMapCard(aggBooks()));
}
/* ══ 证据页 ═══════════════════════════════════════════════════════
   这一页此前是七张平级卡，直接从「选取策略对比 · 10 个组合 · 第 2 周」开场。
   每张卡自己的结论句写得很好——那部分本来就做对了——但页面层面从没说过
   三件事，而这三件事恰好是一个零背景的读者最先要问的：

   ① 这一页在验证哪个命题。七张卡都在回答同一个问题的不同问法，没写。
   ② 这七张卡不是七个平级话题。②–⑤ 是同一次回测的四个切面，① 是另一套
      数据（实盘模拟组合），⑥⑦ 是脚注。摆成七个兄弟，这个层次就消失了。
   ③ 合起来的判定是什么。五张卡各说一遍「还分不出来」，五种措辞，读者要
      跨过 4000px 自己合成——读起来像五个发现，其实是一个。

   所以补三样东西：一句开场（命题 + 总判定 + 下一步）、一张证据总账（五个
   判定摆成一屏）、三个组标题（说清每组数据从哪来）。总账不产生新数字，
   每一格都取自下面那几张卡已经算出来的字段。 */

/* 五个问题 —— 这一页的实际论证结构。判定三态：
     sig  = 出了信号（正面）
     none = 样本已足够，可以说「没有」——这是结论，不是数据缺口
     open = 还分不出（样本不足或区间重叠）
   none 和 open 的区别是这套东西最容易被说反的地方：把「已经看出没优势」
   写成「还看不出来」，是往人们希望的方向说假话。归因卡为此专门写过一段，
   总账沿用它的三态，不自己重新判。 */
function evLedgerRows(){
  var sm=(((S||{}).backtest||{}).summary)||{};
  var out=[];

  var books=(typeof currentBooks==='function')?currentBooks():[];
  if(books.length){
    var wk=weekIndex(books);
    var dif=pairedDiffs(books);
    var apart=dif.filter(function(r){return r.diff!==null&&Math.abs(r.diff)>2}).length;
    out.push({sec:'strategies',n:'①',short:'实盘还分不出',
      q:'实盘上，哪个选取策略更好？',
      state:apart?'sig':'open',
      a:apart?('<b>'+fmtInt(apart)+' 个已明显分开</b>，其余仍在误差带内')
             :('<b>分不出</b>——'+fmtInt(books.length)+' 个组合的差距都在误差带内'),
      need:'第 '+wk+' 周 · 主策略里最慢的一条约需 '+targetWeeks()+' 期才够判定'});
  }

  var pr=sm.paired||{},pk=Object.keys(pr);
  if(pk.length){
    var pow=pk.filter(function(k){return pr[k].powered});
    var sig=pk.filter(function(k){return pr[k].significant});
    out.push({sec:'backtest',n:'②',short:'回测里没有一条跑赢全买',
      q:'回测里，有策略跑赢「把候选池全买下来」吗？',
      state:sig.length?'sig':(pow.length?'none':'open'),
      a:sig.length?('<b>有 '+fmtInt(sig.length)+' 条</b>达到预注册门槛')
                  :'<b>没有</b>——一条都没被判定跑赢',
      need:(pow.length?fmtInt(pow.length)+' 个样本已足、仍无差距 · ':'')
           +fmtInt(pk.length-pow.length)+' 个样本仍不足'});
  }

  var sep=((sm.tearsheet||{}).separability)||null;
  if(sep){
    var above=(sep.arms_above_benchmark||[]).length;
    out.push({sec:'tearsheet',n:'③',short:'和指数分不开',
      q:'拿着它这段时间，会比拿 '+esc(tsBenchName(sm))+' 好吗？',
      state:above?'sig':'open',
      a:above?('<b>'+fmtInt(above)+' 条</b>被证明跑赢基准')
             :('<b>分不出</b>——'+fmtInt(sep.n_measurable)+'/'+fmtInt(sep.n_arms)
               +' 条的夏普区间都盖住了基准'),
      need:'只有 '+fmtInt(sep.n_days)+' 个交易日，区间宽到没法分开任何两条'});
  }

  var rp=sm.ranking_power;
  if(rp&&rp.pooled){
    var lvb=sm.live_vs_backfill||{};
    out.push({sec:'ranking',n:'④',short:'分数排得动结果',
      q:'系统给每条想法打的分，排得动真实结果吗？',
      state:'sig',
      a:'<b>排得动</b>——顶格分位高于末位分位 '
        +fmtInt(rp.periods_top_beats_bottom)+'/'+fmtInt(rp.periods_scored)+' 期',
      need:'但这条排序是看过结果之后才挑出来检验的（样本内）'
        +(lvb.periods_needed?'；实跑还差 '+fmtInt(lvb.periods_needed)+' 期才算证据':'')});
  }

  var at=sm.attribution_theme_layer;
  if(at&&at.arms){
    var ks=Object.keys(at.arms).filter(function(k){return k!==at.control});
    var vd=function(v){return ks.filter(function(k){
      return at.arms[k].verdict_over_control===v})};
    var ne=vd('no_edge_detected'),un=vd('underpowered'),nr=vd('not_ruled_out');
    out.push({sec:'attribution',n:'⑤',short:'挑标的这一段没看出优势',
      q:'多出来的那点钱，是出在「挑标的」这一段吗？',
      state:nr.length?'open':(ne.length?'none':'open'),
      a:nr.length?('<b>'+fmtInt(nr.length)+' 个</b>的优势尚未被排除')
        :(ne.length?('<b>'+fmtInt(ne.length)+' 个</b>样本已足够，而优势没有出现')
                   :'<b>还答不了</b>——没有一个组合的样本够'),
      need:un.length?(fmtInt(un.length)+' 个在这一层上样本仍不足'):''});
  }
  return out;
}
function tsBenchName(sm){return ((sm.tearsheet||{}).benchmark)||benchName()}

/* 开场：命题 → 总判定 → 这一页怎么读 → 下一步。
   顺序照「概览」那一页——那页已经把这件事做对了（期次大字 + 一句灰色说明
   + 三张按「问题→答案→答案强度」排的卡），证据页照抄它的次序即可，
   不必另发明一套。 */
function evidenceLede(rows){
  var sm=(((S||{}).backtest||{}).summary)||{};
  var lvb=sm.live_vs_backfill||{};
  var sigs=rows.filter(function(r){return r.state==='sig'});
  var head=sigs.length
    ? '没有一条选取策略被证明更好——五问里唯一出信号的是「'
      +esc(sigs.map(function(r){return r.short}).join('」「'))+'」'
    : '没有一条选取策略被证明更好——五个问题目前都还分不出';

  var nr=(typeof nextRunInfo==='function')?nextRunInfo():null;
  var next=nr
    ? '下一期 <b class="num">'+esc(nr.date)+'</b>（'+nr.wd+' '+nr.hm+'）跑完，实跑 +1'
      +(lvb.periods_needed?'——离第一个可读点还差 <b>'+fmtInt(lvb.periods_needed)+' 期</b>':'')

/* ── 主链路：读研报 → 选主题 → 写想法 ── */
function mainLine(ag){
  var w=S.weekly||{};
  var gens=w.generators||[];
  var nIdeas=gens.reduce(function(s,g){return s+(g.n||0)},0);
  var hgep=topicArm('hgep');
  var nTopicsAll=(hgep&&hgep.scores)?Object.keys(hgep.scores).length:0;
  var nChosen=topicChosen('hgep').length;
  var poolN=(w.pool||{}).n||0;
  var nCorpus=w.corpus_total||0;
  var insts={};
  Object.keys(w.evidence||{}).forEach(function(t){
    ((w.evidence[t]||{}).docs||[]).forEach(function(d){if(d&&d.institution)insts[d.institution]=1});
  });
  var nInst=Object.keys(insts).length;

  var chev='<svg class="ml-chev" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var pending=w.in_flight?'进行中':'—';

  var STG=[
    {i:0,name:'读研报',
     stat:nCorpus?('<b class="num">'+fmtInt(nCorpus)+'</b> 篇研报'+(nInst?'<span class="sep">·</span><b class="num">'+fmtInt(nInst)+'</b> 家机构':'')):pending,
     more:'研报来源与来源分布'},
    {i:1,name:'选主题',
     stat:nTopicsAll?('<b class="num">'+fmtInt(nTopicsAll)+'</b> 个候选主题<span class="sep">·</span><b class="num">'+fmtInt(nChosen)+'</b> 入选<span class="sep">/</span><b class="num">'+fmtInt(nTopicsAll-nChosen)+'</b> 落选'):pending,
     more:'HGEP 评分与落选理由'},
    {i:2,name:'写想法',
     stat:nIdeas?('<b class="num">'+fmtInt(gens.length)+'</b> 种方法<span class="sep">·</span><b class="num">'+fmtInt(nIdeas)+'</b> 条想法<span class="sep">→</span><b class="num">'+fmtInt(poolN)+'</b> 条候选'):pending,
     /* 这里的数字数的是「几种方法」。别处它是带 tooltip 的彩色标签，
      * 到这一行退化成纯文本后就只剩「AI 端到端 1 · 约束边界 3」——
      * 1 和 3 各是什么，读者无从判断。加上量词，并把解释挂到 title 上。 */
     more:(function(){
       var n={};gens.forEach(function(g){var t=GEN_PATH[g.method];if(t)n[t]=(n[t]||0)+1});
       var parts=['ai','frame','code'].filter(function(t){return n[t]}).map(function(t){return n[t]+' 种 '+PATH_META[t][0]});
       return parts.length?('执行路径：'+parts.join(' · ')):'生成方法与合并候选池';
     })(),
     moreTip:(function(){
       var n={};gens.forEach(function(g){var t=GEN_PATH[g.method];if(t)n[t]=(n[t]||0)+1});
       var used=['ai','frame','code'].filter(function(t){return n[t]});
       if(!used.length)return '';
       return '本环节共 '+gens.length+' 种生成方法，按自动化程度分成：'
         +used.map(function(t){return n[t]+' 种「'+PATH_META[t][0]+'」（'+PATH_META[t][1]+'）'}).join('；');
     })()}
  ];

  var rows=STG.map(function(o){
    var open=!!mlOpen[o.i];
    var head='<button type="button" class="ml-head" onclick="toggleStage('+o.i+')" aria-expanded="'+open+'">'
      +'<span class="ml-idx">0'+(o.i+1)+'</span>'
      +'<span class="ml-name">'+esc(o.name)+'</span>'
      +'<span class="ml-stat">'+o.stat+'</span>'
      /* 摘要只在折叠时有用——它是「里面有什么」。展开之后正文自己会说，
       * 而且说得更细：03 段的「执行路径: 1 种 AI 端到端 · 3 种 约束边界」
       * 在正文第一行原样又画了一遍。展开就把摘要让出去。 */
      +(open?'':'<span class="ml-more"'+(o.moreTip?' title="'+esc(o.moreTip)+'"':'')+'>'+esc(o.more)+'</span>')
      +chev
    +'</button>';
    var body='';
    if(open){
      body='<div class="ml-body">'
        +'<div class="ml-body-head">'+miniChain(o.i,STAGES[o.i]?STAGES[o.i].t:o.name)
        +'<button type="button" class="exp-btn" onclick="event.stopPropagation();openStageDrawer('+o.i+')">在右侧面板打开 ›</button>'
        /* 这里曾经再挂一个「问它为什么选这几个主题」。stageTopicsBody 自己
         * 顶上就有同一个按钮，于是两个一模一样的深绿按钮上下挨着，
         * 点哪个都一样。留正文里那个——抽屉里也是它。 */
        +'</div>'
        +mlStageBody(o.i)
      +'</div>';
    }
    return '<div class="ml-row'+(open?' open':'')+'">'+head+body+'</div>';
  }).join('');

  return '<div class="card mainline section" aria-label="主链路">'
    +'<div class="card-title-row"><h2 class="card-title" style="margin-bottom:0">主链路</h2>'
    +'<span class="card-note">'+esc(w.as_of||'')+' 期'
      +'<span class="gloss gm" title="逐段展开可回溯依据与研报来源。">ⓘ</span></span></div>'
    +rows
    /* 「方法」这一页读者最想问的就是「凭什么这么选」。入口不能只在展开某一段
       之后才出现——那等于要求他先猜对该展开哪一段。所以 02 折着的时候，
       这里补一个。但 02 一展开，它自己顶上就有同一个按钮——那时候这里再放
       一个，就是同一个动作在一屏之内出现两次。展开了就把位置让出去。 */
    +(mlOpen[1]?''
      :'<div style="margin-top:var(--space-4);padding-top:var(--space-4);border-top:1px solid var(--color-border-subtle);'
        +'display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap">'
        +askBtn('selection','topics')
        +'<span style="font:400 12px/18px var(--font-sans);color:var(--color-text-tertiary)">'
          +'问它当时凭什么从 '+fmtInt(nTopicsAll)+' 个候选里选出这几个主题</span>'
      +'</div>')
  +'</div>';
}
function mlStageBody(i){
  try{
    if(i===0)return stageCorpusBody();
    if(i===1)return stageTopicsBody({f:mlFocus[1],scrolled:true});
    return stageGeneratorsBody({f:mlFocus[2]})
      +'<div style="margin-top:var(--space-6);padding-top:var(--space-5);border-top:1px solid var(--color-border-subtle)">'
      +'<div class="card-title-row"><h2 class="card-title" style="margin-bottom:0;font-size:16px">合并候选池</h2>'
      /* 这里曾挂一句「同一标的合并为一条，赔率取中位数」，
       * 而它正下方的大字行写的就是「400 条原始想法 → 同一标的合并、
       * 赔率取中位数 → 73 条候选」。同一句话，隔了一行说两遍。 */
      +'</div>'
      +stagePoolBody({f:null})+'</div>';
  }catch(e){
    return '<div class="empty-sm">该阶段渲染失败（'+esc(e&&e.message?e.message:String(e))+'）</div>';
  }
}
function gotoWeekAnchor(id){scrollToEl($(id))}

/* 状态条：一行体征 + 详情抽屉 */
function statusStrip(){
  var a=S.alive||{},hb=a.heartbeat||{};
  var alive=!!a.ok;
  var synthetic=isSynthetic();
  var inf=inFlightRun();
  var badPorts=(a.ports||[]).filter(function(p){return !p.ok});
  /* ports_pending = 自检还没跑完。空数组不等于「没有异常端口」，
     把未知渲染成正常，就是把「没取到」谎报成「一切正常」。 */
  var portsUnknown=!!a.ports_pending;
  var wkOut=hbOutcome('weekly');
  var curPeriod=(S.schedule||{}).current_period;
  var weeklyFailed=wkOut&&wkOut.action==='failed';
  var weeklyDelegated=wkOut&&wkOut.action==='delegated';
  var cls=!alive?(synthetic?'warn':'bad'):(inf?'run':((weeklyFailed||badPorts.length)?'warn':'ok'));
  var word,sub;
  var lw=lastOkWeekly();
  if(!alive&&synthetic){
    word='调度心跳丢失';
    sub='页面仍可读取已持久化结果，但 scheduler 最近没有写入心跳';
  }else if(!alive){
    word='调度可能已停止';
    sub='最后心跳 '+ageWord(a.age_s);
  }else if(inf){
    var mins=inf.started_at?Math.max(0,Math.round((Date.now()-new Date(inf.started_at).getTime())/60000)):null;
    word='本期周跑进行中';
    sub='读研报 · 选主题 · 写想法 · 筛选持仓'+(mins!==null?'，已运行 '+mins+' 分钟':'')+'，完成后自动建仓';
  }else if(abandonedRun()&&!lastOkWeekly()){
    /* 只有在没有任何成功周产可展示时才把它抬到状态条上：有成功结果时，
     * 一条没收尾的旧运行不该盖过「系统在正常工作」这个更重要的事实。 */
    var ab=abandonedRun();
    word='上一次周跑没有正常收尾';
    sub='run '+esc(String(ab.run_id||'').slice(0,24))+' 于 '+esc(hktFmt(ab.started_at,true))+' 启动后再没有写下结束时间'
      +'（已过去 '+fmtInt(runAgeMin(ab))+' 分钟）——进程多半已中途退出。'+weeklyDurNote()+'展开可查看它停在哪一步。';
  }else if(weeklyDelegated){
    word='运行中 · 本机为观察节点';
    sub='本机仅负责盯市与展示，本期周产由云端生产实例执行；下列为本机组合截至最新收盘的计价'+(lw&&lw.as_of?'（本机最近一次完整周产：'+esc(lw.as_of)+' 期）':'');
  }else if(weeklyFailed){
    word='运行中 · 本期周跑失败';
    sub='心跳记录：'+esc(wkOut.period||curPeriod||'本期')+' 期周跑失败，下列为上一期（'+esc(lw?lw.as_of:'—')+'）结果';
  }else if(badPorts.length){
    word='运行中 · 有告警';
    sub=badPorts.map(function(p){return esc(p.name)}).join(' / ')+' 端口异常';
  }else{
    word='运行正常';
    sub=portsUnknown
      ? '心跳与数据源正常，按周频自动运行；端口自检结果尚未取到'
      : '心跳、端口、数据源均正常，按周频自动运行';
  }
  var p=hktParts();
  var gaps=(S.gaps||[]).length;
  var anchor='今天'+WD[p.wd]+' <span class="num js-now">'+String(p.H).padStart(2,'0')+':'+String(p.M).padStart(2,'0')+'</span>'
    +' · <button type="button" class="exp-btn" style="padding:1px 4px" onclick="openCalDrawer()" title="按期查看运行记录">上次成功'
    +'<span class="gloss" title="每周自动执行一次的全流程：读研报 → 选主题 → 写想法 → 筛选持仓 → 建仓">周跑</span>'
    +(lw?'：'+esc(lw.as_of)+' 期'+(lw.ended_at?'（'+hktFmt(lw.ended_at,true)+'）':''):'：尚无成功记录')+' ›</button>'
    +' · '+nextRunPhrase()
    /* 永久缺失的期次是历史，不是此刻的体征。它此前是一枚红色徽标，排在绿点和
       「运行正常」中间——三个东西同时出现，读起来像在说「正常，但是红的」。
       现在这一行本来就是讲历史与下一次的（上次成功周跑 · 下次几时），它归这里。
       写成文字而不是第二颗按钮：左边那颗「上次成功周跑 ›」去的就是运行记录，
       同一个去处不该在一行里出现两个入口。悬停里的那句话一并摊开——
       「缺失」和「还没跑」是两回事，不写出来读者会等它自己补上。 */
    +(gaps?' · <span style="color:var(--color-feedback-warning-text)">另有 <b class="num">'
        +gaps+'</b> 期永久缺失</span>'
        +'<span class="gloss gm" title="超过 48 小时宽限仍未跑成即判定失败，不补跑：那一期的判断永远不存在，组合里也不会有它的仓。">ⓘ</span>':'');

  return '<div class="card status-card section">'
    +'<button type="button" class="status-line" onclick="openStatusDrawer()" title="查看系统状态">'
      +'<span class="status-dot '+cls+'"></span>'
      +'<span class="status-word">'+word+'<span class="sub">　'+sub+'</span></span>'
      +'<svg class="status-chev" width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true" style="transform:rotate(-90deg)"><path d="M3 5.5 7 9.5 11 5.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>'
    +'</button>'
    +'<div class="anchor-line">'+anchor+'</div>'
  +'</div>';
}

/* ── 迷你链条徽标：这一段 = 过程流水线的哪个环节 ── */
function miniChain(stage,label){
  var svg='<svg width="86" height="14" viewBox="0 0 86 14" aria-hidden="true">';
  for(var i=0;i<6;i++){
    var x=7+i*14;
    if(i)svg+='<line x1="'+(x-11)+'" y1="7" x2="'+(x-3)+'" y2="7" stroke="var(--color-border-default)" stroke-width="1.5"/>';
    svg+='<circle cx="'+x+'" cy="7" r="'+(i===stage?4:2.5)+'" fill="'+(i===stage?'var(--color-surface-brand)':'var(--color-border-strong)')+'"/>';
  }
  svg+='</svg>';
  return '<span class="mini-chain" title="'+esc(label||'')+'——它在链路上的位置">'+svg+'</span>';
}
/* ── Hero = 噪音带：第 2 周「还分不出高下」本身就是画面 ── */
/* 判定所需样本量以前写死 17 周，而后端按各臂实测标准差算出的 required_pairs
 * 是 1-60 期，主策略里最大 34——写死的那个数不是任何一条臂的真实要求，
 * 却还在驱动一根进度条，把编出来的完成度画成实验进度。
 * 改成取主策略里最大的那个要求；取不到才回落到旧常量。
 * 这个要求本身是下限（sd 由重叠窗口估出，会被低估），VERDICT_GLOSS 已说明。 */
var TARGET_WEEKS_FALLBACK=17;
/* `required_pairs` 是**有效独立样本**数，不是周数。后端判定用的是
 * `n_eff >= required_pairs`，而 n_eff = 期数 × 间隔/持有期 —— 每周开一期、
 * 持有 30 天，一期只值 7/30 ≈ 0.23 个独立样本。把要求直接当周数用，等于
 * 把窗口重叠这件事在分子上算了、在分母上忘了：低估 4.3 倍，并且让进度条
 * 把 6/59 画成完成度，而真实是 1.4/59。
 * 上一版已经把写死的 17 周换成实测要求，方向对；漏的是这一步折算。 */
function overlapDiscount(){
  var sum=(((S||{}).backtest||{}).summary)||{};
  var h=Number(sum.horizon_days)||30;
  var gap=Number(((sum.exposure||{}).gap_days))||7;
  var d=gap/h;
  return (isFinite(d)&&d>0)?Math.min(1,d):1;
}
function targetWeeks(){
  var pr=((((S||{}).backtest||{}).summary||{}).paired)||{};
  var main={};
  (typeof SEL_META!=='undefined'?SEL_META:[]).forEach(function(m){if(m[2]==='主策略')main[m[0]]=1});
  var need=[];
  Object.keys(pr).forEach(function(k){
    var v=pr[k]||{};
    if(main[k]&&typeof v.required_pairs==='number')need.push(v.required_pairs);
  });
  if(!need.length)return TARGET_WEEKS_FALLBACK;
  return Math.ceil(Math.max.apply(null,need)/overlapDiscount());
}
/* 单一目标数会盖掉一件事：有的臂已经够了，有的还差得远。
 * 单位与上面同口径——折算成周，否则两个数字并排却量着不同的东西。 */
function targetWeeksSpread(){
  var pr=((((S||{}).backtest||{}).summary||{}).paired)||{};
  var d=overlapDiscount();
  var ns=Object.keys(pr).map(function(k){return (pr[k]||{}).required_pairs})
    .filter(function(v){return typeof v==='number'})
    .map(function(v){return Math.ceil(v/d)});
  if(ns.length<2)return '';
  ns.sort(function(a,b){return a-b});
  return '各组合所需 '+ns[0]+'-'+ns[ns.length-1]+' 周，随实测标准差变化'
    +'（已按窗口重叠折算：一期只值 '+(d).toFixed(2)+' 个有效独立样本）';
}
/* 回测表把 1 天和 30 天的持仓放在一起算胜率，页面却平铺写着「持有期 30 天」。
 * 目标期限确实是 30 天，但最近几期还没跑完——它们的收益是中途读数，
 * 不是完成的交易。把「目标」和「实际已过」分开写，胜率才不会被读成
 * 「30 天交易的胜率」。后端的免责声明详述了前视风险，独独没提这一条。 */
function backtestMaturity(){
  var b=(S&&S.backtest)||{},pos=b.positions||[];
  var sum=b.summary||{},target=Number(sum.horizon_days)||0;
  var byPeriod={};
  pos.forEach(function(x){
    if(!x.entry_d||!x.exit_d)return;
    var d=Math.round((new Date(x.exit_d)-new Date(x.entry_d))/86400000);
    if(!isFinite(d))return;
    var p=x.period||'—';
    if(!byPeriod[p]||d>byPeriod[p])byPeriod[p]=d;
  });
  var ks=Object.keys(byPeriod).sort();
  if(!ks.length)return null;
  var ds=ks.map(function(k){return byPeriod[k]});
  var full=ks.filter(function(k){return target&&byPeriod[k]>=target}).length;
  return {periods:ks,byPeriod:byPeriod,min:Math.min.apply(null,ds),max:Math.max.apply(null,ds),
          full:full,n:ks.length,target:target};
}
var VERDICT_GLOSS='各组合使用同一候选池，净值差异仅来自选取策略。所需样本按各组合实测标准差算，并按窗口重叠折算：每周开一期、持有 30 天，一期只值 7/30 个有效独立样本，所以周数是要求数的约 4.3 倍。按 2 个百分点/月的可检出目标，当前主策略里最苛刻的一条需要数年而不是数月——这是这套设计的真实代价，不是可以绕过的估计误差。要缩短只有两条路：放宽可检出目标（所需样本按 1/差距² 缩小，5pp 时约一年），或降低窗口重叠（缩短持有期，或拉开期次间隔）。此前的排名不构成结论。';

/* 单账/合计净值曲线（期初 = 100） */
function singleCurveSVG(lb){
  var eq=lb.equity||[];
  var base=eq[0].equity||lb.capital||1;
  var vs=eq.map(function(e){return e.equity/base*100});
  var W=760,H=150,pl=44,pr=14,pt=10,pb=22;
  var mn=Math.min.apply(null,vs),mx=Math.max.apply(null,vs);
  if(mx-mn<0.5){mn-=0.5;mx+=0.5}
  function X(i){return pl+i*(W-pl-pr)/Math.max(1,vs.length-1)}
  function Y(v){return pt+(mx-v)/(mx-mn)*(H-pt-pb)}
  var pts=vs.map(function(v,i){return X(i).toFixed(1)+','+Y(v).toFixed(1)}).join(' ');
  var col=vs[vs.length-1]>=100?'var(--color-stock-up-default)':'var(--color-stock-down-default)';
  var svg='<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block;max-width:800px" role="img" aria-label="净值曲线">';
  [mx,100,mn].forEach(function(g){
    if(g<mn-0.01||g>mx+0.01)return;
    svg+='<line x1="'+pl+'" y1="'+Y(g)+'" x2="'+(W-pr)+'" y2="'+Y(g)+'" stroke="var(--color-border-subtle)" stroke-width="1"'+(g===100?' stroke-dasharray="4 3"':'')+'/>'
      +'<text x="'+(pl-6)+'" y="'+(Y(g)+4)+'" text-anchor="end" font-family="var(--font-mono)" font-size="11" fill="var(--color-text-tertiary)">'+g.toFixed(1)+'</text>';
  });
  svg+='<polyline points="'+pts+'" fill="none" stroke="'+col+'" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>';
  svg+='<text x="'+pl+'" y="'+(H-6)+'" font-family="var(--font-mono)" font-size="11" fill="var(--color-text-tertiary)">'+esc(eq[0].d)+'</text>';
  svg+='<text x="'+(W-pr)+'" y="'+(H-6)+'" text-anchor="end" font-family="var(--font-mono)" font-size="11" fill="var(--color-text-tertiary)">'+esc(eq[eq.length-1].d)+'</text>';
  svg+='</svg>';
  return '<div class="funnel-wrap">'+svg+'</div>';
}

  var nbk=(ag&&ag.books)?ag.books.length:0;
  var head='<div class="qhead"><h2 class="qtitle">主题敞口分布<span style="font:400 13px/18px var(--font-sans);color:var(--color-text-tertiary)">　'+(nbk?(nbk+' 个组合合计'):'尚无组合')+'</span></h2>'
    +'<span style="display:flex;gap:var(--space-3);align-items:center">'+miniChain(5,'建仓 · 持仓束')
    +'<span role="group" aria-label="视图切换">'
      +'<button type="button" class="seg-btn'+(holdView==='map'?' on':'')+'" onclick="setHoldView(\'map\')" title="按宏观主题分组的持仓分布">地图</button>'
      +'<button type="button" class="seg-btn'+(holdView==='axis'?' on':'')+'" onclick="setHoldView(\'axis\')" title="横轴为跨策略共识度，纵轴为当前浮动盈亏">Y 轴</button>'
      +'<button type="button" class="seg-btn'+(holdView==='list'?' on':'')+'" onclick="setHoldView(\'list\')" title="逐仓明细表，可排序">列表</button>'
      +'</span>'
    +'<button type="button" class="qlink" onclick="openStageDrawer(5)">建仓详情 →</button>'
    +'</span></div>';
  if(!ag||!ag.openN){
    var nr=nextRunInfo();
    var line=w.in_flight
      ?'选仓进行中，完成后载入持仓分布。'
      :'当前无在场持仓'+(nr?'，下次建仓 '+esc(nr.date)+'（'+nr.wd+' '+nr.hm+'），还有 <span class="js-cd num">'+cdShort(nr.secs)+'</span>':'（接口未提供下次建仓时刻）')+'。';
    return '<div class="card section" id="holdCard">'+head
      +stepperHTML()
      +'<div class="quiet" style="text-align:center;margin-top:var(--space-2)">'+line+'</div>'
    +'</div>';
  }
  var mp=mergedPositions();
  var byCode=mp.byCode,order=mp.order;
  var totalV=0,maxV=1;
  order.forEach(function(k){totalV+=byCode[k].value;maxV=Math.max(maxV,byCode[k].value)});
  /* 这张图有四条编码规则要先学（泡的大小、颜色、徽标、分组）读者才看得懂，
     等于让人自己看图归纳。先把归纳好的结论写成一句话，图留给要核对的人。 */
  var tg={},tOrder=[];
  order.forEach(function(k){
    var pp=byCode[k],t=pp.theme_id||'（无主题记录）';
    if(!tg[t]){tg[t]={value:0,unreal:0,n:0};tOrder.push(t)}
    tg[t].value+=pp.value;tg[t].unreal+=pp.unrealized;tg[t].n++;
  });
  /* 各主题按自身成本的收益率。只看绝对盈亏会把「仓位大」读成「表现差」：
     通胀 31% 仓位亏 15,836、欧洲 9% 仓位亏 3,493，金额差 4.5 倍，
     收益率却是 −0.26% 对 −0.19%，几乎一样。排名需要共同的分母。 */
  tOrder.forEach(function(t){
    var cost=tg[t].value-tg[t].unreal;
    tg[t].ret=cost?(tg[t].unreal/cost*100):null;
  });
  function themeName(t){return t==='（无主题记录）'?t:(topicLabel(t)||t)}
  var byVal=tOrder.slice().sort(function(a,b){return tg[b].value-tg[a].value});
  var byPnl=tOrder.slice().sort(function(a,b){return tg[b].unreal-tg[a].unreal});
  var lead='';
  if(byVal.length){
    var t0=byVal[0],tb=byPnl[0],tw=byPnl[byPnl.length-1];
    var pctOf=function(t){return totalV?(tg[t].value/totalV*100).toFixed(0):'0'};
    var money=function(t){return '<span class="num '+pctCls(tg[t].unreal)+'">'+signedMoney(tg[t].unreal)+'</span>'};
    var perf=function(t){return tg[t].ret===null?'—'
      :'<span class="num '+pctCls(tg[t].ret)+'">'+fmtPct(tg[t].ret)+'</span>'};
    /* 排名按收益率，不按金额——金额随仓位缩放。 */
    byPnl=tOrder.slice().sort(function(a,b){
      return (tg[b].ret===null?-1e9:tg[b].ret)-(tg[a].ret===null?-1e9:tg[a].ret);
    });
    tb=byPnl[0];tw=byPnl[byPnl.length-1];
    /* 仓位最重的往往也是赚最多的，分成两句会把同一个主题念两遍。 */
    /* 仓位最重的往往也是表现最好的，分成两句会把同一个主题念两遍。 */
    if(tb&&tb===t0&&tg[tb].ret>0){
      lead='仓位最重、表现也最好的是<b>'+esc(themeName(t0))+'</b>（'
        +pctOf(t0)+'% 仓位 · '+tg[t0].n+' 个标的 · '+perf(t0)+' · '+money(t0)+'）';
    }else{
      lead='仓位最重的是<b>'+esc(themeName(t0))+'</b>（'+pctOf(t0)+'% 仓位 · '+tg[t0].n+' 个标的）';
      if(tb&&tg[tb].ret>0)
        lead+='；表现最好的是<b>'+esc(themeName(tb))+'</b> '+perf(tb)+'（'+money(tb)+'）';
    }
    if(tw&&tw!==tb&&tg[tw].ret<0)
      lead+='；最差的是<b>'+esc(themeName(tw))+'</b> '+perf(tw)+'（'+money(tw)+'）';
    lead+='。<span class="card-note">各主题的收益率按自身成本计，金额随仓位大小缩放，'
      +'直接比金额会把仓位重读成表现差。</span>';
  }
  var body;
  if(holdView==='list'){
    body=holdListTable(ag,mp);
  }else if(holdView==='axis'){
    body=holdAxisBody(ag,mp,totalV,maxV);
  }else{
    /* 按主题分组 */
    var groups={},gOrder=[];
    order.forEach(function(k){
      var p=byCode[k];
      var t=p.theme_id||'（无主题记录）';
      if(!groups[t]){groups[t]={list:[],value:0,unreal:0};gOrder.push(t)}
      groups[t].list.push(p);groups[t].value+=p.value;groups[t].unreal+=p.unrealized;
    });
    gOrder.sort(function(a,b){return groups[b].value-groups[a].value});
    var nb=ag.books.length;
    body='<div class="hm-legend"><span>按宏观主题分组，每个圆点是一个标的（一个标的只画一次）'
      +(HOLD_OPEN_N?'　<span style="color:var(--color-text-tertiary)">默认展开占仓位前 '+HOLD_OPEN_CUM+'% 的 '+HOLD_OPEN_N+' 个主题，其余点开</span>':'')
      +'<span class="gloss" title="分组口径：当前持仓来自好几期，同一个标的在不同期可能被记到不同主题（本期有 '+multiThemeN()+' 个标的是这样）。这里按标的去重、只归入其中一个主题，所以一个主题名下的圆点数会少于它历史上出现过的标的数。'
      +'圆点大小 = 该标的的仓位市值；颜色 = 浮动盈亏方向与幅度（绿涨红跌）；'
      +'徽标 n/'+nb+' = 同时选中该标的的组合数——'+nb+' 个选取策略各管一个组合，被越多组合独立选中，跨策略共识度越高，≥6 个加亮描边">ⓘ 图例</span></span></div>';
    /* 主题是一层，标的是另一层。从前十二个主题全部处于展开态，六百多个气泡
       一次铺完，两层被压成一层；但全部收起又走到另一个极端——整页一张图没有，
       只剩九行数字。默认展开的是「占到八成仓位的那几个主题」，长尾收起：
       该看的图还在，看不完的部分才需要点。人一旦动过就以人的选择为准。 */
    if(!HOLD_OPEN){
      HOLD_OPEN={};var cum=0;
      gOrder.forEach(function(t){
        if(cum>=HOLD_OPEN_SHARE)return;
        HOLD_OPEN[t]=true;cum+=totalV?(groups[t].value/totalV*100):0;
      });
      HOLD_OPEN_N=Object.keys(HOLD_OPEN).length;HOLD_OPEN_CUM=Math.round(cum);
    }
    gOrder.forEach(function(t){
      var g=groups[t];
      g.list.sort(function(a,b){return b.value-a.value});
      var share=totalV?(g.value/totalV*100):0;
      var isTopic=t!=='（无主题记录）';
      var hOpen=!!HOLD_OPEN[t];
      var cost0=g.value-g.unreal,r0=cost0?(g.unreal/cost0*100):null;
      body+='<div class="hm-group" data-open="'+(hOpen?1:0)+'">'
        +'<div class="hm-head-row">'
        +'<button type="button" class="hm-head" aria-expanded="'+(hOpen?'true':'false')+'"'
          +' onclick="holdToggle(\''+jss(t)+'\')" title="'+(hOpen?'收起':'展开')+'该主题的 '+g.list.length+' 个标的">'
          +foldChev()
          /* 中文名打头、英文代号降为次要：读者认的是「央行政策路径与流动性」，
             不是 POLICY-PATH。同一主题在别处也照这个次序显示。 */
          +'<i class="thm-sw" style="background:'+themeColor(t)+'"></i>'
          +'<span class="hm-t">'+esc(isTopic?(topicLabel(t)||t):t)+'</span>'
          +(isTopic?'<span class="hm-c mono">'+esc(t)+'</span>':'')
          +'<span class="hm-s num">'+share.toFixed(0)+'% 仓位 · '+g.list.length+' 标的 · '
            +(r0===null?'':'<span class="'+pctCls(r0)+'">'+fmtPct(r0)+'</span> · ')
            +'<span class="'+pctCls(g.unreal)+'">'+signedMoney(g.unreal)+'</span></span>'
        +'</button>'
        +'</div>'
        /* 追问和「主题评分与证据」是同一层，都跟着展开走。收起态里九行主题
           各挂一颗实心药丸，九颗一模一样的按钮比它们要引导去的内容还抢眼，
           而那一行本身已经是入口了。 */
        +'<div class="hm-cloud"'+(hOpen?'':' style="display:none"')+'>'
        +(isTopic?'<span class="hm-acts">'+askBtn('topic',t,{stop:true,cls:'sm'})
          +'<button type="button" class="exp-btn" onclick="event.stopPropagation();openTopicDrawer(\''+jss(t)+'\')">主题评分与证据 ›</button></span>':'')
        +g.list.map(function(p){
          var d=Math.round(30+Math.sqrt(p.value/maxV)*54);
          var pct=p.cost?(p.unrealized/p.cost*100):0;
          var up=p.unrealized>0.0001,down=p.unrealized<-0.0001;
          var a=Math.min(0.62,0.12+Math.abs(pct)*0.10);
          var bg,fg;
          /* 底色是半透明填充，只能写死 rgb——和上面七个令牌一起翻。 */
          if(up){bg='rgba(11,143,74,'+a.toFixed(2)+')';fg=a>0.38?'#ffffff':'var(--color-stock-up-text)'}
          else if(down){bg='rgba(191,22,22,'+a.toFixed(2)+')';fg=a>0.38?'#ffffff':'var(--color-stock-down-text)'}
          else{bg='var(--color-surface-muted)';fg='var(--color-text-metadata)'}
          var share1=totalV?(p.value/totalV*100):0;
          var th=String(p.thesis||'');if(th.length>64)th=th.slice(0,63)+'…';
          var nb2=ag.books.length;
          var ph='<div class="pp-t">'+esc(p.name||bareCode(p.code))+' <span class="mono" style="font-weight:400;color:var(--color-text-tertiary)">'+esc(bareCode(p.code))+'</span></div>'
            +'<div class="pp-n"><span class="'+pctCls(p.unrealized)+'">'+signedMoney(p.unrealized)+'（'+fmtPct(pct)+'）</span> · 仓位 '+share1.toFixed(1)+'%</div>'
            +(th?'<div>'+esc(th)+'</div>':'')
            +'<div class="pp-s">'+fmtInt(p.books.length)+'/'+nb2+' 个组合共同持有'+(p.theme_id?' · 主题 '+esc(p.theme_id):'')+'</div>';
          /* 聚焦某一期时压暗其余——不隐藏。这一页要讲的正是「现在拿着的
             东西来自好几期」，藏起来就把它讲没了。跨期持有的标的照常亮着。 */
          var offP=(PERIOD&&p.periods&&!p.periods[PERIOD])?' off':'';
          return '<button type="button" class="hbub'+(p.books.length>=6?' hi':'')+offP+'" style="width:'+d+'px;height:'+d+'px;background:'+bg+';color:'+fg+'"'
            +popRef(ph)
            +' onclick="openPosDrawer(\''+jss(p.code)+'\')">'
            +esc(bareCode(p.code))
            +(d>=46?'<span class="bp '+'">'+fmtPct(pct)+'</span>':'')
            +'<span class="bb">'+p.books.length+'/'+nb2+'</span>'
            +'</button>';
        }).join('')
        +'</div></div>';
    });
    body+=epi('等权买入 · '+gloss('σ×2 止损 / σ×3 止盈',SIGMA_GLOSS)+'自动执行 · 盈亏为全部组合合计');
  }
  return '<div class="card section" id="holdCard">'+head
    +(lead?'<div style="font:400 15px/23px var(--font-sans);color:var(--color-text-primary);margin:var(--space-2) 0 var(--space-2)">'+lead+'</div>':'')
    +'<div class="quiet" style="margin-bottom:var(--space-3)">共 '+fmtInt(order.length)+' 个标的，'+fmtInt(ag.books.length)+' 个组合合计持有 '+fmtInt(ag.openN)+' 仓</div>'
    /* 主链路第 02 步列出本期入选的 5 个主题，这张图列出持仓覆盖的主题——
     * 当前两套只重合 3 个。原因是持仓建于上一期，按的是上一期的选题；
     * 本期选出的主题还在挂单、没有仓位。不写出来，读者会以为两处有一处错了。 */
    +(function(){
      var chosen=topicChosen('hgep');
      if(!chosen.length)return '';
      var held={};order.forEach(function(k){var t=byCode[k].theme_id;if(t)held[t]=1});
      var stale=Object.keys(held).filter(function(t){return chosen.indexOf(t)<0}).sort();
      var unfilled=chosen.filter(function(t){return !held[t]});
      if(!stale.length&&!unfilled.length)return '';
      var per=(S.weekly||{}).as_of;
      var pend=Number(ag.pending)||0;
      /* 这句原本是 firstBookedDate(ag.books)——最早那个 opened_d，被当成
         「当前持仓建于哪一期」在用。两处都不对：opened_d 是撮合当天而不是
         期次，取最小值又只描述了最老的那批。现在按真实期次数出来。 */
      var vs={};(ag.books||[]).forEach(function(b){
        (b.open_positions||[]).forEach(function(x){if(x.as_of)vs[x.as_of]=1});
      });
      var vk=Object.keys(vs).sort();
      var msg=vk.length>1
        ? ('当前持仓来自 <b>'+vk.length+' 期</b>（'+esc(vk[0])+' … '+esc(vk[vk.length-1])
           +'），各按其所属那一期选出的主题——这是四周滚动本来的样子，'
           +'<button type="button" class="qlink" style="padding:0" onclick="goto(\'periods\')">看阶梯 →</button>。')
        : ('当前持仓来自 '+esc(vk[0]||'—')+' 期，按的是那一期选出的主题。');
      if(stale.length)msg+='其中 <b>'+stale.map(function(t){return esc(topicName(t))}).join('、')+'</b> 不在本期（'+esc(per||'—')+'）入选之列。';
      if(unfilled.length)msg+='本期新选出的 <b>'+unfilled.map(esc).join('、')+'</b> 还没有仓位'
        +(pend?'——'+fmtInt(pend)+' 笔挂单待成交':'')+'。';
      return '<div class="hm-note">'+msg
        +'<span class="gloss gm" title="组合按 4 周滚动建仓，每周只换掉其中一批；已建的仓按原风控持有到期或触发止损止盈，不会因为主题这一期没入选就被强制平掉。所以「本期选了哪些主题」和「现在持有哪些主题」本来就不该完全一致——两处都对。">ⓘ</span>'
        +'</div>';
    })()
    +body
  +'</div>';
}
/* ── Y 轴视图 ──────────────────────────────────────────────────
 * 地图呈现主题敞口分布，列表呈现具体持仓，
 * 本图检验：跨策略共识度高的持仓，收益是否更好。
 * 横轴 = 同时持有该标的的组合数（跨组合共识度），纵轴 = 该仓位当前盈亏。
 * 共识本身不加分、不参与挑选，所以它与收益的关系是可以事后检验的——
 * 正斜率方说明跨策略共识度具有信息量。 */
function holdAxisBody(ag,mp,totalV,maxV){
  var byCode=mp.byCode,order=mp.order;
  var nb=ag.books.length||1;
  var pts=order.map(function(k){
    var p=byCode[k];
    return {p:p,x:p.books.length,y:p.cost?(p.unrealized/p.cost*100):0};
  });
  if(!pts.length)return '<div class="quiet">没有可作图的持仓。</div>';
  var ys=pts.map(function(o){return o.y});
  var yMax=Math.max.apply(null,ys),yMin=Math.min.apply(null,ys);
  var pad=Math.max(0.6,(yMax-yMin)*0.18);
  yMax+=pad;yMin-=pad;
  if(yMax===yMin){yMax+=1;yMin-=1}
  var W=1000,H=380,pl=64,pr=22,pt=18,pb=54;
  function X(v){return pl+(nb<=1?0.5:(v-1)/(nb-1))*(W-pl-pr)}
  function Y(v){return pt+(yMax-v)/(yMax-yMin)*(H-pt-pb)}
  var g='<svg class="pipe-svg" viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="持仓：跨组合共识 × 盈亏">';
  /* 横向刻度 */
  var ticks=4;
  for(var i=0;i<=ticks;i++){
    var v=yMin+(yMax-yMin)*i/ticks,y=Y(v);
    g+='<line x1="'+pl+'" y1="'+y.toFixed(1)+'" x2="'+(W-pr)+'" y2="'+y.toFixed(1)+'" stroke="var(--color-border-subtle)" stroke-width="1"/>'
      +'<text x="'+(pl-8)+'" y="'+(y+4).toFixed(1)+'" text-anchor="end" font-family="var(--font-mono)" font-size="10" fill="var(--color-text-tertiary)">'+v.toFixed(1)+'%</text>';
  }
  /* 零线 */
  if(yMin<0&&yMax>0){
    g+='<line x1="'+pl+'" y1="'+Y(0).toFixed(1)+'" x2="'+(W-pr)+'" y2="'+Y(0).toFixed(1)+'" stroke="var(--color-border-strong)" stroke-width="1.5" stroke-dasharray="5 4"/>'
      +'<text x="'+(W-pr)+'" y="'+(Y(0)-6).toFixed(1)+'" text-anchor="end" font-family="var(--font-sans)" font-size="10" fill="var(--color-text-metadata)">不赚不亏</text>';
  }
  /* 每个共识档的均值折线——这条线的斜率就是问题的答案 */
  var buckets={};
  pts.forEach(function(o){(buckets[o.x]=buckets[o.x]||[]).push(o.y)});
  var bKeys=Object.keys(buckets).map(Number).sort(function(a,b){return a-b});
  var poly=bKeys.map(function(k){
    var arr=buckets[k],m=arr.reduce(function(a,b){return a+b},0)/arr.length;
    return X(k).toFixed(1)+','+Y(m).toFixed(1);
  }).join(' ');
  if(bKeys.length>1){
    /* 参考线不能再用绿：盈亏改成绿涨红跌之后，一条绿线会被读成「这些在赚钱」。
       它衡量的是共识度分档的平均值，不是方向，所以用中性的墨色。 */
    g+='<polyline points="'+poly+'" fill="none" stroke="var(--color-text-secondary)" stroke-width="2.5" stroke-linejoin="round" opacity="0.5"/>';
    bKeys.forEach(function(k){
      var arr=buckets[k],m=arr.reduce(function(a,b){return a+b},0)/arr.length;
      g+='<circle cx="'+X(k).toFixed(1)+'" cy="'+Y(m).toFixed(1)+'" r="3.5" fill="var(--color-fill-brand-green)"/>';
    });
  }
  /* X 轴刻度 */
  for(var b=1;b<=nb;b++){
    g+='<text x="'+X(b).toFixed(1)+'" y="'+(H-pb+22)+'" text-anchor="middle" font-family="var(--font-mono)" font-size="10" fill="var(--color-text-tertiary)">'+b+'</text>';
    var cnt=(buckets[b]||[]).length;
    if(cnt)g+='<text x="'+X(b).toFixed(1)+'" y="'+(H-pb+36)+'" text-anchor="middle" font-family="var(--font-sans)" font-size="9" fill="var(--color-text-disabled)">'+cnt+' 只</text>';
  }
  g+='<text x="'+((pl+W-pr)/2)+'" y="'+(H-4)+'" text-anchor="middle" font-family="var(--font-sans)" font-size="10.5" fill="var(--color-text-metadata)">横轴 = 跨组合共识度：同时持有该标的的组合数（共 '+nb+' 本）</text>'
   +'<text x="14" y="'+(pt+10)+'" font-family="var(--font-sans)" font-size="10.5" fill="var(--color-text-metadata)">纵轴 = 该仓位当前盈亏</text>';
  /* 蜂群排布：同一档里的泡沿横轴让开彼此。
   * 固定步长的抖动在这里不够用——泡的半径随仓位从 7 变到 24，
   * 一个 6px 的错位会让五个大泡叠成一坨，图上就只剩最上面那一个可读。
   * 所以按半径找位：从档位中心往两侧试，第一个不压到已放置的泡的位置就是它的位置。 */
  var placed=[];
  /* 让开的范围不能超过半个档距，否则泡会飘进隔壁档，横轴上的位置就骗人了。
   * 检查也必须是全局的：只跟同档比较，隔壁档挤过来的泡照样会压上。 */
  var halfSpan=(nb>1?(X(2)-X(1)):(W-pl-pr))/2-3;
  pts.sort(function(a,b){return b.p.value-a.p.value});
  var radii=pts.map(function(o){return Math.max(7,Math.round(7+Math.sqrt(o.p.value/maxV)*17))});
  pts.forEach(function(o,pi){
    var p=o.p;
    var r=radii[pi];
    var base=X(o.x),cy=Y(o.y);
    var cx=base,bestX=base,bestRoom=-Infinity;
    for(var step=0;;step++){
      var off=(step===0)?0:(Math.ceil(step/2)*7*(step%2?1:-1));
      if(Math.abs(off)>halfSpan){cx=bestX;break}
      var tryX=Math.max(pl-4,Math.min(W-pr+4,base+off));
      /* room = 离最近的泡还差多少才算贴上；>=0 表示互不遮挡 */
      var room=Infinity;
      for(var q=0;q<placed.length;q++){
        var o2=placed[q];
        var dx=tryX-o2.x,dy=cy-o2.y;
        room=Math.min(room,Math.sqrt(dx*dx+dy*dy)-(r+o2.r)*0.86);
      }
      if(room>=0){cx=tryX;break}
      if(room>bestRoom){bestRoom=room;bestX=tryX}
    }
    placed.push({x:cx,y:cy,r:r});
    var up=p.unrealized>0.0001,down=p.unrealized<-0.0001;
    var a=Math.min(0.66,0.16+Math.abs(o.y)*0.10);
    var fill=up?('rgba(11,143,74,'+a.toFixed(2)+')'):(down?('rgba(191,22,22,'+a.toFixed(2)+')'):'var(--color-surface-muted)');
    var stroke=up?'var(--color-stock-up-default)':(down?'var(--color-stock-down-default)':'var(--color-border-strong)');
    var share1=totalV?(p.value/totalV*100):0;
    var th=String(p.thesis||'');if(th.length>64)th=th.slice(0,63)+'…';
    var ph='<div class="pp-t">'+esc(p.name||bareCode(p.code))+' <span class="mono" style="font-weight:400;color:var(--color-text-tertiary)">'+esc(bareCode(p.code))+'</span></div>'
      +'<div class="pp-n"><span class="'+pctCls(p.unrealized)+'">'+signedMoney(p.unrealized)+'（'+fmtPct(o.y)+'）</span> · 仓位 '+share1.toFixed(1)+'%</div>'
      +(th?'<div>'+esc(th)+'</div>':'')
      +'<div class="pp-s">'+o.x+'/'+nb+' 个组合共同持有'+(p.theme_id?' · 主题 '+esc(p.theme_id):'')+'</div>';
    g+='<g class="pc-click" onclick="openPosDrawer(\''+jss(p.code)+'\')"'+popRef(ph)+'>'
      +'<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="'+r+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="1.2" opacity="0.92"/>'
      +(r>=13?'<text x="'+cx.toFixed(1)+'" y="'+(cy+3.5).toFixed(1)+'" text-anchor="middle" font-family="var(--font-mono)" font-size="9" font-weight="600" fill="'+(a>0.42?'#fff':'var(--color-text-primary)')+'">'+esc(bareCode(p.code))+'</text>':'')
      +'</g>';
  });
  g+='</svg>';
  /* 一句读法：这条线现在是什么形状 */
  var read='';
  if(bKeys.length>1){
    var lo=buckets[bKeys[0]],hi=buckets[bKeys[bKeys.length-1]];
    var mLo=lo.reduce(function(a,b){return a+b},0)/lo.length;
    var mHi=hi.reduce(function(a,b){return a+b},0)/hi.length;
    var d=mHi-mLo;
    read='共识度最低档（'+bKeys[0]+' 个组合）平均 '+mLo.toFixed(2)+'%，最高档（'+bKeys[bKeys.length-1]+' 个组合）平均 '+mHi.toFixed(2)+'%，'
      +(Math.abs(d)<0.3?'两端差异不显著，跨策略共识度当前未体现增量。'
        :(d>0?'高共识端高出 '+d.toFixed(2)+' 个百分点。':'高共识端低 '+Math.abs(d).toFixed(2)+' 个百分点。'))
      +'当前样本量下仅为读数，不构成结论。';
  }
  /* .pipe-svg 有 940px 的最小宽度，必须裹在自己的横滚容器里——
   * 否则窄屏上它会把整页撑出横向滚动条。流水线画布一直是这么包的。 */
  return '<div class="hm-legend"><span>泡的大小 = 仓位市值</span><span>颜色 = 盈亏方向（绿涨红跌）</span><span>深色线 = 各共识档的平均盈亏</span></div>'
    +'<div class="pipe-wrap scroll-thin">'+g+'</div>'
    +(read?'<div class="quiet" style="margin-top:var(--space-3)">'+read+'</div>':'')
    +epi('共识度只记录、不计分——它不参与选取，因此它与收益的关系是可事后检验的');
}

  });

  function Y(v){return pt+(mx-v)/(mx-mn)*(H-pt-pb)}

  [mx,100,mn].forEach(function(g){

  ends.sort(function(a,b){return a.y-b.y});

      +'<text x="'+(X(e.li)+8)+'" y="'+(ly+4).toFixed(1)+'" font-family="var(--font-sans)" font-size="11" fill="'+e.s.col+'">'+esc(e.s.name)+' '+e.s.vals[e.li].toFixed(1)+'</text>';
  });

    +'<text x="'+(W-pr)+'" y="'+(H-6)+'" text-anchor="end" font-family="var(--font-mono)" font-size="11" fill="var(--color-text-tertiary)">'+esc(ds[ds.length-1])+'</text>'
    +'</svg>';

function shortName(s){s=String(s||'');return s.length>8?s.slice(0,7)+'…':s}
/* 一组标签的短名，保证互不相同。定长截断在这里会出事：
 * 「来源限定 · AI 端到端」和「来源限定 · 约束边界」都会截成「来源限定 · A…」，
 * 两列表头一模一样，而它们恰好是配对比较的两条臂——正是最不能混的一对。
 * 撞了就逐字加长，加到全名仍撞才退回带序号。 */
function uniqueShorts(labels,maxLen){
  var cap=maxLen||8;
  var lens=labels.map(function(l){return Math.min(String(l||'').length,cap)});
  var cut=function(l,n){l=String(l||'');return l.length>n?l.slice(0,n)+'…':l};
  for(var guard=0;guard<40;guard++){
    var seen={},dup=false;
    labels.forEach(function(l,i){
      var k=cut(l,lens[i]);
      (seen[k]=seen[k]||[]).push(i);
    });
    Object.keys(seen).forEach(function(k){
      if(seen[k].length<2)return;
      dup=true;
      seen[k].forEach(function(i){
        if(lens[i]<String(labels[i]||'').length)lens[i]++;
      });
    });
    if(!dup)break;
  }
  return labels.map(function(l,i){return cut(l,lens[i])});
}

/* ── 策略 × 主题分布：并列各策略的主题权重，差异即策略间 diff ── */
function themeMixCard(books){
  if(!books||!books.length)return '';
  var tot={},mix=[];
  books.forEach(function(b){
    var by={},sum=0;
    (b.open_positions||[]).forEach(function(p){
      var t=p.theme_id||'未归类';
      var v=Math.abs((p.qty||0)*(p.last_px||p.entry_px||0))||1;
      by[t]=(by[t]||0)+v;sum+=v;tot[t]=(tot[t]||0)+v;
    });
    mix.push({b:b,by:by,sum:sum,n:(b.open_positions||[]).length});
  });
  var themes=Object.keys(tot).sort(function(a,b){return tot[b]-tot[a]});
  if(!themes.length)return '';
  var grand=themes.reduce(function(a,t){return a+tot[t]},0)||1;
  var avgW={};themes.forEach(function(t){avgW[t]=tot[t]/grand});

  var legend='<div class="tmx-legend">'+themes.map(function(t,i){
    return '<span title="'+esc(t)+'"><i style="background:'+themeColor(t)+'"></i>'+esc(topicName(t))+' '+(avgW[t]*100).toFixed(0)+'%</span>';
  }).join('')+'</div>';

  var order=SEL_META.map(function(m){return m[0]});
  mix.sort(function(a,b){
    var x=order.indexOf(a.b.selector),y=order.indexOf(b.b.selector);
    return (x<0?99:x)-(y<0?99:y);
  });

  var rows=mix.map(function(o){
    var m=selMetaOf(o.b.selector);
    var segs='',dev=null;
    if(o.sum>0){
      segs=themes.filter(function(t){return o.by[t]}).map(function(t){
        var w=o.by[t]/o.sum;
        var d=w-avgW[t];
        if(dev===null||Math.abs(d)>Math.abs(dev.d))dev={t:t,d:d,w:w};
        return '<span class="tmx-seg" style="width:'+(w*100).toFixed(2)+'%;background:'+themeColor(t)+'" '
          +'title="'+esc(topicName(t))+' '+(w*100).toFixed(1)+'%（全策略均值 '+(avgW[t]*100).toFixed(1)+'%，'
          +(d>=0?'超配 +':'低配 −')+Math.abs(d*100).toFixed(1)+' pp）"></span>';
      }).join('');
    }
    var devTxt=dev?((dev.d>=0?'超配 ':'低配 ')+topicName(dev.t)+' '+(dev.d>=0?'+':'−')+Math.abs(dev.d*100).toFixed(0)+'pp'):'—';
    return '<button type="button" class="tmx-row'+(m[2]==='对照'?' ctl':'')+'" onclick="openBookDrawer(\''+jss(o.b.selector||'')+'\')" '
      +'title="'+esc(m[1])+' · '+o.n+' 仓 · 相对全策略均值最大偏离：'+esc(devTxt)+'">'
      +'<span class="tmx-name">'+esc(m[1])+'</span>'
      +'<span class="tmx-bar">'+(segs||'<span class="tmx-seg" style="width:100%;background:var(--color-surface-sunken)"></span>')+'</span>'
      +'<span class="tmx-n">'+(o.n?o.n+' 仓':'空仓')+'</span>'

  }).join('');

    +legend+rows

function sparkline(eq){
  if(!eq||eq.length<2)return '<span class="card-note">净值待累积</span>';
  var w=140,h=36,p=3;
  var vs=eq.map(function(e){return e.equity});

  var lp=pts[pts.length-1].split(',');
  return '<svg class="spark" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" aria-label="净值走势">'
    +'<polyline points="'+pts.join(' ')+'" fill="none" stroke="'+col+'" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>'
    +'<circle cx="'+lp[0]+'" cy="'+lp[1]+'" r="2.5" fill="'+col+'"/></svg>';
}
