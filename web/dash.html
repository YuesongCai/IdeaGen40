<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IdeaGen40 · 运行台</title>
<style>
/* ════════════════════════════════════════════════════════════════
 * Nexus Design Tokens — inlined subset from nexus-design-system/tokens.css
 * (token layer; component CSS below references ONLY var(--...))
 * ════════════════════════════════════════════════════════════════ */
:root{
  /* surface */
  --color-surface-white:#ffffff;
  --color-surface-default:#f7f7f7;
  --color-surface-subtle:#f2f3f3;
  --color-surface-muted:#eceeee;
  --color-surface-sunken:#e4e4e4;
  --color-surface-inverse:#1a1a1a;
  --color-surface-brand-subtle:#f3f8ed;
  --color-surface-brand-muted:#edf5e2;
  --color-surface-brand-highlight:#e4f0d4;
  --color-surface-brand-sunken:#d7f0b6;
  --color-surface-brand-strong:#2f8355;
  --color-surface-brand:#204732;
  /* fill */
  --color-fill-primary:#1a1a1a;
  --color-fill-secondary:#3d3d3d;
  --color-fill-tertiary:#858c8c;
  --color-fill-disabled:#b8b8b8;
  --color-fill-inverse:#fbfbfb;
  --color-fill-brand:#204732;
  --color-fill-brand-green:#2f8355;
  --color-fill-on-brand:#fbfbfb;
  /* accent (Nexus Lime — never a text colour) */
  --color-accent:#b8ff3a;
  --color-focus-ring:#cef79e;
  /* text */
  --color-text-primary:#1a1a1a;
  --color-text-secondary:#3d3d3d;
  --color-text-tertiary:#858c8c;
  --color-text-disabled:#b8b8b8;
  --color-text-inverse:#fbfbfb;
  --color-text-on-brand:#fbfbfb;
  --color-text-brand:#204732;
  --color-text-brand-hover:#246e47;
  --color-text-metadata:#525252;
  /* border */
  --color-border-subtle:#eceeee;
  --color-border-default:#e4e4e4;
  --color-border-strong:#b8bdbd;
  --color-border-brand:#204732;
  --color-border-brand-subtle:#97c1aa;
  --color-border-table:#d8dce3;
  /* action */
  --color-action-primary-default:#204732;
  --color-action-primary-hover:#1b5a39;
  --color-action-primary-pressed:#163323;
  --color-action-primary-disabled:#b8bdbd;
  /* feedback */
  --color-feedback-success-subtle:#f0faf5;
  --color-feedback-success-default:#0b8f4a;
  --color-feedback-success-strong:#08733c;
  --color-feedback-success-text:#065a2f;
  --color-feedback-warning-subtle:#fff7e8;
  --color-feedback-warning-default:#d5880c;
  --color-feedback-warning-strong:#b8740a;
  --color-feedback-warning-text:#9a6208;
  --color-feedback-error-subtle:#fff1f1;
  --color-feedback-error-default:#bf1616;
  --color-feedback-error-strong:#8f1010;
  --color-feedback-error-text:#6f0c0c;
  --color-feedback-info-subtle:#f0f8ff;
  --color-feedback-info-default:#1262c0;
  --color-feedback-info-text:#093270;
  --color-feedback-neutral-subtle:#f5f5f5;
  --color-feedback-neutral-default:#949494;
  --color-feedback-neutral-text:#525252;
  /* stock — 红涨绿跌（中国大陆惯例，勿改） */
  --color-stock-up-subtle:#fff1f1;
  --color-stock-up-default:#bf1616;
  --color-stock-up-text:#8f1010;
  --color-stock-down-subtle:#f0faf5;
  --color-stock-down-default:#0b8f4a;
  --color-stock-down-text:#08733c;
  --color-stock-flat-text:#525252;
  /* data classification series (Tag 数据分类色系，非状态语义 — 图表系列专用) */
  --color-data-1:#204732;
  --color-data-2:#2f8355;
  --color-data-3:#1262c0;
  --color-data-4:#6b7db3;
  --color-data-5:#7856c0;
  --color-data-6:#c05899;
  --color-data-7:#d5880c;
  --color-data-8:#858c8c;
  /* typography */
  --font-sans:'SF Pro Display','PingFang SC','Noto Sans SC',-apple-system,BlinkMacSystemFont,'Helvetica Neue','Microsoft YaHei','Hiragino Sans GB','Segoe UI',Arial,sans-serif,'Apple Color Emoji','Segoe UI Emoji';
  --font-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,'SF Mono',Menlo,monospace;
  /* spacing */
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;
  --space-6:24px;--space-8:32px;--space-10:40px;
  /* radius */
  --radius-xs:4px;--radius-sm:6px;--radius-md:8px;--radius-lg:12px;
  --radius-xl:16px;--radius-2xl:20px;--radius-pill:9999px;
  /* elevation */
  --shadow-dark:0 1px 14.1px 0 rgb(0 0 0 / 12%);
  --shadow-xs:0 1px 2px 0 rgb(0 0 0 / 5%);
  --shadow-sm:0 1px 3px 0 rgb(0 0 0 / 8%),0 1px 2px -1px rgb(0 0 0 / 6%);
  --shadow-card:var(--shadow-xs);
  --shadow-raised:var(--shadow-sm);
  /* motion */
  --duration-fast:150ms;--duration-normal:200ms;--duration-slow:300ms;
  --ease-standard:cubic-bezier(.2,0,.4,1);
  --ease-out:cubic-bezier(.16,1,.3,1);
  /* z */
  --z-raised:10;--z-sidebar:30;--z-topbar:40;
  /* layout */
  --layout-sidebar:220px;
  --layout-sidebar-collapsed:64px;
  --layout-content-max:1098px;
  --layout-chart-max:800px;
  --color-overlay-image:rgb(0 0 0 / 40%);
  --z-drawer:60;
  --color-scrollbar-thumb:rgb(36 32 24 / 18%);
  --color-scrollbar-thumb-hover:rgb(36 32 24 / 32%);
}

/* ── reset / base ─────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font:400 14px/20px var(--font-sans);
  color:var(--color-text-secondary);
  background:var(--color-surface-default);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
button{font:inherit;cursor:pointer;background:none;border:none;color:inherit}
button:focus-visible,a:focus-visible{outline:none;box-shadow:inset 0 0 0 1px var(--color-focus-ring)}
.num{font-variant-numeric:tabular-nums;font-feature-settings:'tnum' 1}
.mono{font-family:var(--font-mono)}

.scroll-thin::-webkit-scrollbar{width:4px;height:4px}
.scroll-thin::-webkit-scrollbar-track{background:transparent}
.scroll-thin::-webkit-scrollbar-thumb{background:var(--color-scrollbar-thumb);border-radius:999px}
.scroll-thin:hover::-webkit-scrollbar-thumb{background:var(--color-scrollbar-thumb-hover)}

/* ── app shell ────────────────────────────────────────────────── */
.app{display:flex;min-height:100vh}
.sidebar{
  width:var(--layout-sidebar);flex:none;
  background:var(--color-surface-subtle);
  border-right:1px solid var(--color-border-subtle);
  display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;z-index:var(--z-sidebar);
}
.sidebar-logo{
  display:flex;align-items:center;gap:10px;
  padding:var(--space-5) var(--space-5) var(--space-4);
}
.logo-mark{
  width:28px;height:28px;flex:none;border-radius:var(--radius-md);
  background:var(--color-surface-brand);
  display:flex;align-items:center;justify-content:center;
}
.logo-mark svg{display:block}
.logo-name{font:600 16px/24px var(--font-sans);color:var(--color-text-primary);letter-spacing:0}
.logo-sub{font:400 12px/16px var(--font-sans);color:var(--color-text-tertiary)}
.nav{padding:var(--space-2) var(--space-3);display:flex;flex-direction:column;gap:2px}
.nav-item{
  display:flex;align-items:center;gap:10px;width:100%;
  padding:9px 12px;border-radius:30px;text-align:left;
  color:var(--color-text-secondary);
  transition:background-color var(--duration-fast) var(--ease-standard),
             border-radius var(--duration-normal) var(--ease-standard),
             color var(--duration-fast) var(--ease-standard);
}
.nav-item svg{flex:none;stroke:var(--color-fill-secondary)}
.nav-item:hover{background:var(--color-surface-muted);border-radius:var(--radius-lg)}
.nav-item.active{
  background:var(--color-surface-brand-highlight);
  color:var(--color-text-brand);
  border-radius:var(--radius-lg);
  font-weight:500;
}
.nav-item.active svg{stroke:var(--color-fill-brand)}
.nav-badge{
  margin-left:auto;font:500 12px/16px var(--font-sans);
  padding:0 8px;border-radius:var(--radius-pill);
  background:var(--color-feedback-error-subtle);color:var(--color-feedback-error-text);
}
.sidebar-foot{
  margin-top:auto;padding:var(--space-4) var(--space-5);
  border-top:1px solid var(--color-border-subtle);
  font:400 12px/16px var(--font-sans);color:var(--color-text-tertiary);
  display:flex;flex-direction:column;gap:6px;
}
.sidebar-foot .hb-line{display:flex;align-items:center;gap:6px}

/* ── main ─────────────────────────────────────────────────────── */
.main{flex:1;min-width:0;padding:var(--space-6) var(--space-8) var(--space-10)}
.nx-container{width:100%;max-width:var(--layout-content-max);margin-inline:auto}
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  gap:var(--space-4);margin-bottom:var(--space-5);flex-wrap:wrap;
}
.page-title{font:600 24px/32px var(--font-sans);color:var(--color-text-primary)}
.topbar-actions{display:flex;align-items:center;gap:var(--space-3);margin-left:auto}
.refresh-stamp{font:400 12px/16px var(--font-sans);color:var(--color-text-tertiary);display:flex;align-items:center;gap:8px}
.refresh-stamp .rs-dot{width:6px;height:6px;border-radius:var(--radius-pill);background:var(--color-feedback-success-default)}
.refresh-stamp.stale .rs-dot{background:var(--color-feedback-error-default)}
.source-link{
  min-height:28px;padding:3px 10px;border:1px solid var(--color-border-strong);
  border-radius:var(--radius-sm);color:var(--color-text-secondary);
  font:500 12px/20px var(--font-sans);text-decoration:none;
}
.source-link:hover{background:var(--color-surface-subtle);border-color:var(--color-border-brand-subtle);color:var(--color-text-brand)}

.view{display:none}
.view.active{display:block}

/* ── cards ────────────────────────────────────────────────────── */
.card{
  background:var(--color-surface-white);
  border:1px solid var(--color-border-default);
  border-radius:var(--radius-lg);
  box-shadow:var(--shadow-card);
  padding:var(--space-6);
}
.card+.card,.section+.section{margin-top:var(--space-6)}
.card-title{font:600 18px/26px var(--font-sans);color:var(--color-text-primary);margin-bottom:var(--space-4)}
.card-title-row{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);margin-bottom:var(--space-4);flex-wrap:wrap}
.card-title-row .card-title{margin-bottom:0}
.card-note{font:400 12px/16px var(--font-sans);color:var(--color-text-tertiary)}
.grid{display:grid;gap:var(--space-6)}
.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1280px){.grid-4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:1080px){.grid-2{grid-template-columns:minmax(0,1fr)}}

/* ── banners ──────────────────────────────────────────────────── */
.banner{
  border-radius:var(--radius-lg);padding:var(--space-4) var(--space-5);
  margin-bottom:var(--space-5);display:flex;align-items:center;gap:var(--space-3);
}
.banner-dead{
  background:var(--color-feedback-error-subtle);
  border:1px solid var(--color-feedback-error-default);
  color:var(--color-feedback-error-text);
}
.banner-dead .banner-title{font-weight:600}
.banner-retry{
  margin-left:auto;flex:none;height:32px;padding:0 var(--space-4);
  border-radius:var(--radius-pill);
  background:var(--color-action-primary-default);color:var(--color-text-on-brand);
  font:500 14px/20px var(--font-sans);
  transition:background-color var(--duration-fast) var(--ease-standard);
}
.banner-retry:hover{background:var(--color-action-primary-hover)}
.banner-retry:active{background:var(--color-action-primary-pressed)}

.banner-inflight{
  background:var(--color-surface-brand);
  color:var(--color-text-on-brand);
  overflow:hidden;position:relative;
}
.banner-inflight .if-pulse{
  width:10px;height:10px;flex:none;border-radius:var(--radius-pill);
  background:var(--color-accent);
  animation:ifpulse 1.6s var(--ease-standard) infinite;
}
@keyframes ifpulse{
  0%{box-shadow:0 0 0 0 rgb(184 255 58 / 45%);opacity:1}
  70%{box-shadow:0 0 0 10px rgb(184 255 58 / 0%);opacity:.75}
  100%{box-shadow:0 0 0 0 rgb(184 255 58 / 0%);opacity:1}
}
.banner-inflight .if-title{font:600 16px/24px var(--font-sans)}
.banner-inflight .if-meta{font:400 12px/16px var(--font-mono);opacity:.75}
.banner-inflight .if-bar{
  position:absolute;left:0;bottom:0;height:2px;width:40%;
  background:var(--color-accent);opacity:.9;
  animation:ifslide 2.4s var(--ease-standard) infinite;
}
@keyframes ifslide{0%{transform:translateX(-110%)}100%{transform:translateX(280%)}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

/* ── hero status ──────────────────────────────────────────────── */
.hero{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:var(--space-6)}
@media (max-width:1080px){.hero{grid-template-columns:minmax(0,1fr)}}
.hb-state{display:flex;align-items:center;gap:var(--space-4)}
.hb-orb{width:48px;height:48px;flex:none;border-radius:var(--radius-pill);display:flex;align-items:center;justify-content:center}
.hb-orb.ok{background:var(--color-feedback-success-subtle)}
.hb-orb.ok .hb-core{width:16px;height:16px;border-radius:var(--radius-pill);background:var(--color-feedback-success-default);animation:ifpulse 2s var(--ease-standard) infinite}
.hb-orb.bad{background:var(--color-feedback-error-subtle)}
.hb-orb.bad .hb-core{width:16px;height:16px;border-radius:var(--radius-pill);background:var(--color-feedback-error-default)}
.hb-word{font:600 32px/40px var(--font-sans)}
.hb-word.ok{color:var(--color-feedback-success-strong)}
.hb-word.bad{color:var(--color-feedback-error-strong)}
.hb-meta{font:400 12px/16px var(--font-sans);color:var(--color-text-metadata);margin-top:2px}
.meta-row{display:flex;gap:var(--space-5);margin-top:var(--space-4);flex-wrap:wrap}
.meta-kv .k{font:400 12px/16px var(--font-sans);color:var(--color-text-tertiary)}
.meta-kv .v{font:500 14px/20px var(--font-sans);color:var(--color-text-primary);margin-top:2px}

.port-row{display:flex;flex-wrap:wrap;gap:var(--space-2);margin-top:var(--space-4)}
.port-pill{
  display:inline-flex;align-items:center;gap:6px;
  padding:5px 12px;border-radius:var(--radius-pill);
  background:var(--color-surface-subtle);border:1px solid var(--color-border-subtle);
  font:500 12px/16px var(--font-sans);color:var(--color-text-secondary);
}
.port-pill .dot{width:8px;height:8px;border-radius:var(--radius-pill)}
.port-pill.ok .dot{background:var(--color-feedback-success-default)}
.port-pill.warn{background:var(--color-feedback-warning-subtle);border-color:var(--color-feedback-warning-default);color:var(--color-feedback-warning-text)}
.port-pill.warn .dot{background:var(--color-feedback-warning-default)}
.port-pill.bad{background:var(--color-feedback-error-subtle);border-color:var(--color-feedback-error-default);color:var(--color-feedback-error-text)}
.port-pill.bad .dot{background:var(--color-feedback-error-default)}

.countdown{font:600 32px/40px var(--font-mono);color:var(--color-text-primary);letter-spacing:0}
.cd-label{font:400 12px/16px var(--font-sans);color:var(--color-text-tertiary)}
.cd-sub{font:400 12px/16px var(--font-sans);color:var(--color-text-metadata);margin-top:var(--space-2)}

/* KPI */
.kpi{padding:var(--space-5) var(--space-6)}
.kpi .k-num{font:600 32px/40px var(--font-sans);color:var(--color-text-primary)}
.kpi .k-label{font:400 12px/16px var(--font-sans);color:var(--color-text-tertiary);margin-top:2px}
.kpi .k-sub{font:400 12px/16px var(--font-sans);color:var(--color-text-metadata);margin-top:var(--space-2)}

/* topic chips */
.topic-cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-6)}
@media (max-width:1080px){.topic-cols{grid-template-columns:minmax(0,1fr)}}
.topic-col-h{display:flex;align-items:baseline;gap:8px;margin-bottom:var(--space-3)}
.topic-col-h .t{font:600 14px/20px var(--font-sans);color:var(--color-text-primary)}
.topic-col-h .s{font:400 12px/16px var(--font-sans);color:var(--color-text-tertiary)}
.chip-stack{display:flex;flex-direction:column;gap:var(--space-2)}
.topic-chip{
  display:flex;align-items:center;gap:8px;
  padding:8px 12px;border-radius:var(--radius-md);
  background:var(--color-surface-subtle);border:1px solid var(--color-border-subtle);
}
.topic-chip.overlap{
  background:var(--color-surface-brand-subtle);
  border-color:var(--color-border-brand-subtle);
}
.topic-chip .tc-id{font:500 12px/16px var(--font-mono);color:var(--color-text-brand)}
.topic-chip .tc-label{font:400 14px/20px var(--font-sans);color:var(--color-text-secondary)}
.topic-chip .tc-score{margin-left:auto;font:500 12px/16px var(--font-mono);color:var(--color-text-metadata)}
.overlap-note{margin-top:var(--space-3);font:400 12px/16px var(--font-sans);color:var(--color-text-metadata);display:flex;align-items:center;gap:6px}
.overlap-note .sw{width:12px;height:12px;border-radius:var(--radius-xs);background:var(--color-surface-brand-subtle);border:1px solid var(--color-border-brand-subtle)}

/* ── status chips (badges) ────────────────────────────────────── */
.badge{
  display:inline-flex;align-items:center;gap:6px;
  padding:2px 10px;border-radius:var(--radius-md);
  font:500 12px/18px var(--font-sans);white-space:nowrap;
}
.badge .dot{width:8px;height:8px;border-radius:var(--radius-pill);flex:none}
.badge-success{background:var(--color-feedback-success-subtle);color:var(--color-feedback-success-text)}
.badge-success .dot{background:var(--color-feedback-success-default)}
.badge-warning{background:var(--color-feedback-warning-subtle);color:var(--color-feedback-warning-text)}
.badge-warning .dot{background:var(--color-feedback-warning-default)}
.badge-error{background:var(--color-feedback-error-subtle);color:var(--color-feedback-error-text)}
.badge-error .dot{background:var(--color-feedback-error-default)}
.badge-info{background:var(--color-feedback-info-subtle);color:var(--color-feedback-info-text)}
.badge-info .dot{background:var(--color-feedback-info-default)}
.badge-neutral{background:var(--color-feedback-neutral-subtle);color:var(--color-feedback-neutral-text)}
.badge-neutral .dot{background:var(--color-feedback-neutral-default)}
.badge-run .dot{animation:ifpulse 1.6s var(--ease-standard) infinite}

/* small tag pill for methods / proposed_by */
.tag{
  display:inline-flex;align-items:center;
  padding:1px 8px;border-radius:var(--radius-pill);
  font:500 12px/16px var(--font-sans);
  background:var(--color-surface-muted);color:var(--color-text-metadata);
  white-space:nowrap;
}
.tag-brand{background:var(--color-surface-brand-muted);color:var(--color-text-brand)}

/* ── tables ───────────────────────────────────────────────────── */
.table-wrap{overflow-x:auto;border:1px solid var(--color-border-default);border-radius:var(--radius-lg)}
table{border-collapse:collapse;width:100%;background:var(--color-surface-white)}
thead th{
  background:var(--color-surface-muted);
  font:500 12px/16px var(--font-sans);color:var(--color-text-secondary);
  padding:12px 16px;text-align:left;white-space:nowrap;
  position:sticky;top:0;z-index:var(--z-raised);
}
tbody td{
  font:400 14px/20px var(--font-sans);color:var(--color-text-secondary);
  padding:12px 16px;border-top:1px solid var(--color-border-subtle);
  vertical-align:top;
}
tbody tr:hover>td{background:var(--color-surface-subtle)}
td.primary,th.primary{color:var(--color-text-primary);font-weight:500}
td.r,th.r{text-align:right}
td.c,th.c{text-align:center}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--color-text-brand)}
th.sortable .arr{font-family:var(--font-mono);color:var(--color-text-tertiary)}
tr.chosen-row>td{background:var(--color-surface-brand-subtle)}
tr.chosen-row:hover>td{background:var(--color-surface-brand-muted)}
tr.thesis-row>td{
  background:var(--color-surface-subtle);
  font:400 14px/20px var(--font-sans);color:var(--color-text-metadata);
  border-top:none;padding-top:0;
}
tr.derive-row>td{
  background:var(--color-surface-brand-subtle);
  font:400 12px/18px var(--font-sans);color:var(--color-text-metadata);
  border-top:none;
}
.derive-formula{font:500 12px/18px var(--font-mono);color:var(--color-text-brand)}
.derive-kv{display:flex;gap:var(--space-5);flex-wrap:wrap;margin-top:6px}
.derive-kv span{white-space:nowrap}
tr.expandable{cursor:pointer}

/* epistemic caption — 诚实口径标注 */
.epi{
  font:400 12px/16px var(--font-sans);color:var(--color-text-tertiary);
  display:flex;align-items:flex-start;gap:6px;margin-top:var(--space-3);
}
.epi svg{flex:none;margin-top:2px}
.epi.head{margin-top:0;margin-bottom:var(--space-3)}

/* glossary term */
.gloss{border-bottom:1px dotted var(--color-border-strong);cursor:help}
.gloss-row{display:flex;gap:var(--space-3);padding:8px 0;align-items:baseline}
.gloss-row+.gloss-row{border-top:1px solid var(--color-border-subtle)}
.gloss-term{font:500 14px/20px var(--font-sans);color:var(--color-text-primary);width:160px;flex:none}
.gloss-def{font:400 14px/20px var(--font-sans);color:var(--color-text-metadata)}

/* paired comparison matrix */
.matrix-dot{width:10px;height:10px;border-radius:var(--radius-pill);display:inline-block;background:var(--color-fill-brand-green)}
.matrix-dot.uniq{background:var(--color-border-strong)}
.scroll-y{max-height:560px;overflow-y:auto}

/* stock colours — 红涨绿跌 */
.up{color:var(--color-stock-up-text)}
.down{color:var(--color-stock-down-text)}
.flat{color:var(--color-stock-flat-text)}

/* inline bars */
.bar-track{background:var(--color-surface-muted);border-radius:var(--radius-xs);height:8px;min-width:64px;overflow:hidden}
.bar-fill{height:100%;border-radius:var(--radius-xs);background:var(--color-fill-brand-green)}
.score-cell{display:flex;align-items:center;gap:10px}
.score-cell .n{font:500 14px/20px var(--font-mono);color:var(--color-text-primary);width:44px;text-align:right}

/* convergence */
.conv-row{display:flex;align-items:center;gap:var(--space-3);padding:6px 0}
.conv-k{font:500 14px/20px var(--font-sans);color:var(--color-text-primary);width:120px;flex:none}
.conv-track{flex:1;background:var(--color-surface-muted);border-radius:var(--radius-sm);height:20px;overflow:hidden}
.conv-fill{height:100%;background:var(--color-surface-brand-strong);border-radius:var(--radius-sm)}
.conv-fill.lv3{background:var(--color-border-brand-subtle)}
.conv-fill.lv2{background:var(--color-surface-brand-highlight)}
.conv-fill.lv1{background:var(--color-surface-sunken)}
.conv-n{font:500 14px/20px var(--font-mono);color:var(--color-text-primary);width:40px;text-align:right;flex:none}

/* funnel */
.funnel-wrap{max-width:var(--layout-chart-max);margin-inline:auto;overflow-x:auto}

/* expand toggles */
.exp-btn{
  font:500 12px/16px var(--font-sans);color:var(--color-text-brand);
  border-radius:var(--radius-pill);padding:2px 8px;
  transition:var(--duration-fast) var(--ease-standard);
  transition-property:background-color,color;
}
.exp-btn:hover{background:var(--color-surface-brand-muted);color:var(--color-text-brand-hover)}
.clamp1{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ── empty states ─────────────────────────────────────────────── */
.empty{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:var(--space-10) var(--space-6);gap:var(--space-3);
}
.empty .e-title{font:600 16px/24px var(--font-sans);color:var(--color-text-primary)}
.empty .e-desc{font:400 14px/20px var(--font-sans);color:var(--color-text-tertiary);max-width:420px}
.empty .e-action{
  margin-top:var(--space-2);height:40px;padding:0 var(--space-6);
  border-radius:var(--radius-pill);
  background:var(--color-action-primary-default);color:var(--color-text-on-brand);
  font:500 14px/20px var(--font-sans);
  transition:background-color var(--duration-fast) var(--ease-standard);
}
.empty .e-action:hover{background:var(--color-action-primary-hover)}
.empty .e-action:active{background:var(--color-action-primary-pressed)}
.empty-sm{padding:var(--space-6);border:1px dashed var(--color-border-strong);border-radius:var(--radius-lg);text-align:center;color:var(--color-text-tertiary);font:400 14px/20px var(--font-sans)}

/* ── books ────────────────────────────────────────────────────── */
.book-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-6)}
@media (max-width:1180px){.book-grid{grid-template-columns:minmax(0,1fr)}}
.book-head{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);margin-bottom:var(--space-3)}
.book-name{font:600 16px/24px var(--font-sans);color:var(--color-text-primary)}
.book-kv{display:flex;gap:var(--space-5);flex-wrap:wrap;margin-top:var(--space-3)}
.spark{display:block}

/* ── backtest ─────────────────────────────────────────────────── */
.bt-meta{display:flex;gap:var(--space-5);flex-wrap:wrap;margin-bottom:var(--space-5)}
.bt-legend{display:flex;gap:var(--space-4);flex-wrap:wrap;margin-top:var(--space-3)}
.bt-legend span{display:inline-flex;align-items:center;gap:7px;font:500 12px/16px var(--font-sans)}
.bt-swatch{width:18px;height:2px;display:inline-block}
.bt-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--space-4)}
.bt-kpi{padding:var(--space-4);background:var(--color-surface-subtle);border:1px solid var(--color-border-subtle);border-radius:var(--radius-md)}
.bt-kpi .v{font:600 22px/30px var(--font-sans);color:var(--color-text-primary)}
.bt-kpi .k{font:400 12px/16px var(--font-sans);color:var(--color-text-tertiary);margin-top:2px}
.bt-date-control{display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap}
.bt-date-control label{font:500 12px/16px var(--font-sans);color:var(--color-text-metadata)}
.bt-date-control input{
  height:34px;padding:5px 10px;border:1px solid var(--color-border-strong);
  border-radius:var(--radius-sm);background:var(--color-surface-white);
  color:var(--color-text-primary);font:500 13px/20px var(--font-mono);
}
.bt-date-control input:focus{outline:none;border-color:var(--color-border-brand-subtle);box-shadow:0 0 0 2px var(--color-surface-brand-muted)}
@media (max-width:900px){.bt-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ── routine ──────────────────────────────────────────────────── */
.cmd-block{
  background:var(--color-surface-inverse);color:var(--color-text-inverse);
  border-radius:var(--radius-lg);padding:var(--space-4) var(--space-5);
  font:400 12px/18px var(--font-mono);
  overflow-x:auto;white-space:pre;
  position:relative;
}
.cmd-line{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--space-3);padding:6px 0}
.cmd-line+.cmd-line{border-top:1px solid var(--color-border-subtle)}
.cmd-line .cl-desc{font:400 14px/20px var(--font-sans);color:var(--color-text-secondary);min-width:180px}
.cmd-line .cl-cmd{
  font:400 12px/18px var(--font-mono);color:var(--color-text-primary);
  background:var(--color-surface-subtle);border:1px solid var(--color-border-subtle);
  padding:4px 10px;border-radius:var(--radius-sm);
  overflow-x:auto;white-space:nowrap;flex:1;
}
.copy-btn{
  flex:none;height:28px;padding:0 12px;border-radius:var(--radius-pill);
  border:1px solid var(--color-border-strong);
  font:500 12px/16px var(--font-sans);color:var(--color-text-secondary);
  transition:var(--duration-fast) var(--ease-standard);
  transition-property:background-color,border-color,color;
}
.copy-btn:hover{background:var(--color-surface-subtle);border-color:var(--color-border-brand-subtle);color:var(--color-text-brand)}
.copy-btn.copied{background:var(--color-surface-brand-muted);border-color:var(--color-border-brand-subtle);color:var(--color-text-brand)}
.sched-row{display:flex;align-items:baseline;gap:var(--space-3);padding:8px 0}
.sched-row+.sched-row{border-top:1px solid var(--color-border-subtle)}
.sched-when{font:500 14px/20px var(--font-mono);color:var(--color-text-brand);width:200px;flex:none}
.sched-what{font:400 14px/20px var(--font-sans);color:var(--color-text-secondary)}

/* section titles inside a view */
.sec-h{font:600 20px/28px var(--font-sans);color:var(--color-text-primary);margin:var(--space-8) 0 var(--space-4)}
.sec-h:first-child{margin-top:0}

/* responsive */
@media (max-width:1260px){
  .main{padding:var(--space-6) var(--space-5) var(--space-10)}
  .sidebar{width:var(--layout-sidebar-collapsed)}
  .sidebar .logo-name,.sidebar .logo-sub,.sidebar .nav-label,.sidebar .sidebar-foot,.sidebar .nav-badge{display:none}
  .sidebar-logo{justify-content:center;padding:var(--space-5) 0 var(--space-4)}
  .nav{padding:var(--space-2)}
  .nav-item{justify-content:center;padding:10px}
}

/* ── orientation strip (day-1 explainer) ─────────────────────── */
.orient{
  background:var(--color-surface-brand-subtle);
  border:1px solid var(--color-border-brand-subtle);
  border-radius:var(--radius-lg);
  padding:var(--space-4) var(--space-5);
  margin-bottom:var(--space-5);
  display:flex;gap:var(--space-4);align-items:flex-start;
}
.orient .o-body{flex:1}
.orient p{font:400 14px/20px var(--font-sans);color:var(--color-text-secondary)}
.orient p b{color:var(--color-text-brand);font-weight:600}
.orient p+p{margin-top:2px}
.orient-x{
  flex:none;height:28px;padding:0 12px;border-radius:var(--radius-pill);
  border:1px solid var(--color-border-brand-subtle);
  font:500 12px/16px var(--font-sans);color:var(--color-text-brand);
  transition:background-color var(--duration-fast) var(--ease-standard);
}
.orient-x:hover{background:var(--color-surface-brand-muted)}

/* ── status card ─────────────────────────────────────────────── */
.status-card{padding:var(--space-4) var(--space-5)}
.status-line{
  display:flex;align-items:center;gap:var(--space-3);width:100%;text-align:left;
  border-radius:var(--radius-md);
}
.status-dot{width:14px;height:14px;flex:none;border-radius:var(--radius-pill)}
.status-dot.ok{background:var(--color-feedback-success-default)}
.status-dot.run{background:var(--color-feedback-success-default);animation:ifpulse 1.6s var(--ease-standard) infinite}
.status-dot.warn{background:var(--color-feedback-warning-default)}
.status-dot.bad{background:var(--color-feedback-error-default)}
.status-word{font:600 16px/24px var(--font-sans);color:var(--color-text-primary)}
.status-word .sub{font:400 14px/20px var(--font-sans);color:var(--color-text-metadata);font-weight:400}
.status-chev{margin-left:auto;flex:none;transition:transform var(--duration-normal) var(--ease-standard);color:var(--color-fill-tertiary)}
.status-line[aria-expanded="true"] .status-chev{transform:rotate(180deg)}
.anchor-line{
  font:400 12px/16px var(--font-sans);color:var(--color-text-tertiary);
  margin-top:var(--space-2);padding-left:26px;
}
.status-detail{margin-top:var(--space-4);border-top:1px solid var(--color-border-subtle);padding-top:var(--space-4)}

/* ── question cards ──────────────────────────────────────────── */
.qtitle{font:600 18px/26px var(--font-sans);color:var(--color-text-primary)}
.qhead{display:flex;align-items:baseline;justify-content:space-between;gap:var(--space-3);margin-bottom:var(--space-4);flex-wrap:wrap}
.qlink{
  font:500 12px/16px var(--font-sans);color:var(--color-text-brand);
  border-radius:var(--radius-pill);padding:4px 10px;white-space:nowrap;
  transition:background-color var(--duration-fast) var(--ease-standard);
}
.qlink:hover{background:var(--color-surface-brand-muted);color:var(--color-text-brand-hover)}
.q-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:var(--space-6)}
@media (max-width:1080px){.q-grid{grid-template-columns:minmax(0,1fr)}}
.quiet{font:400 14px/20px var(--font-sans);color:var(--color-text-tertiary)}
.big-ret{font:600 40px/50px var(--font-sans)}

/* ── stepper ─────────────────────────────────────────────────── */
.stepper{display:flex;margin:var(--space-4) 0 var(--space-2)}
.step{flex:1;text-align:center;position:relative;padding:0 var(--space-2)}
.step::before{
  content:'';position:absolute;top:11px;right:calc(50% + 18px);left:calc(-50% + 18px);
  height:2px;background:var(--color-border-default);
}
.step:first-child::before{display:none}
.step.done::before{background:var(--color-feedback-success-default)}
.step.active::before{background:var(--color-feedback-success-default)}
.step-dot{
  width:22px;height:22px;border-radius:var(--radius-pill);margin:0 auto;
  display:flex;align-items:center;justify-content:center;
  background:var(--color-surface-muted);position:relative;
  font:500 12px/16px var(--font-sans);color:var(--color-text-tertiary);
}
.step.done .step-dot{background:var(--color-feedback-success-default)}
.step.active .step-dot{background:var(--color-surface-brand);animation:ifpulse 1.8s var(--ease-standard) infinite}
.step-name{font:500 14px/20px var(--font-sans);color:var(--color-text-primary);margin-top:var(--space-2)}
.step-sub{font:400 12px/16px var(--font-sans);color:var(--color-text-tertiary)}
.step.pending .step-name{color:var(--color-text-tertiary)}

/* ── audit anchor chips ──────────────────────────────────────── */
.anchor-chips{display:flex;gap:var(--space-2);flex-wrap:wrap;margin-bottom:var(--space-5)}
.anchor-chip{
  height:32px;padding:0 var(--space-4);border-radius:var(--radius-pill);
  border:1px solid var(--color-border-default);background:var(--color-surface-white);
  font:500 12px/16px var(--font-sans);color:var(--color-text-secondary);
  transition:var(--duration-fast) var(--ease-standard);
  transition-property:border-color,color,background-color;
}
.anchor-chip:hover{border-color:var(--color-border-brand-subtle);color:var(--color-text-brand)}
.view-intro{font:400 14px/20px var(--font-sans);color:var(--color-text-metadata);margin:-8px 0 var(--space-5)}

/* ── week view specifics ─────────────────────────────────────── */
.wk-h1{font:600 24px/32px var(--font-sans);color:var(--color-text-primary)}
.wk-h1 .num{font-family:var(--font-mono);font-size:20px}
.wk-sub{font:400 14px/20px var(--font-sans);color:var(--color-text-metadata);margin:4px 0 var(--space-5);max-width:760px}
.kpi-row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:var(--space-5)}
@media (max-width:1280px){.kpi-row{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:900px){.kpi-row{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi-t .k-num{font:600 24px/32px var(--font-sans);color:var(--color-text-primary)}
.kpi-t .k-label{font:500 12px/16px var(--font-sans);color:var(--color-text-metadata)}
.kpi-t .k-cap{font:400 12px/16px var(--font-sans);color:var(--color-text-tertiary);margin-top:2px}
.nav-txt{display:flex;flex-direction:column;min-width:0}
.nav-sub{font:400 12px/16px var(--font-sans);color:var(--color-text-tertiary)}
.nav-item.active .nav-sub{color:var(--color-text-brand)}
.hold-wrap{max-height:340px}

/* ── 推理链（语料→主题→想法→候选→账本→持仓） ─────────────── */
.chain-card{padding:var(--space-4) var(--space-5)}
.chain-scroll{overflow-x:auto;padding-bottom:2px}
.chain{display:flex;align-items:stretch;gap:0;min-width:min-content}
.chain-node{
  flex:1;min-width:96px;position:relative;
  display:flex;flex-direction:column;align-items:center;text-align:center;
  padding:var(--space-2) var(--space-2);border-radius:var(--radius-md);
  transition:background-color var(--duration-fast) var(--ease-standard);
}
button.chain-node:hover{background:var(--color-surface-brand-subtle)}
.chain-node .cn-num{font:600 22px/28px var(--font-sans);color:var(--color-text-primary)}
.chain-node .cn-num .u{font:500 12px/16px var(--font-sans);color:var(--color-text-tertiary)}
.chain-node.hot .cn-num{color:var(--color-text-brand)}
.chain-node .cn-label{font:500 13px/18px var(--font-sans);color:var(--color-text-secondary);margin-top:2px}
.chain-node .cn-sub{font:400 11px/15px var(--font-sans);color:var(--color-text-tertiary);margin-top:1px}
.chain-node .cn-go{font:400 11px/15px var(--font-sans);color:var(--color-text-brand);opacity:0;transition:opacity var(--duration-fast) var(--ease-standard)}
button.chain-node:hover .cn-go{opacity:1}
.chain-arrow{
  flex:none;align-self:center;color:var(--color-fill-tertiary);
  padding:0 2px;display:flex;align-items:center;
}
.chain-story{font:400 13px/19px var(--font-sans);color:var(--color-text-metadata);margin-top:var(--space-3);border-top:1px solid var(--color-border-subtle);padding-top:var(--space-3)}
.chain-story b{color:var(--color-text-primary);font-weight:600}

/* ── 过程 view: 目录 overlay + 面板导航 ─────────────────────── */
.proc-head{
  display:flex;align-items:center;gap:var(--space-4);
  margin-bottom:var(--space-5);flex-wrap:wrap;
}
.ham-btn{
  display:inline-flex;align-items:center;gap:8px;
  height:32px;padding:0 var(--space-4);border-radius:var(--radius-pill);
  border:1px solid var(--color-border-strong);
  font:500 14px/20px var(--font-sans);color:var(--color-text-secondary);
  transition:var(--duration-fast) var(--ease-standard);
  transition-property:background-color,border-color,color;
}
.ham-btn:hover{background:var(--color-surface-subtle);border-color:var(--color-border-brand-subtle);color:var(--color-text-brand)}
.proc-crumb{font:400 14px/20px var(--font-sans);color:var(--color-text-metadata)}
.proc-crumb b{font-weight:600;color:var(--color-text-primary)}
.pnav{display:flex;justify-content:space-between;margin-top:var(--space-5)}

.toc-scrim{position:fixed;inset:0;background:var(--color-overlay-image);z-index:var(--z-drawer)}
.toc-panel{
  position:fixed;left:0;top:0;bottom:0;width:320px;z-index:var(--z-drawer);
  background:var(--color-surface-white);
  box-shadow:0 20px 24px -4px rgb(0 0 0 / 12%),0 8px 8px -4px rgb(0 0 0 / 4%);
  padding:var(--space-5);overflow-y:auto;
  animation:tocIn 300ms var(--ease-out) both;
}
@keyframes tocIn{from{transform:translateX(-24px);opacity:0}to{transform:translateX(0);opacity:1}}
.toc-h{
  display:flex;align-items:center;justify-content:space-between;
  font:600 16px/24px var(--font-sans);color:var(--color-text-primary);
  margin-bottom:var(--space-4);
}
.toc-group{margin-bottom:var(--space-1)}
.toc-item{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:8px 10px;border-radius:var(--radius-md);
  font:500 14px/20px var(--font-sans);color:var(--color-text-primary);
  transition:background-color var(--duration-fast) var(--ease-standard);
}
.toc-item:hover{background:var(--color-surface-subtle)}
.toc-item.sel{background:var(--color-surface-brand-highlight);color:var(--color-text-brand)}
.toc-item.mut{color:var(--color-text-tertiary)}
.toc-item.sel .toc-count{color:var(--color-text-brand)}
.toc-num{flex:none;font-family:var(--font-mono);font-size:12px;color:var(--color-text-tertiary)}
.toc-t{min-width:0}
.toc-count{display:block;font:400 12px/16px var(--font-sans);color:var(--color-text-tertiary)}
.toc-ic{width:16px;height:16px;flex:none;border-radius:var(--radius-pill);display:flex;align-items:center;justify-content:center}
.toc-ic.done{background:var(--color-feedback-success-default)}
.toc-ic.act{background:var(--color-surface-brand);animation:ifpulse 1.6s var(--ease-standard) infinite}
.toc-ic.act::after{content:'';width:6px;height:6px;border-radius:9999px;background:var(--color-accent)}
.toc-ic.pend{background:var(--color-surface-muted)}
.toc-sub{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  padding:5px 10px 5px 44px;border-radius:var(--radius-md);
  font:400 14px/20px var(--font-sans);color:var(--color-text-metadata);
  transition:background-color var(--duration-fast) var(--ease-standard);
}
.toc-sub:hover{background:var(--color-surface-subtle);color:var(--color-text-brand)}
.toc-foot{margin-top:var(--space-4);font:400 12px/16px var(--font-sans);color:var(--color-text-tertiary)}

/* ── 档案 view: 周历行 ───────────────────────────────────────── */
.cal-row{border-top:1px solid var(--color-border-subtle)}
.cal-row:first-of-type{border-top:none}
.cal-main{display:flex;align-items:center;gap:var(--space-3);padding:10px 0;cursor:pointer}
.cal-main:hover{background:var(--color-surface-subtle);border-radius:var(--radius-md)}
.cal-date{flex:none;width:96px;font:500 14px/20px var(--font-mono);color:var(--color-text-primary);display:flex;align-items:center}
.cal-text{font:400 14px/20px var(--font-sans);color:var(--color-text-secondary);min-width:0}
.cal-detail{padding:4px 0 10px 108px;font:400 13px/18px var(--font-sans)}
.cal-detail{font-size:12px;line-height:18px;color:var(--color-text-metadata)}

/* ── 全局帮助滑出面板 ────────────────────────────────────────── */
.help-btn{
  width:28px;height:28px;flex:none;border-radius:var(--radius-pill);
  border:1px solid var(--color-border-strong);
  font:500 14px/20px var(--font-sans);color:var(--color-text-secondary);
  display:inline-flex;align-items:center;justify-content:center;
  transition:var(--duration-fast) var(--ease-standard);
  transition-property:background-color,border-color,color;
}
.help-btn:hover{background:var(--color-surface-subtle);border-color:var(--color-border-brand-subtle);color:var(--color-text-brand)}
.help-panel{
  position:fixed;right:0;top:0;bottom:0;width:420px;max-width:92vw;z-index:var(--z-drawer);
  background:var(--color-surface-white);
  box-shadow:0 20px 24px -4px rgb(0 0 0 / 12%),0 8px 8px -4px rgb(0 0 0 / 4%);
  padding:var(--space-5);display:flex;flex-direction:column;
  animation:helpIn 300ms var(--ease-out) both;
}
@keyframes helpIn{from{transform:translateX(24px);opacity:0}to{transform:translateX(0);opacity:1}}
.help-tabs{display:flex;gap:var(--space-2);margin-bottom:var(--space-4)}
.help-tab{
  height:32px;padding:0 var(--space-4);border-radius:var(--radius-pill);
  border:1px solid var(--color-border-default);
  font:500 14px/20px var(--font-sans);color:var(--color-text-secondary);
  transition:var(--duration-fast) var(--ease-standard);
  transition-property:background-color,border-color,color;
}
.help-tab:hover{border-color:var(--color-border-brand-subtle);color:var(--color-text-brand)}
.help-tab.on{background:var(--color-surface-brand-highlight);border-color:var(--color-border-brand-subtle);color:var(--color-text-brand)}
.help-body{flex:1;overflow-y:auto;min-height:0}
.help-body .card{border:none;box-shadow:none;padding:0}
.help-body .card+.card,.help-body .section{margin-top:var(--space-5)}

/* ── 可信度区(档案第二段) ───────────────────────────────────── */
.trust-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-6)}
@media (max-width:1180px){.trust-grid{grid-template-columns:minmax(0,1fr)}}
.trust-h{font:600 16px/24px var(--font-sans);color:var(--color-text-primary);margin-bottom:var(--space-2)}

/* ── 候选池筛选条(勾稽链) ───────────────────────────────────── */
.filter-bar{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--color-surface-brand-subtle);
  border:1px solid var(--color-border-brand-subtle);
  border-radius:var(--radius-pill);padding:4px 12px;
  font:500 12px/16px var(--font-sans);color:var(--color-text-brand);
  margin-bottom:var(--space-3);
}

/* ── 证据清单(词表命中的 Wisburg 研报) ──────────────────────── */
.ev-wrap{margin-top:var(--space-2);border-top:1px solid var(--color-border-subtle);padding-top:var(--space-2)}
.ev-list{max-height:300px;overflow-y:auto}
.ev-row{display:flex;gap:10px;padding:4px 0;font:400 12px/18px var(--font-sans);color:var(--color-text-secondary);align-items:baseline}
.ev-row .d{font-family:var(--font-mono);color:var(--color-text-tertiary);flex:none}

/* 状态点展开里的数据源行 */
.feed-line{display:flex;align-items:baseline;gap:8px;font:400 12px/18px var(--font-sans);color:var(--color-text-metadata);padding:2px 0}
.feed-line .fdot{width:8px;height:8px;flex:none;border-radius:var(--radius-pill);position:relative;top:0}

/* ── 语料浏览器 ─────────────────────────────────────────────── */
.corpus-panel{width:640px;max-width:94vw}
.corpus-search{
  width:100%;height:36px;flex:none;
  border:1px solid var(--color-border-default);border-radius:var(--radius-lg);
  padding:0 var(--space-3);
  font:400 14px/20px var(--font-sans);color:var(--color-text-primary);
  background:var(--color-surface-white);
  margin-bottom:var(--space-2);
}
.corpus-search:focus{outline:none;border-color:var(--color-focus-ring);box-shadow:inset 0 0 0 1px var(--color-focus-ring)}
.tier-chips{display:flex;gap:6px;margin-bottom:var(--space-3);flex:none;flex-wrap:wrap}
.tier-chip{
  height:28px;padding:0 var(--space-3);border-radius:var(--radius-pill);
  border:1px solid var(--color-border-default);
  font:500 12px/16px var(--font-sans);color:var(--color-text-secondary);
  transition:var(--duration-fast) var(--ease-standard);
  transition-property:background-color,border-color,color;
}
.tier-chip:hover{border-color:var(--color-border-brand-subtle);color:var(--color-text-brand)}
.tier-chip.on{background:var(--color-surface-brand-highlight);border-color:var(--color-border-brand-subtle);color:var(--color-text-brand)}
.doc-row{
  display:flex;gap:10px;padding:6px 2px;align-items:baseline;cursor:pointer;
  border-top:1px solid var(--color-border-subtle);
  font:400 12px/18px var(--font-sans);
}
.doc-row:first-child{border-top:none}
.doc-row:hover{background:var(--color-surface-subtle)}
.doc-title{color:var(--color-text-secondary);min-width:0}
.doc-detail{
  background:var(--color-surface-subtle);border-radius:var(--radius-md);
  padding:10px 12px;margin:2px 0 8px;
  font:400 12px/18px var(--font-sans);color:var(--color-text-secondary);
}
.doc-cred{
  font:400 12px/18px var(--font-mono);color:var(--color-text-metadata);
  background:var(--color-surface-muted);border-radius:var(--radius-sm);
  padding:4px 8px;margin-top:6px;overflow-x:auto;white-space:nowrap;
}
.doc-body{
  white-space:pre-wrap;max-height:320px;overflow-y:auto;margin-top:8px;
  border-top:1px solid var(--color-border-default);padding-top:8px;
  font:400 12px/20px var(--font-sans);color:var(--color-text-secondary);
}

/* ══════════ 过程 v2 — 流水线画布 · 运行日志带 · 决策现场 ══════════ */
/* 阶段标题 */
.stage-head{display:flex;align-items:baseline;gap:var(--space-3);margin-bottom:var(--space-3);flex-wrap:wrap}
.stage-no{font:600 12px/20px var(--font-mono);color:var(--color-text-on-brand);background:var(--color-surface-brand);border-radius:var(--radius-sm);padding:1px 9px;flex:none}
.stage-t{font:600 18px/26px var(--font-sans);color:var(--color-text-primary)}
.stage-q{font:400 13px/18px var(--font-sans);color:var(--color-text-tertiary)}

/* 流水线画布 */
.pipe-wrap{overflow-x:auto}
.pipe-svg{display:block;width:100%;height:auto;min-width:940px}
.pc-click{cursor:pointer}
.pc-click:hover rect,.pc-click:hover circle{filter:brightness(.96)}
.pipe-legend{display:flex;gap:var(--space-5);flex-wrap:wrap;margin-top:var(--space-2);font:400 12px/16px var(--font-sans);color:var(--color-text-tertiary)}
.pipe-legend b{color:var(--color-text-metadata);font-weight:500}

/* 运行日志带（终端风格） */
.runlog{background:var(--color-surface-inverse);border-radius:var(--radius-xl);padding:var(--space-5) var(--space-6);box-shadow:var(--shadow-card)}
.rl-head{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:var(--space-3);font:500 12px/18px var(--font-mono)}
.rl-title{color:#fbfbfb;font:600 13px/18px var(--font-sans);display:flex;align-items:center;gap:8px;margin-right:4px}
.rl-title .cur{width:8px;height:14px;background:var(--color-accent);display:inline-block}
.rl-chip{border:1px solid rgb(255 255 255 / 16%);border-radius:var(--radius-pill);padding:1px 10px;color:#aeb6b2;white-space:nowrap}
.rl-chip.ok{border-color:rgb(184 255 58 / 40%)}
.rl-chip.ok::before{content:'';display:inline-block;width:7px;height:7px;border-radius:999px;background:var(--color-accent);margin-right:6px}
.rl-chip.bad{border-color:rgb(255 122 122 / 50%);color:#ffb1b1}
.rl-scroll{overflow-x:auto}
.rl-body{font:400 12px/19px var(--font-mono);min-width:640px}
.rl-line{display:flex;gap:12px;padding:1.5px 0;align-items:baseline}
.rl-t{color:#6f7a75;flex:none;width:96px}
.rl-step{color:#fbfbfb;flex:none;width:130px}
.rl-kv{color:#aeb6b2;min-width:0}
.rl-kv b{color:#dfe5e2;font-weight:500}
.rl-err{color:#ffb1b1}
.rl-sec{margin-top:var(--space-3);padding-top:var(--space-2);border-top:1px solid rgb(255 255 255 / 10%);color:#8fa39a;font:500 11px/16px var(--font-mono);letter-spacing:.06em}
.rl-art .rl-t{width:auto;min-width:0}
.rl-uri{color:#c9d2ce;word-break:break-all}
.rl-note{margin-top:var(--space-3);font:400 12px/17px var(--font-sans);color:#8b948f}
.rl-empty{font:400 13px/19px var(--font-sans);color:#aeb6b2}
.rl-anim .rl-line{opacity:0;animation:rlIn .28s var(--ease-out) forwards}
@keyframes rlIn{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.rl-anim .rl-line{animation:none;opacity:1}}

/* 筛选A 赛马条 */
.race{display:flex;flex-direction:column}
.race-row{display:grid;grid-template-columns:200px minmax(0,1fr) 170px;gap:var(--space-3);align-items:center;padding:5px 6px;cursor:pointer;border-radius:var(--radius-sm);border:none;text-align:left;width:100%}
.race-row:hover{background:var(--color-surface-subtle)}
.race-name{min-width:0}
.race-name .id{font:500 12px/16px var(--font-mono);color:var(--color-text-primary)}
.race-name .lbl{display:block;font:400 11px/14px var(--font-sans);color:var(--color-text-tertiary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.race-row.lost .race-name .id{color:var(--color-text-tertiary)}
.race-track{position:relative;height:18px;background:var(--color-surface-subtle);border-radius:var(--radius-xs)}
.race-bar{position:absolute;top:0;left:0;bottom:0;display:flex;border-radius:var(--radius-xs);overflow:hidden}
.race-seg{height:100%}
.race-cnt{position:absolute;top:50%;transform:translate(-50%,-50%);min-width:15px;height:15px;border-radius:999px;background:var(--color-surface-white);border:1.5px solid var(--color-border-strong);font:600 9px/12px var(--font-mono);display:flex;align-items:center;justify-content:center;color:var(--color-text-metadata);padding:0 2px;box-sizing:border-box}
.race-cnt.pick{border-color:var(--color-surface-brand-strong);box-shadow:0 0 0 2px var(--color-accent)}
.race-side{display:flex;align-items:center;justify-content:flex-end;gap:8px;white-space:nowrap}
.race-side .sc{font:600 13px/18px var(--font-mono);color:var(--color-text-primary)}
.race-row.lost .race-side .sc{color:var(--color-text-tertiary);font-weight:500}
.race-side .d{font:400 11px/14px var(--font-sans);color:var(--color-text-tertiary)}
.race-cut{display:flex;align-items:center;gap:10px;margin:7px 0;font:500 11px/16px var(--font-sans);color:var(--color-text-brand);white-space:nowrap}
.race-cut::before,.race-cut::after{content:'';flex:1;border-top:2px dashed var(--color-border-brand-subtle)}
.race-detail{margin:2px 6px 8px;padding:var(--space-3) var(--space-4);background:var(--color-surface-subtle);border-radius:var(--radius-md);font:400 12px/18px var(--font-sans);color:var(--color-text-secondary)}
.race-legend{display:flex;gap:var(--space-4);flex-wrap:wrap;margin-top:var(--space-3);font:400 12px/16px var(--font-sans);color:var(--color-text-metadata)}
.race-legend .sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* 筛选B 生产网格 */
.pgrid{display:grid;gap:6px;align-items:stretch}
.pg-h{font:500 11px/14px var(--font-mono);color:var(--color-text-metadata);display:flex;align-items:flex-end;justify-content:center;text-align:center;padding-bottom:2px}
.pg-m{display:flex;flex-direction:column;justify-content:center;min-width:0}
.pg-m .t{font:500 13px/18px var(--font-sans);color:var(--color-text-primary);white-space:nowrap}
.pg-m .s{font:400 11px/14px var(--font-sans);color:var(--color-text-tertiary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg-cell{border:none;border-radius:var(--radius-md);height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font:600 15px/20px var(--font-mono);color:var(--color-text-primary);transition:box-shadow var(--duration-fast) var(--ease-standard)}
.pg-cell:hover{box-shadow:inset 0 0 0 2px var(--color-border-brand-subtle)}
.pg-cell .u{font:400 10px/12px var(--font-sans);color:var(--color-text-metadata)}
.pg-cell.empty{cursor:default;color:var(--color-text-disabled);background:var(--color-surface-subtle)}
.pg-tail{display:flex;flex-direction:column;justify-content:center;font:400 11px/15px var(--font-sans);color:var(--color-text-tertiary);white-space:nowrap}
.pg-tail b{font:500 12px/16px var(--font-mono);color:var(--color-text-primary)}

/* 合并汇流气泡 */
.merge-line{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:var(--space-4)}
.merge-line .big{font:600 26px/34px var(--font-mono);color:var(--color-text-primary)}
.merge-line .arr{color:var(--color-text-tertiary)}
.bub-group{display:flex;gap:var(--space-3);align-items:flex-start;padding:var(--space-3) 0}
.bub-group+.bub-group{border-top:1px solid var(--color-border-subtle)}
.bub-k{width:150px;flex:none;padding-top:4px}
.bub-k .t{font:500 13px/18px var(--font-sans);color:var(--color-text-primary)}
.bub-k .s{font:400 11px/15px var(--font-sans);color:var(--color-text-tertiary)}
.bub-cloud{display:flex;flex-wrap:wrap;gap:7px;align-items:center;min-width:0}
.bub{border-radius:999px;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;font:500 10px/12px var(--font-mono);color:var(--color-text-brand);transition:box-shadow var(--duration-fast) var(--ease-standard);padding:0}
.bub:hover{box-shadow:0 0 0 2px var(--color-accent)}

/* 筛选C 闸门矩阵 */
.sel-legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-2) var(--space-5);margin-bottom:var(--space-5)}
@media (max-width:1080px){.sel-legend{grid-template-columns:minmax(0,1fr)}}
.sel-leg{display:flex;gap:10px;align-items:baseline;padding:6px 8px;border-radius:var(--radius-md)}
.sel-leg .nm{font:500 13px/18px var(--font-sans);color:var(--color-text-primary);white-space:nowrap}
.sel-leg .bel{font:400 12px/17px var(--font-sans);color:var(--color-text-metadata)}
.gate-table th.rot{height:84px;vertical-align:bottom;padding:0 0 8px}
.gate-table th.rot .r-in{writing-mode:vertical-rl;transform:rotate(180deg);font:500 11px/14px var(--font-sans);color:var(--color-text-metadata);white-space:nowrap;margin:0 auto}
.gate-table td.gd{text-align:center;padding:4px 6px}
.gate-dot{width:11px;height:11px;border-radius:999px;display:inline-block;background:var(--color-surface-brand-strong)}
.gate-dot.ctl{background:var(--color-border-strong)}
.gate-miss{color:var(--color-border-default);font:400 11px/11px var(--font-mono)}

/* 建仓刻度条 */
.pos-line{display:grid;grid-template-columns:88px minmax(0,1fr) 220px 78px;gap:var(--space-3);align-items:center;padding:5px 0;border-top:1px solid var(--color-border-subtle)}
.pos-line:first-child{border-top:none}
.pos-code{font:500 12px/16px var(--font-mono);color:var(--color-text-primary)}
.pos-nm{font:400 12px/16px var(--font-sans);color:var(--color-text-tertiary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rngwrap{display:flex;flex-direction:column;gap:2px;min-width:0}
.rng{position:relative;height:14px}
.rng-track{position:absolute;left:0;right:0;top:5px;height:4px;border-radius:999px;background:linear-gradient(90deg,var(--color-stock-down-subtle),var(--color-surface-muted) 40%,var(--color-stock-up-subtle))}
.rng-tick{position:absolute;top:1px;width:2px;height:12px;border-radius:1px;background:var(--color-fill-secondary)}
.rng-last{position:absolute;top:2px;width:10px;height:10px;border-radius:999px;border:2px solid var(--color-surface-white);box-shadow:var(--shadow-xs)}
.rng-last.edge{box-shadow:0 0 0 2px var(--color-feedback-warning-default)}
.rng-end{position:absolute;top:5px;width:2px;height:4px;background:var(--color-border-strong)}
.rng-vals{display:flex;justify-content:space-between;gap:6px;font:400 9px/11px var(--font-mono);color:var(--color-text-tertiary);white-space:nowrap}
.rng-vals .cur{color:var(--color-text-primary);font-weight:600}
.rng-ofl{font:500 10px/13px var(--font-sans)}
.rng-ofl.down{color:var(--color-stock-down-text)}
.rng-ofl.up{color:var(--color-stock-up-text)}
.pos-pnl{text-align:right;font:500 12px/16px var(--font-mono)}
.pos-headr{display:grid;grid-template-columns:88px minmax(0,1fr) 220px 78px;gap:var(--space-3);font:400 10px/14px var(--font-sans);color:var(--color-text-tertiary);padding-bottom:3px}
@media (max-width:1180px){.pos-line,.pos-headr{grid-template-columns:80px minmax(0,1fr) 170px 70px}}

/* ══════════ 抽屉系统（hover 速览 + 点击深钻 + 可叠三层） ══════════ */
.drawer-scrim{position:fixed;inset:0;background:var(--color-overlay-image);z-index:69}
.drawer{
  position:fixed;top:0;right:0;bottom:0;background:var(--color-surface-white);
  box-shadow:-10px 0 36px rgb(0 0 0 / 16%);display:flex;flex-direction:column;
  animation:drIn var(--duration-slow) var(--ease-out);
}
.drawer.under{pointer-events:none}
.drawer.under::after{content:'';position:absolute;inset:0;background:rgb(0 0 0 / 16%);border-radius:0}
@keyframes drIn{from{transform:translateX(48px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.drawer{animation:none}}
.drawer-head{padding:var(--space-4) var(--space-6) var(--space-3);border-bottom:1px solid var(--color-border-default);flex:none}
.drawer-crumbs{display:flex;align-items:center;gap:4px;font:400 12px/16px var(--font-sans);color:var(--color-text-tertiary);flex-wrap:wrap}
.drawer-crumb{color:var(--color-text-tertiary);border-radius:var(--radius-xs);padding:1px 4px}
.drawer-crumb:not(.cur):hover{background:var(--color-surface-subtle);color:var(--color-text-brand);text-decoration:underline;text-underline-offset:2px}
button.drawer-crumb:not(.cur){color:var(--color-text-metadata);border-bottom:1px dotted var(--color-border-strong)}
.drawer-crumb.cur{color:var(--color-text-primary);font-weight:500;cursor:default}
.drawer-title-row{display:flex;align-items:baseline;gap:var(--space-3);margin-top:4px}
.drawer-title{font:600 18px/26px var(--font-sans);color:var(--color-text-primary)}
.drawer-q{font:400 12px/17px var(--font-sans);color:var(--color-text-tertiary);min-width:0}
.drawer-x{
  margin-left:auto;flex:none;width:28px;height:28px;border-radius:var(--radius-sm);
  display:flex;align-items:center;justify-content:center;color:var(--color-text-tertiary);align-self:center;
}
.drawer-x:hover{background:var(--color-surface-subtle);color:var(--color-text-primary)}
.drawer-body{flex:1;overflow-y:auto;padding:var(--space-5) var(--space-6);overscroll-behavior:contain}
@media (max-width:1023px){.drawer{width:100vw !important}}
.drawer .book-grid{grid-template-columns:minmax(0,1fr)}
.drawer .race-row{grid-template-columns:132px minmax(0,1fr) 118px;gap:var(--space-2)}
.drawer .sel-legend{grid-template-columns:minmax(0,1fr)}
.drawer .topic-cols{grid-template-columns:minmax(0,1fr)}
.pgrid-wrap{overflow-x:auto}
.drawer .pgrid{min-width:620px}
body.drawer-lock{overflow:hidden}

/* hover 速览 popover */
.pc-pop{
  position:fixed;z-index:96;pointer-events:none;background:var(--color-surface-white);
  border:1px solid var(--color-border-default);border-radius:var(--radius-md);
  box-shadow:var(--shadow-dark);padding:10px 12px;max-width:320px;
  font:400 12px/17px var(--font-sans);color:var(--color-text-secondary);
  opacity:0;transition:opacity 120ms var(--ease-standard);
}
.pc-pop.show{opacity:1}
@media (prefers-reduced-motion:reduce){.pc-pop{transition:none}}
.pc-pop .pp-t{font:600 13px/18px var(--font-sans);color:var(--color-text-primary);margin-bottom:2px}
.pc-pop .pp-n{font:500 12px/17px var(--font-mono);color:var(--color-text-primary);margin:2px 0}
.pc-pop .pp-s{color:var(--color-text-tertiary)}

/* 运行回执条（过程页唯一保留的日志入口） */
.run-receipt{
  display:flex;align-items:center;gap:12px;width:100%;background:var(--color-surface-inverse);
  border-radius:var(--radius-lg);padding:11px var(--space-5);cursor:pointer;
  font:500 12px/18px var(--font-mono);color:#c9d2ce;text-align:left;box-shadow:var(--shadow-card);
}
.run-receipt:hover{box-shadow:var(--shadow-dark)}
.run-receipt .dot{width:9px;height:9px;border-radius:999px;background:var(--color-accent);flex:none}
.run-receipt .dot.bad{background:#ff9a9a}

<script>
'use strict';
/* ════════════════════════════════════════════════════════════════
 * IdeaGen40 运行台 — 三层导航:本周(结论) / 过程(推导) / 底账(凭据)
 * 单端点 /api/state · vanilla JS · 自含
 * ════════════════════════════════════════════════════════════════ */
var S=null, lastFetchOk=null, fetchFailed=false;
var J=null, JErr=null; /* /api/journal — 「真实在云端跑」的运行日志 */
var candSort={key:'n_proposals',dir:-1};
var statusOpen=false, statusForced=false, cmpOpen=false;
var backtestStart=null;

/* ── helpers ─────────────────────────────────────────────────── */
function $(id){return document.getElementById(id)}
function esc(s){
  if(s===null||s===undefined) return '';
  return String(s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function fmtInt(n){if(n===null||n===undefined||isNaN(n))return '—';return Number(n).toLocaleString('en-US')}
function fmtMoney(n){if(n===null||n===undefined||isNaN(n))return '—';return Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function fmtPct(n){
  if(n===null||n===undefined||isNaN(n))return '—';
  var v=Number(n),sign=v>0?'+':(v<0?'−':'');
  return sign+Math.abs(v).toFixed(2)+'%';
}
function fmtRate(n){
  if(n===null||n===undefined||isNaN(n))return '—';
  return Number(n).toFixed(1)+'%';
}
function pctCls(v){if(v===null||v===undefined||isNaN(v))return 'flat';return v>0?'up':(v<0?'down':'flat')}
function signedMoney(n){
  if(n===null||n===undefined||isNaN(n))return '—';
  var v=Number(n),sign=v>0?'+':(v<0?'−':'');
  return sign+Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function fmtProb(n){if(n===null||n===undefined||isNaN(n))return '—';return (Number(n)*100).toFixed(0)+'%'}
function hktFmt(iso,withDate){
  if(!iso)return '—';
  var d=new Date(iso);if(isNaN(d))return esc(iso);
  var opt=withDate?{timeZone:'Asia/Hong_Kong',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}
                  :{timeZone:'Asia/Hong_Kong',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false};
  return new Intl.DateTimeFormat('zh-CN',opt).format(d);
}
function ageWord(s){
  if(s===null||s===undefined)return '—';
  s=Math.round(s);
  if(s<60)return s+' 秒前';
  if(s<3600)return Math.floor(s/60)+' 分钟前';
  if(s<86400)return Math.floor(s/3600)+' 小时 '+Math.floor(s%3600/60)+' 分前';
  return Math.floor(s/86400)+' 天前';
}
function hktParts(){
  var p=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Hong_Kong',
    year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',
    weekday:'short',hour12:false}).formatToParts(new Date());
  var o={};p.forEach(function(x){o[x.type]=x.value});
  var wdMap={Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6};
  return {y:+o.year,m:+o.month,d:+o.day,H:+o.hour%24,M:+o.minute,S:+o.second,wd:wdMap[o.weekday]};
}
var WD=['周日','周一','周二','周三','周四','周五','周六'];
/* next weekly trigger — 只用 API 的 schedule.trigger_hkt 推算；API 没给就返回 null（不编时刻表） */
function nextRunInfo(){
  var sch=(S&&S.schedule)||{};
  var t=sch.trigger_hkt?new Date(sch.trigger_hkt).getTime():NaN;
  if(isNaN(t))return null;
  var now=Date.now();
  while(t<=now) t+=7*86400000;
  var d=new Date(t);
  var ds=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Hong_Kong',year:'numeric',month:'2-digit',day:'2-digit'}).format(d);
  var hm=new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Hong_Kong',hour:'2-digit',minute:'2-digit',hour12:false}).format(d);
  var wd=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Hong_Kong',weekday:'short'}).format(d);
  var wdMap={Sun:'周日',Mon:'周一',Tue:'周二',Wed:'周三',Thu:'周四',Fri:'周五',Sat:'周六'};
  return {secs:Math.max(0,Math.round((t-Date.now())/1000)),date:ds,hm:hm,wd:wdMap[wd]||''};
}
function nextRunPhrase(){
  var nr=nextRunInfo();
  if(!nr)return '下次时间未知（API 未提供时刻表）';
  return '下次 '+esc(nr.date)+'（'+nr.wd+' '+nr.hm+'，还有 <span class="js-cd num">'+cdShort(nr.secs)+'</span>）';
}
function cdShort(secs){
  var d=Math.floor(secs/86400),h=Math.floor(secs%86400/3600),m=Math.floor(secs%3600/60),s=secs%60;
  if(d>0)return d+' 天 '+h+' 小时';
  if(h>0)return h+' 小时 '+m+' 分';
  return m+' 分 '+s+' 秒';
}
function badge(kind,text,run){
  return '<span class="badge badge-'+kind+(run?' badge-run':'')+'"><span class="dot"></span>'+esc(text)+'</span>';
}
function epi(text){
  return '<div class="epi">'

function isSynthetic(){

function backtestArmName(name){
  /* 回测表里的挑法名要和面板别处叫法一致——同一本账在两处两个名字，
     读者会以为是两个东西。SEL_META 是那张唯一的对照表。 */
  var extra={'generated_ai_native':'只信 AI 端到端','generated_carl_constraint':'只信约束边界'};
  if(extra[name])return extra[name];
  var m=(typeof SEL_META!=='undefined')?selMetaOf(name):null;
  return (m&&m[1])||name;
}
function numOr(v){return (v===null||v===undefined)?'—':Number(v).toFixed(1)}
function topicArm(sc){var t=((S||{}).weekly||{}).topics||[];return t.find(function(x){return x.scorer===sc})||null}
function topicArmNot(sc){var t=((S||{}).weekly||{}).topics||[];return t.find(function(x){return x.scorer!==sc})||null}
function topicChosen(sc){var a=topicArm(sc);return a?(a.chosen||[]):[]}
function topicLabel(tid){
  var t=((S||{}).weekly||{}).topics||[];
  for(var i=0;i<t.length;i++){var sc=(t[i].scores||{})[tid];if(sc&&sc.label)return sc.label}
  return tid;
}
function inFlightRun(){
  if(!S)return null;
  if(S.weekly&&S.weekly.in_flight){
    var r=(S.runs||[]).find(function(x){return x.run_id===S.weekly.run_id});
    return r||{run_id:S.weekly.run_id,started_at:null,as_of:S.weekly.as_of};
  }
  return (S.runs||[]).find(function(x){return x.kind==='weekly'&&!x.ended_at})||null;
}
/* 上次成功周跑：weekly 摘要本身就是最近一次的记录（runs 只保留近 30 条，可能已滚出） */
function lastOkWeekly(){
  var rs=(S&&S.runs||[]).filter(function(r){return r.kind==='weekly'&&r.ok});
  rs.sort(function(a,b){return String(b.ended_at||'').localeCompare(String(a.ended_at||''))});
  if(rs[0])return {as_of:rs[0].as_of,ended_at:rs[0].ended_at};
  var w=(S&&S.weekly)||{};
  if(w.ok&&w.as_of)return {as_of:w.as_of,ended_at:null};
  return null;
}
/* 心跳里记录的各任务结果（weekly failed/ok/not_due 等）——runs 表不含失败的 weekly 尝试时，这是唯一凭据 */
function hbOutcome(job){
  var os=(((S||{}).alive||{}).heartbeat||{}).outcomes||[];
  return os.find(function(o){return o.job===job})||null;
}
function currentBooks(){
  /* 十本账是一场持续的赛马，不是某一期的快照——某本账这期没建成仓（标的当天
     没有价格、或这期它一条也没选中），不代表它退出比较，只代表它这期没加仓。
     原来这里按 run_id 过滤，而 booked_batch 存的是 batch_id，两者永不相等，
     过滤静默失效、靠兜底才显示全部。删掉这个从未生效的过滤，比让它"生效"
     然后把账本从赛马图里抹掉要对：本期是否入账用 booked_as_of 单独标注。 */
  return (S&&S.books)||[];
}
/* 这本账这期加没加仓——供标注用，不用来决定谁出现在图里。 */
function bookedThisPeriod(b){
  var asOf=((S&&S.weekly)||{}).as_of;
  return !!(asOf&&b&&b.booked_as_of===asOf);
}
/* 全账本合计（所有账本同一日期轴时逐日求和；否则不出曲线，只出可加总的量） */
function aggBooks(){
  var bs=currentBooks();
  if(!bs.length)return null;
  var cap=0,openN=0,closedN=0,realized=0,unreal=0,exits={},wins=0;
  bs.forEach(function(b){
    cap+=(b.capital||0);
    openN+=(b.open_positions||[]).length;
    closedN+=(b.closed_n||0);
    wins+=(b.wins||0);
    realized+=(b.realized||0);
    (b.open_positions||[]).forEach(function(p){unreal+=(p.unrealized||0)});
    Object.keys(b.exits||{}).forEach(function(k){exits[k]=(exits[k]||0)+(b.exits[k]||0)});
  });
  var axis=null,sameAxis=true;
  bs.forEach(function(b){
    var ds=(b.equity||[]).map(function(e){return e.d}).join(',');
    if(axis===null)axis=ds;else if(ds!==axis)sameAxis=false;
  });
  var eq=null;
  if(sameAxis&&axis){
    eq=(bs[0].equity||[]).map(function(e,i){
      var s=0;bs.forEach(function(b){s+=((b.equity[i]||{}).equity||0)});
      return {d:e.d,equity:s};
    });
  }
  return {books:bs,capital:cap,openN:openN,closedN:closedN,wins:wins,realized:realized,unrealized:unreal,exits:exits,equity:eq};
}
/* 持仓代码 → 候选池条目（US.BTAL → BTAL） */
function candByCode(code){
  var cands=((((S||{}).weekly||{}).pool)||{}).candidates||[];
  var bare=String(code||'');var i=bare.indexOf('.');if(i>=0)bare=bare.slice(i+1);
  return cands.find(function(c){return c.instrument_id===code||c.instrument_id===bare})||null;
}
function bareCode(code){var s=String(code||'');var i=s.indexOf('.');return i>=0?s.slice(i+1):s}
function maxDrawdown(eq){
  if(!eq||eq.length<2)return null;
  var peak=-Infinity,mdd=0;
  eq.forEach(function(e){
    if(e.equity>peak)peak=e.equity;
    var dd=(e.equity-peak)/peak*100;
    if(dd<mdd)mdd=dd;
  });
  return mdd;
}

/* ── fetch loop ──────────────────────────────────────────────── */
function refresh(){
  /* 静态快照模式：GitHub Pages 没有后端。导出脚本把数据烙进页面
     （window.__STATIC__），此时不发网络请求、不自动刷新，并在页眉
     标注快照时刻——一张过期页面必须自己说明自己是快照，而不是装活。 */
  if(window.__STATIC__){
    S=window.__STATIC__.state||null;
    J=window.__STATIC__.journal||null;JErr=J?null:'静态快照未包含运行日志';
    fetchFailed=false;lastFetchOk=S&&S.generated_at?new Date(S.generated_at):new Date();
    renderAll();
    var st=$('stampText'),fs=$('footStamp');
    var when=S&&S.generated_at?S.generated_at.slice(0,16).replace('T',' '):'?';
    if(st)st.textContent='静态快照 · 截至 '+when+'（非实时）';
    if(fs)fs.textContent='静态快照 · 截至 '+when;
    return;
  }
  /* 主状态到了就先渲染；运行日志（/api/journal）并行取，晚到就补渲染回执条，取不到如实显示原因 */
  fetch('/api/journal',{cache:'no-store'}).then(function(r){
    if(!r.ok)throw new Error('HTTP '+r.status);
    return r.json();
  }).then(function(j){J=j;JErr=null}).catch(function(e){J=null;JErr=e&&e.message?e.message:String(e)})
  .then(function(){if(S){renderProcess();renderDrawers()}});
  fetch('/api/state',{cache:'no-store'}).then(function(r){
    if(!r.ok)throw new Error('HTTP '+r.status);
    return r.json();
  }).then(function(j){
    S=j;fetchFailed=false;lastFetchOk=new Date();
    renderAll();
  }).catch(function(e){
    fetchFailed=true;
    renderDeadBanner(e&&e.message?e.message:String(e));
    renderStamp();
  });
}
function renderStamp(){
  var t=lastFetchOk?new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Hong_Kong',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(lastFetchOk):'--:--:--';
  var txt='刷新于 '+t+' · 每 60 秒自动';
  $('stampText').textContent=txt;$('footStamp').textContent=txt;
  $('stamp').classList.toggle('stale',fetchFailed);
  if(S&&S.alive){
    var ok=!!S.alive.ok&&!fetchFailed;
    $('footDot').style.background=ok?'var(--color-feedback-success-default)':'var(--color-feedback-error-default)';
    $('footHb').textContent='心跳 '+(S.alive.ok?'正常':'丢失')+' · '+ageWord(S.alive.age_s);
  }
  if(fetchFailed){$('footDot').style.background='var(--color-feedback-error-default)';$('footHb').textContent='API 不可达'}
}
function renderDeadBanner(msg){

    +'<svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="10" cy="10" r="8.5" stroke="var(--color-feedback-error-default)" stroke-width="1.5"/><path d="M10 6v5" stroke="var(--color-feedback-error-default)" stroke-width="1.5" stroke-linecap="round"/><circle cx="10" cy="13.8" r="1" fill="var(--color-feedback-error-default)"/></svg>'
    +'<div><div class="banner-title">无法连接数据服务（/api/state）</div>'

/* ── 推理链条（故事的副标题——节点直接开过程抽屉，不切页） ── */
function chainStrip(ag){
  var w=S.weekly||{};
  var gens=w.generators||[];
  var nIdeas=gens.reduce(function(s,g){return s+(g.n||0)},0);
  var nTopics=topicChosen('hgep').length;
  var poolN=(w.pool||{}).n||0;
  var books=ag?ag.books:[];
  var uniq={};books.forEach(function(b){(b.open_positions||[]).forEach(function(p){uniq[p.code]=1})});
  var nUniq=Object.keys(uniq).length;
  var nr=nextRunInfo();

  function node(val,unit,label,sub,click,hot){
    var inner='<span class="cn-num num">'+val+(unit?'<span class="u"> '+unit+'</span>':'')+'</span>'
      +'<span class="cn-label">'+label+'</span>'
      +(sub?'<span class="cn-sub">'+sub+'</span>':'')
      +(click?'<span class="cn-go">点开看 ›</span>':'');
    return click
      ?'<button type="button" class="chain-node'+(hot?' hot':'')+'" onclick="'+click+'">'+inner+'</button>'
      :'<div class="chain-node'+(hot?' hot':'')+'">'+inner+'</div>';
  }
  var arrow='<span class="chain-arrow" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3 7h7M7.5 4 11 7l-3.5 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>';

  var nodes=[];
  nodes.push(node(w.corpus_total?fmtInt(w.corpus_total):'—','篇','读研报',w.corpus_total?'宏观语料':'本期未读入','gotoProc(0)'));
  nodes.push(node(nTopics?fmtInt(nTopics):'—','个','选主题',nTopics?'HGEP 打分':'待筛选A','gotoProc(1)'));
  nodes.push(node(nIdeas?fmtInt(nIdeas):'—','条','写想法',gens.length?gens.length+' 种方式':'待筛选B','gotoProc(2)'));
  nodes.push(node(poolN?fmtInt(poolN):'—','条','合并候选',poolN?'一标一条':'待合并','gotoProc(3)'));
  nodes.push(node(books.length?fmtInt(books.length):'—','本','账各自挑',(w.selectors||[]).length?(w.selectors||[]).length+' 种挑法':'待筛选C','gotoProc(4)'));
  nodes.push(node(ag?fmtInt(ag.openN):'—','仓','现在持有',ag?(nUniq+' 个标的'):'尚未建仓','gotoWeekAnchor(\'holdCard\')',true));

  var story;
  if(ag&&books.length){
    story='这一期：<b class="num">'+fmtInt(w.corpus_total||0)+'</b> 篇研报 → <b class="num">'+fmtInt(nTopics)+'</b> 个主题 → '
      +'<b class="num">'+fmtInt(nIdeas)+'</b> 条想法 → <b class="num">'+fmtInt(poolN)+'</b> 条候选 → '
      +'<b class="num">'+fmtInt(books.length)+'</b> 本账 → <b class="num">'+fmtInt(ag.openN)+'</b> 仓（'+fmtInt(nUniq)+' 个标的）。点任何节点拉开那一步的现场。';
  }else if(w.in_flight){
    story='本期选仓正在进行——链条节点会随每一步完成逐个亮起。';
  }else{
    story='还没有入账的组合'+(nr?'——下次周跑 '+esc(nr.date)+'（'+nr.wd+' '+nr.hm+'）后，这条链会填上全部数字':'（API 未提供下次时刻）')+'。';
  }
  return '<div class="card chain-card chain-lite section" aria-label="本期推理链">'
    +'<div class="chain-scroll scroll-thin"><div class="chain">'+nodes.join(arrow)+'</div></div>'
    +'<div class="chain-story">'+story+'</div>'

function bookRet(b){

  });

/* 单账/合计净值曲线（期初 = 100） */
function singleCurveSVG(lb){
  var eq=lb.equity||[];
  var base=eq[0].equity||lb.capital||1;
  var vs=eq.map(function(e){return e.equity/base*100});
  var W=760,H=150,pl=44,pr=14,pt=10,pb=22;
  var mn=Math.min.apply(null,vs),mx=Math.max.apply(null,vs);
  if(mx-mn<0.5){mn-=0.5;mx+=0.5}
  function X(i){return pl+i*(W-pl-pr)/Math.max(1,vs.length-1)}
  function Y(v){return pt+(mx-v)/(mx-mn)*(H-pt-pb)}
  var pts=vs.map(function(v,i){return X(i).toFixed(1)+','+Y(v).toFixed(1)}).join(' ');
  var col=vs[vs.length-1]>=100?'var(--color-stock-up-default)':'var(--color-stock-down-default)';
  var svg='<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block;max-width:800px" role="img" aria-label="净值曲线">';
  [mx,100,mn].forEach(function(g){
    if(g<mn-0.01||g>mx+0.01)return;
    svg+='<line x1="'+pl+'" y1="'+Y(g)+'" x2="'+(W-pr)+'" y2="'+Y(g)+'" stroke="var(--color-border-subtle)" stroke-width="1"'+(g===100?' stroke-dasharray="4 3"':'')+'/>'
      +'<text x="'+(pl-6)+'" y="'+(Y(g)+4)+'" text-anchor="end" font-family="var(--font-mono)" font-size="11" fill="var(--color-text-tertiary)">'+g.toFixed(1)+'</text>';
  });
  svg+='<polyline points="'+pts+'" fill="none" stroke="'+col+'" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>';
  svg+='<text x="'+pl+'" y="'+(H-6)+'" font-family="var(--font-mono)" font-size="11" fill="var(--color-text-tertiary)">'+esc(eq[0].d)+'</text>';
  svg+='<text x="'+(W-pr)+'" y="'+(H-6)+'" text-anchor="end" font-family="var(--font-mono)" font-size="11" fill="var(--color-text-tertiary)">'+esc(eq[eq.length-1].d)+'</text>';
  svg+='</svg>';
  return '<div class="funnel-wrap">'+svg+'</div>';
}

function pairedEquitySVG(books){
  var withEq=books.filter(function(b){return (b.equity||[]).length>=2});
  if(!withEq.length)return '<div class="quiet">净值曲线待累积——首个盯市日后出现。</div>';
  var dates={};
  withEq.forEach(function(b){(b.equity||[]).forEach(function(e){dates[e.d]=1})});
  var ds=Object.keys(dates).sort();
  var W=760,H=220,pl=44,pr=110,pt=12,pb=24;
  var mn=Infinity,mx=-Infinity;
  var list=withEq.map(function(b,bi){
    var base=(b.equity[0]||{}).equity||b.capital||1;
    var m={};(b.equity||[]).forEach(function(e){m[e.d]=e.equity/base*100});
    var vals=ds.map(function(d){return m[d]!==undefined?m[d]:null});
    vals.forEach(function(v){if(v!==null){if(v<mn)mn=v;if(v>mx)mx=v}});
    return {name:selMetaOf(b.selector)[1],vals:vals,col:bookColor(b.selector)};
  });
  if(mx-mn<0.5){mn-=0.5;mx+=0.5}
  var xw=(W-pl-pr)/Math.max(1,ds.length-1);
  function X(i){return pl+i*xw}
  function Y(v){return pt+(mx-v)/(mx-mn)*(H-pt-pb)}
  var svg='<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block;max-width:800px" role="img" aria-label="多种挑法净值对比，期初=100">';
  [mx,100,mn].forEach(function(g){
    if(g<mn-0.01||g>mx+0.01)return;
    svg+='<line x1="'+pl+'" y1="'+Y(g)+'" x2="'+(W-pr)+'" y2="'+Y(g)+'" stroke="var(--color-border-subtle)" stroke-width="1"'+(g===100?' stroke-dasharray="4 3"':'')+'/>'
      +'<text x="'+(pl-6)+'" y="'+(Y(g)+4)+'" text-anchor="end" font-family="var(--font-mono)" font-size="11" fill="var(--color-text-tertiary)">'+g.toFixed(1)+'</text>';
  });
  /* 末端直标：先按末值排序，再逐个下压避免互相叠字 */
  var ends=[];
  list.forEach(function(s){
    var pts=[];
    s.vals.forEach(function(v,i){if(v!==null)pts.push(X(i).toFixed(1)+','+Y(v).toFixed(1))});
    if(pts.length<2)return;
    svg+='<polyline points="'+pts.join(' ')+'" fill="none" stroke="'+s.col+'" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>';
    var li=s.vals.length-1;while(li>=0&&s.vals[li]===null)li--;
    if(li>=0)ends.push({s:s,li:li,y:Y(s.vals[li])});
  });
  ends.sort(function(a,b){return a.y-b.y});
  var lastY=-99;
  ends.forEach(function(e){
    var ly=Math.max(e.y,lastY+12);lastY=ly;
    svg+='<circle cx="'+X(e.li)+'" cy="'+e.y.toFixed(1)+'" r="2.5" fill="'+e.s.col+'"/>'
      +'<text x="'+(X(e.li)+8)+'" y="'+(ly+4).toFixed(1)+'" font-family="var(--font-sans)" font-size="11" fill="'+e.s.col+'">'+esc(e.s.name)+' '+e.s.vals[e.li].toFixed(1)+'</text>';
  });
  svg+='<text x="'+pl+'" y="'+(H-6)+'" font-family="var(--font-mono)" font-size="11" fill="var(--color-text-tertiary)">'+esc(ds[0])+'</text>'
    +'<text x="'+(W-pr)+'" y="'+(H-6)+'" text-anchor="end" font-family="var(--font-mono)" font-size="11" fill="var(--color-text-tertiary)">'+esc(ds[ds.length-1])+'</text>'
    +'</svg>';
  return '<div class="funnel-wrap">'+svg+'</div>'
    +'<div class="card-note" style="margin-top:2px">净值指数：期初 = 100，同轴可比；虚线为盈亏平衡线</div>';
}

  var t=' · 同期只买 '+(bm.code||'SPY').replace('US.','')+' <span class="num '+pctCls(r)+'" title="'+sr[0].d+' 至 '+sr[sr.length-1].d+' 的 SPY 收盘价涨跌，作为「什么都不做」的参照">'+fmtPct(r)+'</span>';

   把它紧贴表格放，避免一个 69% 被单独读成结论。 */
function pairedVerdictLine(sum){
  var pr=(sum&&sum.paired)||{};
  var names=Object.keys(pr);
  if(!names.length)return '';
  var any=pr[names[0]]||{};
  var n=any.n_pairs||sum.periods||0;
  var won=names.filter(function(k){return pr[k]&&pr[k].conclusive});
  if(won.length){
    return '<div class="card-note" style="margin-top:var(--space-3)">'
      +'配对检验：<b>'+won.map(function(k){return esc(backtestArmName(k))}).join('、')
      +'</b> 已达到预注册的显著性门槛（'+fmtInt(n)+' 对样本）。</div>';
  }
  return '<div class="card-note" style="margin-top:var(--space-3)">'
    +'配对检验：<b>目前没有任何一种挑法能被判定赢了全买对照</b>——'
    +'只有 '+fmtInt(n)+' 对配对样本，远低于预注册门槛。'
    +'上面的胜率是描述这段窗口发生了什么，不是对未来的预测，也还不足以排名。</div>';

function backtestCard(){
  var b=(S&&S.backtest)||{};
  var sum=b.summary||{};
  if(!b.backtest_id){
    return '<div class="card section"><div class="card-title-row">'
      +'<h2 class="card-title">历史回测</h2>'
      +'<span class="card-note">真实候选池 · 真实收盘 · 零模型复算</span></div>'
      +'<div class="empty-sm">还没有回测记录。需要至少两期存下来的候选池才能做配对比较——'
      +'每周三自动跑一期，也可以补跑历史期。</div></div>';
  }
  var arms=sum.arms||{};
  var names=Object.keys(arms);
  var best=null;
  names.forEach(function(n){
    var a=arms[n];
    if(a&&a.hit_rate!=null&&(best===null||a.hit_rate>arms[best].hit_rate))best=n;
  });
  var nBack=sum.n_backfill_periods||0;
  var mix=nBack
    ? '<span class="gloss" title="事后补跑的期：文档卡在当期，但模型权重见过之后的世界，货架上还有没有上架日期的标的无法按期过滤。结论以 live 期为准。">'
      +sum.n_live_periods+' 期实盘记录 + '+nBack+' 期事后补跑 ⓘ</span>'
    : '<span>'+(sum.n_live_periods||sum.periods)+' 期全部为实盘记录</span>';

function backtestSection(){

    +'<div class="meta-kv"><div class="k">持久化</div><div class="v">RDS 明细 · '+(b.artifact_archived?'TOS 不可变归档':'未归档')+'</div></div>'

    +backtestCurveSVG(points)
    +'<div class="bt-legend">'
      +names.map(function(n,i){return '<span><i class="bt-swatch" style="background:var(--color-data-'+(i%8+1)+')"></i>'+esc(backtestArmName(n))+'</span>'}).join('')
    +'</div></div>';

  var armRows=names.map(function(name){
