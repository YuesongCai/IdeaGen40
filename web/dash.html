.pg-m .t{font:500 13px/18px var(--font-sans);color:var(--color-text-primary);white-space:nowrap}
.pg-m .s{font:400 11px/14px var(--font-sans);color:var(--color-text-tertiary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg-cell{border:none;border-radius:var(--radius-md);height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font:600 15px/20px var(--font-mono);color:var(--color-text-primary);transition:box-shadow var(--duration-fast) var(--ease-standard)}
.pg-cell:hover{box-shadow:inset 0 0 0 2px var(--color-border-brand-subtle)}
.pg-cell .u{font:400 10px/12px var(--font-sans);color:var(--color-text-metadata)}
.pg-cell.empty{cursor:default;color:var(--color-text-disabled);background:var(--color-surface-subtle)}
.pg-tail{display:flex;flex-direction:column;justify-content:center;font:400 11px/15px var(--font-sans);color:var(--color-text-tertiary);white-space:nowrap}
.pg-tail b{font:500 12px/16px var(--font-mono);color:var(--color-text-primary)}

/* 合并汇流气泡 */
.merge-line{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:var(--space-4)}
.merge-line .big{font:600 26px/34px var(--font-mono);color:var(--color-text-primary)}
.merge-line .arr{color:var(--color-text-tertiary)}
.bub-group{display:flex;gap:var(--space-3);align-items:flex-start;padding:var(--space-3) 0}
.bub-group+.bub-group{border-top:1px solid var(--color-border-subtle)}
.bub-k{width:150px;flex:none;padding-top:4px}
.bub-k .t{font:500 13px/18px var(--font-sans);color:var(--color-text-primary)}
.bub-k .s{font:400 11px/15px var(--font-sans);color:var(--color-text-tertiary)}
.bub-cloud{display:flex;flex-wrap:wrap;gap:7px;align-items:center;min-width:0}
.bub{border-radius:999px;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;font:500 10px/12px var(--font-mono);color:var(--color-text-brand);transition:box-shadow var(--duration-fast) var(--ease-standard);padding:0}
.bub:hover{box-shadow:0 0 0 2px var(--color-accent)}

/* 筛选C 闸门矩阵 */
.sel-legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-2) var(--space-5);margin-bottom:var(--space-5)}
@media (max-width:1080px){.sel-legend{grid-template-columns:minmax(0,1fr)}}
.sel-leg{display:flex;flex-wrap:wrap;gap:10px;align-items:baseline;padding:6px 8px;border-radius:var(--radius-md)}
.sel-leg .nm{font:500 13px/18px var(--font-sans);color:var(--color-text-primary);white-space:nowrap}
.sel-leg .bel{font:400 12px/17px var(--font-sans);color:var(--color-text-metadata)}
.ask-btn.ask-end{margin-left:auto;flex:none}
.gate-table th.rot{height:84px;vertical-align:bottom;padding:0 0 8px}
.gate-table th.rot .r-in{writing-mode:vertical-rl;transform:rotate(180deg);font:500 11px/14px var(--font-sans);color:var(--color-text-metadata);white-space:nowrap;margin:0 auto}
.gate-table td.gd{text-align:center;padding:4px 6px}
.gate-dot{width:11px;height:11px;border-radius:999px;display:inline-block;background:var(--color-surface-brand-strong)}
.gate-dot.ctl{background:var(--color-border-strong)}
.gate-miss{color:var(--color-border-default);font:400 11px/11px var(--font-mono)}
/* 候选池全表的「生成方法」曾把 4 个方法名竖着堆进 220px 的格子里，每行因此
 * 四倍高，73 行的表长得离谱，右边两列还被挤出可视区。而展开的详情行里
 * 本来就写着「生成方法：A / B / C / D」——列里那份是第二遍。
 * 改用闸门矩阵已有的语言：一行四个点，亮 = 这个方法提出了它。 */
.mdots{display:inline-flex;gap:3px;align-items:center;vertical-align:middle}
.mdot{width:9px;height:9px;border-radius:999px;display:inline-block;background:var(--color-border-default)}
.mdot.on{background:var(--color-surface-brand-strong)}

/* 建仓刻度条 */
.pos-line{display:grid;grid-template-columns:78px 26px minmax(0,1fr) 212px 78px;gap:var(--space-2);align-items:center;padding:5px 0;border-top:1px solid var(--color-border-subtle)}
.pos-line:first-child{border-top:none}
.pos-code{font:500 12px/16px var(--font-mono);color:var(--color-text-primary)}
.pos-nm{font:400 12px/16px var(--font-sans);color:var(--color-text-tertiary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rngwrap{display:flex;flex-direction:column;gap:2px;min-width:0}
.rng{position:relative;height:14px}
.rng-track{position:absolute;left:0;right:0;top:5px;height:4px;border-radius:999px;background:linear-gradient(90deg,var(--color-stock-down-subtle),var(--color-surface-muted) 40%,var(--color-stock-up-subtle))}
.rng-tick{position:absolute;top:1px;width:2px;height:12px;border-radius:1px;background:var(--color-fill-secondary)}
.rng-last{position:absolute;top:2px;width:10px;height:10px;border-radius:999px;border:2px solid var(--color-surface-white);box-shadow:var(--shadow-xs)}
.rng-last.edge{box-shadow:0 0 0 2px var(--color-feedback-warning-default)}
.rng-end{position:absolute;top:5px;width:2px;height:4px;background:var(--color-border-strong)}
.rng-vals{display:flex;justify-content:space-between;gap:4px;font:400 9px/11px var(--font-mono);color:var(--color-text-tertiary);white-space:nowrap}
.rng-vals .cur{color:var(--color-text-primary);font-weight:600}
.rng-ofl{font:500 10px/13px var(--font-sans)}
.rng-ofl.down{color:var(--color-stock-down-text)}
.rng-ofl.up{color:var(--color-stock-up-text)}
.pos-pnl{text-align:right;font:500 12px/16px var(--font-mono)}
.pos-headr{display:grid;grid-template-columns:78px 26px minmax(0,1fr) 212px 78px;gap:var(--space-2);font:400 10px/14px var(--font-sans);color:var(--color-text-tertiary);padding-bottom:3px}
/* 窄屏：五列硬塞进 ~400px 的抽屉，被挤没的一定是标的名称（算下来正好 0px）。
   与其让它消失，不如把刻度条整条挪到第二行——它本来就是四个价位一起读的东西，
   横过来反而更看得清。按位置而不是按类名指派单元格：σ 算不出时第四格换成的是
   .card-note，不是 .rngwrap。 */
@media (max-width:1180px){
  .pos-line{grid-template-columns:70px 26px minmax(0,1fr) 74px;
            grid-template-areas:"code ask name pnl" "bar bar bar bar";row-gap:3px}
  .pos-line>:nth-child(1){grid-area:code}
  .pos-line>:nth-child(2){grid-area:ask}
  .pos-line>:nth-child(3){grid-area:name}
  .pos-line>:nth-child(4){grid-area:bar}
  .pos-line>:nth-child(5){grid-area:pnl}
  .pos-headr{grid-template-columns:70px 26px minmax(0,1fr) 74px}
  .pos-headr>:nth-child(4){display:none}
}

/* ══════════ 抽屉系统（hover 速览 + 点击深钻 + 可叠三层） ══════════ */
.drawer-scrim{position:fixed;inset:0;background:var(--color-overlay-image);z-index:69}
.drawer{
  position:fixed;top:0;right:0;bottom:0;background:var(--color-surface-white);
  box-shadow:-10px 0 36px rgb(0 0 0 / 16%);display:flex;flex-direction:column;
  animation:drIn var(--duration-slow) var(--ease-out);
}
.drawer.under{pointer-events:none}
.drawer.under::after{content:'';position:absolute;inset:0;background:rgb(0 0 0 / 16%);border-radius:0}
@keyframes drIn{from{transform:translateX(48px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.drawer{animation:none}}
.drawer-head{padding:var(--space-4) var(--space-6) var(--space-3);border-bottom:1px solid var(--color-border-default);flex:none}
.drawer-crumbs{display:flex;align-items:center;gap:4px;font:400 12px/16px var(--font-sans);color:var(--color-text-tertiary);flex-wrap:wrap}
.drawer-crumb{color:var(--color-text-tertiary);border-radius:var(--radius-xs);padding:1px 4px}
.drawer-crumb:not(.cur):hover{background:var(--color-surface-subtle);color:var(--color-text-brand);text-decoration:underline;text-underline-offset:2px}
button.drawer-crumb:not(.cur){color:var(--color-text-metadata);border-bottom:1px dotted var(--color-border-strong)}
.drawer-crumb.cur{color:var(--color-text-primary);font-weight:500;cursor:default}
.drawer-title-row{display:flex;align-items:baseline;gap:var(--space-3);margin-top:4px}
.drawer-title{font:600 18px/26px var(--font-sans);color:var(--color-text-primary)}
.drawer-q{font:400 12px/17px var(--font-sans);color:var(--color-text-tertiary);min-width:0}
.drawer-x{
  margin-left:auto;flex:none;width:28px;height:28px;border-radius:var(--radius-sm);
  display:flex;align-items:center;justify-content:center;color:var(--color-text-tertiary);align-self:center;
}
.drawer-x:hover{background:var(--color-surface-subtle);color:var(--color-text-primary)}
.drawer-body{flex:1;overflow-y:auto;padding:var(--space-5) var(--space-6);overscroll-behavior:contain}
@media (max-width:1023px){.drawer{width:100vw !important}}
.drawer .book-grid{grid-template-columns:minmax(0,1fr)}
.drawer .race-row{grid-template-columns:132px minmax(0,1fr) 118px;gap:var(--space-2)}
.drawer .sel-legend{grid-template-columns:minmax(0,1fr)}
.drawer .topic-cols{grid-template-columns:minmax(0,1fr)}
.pgrid-wrap{overflow-x:auto}
/* 曾写死 min-width:620px，而抽屉里能给它的只有 586px——网格因此永远比
 * 容器宽 34px，最右的「合计」列一上来就被裁。下限交给各列自己的 minmax
 * （合计 532px），窄到那以下才滚动。 */
.drawer .pgrid{min-width:0}
body.drawer-lock{overflow:hidden}

/* hover 速览 popover */
.pc-pop{
  position:fixed;z-index:96;pointer-events:none;background:var(--color-surface-white);
  border:1px solid var(--color-border-default);border-radius:var(--radius-md);
  box-shadow:var(--shadow-dark);padding:10px 12px;max-width:320px;
  font:400 12px/17px var(--font-sans);color:var(--color-text-secondary);
  opacity:0;transition:opacity 120ms var(--ease-standard);
}
.pc-pop.show{opacity:1}
@media (prefers-reduced-motion:reduce){.pc-pop{transition:none}}
.pc-pop .pp-t{font:600 13px/18px var(--font-sans);color:var(--color-text-primary);margin-bottom:2px}
.pc-pop .pp-n{font:500 12px/17px var(--font-mono);color:var(--color-text-primary);margin:2px 0}
.pc-pop .pp-s{color:var(--color-text-tertiary)}

/* 运行回执条（过程页唯一保留的日志入口） */
.run-receipt{
  display:flex;align-items:center;gap:12px;width:100%;background:var(--color-surface-inverse);
  border-radius:var(--radius-lg);padding:11px var(--space-5);cursor:pointer;
  font:500 12px/18px var(--font-mono);color:#c9d2ce;text-align:left;box-shadow:var(--shadow-card);
}
.run-receipt:hover{box-shadow:var(--shadow-dark)}
.run-receipt .dot{width:9px;height:9px;border-radius:999px;background:var(--color-accent);flex:none}
.run-receipt .dot.bad{background:#ff9a9a}
.run-receipt .rr-main{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.run-receipt .go{margin-left:auto;flex:none;font-family:var(--font-sans);color:#aeb6b2}
.run-receipt:hover .go{color:#fbfbfb}

/* ══════════ 本周 v2 — 老板一眼版 ══════════ */
.hero2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:var(--space-6);align-items:center}
@media (max-width:1080px){.hero2{grid-template-columns:minmax(0,1fr)}}
.h2-label{font:500 12px/16px var(--font-sans);color:var(--color-text-tertiary)}
.h2-big{font:600 46px/54px var(--font-sans);letter-spacing:-.01em;margin:2px 0 var(--space-2)}
.h2-subs{display:flex;gap:var(--space-4) var(--space-5);flex-wrap:wrap}
.h2-sub .v{font:600 16px/22px var(--font-sans)}
.h2-sub .k{font:400 11px/15px var(--font-sans);color:var(--color-text-tertiary)}
.chain-lite .cn-num{font-size:16px;line-height:22px}
.chain-lite{padding:var(--space-3) var(--space-5)}
/* 持仓组合地图 */
/* 主题行是收纳的盖子，标的云是它的内容——所以这里是纵向的两段，
   不再是「172px 标签 + 一片气泡」的横向并排。 */
.hm-group{padding:var(--space-2) 0}
.hm-group+.hm-group{border-top:1px solid var(--color-border-subtle)}
.hm-head-row{display:flex;align-items:center;gap:var(--space-3)}
.hm-head{
  flex:1;min-width:0;display:flex;align-items:center;gap:8px;cursor:pointer;text-align:left;
  padding:6px 8px;margin-left:-8px;border-radius:var(--radius-sm);
  transition:background-color var(--duration-fast) var(--ease-standard);
}
.hm-head:hover{background:var(--color-surface-subtle)}
.hm-group[data-open="1"] .fold-chev{transform:rotate(90deg)}
.hm-t{font:600 13px/19px var(--font-sans);color:var(--color-text-primary);white-space:nowrap}
.hm-c{font:400 11px/15px var(--font-mono);color:var(--color-text-tertiary);letter-spacing:.04em;white-space:nowrap}
.hm-s{
  margin-left:auto;flex:none;white-space:nowrap;
  font:400 12px/16px var(--font-sans);color:var(--color-text-tertiary);
}
.hm-cloud{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-width:0;padding:var(--space-2) 0 var(--space-3) 22px}
.hm-acts{display:flex;align-items:center;gap:var(--space-3);flex:1 0 100%;margin-bottom:2px}
.hbub{
  border-radius:999px;border:none;display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;font:600 10px/12px var(--font-mono);padding:0;
  transition:box-shadow var(--duration-fast) var(--ease-standard);
}
.hbub:hover{box-shadow:0 0 0 2px var(--color-accent)}
.hbub .bp{font:400 9px/11px var(--font-mono);opacity:.85}
.hm-legend{display:flex;gap:var(--space-5);flex-wrap:wrap;font:400 12px/16px var(--font-sans);color:var(--color-text-tertiary);margin-bottom:var(--space-3)}
.seg-btn{
  font:500 12px/16px var(--font-sans);color:var(--color-text-metadata);
  border:1px solid var(--color-border-default);padding:4px 12px;background:var(--color-surface-white);
}
.seg-btn:first-child{border-radius:var(--radius-sm) 0 0 var(--radius-sm)}
.seg-btn:last-child{border-radius:0 var(--radius-sm) var(--radius-sm) 0;border-left:none}
.seg-btn.on{background:var(--color-surface-brand);color:var(--color-text-on-brand);border-color:var(--color-surface-brand)}
/* 选取策略指标条 */
.medal-strip{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:var(--space-4)}
.medal{
  display:inline-flex;align-items:center;gap:8px;border-radius:var(--radius-pill);
  padding:5px 13px 5px 7px;font:400 13px/18px var(--font-sans);color:var(--color-text-secondary);
  border:1px solid var(--color-border-default);background:var(--color-surface-white);cursor:pointer;
}
.medal:hover{box-shadow:0 0 0 2px var(--color-accent)}
.medal .rk{
  width:20px;height:20px;border-radius:999px;background:var(--color-surface-muted);
  display:flex;align-items:center;justify-content:center;font:600 11px/20px var(--font-mono);color:var(--color-text-metadata);flex:none;
}
.medal.arm{background:var(--color-surface-brand-subtle);border-color:var(--color-border-brand-subtle)}
.medal.arm .rk{background:var(--color-surface-brand);color:var(--color-text-on-brand)}
.medal.ctl{background:var(--color-feedback-neutral-subtle);color:var(--color-text-metadata)}
.medal b{font:600 13px/18px var(--font-mono)}
/* 迷你链条徽标：本周各段 = 过程流水线的某个环节 */
/* 链条徽标是「你在第几环」的位置指示，不是控件。它曾经也是个按钮，
 * 而且每次都紧挨着一个写明去向的文字入口，两者点下去完全一样——
 * 一个看不出能点、一个看得出，读者只能挨个试。现在它只负责指位置。 */
.mini-chain{display:inline-flex;align-items:center;padding:2px 5px;flex:none}
/* 气泡上的共识徽标（n/8 个组合共同持有） */
.hbub{position:relative}
.hbub .bb{
  position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);
  background:var(--color-surface-white);border:1px solid var(--color-border-default);
  border-radius:var(--radius-pill);font:600 8px/11px var(--font-mono);
  color:var(--color-text-metadata);padding:0 4px;white-space:nowrap;pointer-events:none;
}
.hbub.hi{box-shadow:0 0 0 2px var(--color-border-brand-subtle)}
.hbub.hi .bb{border-color:var(--color-border-brand-subtle);color:var(--color-text-brand)}
.hbub.hi:hover{box-shadow:0 0 0 2px var(--color-accent)}
.hm-cloud{row-gap:12px;padding-bottom:5px}
.agg-line{font:400 13px/19px var(--font-sans);color:var(--color-text-metadata);margin-top:var(--space-3)}
.agg-line .num{font-weight:600;color:var(--color-text-secondary)}
/* 噪音带图（策略对比主视觉） */
.nb-axis{font:500 11px/15px var(--font-sans);color:var(--color-text-metadata)}
.nb-head{position:relative;height:14px;margin:2px 86px 0 142px;font:400 10px/14px var(--font-mono);color:var(--color-text-tertiary)}
.nb-head i{position:absolute;transform:translateX(-50%);font-style:normal}
.nb-plot{position:relative;padding:4px 0 2px}
.nb-ov{position:absolute;top:0;bottom:0;left:142px;right:86px;pointer-events:none;z-index:0}
.nb-band{position:absolute;top:0;bottom:0;background:var(--color-surface-subtle);border-left:1px dashed var(--color-border-strong);border-right:1px dashed var(--color-border-strong)}
.nb-zero{position:absolute;top:0;bottom:0;width:2px;background:var(--color-border-brand-subtle)}
.nb-row{position:relative;display:grid;grid-template-columns:130px minmax(0,1fr) 74px;gap:12px;align-items:center;padding:3px 0;border:none;width:100%;text-align:left;cursor:pointer;border-radius:var(--radius-sm);z-index:1}
.nb-row:hover .nb-name{color:var(--color-text-brand)}
.nb-name{font:500 12px/16px var(--font-sans);color:var(--color-text-primary);display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nb-sw{width:9px;height:9px;border-radius:999px;display:inline-block;flex:none}
.nb-track{position:relative;height:16px}
.nb-dot{position:absolute;top:50%;transform:translate(-50%,-50%);width:12px;height:12px;border-radius:999px;border:2px solid;box-shadow:var(--shadow-xs)}
.nb-dot.ref{width:10px;height:10px}
.nb-val{font:500 12px/16px var(--font-mono);text-align:right;color:var(--color-text-secondary);white-space:nowrap}
.nb-cap{font:400 11px/15px var(--font-sans);color:var(--color-text-tertiary);margin-top:2px}
.nb-prog{display:flex;align-items:center;gap:12px;margin-top:var(--space-3);font:400 12px/16px var(--font-sans);color:var(--color-text-metadata)}
.nb-pbar{flex:1;max-width:320px;height:6px;border-radius:999px;background:var(--color-surface-muted);overflow:hidden}
.nb-pbar span{display:block;height:100%;background:var(--color-surface-brand-strong);border-radius:999px}
@media (max-width:1180px){.nb-row{grid-template-columns:110px minmax(0,1fr) 70px}.nb-ov{left:122px;right:82px}.nb-head{margin:2px 82px 0 122px}}
/* 抽屉寻路：返回键 / 深度指示 / 类型面包屑 / 底层 peek 条 / 聚焦高亮 */
.drawer-back{
  flex:none;font:500 13px/18px var(--font-sans);color:var(--color-text-brand);
  border:1px solid var(--color-border-brand-subtle);border-radius:var(--radius-sm);
  padding:3px 10px;background:var(--color-surface-brand-subtle);align-self:center;
}
.drawer-back:hover{background:var(--color-surface-brand-muted)}
.depth-ind{font:500 11px/16px var(--font-mono);color:var(--color-text-metadata);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.depth-dots{display:inline-flex;gap:3px}
.depth-dots .dd{width:6px;height:6px;border-radius:999px;background:var(--color-border-strong);display:inline-block}
.depth-dots .dd.cur{width:8px;height:8px;background:var(--color-surface-brand)}
.crumb-k{
  font:500 10px/14px var(--font-sans);color:var(--color-text-brand);
  background:var(--color-surface-brand-subtle);border-radius:var(--radius-xs);
  padding:0 4px;margin-right:3px;
}
.drawer-crumb.cur .crumb-k{background:var(--color-surface-brand);color:var(--color-text-on-brand)}
.peek-strip{
  position:absolute;left:0;top:0;bottom:0;width:22px;z-index:2;pointer-events:auto;
  background:var(--color-surface-brand-subtle);border-right:1px solid var(--color-border-brand-subtle);
  display:flex;align-items:flex-start;justify-content:center;padding-top:14px;cursor:pointer;
}
.peek-strip span{
  writing-mode:vertical-rl;font:500 11px/14px var(--font-sans);color:var(--color-text-brand);
  white-space:nowrap;max-height:60vh;overflow:hidden;text-overflow:ellipsis;
}
.peek-strip:hover{background:var(--color-surface-brand-muted)}
.drawer .foc{box-shadow:0 0 0 2px var(--color-surface-brand-strong);border-radius:var(--radius-sm)}
.drawer .dim{opacity:.4}
/* ── 问它当时怎么想（ask drawer） ── */
.ask-scope{background:var(--color-surface-subtle);border:1px solid var(--color-border-default);border-radius:var(--radius-sm);padding:var(--space-3) var(--space-4);font:400 12px/18px var(--font-sans);color:var(--color-text-secondary)}
.ask-scope b{color:var(--color-text-primary);font-weight:600}
.ask-mats{margin-top:var(--space-2)}
.ask-mats summary{cursor:pointer;font:500 12px/18px var(--font-sans);color:var(--color-text-brand)}
.ask-mats .mrow{display:flex;gap:6px;align-items:baseline;padding:3px 0;border-bottom:1px dashed var(--color-border-default);font:400 12px/17px var(--font-sans)}
.ask-mats .mid{flex:none;font:500 11px/16px var(--font-mono,ui-monospace,monospace);color:var(--color-text-on-brand);background:var(--color-surface-brand);border-radius:var(--radius-xs);padding:0 4px}
.mref{border:0;background:none;padding:0 1px;cursor:pointer;color:var(--color-text-brand);font:600 inherit/inherit var(--font-sans);text-decoration:underline dotted}
.mref:hover{background:var(--color-surface-brand-subtle);border-radius:3px}
.ask-mats .mrow.hit{background:var(--color-surface-brand-subtle);border-radius:var(--radius-xs)}
.ask-mats .msrc{color:var(--color-text-metadata);font-family:var(--font-mono,ui-monospace,monospace);font-size:11px;word-break:break-all}
.ask-chat{margin-top:var(--space-4);display:flex;flex-direction:column;gap:var(--space-3)}
.ask-q{align-self:flex-end;max-width:86%;background:var(--color-surface-brand);color:var(--color-text-on-brand);border-radius:var(--radius-md) var(--radius-md) var(--radius-xs) var(--radius-md);padding:var(--space-2) var(--space-3);font:400 13px/19px var(--font-sans);white-space:pre-wrap}
.ask-a{align-self:flex-start;max-width:94%;background:var(--color-surface-default);border:1px solid var(--color-border-default);border-radius:var(--radius-md) var(--radius-md) var(--radius-md) var(--radius-xs);padding:var(--space-3) var(--space-4);font:400 13px/20px var(--font-sans);color:var(--color-text-primary);white-space:pre-wrap;word-break:break-word}
.ask-a.err{border-color:var(--color-feedback-error-default);color:var(--color-feedback-error-text);white-space:normal}
.ask-cites{margin-top:var(--space-2);padding-top:var(--space-2);border-top:1px dashed var(--color-border-default);display:flex;flex-wrap:wrap;gap:4px;white-space:normal}
.ask-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:var(--space-3)}
.ask-chip{border:1px solid var(--color-border-strong);background:var(--color-surface-default);border-radius:999px;padding:4px 10px;font:400 12px/17px var(--font-sans);color:var(--color-text-secondary);cursor:pointer}
.ask-chip:hover{border-color:var(--color-surface-brand-strong);color:var(--color-text-brand);background:var(--color-surface-brand-muted)}
.ask-inrow{display:flex;gap:var(--space-2);margin-top:var(--space-3)}
.ask-input{flex:1;border:1px solid var(--color-border-strong);border-radius:var(--radius-sm);padding:8px 10px;font:400 13px/19px var(--font-sans);color:var(--color-text-primary);background:var(--color-surface-default)}
.ask-input:focus{outline:2px solid var(--color-surface-brand-strong);outline-offset:-1px}
.ask-send{flex:none;border:none;border-radius:var(--radius-sm);background:var(--color-surface-brand);color:var(--color-text-on-brand);font:500 13px/19px var(--font-sans);padding:8px 14px;cursor:pointer}
.ask-send:disabled{opacity:.5;cursor:default}
.ask-busy{align-self:flex-start;font:400 12px/17px var(--font-sans);color:var(--color-text-tertiary)}
.ask-busy .cur{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--color-surface-brand);animation:askPulse 1s infinite alternate;margin-right:6px}
@keyframes askPulse{from{opacity:.3}to{opacity:1}}
.focus-head{
  border:1px solid var(--color-border-brand-subtle);background:var(--color-surface-brand-subtle);
  border-radius:var(--radius-lg);padding:var(--space-3) var(--space-4);margin-bottom:var(--space-4);
  font:400 13px/19px var(--font-sans);color:var(--color-text-secondary);
}
.focus-head b{color:var(--color-text-primary)}
/* 聚焦状态条。这里原本是一排药丸（全景 / 各主题 / 各方法），列的是和它
 * 下面那张表一模一样的东西，点下去也是一模一样的结果——同一个动作两个入口，
 * 其中一个还借用了筛选器的长相（药丸 = 筛过一遍），于是读者以为要选两次。
 * 现在入口只剩内容本身，这一条只负责说「你正处在什么状态、怎么退出」。 */
.focus-bar{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:var(--space-3);
  padding:5px 12px;border-radius:var(--radius-pill);
  background:var(--color-surface-brand-subtle);border:1px solid var(--color-border-brand-subtle);
  font:400 12px/18px var(--font-sans);color:var(--color-text-secondary);
}
.focus-bar .fb-k{color:var(--color-text-metadata)}
.focus-bar .fb-v{color:var(--color-text-brand);font-weight:600}
.focus-bar .fb-s{color:var(--color-text-tertiary)}
.focus-bar .fb-x{
  margin-left:auto;border:none;background:none;padding:0 2px;cursor:pointer;
  font:500 12px/18px var(--font-sans);color:var(--color-text-brand);text-decoration:underline;
}
/* 内容即控件：方法名、策略名原本只是标签，聚焦得回到上面那排药丸去点。
 * 药丸拆掉之后它们自己就是入口，所以必须看得出可点。 */
.pg-m:hover{background:var(--color-surface-subtle)}
.pg-m:hover .t{color:var(--color-text-brand)}
.sel-leg .nm-btn{
  border:none;background:none;padding:0;cursor:pointer;
  font:500 13px/18px var(--font-sans);color:var(--color-text-primary);white-space:nowrap;
}
.sel-leg .nm-btn:hover{color:var(--color-text-brand);text-decoration:underline}
.gate-table th.cf .r-in{color:var(--color-text-brand);font-weight:600}
.gate-table td.cf,.gate-table th.cf{background:var(--color-surface-brand-subtle)}

/* ── 期次坐标：阶梯、主题矩阵 ───────────────────────────────────────── */
/* 期次此前在每个视图顶上挂一条横幅说「正在看 X 期」。顶栏常驻步进器之后那就是
   同一句话说第二遍了，横幅连同样式一起删掉——留着不用的类，下一个人会以为
   还有别的地方在用它。 */
.lad-wrap{overflow-x:auto;margin:0 calc(-1*var(--space-2))}
.lad-svg{display:block;min-width:860px;width:100%;height:auto}
.lad-row{cursor:pointer}
.lad-hit{fill:transparent}
.lad-row:hover .lad-hit{fill:var(--color-surface-subtle)}
.lad-row.on .lad-hit{fill:var(--color-surface-brand-subtle)}
.lad-row.dim{opacity:.34}
.lad-row:focus-visible{outline:2px solid var(--color-focus-ring);outline-offset:1px}
.lad-leg{
  display:flex;flex-wrap:wrap;gap:6px 20px;align-items:center;
  margin-top:var(--space-3);padding-top:var(--space-3);
  border-top:1px solid var(--color-border-subtle);
  font:400 12px/17px var(--font-mono);color:var(--color-text-tertiary);
}
.lad-leg span{display:flex;align-items:center;gap:7px}
.lad-sw{width:16px;height:9px;border-radius:2px;flex:none}
.lad-sw.hollow{background:none;border:1px solid var(--color-border-strong)}
/* 这条不是附注：它决定上面那些百分比该不该当成结果读，所以给它警示底色。 */
.lad-warn{
  margin-top:var(--space-3);padding:11px 14px;border-radius:var(--radius-md);
  background:var(--color-feedback-warning-subtle);
  border:1px solid var(--color-feedback-warning-default);
  font:400 13px/20px var(--font-sans);color:var(--color-text-primary);
}
.lad-warn b{font-weight:600}
/* 读法，不是警告——它讲的不是哪里坏了，是这张图怎么看。所以不用警示底色。 */
.lad-read{
  margin-top:var(--space-3);padding:11px 14px;border-radius:var(--radius-md);
  background:var(--color-surface-subtle);border:1px solid var(--color-border-subtle);
  font:400 13px/20px var(--font-sans);color:var(--color-text-secondary);
}
.lad-read b{color:var(--color-text-primary);font-weight:600}
.lad-obj{display:inline-block;margin-top:6px;color:var(--color-text-tertiary);font-size:12.5px}
.lad-hint{margin-left:auto;font-family:var(--font-sans);color:var(--color-text-brand)}

.tm-wrap{overflow-x:auto}
table.tm{border-collapse:collapse;min-width:620px}
table.tm th,table.tm td{padding:0;text-align:center;width:66px}
table.tm th.rl,table.tm td.rl{text-align:left;padding-right:20px;white-space:nowrap;width:auto}
table.tm thead th{
  font:500 11.5px/16px var(--font-mono);color:var(--color-text-tertiary);
  padding-bottom:10px;
}
table.tm thead th.on{color:var(--color-text-brand);font-weight:600}
table.tm tbody td{padding:5px 0;border-top:1px solid var(--color-border-subtle)}
table.tm tbody td.dim{opacity:.3}
table.tm tbody td.rl{font:400 12px/17px var(--font-mono);color:var(--color-text-secondary)}
.tm-dot{
  display:inline-flex;align-items:center;justify-content:center;border-radius:9999px;
  background:var(--color-fill-brand);color:var(--color-fill-on-brand);
  font-family:var(--font-mono);font-weight:600;font-variant-numeric:tabular-nums;
}
.tm-nil{color:var(--color-border-strong);font-family:var(--font-mono);font-size:12px}

.pr-scroll{overflow-x:auto}
table.ptbl{border-collapse:collapse;width:100%;min-width:720px;
  font:400 13px/19px var(--font-sans)}
table.ptbl th{
  text-align:left;font:600 11px/15px var(--font-mono);letter-spacing:.06em;
  color:var(--color-text-tertiary);padding:0 14px 9px 0;
  border-bottom:1px solid var(--color-border-strong);white-space:nowrap;
}
table.ptbl th.n,table.ptbl td.n{text-align:right}
table.ptbl td{padding:10px 14px 10px 0;border-bottom:1px solid var(--color-border-subtle);
  white-space:nowrap}
table.ptbl td.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
table.ptbl td.b{font-weight:600;color:var(--color-text-primary)}
table.ptbl tbody tr{cursor:pointer}
table.ptbl tbody tr:hover{background:var(--color-surface-subtle)}
table.ptbl tbody tr.on{background:var(--color-surface-brand-subtle)}
table.ptbl tbody tr.dim{opacity:.4}
table.ptbl td.thin{color:var(--color-feedback-warning-strong);font-weight:600}
table.ptbl tbody tr:focus-visible{outline:2px solid var(--color-focus-ring);outline-offset:-2px}
.pchip{
  display:inline-block;padding:1px 7px;border-radius:var(--radius-pill);
  font:600 11px/17px var(--font-sans);
  background:var(--color-fill-tertiary);color:var(--color-text-secondary);
}
.pchip.live{background:var(--color-feedback-success-subtle);color:var(--color-feedback-success-text)}
.pchip.warn{background:var(--color-feedback-warning-subtle);color:var(--color-feedback-warning-strong)}
.pchip.bf,.pchip.lv{background:transparent;color:var(--color-text-tertiary);
  border:1px solid var(--color-border-default);font-weight:400;cursor:help}

/* 持仓页顶部的阶梯条：在场各期的仓位占比。宽度是仓位数，点一期只看它。 */
.lstrip{margin:0 0 var(--space-4)}
.lstrip-cap{font:400 12px/17px var(--font-sans);color:var(--color-text-tertiary);
  margin-bottom:6px}
.lstrip-bar{display:flex;gap:3px;align-items:stretch}
.lstrip-seg{
  display:flex;flex-direction:column;justify-content:center;gap:1px;
  min-width:0;padding:7px 8px;cursor:pointer;overflow:hidden;
  border:1px solid var(--color-border-default);border-radius:var(--radius-sm);
  background:var(--color-surface-subtle);text-align:left;
}
.lstrip-seg:hover{border-color:var(--color-border-brand);background:var(--color-surface-brand-subtle)}
.lstrip-seg.on{border-color:var(--color-border-brand);background:var(--color-surface-brand-subtle)}
.lstrip-seg.dim{opacity:.4}
.lstrip-p{font:500 11px/15px var(--font-mono);color:var(--color-text-secondary);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lstrip-n{font:600 13px/17px var(--font-mono);color:var(--color-text-primary)}
/* 已滚出的一期不占宽度（仓位是 0），但必须还在这条线上——否则「7 月那期
   去哪了」在这一页就永远没有答案。虚线边框 = 已经不在场。 */
.lstrip-seg.out{
  flex:0 0 auto;background:none;border-style:dashed;
  border-color:var(--color-border-strong);
}
.lstrip-seg.out:hover{border-color:var(--color-border-brand)}
.lstrip-n.out{font:500 11px/17px var(--font-mono);color:var(--color-text-tertiary)}
.lstrip-gate{
  align-self:stretch;display:flex;align-items:center;padding:0 4px;
  color:var(--color-text-tertiary);font:400 13px/1 var(--font-mono);
}
.lad-gate{
  width:16px;height:9px;flex:none;position:relative;
  border-left:3px solid var(--color-text-secondary);
}
.exq{
  display:inline-block;padding:0 6px;border-radius:var(--radius-pill);
  font:500 11px/17px var(--font-sans);white-space:nowrap;
  background:var(--color-fill-tertiary);color:var(--color-text-secondary);
}
/* 到期滚出是机制，止损止盈是风控提前介入——颜色上分开，不然「已平 194」
   会被读成同一件事。 */
.exq.stop{background:var(--color-feedback-error-subtle);color:var(--color-feedback-error-text)}
.exq.take{background:var(--color-feedback-success-subtle);color:var(--color-feedback-success-text)}
table.ptbl td.exw{white-space:nowrap}
/* 聚焦时不隐藏，只压暗：藏起来等于把刚画出来的阶梯亲手拆掉。 */
.hbub.off{opacity:.24}
.wk-p-btn{
  border:none;background:none;padding:0;cursor:pointer;font:inherit;color:inherit;
  border-bottom:1px dashed var(--color-border-strong);
}
.wk-p-btn:hover{color:var(--color-text-brand);border-bottom-color:var(--color-text-brand)}

/* ── 概览重构：证据进度 / 已学到什么 / 账面现状 ───────────────────
   概览此前把整块头条给了一个收益率，然后用三行小字把它收回去（其中
   0.36pp 是货币基金利息、对手方是满仓、样本尚不足以判定）。一个大数字
   加三行撤回，净信息量为零——问题不在文案，在选错了头条对象：本期持仓
   平均只持有 1 天，这台机器现在根本没有可报的收益。
   真正回答「它管用吗」的数在 backtest.summary.live_vs_backfill 里：
   六期中只有 1 期是当期实跑，usable=false，还差 2 期。那才是头条。 */

/* 证据进度条：一格 = 一期。空心 = 事后补跑，实心 = 当期实跑，
   虚线格 = 还没到的那几期。「还差 2 期」因此是看得见的，而不是一句话。 */
.ev-prog{display:flex;gap:5px;align-items:flex-end;margin:var(--space-3) 0 var(--space-2)}
.ev-cell{width:34px;height:26px;border-radius:4px;border:1px solid var(--color-border-default);
  background:transparent;position:relative}
.ev-cell.live{background:var(--color-brand-default,#174b35);border-color:var(--color-brand-default,#174b35)}
.ev-cell.todo{border-style:dashed;opacity:.55}
.ev-legend{display:flex;gap:var(--space-4);flex-wrap:wrap;
  font:400 11px/16px var(--font-sans);color:var(--color-text-tertiary)}
.ev-legend i{display:inline-block;width:11px;height:11px;border-radius:3px;
  border:1px solid var(--color-border-default);vertical-align:-1px;margin-right:5px}
.ev-legend i.live{background:var(--color-brand-default,#174b35);border-color:var(--color-brand-default,#174b35)}
.ev-legend i.todo{border-style:dashed}

/* 三项证伪：结论下面挂的是「它没干净通过的那几关」，不是补充说明。
   用竖线组把它们和结论绑在一起，避免读成三条无关的注脚。 */
.fal-list{margin:var(--space-3) 0 0;padding:0 0 0 var(--space-4);
  border-left:2px solid var(--color-border-default);list-style:none}
.fal-list li{margin:0 0 6px;font:400 13px/19px var(--font-sans);color:var(--color-text-secondary)}
.fal-list li:last-child{margin-bottom:0}
.fal-list b{color:var(--color-text-primary);font-weight:600}

/* ══ 证据总账 ═══════════════════════════════════════════════════
   证据页此前是七张平级卡，每张卡自己写了结论句，页面层面却从没说过它们
   在验证同一个命题。读者要跨过 4000px 才能把五句「还分不出来」合成一句
   话，而那五句用的是五种措辞，读起来像五个发现。这张总账把五个判定摆成
   一屏：一行一个问题，判定用三态（有信号 / 已能说没有 / 还分不出），
   右边写还差什么。它不是新数字，全部来自下面那几张卡自己算出来的字段。 */
.evl{display:flex;flex-direction:column;margin-top:var(--space-3)}
.evl-r{display:grid;grid-template-columns:1.35fr 104px 1.25fr;
  gap:var(--space-3);align-items:baseline;width:100%;text-align:left;
  border:none;border-top:1px solid var(--color-border-subtle);background:none;
  padding:11px var(--space-2);cursor:pointer;font-family:var(--font-sans)}
.evl-r:first-child{border-top:none}
.evl-r:hover{background:var(--color-surface-sunken)}
.evl-r:focus-visible{outline:2px solid var(--color-fill-brand);outline-offset:-2px}
.evl-q{font:500 13.5px/20px var(--font-sans);color:var(--color-text-primary)}
.evl-q i{font-style:normal;color:var(--color-text-metadata);margin-right:6px;
  font-family:var(--font-mono)}
.evl-a{font:400 13px/19px var(--font-sans);color:var(--color-text-secondary)}
.evl-a b{color:var(--color-text-primary);font-weight:600}
.evl-n{font:400 11.5px/17px var(--font-sans);color:var(--color-text-metadata);
  margin-top:3px}
/* 窄屏三列会把问题挤成每行两个字。堆成一列，判定挑到问题旁边——
   这一行里最先要读到的两样东西是「问的是什么」和「结论是什么」。 */
@media (max-width:1080px){
  .evl-r{grid-template-columns:1fr max-content;gap:6px var(--space-3)}
  .evl-r > :last-child{grid-column:1 / -1}
}
/* 判定色只有一处是亮的。整页唯一一条有信号的结论，值得让它在总账上一眼
   可见——其余两态都不上色，否则「分不出」和「没看出优势」会被读成坏消息，
   而它们其实是两个不同的、都合法的答案。 */
.evl-s{font:500 11.5px/17px var(--font-sans);color:var(--color-text-tertiary);
  border:1px solid var(--color-border-default);border-radius:9999px;
  padding:2px 9px;justify-self:start;white-space:nowrap}
.evl-s.sig{color:var(--color-brand-default,#174b35);
  border-color:var(--color-brand-default,#174b35);font-weight:600}
/* 组标题：把七张卡分成「它们各自来自哪套数据」。四张卡是同一次回测的四个
   切面，这件事此前完全不可见——它们和另一套数据的卡并排，看起来像七个
   独立话题。 */
.grp-h{display:flex;align-items:baseline;gap:var(--space-3);flex-wrap:wrap;
  margin:var(--space-6) 0 var(--space-3);padding-bottom:6px;
  border-bottom:1px solid var(--color-border-default)}
.grp-h:first-child{margin-top:var(--space-4)}
.grp-h .gt{font:600 13px/19px var(--font-sans);color:var(--color-text-primary);
  letter-spacing:.02em}
.grp-h .gs{font:400 12px/18px var(--font-sans);color:var(--color-text-metadata)}

/* 回测里十条臂的次序。条形只画正收益的相对长度——它要传达的是次序和
   量级差，不是精确读数，精确读数在右边的数字上。 */
.rank-row{display:grid;grid-template-columns:132px 1fr 62px;align-items:center;
  gap:var(--space-3);padding:3px 0}
.rank-row .rn{font:400 13px/18px var(--font-sans);color:var(--color-text-secondary);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank-row.bm .rn{color:var(--color-text-primary);font-weight:600}
.rank-bar{height:9px;border-radius:2px;background:var(--color-border-subtle,#eee);overflow:hidden}
.rank-bar>i{display:block;height:100%;background:var(--color-stock-up-default,#167447)}
.rank-row.bm .rank-bar>i{background:var(--color-text-tertiary)}
.rank-row.ctl .rank-bar>i{background:var(--color-text-tertiary);opacity:.45}
.rank-row .rv{font:600 13px/18px var(--font-mono);text-align:right}
</style>
</head>

<div class="app">

<script>
'use strict';
/* ════════════════════════════════════════════════════════════════
 * IdeaGen40 运行台 — 三层导航:本周(结论) / 过程(推导) / 底账(凭据)
 * 单端点 /api/state · vanilla JS · 自含
 * ════════════════════════════════════════════════════════════════ */
var S=null, lastFetchOk=null, fetchFailed=false;
var J=null, JErr=null; /* /api/journal — 「真实在云端跑」的运行日志 */
var candSort={key:'n_proposals',dir:-1};
var statusOpen=false, statusForced=false, activeSec=null;
var backtestStart=null;

/* ── helpers ─────────────────────────────────────────────────── */
function $(id){return document.getElementById(id)}
/* 内联事件处理器里的 JS 字符串字面量：先按 JS 转义，再按 HTML 属性转义。
 * 只做 esc() 会让 &#39; 被 HTML 解析器还原成 '，从而逃出 JS 字符串。 */
function jss(v){
  return esc(String(v===null||v===undefined?'':v)
    .replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/[\r\n]/g,' '));
}
function esc(s){
  if(s===null||s===undefined) return '';
  return String(s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function fmtInt(n){if(n===null||n===undefined||isNaN(n))return '—';return Number(n).toLocaleString('en-US')}
function fmtMoney(n){if(n===null||n===undefined||isNaN(n))return '—';return Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function fmtPct(n){
  if(n===null||n===undefined||isNaN(n))return '—';
  var v=Number(n),sign=v>0?'+':(v<0?'−':'');
  return sign+Math.abs(v).toFixed(2)+'%';
}
function fmtRate(n){
  if(n===null||n===undefined||isNaN(n))return '—';
  return Number(n).toFixed(1)+'%';
}
function pctCls(v){if(v===null||v===undefined||isNaN(v))return 'flat';return v>0?'up':(v<0?'down':'flat')}
function signedMoney(n){
  if(n===null||n===undefined||isNaN(n))return '—';
  var v=Number(n),sign=v>0?'+':(v<0?'−':'');
  return sign+Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function fmtProb(n){if(n===null||n===undefined||isNaN(n))return '—';return (Number(n)*100).toFixed(0)+'%'}
function hktFmt(iso,withDate){
  if(!iso)return '—';
  var d=new Date(iso);if(isNaN(d))return esc(iso);
  var opt=withDate?{timeZone:'Asia/Hong_Kong',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}
                  :{timeZone:'Asia/Hong_Kong',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false};
  return new Intl.DateTimeFormat('zh-CN',opt).format(d);
}
function ageWord(s){
  if(s===null||s===undefined)return '—';
  s=Math.round(s);
  if(s<60)return s+' 秒前';
  if(s<3600)return Math.floor(s/60)+' 分钟前';
  if(s<86400)return Math.floor(s/3600)+' 小时 '+Math.floor(s%3600/60)+' 分前';
  return Math.floor(s/86400)+' 天前';
}
function hktParts(){
  var p=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Hong_Kong',
    year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',
    weekday:'short',hour12:false}).formatToParts(new Date());
  var o={};p.forEach(function(x){o[x.type]=x.value});
  var wdMap={Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6};
  return {y:+o.year,m:+o.month,d:+o.day,H:+o.hour%24,M:+o.minute,S:+o.second,wd:wdMap[o.weekday]};
}
var WD=['周日','周一','周二','周三','周四','周五','周六'];
/* next weekly trigger — 只用 API 的 schedule.trigger_hkt 推算；API 没给就返回 null（不编时刻表） */
function nextRunInfo(){
  var sch=(S&&S.schedule)||{};
  var t=sch.trigger_hkt?new Date(sch.trigger_hkt).getTime():NaN;
  if(isNaN(t))return null;
  var now=Date.now();
  while(t<=now) t+=7*86400000;
  var d=new Date(t);
  var ds=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Hong_Kong',year:'numeric',month:'2-digit',day:'2-digit'}).format(d);
  var hm=new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Hong_Kong',hour:'2-digit',minute:'2-digit',hour12:false}).format(d);
  var wd=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Hong_Kong',weekday:'short'}).format(d);
  var wdMap={Sun:'周日',Mon:'周一',Tue:'周二',Wed:'周三',Thu:'周四',Fri:'周五',Sat:'周六'};
  return {secs:Math.max(0,Math.round((t-Date.now())/1000)),date:ds,hm:hm,wd:wdMap[wd]||''};
}
function nextRunPhrase(){
  var nr=nextRunInfo();
  if(!nr)return '下次时间未知（API 未提供时刻表）';
  return '下次 '+esc(nr.date)+'（'+nr.wd+' '+nr.hm+'，还有 <span class="js-cd num">'+cdShort(nr.secs)+'</span>）';
}
function cdShort(secs){
  var d=Math.floor(secs/86400),h=Math.floor(secs%86400/3600),m=Math.floor(secs%3600/60),s=secs%60;
  if(d>0)return d+' 天 '+h+' 小时';
  if(h>0)return h+' 小时 '+m+' 分';
  return m+' 分 '+s+' 秒';
}
function badge(kind,text,run){
  return '<span class="badge badge-'+kind+(run?' badge-run':'')+'"><span class="dot"></span>'+esc(text)+'</span>';
}
function epi(text){
  return '<div class="epi">'
    +'<svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true"><circle cx="6" cy="6" r="5" stroke="var(--color-fill-tertiary)" stroke-width="1"/><path d="M6 5.2v3" stroke="var(--color-fill-tertiary)" stroke-width="1.2" stroke-linecap="round"/><circle cx="6" cy="3.4" r=".7" fill="var(--color-fill-tertiary)"/></svg>'
    +'<span>'+text+'</span></div>';
}
function glossMark(def){return '<span class="gloss gm" title="'+esc(def)+'">ⓘ</span>'}
/* HGEP 四因子拆解——画出来代替写公式。上方赛道条给的是「谁高谁低」，
 * 这里给的是赛道条给不了的：每个因子的原始分、权重、以及它贡献了多少分。 */
/* 本期哪几个因子对所有主题取同一个值。这类因子照样按权重贡献分数，
   但对「谁进前五」没有任何作用——四条一样长的条并排画着，读者会以为
   四件事都被权衡了。本期 E 全是 100、P 全是 50，合计 0.45 的权重
   完全不参与排序，入选实际只由 H 和 G 决定。
   这是「看起来在起作用、实际不起作用」，和缺失读数不是一回事，
   所以另用一种标注，不混进「无读数」那一档。 */
function hgepConstants(){
  var arm=(typeof topicArm==='function')?topicArm('hgep'):null;
  var sc=(arm&&arm.scores)||{};
  var names=Object.keys(sc);
  var out={};
  if(names.length<2)return out;
  ['H','G','E','P'].forEach(function(k){
    var vals=names.map(function(n){return sc[n]&&sc[n][k]})
      .filter(function(v){return v!==null&&v!==undefined&&v!==''});
    if(vals.length===names.length){
      var uniq={};vals.forEach(function(v){uniq[v]=1});
      if(Object.keys(uniq).length===1)out[k]=vals[0];
    }
  });
  return out;
}
function hgepBreakdown(r){
  var C=['var(--color-data-1)','var(--color-data-2)','var(--color-data-3)','var(--color-data-4)'];
  var L=['H 热度','G 分歧','E 实据','P 已定价'];
  var G=[HGEP_GLOSS.H,HGEP_GLOSS.G,HGEP_GLOSS.E,HGEP_GLOSS.P];
  var W=[0.30,0.25,0.25,0.20];
  var raw=[r.H,r.G,r.E,r.P];
  /* 缺失 ≠ 0。P 是反向计分的，(100 − (P||0)) 会把「没有读数」算成 100，
   * 于是缺失的因子拿到最大贡献、还画成一根实心条——这个面板存在的理由
   * 就是不让这种事发生。缺失就画不出来，也不参与配色和条长。 */
  var has=raw.map(function(v){return v!==null&&v!==undefined&&v!==''&&isFinite(Number(v))});
  var eff=[Number(r.H),Number(r.G),Number(r.E),100-Number(r.P)];
  var comps=eff.map(function(v,i){return has[i]?W[i]*v:null});
  var mx=Math.max.apply(null,comps.filter(function(c){return c!==null}).concat([1]));
  var K=['H','G','E','P'], konst=hgepConstants();
  /* 「取值恒定」和「根本没取到读数」不是一回事。P 在没有行情序列时会退回
     中性值 50，而数据里 p_source 已经如实记着 neutral_default——页面却把
     这个 50 和 H 的 62.1 并排画成两个同样的读数。一个兜底值被显示成一个
     测量值，是这块最容易误导的地方，而依据一直就在 payload 里。 */
  var fellBack=(String(r.p_source||'')==='neutral_default');
  var rows=comps.map(function(c,i){

function refresh(){

     标注快照时刻——一张过期页面必须自己说明自己是快照，而不是装活。 */
  if(window.__STATIC__){
    S=window.__STATIC__.state||null;

    /* 导出时就知道日志为什么缺，从前那个原因只进了导出机的终端。
       「快照未包含」是关于快照的事实，不是缺失的原因——两者都要说。 */
    JErr=J?null:('静态快照未包含运行日志'

    var st=$('stampText'),fs=$('footStamp');
    var when=S&&S.generated_at?S.generated_at.slice(0,16).replace('T',' '):'?';

       机器关着、任务失败、人在放假——任何一种都会让它停在旧数据上，
       而页面本身看不出区别：数字与图仍在，只是并非当日数据。
       超过两天就把「截至」换成醒目的过期提示。 */
    var ageD=null;

      var t=new Date(S.generated_at);
      if(!isNaN(t))ageD=Math.floor((Date.now()-t.getTime())/86400000);
    }
    var stale=(ageD!==null&&ageD>=2);
    var txt=stale
      ? '⚠ 该快照已 '+ageD+' 天未更新 · 截至 '+when
      : '静态快照 · 截至 '+when+'（非实时）';
    if(st){
      st.textContent=txt;

  fetch('/api/journal',{cache:'no-store'}).then(function(r){
    if(!r.ok)throw new Error('HTTP '+r.status);
    return r.json();
  }).then(function(j){
    /* /api/journal answers 200 with {"error": …} when the run exists but its
       journal does not — a monitor pass, or a node that cannot reach the
       artifact store. Treating that as a plain object left JErr null, so the
       receipt strip said 「返回为空」: the one phrasing that is never true here,
       and the one that tells the reader nothing about which of the two it is. */
    if(j&&j.error&&!j.journal){J=j;JErr=j.error}

     「方法」页的话，日志晚到或从失败中恢复时，回执那条会一直停在
     「运行日志不可读」，而 JErr 早就清空了。失败态必须能自愈。 */
  .then(function(){if(S){renderMethod();renderEvidence();renderDrawers()}});

     避免连点重试或慢响应时请求堆叠。 */
  if(fetchInFlight)return;

    if(!r.ok){

       * 「HTTP 500」，等于把「库里没有这张表」变成一句什么都没说的话。 */

    S=j;fetchFailed=false;lastFetchOk=new Date();

    fetchFailed=true;
    renderDeadBanner(e&&e.message?e.message:String(e),e&&e.status,e&&e.detail);

/* 路由契约：解析永远回落到合法值不抛错，构造只此一处，默认子项不写进 URL。 */

  var str=String(raw||'').replace(/^#\/?/,'');

  var v=VIEWS.find(function(x){return x.id===parts[0]})||VIEWS[0];
  var secs=v.secs||[];
  var sec=secs.find(function(x){return x.s===parts[1]});

/* 页面的实际滚动元素是 <html>：body 虽然声明了 overflow-y:auto，却因为
   .app 撑满高度而滚不动，scrollIntoView 会被它误导成「已经在容器里可见」
   从而什么都不做。所以锚点跳转一律换算成文档坐标后滚动窗口。 */
function scrollToEl(el){
  if(!el)return;
  var cur=window.scrollY||document.documentElement.scrollTop||0;
  var to=Math.max(0,el.getBoundingClientRect().top+cur-12);
  var reduce=false;
  try{reduce=matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){}
  if(reduce||Math.abs(to-cur)<8){window.scrollTo(0,to);return}
  /* 自己做缓动，而不是交给 behavior:'smooth'。后者在无头浏览器和部分
     关闭动效的环境里会被静默忽略——不是慢，是根本不滚，跳转看上去就像
     点了没反应。自绘动画在哪里都成立，且照样尊重 reduce-motion。 */
  var t0=null,done=false,dur=Math.min(520,160+Math.abs(to-cur)*0.35);
  (function frame(){
    requestAnimationFrame(function(ts){
      if(t0===null)t0=ts;
      var q=Math.min(1,(ts-t0)/dur);
      var e=q<0.5?4*q*q*q:1-Math.pow(-2*q+2,3)/2;
      window.scrollTo(0,cur+(to-cur)*e);
      if(q<1)frame();else done=true;
    });
  })();
  /* 兜底：标签页隐藏时 requestAnimationFrame 不触发，动画一帧都不会跑，
     跳转就悄悄失败了。定时器仍在（只是被节流），到点没走完就直接落位——
     宁可少一段动效，也不能让导航看起来没反应。 */
  setTimeout(function(){if(!done)window.scrollTo(0,to)},dur+150);
}
function gotoSection(view,slug){

     `#/holdings?p=2026-08-12` 打开时：switchView 先写对了带期坐标的地址，
     首屏的锚点跳转紧接着把它改回 `#/holdings`——同一次开页里写两遍、

}

/* 点了侧栏之后短暂停掉滚动高亮。页尾那几段永远越不过判定线（它们在最后一屏里，
   滚不动了），所以点「已知局限」时：setActiveSection 先把它点亮，紧接着平滑滚动
   自己触发的 scroll 事件又把高亮改成最后一段——看上去就是「点了它，亮的是别的」。
   锁的时长跟着滚动动画走，动画结束后自然回到滚动跟随。 */

  if(Date.now()<spyUntil)return;

  secs.forEach(function(x){
    var el=$(secDomId(v.id,x.s));

  });
  /* 页尾那几段永远越不过判定线：滚到最底下时它们还整齐地待在最后一屏里，
     于是「证据」页最后三段（价值出在哪一段 / 已知局限 / 运行回执）在侧栏上
     永远不会亮——滚到页尾，导航还停在「排序力」。页越长这个盲区越大，而这一页
     两小时里从 2200px 长到了 4900px。
     到底时改判「最后一段」：这时那一段确实就在眼前，而判定线是给中间用的。 */
  var doc=document.documentElement;

  var atEnd=(window.scrollY||doc.scrollTop||0)+window.innerHeight>=doc.scrollHeight-24;

/* ══ 期次坐标 ═══════════════════════════════════════════════════════════
   系统每周三跑一期，每张表都带 as_of，可是页面只能显示最新一期——凡是对不上
   的地方就写一句话道歉（持仓页那段「当前持仓建于上一期」就是）。四周滚动
   （每周 25%，第五周换第一周）作为整个 mandate 的核心机制，此前只活在一个
   悬浮提示里，因为没有轴可以把它画出来。

   坐标只有一个，写在 URL 的 ?p= 上，默认空 = 最新一期。进入某一期的入口只有
   一个：「各期」里那一行本身。不在任何清单上方放期次药丸——上面选一遍下面再
   选一遍，是同一个决定做两次。原本该放选择器的位置只留一条状态回执。

   两类视图对坐标的反应不同，这来自业务本身：一期拥有它自己的想法，但组合属于
   整个阶梯。概览/方法/证据是「切换」，持仓是「聚焦」——五期照旧全在，选中的
   高亮、其余压暗。持仓要是按期过滤，刚画出来的阶梯就又没了。 */

/* 退出方式的中文写法只此一处——阶梯图、阶梯条、逐期明细三处都念它。
   horizon 是四周滚动本身（持到期满），stop/take 是风控规则提前把仓拉走：
   两件事，合并成一个「已平」就把机制和意外说成了同一回事。 */
var EXW={horizon:'到期滚出',stop:'止损',take:'止盈',other:'其他'};
var PERIOD=null;      /* null = 最新一期 */
var PCACHE={};        /* as_of -> weekly 块。按需取，不进每分钟轮询的状态文档 */
var PFETCH={};        /* 正在飞的请求，避免重复发 */

function periodList(){return (S&&S.periods)||[]}
/* review.py 认真地把每个失败的原因写进状态文档（periods_error /
   corpus_periods_error / evidence_error），而面板一个都没读过——三种失败
   都退化成同一句「没有」。空集合和读失败在这里必须分开说。 */
function stateErr(k){return (S&&S[k])||''}
function failNote(msg,why){
  return '<div class="quiet" style="text-align:center;color:var(--color-feedback-warning-text)">'
    +esc(msg)+'<br><span style="font-size:11.5px">服务端报的原因：'+esc(why)+'</span></div>';
}
function periodAt(a){
  var L=periodList();
  for(var i=0;i<L.length;i++)if(L[i].as_of===a)return L[i];
  return null;
}
/* 「最新」指最新一期**跑成过的**，不是数组最后一行：可以存在一期，单子挂在它
   名下而那次运行还在飞。默认落在一个没有流水线的期上，页面会整片空白。 */
function latestPeriod(){
  var L=periodList(),ok=null;

/* S 每次轮询整个换掉，所以「这份文档里的最新一期」挂在 S 上而不是全局变量上：

function applyPeriod(){
  if(!S)return true;

  if(!p||p===S.__latest.as_of){S.weekly=S.__latest;return true}
  if(PCACHE[p]){S.weekly=PCACHE[p];return true}
  /* 载入期间**不能**退回最新一期。那是最坏的失败方式：标题写着你要的那期，
     数字是另一期的，而且看不出来。留一个只有期次的空壳，下游照常渲染成空，
     回执负责说明现在是在载入。 */

function fetchPeriod(a){
  if(!a||PFETCH[a]||PCACHE[a])return;

    /* 服务端是分得清的：真没跑过 → 200 带 weekly:null 和 reason；出错 → 500
       带 error。这里从前既不看 r.ok 也不看 reason，于是 500 的响应体里没有
       weekly，就被当成 missing:true，渲染成「这一期没有跑成的运行记录」——
       把服务器故障说成了这一期没跑。 */
    .then(function(r){return r.json().then(function(b){return {ok:r.ok,b:b}},
                                           function(){return {ok:r.ok,b:null}})})

/* ── 顶栏期次步进器 ──────────────────────────────────────────────────

   得先绕回去。所以把它提到顶栏，和「刷新于」并排：两个都是「什么时候」，
   只是刷新于说的是这份数据多新，期次说的是你在看哪一周的内容。

/* ── 图一：四周阶梯 ──────────────────────────────────────────────────
   一期一条横条，从建仓到 30 天到期，共用一根日期轴。今天那根竖线一穿过去，
   同时活着几期就是几条——初心里「每周 25%、四周滚动」第一次被画出来，而不是
   写在提示里。行即入口：整行可点，点进那一期。 */
function ladderCard(){
  var L=periodList();

    var pe=stateErr('periods_error');

      +(pe?failNote('期次骨架这次没取出来——不是没有期次，是这一步失败了。',pe)
          :'<div class="quiet" style="text-align:center">尚无期次记录。</div>')
      +'</div>';

  var today=todayISO();
  var x0=L[0].as_of, x1=today;
  L.forEach(function(r){
    if(r.as_of<x0)x0=r.as_of;
    if(r.horizon_end&&r.horizon_end>x1)x1=r.horizon_end;
    if(r.held_from&&r.held_from<x0)x0=r.held_from;

  var ticks='',grid='';
  for(var k=0;k<=span;k+=14){

    ticks+='<text x="'+xx.toFixed(1)+'" y="'+(TOP-22)+'" text-anchor="middle" font-family="var(--font-mono)" font-size="11" fill="var(--color-text-tertiary)">'+esc(dd.slice(5))+'</text>';
  }

  var thin=0;
  var rows='';
  L.forEach(function(r,i){
    var y=TOP+i*ROW, by=y+2, bh=17;
    var rolled=(r.status==='rolled'), pend=(r.status==='pending');
    var dim=(PERIOD&&PERIOD!==r.as_of);
    var retPct=(r.ret===null||r.ret===undefined)?null:r.ret*100;
    var cls=pctCls(retPct);
    var col=cls==='up'?'var(--color-stock-up-text)':(cls==='down'?'var(--color-stock-down-text)':'var(--color-text-secondary)');
    var lab=rolled?'var(--color-text-tertiary)':'var(--color-text-primary)';
    var md=Number(r.mark_days)||0;
    if(md<=1)thin++;

    /* 一期有两个窗口，而它们不是同一个窗口。
       名义窗口 = as_of → 到期日，30 天，是这一期「本来该覆盖」的时间。
       持有窗口 = 这批仓真的被标记过的那几天。补跑把五期都在 09-04 当天开出来，
       于是名义窗口画满 30 天、实际只有一天。只画名义窗口，六条一样长的横条会
       被逐条读成 30 天的结果——所以名义画成空心轨道，实心的只有真正持有过的
       那一段。空轨道配一小截实心，说的就是「这一期还没真正跑过」。 */
    var a=X(r.as_of), b=r.horizon_end?X(r.horizon_end):a+6;
    var track='<rect x="'+a.toFixed(1)+'" y="'+by+'" width="'+Math.max(5,(b-a)).toFixed(1)+'" height="'+bh+'" rx="3"'
      +' fill="none" stroke="var(--color-border-strong)" stroke-width="1"'+(pend?' stroke-dasharray="3 3"':'')+'/>';

    var solid='';
    if(r.held_from){
      var ha=X(r.held_from);
      var hb=X(r.held_to||r.held_from);
      /* 还在场的一批，持有到今天为止——最后一次标记之后的日子照样是持有。 */
      if(!rolled&&tx>hb)hb=tx;
      var wpx=Math.max(3,hb-ha);   /* 一天的持有也要看得见，否则等于没画 */
      var fill=rolled?'var(--color-fill-tertiary)':'var(--color-fill-brand)';
      solid='<rect x="'+ha.toFixed(1)+'" y="'+(by+2)+'" width="'+wpx.toFixed(1)+'" height="'+(bh-4)+'" rx="2" fill="'+fill+'" opacity="'+(rolled?'0.5':'0.9')+'"/>';
    }
    /* 出场标记。阶梯是「每周进一期、满四周出一期」，只画进的那一半等于
       只讲了半套机制——用户第一眼就问「7 月那期滚出去了，怎么感受不到」。
       所以出场给一个硬收尾：竖闸 + 朝外的箭头 + 平了多少仓、怎么平的。 */
    var flag='',exitMark='';
    var ex=r.exits||{},exN=Number(r.n_closed)||0;
    if(exN&&r.exit_day){
      var ex_x=X(r.exit_day);
      var hz=Number(ex.horizon)||0;
      var forced=(Number(ex.stop)||0)+(Number(ex.take)||0);
      /* 到期滚出是机制在转（中性墨色）；止损止盈是风控把仓拉走（警示色）。 */
      var exCol=(hz>=forced)?'var(--color-text-secondary)':'var(--color-feedback-warning-strong)';
      exitMark='<g class="lad-exit">'
        +'<rect x="'+(ex_x-1.5).toFixed(1)+'" y="'+(by-3)+'" width="3" height="'+(bh+6)+'" rx="1.5" fill="'+exCol+'"/>'
        +'<path d="M'+(ex_x+4).toFixed(1)+' '+(by+5)+' l5 3.5 l-5 3.5 z" fill="'+exCol+'"/>'
        +'</g>';
      var parts=[];
      Object.keys(ex).forEach(function(k){if(k!=='_last_d'&&ex[k])parts.push((EXW[k]||k)+' '+ex[k])});
      var txt=rolled?('全部滚出 '+exN):('出 '+exN);
      flag='<text x="'+(ex_x+12).toFixed(1)+'" y="'+(by+13)+'" font-family="var(--font-mono)" font-size="10.5"'
        +' font-weight="'+(rolled?'600':'400')+'" fill="'+exCol+'">'+esc(txt)+'</text>'
        +'<title>'+esc(r.as_of+' 期 · '+r.exit_day+' 平仓：'+parts.join(' · '))+'</title>';
    }
    if(!exN&&r.days_left===0)
      flag='<text x="'+(b+8).toFixed(1)+'" y="'+(by+13)+'" font-family="var(--font-mono)" font-size="10.5" font-weight="600" fill="var(--color-feedback-warning-strong)">今天到期</text>';

    var mdCol=md<=1?'var(--color-feedback-warning-strong)':'var(--color-text-primary)';
    rows+='<g class="lad-row'+(dim?' dim':'')+(PERIOD===r.as_of?' on':'')+'" role="button" tabindex="0"'
      +' data-p="'+esc(r.as_of)+'"'
      +' aria-label="'+esc(r.as_of)+' 期，'+(rolled?'已滚出':'在场 '+r.n_open+' 仓')+'，实际持有 '+md+' 天">'
      +'<rect class="lad-hit" x="0" y="'+(y-4)+'" width="'+W+'" height="'+(ROW-4)+'" rx="4"/>'
      +'<text x="4" y="'+(by+13)+'" font-family="var(--font-mono)" font-size="13" font-weight="500" fill="'+lab+'">'+esc(r.as_of)+'</text>'
      +track+solid+exitMark+flag
      +'<text x="'+CN[0]+'" y="'+(by+13)+'" font-family="var(--font-mono)" font-size="12.5" fill="'+(rolled?'var(--color-text-tertiary)':'var(--color-text-primary)')+'">'+(rolled?'—':fmtInt(r.n_open))+'</text>'
      +'<text x="'+CN[1]+'" y="'+(by+13)+'" font-family="var(--font-mono)" font-size="12.5" fill="'+(exN?'var(--color-text-secondary)':'var(--color-text-disabled)')+'">'+(exN?fmtInt(exN):'—')+'</text>'
      +'<text x="'+CN[2]+'" y="'+(by+13)+'" font-family="var(--font-mono)" font-size="12.5" font-weight="'+(md<=1?'600':'400')+'" fill="'+mdCol+'">'+md+' 天</text>'
      +'<text x="'+CN[3]+'" y="'+(by+13)+'" font-family="var(--font-mono)" font-size="12.5" fill="var(--color-text-secondary)">'+esc(fmtM(r.cost))+'</text>'
      +'<text x="'+(W-6)+'" y="'+(by+13)+'" text-anchor="end" font-family="var(--font-mono)" font-size="12.5" font-weight="'+(cls==='flat'?'400':'600')+'" fill="'+col+'">'+(retPct===null?'—':esc(fmtPct(retPct)))+'</text>'
      +'</g>';
  });

  var svg='<svg viewBox="0 0 '+W+' '+H+'" class="lad-svg" role="img"'
    +' aria-label="各期的名义 30 天窗口（空心轨道）与实际持有窗口（实心），竖线是今天">'
    +grid
    +'<line x1="'+PL+'" y1="'+(TOP-10)+'" x2="'+PR+'" y2="'+(TOP-10)+'" stroke="var(--color-border-default)" stroke-width="1"/>'
    +ticks
    +'<text x="4" y="'+(TOP-22)+'" font-family="var(--font-mono)" font-size="10.5" fill="var(--color-text-tertiary)">期次</text>'
    +'<text x="'+CN[0]+'" y="'+(TOP-22)+'" font-family="var(--font-mono)" font-size="10.5" fill="var(--color-text-tertiary)">在场</text>'
    +'<text x="'+CN[1]+'" y="'+(TOP-22)+'" font-family="var(--font-mono)" font-size="10.5" fill="var(--color-text-tertiary)">已出</text>'
    +'<text x="'+CN[2]+'" y="'+(TOP-22)+'" font-family="var(--font-mono)" font-size="10.5" fill="var(--color-text-tertiary)">持有</text>'
    +'<text x="'+CN[3]+'" y="'+(TOP-22)+'" font-family="var(--font-mono)" font-size="10.5" fill="var(--color-text-tertiary)">投出</text>'
    +'<text x="'+(W-6)+'" y="'+(TOP-22)+'" text-anchor="end" font-family="var(--font-mono)" font-size="10.5" fill="var(--color-text-tertiary)">本期盈亏</text>'
    +rows
    +'<line x1="'+tx.toFixed(1)+'" y1="'+(TOP-16)+'" x2="'+tx.toFixed(1)+'" y2="'+(TOP+L.length*ROW+8)+'" stroke="var(--color-text-brand)" stroke-width="1.5" stroke-dasharray="3 3"/>'
    +'<text x="'+tx.toFixed(1)+'" y="'+(TOP+L.length*ROW+26)+'" text-anchor="middle" font-family="var(--font-mono)" font-size="11" font-weight="600" fill="var(--color-text-brand)">今天 '+esc(today.slice(5))+'</text>'
    +'</svg>';

  var live=L.filter(function(r){return r.status==='live'});
  var deployed=0;L.forEach(function(r){if(r.status==='live')deployed+=(r.cost||0)});
  var cap=(S&&S.books_aggregate&&S.books_aggregate.capital)||0;
  /* 「第五周换第一周」是一个**动作**，光看五条在场的横条感受不到它。
     把最近一次换仓写成一句话：谁出去了、怎么出的、同一时点谁进来了。 */
  var gone=L.filter(function(r){return r.status==='rolled'});
  var lastOut=gone.length?gone[gone.length-1]:null;
  var roll='';
  if(lastOut){
    var ex=lastOut.exits||{},parts=[];
    Object.keys(ex).forEach(function(k){if(k!=='_last_d'&&ex[k])parts.push((EXW[k]||k)+' '+ex[k])});
    var sameDay=L.filter(function(r){
      return r.status!=='rolled'&&r.held_from&&r.held_from===lastOut.exit_day;
    });
    var inN=0;sameDay.forEach(function(r){inN+=(r.n_open||0)});
    /* 同一天进场的可能不止一期：09-04 那次补跑一口气建了四期。把仓位数记在
       其中一期名下会凭空放大它——要么点名一期，要么说清是几期合计。 */
    var inTxt='';
    if(sameDay.length===1)inTxt='，同一天 '+esc(sameDay[0].as_of)+' 期 '+fmtInt(inN)+' 仓进场';
    else if(sameDay.length>1)inTxt='，同一天另有 '+sameDay.length+' 期共 '+fmtInt(inN)
      +' 仓一起建仓（'+esc(sameDay[0].as_of)+' … '+esc(sameDay[sameDay.length-1].as_of)+'，补跑）';
    roll='<b>'+esc(lastOut.as_of)+' 期已在 '+esc(lastOut.exit_day||'—')+' 全部滚出</b>'
      +(parts.length?('（'+esc(parts.join(' · '))+'）'):'')
      +inTxt+'——这就是「第五周换第一周」。';
  }
  var lead=live.length
    ? (roll
       +'名义上今天同时活着 <b>'+live.length+' 期</b>，投出 '+fmtM(deployed)
       +(cap?(' / '+fmtM(cap)+'（'+Math.round(deployed/cap*100)+'%）'):'')
       +'。'
       +(thin?('但实心段说的是另一回事：<b>'+thin+' 期</b>只被标记过 0–1 天。'):''))
    : (roll||'当前没有在场的期次。');

  /* 这条警告不是附注，它决定上面那些百分比该不该当成结果读。 */
  /* 重叠是这张图最有价值、也最容易被漏掉的读法：每 7 天开一期、每期名义盖 30 天，
     所以任意一天都有好几条轨道叠着。统计上「6 期」远不等于「6 个独立样本」，
     而这件事光看数字看不出来，看这张图一眼就有。峰值从数据现算，不写死。 */
  var peak=0;
  L.forEach(function(a){
    if(!a.horizon_end)return;
    var n=0;
    L.forEach(function(b){
      if(b.horizon_end&&b.as_of<=a.as_of&&b.horizon_end>a.as_of)n++;
    });
    if(n>peak)peak=n;
  });
  var readNote=peak>1?('<div class="lad-read">'
      +'<b>怎么读重叠：</b>每 7 天开一期、每期名义覆盖 30 天，所以任意一天都有 '
      +'<b>'+peak+' 条轨道</b>叠在一起。这就是「'+L.length+' 期」远不等于「'+L.length
      +' 个独立样本」的原因——统计上一期只值约 7/30 ≈ 0.23 个独立样本，'
      +'「还需多少期才能判定」必须按这个折算。'
      +'<span class="gloss gm" title="重叠让相邻各期看的是同一段行情。把期数直接当独立样本数，'
      +'会把所需样本量少算约 4.3 倍——「再等一个季度」和「再等几年」的差别。">ⓘ</span>'
      +'<br><span class="lad-obj">这张图量的是<b>那十个模拟组合</b>：空心轨道是名义期次窗口，'
      +'实心段是它真的被标记过的天数。<b>回测另有自己的持有窗口</b>（它不经过建仓，'
      +'直接用当期候选池加其后的真实收盘算），两者不是同一个对象，别互相印证。</span>'
      +'</div>'):'';
  var warn=thin?('<div class="lad-warn">'
      +'<b>这些百分比还不是 30 天的结果。</b>'
      +thin+' 期是事后补跑建的仓（'+esc((L.filter(function(r){return (Number(r.mark_days)||0)<=1})[0]||{}).held_from||'—')
      +' 当天开出），到今天只被标记过 0–1 天，'
      +'所以它们的盈亏是「一天的行情」，不是这一期的判断。'
      +'空心轨道 = 名义上该覆盖的 30 天；实心段 = 真的持有过的日子。两者差多少，'
      +'这个数就该被打多少折扣。'
      +'</div>'):'';

  return '<div class="card section" id="ladderCard">'
    +'<div class="qhead"><h2 class="qtitle">四周阶梯'
      +'<span style="font:400 13px/18px var(--font-sans);color:var(--color-text-tertiary)">　'
      +fmtInt(L.length)+' 期 · 名义每期 30 天</span></h2>'
      +'<button type="button" class="qlink" onclick="goto(\'holdings\')">当前持仓 →</button></div>'
    +'<div class="quiet" style="margin-bottom:var(--space-3)">'+lead+'</div>'
    +'<div class="lad-wrap">'+svg+'</div>'
    +'<div class="lad-leg">'
      +'<span><i class="lad-sw hollow"></i>名义窗口（该期起 → 到期日）</span>'
      +'<span><i class="lad-sw" style="background:var(--color-fill-brand);opacity:.9"></i>真的持有过的日子</span>'
      +'<span><i class="lad-sw" style="background:var(--color-fill-tertiary);opacity:.5"></i>已滚出（全部平仓）</span>'
      +'<span><i class="lad-gate"></i>出场：竖闸 = 平仓时点，箭头朝外</span>'
      +'<span class="lad-hint">点任意一期，整站切到那一期</span>'
    +'</div>'
    +readNote+warn
    +epi('收益率的分母是这一期投出去的钱，不是组合本金——一期只找到两条想法，'
        +'分母就小，它的百分比和满仓那一期不可直接比，所以「投出」一直跟在旁边。')
    +'</div>';
}

/* ── 图二：主题一期一期怎么换 ─────────────────────────────────────────
   同一份数据换个切法。圆点面积 = 该期该主题的持仓数。一个主题贯穿六期和只出现
   一期，是两种完全不同的判断，合成一个数就分不出来了。 */
function themeMatrixCard(){
  var L=periodList();
  if(!L.length)return '';
  var seen={},order=[],maxN=1;
  L.forEach(function(r,i){
    (r.themes||[]).forEach(function(t){
      if(!seen[t.theme]){seen[t.theme]={first:i,tot:0,by:{}};order.push(t.theme)}
      seen[t.theme].by[r.as_of]=t.n;
      seen[t.theme].tot+=t.n;
      if(t.n>maxN)maxN=t.n;
    });
  });
  if(!order.length)return '';
  /* 先按第一次出现的期排，同期内按总量——读下来就是主题进场和退场的次序。 */
  order.sort(function(a,b){
    return (seen[a].first-seen[b].first)||(seen[b].tot-seen[a].tot);
  });
  var head='<tr><th class="rl">主题</th>'+L.map(function(r){
    return '<th'+(PERIOD===r.as_of?' class="on"':'')+'>'+esc(r.as_of.slice(5))+'</th>';
  }).join('')+'</tr>';
  var body=order.map(function(th){
    var cells=L.map(function(r){
      var n=seen[th].by[r.as_of];
      var dim=(PERIOD&&PERIOD!==r.as_of)?' dim':'';
      if(!n)return '<td class="'+(dim?'dim':'')+'"><span class="tm-nil">·</span></td>';
      var d=Math.max(14,Math.round(Math.sqrt(n/maxN)*34));
      var fs=d>=24?10:(d>=18?9:8);
      return '<td class="'+(dim?'dim':'')+'"><i class="tm-dot" style="width:'+d+'px;height:'+d+'px;font-size:'+fs+'px" title="'+esc(topicName(th))+' · '+esc(r.as_of)+' 期 · '+n+' 仓">'+n+'</i></td>';
    }).join('');
    return '<tr><td class="rl" title="'+esc(th)+'">'+topicPair(th)+'</td>'+cells+'</tr>';
  }).join('');

  var firstP=L[0], lastP=L[L.length-1];
  var kept=order.filter(function(th){
    return seen[th].by[firstP.as_of]&&seen[th].by[lastP.as_of];
  });
  var fresh=order.filter(function(th){return seen[th].first>=L.length-2});
  var note='共 '+order.length+' 个主题进出过 '+L.length+' 期。'
    +(kept.length?('<b>'+kept.map(function(t){return esc(topicName(t))}).join('、')+'</b> 从第一期一直拿到现在；'):'')
    +(fresh.length?('<b>'+fresh.map(function(t){return esc(topicName(t))}).join('、')+'</b> 是最近两期才起来的。'):'');

  /* 阶梯图回答「这六期怎么滚的」，这张矩阵回答「主题怎么换的」——同一批期次的
     第二个读数，不是第一个。收进盖子，但盖子上直接写出结论：折着也读得到
     「谁贯穿六期、谁是新来的」，想看分布再打开。 */
  /* 这张矩阵一度被收进盖子，收错了：它是这一页的正文——阶梯给形状，
     它给主题的进退，两张图一起才是「一期一期地看」。收起来页面就没图了。 */
  return '<div class="card section" id="themeMxCard">'
    +'<div class="qhead"><h2 class="qtitle">主题一期一期怎么换'
      +'<span style="font:400 13px/18px var(--font-sans);color:var(--color-text-tertiary)">　各期持仓覆盖的宏观主题</span></h2></div>'
    +'<div class="quiet" style="margin-bottom:var(--space-3)">'+note+'</div>'
    +'<div class="tm-wrap"><table class="tm"><thead>'+head+'</thead><tbody>'+body+'</tbody></table></div>'
    +epi('圆点面积 = 该期该主题的持仓数。一个主题贯穿多期和只出现一期是两种判断，'
        +'把六期合成一个数就分不出来——这是「一期一期地看」立刻能拿到的第二个读数。')
    +'</div>';
}

/* ── 逐期明细：阶梯给形状，这里给数字 ───────────────────────────────── */
function periodRosterCard(){
  var L=periodList();
  if(!L.length)return '';
  var rows=L.slice().reverse().map(function(r){
    var retPct=(r.ret===null||r.ret===undefined)?null:r.ret*100;
    var st=r.status==='live'?'<span class="pchip live">在场</span>'
         :(r.status==='rolled'?'<span class="pchip">已滚出</span>'
                              :'<span class="pchip warn">未建仓</span>');
    var cl=r.classification==='backfill'
      ? '<span class="pchip bf" title="这一期是事后补跑的：运行发生在期次之后，用的是复算式回放。分类取自运行记录本身（orch_runs.data_classification），和真回测同一个字段。">事后补跑</span>'
      : '<span class="pchip lv" title="这一期是当周实时跑出来的。">当周实时</span>';
    return '<tr class="'+(PERIOD&&PERIOD!==r.as_of?'dim':'')+(PERIOD===r.as_of?' on':'')+'"'
      +' onclick="setPeriod(\''+esc(r.as_of)+'\')" tabindex="0" role="button">'
      +'<td class="mono b">'+esc(r.as_of)+'</td>'
      +'<td>'+st+' '+cl+'</td>'
      +'<td class="mono">'+esc(r.horizon_end||'—')+'</td>'
      +'<td class="mono">'+(r.status==='rolled'?'—':(r.days_left===null||r.days_left===undefined?'—':(r.days_left+' 天')))+'</td>'
      +'<td class="mono n'+((Number(r.mark_days)||0)<=1?' thin':'')+'"'
        +' title="'+esc((r.held_from||'—')+' → '+(r.held_to||'—')
          +(r.booked_late?'（这一期是事后补跑建的仓，所以持有天数远少于名义的 30 天）':''))+'">'
        +(Number(r.mark_days)||0)+' 天</td>'
      +'<td class="mono n">'+fmtInt(r.n_open)+'</td>'
      +'<td class="mono n">'+fmtInt(r.n_closed)+'</td>'
      +'<td class="exw">'+(function(){
          var ex=r.exits||{},out=[];
          ['horizon','take','stop','other'].forEach(function(k){
            if(!ex[k])return;
            /* 到期滚出是机制在转，止损止盈是风控提前把仓拉走——分开显示。 */
            out.push('<span class="exq '+k+'">'+esc(EXW[k]||k)+' '+ex[k]+'</span>');
          });
          return out.length?out.join(' '):'<span class="quiet">—</span>';
        })()+'</td>'
      +'<td class="mono n">'+esc(fmtM(r.cost))+'</td>'
      +'<td class="mono n '+pctCls(r.pnl)+'">'+signedMoney(r.pnl)+'</td>'
      +'<td class="mono n '+pctCls(retPct)+'">'+(retPct===null?'—':esc(fmtPct(retPct)))+'</td>'
      +'<td class="mono n">'+(r.n_candidates===null||r.n_candidates===undefined?'—':fmtInt(r.n_candidates))+'</td>'
      +'</tr>';
  }).join('');
  /* 这张台账也一度被收进盖子。它就是这一页存在的理由——「一期一期地看」，
     看的正是这张表。收起来只剩一个展开钮，页面等于空的。 */
  return '<div class="card section" id="rosterCard">'
    +'<div class="qhead"><h2 class="qtitle">逐期明细</h2></div>'
    +'<div class="pr-scroll"><table class="ptbl"><thead><tr>'
    +'<th>期次</th><th>状态</th><th>到期</th><th>剩余</th>'
    +'<th class="n" title="这一期真的被标记过的交易日数。名义窗口是 30 天，'
      +'补跑建的仓可能只有 1 天——盈亏该按这个天数打折扣去读。">实际持有</th>'
    +'<th class="n">在场</th><th class="n">已平</th>'
    +'<th title="到期滚出 = 四周滚动本身；止损/止盈 = 风控规则提前把仓拉走。'
      +'两者都算「已平」，但它们说的不是同一件事。">怎么出的</th>'
    +'<th class="n">投出</th>'
    +'<th class="n">盈亏</th><th class="n">收益率</th><th class="n">候选池</th>'
    +'</tr></thead><tbody>'+rows+'</tbody></table></div>'
    +epi('点任意一行进那一期。「事后补跑」指运行发生在期次之后——分类取自运行记录本身，'
        +'和真回测读的是同一个字段。')

}

/* ── 持仓：聚焦，不过滤 ──────────────────────────────────────────────
   持仓里放的是整条阶梯。选中一期时把其余压暗而不是隐藏——藏起来就等于把刚画
   出来的阶梯亲手拆掉，而「现在拿着的东西来自好几期」正是这一页要讲的事。 */
function ladderStrip(){
  var all=periodList();
  var L=all.filter(function(r){return r.status==='live'});
  if(L.length<2)return '';
  var tot=0;L.forEach(function(r){tot+=(r.n_open||0)});
  if(!tot)return '';
  /* 已经滚出的那几期照样画出来——只画在场的，等于「7 月那期去哪了」这个问题
     在这一页永远得不到回答。它们不占宽度（仓位是 0），用虚线空格子表示已离场。 */
  var out=all.filter(function(r){return r.status==='rolled'}).map(function(r){
    var ex=r.exits||{},parts=[];
    Object.keys(ex).forEach(function(k){if(k!=='_last_d'&&ex[k])parts.push((EXW[k]||k)+' '+ex[k])});
    return '<button type="button" class="lstrip-seg out'+(PERIOD===r.as_of?' on':'')+'"'
      +' onclick="setPeriod(\''+esc(r.as_of)+'\')"'
      +' title="'+esc(r.as_of)+' 期已于 '+esc(r.exit_day||'—')+' 全部平仓'
      +(parts.length?('（'+esc(parts.join(' · '))+'）'):'')+'——点它看这一期当时选了什么">'
      +'<span class="lstrip-p">'+esc(r.as_of.slice(5))+'</span>'
      +'<span class="lstrip-n out">已滚出</span></button>';
  }).join('')
  +(all.some(function(r){return r.status==='rolled'})?'<span class="lstrip-gate" aria-hidden="true">⇥</span>':'');
  var segs=L.map(function(r){
    var pctw=Math.max(4,(r.n_open||0)/tot*100);
    var on=(PERIOD===r.as_of), dim=(PERIOD&&!on);
    return '<button type="button" class="lstrip-seg'+(on?' on':'')+(dim?' dim':'')+'"'
      +' style="flex:'+pctw.toFixed(2)+' 1 0"'
      +' onclick="setPeriod(\''+esc(r.as_of)+'\')"'
      +' title="'+esc(r.as_of)+' 期 · '+fmtInt(r.n_open)+' 仓 · '
      +(r.days_left===0?'今天到期':(r.days_left+' 天后到期'))+'">'
      +'<span class="lstrip-p">'+esc(r.as_of.slice(5))+'</span>'
      +'<span class="lstrip-n">'+fmtInt(r.n_open)+'</span></button>';
  }).join('');
  var goneN=all.filter(function(r){return r.status==='rolled'}).length;
  /* 顶栏那块说的是「你在看哪一期」，是全站的；这一句说的是「这一页拿它怎么办」，
     是这一页独有的——持仓不过滤，只压暗，因为这页要讲的正是持仓来自好几期。 */
  var cap=PERIOD
    ? ('只看 <b>'+esc(PERIOD)+'</b> 期 · 其余各期已压暗，仍在场')
    : ('在场的 '+L.length+' 期 · 宽度是仓位数 · 点一期只看它'
       +(goneN?('　|　左边 '+goneN+' 期已滚出，不再占仓位'):''));
  return '<div class="lstrip">'
    +'<div class="lstrip-cap">'+cap+'</div>'
    +'<div class="lstrip-bar">'+out+segs+'</div></div>';
}

/* ── render all ──────────────────────────────────────────────── */

     快照页没有后端，追问答不了，按钮就不该还穿着「点我」的绿。 */
  (function(){

    t.title=snap
      ? '静态快照答不了追问——它要现场取那次运行封存的研报原文与打分记录。点开看在哪能问。'
      : '本期任何一个宏观主题、标的、选取策略，都能问它当时为什么这么定——只依据那次运行封存的材料作答，不使用事后信息';
  })();
  POPS={};popSeq=0; /* 速览注册表随全量重渲染重建 */
  /* 期坐标先落地：它决定 S.weekly 是哪一期的，下面每个 render 都读它。 */
  applyPeriod();

  /* 准则不再有自己的视图：它是「方法」页里紧挨着流水线画布的一段，
     renderMethod 已经把它画出来了，这里不能再画一遍。 */
  /* 抽屉打开时刷新其内容。写准则的表单就在抽屉里，正在往里打字时轮询让路——
     否则每 60 秒一次，打了一半的话连同光标一起被换掉。 */
  PH_POLLING=true;
  try{renderDrawers()}finally{PH_POLLING=false}
  buildNav();      /* 子项依赖区块是否渲染，必须在内容之后重建 */
  /* 用 setTimeout 而不是 requestAnimationFrame：标签页隐藏时 rAF 一帧都不
     触发，深链跳转会静默失效。动画可以没有，落位不能没有。 */
  if(bootSec){var bs=bootSec;bootSec=null;

/* ════════════════════ ① 组合 — 三段式主线 + 策略对比 + 敞口分布 ════════════════════ */
var holdView='map';
/* 主题敞口：哪些主题已展开到标的层。默认全收——十二个主题一次铺开六百多仓，
 * 等于把「有哪些主题」和「每个主题里有什么」两层揉成一层。 */
/* null = 还没定过。首次渲染时把仓位最重的那个主题打开：全收起来这一页
 * 就一张图都没有了，只剩九行数字——收纳是为了分层，不是为了把内容藏光。
 * 人一旦动过（哪怕是把第一个收起来），就以人的选择为准，不再自动展开。 */
/* 同一个标的在不同期可能被记到不同主题——每一期各自选自己的主题，同一只 ETF
 * 服务于当期在跑的那个。气泡图按标的去重、只给它一个主题，这个数说明差多少。 */
function multiThemeN(){
  var by={};
  ((S||{}).books||[]).forEach(function(b){
    (b.open_positions||[]).forEach(function(p){
      if(!p||!p.code)return;(by[p.code]=by[p.code]||{})[p.theme_id||'—']=1;
    });
  });
  var n=0;Object.keys(by).forEach(function(k){if(Object.keys(by[k]).length>1)n++});
  return n;
}
var HOLD_OPEN=null,HOLD_OPEN_SHARE=80,HOLD_OPEN_N=0,HOLD_OPEN_CUM=0;
function holdToggle(t){if(!HOLD_OPEN)HOLD_OPEN={};HOLD_OPEN[t]=!HOLD_OPEN[t];renderHoldings()}
/* 主链路三段：默认全部折叠；展开后就地渲染该阶段的完整现场 */
