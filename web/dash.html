<script>
'use strict';
/* ════════════════════════════════════════════════════════════════
 * IdeaGen40 运行台 — 三层导航:本周(结论) / 过程(推导) / 底账(凭据)
 * 单端点 /api/state · vanilla JS · 自含
 * ════════════════════════════════════════════════════════════════ */
var S=null, lastFetchOk=null, fetchFailed=false;
var J=null, JErr=null; /* /api/journal — 「真实在云端跑」的运行日志 */
var candSort={key:'n_proposals',dir:-1};
var statusOpen=false, statusForced=false, activeSec=null;
var backtestStart=null;

/* ── helpers ─────────────────────────────────────────────────── */
function $(id){return document.getElementById(id)}
/* 内联事件处理器里的 JS 字符串字面量：先按 JS 转义，再按 HTML 属性转义。
 * 只做 esc() 会让 &#39; 被 HTML 解析器还原成 '，从而逃出 JS 字符串。 */
function jss(v){
  return esc(String(v===null||v===undefined?'':v)
    .replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/[\r\n]/g,' '));
}
function esc(s){
  if(s===null||s===undefined) return '';
  return String(s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function fmtInt(n){if(n===null||n===undefined||isNaN(n))return '—';return Number(n).toLocaleString('en-US')}
function fmtMoney(n){if(n===null||n===undefined||isNaN(n))return '—';return Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function fmtPct(n){
  if(n===null||n===undefined||isNaN(n))return '—';
  var v=Number(n),sign=v>0?'+':(v<0?'−':'');
  return sign+Math.abs(v).toFixed(2)+'%';
}
function fmtRate(n){
  if(n===null||n===undefined||isNaN(n))return '—';
  return Number(n).toFixed(1)+'%';
}
function pctCls(v){if(v===null||v===undefined||isNaN(v))return 'flat';return v>0?'up':(v<0?'down':'flat')}
function signedMoney(n){
  if(n===null||n===undefined||isNaN(n))return '—';
  var v=Number(n),sign=v>0?'+':(v<0?'−':'');
  return sign+Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function fmtProb(n){if(n===null||n===undefined||isNaN(n))return '—';return (Number(n)*100).toFixed(0)+'%'}
function hktFmt(iso,withDate){
  if(!iso)return '—';
  var d=new Date(iso);if(isNaN(d))return esc(iso);
  var opt=withDate?{timeZone:'Asia/Hong_Kong',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}
                  :{timeZone:'Asia/Hong_Kong',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false};
  return new Intl.DateTimeFormat('zh-CN',opt).format(d);
}
function ageWord(s){
  if(s===null||s===undefined)return '—';
  s=Math.round(s);
  if(s<60)return s+' 秒前';
  if(s<3600)return Math.floor(s/60)+' 分钟前';
  if(s<86400)return Math.floor(s/3600)+' 小时 '+Math.floor(s%3600/60)+' 分前';
  return Math.floor(s/86400)+' 天前';
}
function hktParts(){
  var p=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Hong_Kong',
    year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',
    weekday:'short',hour12:false}).formatToParts(new Date());
  var o={};p.forEach(function(x){o[x.type]=x.value});
  var wdMap={Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6};
  return {y:+o.year,m:+o.month,d:+o.day,H:+o.hour%24,M:+o.minute,S:+o.second,wd:wdMap[o.weekday]};
}
var WD=['周日','周一','周二','周三','周四','周五','周六'];
/* next weekly trigger — 只用 API 的 schedule.trigger_hkt 推算；API 没给就返回 null（不编时刻表） */
function nextRunInfo(){
  var sch=(S&&S.schedule)||{};
  var t=sch.trigger_hkt?new Date(sch.trigger_hkt).getTime():NaN;
  if(isNaN(t))return null;
  var now=Date.now();
  while(t<=now) t+=7*86400000;
  var d=new Date(t);
  var ds=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Hong_Kong',year:'numeric',month:'2-digit',day:'2-digit'}).format(d);
  var hm=new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Hong_Kong',hour:'2-digit',minute:'2-digit',hour12:false}).format(d);
  var wd=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Hong_Kong',weekday:'short'}).format(d);
  var wdMap={Sun:'周日',Mon:'周一',Tue:'周二',Wed:'周三',Thu:'周四',Fri:'周五',Sat:'周六'};
  return {secs:Math.max(0,Math.round((t-Date.now())/1000)),date:ds,hm:hm,wd:wdMap[wd]||''};
}
function nextRunPhrase(){
  var nr=nextRunInfo();
  if(!nr)return '下次时间未知（API 未提供时刻表）';
  return '下次 '+esc(nr.date)+'（'+nr.wd+' '+nr.hm+'，还有 <span class="js-cd num">'+cdShort(nr.secs)+'</span>）';
}
function cdShort(secs){
  var d=Math.floor(secs/86400),h=Math.floor(secs%86400/3600),m=Math.floor(secs%3600/60),s=secs%60;
  if(d>0)return d+' 天 '+h+' 小时';
  if(h>0)return h+' 小时 '+m+' 分';
  return m+' 分 '+s+' 秒';
}
function badge(kind,text,run){
  return '<span class="badge badge-'+kind+(run?' badge-run':'')+'"><span class="dot"></span>'+esc(text)+'</span>';
}
function epi(text){
  return '<div class="epi">'
    +'<svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true"><circle cx="6" cy="6" r="5" stroke="var(--color-fill-tertiary)" stroke-width="1"/><path d="M6 5.2v3" stroke="var(--color-fill-tertiary)" stroke-width="1.2" stroke-linecap="round"/><circle cx="6" cy="3.4" r=".7" fill="var(--color-fill-tertiary)"/></svg>'
    +'<span>'+text+'</span></div>';
}
function glossMark(def){return '<span class="gloss gm" title="'+esc(def)+'">ⓘ</span>'}
/* HGEP 四因子拆解——画出来代替写公式。上方赛道条给的是「谁高谁低」，
 * 这里给的是赛道条给不了的：每个因子的原始分、权重、以及它贡献了多少分。 */
function hgepBreakdown(r){
  var C=['var(--color-data-1)','var(--color-data-2)','var(--color-data-3)','var(--color-data-4)'];
  var L=['H 热度','G 分歧','E 实据','P 已定价'];
  var G=[HGEP_GLOSS.H,HGEP_GLOSS.G,HGEP_GLOSS.E,HGEP_GLOSS.P];
  var W=[0.30,0.25,0.25,0.20];
  var raw=[r.H,r.G,r.E,r.P];
  /* 缺失 ≠ 0。P 是反向计分的，(100 − (P||0)) 会把「没有读数」算成 100，
   * 于是缺失的因子拿到最大贡献、还画成一根实心条——这个面板存在的理由
   * 就是不让这种事发生。缺失就画不出来，也不参与配色和条长。 */
  var has=raw.map(function(v){return v!==null&&v!==undefined&&v!==''&&isFinite(Number(v))});
  var eff=[Number(r.H),Number(r.G),Number(r.E),100-Number(r.P)];
  var comps=eff.map(function(v,i){return has[i]?W[i]*v:null});
  var mx=Math.max.apply(null,comps.filter(function(c){return c!==null}).concat([1]));
  var rows=comps.map(function(c,i){
    return '<span class="fk" title="'+esc(G[i])+'">'+L[i]+'</span>'
      +'<span class="fv">'+numOr(raw[i])+((has[i]&&i===3&&Math.abs(eff[i]-Number(raw[i]))>0.05)?'<span style="color:var(--color-text-tertiary)" title="反向计分：参与加权的是 100−P"> → '+eff[i].toFixed(1)+'</span>':'')+'</span>'
      +'<span class="fw">×'+W[i].toFixed(2)+'</span>'
      +(c===null
        ? '<span class="fbar" title="该因子本期没有读数，不计入拆解"></span><span class="fc" style="color:var(--color-text-tertiary)">—</span>'
        : '<span class="fbar"><i style="width:'+(c/mx*100).toFixed(1)+'%;background:'+C[i]+'"></i></span><span class="fc">'+c.toFixed(1)+'</span>');
  }).join('');
  var nMiss=has.filter(function(v){return !v}).length;
  return '<div class="fbd" title="原始分 × 权重 = 贡献分；P 已定价反向计分，实际参与加权的是 100−P">'+rows+'</div>'
    +'<div class="fbd-sum"><span class="k">综合分</span><span class="v">'+numOr(r.score)+'</span>'
    +glossMark('四项权重 0.30/0.25/0.25/0.20 取自先验，尚未逐因子归因；详见「尚不排名的依据」。')
    +(nMiss?'<span class="card-note" style="color:var(--color-feedback-warning-text)">'+nMiss+' 项无读数，拆解不完整</span>':'')
    +'</div>';
}
function gloss(term,def){return '<span class="gloss" title="'+esc(def)+'">'+esc(term)+'</span>'}
function methodName(m){
  var map={'e2e':'AI 端到端','ai_e2e':'AI 端到端','ai_native':'AI 端到端',
           'constraint':'约束边界','boundary':'约束边界','carl_constraint':'约束边界',
           'chain':'传导链','transmission':'传导链','gap':'共识缺口','consensus_gap':'共识缺口'};
  return map[m]||m;
}
function isBackfill(){
  return String(((S||{}).weekly||{}).data_classification||'')==='backfill';
}
/* 期次标签：补跑的一期长得和自动跑的一模一样，不标注就等于默认它是当周跑出来的。 */
function periodBadge(){
  if(!isBackfill())return '';
  return '<span class="gloss" style="margin-left:8px;font:600 11px/16px var(--font-sans);'
    +'padding:2px 7px;border-radius:10px;background:var(--color-feedback-warning-subtle);'
    +'color:var(--color-text-primary);vertical-align:middle" '
    +'title="这一期是事后补跑的：喂给模型的研报卡在当期日期，但模型权重见过之后的世界，'
    +'货架上还有没有上架日期的标的无法按当期过滤。它可以用来看流程和扩样本，不能当作当周的实盘记录。">'
    +'事后补跑 ⓘ</span>';
}
function isSynthetic(){
  return String(((S||{}).weekly||{}).data_classification||'').indexOf('public-synthetic')===0;
}
/* 剔除高频标的复测（Jon 的要求之一）：把本期最常被持有的标的删掉重算。
   这张表第一名的名次如果剔掉十个标的就翻负，那它是关于那十个标的的，
   不是关于策略的——只看这张表的人会带走一个不存在的结论。
   角标挂在行上而不是另开一张表：另开一张最容易被略过。
   verdict 与 why 都由服务端给出，前端不自造判断也不自造措辞。 */
function robustArm(name){
  var r=(((S||{}).backtest||{}).summary||{}).robustness_drop_top;
  return (r&&r.arms&&r.arms[name])||null;
}
function robustBadge(name){
  var v=robustArm(name);
  if(!v||!v.verdict)return '';
  var r=(((S||{}).backtest||{}).summary||{}).robustness_drop_top||{};
  var stable=(r.verdict_stable_across_depths||{})[name];
  /* 这项检验本身也要接受它自己提的那个反对：剔多少个标的是人选的。
     同一个臂在剔 5 / 10 / 20 三个深度下判定不一致时，那个判定说的是
     「10」这个数，不是这个臂——挂成结论会让读者带走一个不存在的发现。
     所以不稳定时换一个明确不构成结论的角标。 */
  if(stable===false){
    return '<span style="margin-left:6px;white-space:nowrap" title="'
      +esc('该判定随剔除个数变化：剔 5 / 10 / 20 个标的得到的结论不一致，'
           +'因此它取决于剪切多少个标的，不构成关于该策略的结论。'
           +(r.depth_note?'　'+r.depth_note:''))+'">'
      +badge('neutral','判定随口径变化')+'</span>';
  }
  /* 文案必须描述判定实际覆盖的那个量。判定现在挂在 kept_vs_dropped_pct
     （其余标的 vs 被剔除的高频标的，两个不相交的组）上，而不是
     delta_mean_pct（剔除后相对全样本的变动，那是子集比超集，差值完全由
     被剔掉的部分产生）。写「剔除后变动」就是又一次把判定挂到它不覆盖的
     数字旁边——这个错我今晚已经犯过两次了。 */
  var kind=v.verdict==='not_ruled_out'?'warning':'neutral';
  /* 方向跟着数走，不写死。本期九个臂的差值恰好全为负（高频组更好），
     照着现状写一句固定文案，等哪天转正就会说反。 */
  var d=v.kept_vs_dropped_pct;
  var word=v.verdict==='not_ruled_out'
      ? (d===null||d===undefined?'两组有差距'
         :(d<0?'高频标的表现更好':'其余标的表现更好'))
      : (v.verdict==='underpowered'?'样本不足以检验':v.verdict);
  /* why 里已经带了保留笔数，不再追加一遍。 */
  return '<span style="margin-left:6px;white-space:nowrap" title="'+esc(v.why||'')+'">'
    +badge(kind,word)+'</span>';
}
function robustNote(){
  var r=(((S||{}).backtest||{}).summary||{}).robustness_drop_top;
  if(!r||!r.arms)return '';
  var st=r.verdict_stable_across_depths||{};
  var shifted=0,under=0,unstable=0;
  Object.keys(r.arms).forEach(function(k){
    if(st[k]===false){unstable++;return}
    var v=r.arms[k].verdict;
    if(v==='not_ruled_out')shifted++;else if(v==='underpowered')under++;
  });
  var dropped=(r.dropped_instruments||[]).join('、');
  return '<div class="card-note" style="margin-top:var(--space-3)">'
    +'<b>高频标的检验</b>：把本期最常被持有的 '+fmtInt(r.top_n||0)+' 个标的单独拿出来，'
    +'和其余标的比表现——'
    +fmtInt(r.n_arms||0)+' 个臂里 <b>'+shifted+'</b> 个的差距未被排除、'
    +under+' 个样本不足以检验'
    +(unstable?'、'+unstable+' 个的判定随剔除个数变化（剔 5 / 10 / 20 结论不一致，不构成结论）':'')
    /* r.note 说的就是这句话的前半段，两句并排等于说了两遍。 */
    +(dropped?'<span class="gloss gm" title="被删掉的标的：'+esc(dropped)+'">ⓘ</span>':'')
    +'</div>';
}
function backtestArmName(name){
  /* 回测表的策略名须与面板别处一致：同一账本在两处两个名字，
     否则会被当作两个对象。SEL_META 是唯一的对照表。 */
  var m=(typeof SEL_META!=='undefined')?selMetaOf(name):null;
  return (m&&m[1])||name;
}
function numOr(v){return (v===null||v===undefined)?'—':Number(v).toFixed(1)}
function topicArm(sc){var t=((S||{}).weekly||{}).topics||[];return t.find(function(x){return x.scorer===sc})||null}
function topicArmNot(sc){var t=((S||{}).weekly||{}).topics||[];return t.find(function(x){return x.scorer!==sc})||null}
function topicChosen(sc){var a=topicArm(sc);return a?(a.chosen||[]):[]}
function topicLabel(tid){
  var t=((S||{}).weekly||{}).topics||[];
  for(var i=0;i<t.length;i++){var sc=(t[i].scores||{})[tid];if(sc&&sc.label)return sc.label}
  return tid;
}
/* 一次周跑通常几十分钟跑完（实测范围见 weeklyDurNote，别在这里写死）。
 * 没写结束时间的运行有两种：真的还在跑，
 * 和进程死了——进程死的时候把结束时间一起带走了，那一行会永远停在「没结束」。
 * 用一个宽松的上限把两者分开：超过上限还没结束的，是没有正常收尾，不是在跑。
 * 之前没有分开，于是一条崩溃的补跑让首页连续几小时显示「AI 正在工作」。 */
var RUN_STALE_MIN=180;
/* 「正常跑多久」以前是写死的一句「约 20-45 分钟」。runs 里有历次成功周跑的
 * 起止时间，实测范围跟手写的两头都对不上，而且手写的值不会随系统变化。
 * 拿真实记录算，样本不足时就不给范围，而不是编一个。 */
function weeklyDurNote(){
  var rs=((S||{}).runs)||[],ds=[];
  rs.forEach(function(r){
    if(r.kind!=='weekly'||!r.ok||!r.started_at||!r.ended_at)return;
    var m=(new Date(r.ended_at)-new Date(r.started_at))/60000;
    if(m>0&&isFinite(m))ds.push(m);
  });
  if(ds.length<3)return '';
  ds.sort(function(a,b){return a-b});
  return '过去 '+ds.length+' 次成功周跑用了 '+Math.round(ds[0])+'-'+Math.round(ds[ds.length-1])+' 分钟。';
}
function runAgeMin(r){
  if(!r||!r.started_at)return null;
  return Math.max(0,Math.round((Date.now()-new Date(r.started_at).getTime())/60000));
}
function inFlightRun(){
  if(!S)return null;
  if(S.weekly&&S.weekly.in_flight){
    var r=(S.runs||[]).find(function(x){return x.run_id===S.weekly.run_id});
    return r||{run_id:S.weekly.run_id,started_at:null,as_of:S.weekly.as_of};
  }
  /* 后端说本期没有在跑时，只认新近开始、确实可能还在跑的那一条 */
  var cand=(S.runs||[]).filter(function(x){return x.kind==='weekly'&&!x.ended_at});
  for(var i=0;i<cand.length;i++){
    var age=runAgeMin(cand[i]);
    if(age===null||age<=RUN_STALE_MIN)return cand[i];

/* 没有正常收尾的周跑——用来把「它没结束」说清楚，而不是当成在跑 */
function abandonedRun(){
  if(!S)return null;
  if(S.weekly&&S.weekly.in_flight)return null;
  var cand=(S.runs||[]).filter(function(x){
    return x.kind==='weekly'&&!x.ended_at&&(runAgeMin(x)||0)>RUN_STALE_MIN;});
  cand.sort(function(a,b){return String(b.started_at||'').localeCompare(String(a.started_at||''))});
  return cand[0]||null;
}
/* 上次成功周跑：weekly 摘要本身就是最近一次的记录（runs 只保留近 30 条，可能已滚出） */
function lastOkWeekly(){
  var rs=(S&&S.runs||[]).filter(function(r){return r.kind==='weekly'&&r.ok});
  rs.sort(function(a,b){return String(b.ended_at||'').localeCompare(String(a.ended_at||''))});
  if(rs[0])return {as_of:rs[0].as_of,ended_at:rs[0].ended_at};
  var w=(S&&S.weekly)||{};
  if(w.ok&&w.as_of)return {as_of:w.as_of,ended_at:null};
  return null;
}
/* 心跳里记录的各任务结果（weekly failed/ok/not_due 等）——runs 表不含失败的 weekly 尝试时，这是唯一凭据 */
function hbOutcome(job){

  return os.find(function(o){return o.job===job})||null;
}
function currentBooks(){
  /* 各账本是持续记录而非单期快照：某账本本期未建仓（标的当天
     没有价格、或这期它一条也没选中），不代表它退出比较，只代表它这期没加仓。
     原来这里按 run_id 过滤，而 booked_batch 存的是 batch_id，两者永不相等，
     过滤静默失效、靠兜底才显示全部。删掉这个从未生效的过滤，比让它"生效"
     然后把账本从对比图里抹掉才对：本期是否入账用 booked_as_of 单独标注。 */
  return (S&&S.books)||[];
}
/* 这本账这期加没加仓——供标注用，不用来决定谁出现在图里。 */
function bookedThisPeriod(b){
  var asOf=((S&&S.weekly)||{}).as_of;
  return !!(asOf&&b&&b.booked_as_of===asOf);
}
/* 全账本合计（所有账本同一日期轴时逐日求和；否则不出曲线，只出可加总的量） */
function aggBooks(){
  var bs=currentBooks();
  if(!bs.length)return null;
  var cap=0,openN=0,closedN=0,realized=0,unreal=0,exits={},wins=0,deployed=0,pending=0;
  bs.forEach(function(b){
    cap+=(b.capital||0);
    openN+=(b.open_positions||[]).length;
    closedN+=(b.closed_n||0);
    wins+=(b.wins||0);
    realized+=(b.realized||0);
    pending+=(Number(b.pending_orders)||0);
    (b.open_positions||[]).forEach(function(p){
      unreal+=(p.unrealized||0);
      deployed+=(Number(p.qty)||0)*(Number(p.entry_px)||0);
    });
    Object.keys(b.exits||{}).forEach(function(k){exits[k]=(exits[k]||0)+(b.exits[k]||0)});
  });
  var axis=null,sameAxis=true;
  bs.forEach(function(b){
    var ds=(b.equity||[]).map(function(e){return e.d}).join(',');
    if(axis===null)axis=ds;else if(ds!==axis)sameAxis=false;
  });
  var eq=null;
  if(sameAxis&&axis){
    eq=(bs[0].equity||[]).map(function(e,i){
      var s=0;bs.forEach(function(b){s+=((b.equity[i]||{}).equity||0)});
      return {d:e.d,equity:s};
    });
  }
  /* 合计净值不能只在「所有账本日期轴一致」时才有：轴不齐时聚合曲线为空，
   * 但每本账自己的最后一点仍然存在，把它们相加就是当下的合计净值。
   * 之前依赖聚合曲线，于是有一本账日期不齐就整块拆解消失。 */
  var lastEq=null,haveEq=false;
  bs.forEach(function(b){
    var e=b.equity||[];
    if(e.length){haveEq=true;lastEq=(lastEq||0)+(e[e.length-1].equity||0)}
  });
  if(!haveEq)lastEq=null;
  return {books:bs,capital:cap,openN:openN,closedN:closedN,wins:wins,realized:realized,
          unrealized:unreal,exits:exits,equity:eq,deployed:deployed,pending:pending,
          lastEquity:lastEq};
}
/* 持仓代码 → 候选池条目（US.BTAL → BTAL） */
function candByCode(code){
  var cands=((((S||{}).weekly||{}).pool)||{}).candidates||[];
  var bare=String(code||'');var i=bare.indexOf('.');if(i>=0)bare=bare.slice(i+1);
  return cands.find(function(c){return c.instrument_id===code||c.instrument_id===bare})||null;
}
function bareCode(code){var s=String(code||'');var i=s.indexOf('.');return i>=0?s.slice(i+1):s}
function maxDrawdown(eq){
  if(!eq||eq.length<2)return null;
  var peak=-Infinity,mdd=0;
  eq.forEach(function(e){
    if(e.equity>peak)peak=e.equity;
    var dd=(e.equity-peak)/peak*100;
    if(dd<mdd)mdd=dd;
  });
  return mdd;
}

function renderBootState(){

function refresh(){
  /* 静态快照模式：GitHub Pages 没有后端。导出脚本把数据烙进页面
     （window.__STATIC__），此时不发网络请求、不自动刷新，并在页眉
     标注快照时刻——一张过期页面必须自己说明自己是快照，而不是装活。 */
  if(window.__STATIC__){
    S=window.__STATIC__.state||null;
    J=window.__STATIC__.journal||null;JErr=J?null:'静态快照未包含运行日志';
    fetchFailed=false;lastFetchOk=S&&S.generated_at?new Date(S.generated_at):new Date();
    renderAll();
    var st=$('stampText'),fs=$('footStamp');
    var when=S&&S.generated_at?S.generated_at.slice(0,16).replace('T',' '):'?';
    /* 一张过期的页面必须自己说自己过期。快照靠工作日的 daily 刷新，
       机器关着、任务失败、人在放假——任何一种都会让它停在旧数据上，
       而页面本身看不出区别：数字与图仍在，只是并非当日数据。
       超过两天就把「截至」换成醒目的过期提示。 */
    var ageD=null;
    if(S&&S.generated_at){
      var t=new Date(S.generated_at);
      if(!isNaN(t))ageD=Math.floor((Date.now()-t.getTime())/86400000);
    }
    var stale=(ageD!==null&&ageD>=2);
    var txt=stale
      ? '⚠ 该快照已 '+ageD+' 天未更新 · 截至 '+when
      : '静态快照 · 截至 '+when+'（非实时）';
    if(st){
      st.textContent=txt;
      if(stale)st.style.color='var(--color-feedback-warning-text)';
    }
    if(fs)fs.textContent=stale?('⚠ 快照已过期 '+ageD+' 天 · 截至 '+when)
                              :('静态快照 · 截至 '+when);
    return;
  }
  /* 主状态到了就先渲染；运行日志（/api/journal）并行取，晚到就补渲染回执条，取不到如实显示原因 */
  fetch('/api/journal',{cache:'no-store'}).then(function(r){
    if(!r.ok)throw new Error('HTTP '+r.status);
    return r.json();
  }).then(function(j){J=j;JErr=null}).catch(function(e){J=null;JErr=e&&e.message?e.message:String(e)})
  /* 运行回执用的是 J，而它在导航重构后搬到了「证据」页——回调只重渲染
     「方法」页的话，日志晚到或从失败中恢复时，回执那条会一直停在
     「运行日志不可读」，而 JErr 早就清空了。失败态必须能自愈。 */
  .then(function(){if(S){renderMethod();renderEvidence();renderDrawers()}});
  /* 重试与 60 秒轮询共用这条路径：在途时不再发第二次，
     避免连点重试或慢响应时请求堆叠。 */
  if(fetchInFlight)return;
  fetchInFlight=true;
  fetch('/api/state',{cache:'no-store'}).then(function(r){
    if(!r.ok){

       * 「HTTP 500」，等于把「库里没有这张表」变成一句什么都没说的话。 */

/* 数据有多旧，和页面多久取一次，是两件事。
 * 静态快照会自己说「已 N 天未更新」，但线上是活服务：generated_at 是请求
 * 那一刻算出来的，永远是「刚刚」。于是当这台机器读的是一份同步过来的
 * 快照、而同步断了时，页面每 60 秒忠实地取回同一份旧数据，并把它标成新鲜的

 * 所以刷新戳旁边单独报一次「数据本身有多旧」，取当前时间与心跳时刻之差。
 * 心跳是这份数据里最频繁更新的东西（5 分钟一次），它停了就说明上游停了，
 * 或者这份数据不再被送过来——两种情况读者都需要知道。 */
var DATA_STALE_WARN_S=1800;   /* 30 分钟：心跳 5 分钟一次，超过 6 次没到就不是抖动 */
function dataAgeSeconds(){
  var a=(S&&S.alive)||{};
  var age=Number(a.age_s);
  return isFinite(age)?age:null;
}
function stalenessNote(){
  var age=dataAgeSeconds();
  if(age===null||age<DATA_STALE_WARN_S)return '';
  var mins=Math.round(age/60);
  var txt=mins>=120?(Math.round(mins/60)+' 小时'):(mins+' 分钟');
  return '数据已 '+txt+'未更新';
}
function renderStamp(){

  var stale=stalenessNote();
  var txt='刷新于 '+t+' · 每 60 秒自动'+(stale?'　⚠ '+stale:'');

      ? stale+'。页面每 60 秒确实取到了新响应，但响应里的数据没有变新——'
        +'心跳每 5 分钟应更新一次，现在已经停了这么久。要么上游停了，要么这台机器'
        +'读的是一份不再被更新的数据副本。屏幕上的持仓与盈亏都是那一刻的旧值。'

function parseRoute(raw){
  var str=String(raw||'').replace(/^#\/?/,'');
  var qi=str.indexOf('?'), q=qi>=0?str.slice(qi+1):'';
  var parts=(qi>=0?str.slice(0,qi):str).split('/');
  var v=VIEWS.find(function(x){return x.id===parts[0]})||VIEWS[0];
  var secs=v.secs||[];
  var sec=secs.find(function(x){return x.s===parts[1]});
  var dm=/(?:^|&)d=([^&]*)/.exec(q);
  return {view:v.id, sec:sec?sec.s:(secs[0]?secs[0].s:null),
          drawers:dm?decDrawers(dm[1]):[]};
}

/* ── 下钻进路由 ──────────────────────────────────────────────
   抽屉是这个产品最深的一层内容：阶段现场、单个账本、单个标的、运行日志。
   在此之前它们完全不可寻址——看到的东西发不出去，刷新回到起点，按浏览器
   后退直接离开页面。栈按层序列化进 URL，恢复时逐层压回。
   白名单之外的层直接丢弃：URL 是外部输入，不认识的就不猜。 */
var DRAWER_T={stage:1,topic:1,ask:1,asklog:1,props:1,runlog:1,
              pos:1,book:1,status:1,cal:1,trust:1,askpick:1};
function encDrawers(){
  return drawerStack.filter(function(d){return DRAWER_T[d.t]}).map(function(d){
    var t=d.t+':'+encodeURIComponent(d.p==null?'':String(d.p));
    if(d.f!==undefined&&d.f!==null&&d.f!=='')t+=':'+encodeURIComponent(String(d.f));
    return t;
  }).join(',');
}
function decDrawers(raw){
  if(!raw)return [];
  return String(raw).split(',').map(function(x){
    var a=x.split(':');
    if(a.length<2||!DRAWER_T[a[0]])return null;
    var d={t:a[0],p:decodeURIComponent(a[1]||'')};
    if(a[0]==='stage')d.p=parseInt(d.p,10)||0;
    if(a.length>2)d.f=decodeURIComponent(a[2]||'');
    return d;
  }).filter(Boolean);
}
/* URL 只在这里写。push 用于「进入更深一层」，这样浏览器后退退回上一层
   而不是离开页面；其余一律 replace，避免滚动和轮询把历史刷满。 */
var routeDepth=0, routeSuspend=false;
function syncRoute(){
  if(routeSuspend)return;
  var dz=encDrawers();
  var url=buildRoute(current,activeSec)+(dz?'?d='+dz:'');
  var depth=drawerStack.length;
  try{
    if(depth>routeDepth)history.pushState(null,'',url);
    else history.replaceState(null,'',url);
  }catch(e){}
  routeDepth=depth;
}
function applyRoute(r){
  routeSuspend=true;
  try{
    if(r.view!==current)switchView(r.view,r.sec);
    else if(r.sec&&r.sec!==activeSec)setActiveSection(r.sec);
    drawerStack=r.drawers||[];
    renderDrawers();
  }finally{routeSuspend=false}
  routeDepth=drawerStack.length;
}
function buildRoute(view,sec){
  var v=viewOf(view),first=(v.secs&&v.secs[0])?v.secs[0].s:null;
  return '#/'+v.id+((sec&&sec!==first)?'/'+sec:'');
}
function secDomId(view,sec){return 'sec_'+view+'_'+sec}
var current='overview';
/* 只有内容真的渲染出来了才在地图上标出这一格：一个不存在的目的地
   比没有这一格更糟——点了没反应，用户会以为页面坏了。 */
function secWrap(view,slug,inner){
  return inner?'<section id="'+secDomId(view,slug)+'" class="pg-sec">'+inner+'</section>':'';
}
function buildNav(){
  $('nav').innerHTML=VIEWS.map(function(v){
    var on=(v.id===current);
    var subs=on?(v.secs||[]).filter(function(x){return !!$(secDomId(v.id,x.s))}):[];
    return '<button type="button" class="nav-item'+(on?' active':'')+'" data-v="'+v.id+'"'
      +' data-el="nav.'+v.id+'" aria-label="'+esc(v.label)+'——'+esc(v.sub)+'"'
      +' aria-current="'+(on?'page':'false')+'">'
      +'<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+v.icon+'</svg>'
      +'<span class="nav-txt nav-label"><span>'+esc(v.label)+'</span><span class="nav-sub">'+esc(v.sub)+'</span></span>'
      +'</button>'
      +(subs.length?'<div class="nav-secs">'+subs.map(function(x){
          return '<button type="button" class="nav-sec" data-v="'+v.id+'" data-s="'+x.s+'"'
            +' data-el="nav.'+v.id+'.'+x.s+'">'
            +'<span class="nav-dot"></span>'+esc(x.label)+'</button>';
        }).join('')+'</div>':'');
  }).join('');
  $('nav').querySelectorAll('.nav-item').forEach(function(b){
    b.addEventListener('click',function(){switchView(b.getAttribute('data-v'))});
  });
  $('nav').querySelectorAll('.nav-sec').forEach(function(b){
    b.addEventListener('click',function(){
      gotoSection(b.getAttribute('data-v'),b.getAttribute('data-s'));
    });
  });
  markActiveSection();
}
/* 页面的实际滚动元素是 <html>：body 虽然声明了 overflow-y:auto，却因为
   .app 撑满高度而滚不动，scrollIntoView 会被它误导成「已经在容器里可见」
   从而什么都不做。所以锚点跳转一律换算成文档坐标后滚动窗口。 */
function scrollToEl(el){
  if(!el)return;
  var cur=window.scrollY||document.documentElement.scrollTop||0;
  var to=Math.max(0,el.getBoundingClientRect().top+cur-12);
  var reduce=false;
  try{reduce=matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){}
  if(reduce||Math.abs(to-cur)<8){window.scrollTo(0,to);return}
  /* 自己做缓动，而不是交给 behavior:'smooth'。后者在无头浏览器和部分
     关闭动效的环境里会被静默忽略——不是慢，是根本不滚，跳转看上去就像
     点了没反应。自绘动画在哪里都成立，且照样尊重 reduce-motion。 */
  var t0=null,done=false,dur=Math.min(520,160+Math.abs(to-cur)*0.35);
  (function frame(){
    requestAnimationFrame(function(ts){
      if(t0===null)t0=ts;
      var q=Math.min(1,(ts-t0)/dur);
      var e=q<0.5?4*q*q*q:1-Math.pow(-2*q+2,3)/2;
      window.scrollTo(0,cur+(to-cur)*e);
      if(q<1)frame();else done=true;
    });
  })();
  /* 兜底：标签页隐藏时 requestAnimationFrame 不触发，动画一帧都不会跑，
     跳转就悄悄失败了。定时器仍在（只是被节流），到点没走完就直接落位——
     宁可少一段动效，也不能让导航看起来没反应。 */
  setTimeout(function(){if(!done)window.scrollTo(0,to)},dur+150);
}
function gotoSection(view,slug){
  if(view!==current)switchView(view,slug);
  scrollToEl($(secDomId(view,slug)));
  setActiveSection(slug);
  try{history.replaceState(null,'',buildRoute(view,slug))}catch(e){}
}
function setActiveSection(slug){
  activeSec=slug;
  document.querySelectorAll('.nav-sec').forEach(function(b){
    b.classList.toggle('on',b.getAttribute('data-s')===slug);
  });
}
/* 滚动高亮：以视口上缘往下 120px 为判定线，取最后一个越线的区块。 */
function markActiveSection(){
  var v=viewOf(current),secs=(v.secs||[]);
  var line=120,best=null;
  secs.forEach(function(x){
    var el=$(secDomId(v.id,x.s));
    if(el&&el.getBoundingClientRect().top<=line)best=x.s;
  });
  if(!best&&secs.length)best=secs[0].s;
  if(best!==activeSec)setActiveSection(best);
}
function switchView(id,sec){
  current=id;
  VIEWS.forEach(function(v){$('view-'+v.id).classList.toggle('active',v.id===id)});
  var vv=viewOf(id);
  $('pageTitle').textContent=vv.label;
  if(!sec)window.scrollTo(0,0);
  activeSec=null;
  buildNav();
  try{history.replaceState(null,'',buildRoute(id,sec))}catch(e){}
}
/* cross-link: jump to a view and anchor within it */
function goto(view,anchor){
  switchView(view);
  if(anchor){
    setTimeout(function(){scrollToEl($(anchor))},0);
  }
}

function renderAll(){
  $('deadBanner').innerHTML='';
  /* 顶栏那个是写死在 HTML 里的，不经过 askBtn()，所以快照降级要在这里补上：
     快照页没有后端，追问答不了，按钮就不该还穿着「点我」的绿。 */
  (function(){
    var t=$('askTop');if(!t)return;
    var snap=(typeof isSnapshot==='function')&&isSnapshot();
    t.className='ask-top'+(snap?' off':'');
    t.title=snap
      ? '静态快照答不了追问——它要现场取那次运行封存的研报原文与打分记录。点开看在哪能问。'
      : '本期任何一个宏观主题、标的、选取策略，都能问它当时为什么这么定——只依据那次运行封存的材料作答，不使用事后信息';
  })();
  POPS={};popSeq=0; /* 速览注册表随全量重渲染重建 */
  renderStamp();
  renderOverview();
  renderHoldings();
  renderMethod();
  renderEvidence();
  renderRules();
  renderDrawers(); /* 抽屉打开时刷新其内容 */
  buildNav();      /* 子项依赖区块是否渲染，必须在内容之后重建 */
  /* 用 setTimeout 而不是 requestAnimationFrame：标签页隐藏时 rAF 一帧都不
     触发，深链跳转会静默失效。动画可以没有，落位不能没有。 */
  if(bootSec){var bs=bootSec;bootSec=null;
    setTimeout(function(){gotoSection(current,bs)},0);}
  if(bootDrawer){var bd=bootDrawer;bootDrawer=null;bd()}
}

/* ── 主链路：读研报 → 选主题 → 写想法 ── */
function mainLine(ag){
  var w=S.weekly||{};
  var gens=w.generators||[];
  var nIdeas=gens.reduce(function(s,g){return s+(g.n||0)},0);
  var hgep=topicArm('hgep');
  var nTopicsAll=(hgep&&hgep.scores)?Object.keys(hgep.scores).length:0;
  var nChosen=topicChosen('hgep').length;
  var poolN=(w.pool||{}).n||0;
  var nCorpus=w.corpus_total||0;
  var insts={};
  Object.keys(w.evidence||{}).forEach(function(t){
    ((w.evidence[t]||{}).docs||[]).forEach(function(d){if(d&&d.institution)insts[d.institution]=1});
  });
  var nInst=Object.keys(insts).length;

  var chev='<svg class="ml-chev" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var pending=w.in_flight?'进行中':'—';

  var STG=[
    {i:0,name:'读研报',
     stat:nCorpus?('<b class="num">'+fmtInt(nCorpus)+'</b> 篇研报'+(nInst?'<span class="sep">·</span><b class="num">'+fmtInt(nInst)+'</b> 家机构':'')):pending,
     more:'语料来源与来源分布'},
    {i:1,name:'选主题',
     stat:nTopicsAll?('<b class="num">'+fmtInt(nTopicsAll)+'</b> 个候选主题<span class="sep">·</span><b class="num">'+fmtInt(nChosen)+'</b> 入选<span class="sep">/</span><b class="num">'+fmtInt(nTopicsAll-nChosen)+'</b> 落选'):pending,
     more:'HGEP 评分与落选理由'},
    {i:2,name:'写想法',
     stat:nIdeas?('<b class="num">'+fmtInt(gens.length)+'</b> 种方法<span class="sep">·</span><b class="num">'+fmtInt(nIdeas)+'</b> 条想法<span class="sep">→</span><b class="num">'+fmtInt(poolN)+'</b> 条候选'):pending,
     /* 这里的数字数的是「几种方法」。别处它是带 tooltip 的彩色标签，
      * 到这一行退化成纯文本后就只剩「AI 端到端 1 · 约束边界 3」——
      * 1 和 3 各是什么，读者无从判断。加上量词，并把解释挂到 title 上。 */
     more:(function(){
       var n={};gens.forEach(function(g){var t=GEN_PATH[g.method];if(t)n[t]=(n[t]||0)+1});
       var parts=['ai','frame','code'].filter(function(t){return n[t]}).map(function(t){return n[t]+' 种 '+PATH_META[t][0]});
       return parts.length?('执行路径：'+parts.join(' · ')):'生成方法与合并候选池';
     })(),
     moreTip:(function(){
       var n={};gens.forEach(function(g){var t=GEN_PATH[g.method];if(t)n[t]=(n[t]||0)+1});
       var used=['ai','frame','code'].filter(function(t){return n[t]});
       if(!used.length)return '';
       return '本环节共 '+gens.length+' 种生成方法，按自动化程度分成：'
         +used.map(function(t){return n[t]+' 种「'+PATH_META[t][0]+'」（'+PATH_META[t][1]+'）'}).join('；');
     })()}
  ];

  var rows=STG.map(function(o){
    var open=!!mlOpen[o.i];
    var head='<button type="button" class="ml-head" onclick="toggleStage('+o.i+')" aria-expanded="'+open+'">'
      +'<span class="ml-idx">0'+(o.i+1)+'</span>'
      +'<span class="ml-name">'+esc(o.name)+'</span>'
      +'<span class="ml-stat">'+o.stat+'</span>'
      /* 摘要只在折叠时有用——它是「里面有什么」。展开之后正文自己会说，
       * 而且说得更细：03 段的「执行路径: 1 种 AI 端到端 · 3 种 约束边界」
       * 在正文第一行原样又画了一遍。展开就把摘要让出去。 */
      +(open?'':'<span class="ml-more"'+(o.moreTip?' title="'+esc(o.moreTip)+'"':'')+'>'+esc(o.more)+'</span>')
      +chev
    +'</button>';
    var body='';
    if(open){
      body='<div class="ml-body">'
        +'<div class="ml-body-head">'+miniChain(o.i,STAGES[o.i]?STAGES[o.i].t:o.name)
        +'<button type="button" class="exp-btn" onclick="event.stopPropagation();openStageDrawer('+o.i+')">在右侧面板打开 ›</button>'

         * 点哪个都一样。留正文里那个——抽屉里也是它。 */
        +'</div>'
        +mlStageBody(o.i)
      +'</div>';

    return '<div class="ml-row'+(open?' open':'')+'">'+head+body+'</div>';
  }).join('');

  return '<div class="card mainline section" aria-label="主链路">'
    +'<div class="card-title-row"><h2 class="card-title" style="margin-bottom:0">主链路</h2>'
    +'<span class="card-note">'+esc(w.as_of||'')+' 期'
      +'<span class="gloss gm" title="逐段展开可回溯依据与语料来源。">ⓘ</span></span></div>'
    +rows

/* ── Hero = 噪音带：第 2 周「还分不出高下」本身就是画面 ── */
/* 判定所需样本量以前写死 17 周，而后端按各臂实测标准差算出的 required_pairs
 * 是 1-60 期，主策略里最大 34——写死的那个数不是任何一条臂的真实要求，
 * 却还在驱动一根进度条，把编出来的完成度画成实验进度。
 * 改成取主策略里最大的那个要求；取不到才回落到旧常量。
 * 这个要求本身是下限（sd 由重叠窗口估出，会被低估），VERDICT_GLOSS 已说明。 */
var TARGET_WEEKS_FALLBACK=17;
function targetWeeks(){
  var pr=((((S||{}).backtest||{}).summary||{}).paired)||{};
  var main={};
  (typeof SEL_META!=='undefined'?SEL_META:[]).forEach(function(m){if(m[2]==='主策略')main[m[0]]=1});
  var need=[];
  Object.keys(pr).forEach(function(k){
    var v=pr[k]||{};
    if(main[k]&&typeof v.required_pairs==='number')need.push(v.required_pairs);
  });
  if(!need.length)return TARGET_WEEKS_FALLBACK;
  return Math.max.apply(null,need);
}
/* 单一目标数会盖掉一件事：有的臂已经够了，有的还差得远。 */
function targetWeeksSpread(){
  var pr=((((S||{}).backtest||{}).summary||{}).paired)||{};
  var ns=Object.keys(pr).map(function(k){return (pr[k]||{}).required_pairs})
    .filter(function(v){return typeof v==='number'});
  if(ns.length<2)return '';
  ns.sort(function(a,b){return a-b});
  return '各臂所需 '+ns[0]+'-'+ns[ns.length-1]+' 期，随实测标准差变化';
}
/* 回测表把 1 天和 30 天的持仓放在一起算胜率，页面却平铺写着「持有期 30 天」。
 * 目标期限确实是 30 天，但最近几期还没跑完——它们的收益是中途读数，
 * 不是完成的交易。把「目标」和「实际已过」分开写，胜率才不会被读成
 * 「30 天交易的胜率」。后端的免责声明详述了前视风险，独独没提这一条。 */
function backtestMaturity(){
  var b=(S&&S.backtest)||{},pos=b.positions||[];
  var sum=b.summary||{},target=Number(sum.horizon_days)||0;
  var byPeriod={};
  pos.forEach(function(x){
    if(!x.entry_d||!x.exit_d)return;
    var d=Math.round((new Date(x.exit_d)-new Date(x.entry_d))/86400000);
    if(!isFinite(d))return;
    var p=x.period||'—';
    if(!byPeriod[p]||d>byPeriod[p])byPeriod[p]=d;
  });
  var ks=Object.keys(byPeriod).sort();
  if(!ks.length)return null;
  var ds=ks.map(function(k){return byPeriod[k]});
  var full=ks.filter(function(k){return target&&byPeriod[k]>=target}).length;
  return {periods:ks,byPeriod:byPeriod,min:Math.min.apply(null,ds),max:Math.max.apply(null,ds),
          full:full,n:ks.length,target:target};
}
var VERDICT_GLOSS='样本量要求约 17 周（≈4 个月）：各账本使用同一候选池，净值差异仅来自选取策略。按预注册的配对检验口径（持有期重叠折算 + 配对相关 ρ≈0.8 先验），可靠识别 2 个百分点/月的真实差距需约 4 个月重叠持有样本。此前的排名不构成结论。';
var BAND_GLOSS='±2 个百分点为预注册的可检出差距。当前样本量下，小于该幅度的领先无法与随机波动区分，带内排名不构成结论。';

        +'</span>'

  var agg=ag?'<div class="agg-line">'+books.length+' 个账本合计：浮动盈亏 <span class="num '+pctCls(ag.unrealized)+'">'+signedMoney(ag.unrealized)+'</span>'
    +' · 已实现 <span class="num '+pctCls(ag.realized)+'">'+signedMoney(ag.realized)+'</span>'
    +(ret!==null?' · 合计收益 <span class="num '+pctCls(ret)+'">'+fmtPct(ret)+'</span>':'')
    +' · 胜率 '+fmtWinRate(ag.wins||0,ag.closedN||0)
    +spyLine(ret)
    +'（全账本合计口径，非实盘组合）'
    +'<button type="button" class="exp-btn" onclick="openTrustDrawer()">可信度与局限 ›</button></div>':'';
  /* 首屏只留结论：噪音带图已经自带结论句、坐标、逐行下钻和样本量进度。
     芯片带（medals）呈现的是同一批账本、同一个 pp 数值、同一个 openBookDrawer
     目标，主题分布条同样是这批账本的下一层细节——三者并列展示不增加信息，
     只增加首屏噪音，因此一并降级到明细区，由读者主动展开。 */
  /* 这张卡的全部内容都在支撑一句话：现在还分不出高下。那就只留这句话。
     十行几乎重合在 0 附近的点、它们那些 ±0.0x pp 的数字，是这一页最大的
     困惑来源——读者盯着十个数字，而页面自己写着「带内排名不构成结论」。
     图不删，但要读者主动去看。 */
  return '<div class="card section" id="whoWins">'+head
    +'<div style="font:600 17px/25px var(--font-sans);color:var(--color-text-primary);margin:var(--space-2) 0 var(--space-2)">'
      +noiseHeadline(books,weekN)+'</div>'
    +'<div class="quiet">第 '+weekN+' 周 · 主策略里最慢的一条约需 '+targetWeeks()+' 期才够判定'
      +'<button type="button" class="exp-btn" data-el="week.strategies.why" onclick="gotoSection(\'evidence\',\'strategies\')" title="未验证假设 · 已修复缺陷 · 历史回测">尚不排名的依据 ⓘ</button></div>'
    +agg
    +foldBlock('week.books.compare','对比图与 '+books.length+' 个账本明细','相对基准差距 · 净值曲线 · 持仓 · 主题分布',
        sentence
        +noiseBandHTML(books,weekN)
        +medals
        +themeMixCard(books)
        +pairedEquitySVG(books)
        +table
        +holdingsMatrix(books)
        +'<div class="book-grid" style="margin-top:var(--space-6)">'+books.map(bookCard).join('')+'</div>'
        +epi('纸面成交，买卖两腿均已计入佣金与滑点 '+glossMark(COST_GLOSS)+' · 净值指数期初 = 100 · 噪声区间内的排名不构成结论'))
  +'</div>';
}

/* 单账/合计净值曲线（期初 = 100） */
function singleCurveSVG(lb){
  var eq=lb.equity||[];
  var base=eq[0].equity||lb.capital||1;
  var vs=eq.map(function(e){return e.equity/base*100});
  var W=760,H=150,pl=44,pr=14,pt=10,pb=22;
  var mn=Math.min.apply(null,vs),mx=Math.max.apply(null,vs);
  if(mx-mn<0.5){mn-=0.5;mx+=0.5}
  function X(i){return pl+i*(W-pl-pr)/Math.max(1,vs.length-1)}
  function Y(v){return pt+(mx-v)/(mx-mn)*(H-pt-pb)}
  var pts=vs.map(function(v,i){return X(i).toFixed(1)+','+Y(v).toFixed(1)}).join(' ');
  var col=vs[vs.length-1]>=100?'var(--color-stock-up-default)':'var(--color-stock-down-default)';
  var svg='<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block;max-width:800px" role="img" aria-label="净值曲线">';
  [mx,100,mn].forEach(function(g){
    if(g<mn-0.01||g>mx+0.01)return;
    svg+='<line x1="'+pl+'" y1="'+Y(g)+'" x2="'+(W-pr)+'" y2="'+Y(g)+'" stroke="var(--color-border-subtle)" stroke-width="1"'+(g===100?' stroke-dasharray="4 3"':'')+'/>'
      +'<text x="'+(pl-6)+'" y="'+(Y(g)+4)+'" text-anchor="end" font-family="var(--font-mono)" font-size="11" fill="var(--color-text-tertiary)">'+g.toFixed(1)+'</text>';
  });
  svg+='<polyline points="'+pts+'" fill="none" stroke="'+col+'" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>';
  svg+='<text x="'+pl+'" y="'+(H-6)+'" font-family="var(--font-mono)" font-size="11" fill="var(--color-text-tertiary)">'+esc(eq[0].d)+'</text>';
  svg+='<text x="'+(W-pr)+'" y="'+(H-6)+'" text-anchor="end" font-family="var(--font-mono)" font-size="11" fill="var(--color-text-tertiary)">'+esc(eq[eq.length-1].d)+'</text>';
  svg+='</svg>';
  return '<div class="funnel-wrap">'+svg+'</div>';
}
/* ── 持仓组合地图：主题敞口分布 ── */
function setHoldView(v){holdView=v;renderHoldings()}
function holdMapCard(ag){
  var w=S.weekly||{};
  /* 没有账本时这里曾固定写「8 个账本合计」——一个凭空出现的数字，
   * 而且和页面别处的 0 互相矛盾。没有就不写。 */
  var nbk=(ag&&ag.books)?ag.books.length:0;
  var head='<div class="qhead"><h2 class="qtitle">主题敞口分布<span style="font:400 13px/18px var(--font-sans);color:var(--color-text-tertiary)">　'+(nbk?(nbk+' 个账本合计'):'尚无账本')+'</span></h2>'
    +'<span style="display:flex;gap:var(--space-3);align-items:center">'+miniChain(5,'建仓 · 持仓束')
    +'<span role="group" aria-label="视图切换">'
      +'<button type="button" class="seg-btn'+(holdView==='map'?' on':'')+'" onclick="setHoldView(\'map\')" title="按宏观主题分组的持仓分布">地图</button>'
      +'<button type="button" class="seg-btn'+(holdView==='axis'?' on':'')+'" onclick="setHoldView(\'axis\')" title="横轴为跨策略共识度，纵轴为当前浮动盈亏">Y 轴</button>'
      +'<button type="button" class="seg-btn'+(holdView==='list'?' on':'')+'" onclick="setHoldView(\'list\')" title="逐仓明细表，可排序">列表</button>'
      +'</span>'
    +'<button type="button" class="qlink" onclick="openStageDrawer(5)">建仓详情 →</button>'
    +'</span></div>';
  if(!ag||!ag.openN){
    var nr=nextRunInfo();
    var line=w.in_flight
      ?'选仓进行中，完成后载入持仓分布。'
      :'当前无在场持仓'+(nr?'，下次建仓 '+esc(nr.date)+'（'+nr.wd+' '+nr.hm+'），还有 <span class="js-cd num">'+cdShort(nr.secs)+'</span>':'（接口未提供下次建仓时刻）')+'。';
    return '<div class="card section" id="holdCard">'+head
      +stepperHTML()
      +'<div class="quiet" style="text-align:center;margin-top:var(--space-2)">'+line+'</div>'
    +'</div>';
  }
  var mp=mergedPositions();
  var byCode=mp.byCode,order=mp.order;
  var totalV=0,maxV=1;
  order.forEach(function(k){totalV+=byCode[k].value;maxV=Math.max(maxV,byCode[k].value)});
  /* 这张图有四条编码规则要先学（泡的大小、颜色、徽标、分组）读者才看得懂，
     等于让人自己看图归纳。先把归纳好的结论写成一句话，图留给要核对的人。 */
  var tg={},tOrder=[];
  order.forEach(function(k){
    var pp=byCode[k],t=pp.theme_id||'（无主题记录）';
    if(!tg[t]){tg[t]={value:0,unreal:0,n:0};tOrder.push(t)}
    tg[t].value+=pp.value;tg[t].unreal+=pp.unrealized;tg[t].n++;
  });
  function themeName(t){return t==='（无主题记录）'?t:(topicLabel(t)||t)}
  var byVal=tOrder.slice().sort(function(a,b){return tg[b].value-tg[a].value});
  var byPnl=tOrder.slice().sort(function(a,b){return tg[b].unreal-tg[a].unreal});
  var lead='';
  if(byVal.length){
    var t0=byVal[0],tb=byPnl[0],tw=byPnl[byPnl.length-1];
    var pctOf=function(t){return totalV?(tg[t].value/totalV*100).toFixed(0):'0'};
    var money=function(t){return '<span class="num '+pctCls(tg[t].unreal)+'">'+signedMoney(tg[t].unreal)+'</span>'};
    /* 仓位最重的往往也是赚最多的，分成两句会把同一个主题念两遍。 */
    if(tb&&tb===t0&&tg[tb].unreal>0){
      lead='仓位最重、目前也赚最多的是<b>'+esc(themeName(t0))+'</b>（'
        +pctOf(t0)+'% 仓位 · '+tg[t0].n+' 个标的 · '+money(t0)+'）';
    }else{
      lead='仓位最重的是<b>'+esc(themeName(t0))+'</b>（'+pctOf(t0)+'% 仓位 · '+tg[t0].n+' 个标的）';
      if(tb&&tg[tb].unreal>0)
        lead+='；赚最多的是<b>'+esc(themeName(tb))+'</b> '+money(tb);
    }
    if(tw&&tw!==t0&&tw!==tb&&tg[tw].unreal<0)
      lead+='；亏最多的是<b>'+esc(themeName(tw))+'</b> '+money(tw);
    lead+='。';
  }
  var body;
  if(holdView==='list'){
    body=holdListTable(ag,mp);
  }else if(holdView==='axis'){
    body=holdAxisBody(ag,mp,totalV,maxV);
  }else{
    /* 按主题分组 */
    var groups={},gOrder=[];
    order.forEach(function(k){
      var p=byCode[k];
      var t=p.theme_id||'（无主题记录）';
      if(!groups[t]){groups[t]={list:[],value:0,unreal:0};gOrder.push(t)}
      groups[t].list.push(p);groups[t].value+=p.value;groups[t].unreal+=p.unrealized;
    });
    gOrder.sort(function(a,b){return groups[b].value-groups[a].value});
    var nb=ag.books.length;
    body='<div class="hm-legend"><span>按宏观主题分组，每个圆点是一个标的'
      +'<span class="gloss" title="圆点大小 = 该标的的仓位市值；颜色 = 浮动盈亏方向与幅度（红涨绿跌）；'
      +'徽标 n/'+nb+' = 同时选中该标的的账本数——'+nb+' 个选取策略各记一本账，被越多账本独立选中，跨策略共识度越高，≥6 个加亮描边">ⓘ 图例</span></span></div>';
    gOrder.forEach(function(t){
      var g=groups[t];
      g.list.sort(function(a,b){return b.value-a.value});
      var share=totalV?(g.value/totalV*100):0;
      var isTopic=t!=='（无主题记录）';
      body+='<div class="hm-group">'
        +'<div class="hm-k">'
        /* 中文名打头、英文代号降为次要：读者认的是「央行政策路径与流动性」，
           不是 POLICY-PATH。同一主题在别处也照这个次序显示。 */
        +(isTopic?'<button type="button" class="t" style="cursor:pointer;padding:0" onclick="openTopicDrawer(\''+jss(t)+'\')" title="查看该主题的评分与证据"><i class="thm-sw" style="background:'+themeColor(t)+'"></i>'+esc(topicLabel(t)||t)+' ›</button>':'<span class="t"><i class="thm-sw" style="background:'+themeColor(t)+'"></i>'+esc(t)+'</span>')
        +'<div class="l mono" style="font-size:11px;letter-spacing:.04em">'+esc(isTopic?t:'')+'</div>'
        +'<div class="s num">'+share.toFixed(0)+'% 仓位 · '+g.list.length+' 标的 · <span class="'+pctCls(g.unreal)+'">'+signedMoney(g.unreal)+'</span></div>'
        /* 就地可问：读者正看着这个主题，追问入口应该在这里，而不是要他
           先记住主题名再去别处找。按钮与 hm-k 里的主题链接并列，不嵌套。 */
        /* 用小一号：这里一屏并排五个主题组，整号实心药丸是页面里最重的
         * 视觉块，五颗叠起来比它们旁边的持仓气泡还抢眼。形状配色文案不变，
         * 只缩尺寸——换个位置还得是同一个东西。 */
        +(isTopic?'<div style="margin-top:4px">'+askBtn('topic',t,{stop:true,cls:'sm'})+'</div>':'')
        +'</div>'
        +'<div class="hm-cloud">'
        +g.list.map(function(p){
          var d=Math.round(30+Math.sqrt(p.value/maxV)*54);
          var pct=p.cost?(p.unrealized/p.cost*100):0;
          var up=p.unrealized>0.0001,down=p.unrealized<-0.0001;
          var a=Math.min(0.62,0.12+Math.abs(pct)*0.10);
          var bg,fg;
          if(up){bg='rgba(191,22,22,'+a.toFixed(2)+')';fg=a>0.38?'#ffffff':'var(--color-stock-up-text)'}
          else if(down){bg='rgba(11,143,74,'+a.toFixed(2)+')';fg=a>0.38?'#ffffff':'var(--color-stock-down-text)'}
          else{bg='var(--color-surface-muted)';fg='var(--color-text-metadata)'}
          var share1=totalV?(p.value/totalV*100):0;
          var th=String(p.thesis||'');if(th.length>64)th=th.slice(0,63)+'…';
          var nb2=ag.books.length;
          var ph='<div class="pp-t">'+esc(p.name||bareCode(p.code))+' <span class="mono" style="font-weight:400;color:var(--color-text-tertiary)">'+esc(bareCode(p.code))+'</span></div>'
            +'<div class="pp-n"><span class="'+pctCls(p.unrealized)+'">'+signedMoney(p.unrealized)+'（'+fmtPct(pct)+'）</span> · 仓位 '+share1.toFixed(1)+'%</div>'
            +(th?'<div>'+esc(th)+'</div>':'')
            +'<div class="pp-s">'+fmtInt(p.books.length)+'/'+nb2+' 个账本共同持有'+(p.theme_id?' · 主题 '+esc(p.theme_id):'')+'</div>';
          return '<button type="button" class="hbub'+(p.books.length>=6?' hi':'')+'" style="width:'+d+'px;height:'+d+'px;background:'+bg+';color:'+fg+'"'
            +popRef(ph)
            +' onclick="openPosDrawer(\''+jss(p.code)+'\')">'
            +esc(bareCode(p.code))
            +(d>=46?'<span class="bp '+'">'+fmtPct(pct)+'</span>':'')
            +'<span class="bb">'+p.books.length+'/'+nb2+'</span>'
            +'</button>';
        }).join('')
        +'</div></div>';
    });
    body+=epi('等权买入 · '+gloss('σ×2 止损 / σ×3 止盈',SIGMA_GLOSS)+'自动执行 · 盈亏为全账本合计');
  }
  return '<div class="card section" id="holdCard">'+head
    +(lead?'<div style="font:400 15px/23px var(--font-sans);color:var(--color-text-primary);margin:var(--space-2) 0 var(--space-2)">'+lead+'</div>':'')
    +'<div class="quiet" style="margin-bottom:var(--space-3)">共 '+fmtInt(order.length)+' 个标的，'+fmtInt(ag.books.length)+' 个账本合计持有 '+fmtInt(ag.openN)+' 仓</div>'
    /* 主链路第 02 步列出本期入选的 5 个主题，这张图列出持仓覆盖的主题——
     * 当前两套只重合 3 个。原因是持仓建于上一期，按的是上一期的选题；
     * 本期选出的主题还在挂单、没有仓位。不写出来，读者会以为两处有一处错了。 */
    +(function(){
      var chosen=topicChosen('hgep');
      if(!chosen.length)return '';
      var held={};order.forEach(function(k){var t=byCode[k].theme_id;if(t)held[t]=1});
      var stale=Object.keys(held).filter(function(t){return chosen.indexOf(t)<0}).sort();
      var unfilled=chosen.filter(function(t){return !held[t]});
      if(!stale.length&&!unfilled.length)return '';
      var bk=firstBookedDate(ag.books),per=(S.weekly||{}).as_of;
      var pend=Number(ag.pending)||0;
      var msg='当前持仓建于 '+esc(bk||'—')+'，按的是那一期选出的主题。';
      if(stale.length)msg+='其中 <b>'+stale.map(esc).join('、')+'</b> 不在本期（'+esc(per||'—')+'）入选之列。';
      if(unfilled.length)msg+='本期新选出的 <b>'+unfilled.map(esc).join('、')+'</b> 还没有仓位'
        +(pend?'——'+fmtInt(pend)+' 笔挂单待成交':'')+'。';
      return '<div class="hm-note">'+msg
        +'<span class="gloss gm" title="组合按 4 周滚动建仓，每周只换掉其中一批；已建的仓按原风控持有到期或触发止损止盈，不会因为主题这一期没入选就被强制平掉。所以「本期选了哪些主题」和「现在持有哪些主题」本来就不该完全一致——两处都对。">ⓘ</span>'
        +'</div>';
    })()
    +body
  +'</div>';
}
/* ── Y 轴视图 ──────────────────────────────────────────────────
 * 地图呈现主题敞口分布，列表呈现具体持仓，
 * 本图检验：跨策略共识度高的持仓，收益是否更好。
 * 横轴 = 同时持有该标的的账本数（跨账本共识度），纵轴 = 该仓位当前盈亏。
 * 共识本身不加分、不参与挑选，所以它与收益的关系是可以事后检验的——
 * 正斜率方说明跨策略共识度具有信息量。 */
function holdAxisBody(ag,mp,totalV,maxV){
  var byCode=mp.byCode,order=mp.order;
  var nb=ag.books.length||1;
  var pts=order.map(function(k){
    var p=byCode[k];
    return {p:p,x:p.books.length,y:p.cost?(p.unrealized/p.cost*100):0};
  });
  if(!pts.length)return '<div class="quiet">没有可作图的持仓。</div>';
  var ys=pts.map(function(o){return o.y});
  var yMax=Math.max.apply(null,ys),yMin=Math.min.apply(null,ys);
  var pad=Math.max(0.6,(yMax-yMin)*0.18);
  yMax+=pad;yMin-=pad;
  if(yMax===yMin){yMax+=1;yMin-=1}
  var W=1000,H=380,pl=64,pr=22,pt=18,pb=54;
  function X(v){return pl+(nb<=1?0.5:(v-1)/(nb-1))*(W-pl-pr)}
  function Y(v){return pt+(yMax-v)/(yMax-yMin)*(H-pt-pb)}
  var g='<svg class="pipe-svg" viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="持仓：跨账本共识 × 盈亏">';
  /* 横向刻度 */
  var ticks=4;
  for(var i=0;i<=ticks;i++){
    var v=yMin+(yMax-yMin)*i/ticks,y=Y(v);
    g+='<line x1="'+pl+'" y1="'+y.toFixed(1)+'" x2="'+(W-pr)+'" y2="'+y.toFixed(1)+'" stroke="var(--color-border-subtle)" stroke-width="1"/>'
      +'<text x="'+(pl-8)+'" y="'+(y+4).toFixed(1)+'" text-anchor="end" font-family="var(--font-mono)" font-size="10" fill="var(--color-text-tertiary)">'+v.toFixed(1)+'%</text>';
  }
  /* 零线 */
  if(yMin<0&&yMax>0){
    g+='<line x1="'+pl+'" y1="'+Y(0).toFixed(1)+'" x2="'+(W-pr)+'" y2="'+Y(0).toFixed(1)+'" stroke="var(--color-border-strong)" stroke-width="1.5" stroke-dasharray="5 4"/>'
      +'<text x="'+(W-pr)+'" y="'+(Y(0)-6).toFixed(1)+'" text-anchor="end" font-family="var(--font-sans)" font-size="10" fill="var(--color-text-metadata)">不赚不亏</text>';
  }
  /* 每个共识档的均值折线——这条线的斜率就是问题的答案 */
  var buckets={};
  pts.forEach(function(o){(buckets[o.x]=buckets[o.x]||[]).push(o.y)});
  var bKeys=Object.keys(buckets).map(Number).sort(function(a,b){return a-b});
  var poly=bKeys.map(function(k){
    var arr=buckets[k],m=arr.reduce(function(a,b){return a+b},0)/arr.length;
    return X(k).toFixed(1)+','+Y(m).toFixed(1);
  }).join(' ');
  if(bKeys.length>1){
    g+='<polyline points="'+poly+'" fill="none" stroke="var(--color-fill-brand-green)" stroke-width="2.5" stroke-linejoin="round" opacity="0.55"/>';
    bKeys.forEach(function(k){
      var arr=buckets[k],m=arr.reduce(function(a,b){return a+b},0)/arr.length;
      g+='<circle cx="'+X(k).toFixed(1)+'" cy="'+Y(m).toFixed(1)+'" r="3.5" fill="var(--color-fill-brand-green)"/>';
    });
  }
  /* X 轴刻度 */
  for(var b=1;b<=nb;b++){
    g+='<text x="'+X(b).toFixed(1)+'" y="'+(H-pb+22)+'" text-anchor="middle" font-family="var(--font-mono)" font-size="10" fill="var(--color-text-tertiary)">'+b+'</text>';
    var cnt=(buckets[b]||[]).length;
    if(cnt)g+='<text x="'+X(b).toFixed(1)+'" y="'+(H-pb+36)+'" text-anchor="middle" font-family="var(--font-sans)" font-size="9" fill="var(--color-text-disabled)">'+cnt+' 只</text>';
  }
  g+='<text x="'+((pl+W-pr)/2)+'" y="'+(H-4)+'" text-anchor="middle" font-family="var(--font-sans)" font-size="10.5" fill="var(--color-text-metadata)">横轴 = 跨账本共识度：同时持有该标的的账本数（共 '+nb+' 本）</text>'
   +'<text x="14" y="'+(pt+10)+'" font-family="var(--font-sans)" font-size="10.5" fill="var(--color-text-metadata)">纵轴 = 该仓位当前盈亏</text>';
  /* 蜂群排布：同一档里的泡沿横轴让开彼此。
   * 固定步长的抖动在这里不够用——泡的半径随仓位从 7 变到 24，
   * 一个 6px 的错位会让五个大泡叠成一坨，图上就只剩最上面那一个可读。
   * 所以按半径找位：从档位中心往两侧试，第一个不压到已放置的泡的位置就是它的位置。 */
  var placed=[];
  /* 让开的范围不能超过半个档距，否则泡会飘进隔壁档，横轴上的位置就骗人了。
   * 检查也必须是全局的：只跟同档比较，隔壁档挤过来的泡照样会压上。 */
  var halfSpan=(nb>1?(X(2)-X(1)):(W-pl-pr))/2-3;
  pts.sort(function(a,b){return b.p.value-a.p.value});
  var radii=pts.map(function(o){return Math.max(7,Math.round(7+Math.sqrt(o.p.value/maxV)*17))});
  pts.forEach(function(o,pi){
    var p=o.p;
    var r=radii[pi];
    var base=X(o.x),cy=Y(o.y);
    var cx=base,bestX=base,bestRoom=-Infinity;
    for(var step=0;;step++){
      var off=(step===0)?0:(Math.ceil(step/2)*7*(step%2?1:-1));
      if(Math.abs(off)>halfSpan){cx=bestX;break}
      var tryX=Math.max(pl-4,Math.min(W-pr+4,base+off));
      /* room = 离最近的泡还差多少才算贴上；>=0 表示互不遮挡 */
      var room=Infinity;
      for(var q=0;q<placed.length;q++){
        var o2=placed[q];
        var dx=tryX-o2.x,dy=cy-o2.y;
        room=Math.min(room,Math.sqrt(dx*dx+dy*dy)-(r+o2.r)*0.86);
      }
      if(room>=0){cx=tryX;break}
      if(room>bestRoom){bestRoom=room;bestX=tryX}
    }
    placed.push({x:cx,y:cy,r:r});
    var up=p.unrealized>0.0001,down=p.unrealized<-0.0001;
    var a=Math.min(0.66,0.16+Math.abs(o.y)*0.10);
    var fill=up?('rgba(191,22,22,'+a.toFixed(2)+')'):(down?('rgba(11,143,74,'+a.toFixed(2)+')'):'var(--color-surface-muted)');
    var stroke=up?'var(--color-stock-up-default)':(down?'var(--color-stock-down-default)':'var(--color-border-strong)');
    var share1=totalV?(p.value/totalV*100):0;
    var th=String(p.thesis||'');if(th.length>64)th=th.slice(0,63)+'…';
    var ph='<div class="pp-t">'+esc(p.name||bareCode(p.code))+' <span class="mono" style="font-weight:400;color:var(--color-text-tertiary)">'+esc(bareCode(p.code))+'</span></div>'
      +'<div class="pp-n"><span class="'+pctCls(p.unrealized)+'">'+signedMoney(p.unrealized)+'（'+fmtPct(o.y)+'）</span> · 仓位 '+share1.toFixed(1)+'%</div>'
      +(th?'<div>'+esc(th)+'</div>':'')
      +'<div class="pp-s">'+o.x+'/'+nb+' 个账本共同持有'+(p.theme_id?' · 主题 '+esc(p.theme_id):'')+'</div>';
    g+='<g class="pc-click" onclick="openPosDrawer(\''+jss(p.code)+'\')"'+popRef(ph)+'>'
      +'<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="'+r+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="1.2" opacity="0.92"/>'
      +(r>=13?'<text x="'+cx.toFixed(1)+'" y="'+(cy+3.5).toFixed(1)+'" text-anchor="middle" font-family="var(--font-mono)" font-size="9" font-weight="600" fill="'+(a>0.42?'#fff':'var(--color-text-primary)')+'">'+esc(bareCode(p.code))+'</text>':'')
      +'</g>';
  });
  g+='</svg>';
  /* 一句读法：这条线现在是什么形状 */
  var read='';
  if(bKeys.length>1){
    var lo=buckets[bKeys[0]],hi=buckets[bKeys[bKeys.length-1]];
    var mLo=lo.reduce(function(a,b){return a+b},0)/lo.length;
    var mHi=hi.reduce(function(a,b){return a+b},0)/hi.length;
    var d=mHi-mLo;
    read='共识度最低档（'+bKeys[0]+' 个账本）平均 '+mLo.toFixed(2)+'%，最高档（'+bKeys[bKeys.length-1]+' 个账本）平均 '+mHi.toFixed(2)+'%，'
      +(Math.abs(d)<0.3?'两端差异不显著，跨策略共识度当前未体现增量。'
        :(d>0?'高共识端高出 '+d.toFixed(2)+' 个百分点。':'高共识端低 '+Math.abs(d).toFixed(2)+' 个百分点。'))
      +'当前样本量下仅为读数，不构成结论。';
  }
  /* .pipe-svg 有 940px 的最小宽度，必须裹在自己的横滚容器里——
   * 否则窄屏上它会把整页撑出横向滚动条。流水线画布一直是这么包的。 */
  return '<div class="hm-legend"><span>泡的大小 = 仓位市值</span><span>颜色 = 盈亏方向（红涨绿跌）</span><span>绿线 = 各共识档的平均盈亏</span></div>'
    +'<div class="pipe-wrap scroll-thin">'+g+'</div>'
    +(read?'<div class="quiet" style="margin-top:var(--space-3)">'+read+'</div>':'')
    +epi('共识度只记录、不计分——它不参与选取，因此它与收益的关系是可事后检验的');
}

function pairedEquitySVG(books){

  var ds=Object.keys(dates).sort();
  var W=760,H=220,pl=44,pr=110,pt=12,pb=24;
  var mn=Infinity,mx=-Infinity;
  var list=withEq.map(function(b,bi){
    var base=(b.equity[0]||{}).equity||b.capital||1;
    var m={};(b.equity||[]).forEach(function(e){m[e.d]=e.equity/base*100});
    var vals=ds.map(function(d){return m[d]!==undefined?m[d]:null});

    return {name:selMetaOf(b.selector)[1],vals:vals,col:bookColor(b.selector)};
  });
  if(mx-mn<0.5){mn-=0.5;mx+=0.5}
  var xw=(W-pl-pr)/Math.max(1,ds.length-1);
  function X(i){return pl+i*xw}
  function Y(v){return pt+(mx-v)/(mx-mn)*(H-pt-pb)}
  var svg='<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block;max-width:800px" role="img" aria-label="各选取策略净值对比，期初=100">';
  [mx,100,mn].forEach(function(g){
    if(g<mn-0.01||g>mx+0.01)return;
    svg+='<line x1="'+pl+'" y1="'+Y(g)+'" x2="'+(W-pr)+'" y2="'+Y(g)+'" stroke="var(--color-border-subtle)" stroke-width="1"'+(g===100?' stroke-dasharray="4 3"':'')+'/>'
      +'<text x="'+(pl-6)+'" y="'+(Y(g)+4)+'" text-anchor="end" font-family="var(--font-mono)" font-size="11" fill="var(--color-text-tertiary)">'+g.toFixed(1)+'</text>';
  });
  /* 末端直标：先按末值排序，再逐个下压避免互相叠字 */
  var ends=[];
  list.forEach(function(s){
    var pts=[];
    s.vals.forEach(function(v,i){if(v!==null)pts.push(X(i).toFixed(1)+','+Y(v).toFixed(1))});
    if(pts.length<2)return;
    svg+='<polyline points="'+pts.join(' ')+'" fill="none" stroke="'+s.col+'" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>';
    var li=s.vals.length-1;while(li>=0&&s.vals[li]===null)li--;
    if(li>=0)ends.push({s:s,li:li,y:Y(s.vals[li])});
  });
  ends.sort(function(a,b){return a.y-b.y});
  var lastY=-99;
  ends.forEach(function(e){
    var ly=Math.max(e.y,lastY+12);lastY=ly;
    svg+='<circle cx="'+X(e.li)+'" cy="'+e.y.toFixed(1)+'" r="2.5" fill="'+e.s.col+'"/>'
      +'<text x="'+(X(e.li)+8)+'" y="'+(ly+4).toFixed(1)+'" font-family="var(--font-sans)" font-size="11" fill="'+e.s.col+'">'+esc(e.s.name)+' '+e.s.vals[e.li].toFixed(1)+'</text>';
  });
  svg+='<text x="'+pl+'" y="'+(H-6)+'" font-family="var(--font-mono)" font-size="11" fill="var(--color-text-tertiary)">'+esc(ds[0])+'</text>'
    +'<text x="'+(W-pr)+'" y="'+(H-6)+'" text-anchor="end" font-family="var(--font-mono)" font-size="11" fill="var(--color-text-tertiary)">'+esc(ds[ds.length-1])+'</text>'
    +'</svg>';
  return '<div class="funnel-wrap">'+svg+'</div>'
    +'<div class="card-note" style="margin-top:2px">净值指数'

function shortName(s){s=String(s||'');return s.length>8?s.slice(0,7)+'…':s}
/* 一组标签的短名，保证互不相同。定长截断在这里会出事：
 * 「来源限定 · AI 端到端」和「来源限定 · 约束边界」都会截成「来源限定 · A…」，
 * 两列表头一模一样，而它们恰好是配对比较的两条臂——正是最不能混的一对。
 * 撞了就逐字加长，加到全名仍撞才退回带序号。 */
function uniqueShorts(labels,maxLen){
  var cap=maxLen||8;
  var lens=labels.map(function(l){return Math.min(String(l||'').length,cap)});
  var cut=function(l,n){l=String(l||'');return l.length>n?l.slice(0,n)+'…':l};
  for(var guard=0;guard<40;guard++){
    var seen={},dup=false;
    labels.forEach(function(l,i){
      var k=cut(l,lens[i]);
      (seen[k]=seen[k]||[]).push(i);
    });
    Object.keys(seen).forEach(function(k){
      if(seen[k].length<2)return;
      dup=true;
      seen[k].forEach(function(i){
        if(lens[i]<String(labels[i]||'').length)lens[i]++;
      });
    });
    if(!dup)break;
  }
  return labels.map(function(l,i){return cut(l,lens[i])});
}

/* ── 策略 × 主题分布：并列各策略的主题权重，差异即策略间 diff ── */
function themeMixCard(books){
  if(!books||!books.length)return '';
  var tot={},mix=[];
  books.forEach(function(b){
    var by={},sum=0;
    (b.open_positions||[]).forEach(function(p){
      var t=p.theme_id||'未归类';
      var v=Math.abs((p.qty||0)*(p.last_px||p.entry_px||0))||1;
      by[t]=(by[t]||0)+v;sum+=v;tot[t]=(tot[t]||0)+v;
    });
    mix.push({b:b,by:by,sum:sum,n:(b.open_positions||[]).length});
  });
  var themes=Object.keys(tot).sort(function(a,b){return tot[b]-tot[a]});
  if(!themes.length)return '';
  var grand=themes.reduce(function(a,t){return a+tot[t]},0)||1;
  var avgW={};themes.forEach(function(t){avgW[t]=tot[t]/grand});

  var legend='<div class="tmx-legend">'+themes.map(function(t,i){
    return '<span><i style="background:'+themeColor(t)+'"></i>'+esc(t)+' '+(avgW[t]*100).toFixed(0)+'%</span>';
  }).join('')+'</div>';

  var order=SEL_META.map(function(m){return m[0]});

          +'title="'+esc(t)+' '+(w*100).toFixed(1)+'%（全策略均值 '+(avgW[t]*100).toFixed(1)+'%，'
          +(d>=0?'超配 +':'低配 −')+Math.abs(d*100).toFixed(1)+' pp）"></span>';
      }).join('');
    }
    var devTxt=dev?((dev.d>=0?'超配 ':'低配 ')+dev.t+' '+(dev.d>=0?'+':'−')+Math.abs(dev.d*100).toFixed(0)+'pp'):'—';
    return '<button type="button" class="tmx-row'+(m[2]==='对照'?' ctl':'')+'" onclick="openBookDrawer(\''+jss(o.b.selector||'')+'\')" '
      +'title="'+esc(m[1])+' · '+o.n+' 仓 · 相对全策略均值最大偏离：'+esc(devTxt)+'">'
      +'<span class="tmx-name">'+esc(m[1])+'</span>'
      +'<span class="tmx-bar">'+(segs||'<span class="tmx-seg" style="width:100%;background:var(--color-surface-sunken)"></span>')+'</span>'
      +'<span class="tmx-n">'+(o.n?o.n+' 仓':'空仓')+'</span>'
    +'</button>';
  }).join('');

  return '<div class="tmx">'

function sparkline(eq){

/* 合计收益与基准收益只算一次。首屏摘要和策略对比卡的合计行必须给出同一个
   数字，各算各的迟早会漂移——口径归一处，两边都从这里取。
   计算本身仍基于服务端 books/benchmark 的原始字段，前端只做换算与格式。 */
function aggReturnPct(ag){
  /* 服务端已经把跨账本聚合算好了（review._books_aggregate），口径写在
     books_aggregate.basis 里、有测试钉住、可回放。前端优先用它——跨源聚合
     不该由渲染层各自推导一遍。 */
  var sa=(S||{}).books_aggregate;
  if(sa&&sa.return_pct!==null&&sa.return_pct!==undefined)return sa.return_pct;
  if(!ag||!ag.capital)return null;
  var eq=ag.equity||[];
  var last=eq.length?eq[eq.length-1].equity:null;
  if(last!==null)return (last/ag.capital-1)*100;
  /* 合计净值曲线要求各账本日期轴完全一致，有账本晚一期建仓就拿不到。
     退而用各账本自己的收益率按本金加权——bookRet 是系统对「一本账的
     收益率」的既有定义，这里只是把它们合起来，不是另造一套公式。 */
  var num=0,den=0;
  currentBooks().forEach(function(b){
    var r=bookRet(b);
    if(r!==null&&b.capital){num+=r*b.capital;den+=b.capital}
  });
  return den?num/den:null;
}
/* 基准必须和账本量同一段日期。基准序列比账本净值多起了几个交易日，
 * 直接用整条序列，就是拿 SPY 的额外几天去和组合比——「跑输 N 个百分点」
 * 这个头条结论会随之偏掉，而且偏多少取决于那几天涨跌，不可预测。
 * 起点取账本净值的最早日期，基准用该日或之前最近的一个收盘作基数。 */
function bookWindowStart(){
  var bs=currentBooks(),first=null;
  bs.forEach(function(b){
    var e=b.equity||[];
    if(e.length&&e[0].d&&(first===null||e[0].d<first))first=e[0].d;
  });
  return first;
}
function benchBase(){
  var sr=((S&&S.benchmark)||{}).series||[];
  if(sr.length<2)return null;
  var start=bookWindowStart();
  if(!start)return {i:0,aligned:false,start:sr[0].d};
  var idx=-1;
  for(var i=0;i<sr.length;i++){if(sr[i].d<=start)idx=i;else break}
  if(idx<0){                      /* 基准序列整体晚于账本起点：只能用它自己的第一天 */
    return {i:0,aligned:false,start:sr[0].d,wanted:start};
  }
  return {i:idx,aligned:true,start:sr[idx].d,wanted:start};
}
function benchReturnPct(){
  var sr=((S&&S.benchmark)||{}).series||[];
  var b=benchBase();
  if(!b||sr.length<2)return null;
  return (sr[sr.length-1].close/sr[b.i].close-1)*100;
}
function benchWindowNote(){
  var sr=((S&&S.benchmark)||{}).series||[];
  var b=benchBase();
  if(!b||!sr.length)return '';
  var raw=(sr[sr.length-1].close/sr[0].close-1)*100;
  var used=(sr[sr.length-1].close/sr[b.i].close-1)*100;
  var note=esc(benchName())+' 与组合取同一段日期：'+esc(b.start)+' → '+esc(sr[sr.length-1].d)+'。';
  if(Math.abs(raw-used)>0.05){
    note+='基准行情本身还多几个交易日（自 '+esc(sr[0].d)+' 起为 '+raw.toFixed(2)+'%），'
      +'那一段组合尚未建仓，计进来就不是同期比较了，所以这里按 '+esc(b.start)+' 起算。';
  }
  if(!b.aligned&&b.wanted)note+='注意：基准行情最早只到 '+esc(sr[0].d)+'，晚于组合起点 '+esc(b.wanted)+'，这个对照并不严格同期。';
  return note;
}
function benchName(){
  return (((S&&S.benchmark)||{}).code||'SPY').replace('US.','');
}

/* ── 首屏摘要：本期组合的收益，以及相对基准是跑赢还是跑输 ──────────
   这一页叫「组合」，可损益此前只出现在策略对比卡的合计行里，读者要往下
   滚过主链路和整张噪音带图才看得到。第一档信息上提到首屏，口径与合计行
   同源（aggReturnPct / benchReturnPct），不新增一套数字。 */
/* 已跑到第几周。首屏结论和策略对比卡必须引用同一个周数，各算各的会说出
   两个不同的「第 N 周」。 */
/* 「什么时候开始持有」= 最早一笔实际建仓日，不是 booked_as_of。
 * booked_as_of 是账本最新一批想法的期次标签；当前每本账都写着 2026-09-02，
 * 而 114 笔持仓（111 在场 + 3 已平）全部建于 2026-08-26。用批次标签当建仓日，
 * 首屏就会说「09-02 才建仓、此前是现金」——差了整整一周，而且「建仓后第 N 周」
 * 也跟着少算一周，直接影响「还要多久才够判定」那句话。
 * 落回 booked_as_of 只发生在一笔持仓都没有的时候（那时它确实是最好的近似）。 */
function firstBookedDate(books){
  /* 服务端的 first_opened_d 覆盖在场与已平两类持仓；state 只带 open_positions，
     所以只看在场持仓会在最早那批全平掉之后把建仓日算晚。这个日期是
     「第 N 周 / 约 17 周」的分子，算晚一周就把实验进度说少一周。 */
  var minOpened=null;
  (books||[]).forEach(function(b){
    if(b.first_opened_d&&(minOpened===null||b.first_opened_d<minOpened))
      minOpened=b.first_opened_d;
  });
  if(minOpened)return minOpened;
  (books||[]).forEach(function(b){
    (b.open_positions||[]).forEach(function(p){
      if(p.opened_d&&(minOpened===null||p.opened_d<minOpened))minOpened=p.opened_d;
    });
  });
  if(minOpened)return minOpened;
  var minBooked=null;
  (books||[]).forEach(function(b){
    if(b.booked_as_of&&(minBooked===null||b.booked_as_of<minBooked))minBooked=b.booked_as_of;
  });
  return minBooked;
}
/* 首屏那两个大数的实际区间。组合的净值曲线从 bookWindowStart 起算，基准
 * 对齐到同一天——但建仓要晚得多，中间那段组合是现金。区间不写出来，
 * 「第 1 周」旁边挂着一个六周的 SPY 涨幅，读者只会算出 SPY 一周涨 6%。 */
function heroWindowNote(books){
  var sr=((S&&S.benchmark)||{}).series||[];
  var b=benchBase();
  if(!b||!sr.length)return '';
  var md=function(d){return String(d||'').slice(5)};
  var t='区间 '+md(b.start)+' → '+md(sr[sr.length-1].d);
  var bk=firstBookedDate(books);
  if(bk&&bk>b.start)t+='（'+md(bk)+' 才建仓，此前是现金）';
  return t;
}
function weekIndex(books){
  var minBooked=firstBookedDate(books);
  if(!minBooked)return 1;
  var days=(Date.now()-new Date(minBooked+'T00:00:00+08:00').getTime())/86400000;
  return Math.max(1,Math.ceil(days/7));
}
/* 组合 vs 基准的两条线，期初都归 100。两个数字说得清「跑赢还是跑输」，
   说不清「什么时候拉开的、中间回撤过没有」——那是 PM 看曲线的原因。
   数据全部来自服务端：books_aggregate.equity 与 benchmark.series。 */
function overviewCurveSVG(){
  var sa=(S||{}).books_aggregate||{}, eq=sa.equity||[];
  var bm=(S||{}).benchmark||{}, bs=bm.series||[];
  if(eq.length<2)return '';
  var base=sa.capital||eq[0].equity;
  var mine=eq.map(function(x){return {d:x.d,v:x.equity/base*100}});
  /* 归一必须用与组合同一天的收盘，不是整条基准序列的第一天。
   * 基准行情比账本净值早起几个交易日，用 bs[0] 归一会让基准线从 98.72 出发
   * 而不是 100——图上说「期初都归 100」，画出来却不是；而且末值 104.63 和
   * 首屏那个已经对齐过的 +5.99% 对不上，同一屏里两个数互相打架。 */
  var bIdx=(function(){var b=(typeof benchBase==='function')?benchBase():null;return (b&&bs[b.i])?b.i:0})();
  var bBase=bs.length?bs[bIdx].close:null;
  var bmap={};bs.forEach(function(x){bmap[x.d]=x.close});
  var carry=null;
  var bench=bBase?mine.map(function(m){
    if(bmap[m.d]!==undefined)carry=bmap[m.d];
    return {d:m.d,v:carry===null?100:carry/bBase*100};
  }):[];
  var all=mine.map(function(x){return x.v}).concat(bench.map(function(x){return x.v}));
  var mn=Math.min.apply(null,all),mx=Math.max.apply(null,all);
  var pad=Math.max(0.15,(mx-mn)*0.18);mn-=pad;mx+=pad;
  var W=760,H=132,pl=6,pr=6,pt=8,pb=16;
  function X(i,n){return pl+i*(W-pl-pr)/Math.max(1,n-1)}
  function Y(v){return pt+(mx-v)/(mx-mn||1)*(H-pt-pb)}
  function path(a){return a.map(function(x,i){return (i?'L':'M')+X(i,a.length).toFixed(1)+' '+Y(x.v).toFixed(1)}).join(' ')}
  var up=(mine[mine.length-1].v>=100);
  var col=up?'var(--color-stock-up-default)':'var(--color-stock-down-default)';
  var svg='<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block" role="img"'
    +' aria-label="本期组合与基准的净值走势，期初均为 100">'
    +'<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(100).toFixed(1)+'" y2="'+Y(100).toFixed(1)
      +'" stroke="var(--color-border-default)" stroke-width="1" stroke-dasharray="3 3"/>';
  if(bench.length)svg+='<path d="'+path(bench)+'" fill="none" stroke="var(--color-text-tertiary)" stroke-width="1.5"/>';
  svg+='<path d="'+path(mine)+'" fill="none" stroke="'+col+'" stroke-width="2" stroke-linejoin="round"/>'
    +'</svg>';
  return '<div style="margin-top:var(--space-4)">'+svg
    +'<div style="display:flex;gap:var(--space-4);flex-wrap:wrap;margin-top:2px;'
      +'font:400 11px/16px var(--font-sans);color:var(--color-text-tertiary)">'
      +'<span><i style="display:inline-block;width:10px;height:2px;background:'+col+';vertical-align:middle;margin-right:5px"></i>本期组合</span>'
      +(bench.length?'<span><i style="display:inline-block;width:10px;height:2px;background:var(--color-text-tertiary);vertical-align:middle;margin-right:5px"></i>同期 '+esc(benchName())+'</span>':'')
      +'<span style="margin-left:auto">'+esc(eq[0].d)+' → '+esc(eq[eq.length-1].d)+' · 期初 = 100</span>'
    +'</div></div>';
}
/* 现金利率必须报系统实际在用的那个：货架 7 日收益中位数取到了就用它，
 * 取不到才落到 config.RISK_FREE_ANNUAL。页面以前直接写死兜底值还标「当前」，
 * 在货架有报价的那些周，印的是一个系统根本没用的数。 */
function cashRateNote(){
  var c=(S||{}).cash_rate;
  if(!c||c.annual===undefined||c.annual===null)return '未建仓的现金按货币市场利率计息。';
  var pct=(Number(c.annual)*100).toFixed(2)+'% 年化';
  return c.source==='shelf_median_7d'
    ? '未建仓的现金按货币市场利率计息（'+pct+'，取自货架 7 日收益中位数）。'
    : '未建仓的现金按货币市场利率计息（'+pct+'，货架未报价，用的是配置里的兜底值）。';
}
function portfolioHeadline(ag){
  if(!ag)return '';

  var vs=(ret!==null&&spy!==null)?(ret-spy):null;
  var nBooks=currentBooks().length;
  var wk=weekIndex(currentBooks());
  /* 首屏只回答一个问题：这一个月，组合相对基准是跑赢还是跑输。

     而同期 SPY 是 4.63%，所以头条是收益率与基准对照，金额降为附注。

  var verdict = vs===null ? '尚无可比的收益数据'
    : '<b>'+(vs>=0?'跑赢 ':'跑输 ')+esc(benchName())+' '

    +'<div style="display:flex;flex-wrap:wrap;align-items:flex-end;gap:var(--space-6) var(--space-8)">'
      +'<div>'
        /* 分母必须和数字同一高度。这两栏并排放着，读者默认它们可比，
           但组合按设计只投出四分之一（四周梯队第 1 周，其余在货币基金），
           而 SPY 那栏是满仓。不写出来，「跑输 4 个百分点」会被读成选股差，
           实际上有相当一部分是被授权的现金拖累——那是仓位节奏，不是判断失误。 */
        +'<div style="font:400 13px/18px var(--font-sans);color:var(--color-text-tertiary);margin-bottom:4px">本期组合 · '+nBooks+' 个账本合计'
          +(function(){
            var d=(ag.capital&&ag.deployed!==undefined)?(ag.deployed/ag.capital*100):null;
