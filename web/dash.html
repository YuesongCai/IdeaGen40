/* 单账/合计净值曲线（期初 = 100） */
function singleCurveSVG(lb){
  var eq=lb.equity||[];
  var base=eq[0].equity||lb.capital||1;
  var vs=eq.map(function(e){return e.equity/base*100});
  var W=760,H=150,pl=44,pr=14,pt=10,pb=22;
  var mn=Math.min.apply(null,vs),mx=Math.max.apply(null,vs);
  if(mx-mn<0.5){mn-=0.5;mx+=0.5}
  function X(i){return pl+i*(W-pl-pr)/Math.max(1,vs.length-1)}
  function Y(v){return pt+(mx-v)/(mx-mn)*(H-pt-pb)}
  var pts=vs.map(function(v,i){return X(i).toFixed(1)+','+Y(v).toFixed(1)}).join(' ');
  var col=vs[vs.length-1]>=100?'var(--color-stock-up-default)':'var(--color-stock-down-default)';
  var svg='<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block;max-width:800px" role="img" aria-label="净值曲线">';
  [mx,100,mn].forEach(function(g){
    if(g<mn-0.01||g>mx+0.01)return;
    svg+='<line x1="'+pl+'" y1="'+Y(g)+'" x2="'+(W-pr)+'" y2="'+Y(g)+'" stroke="var(--color-border-subtle)" stroke-width="1"'+(g===100?' stroke-dasharray="4 3"':'')+'/>'
      +'<text x="'+(pl-6)+'" y="'+(Y(g)+4)+'" text-anchor="end" font-family="var(--font-mono)" font-size="11" fill="var(--color-text-tertiary)">'+g.toFixed(1)+'</text>';
  });
  svg+='<polyline points="'+pts+'" fill="none" stroke="'+col+'" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>';
  svg+='<text x="'+pl+'" y="'+(H-6)+'" font-family="var(--font-mono)" font-size="11" fill="var(--color-text-tertiary)">'+esc(eq[0].d)+'</text>';
  svg+='<text x="'+(W-pr)+'" y="'+(H-6)+'" text-anchor="end" font-family="var(--font-mono)" font-size="11" fill="var(--color-text-tertiary)">'+esc(eq[eq.length-1].d)+'</text>';
  svg+='</svg>';
  return '<div class="funnel-wrap">'+svg+'</div>';
}

/* ── Y 轴视图 ──────────────────────────────────────────────────
 * 地图呈现主题敞口分布，列表呈现具体持仓，
 * 本图检验：跨策略共识度高的持仓，收益是否更好。
 * 横轴 = 同时持有该标的的账本数（跨账本共识度），纵轴 = 该仓位当前盈亏。
 * 共识本身不加分、不参与挑选，所以它与收益的关系是可以事后检验的——
 * 正斜率方说明跨策略共识度具有信息量。 */
function holdAxisBody(ag,mp,totalV,maxV){
  var byCode=mp.byCode,order=mp.order;
  var nb=ag.books.length||1;
  var pts=order.map(function(k){
    var p=byCode[k];
    return {p:p,x:p.books.length,y:p.cost?(p.unrealized/p.cost*100):0};
  });
  if(!pts.length)return '<div class="quiet">没有可作图的持仓。</div>';
  var ys=pts.map(function(o){return o.y});
  var yMax=Math.max.apply(null,ys),yMin=Math.min.apply(null,ys);
  var pad=Math.max(0.6,(yMax-yMin)*0.18);
  yMax+=pad;yMin-=pad;
  if(yMax===yMin){yMax+=1;yMin-=1}
  var W=1000,H=380,pl=64,pr=22,pt=18,pb=54;
  function X(v){return pl+(nb<=1?0.5:(v-1)/(nb-1))*(W-pl-pr)}
  function Y(v){return pt+(yMax-v)/(yMax-yMin)*(H-pt-pb)}
  var g='<svg class="pipe-svg" viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="持仓：跨账本共识 × 盈亏">';
  /* 横向刻度 */
  var ticks=4;
  for(var i=0;i<=ticks;i++){
    var v=yMin+(yMax-yMin)*i/ticks,y=Y(v);
    g+='<line x1="'+pl+'" y1="'+y.toFixed(1)+'" x2="'+(W-pr)+'" y2="'+y.toFixed(1)+'" stroke="var(--color-border-subtle)" stroke-width="1"/>'
      +'<text x="'+(pl-8)+'" y="'+(y+4).toFixed(1)+'" text-anchor="end" font-family="var(--font-mono)" font-size="10" fill="var(--color-text-tertiary)">'+v.toFixed(1)+'%</text>';
  }
  /* 零线 */
  if(yMin<0&&yMax>0){
    g+='<line x1="'+pl+'" y1="'+Y(0).toFixed(1)+'" x2="'+(W-pr)+'" y2="'+Y(0).toFixed(1)+'" stroke="var(--color-border-strong)" stroke-width="1.5" stroke-dasharray="5 4"/>'
      +'<text x="'+(W-pr)+'" y="'+(Y(0)-6).toFixed(1)+'" text-anchor="end" font-family="var(--font-sans)" font-size="10" fill="var(--color-text-metadata)">不赚不亏</text>';
  }
  /* 每个共识档的均值折线——这条线的斜率就是问题的答案 */
  var buckets={};
  pts.forEach(function(o){(buckets[o.x]=buckets[o.x]||[]).push(o.y)});
  var bKeys=Object.keys(buckets).map(Number).sort(function(a,b){return a-b});
  var poly=bKeys.map(function(k){
    var arr=buckets[k],m=arr.reduce(function(a,b){return a+b},0)/arr.length;
    return X(k).toFixed(1)+','+Y(m).toFixed(1);
  }).join(' ');
  if(bKeys.length>1){
    g+='<polyline points="'+poly+'" fill="none" stroke="var(--color-fill-brand-green)" stroke-width="2.5" stroke-linejoin="round" opacity="0.55"/>';
    bKeys.forEach(function(k){
      var arr=buckets[k],m=arr.reduce(function(a,b){return a+b},0)/arr.length;
      g+='<circle cx="'+X(k).toFixed(1)+'" cy="'+Y(m).toFixed(1)+'" r="3.5" fill="var(--color-fill-brand-green)"/>';
    });
  }
  /* X 轴刻度 */
  for(var b=1;b<=nb;b++){
    g+='<text x="'+X(b).toFixed(1)+'" y="'+(H-pb+22)+'" text-anchor="middle" font-family="var(--font-mono)" font-size="10" fill="var(--color-text-tertiary)">'+b+'</text>';
    var cnt=(buckets[b]||[]).length;
    if(cnt)g+='<text x="'+X(b).toFixed(1)+'" y="'+(H-pb+36)+'" text-anchor="middle" font-family="var(--font-sans)" font-size="9" fill="var(--color-text-disabled)">'+cnt+' 只</text>';
  }
  g+='<text x="'+((pl+W-pr)/2)+'" y="'+(H-4)+'" text-anchor="middle" font-family="var(--font-sans)" font-size="10.5" fill="var(--color-text-metadata)">横轴 = 跨账本共识度：同时持有该标的的账本数（共 '+nb+' 本）</text>'
   +'<text x="14" y="'+(pt+10)+'" font-family="var(--font-sans)" font-size="10.5" fill="var(--color-text-metadata)">纵轴 = 该仓位当前盈亏</text>';
  /* 蜂群排布：同一档里的泡沿横轴让开彼此。
   * 固定步长的抖动在这里不够用——泡的半径随仓位从 7 变到 24，
   * 一个 6px 的错位会让五个大泡叠成一坨，图上就只剩最上面那一个可读。
   * 所以按半径找位：从档位中心往两侧试，第一个不压到已放置的泡的位置就是它的位置。 */
  var placed=[];
  /* 让开的范围不能超过半个档距，否则泡会飘进隔壁档，横轴上的位置就骗人了。
   * 检查也必须是全局的：只跟同档比较，隔壁档挤过来的泡照样会压上。 */
  var halfSpan=(nb>1?(X(2)-X(1)):(W-pl-pr))/2-3;
  pts.sort(function(a,b){return b.p.value-a.p.value});
  var radii=pts.map(function(o){return Math.max(7,Math.round(7+Math.sqrt(o.p.value/maxV)*17))});
  pts.forEach(function(o,pi){
    var p=o.p;
    var r=radii[pi];
    var base=X(o.x),cy=Y(o.y);
    var cx=base,bestX=base,bestRoom=-Infinity;
    for(var step=0;;step++){
      var off=(step===0)?0:(Math.ceil(step/2)*7*(step%2?1:-1));
      if(Math.abs(off)>halfSpan){cx=bestX;break}
      var tryX=Math.max(pl-4,Math.min(W-pr+4,base+off));
      /* room = 离最近的泡还差多少才算贴上；>=0 表示互不遮挡 */
      var room=Infinity;
      for(var q=0;q<placed.length;q++){
        var o2=placed[q];
        var dx=tryX-o2.x,dy=cy-o2.y;
        room=Math.min(room,Math.sqrt(dx*dx+dy*dy)-(r+o2.r)*0.86);
      }
      if(room>=0){cx=tryX;break}
      if(room>bestRoom){bestRoom=room;bestX=tryX}
    }
    placed.push({x:cx,y:cy,r:r});
    var up=p.unrealized>0.0001,down=p.unrealized<-0.0001;
    var a=Math.min(0.66,0.16+Math.abs(o.y)*0.10);
    var fill=up?('rgba(191,22,22,'+a.toFixed(2)+')'):(down?('rgba(11,143,74,'+a.toFixed(2)+')'):'var(--color-surface-muted)');
    var stroke=up?'var(--color-stock-up-default)':(down?'var(--color-stock-down-default)':'var(--color-border-strong)');
    var share1=totalV?(p.value/totalV*100):0;
    var th=String(p.thesis||'');if(th.length>64)th=th.slice(0,63)+'…';
    var ph='<div class="pp-t">'+esc(p.name||bareCode(p.code))+' <span class="mono" style="font-weight:400;color:var(--color-text-tertiary)">'+esc(bareCode(p.code))+'</span></div>'
      +'<div class="pp-n"><span class="'+pctCls(p.unrealized)+'">'+signedMoney(p.unrealized)+'（'+fmtPct(o.y)+'）</span> · 仓位 '+share1.toFixed(1)+'%</div>'
      +(th?'<div>'+esc(th)+'</div>':'')
      +'<div class="pp-s">'+o.x+'/'+nb+' 个账本共同持有'+(p.theme_id?' · 主题 '+esc(p.theme_id):'')+'</div>';
    g+='<g class="pc-click" onclick="openPosDrawer(\''+jss(p.code)+'\')"'+popRef(ph)+'>'
      +'<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="'+r+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="1.2" opacity="0.92"/>'
      +(r>=13?'<text x="'+cx.toFixed(1)+'" y="'+(cy+3.5).toFixed(1)+'" text-anchor="middle" font-family="var(--font-mono)" font-size="9" font-weight="600" fill="'+(a>0.42?'#fff':'var(--color-text-primary)')+'">'+esc(bareCode(p.code))+'</text>':'')
      +'</g>';
  });
  g+='</svg>';
  /* 一句读法：这条线现在是什么形状 */
  var read='';
  if(bKeys.length>1){
    var lo=buckets[bKeys[0]],hi=buckets[bKeys[bKeys.length-1]];
    var mLo=lo.reduce(function(a,b){return a+b},0)/lo.length;
    var mHi=hi.reduce(function(a,b){return a+b},0)/hi.length;
    var d=mHi-mLo;
    read='共识度最低档（'+bKeys[0]+' 个账本）平均 '+mLo.toFixed(2)+'%，最高档（'+bKeys[bKeys.length-1]+' 个账本）平均 '+mHi.toFixed(2)+'%，'
      +(Math.abs(d)<0.3?'两端差异不显著，跨策略共识度当前未体现增量。'
        :(d>0?'高共识端高出 '+d.toFixed(2)+' 个百分点。':'高共识端低 '+Math.abs(d).toFixed(2)+' 个百分点。'))
      +'当前样本量下仅为读数，不构成结论。';
  }
  return '<div class="hm-legend"><span>泡的大小 = 仓位市值</span><span>颜色 = 盈亏方向（红涨绿跌）</span><span>绿线 = 各共识档的平均盈亏</span></div>'
    +g
    +(read?'<div class="quiet" style="margin-top:var(--space-3)">'+read+'</div>':'')
    +epi('共识度只记录、不计分——它不参与选取，因此它与收益的关系是可事后检验的');
}

function pairedEquitySVG(books){
  var withEq=books.filter(function(b){return (b.equity||[]).length>=2});
  if(!withEq.length)return '<div class="quiet">净值曲线待累积——首个盯市日后出现。</div>';
  var dates={};
  withEq.forEach(function(b){(b.equity||[]).forEach(function(e){dates[e.d]=1})});
  var ds=Object.keys(dates).sort();
  var W=760,H=220,pl=44,pr=110,pt=12,pb=24;
  var mn=Infinity,mx=-Infinity;
  var list=withEq.map(function(b,bi){
    var base=(b.equity[0]||{}).equity||b.capital||1;
    var m={};(b.equity||[]).forEach(function(e){m[e.d]=e.equity/base*100});
    var vals=ds.map(function(d){return m[d]!==undefined?m[d]:null});
    vals.forEach(function(v){if(v!==null){if(v<mn)mn=v;if(v>mx)mx=v}});
    return {name:selMetaOf(b.selector)[1],vals:vals,col:bookColor(b.selector)};
  });
  if(mx-mn<0.5){mn-=0.5;mx+=0.5}
  var xw=(W-pl-pr)/Math.max(1,ds.length-1);
  function X(i){return pl+i*xw}
  function Y(v){return pt+(mx-v)/(mx-mn)*(H-pt-pb)}
  var svg='<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block;max-width:800px" role="img" aria-label="各选取策略净值对比，期初=100">';
  [mx,100,mn].forEach(function(g){
    if(g<mn-0.01||g>mx+0.01)return;
    svg+='<line x1="'+pl+'" y1="'+Y(g)+'" x2="'+(W-pr)+'" y2="'+Y(g)+'" stroke="var(--color-border-subtle)" stroke-width="1"'+(g===100?' stroke-dasharray="4 3"':'')+'/>'
      +'<text x="'+(pl-6)+'" y="'+(Y(g)+4)+'" text-anchor="end" font-family="var(--font-mono)" font-size="11" fill="var(--color-text-tertiary)">'+g.toFixed(1)+'</text>';
  });
  /* 末端直标：先按末值排序，再逐个下压避免互相叠字 */
  var ends=[];
  list.forEach(function(s){
    var pts=[];
    s.vals.forEach(function(v,i){if(v!==null)pts.push(X(i).toFixed(1)+','+Y(v).toFixed(1))});
    if(pts.length<2)return;
    svg+='<polyline points="'+pts.join(' ')+'" fill="none" stroke="'+s.col+'" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>';
    var li=s.vals.length-1;while(li>=0&&s.vals[li]===null)li--;
    if(li>=0)ends.push({s:s,li:li,y:Y(s.vals[li])});
  });
  ends.sort(function(a,b){return a.y-b.y});
  var lastY=-99;
  ends.forEach(function(e){
    var ly=Math.max(e.y,lastY+12);lastY=ly;
    svg+='<circle cx="'+X(e.li)+'" cy="'+e.y.toFixed(1)+'" r="2.5" fill="'+e.s.col+'"/>'
      +'<text x="'+(X(e.li)+8)+'" y="'+(ly+4).toFixed(1)+'" font-family="var(--font-sans)" font-size="11" fill="'+e.s.col+'">'+esc(e.s.name)+' '+e.s.vals[e.li].toFixed(1)+'</text>';
  });
  svg+='<text x="'+pl+'" y="'+(H-6)+'" font-family="var(--font-mono)" font-size="11" fill="var(--color-text-tertiary)">'+esc(ds[0])+'</text>'
    +'<text x="'+(W-pr)+'" y="'+(H-6)+'" text-anchor="end" font-family="var(--font-mono)" font-size="11" fill="var(--color-text-tertiary)">'+esc(ds[ds.length-1])+'</text>'
    +'</svg>';
  return '<div class="funnel-wrap">'+svg+'</div>'
    +'<div class="card-note" style="margin-top:2px">净值指数：期初 = 100，同轴可比；虚线为盈亏平衡线</div>';
}

/* ── 策略 × 主题分布：并列各策略的主题权重，差异即策略间 diff ── */
function themeMixCard(books){
  if(!books||!books.length)return '';
  var tot={},mix=[];
  books.forEach(function(b){
    var by={},sum=0;
    (b.open_positions||[]).forEach(function(p){
      var t=p.theme_id||'未归类';
      var v=Math.abs((p.qty||0)*(p.last_px||p.entry_px||0))||1;
      by[t]=(by[t]||0)+v;sum+=v;tot[t]=(tot[t]||0)+v;
    });
    mix.push({b:b,by:by,sum:sum,n:(b.open_positions||[]).length});
  });
  var themes=Object.keys(tot).sort(function(a,b){return tot[b]-tot[a]});
  if(!themes.length)return '';
  var grand=themes.reduce(function(a,t){return a+tot[t]},0)||1;
  var avgW={};themes.forEach(function(t){avgW[t]=tot[t]/grand});

  var legend='<div class="tmx-legend">'+themes.map(function(t,i){
    return '<span><i style="background:'+themeColor(t)+'"></i>'+esc(t)+' '+(avgW[t]*100).toFixed(0)+'%</span>';
  }).join('')+'</div>';

  var order=SEL_META.map(function(m){return m[0]});
  mix.sort(function(a,b){
    var x=order.indexOf(a.b.selector),y=order.indexOf(b.b.selector);
    return (x<0?99:x)-(y<0?99:y);
  });

  var rows=mix.map(function(o){
    var m=selMetaOf(o.b.selector);
    var segs='',dev=null;
    if(o.sum>0){
      segs=themes.filter(function(t){return o.by[t]}).map(function(t){
        var w=o.by[t]/o.sum;
        var d=w-avgW[t];
        if(dev===null||Math.abs(d)>Math.abs(dev.d))dev={t:t,d:d,w:w};
        return '<span class="tmx-seg" style="width:'+(w*100).toFixed(2)+'%;background:'+themeColor(t)+'" '
          +'title="'+esc(t)+' '+(w*100).toFixed(1)+'%（全策略均值 '+(avgW[t]*100).toFixed(1)+'%，'
          +(d>=0?'超配 +':'低配 −')+Math.abs(d*100).toFixed(1)+' pp）"></span>';
      }).join('');
    }
    var devTxt=dev?((dev.d>=0?'超配 ':'低配 ')+dev.t+' '+(dev.d>=0?'+':'−')+Math.abs(dev.d*100).toFixed(0)+'pp'):'—';
    return '<button type="button" class="tmx-row'+(m[2]==='对照'?' ctl':'')+'" onclick="openBookDrawer(\''+jss(o.b.selector||'')+'\')" '
      +'title="'+esc(m[1])+' · '+o.n+' 仓 · 相对全策略均值最大偏离：'+esc(devTxt)+'">'
      +'<span class="tmx-name">'+esc(m[1])+'</span>'
      +'<span class="tmx-bar">'+(segs||'<span class="tmx-seg" style="width:100%;background:var(--color-surface-sunken)"></span>')+'</span>'
      +'<span class="tmx-n">'+(o.n?o.n+' 仓':'空仓')+'</span>'
    +'</button>';
  }).join('');

  return '<div class="tmx">'
    +'<div class="card-title-row"><h2 class="card-title" style="margin-bottom:0;font-size:15px">各策略的主题分布</h2>'
    +'<span class="card-note">按持仓市值占比 · 同一候选池下的分布差异即策略间差异</span></div>'
    +legend+rows
  +'</div>';
}

function spyLine(ret){
  // 同一段日期里「什么都不做、只买 SPY」的收益。合计收益没有这个零点就没有含义：
  // 组合 +1% 而 SPY +3%，相对收益为负。
  var bm=(S&&S.benchmark)||{},sr=bm.series||[];
  if(sr.length<2)return '';
  var r=(sr[sr.length-1].close/sr[0].close-1)*100;
  var t=' · 同期 '+(bm.code||'SPY').replace('US.','')+' <span class="num '+pctCls(r)+'" title="'+sr[0].d+' 至 '+sr[sr.length-1].d+' 的 SPY 收盘价涨跌，作为「什么都不做」的参照">'+fmtPct(r)+'</span>';
  if(ret!==null&&isFinite(ret)){
    var d=ret-r;
    t+=' <span class="num '+pctCls(d)+'" title="合计收益减去同期 SPY：正 = 机器跑赢了什么都不做">（'+(d>=0?'+':'−')+Math.abs(d).toFixed(1)+'pp vs SPY）</span>';
  }
  return t;
}
function fmtWinRate(wins,closed){
  // Jon 的硬门槛是胜率>50%。样本太小时不上色：1 平 1 亏染红整块面板，
  // 读出来是「这方法不行」，而真相是「还没什么可下结论的」。
  if(!closed)return '<span class="num" title="尚无已平仓记录，胜率不可计算">—</span>';
  var r=wins/closed,txt=(r*100).toFixed(0)+'%（'+wins+'/'+closed+'）';
  var cls=closed>=5?(r>0.5?'up':'down'):'';
  return '<span class="num '+cls+'" title="已平仓中赚钱的比例；打平算输。Jon 的门槛：>50% 才拿去见 PM'+(closed<5?'。样本仍太小（<5 单），先别下结论':'')+'">'+txt+'</span>';
}

/* ── 回测摘要：真实候选池、真实收盘、零模型复算 ──
   置于首屏而非抽屉；详情仍在抽屉。 */
/* 胜率高不等于跑赢。配对检验才是结论判据，紧贴表格放置，
   避免单个胜率数字被读成结论。 */
function pairedVerdictLine(sum){
  var pr=(sum&&sum.paired)||{};
  var names=Object.keys(pr);
  if(!names.length)return '';
  var any=pr[names[0]]||{};
  var n=any.n_pairs||sum.periods||0;
  /* 三态而非两态：「样本量足够但未检出差异」同样是结论，且最易被误报为胜出——
     一个几乎复制对照的臂标准差极小，单周期即达到样本量，但与对照无实质差别。 */
  var won=names.filter(function(k){return pr[k]&&pr[k].conclusive});
  var flat=names.filter(function(k){return pr[k]&&pr[k].powered&&!pr[k].significant});
  if(won.length){
    return '<div class="card-note" style="margin-top:var(--space-3)">'
      +'配对检验：<b>'+won.map(function(k){return esc(backtestArmName(k))}).join('、')
      +'</b> 相对全量基准的差距已达到预注册门槛（样本量与显著性均满足，'
      +fmtInt(n)+' 个周期）。</div>';
  }
  if(flat.length){
    return '<div class="card-note" style="margin-top:var(--space-3)">'
      +'配对检验：<b>无选取策略被判定跑赢全量基准。</b>其中 '
      +flat.map(function(k){return esc(backtestArmName(k))}).join('、')
      +' 的样本量已足以检出预注册的差距，但差距未出现，属于未检出优势而非样本不足；其余各臂样本量仍不足。</div>';
  }
  return '<div class="card-note" style="margin-top:var(--space-3)">'
    +'配对检验：<b>当前无选取策略被判定跑赢全量基准</b>——'
    +'只有 '+fmtInt(n)+' 对配对样本，远低于预注册门槛。'
    +'胜率为该窗口的历史描述，不构成预测，亦不足以支持排名。</div>';
}

function setBacktestStart(value){
  var b=(S&&S.backtest)||{};
  if(!value)return;

  renderDrawers();
  requestAnimationFrame(function(){
    var body=document.querySelector('.drawer:last-of-type .drawer-body');
    var el=body?body.querySelector('#sec-backtest'):$('sec-backtest');
    if(el)el.scrollIntoView({block:'start'});
  });
}
function median(values){
  if(!values.length)return null;
  var sorted=values.slice().sort(function(a,b){return a-b}),mid=Math.floor(sorted.length/2);
  return sorted.length%2?sorted[mid]:(sorted[mid-1]+sorted[mid])/2;
}
function backtestArmMetrics(positions,names,horizonDays){
  var out={};
  names.forEach(function(name){
    var rows=positions.filter(function(p){return p.arm===name});
    var scored=rows.filter(function(p){return p.return_pct!==null&&p.return_pct!==undefined&&!isNaN(p.return_pct)});
    var returns=scored.map(function(p){return Number(p.return_pct)});
    var complete=rows.filter(function(p){
      if(!p.entry_d||!p.exit_d)return false;
      return (new Date(p.exit_d+'T00:00:00Z')-new Date(p.entry_d+'T00:00:00Z'))/86400000>=Number(horizonDays||0);
    }).length;
    out[name]={
      n_chosen:rows.length,n_scored:scored.length,
      coverage:rows.length?scored.length/rows.length:null,
      mean_return_pct:returns.length?returns.reduce(function(a,v){return a+v},0)/returns.length:null,
      median_return_pct:median(returns),
      hit_rate:returns.length?returns.filter(function(v){return v>0}).length/returns.length:null,
      window_complete_frac:rows.length?complete/rows.length:null
    };
  });
  return out;
}
function backtestPairedSummary(p,start,end){
  if(!p)return null;
  var pairs=(p.pairs||[]).filter(function(x){return x.as_of>=start&&x.as_of<=end});
  var diffs=pairs.map(function(x){return Number(x.diff)}).filter(function(v){return !isNaN(v)});
  var ratio=Number(p.n_pairs)>0?Number(p.n_eff)/Number(p.n_pairs):1;
  return {
    conclusive:false,n_pairs:pairs.length,
    n_eff:pairs.length?(pairs.length*(isFinite(ratio)?ratio:1)).toFixed(3):0,
    mean_diff:diffs.length?diffs.reduce(function(a,v){return a+v},0)/diffs.length:null,
    message:pairs.length?'所选窗口内的配对结果。':'所选窗口内暂无配对结果。'
  };
}
function pairedSummary(p){

    +(p.mean_diff==null?'':' · 平均差 <span class="num '+pctCls(p.mean_diff*100)+'">'+fmtPct(p.mean_diff*100)+'</span>')
    +'<div style="margin-top:6px">'+esc(p.message||'')+'</div></div>';
}
function backtestCurveSVG(points){
  if(!points.length)return '<div class="empty-sm">暂无净值点</div>';
  var byArm={},dates={};
  points.forEach(function(p){(byArm[p.arm]=byArm[p.arm]||[]).push(p);dates[p.d]=1});
  var ds=Object.keys(dates).sort(),names=Object.keys(byArm);
  var W=760,H=230,pl=44,pr=125,pt=14,pb=24,mn=Infinity,mx=-Infinity;
  var series=names.map(function(name,i){
    var map={};byArm[name].forEach(function(p){map[p.d]=Number(p.equity)});
    var values=ds.map(function(d){return map[d]===undefined?null:map[d]});
    values.forEach(function(v){if(v!==null){mn=Math.min(mn,v);mx=Math.max(mx,v)}});
    // 只定义了 8 个数据色；真实回测现在有 9 条臂，第 9 条会拿到不存在的
    // 变量而画成透明。循环取用，宁可两条同色也不要一条隐形。
    return {name:name,values:values,color:'var(--color-data-'+(i%8+1)+')'};
  });
  if(!isFinite(mn)||!isFinite(mx))return '<div class="empty-sm">净值点不可用</div>';
  if(mx-mn<0.5){mn-=0.5;mx+=0.5}
  function X(i){return pl+i*(W-pl-pr)/Math.max(1,ds.length-1)}
  function Y(v){return pt+(mx-v)/(mx-mn)*(H-pt-pb)}
  series.forEach(function(s){
    var first=s.values.find(function(v){return v!==null});
    if(first!==undefined&&first!==null&&first!==0){
      s.values=s.values.map(function(v){return v===null?null:v/first*100});
    }
  });
  mn=Infinity;mx=-Infinity;
  series.forEach(function(s){s.values.forEach(function(v){if(v!==null){mn=Math.min(mn,v);mx=Math.max(mx,v)}})});
  if(mx-mn<0.5){mn-=0.5;mx+=0.5}
  var svg='<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block;max-width:800px" role="img" aria-label="所选窗口两臂回测净值曲线">';
  [mx,100,mn].forEach(function(g){
    if(g<mn-0.01||g>mx+0.01)return;
    svg+='<line x1="'+pl+'" y1="'+Y(g)+'" x2="'+(W-pr)+'" y2="'+Y(g)+'" stroke="var(--color-border-subtle)" stroke-width="1"'+(g===100?' stroke-dasharray="4 3"':'')+'/>'
      +'<text x="'+(pl-6)+'" y="'+(Y(g)+4)+'" text-anchor="end" font-family="var(--font-mono)" font-size="11" fill="var(--color-text-tertiary)">'+g.toFixed(1)+'</text>';
  });
  series.forEach(function(s){
    var pts=[];s.values.forEach(function(v,i){if(v!==null)pts.push(X(i).toFixed(1)+','+Y(v).toFixed(1))});
    if(pts.length>=2){
      svg+='<polyline points="'+pts.join(' ')+'" fill="none" stroke="'+s.color+'" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>';
    }
    var li=s.values.length-1;while(li>=0&&s.values[li]===null)li--;
    if(li>=0)svg+='<circle cx="'+X(li)+'" cy="'+Y(s.values[li])+'" r="2.5" fill="'+s.color+'"/>'
      +'<text x="'+(X(li)+8)+'" y="'+(Y(s.values[li])+4)+'" font-family="var(--font-sans)" font-size="11" fill="'+s.color+'">'+esc(backtestArmName(s.name))+' '+s.values[li].toFixed(1)+'</text>';
  });
  svg+='<text x="'+pl+'" y="'+(H-6)+'" font-family="var(--font-mono)" font-size="11" fill="var(--color-text-tertiary)">'+esc(ds[0])+'</text>'
    +'<text x="'+(W-pr)+'" y="'+(H-6)+'" text-anchor="end" font-family="var(--font-mono)" font-size="11" fill="var(--color-text-tertiary)">'+esc(ds[ds.length-1])+'</text></svg>';
  return '<div class="funnel-wrap">'+svg+'</div>';
}

function poolMatch(c){
  if(!poolFilter)return true;

  if(t==='topic')return c.topic_id===v;
  if(t==='code')return c.instrument_id===v||c.instrument_id===bareCode(v);
  if(t==='method')return (c.proposed_by||[]).some(function(m){return m===v||methodName(m)===methodName(v)});
  if(t==='mt')return c.topic_id===v.topic&&(c.proposed_by||[]).some(function(m){return m===v.method||methodName(m)===methodName(v.method)});
  if(t==='conv'){var n=c.n_methods!=null?c.n_methods:(function(){var uq={};(c.proposed_by||[]).forEach(function(m){uq[m]=1});return Object.keys(uq).length})();return String(n)===String(v)}

    var s=(((S||{}).weekly||{}).selectors||[]).find(function(x){return x.name===v});
    if(!s)return false;

function ensureJournal(runId){
  var key=runId||'latest';
  if(JCache[key])return JCache[key];
  if(J&&J.journal&&(key==='latest'||J.run_id===runId)){
    JCache[key]={j:J.journal};return JCache[key];
  }
  if(!JLoading[key]){
    JLoading[key]=true;
    fetch('/api/journal'+(runId?'?run_id='+encodeURIComponent(runId):''),{cache:'no-store'})
      .then(function(r){return r.json().then(function(b){return {ok:r.ok,b:b}})})
      .then(function(res){
        if(res.b&&res.b.journal)JCache[key]={j:res.b.journal};
        else JCache[key]={j:null,err:(res.b&&res.b.error)||('HTTP '+(res.ok?'格式不对':'错误'))};
      })
      .catch(function(e){JCache[key]={j:null,err:e&&e.message?e.message:String(e)}})
      .then(function(){JLoading[key]=false;renderDrawers()});
  }
  return null;
}
function rlTime(iso){
  if(!iso)return '—';
  var d=new Date(iso);if(isNaN(d))return esc(iso);
  var hm=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Hong_Kong',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(d);
  var ms=String(d.getMilliseconds()).padStart(3,'0');
  return hm+'.'+ms;
}
function rlBytes(b){
  b=Number(b);if(isNaN(b))return '';
  if(b>=1048576)return (b/1048576).toFixed(1)+' MB';
  if(b>=1024)return (b/1024).toFixed(1)+' KB';
  return b+' B';
}
function rlKvHTML(st){
  var step=st.step||'';
  function kv(k,v){return '<b>'+k+'</b> '+v}
  var parts=[];
  if(step==='universe'){
    parts.push(kv('合格标的',fmtInt(st.eligible)));parts.push(kv('排除',fmtInt(st.excluded)));
    if(st.shelf_dating)parts.push(kv('货架',fmtInt(st.shelf_dating.total)));
  }else if(step.indexOf('feed:')===0){
    parts.push(kv('来源',esc(step.slice(5))));
    if(st.kind)parts.push(kv('类型',esc(st.kind)));
    parts.push(st.ok?'ok':'<span class="rl-err">失败'+(st.error?'：'+esc(st.error):'')+'</span>');
  }else if(step==='theme_discovery'){
    parts.push(kv('主题覆盖',esc(numOr(st.coverage_pct))+'%'));parts.push(kv('未匹配语料',fmtInt(st.unmatched)));parts.push(kv('新主题候选',fmtInt(st.candidates)));
  }else if(step==='inputs'){
    parts.push(kv('语料',fmtInt(st.corpus)));parts.push(kv('日历',fmtInt(st.calendar)));parts.push(kv('价格行',fmtInt(st.prices)));
    if(st.sha)parts.push(kv('输入指纹',esc(st.sha)));
  }else if(step==='topics'){
    parts.push(kv('策略',esc(st.strategy||'')+(st.version?' v'+esc(st.version):'')));
    if(st.chosen)parts.push(kv('选中',st.chosen.map(esc).join(' ')));
    if(st.calls!==undefined)parts.push(kv('模型调用',fmtInt(st.calls)));
  }else if(step==='generators'){
    var pr=st.produced||{};
    parts.push(kv('共写出',fmtInt(st.pool)+' 条'));
    parts.push(Object.keys(pr).map(function(k){return esc(methodName(k))+' '+fmtInt(pr[k])}).join(' · '));
    var ge=st.errors||{};
    Object.keys(ge).forEach(function(k){parts.push('<span class="rl-err">'+esc(methodName(k))+'：'+esc(ge[k])+'</span>')});
  }else if(step==='pool'){
    parts.push(kv('原始想法',fmtInt(st.raw)));parts.push(kv('合并后',fmtInt(st.merged)+' 条（一标一条）'));
    var cv=st.convergence||{};
    var cvs=Object.keys(cv).sort().reverse().map(function(k){return esc(k)+'×'+fmtInt(cv[k])}).join(' ');
    if(cvs)parts.push(kv('共识分布',cvs));
  }else if(step==='selectors'){
    parts.push(kv('同池候选',fmtInt(st.pool)));
    var ch=st.chosen||{};
    parts.push(Object.keys(ch).map(function(k){return esc(selMetaOf(k)[1])+' '+fmtInt(ch[k])}).join(' · '));
    var se=st.errors||{};
    Object.keys(se).forEach(function(k){parts.push('<span class="rl-err">'+esc(selMetaOf(k)[1])+'：'+esc(se[k])+'</span>')});
    if(st.inputs_sha)parts.push(kv('输入指纹',esc(st.inputs_sha)));
  }else{
    Object.keys(st).forEach(function(k){
      if(k==='step'||k==='at'||k==='n')return;
      var v=st[k];
      if(v===null||typeof v==='object')return;
      parts.push(kv(esc(k),esc(String(v))));
    });
  }
  return parts.join('　');
}
/* ══════════ 运行日志摘要视图 ══════════
 * 同一份 journal，两种读法。工程视图是原始步骤 + 键值，给要核对的人；
 * 摘要视图把每一步写成一句完整的话：动作、产出、作用。
 * 数字全部来自同一个 journal 字段，没有一个是叙述时补出来的：
 * 摘要视图仅措辞不同，与工程视图同源。 */
function rlPlainStep(st,idx){
  var step=st.step||'';
  var T={};
  if(step==='universe'){
    T.t='可交易货架：本期可买入标的范围';
    T.d='货架共 '+fmtInt((st.shelf_dating||{}).total)+' 个标的，本期合格 '+fmtInt(st.eligible)
      +' 个，排除 '+fmtInt(st.excluded)+' 个。';
    T.w='合格集合构成后续所有候选的取值范围：不在货架上的标的，无法出现在任何一条候选里。';
  }else if(step.indexOf('feed:')===0){
    var src=step.slice(5);
    T.t='数据接入：'+src;
    T.d=st.ok?('该来源已取得'+(st.kind?'（'+st.kind+'）':'')+'。')
             :('该来源取数失败'+(st.error?'：'+st.error:'')+'。');
    T.w=st.ok?'':'该来源缺失，本期判断所依据的材料相应减少。';
    T.bad=!st.ok;
  }else if(step==='theme_discovery'){
    T.t='主题发现：检查现有主题表是否覆盖本期语料';
    T.d='本期语料 '+numOr(st.coverage_pct)+'% 可归入已登记主题；未匹配 '
      +fmtInt(st.unmatched)+' 篇，其中达标的新主题候选 '+fmtInt(st.candidates)+' 个。';
    T.w='用于防止主题表滞后于宏观环境变化。达标的新主题自动登记，登记记录 append-only，不可回填。';
  }else if(step==='inputs'){
    T.t='输入封存：固定本期可用材料';
    T.d='封存研报 '+fmtInt(st.corpus)+' 篇、宏观日历 '+fmtInt(st.calendar)+' 条'
      +(st.sha?'，输入指纹 '+st.sha:'')+'。';
    T.w='封存后所有判断只能取用这一份材料。事后追问决策依据时，模型读到的仍是这一份，因此回答无法在事后重构。';
  }else if(step==='topics'){
    T.t='筛选A 选主题：确定本期宏观主题';
    T.d='按 '+esc(st.strategy||'')+(st.version?' v'+esc(st.version):'')+' 打分，入选 '
      +((st.chosen||[]).length||0)+' 个：'+((st.chosen||[]).join('、')||'—')+'。'
      +(st.calls!==undefined?'（本步模型调用 '+fmtInt(st.calls)+' 次'+(st.calls===0?'，为纯规则打分，无模型参与':'')+'）':'');
    T.w='落选主题不进入筛选B，本期不会有任何候选出自这些主题。'
  }else if(step==='generators'){
    var pr=st.produced||{};
    var ks=Object.keys(pr);
    T.t='筛选B 生成候选：4 种方法并行，彼此不可见';
    T.d='共生成 '+fmtInt(st.pool)+' 条：'
      +ks.map(function(k){return methodName(k)+' '+fmtInt(pr[k])+' 条'}).join('、')+'。';
    T.w='四种生成方法相互隔离，多方法指向同一标的方可视为跨方法信号。';
    var ge=st.errors||{};
    if(Object.keys(ge).length){T.bad=true;T.d+=' 其中 '+Object.keys(ge).map(function(k){return methodName(k)+' 执行失败'}).join('、')+'。';}
  }else if(step==='pool'){
    var cv=st.convergence||{};
    /* 共识分布的键是「4种方式」这样的中文串，不是数字键 */
    var four=0;Object.keys(cv).forEach(function(k){if(/^\s*4/.test(k))four=cv[k]||0});
    T.t='合并候选池：同一标的归并为一条';
    T.d=fmtInt(st.raw)+' 条原始候选归并为 '+fmtInt(st.merged)+' 条'
      +(four?'，其中 '+fmtInt(four)+' 条为 4 种生成方法共同指向的标的':'')+'。';
    T.w='合并后各选取策略面对同一候选池，策略间差异仅来自选取规则本身。';
  }else if(step==='selectors'){
    var ch=st.chosen||{};
    var ks2=Object.keys(ch);
    T.t='选取持仓：各策略自同一候选池独立选取';
    T.d='候选池 '+fmtInt(st.pool)+' 条，'
      +ks2.map(function(k){return selMetaOf(k)[1]+' 选中 '+fmtInt(ch[k])+' 条'}).join('、')+'。';
    T.w='同池、同期、同风控规则，唯一变量为选取策略，是后续配对比较成立的前提。';
    var se=st.errors||{};
    if(Object.keys(se).length){T.bad=true;T.d+=' 其中 '+Object.keys(se).map(function(k){return selMetaOf(k)[1]+' 执行失败'}).join('、')+'。';}
  }else{
    T.t=rlStepName(step);
    T.d=rlKvHTML(st).replace(/<[^>]+>/g,' ');
    T.w='';
  }
  return T;
}
/* 流水线的叙述顺序。写想法和合并候选池是同一毫秒落盘的，按时间戳排会读成
 * 「先合并再写」——时间没错，但顺序读起来是假的。同秒内改按管线顺序排，
 * 相隔超过 2 秒的仍以真实时钟为准。 */
var RL_ORDER={'universe':1,'theme_discovery':3,'inputs':4,'topics':5,'generators':6,'pool':7,'selectors':8};
function rlRank(st){
  var k=String(st.step||'');
  if(k.indexOf('feed:')===0)return 2;
  return RL_ORDER[k]!==undefined?RL_ORDER[k]:9;
}
function rlPlainHTML(j){
  var steps=(j.steps||[]).slice();
  if(!steps.length)return '<div class="rl-empty">这条运行没有留下步骤记录。</div>';
  steps.sort(function(a,b){
    var ta=a.at?new Date(a.at).getTime():0,tb=b.at?new Date(b.at).getTime():0;
    if(Math.abs(ta-tb)>2000)return ta-tb;
    return rlRank(a)-rlRank(b);
  });
  /* 同一来源的多条 feed 合成一句，否则「取数据」会连着刷四行 */
  var merged=[],feeds=[];
  steps.forEach(function(st){
    if(String(st.step||'').indexOf('feed:')===0){feeds.push(st);return}
    if(feeds.length){merged.push({_feeds:feeds});feeds=[]}
    merged.push(st);
  });
  if(feeds.length)merged.push({_feeds:feeds});
  var t0=j.started_at?new Date(j.started_at).getTime():null;
  var n=0;
  var body=merged.map(function(st){
    var T,at;
    if(st._feeds){
      var fs=st._feeds,okN=fs.filter(function(f){return f.ok}).length;
      at=fs[0].at;
      T={t:'数据接入：'+fs.length+' 路来源',
         d:fs.map(function(f){return (f.step||'').slice(5)+(f.ok?' 正常':' 失败')}).join('、')+'。',
         w:okN<fs.length?'存在取数失败的来源，本期可用材料低于正常水平。':'四路来源均已接入：研报语料、宏观日历、可交易标的清单。',
         bad:okN<fs.length};
    }else{T=rlPlainStep(st);at=st.at}
    n++;
    var dt=(t0!==null&&at)?((new Date(at).getTime()-t0)/1000):null;
    return '<div class="rlp-item'+(T.bad?' bad':'')+'">'
      +'<div class="rlp-n">'+n+'</div>'
      +'<div class="rlp-main">'
      +'<div class="rlp-t">'+esc(T.t)+'</div>'
      +'<div class="rlp-d">'+esc(T.d)+'</div>'
      +(T.w?'<div class="rlp-w">'+esc(T.w)+'</div>':'')
      +'</div>'
      +'<div class="rlp-time">'+rlTime(at)+(dt!==null?'<span>+'+dt.toFixed(0)+'s</span>':'')+'</div>'
      +'</div>';
  }).join('');
  return '<div class="rlp">'+body+'</div>';
}

/* ── 2 · 筛选A：主题评分（focus = 主题 id：该行高亮+证据就地展开，其余压暗） ── */
/* 落选理由——用当时打分本身算出来的，不是事后编的说法。
 * 把落选主题的四个加权贡献，与入选主题在同一因子上的平均贡献相减，
 * 差得最多的那一项就是它的短板；再报出与入选线的分差。
 * 「差 0.1 分」只说明结果，「短板在 G 分歧」才说明原因。 */
function topicLossReason(r,avgComps,cutScore){
  var SEGL2=['H 热度','G 分歧','E 实据','P 已定价'];
  var comps=[0.30*(r.H||0),0.25*(r.G||0),0.25*(r.E||0),0.20*(100-(r.P||0))];
  var worst=0,worstGap=comps[0]-avgComps[0];
  for(var i=1;i<4;i++){var g=comps[i]-avgComps[i];if(g<worstGap){worstGap=g;worst=i}}
  var gap=(cutScore!==null&&r.score!==undefined)?(cutScore-(r.score||0)):null;
  var vals=[r.H,r.G,r.E,r.P];
  var txt='';
  /* 分差已经写在行末，这里只说原因：短在哪个因子、短多少 */
  if(worstGap<-0.2){
    txt='主要失分项 <b>'+SEGL2[worst]+'</b>（本主题 '+numOr(vals[worst])
      +(worst===3?'，该项反向计分，数值越低越好':'')+'，低于入选主题均值 '+Math.abs(worstGap).toFixed(1)+' 分）';
  }else{
    txt='四项因子均无明显缺口，综合分低于入选名额内主题';
  }
  if(gap!==null&&gap<=1.0)txt+=' · 距入选线 '+gap.toFixed(1)+' 分';
  return txt;
}

function stageTopicsBody(d){
  var foc=(d&&d.f)?String(d.f):null;
  var w=S.weekly||{};
  var hgep=topicArm('hgep'),ctrl=topicArmNot('hgep');
  var chosenSet={};topicChosen('hgep').forEach(function(t){chosenSet[t]=1});
  var ctrlChosen={};(ctrl?(ctrl.chosen||[]):[]).forEach(function(t){ctrlChosen[t]=1});
  if(!(hgep&&hgep.scores&&Object.keys(hgep.scores).length)){
    return '<div class="empty-sm">本期评分尚未产出'+(w.in_flight?'，进行中，稍后自动刷新':'')+'</div>';
  }
  var rows=Object.keys(hgep.scores).map(function(k){var o=hgep.scores[k];o._id=k;return o});
  rows.sort(function(a,b){return (b.score||0)-(a.score||0)});
  var maxScore=Math.max.apply(null,rows.map(function(r){return r.score||0}).concat([1]));
  var cutScore=null,cutIdx=-1;
  rows.forEach(function(r,i){if(chosenSet[r._id]){cutIdx=i;if(cutScore===null||((r.score||0)<cutScore))cutScore=r.score||0}});
  var cScores=(ctrl&&ctrl.scores)||{};
  var cRank={},cMax=1;
  Object.keys(cScores).sort(function(a,b){return ((cScores[b]||{}).score||0)-((cScores[a]||{}).score||0)})
    .forEach(function(k,i){cRank[k]=i+1;cMax=Math.max(cMax,(cScores[k]||{}).score||0)});
  /* 入选主题在每个因子上的平均加权贡献——落选理由的参照系 */
  var inRows=rows.filter(function(r){return chosenSet[r._id]});
  var avgComps=[0,0,0,0];
  if(inRows.length){
    inRows.forEach(function(r){
      avgComps[0]+=0.30*(r.H||0);avgComps[1]+=0.25*(r.G||0);
      avgComps[2]+=0.25*(r.E||0);avgComps[3]+=0.20*(100-(r.P||0));
    });
    avgComps=avgComps.map(function(v){return v/inRows.length});
  }
  var SEGC=['var(--color-data-1)','var(--color-data-2)','var(--color-data-3)','var(--color-data-4)'];
  var SEGL=['H 热度','G 分歧','E 实据','P 已定价'];
  var SEGW=[0.30,0.25,0.25,0.20];
  var SEGG=[HGEP_GLOSS.H,HGEP_GLOSS.G,HGEP_GLOSS.E,HGEP_GLOSS.P];
  var tabs='';
  if(foc){
    tabs='<div class="ftabs"><button type="button" class="ftab" onclick="setDrawerFocus(null)">全景</button>'
      +topicChosen('hgep').map(function(t){
        return '<button type="button" class="ftab'+(t===foc?' on':'')+'" onclick="setDrawerFocus(\''+jss(t)+'\')">'+esc(t)+'</button>';
      }).join('')+'</div>';
  }
  var dotLegend='<div class="card-note" style="margin-bottom:var(--space-2)">圈内数字 = 计数对照臂对同一主题的排名 <span class="gloss" title="'+esc(COUNT_GLOSS)+'">ⓘ</span>；绿圈 = 计数臂亦选入前 5，灰圈 = 未选入</div>';
  var agree0=topicChosen('hgep').filter(function(t){return ctrlChosen[t]});
  var hOnly0=topicChosen('hgep').filter(function(t){return !ctrlChosen[t]});
  var cOnly0=(ctrl?(ctrl.chosen||[]):[]).filter(function(t){return !chosenSet[t]});
  var disLine=ctrl?'<div class="card-note" style="margin-bottom:var(--space-3)">两臂重合 '+agree0.length+'/'+topicChosen('hgep').length+'：双选 '+(agree0.map(esc).join('·')||'—')
    +'；仅语义臂 '+(hOnly0.map(esc).join('·')||'—')+'；仅计数臂 '+(cOnly0.map(esc).join('·')||'—')+'</div>':'';
  var inHTML='',outHTML='';
  rows.forEach(function(r,ri){
    var rowHTML='';
    var isIn=!!chosenSet[r._id];
    var focCls=foc?(r._id===foc?' foc':' dim'):'';
    var barPct=Math.max(2,(r.score||0)/maxScore*100);
    /* P 是「已定价」，越低越好——计分用 (100 − P)，与后端 WEIGHTS 同口径 */
    var comps=[0.30*(r.H||0),0.25*(r.G||0),0.25*(r.E||0),0.20*(100-(r.P||0))];
    var wsum=comps.reduce(function(a,b){return a+b},0);

    if(wsum>0){

      }).join('');

    }
    rowHTML+='<button type="button" class="race-row'+(isIn?'':' lost')+focCls+'" id="topicrow-'+esc(r._id)+'" onclick="'+(foc===r._id?'setDrawerFocus(null)':'setDrawerFocus(\''+jss(r._id)+'\')')+'" title="'+(foc===r._id?'取消聚焦':'聚焦该主题并展开证据')+'">'
      +'<span class="race-name"><span class="id">'+esc(r._id)+'</span><span class="lbl">'+esc(r.label||'')+'</span></span>'
      +'<span class="race-track"><span class="race-bar" style="width:'+barPct.toFixed(1)+'%">'+segs+'</span>'+cnt+'</span>'
      +'<span class="race-side">'+side+'</span>'
      +'</button>';
    if(!isIn){
      rowHTML+='<div class="race-why"><span class="w">'+topicLossReason(r,avgComps,cutScore)+'</span></div>';
    }
    if(foc===r._id){
      rowHTML+='<div class="race-detail" style="margin-top:6px">'+topicDrawerBody(r._id)+'</div>';
    }
    if(isIn)inHTML+=rowHTML; else outHTML+=rowHTML;
  });
  var nIn=topicChosen('hgep').length,nOut=rows.length-nIn;
  /* 整步追问的入口放在这一层最上面：读者看完这张表最先冒出来的问题是
   * 「凭什么是这几个」，而不是某一个主题的细节。整步追问交给模型的是
   * 完整打分表 + 计数对照臂，不附研报正文——这一步的取舍就是在表上做的。 */
  var askStep='<div style="margin:0 0 var(--space-3)">'
    +'<button type="button" class="exp-btn" onclick="openAskDrawer(\'selection\',\'topics\')" '
    +'title="把本期全部主题的打分表与计数对照臂交给模型，仅依据这两份当期封存材料作答">'
    +'问它当时凭什么选这 '+nIn+' 个 ›</button></div>';
  var html=tabs+askStep+dotLegend+disLine
    +'<div class="race-sec"><div class="race-sec-h"><span class="t">入选 · '+nIn+'</span><span class="s">进入筛选B，各生成方法据此写想法</span></div>'
    +'<div class="race">'+inHTML+'</div></div>'
    +(nOut?('<div class="race-sec lost"><div class="race-sec-h"><span class="t">落选 · '+nOut+'</span><span class="s">按综合分排序，每条标注落选理由与分差</span></div>'
      +'<div class="race">'+outHTML+'</div></div>'):'');
  var agree=topicChosen('hgep').filter(function(t){return ctrlChosen[t]});
  var hOnly=topicChosen('hgep').filter(function(t){return !ctrlChosen[t]});
  var cOnly=(ctrl?(ctrl.chosen||[]):[]).filter(function(t){return !chosenSet[t]});
  var cmp='';
  if(ctrl){
    cmp='<div style="margin-top:var(--space-4);font:400 13px/19px var(--font-sans);color:var(--color-text-secondary)">'
      +'两臂本期重叠 <b class="num">'+agree.length+'</b> 个'
      +(hOnly.length?'；仅语义臂选入 '+hOnly.map(function(t){return '<span class="tag">'+esc(t)+'</span>'}).join(' '):'')
      +(cOnly.length?'；仅计数臂选入 '+cOnly.map(function(t){return '<span class="tag">'+esc(t)+'</span>'}).join(' '):'')
      +'。</div>';
  }
  var legend='<div class="race-legend">'
    +'<span><span class="sw" style="background:var(--color-data-1)"></span>H 热度 <span class="gloss" title="'+esc(HGEP_GLOSS.H)+'">ⓘ</span></span>'
    +'<span><span class="sw" style="background:var(--color-data-2)"></span>G 分歧 <span class="gloss" title="'+esc(HGEP_GLOSS.G)+'">ⓘ</span></span>'
    +'<span><span class="sw" style="background:var(--color-data-3)"></span>E 实据 <span class="gloss" title="'+esc(HGEP_GLOSS.E)+'">ⓘ</span></span>'
    +'<span><span class="sw" style="background:var(--color-data-4)"></span>P 已定价 <span class="gloss" title="'+esc(HGEP_GLOSS.P)+'">ⓘ</span></span>'
    +'<span><span class="sw" style="background:var(--color-data-1);opacity:.34"></span>落选</span>'
    +'<span><span class="race-cnt" style="position:static;transform:none;display:inline-flex;margin-right:5px">2</span>计数对照臂排名 <span class="gloss" title="'+esc(COUNT_GLOSS)+'">ⓘ</span></span>'
    +'</div>';
  if(foc&&d&&!d.scrolled){drawerScrollSel='#topicrow-'+foc;d.scrolled=true}
  return html+legend+cmp
    +epi('语义打分相对计数打分的增量尚未验证，对照臂每周并行记录；条内色块为四项因子对综合分的贡献');
}

/* ── 主题证据抽屉（第 2/3 层） ── */
function topicDrawerBody(tid){
  var w=S.weekly||{};
  var hgep=topicArm('hgep'),ctrl=topicArmNot('hgep');
  var r=((hgep&&hgep.scores)||{})[tid];
  var ev=((w.evidence)||{})[tid];
  var chosen=topicChosen('hgep').indexOf(tid)>=0;
  var ctrlChosen=(ctrl?(ctrl.chosen||[]):[]).indexOf(tid)>=0;
  var html='';
  if(r){
    var wsum=0.30*(r.H||0)+0.25*(r.G||0)+0.25*(r.E||0)+0.20*(100-(r.P||0)); /* P 已定价，反向计分 */
    html+='<div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:var(--space-2)">'
      +'<span style="font:600 20px/28px var(--font-sans);color:var(--color-text-primary)">'+esc(r.label||tid)+'</span>'
      +(chosen?badge('success','入选'):badge('neutral','落选'))
      +(ctrl?'<span class="card-note">计数臂：'+(ctrlChosen?'选入':'未选入')+'</span>':'')
      +'</div>';
    /* 落选主题：打开它第一眼就该看到「为什么没选它」，而不是自己去比分数 */
    if(!chosen){
      var allSc=(hgep&&hgep.scores)||{};
      var inIds=topicChosen('hgep');
      var aC=[0,0,0,0],cut=null;
      inIds.forEach(function(t){
        var o=allSc[t]||{};
        aC[0]+=0.30*(o.H||0);aC[1]+=0.25*(o.G||0);aC[2]+=0.25*(o.E||0);aC[3]+=0.20*(100-(o.P||0));
        if(o.score!==undefined&&(cut===null||o.score<cut))cut=o.score;
      });
      if(inIds.length)aC=aC.map(function(v){return v/inIds.length});
      html+='<div class="rej-why">落选依据：'+topicLossReason(r,aC,cut)
        +'。落选主题不进入筛选B，本期无任何候选出自该主题。</div>';
    }
    html+='<div class="derive-formula num" title="'+esc(HGEP_GLOSS.H+'；'+HGEP_GLOSS.G+'；'+HGEP_GLOSS.E+'；'+HGEP_GLOSS.P)+'">综合分 '+numOr(r.score)+' ≈ 0.30×H热度('+numOr(r.H)+') + 0.25×G分歧('+numOr(r.G)+') + 0.25×E实据('+numOr(r.E)+') + 0.20×(100−P已定价('+numOr(r.P)+')) = '+wsum.toFixed(1)+' <span class="gloss" title="'+esc(HGEP_GLOSS.H+'。'+HGEP_GLOSS.G+'。'+HGEP_GLOSS.E+'。'+HGEP_GLOSS.P)+'">ⓘ</span></div>'
      +'<div class="derive-kv">'
      +'<span>打分用证据：'+fmtInt(r.n_evidence)+' 条 · '+fmtInt(r.n_institutions)+' 家机构</span>'
      +'<span>P 来源：'+esc(r.p_source||'—')+(r.p_source==='neutral_default'?'（中性默认 50，不代表判断）':'')+'</span>'
      +'<span>指示标的：'+esc(r.indicator||'—')+'</span>'
      +'</div>';
    var nIdeas=poolCountBy('topic',tid);
    html+='<div class="derive-kv">'
      +(nIdeas>0?'<span><button type="button" class="exp-btn" onclick="filterPool(\'topic\',\''+jss(tid)+'\',\'主题 '+esc(tid)+'\')">该主题产出的 '+fmtInt(nIdeas)+' 条候选 ›</button></span>':'<span style="color:var(--color-text-tertiary)">'+(chosen?'想法还没产出':'落选主题不进入筛选B')+'</span>')
      +'</div>';
    html+='<div style="margin:var(--space-2) 0 var(--space-4);font:400 12px/17px var(--font-sans);color:var(--color-text-tertiary)">四项因子权重（0.30/0.25/0.25/0.20）取自先验，逐因子归因约需 7 个月样本；H 与后续收益同向这一假设尚未验证。</div>';
  }else{
    html+='<div class="empty-sm" style="margin-bottom:var(--space-4)">语义臂本期无 '+esc(tid)+' 的评分记录</div>';
  }
  html+='<div style="margin:0 0 var(--space-4)"><button type="button" class="exp-btn" onclick="openAskDrawer(\'topic\',\''+jss(tid)+'\')" title="仅依据本次运行封存的材料作答">问它当时怎么想 ›</button></div>';
  if(ev){
    var docs=ev.docs||[];
    html+='<div style="font:600 14px/20px var(--font-sans);color:var(--color-text-primary);margin-bottom:4px">词表命中研报 · '+fmtInt(ev.n)+' 条</div>'
      +'<div style="font:400 12px/16px var(--font-sans);color:var(--color-text-tertiary);margin-bottom:6px">口径：'+esc(ev.matched_on||'标题关键词')+'——和打分内部的证据计数不是同一套口径，两个数都摆出来；点任意一篇看摘要、凭据和全文</div>'
      +'<div class="ev-list scroll-thin">'+docs.map(function(dd,di){return docRowHTML(dd,'td-'+esc(tid)+'-'+di)}).join('')+'</div>'
      +(ev.truncated?'<div style="font:400 12px/16px var(--font-sans);color:var(--color-text-tertiary);margin-top:6px">另有 '+fmtInt(ev.truncated)+' 条未显示</div>':'');
  }else{
    html+='<div class="empty-sm">这个主题没有词表命中的研报清单'+(r?'（打分依据的证据计数见上）':'')+'</div>';
  }
  return html;
}

/* ── 3 · 筛选B：生产网格（focus = 方法：焦点头 + 独有标的 + 重合率，其余行压暗） ── */
function stageGeneratorsBody(d){
  var w=S.weekly||{};
  var gens=w.generators||[];
  var chosen=topicChosen('hgep');
  var cands=((w.pool)||{}).candidates||[];
  if(!(gens.length&&chosen.length)){
    return '<div class="empty-sm">想法尚未产出'+(w.in_flight?'，筛选A 完成后 4 种方法并行生成':'')+'</div>';
  }
  /* 归一 focus 到 GEN_ORDER 的 key */
  var focKey=null;
  if(d&&d.f){
    var fo=GEN_ORDER.find(function(o){return o[0]===d.f||methodName(o[0])===methodName(d.f)});
    if(fo)focKey=fo[0];
  }
  var tabs='<div class="ftabs"><button type="button" class="ftab'+(!focKey?' on':'')+'" onclick="setDrawerFocus(null)">全景</button>'
    +GEN_ORDER.map(function(o){
      return '<button type="button" class="ftab'+(focKey===o[0]?' on':'')+'" onclick="setDrawerFocus(\''+o[0]+'\')">'+esc(o[1])+'</button>';
    }).join('')+'</div>';
  /* 焦点头：它是谁 · 产出 · 独有标的（方法间最真实的 diff）· 重合率 */
  var focusHead='';
  if(focKey){
    var fo2=GEN_ORDER.find(function(o){return o[0]===focKey});
    var fg=genByKey(focKey);
    var mine=cands.filter(function(c){return (c.proposed_by||[]).indexOf(focKey)>=0});
    var uniq=mine.filter(function(c){
      var st={};(c.proposed_by||[]).forEach(function(m){st[m]=1});
      return Object.keys(st).length===1;
    });
    var overlap=mine.length-uniq.length;
    var pct=mine.length?Math.round(overlap/mine.length*100):0;
    focusHead='<div class="focus-head">'
      +'<b>'+esc(fo2[1])+'</b><span class="tag tag-brand" style="margin-left:6px">'+esc(fo2[2])+'</span>'
      +'<span style="margin-left:6px">'+pathTag(GEN_PATH[focKey])+'</span>'
      +'<div style="margin-top:4px">'+esc(fo2[3])+'</div>'
      +'<div style="margin-top:4px;color:var(--color-text-metadata)">例：'+esc(fo2[4])+'</div>'
      +'<div style="margin-top:6px">'
      +(fg?'本期产出 <b class="num">'+fmtInt(fg.n)+'</b> 条 · 被拒 <b class="num">'+fmtInt(fg.rejected||0)+'</b> 条 · 合并后在池 <b class="num">'+fmtInt(mine.length)+'</b> 条。':'本期没有它的产出记录。')
      +'</div>'
      +'<div style="margin-top:6px"><b>独有标的 '+fmtInt(uniq.length)+' 个</b>（仅该方法提出）：'
      +(uniq.length?'<span style="display:inline-flex;flex-wrap:wrap;gap:4px;vertical-align:middle;margin-left:4px">'
        +uniq.map(function(c){return '<button type="button" class="tag tag-brand mono" style="cursor:pointer" title="'+esc(c.instrument_name||'')+' · '+esc(c.topic_id||'')+' — 在候选池里看这条" onclick="filterPoolCode(\''+jss(c.instrument_id)+'\')">'+esc(c.instrument_id)+' ›</button>'}).join('')
        +'</span>':'<span style="color:var(--color-text-tertiary)">本期无独有标的</span>')
      +'</div>'
      +'<div style="margin-top:4px;color:var(--color-text-metadata)">与其他方法重合 '+fmtInt(overlap)+' / '+fmtInt(mine.length)+' 条（'+pct+'%）；各方法读取同一批研报，重合不构成独立证据</div>'
      +'</div>';
  }
  var perMax=1,target=null;
  GEN_ORDER.forEach(function(o){
    var g=genByKey(o[0]);if(!g)return;
    var per=(g.meta||{}).per_topic||{};
    chosen.forEach(function(t){perMax=Math.max(perMax,per[t]||0)});
    if((g.meta||{}).target_per_topic)target=g.meta.target_per_topic;
  });
  var cols='150px '+chosen.map(function(){return 'minmax(56px,1fr)'}).join(' ')+' 130px';
  var html='<div class="pgrid-wrap scroll-thin"><div class="pgrid" style="grid-template-columns:'+cols+'">';
  html+='<div class="pg-h" style="justify-content:flex-start;align-items:flex-end;text-align:left">方法 ＼ 主题</div>';
  chosen.forEach(function(t){html+='<div class="pg-h" title="'+esc(topicLabel(t))+'">'+esc(t)+'</div>'});
  html+='<div class="pg-h" style="justify-content:flex-end;text-align:right">合计</div>';
  GEN_ORDER.forEach(function(o){
    var g=genByKey(o[0]);
    var isFoc=focKey===o[0];
    var dimS=(focKey&&!isFoc)?';opacity:.35':'';
    html+='<div class="pg-m'+(isFoc?' foc':'')+'" style="padding:2px 6px'+dimS+'"><span class="t">'+esc(o[1])+' <span class="gloss" title="'+esc(genGlossTitle(o))+'">ⓘ</span></span><span class="s" title="'+esc(genGlossTitle(o))+'">'+esc(o[2])+'</span></div>';
    if(g){
      var per=(g.meta||{}).per_topic||{};
      chosen.forEach(function(t){
        var n=per[t]||0;
        if(n){
          var a=(0.08+0.55*n/perMax).toFixed(2);
          html+='<button type="button" class="pg-cell" style="background:rgba(47,131,85,'+a+')'+dimS+'" title="'+esc(o[1])+' × '+esc(t)+'：写出 '+n+' 条'+(target?'（目标 '+target+' 条/主题）':'')+' — 点击在候选池抽屉查看合并后的这批" onclick="filterPoolMT(\''+jss(g.method)+'\',\''+jss(t)+'\')">'+n+'<span class="u">条</span></button>';
        }else{
          html+='<div class="pg-cell empty" style="min-height:52px'+dimS+'" title="'+esc(o[1])+' × '+esc(t)+'：0 条">0</div>';
        }
      });
      var warn=[];
      var meta=g.meta||{};
      if(meta.truncated&&Object.keys(meta.truncated).length)warn.push('有截断');
      var noc=meta.topics_without_corpus_match;
      if(noc&&noc.length)warn.push('缺研报:'+noc.join('/'));
      html+='<div class="pg-tail" style="'+(dimS?dimS.slice(1):'')+'"><span>产出 <b>'+fmtInt(g.n)+'</b>'+(target?' / 目标 '+fmtInt(target*chosen.length):'')+'</span>'
        +'<span>被拒 <b>'+fmtInt(g.rejected||0)+'</b> 条'+(warn.length?' · <span style="color:var(--color-feedback-warning-text)">'+esc(warn.join(' '))+'</span>':'')+'</span></div>';
    }else{
      chosen.forEach(function(){html+='<div class="pg-cell empty" style="'+(dimS?dimS.slice(1):'')+'">—</div>'});
      html+='<div class="pg-tail"><span style="color:var(--color-text-tertiary)">'+(w.in_flight?'正在写':'无产出')+'</span></div>';
    }
  });
  html+='</div></div>';
  var total=gens.reduce(function(a,g){return a+(g.n||0)},0);
  return tabs+focusHead
    +pathLegend(GEN_PATH,GEN_ORDER.map(function(o){return o[0]}))
    +'<div class="quiet" style="margin-bottom:var(--space-3)">4 种方法对同一批 '+chosen.length+' 个主题并行生成 1 个月期限的结构化想法（含概率、上下行情景与论点），彼此独立。色深对应产量。本期合计 <b class="num" style="color:var(--color-text-primary)">'+fmtInt(total)+'</b> 条。</div>'
    +html
    +epi('目标为每方法每主题 '+(target||20)+' 条；未写满不补足，缺口本身为观测量');
}

/* ── 4 · 合并候选池 ── */
function stagePoolBody(d){
  var focTier=(d&&d.f)?String(d.f):null;
  var w=S.weekly||{};
  var pool=w.pool||{},cands=pool.candidates||[];
  var gens=w.generators||[];
  var raw=gens.reduce(function(s,g){return s+(g.n||0)},0);
  var conv=pool.convergence||{};
  var head,merge='';
  if(pool.n){
    head='<div class="merge-line">'
      +'<span class="big">'+fmtInt(raw)+'</span><span class="quiet">条原始想法</span>'
      +'<span class="arr">→ 同一标的合并、赔率取中位数 →</span>'
      +'<span class="big">'+fmtInt(pool.n)+'</span><span class="quiet">条候选（一标一条）</span>'
      +'</div>'
      +'<div class="card-note" style="margin-bottom:var(--space-2)">方法 = 筛选B 的 4 种生成方法：AI 端到端 / 约束边界 / 传导链 / 共识缺口，彼此独立生成 <span class="gloss" title="'+esc(CONV_GLOSS)+'">ⓘ</span></div>';
    /* 共识度 = 几种不同方式提出（与 API convergence 同口径） */
    var groups={};cands.forEach(function(c){
      var uniq={};(c.proposed_by||[]).forEach(function(m){uniq[m]=1});
      var k=String(Object.keys(uniq).length||1);
      (groups[k]=groups[k]||[]).push(c);
    });
    var BUBBG={'4':'var(--color-surface-brand-sunken)','3':'var(--color-surface-brand-highlight)','2':'var(--color-surface-brand-muted)','1':'var(--color-surface-brand-subtle)'};
    ['4','3','2','1'].forEach(function(k){
      var arr=groups[k];if(!arr||!arr.length)return;
      arr.sort(function(a,b){return String(a.instrument_id).localeCompare(String(b.instrument_id))});
      var d=34+(Number(k)-1)*10;
      var gFoc=focTier?(k===focTier?' foc':' dim'):'';
      merge+='<div class="bub-group'+gFoc+'" style="padding-left:6px;padding-right:6px">'
        +'<div class="bub-k"><div class="t">'+convLabel(k)+' <span class="gloss" title="'+esc(CONV_GLOSS)+'">ⓘ</span></div><div class="s">'+fmtInt(conv[k]!==undefined?conv[k]:arr.length)+' 条'+(k==='4'?' · 最高共识':'')+'</div></div>'
        +'<div class="bub-cloud">'
        +arr.map(function(c){
          return '<button type="button" class="bub" style="width:'+d+'px;height:'+d+'px;background:'+BUBBG[k]+';box-shadow:inset 0 0 0 1px var(--color-border-brand-subtle)" '
            +'title="'+esc(c.instrument_id)+' '+esc(c.instrument_name||'')+' · 主题 '+esc(c.topic_id||'')+' · 上行 '+fmtPct(c.upside_pct)+' / 下行 '+fmtPct(c.downside_pct)+' — 点击在下方全表定位" '
            +'onclick="filterPoolCode(\''+jss(c.instrument_id)+'\')">'+esc(c.instrument_id)+'</button>';
        }).join('')
        +'</div></div>';
    });
    merge+=epi('各生成方法读取同一批研报，共识度不构成独立证据，仅作记录，不参与打分');
  }else{
    head='<div class="empty-sm">候选池尚未合并'+(w.in_flight?'，各生成方法完成后自动合并':'')+'</div>';
  }
  var candCard;
  if(cands.length){
    var flt='';
    if(poolFilter){
      var matched=cands.filter(poolMatch).length;
      flt='<div class="filter-bar">'+fmtInt(cands.length)+' 条中的 '+fmtInt(matched)+' 条 · 筛选条件：'+esc(poolFilter.label)
        +'<button type="button" class="exp-btn" style="padding:0 4px" onclick="clearPoolFilter()" aria-label="清除筛选">×</button></div>';
    }
    candCard='<div id="candCard" style="margin-top:var(--space-6)">'
      +'<div class="card-title-row"><h2 class="card-title" style="margin-bottom:0">候选池全表</h2><span class="card-note">'+fmtInt(cands.length)+' 条 · 列头排序</span></div>'
      +flt
      +'<div class="table-wrap scroll-y scroll-thin" style="margin-top:var(--space-3)"><table id="candTable">'
      +'<thead><tr>'+candTh('instrument_id','标的')+candTh('instrument_name','名称')+candTh('topic_id','主题')

          +ids.map(function(id){return '<button type="button" class="tag tag-brand mono" style="cursor:pointer" title="在候选池里看这条" onclick="filterPoolCode(\''+jss(id)+'\')">'+esc(id)+' ›</button>'}).join('')

/* ── 6 · 自动建仓 ── */
function rngBarHTML(p){
  var lo=p.stop_px,hi=p.take_px,en=p.entry_px,la=p.last_px;
  var has=function(v){return v!==undefined&&v!==null&&!isNaN(v)};
  if(!has(lo)||!has(hi)||!(hi>lo)){
    /* σ 算不出（如无价史的载体）：不画假条 */
    return '<span class="card-note">σ 无法计算 · 未设止损/止盈'+(has(la)?'（现价 '+fmtMoney(la)+'）':'')+'</span>';
  }
  /* 位置一律用百分比、并夹到 [0,100] —— 不做像素测量，抽屉过渡/就地换页也不会塌 */
  function pct(v){return Math.max(0,Math.min(100,(v-lo)/(hi-lo)*100))}
  var below=has(la)&&la<lo, above=has(la)&&la>hi;
  var upC=has(la)&&has(en)&&la>=en;
  var status='';
  if(below)status='<span class="rng-ofl down">◂ 现价已低于止损线（待触发退出）</span>';
  else if(above)status='<span class="rng-ofl up">现价已高于止盈线（待触发退出）▸</span>';
  return '<span class="rngwrap" title="止损 '+fmtMoney(lo)+'（σ×2）· 进场 '+fmtMoney(en)+' · 现价 '+fmtMoney(la)+' · 止盈 '+fmtMoney(hi)+'（σ×3）">'
    +'<span class="rng">'
    +'<span class="rng-track"></span>'
    +'<span class="rng-end" style="left:0"></span><span class="rng-end" style="right:0"></span>'
    +(has(en)?'<span class="rng-tick" style="left:'+pct(en).toFixed(1)+'%"></span>':'')
    +(has(la)?'<span class="rng-last'+((below||above)?' edge':'')+'" style="left:calc('+pct(la).toFixed(1)+'% - 5px);background:var(--color-stock-'+(upC?'up':'down')+'-default)"></span>':'')
    +'</span>'
    /* 四个价位固定在条下一行，各占一列——从根上消灭标签互撞 */
    +'<span class="rng-vals"><i>损 '+fmtMoney(lo)+'</i><i>进 '+fmtMoney(en)+'</i><i class="cur">现 '+fmtMoney(la)+'</i><i>盈 '+fmtMoney(hi)+'</i></span>'
    +status
  +'</span>';
}

/* 全账本按标的合并 */
function mergedPositions(){
  var books=currentBooks();
  var byCode={},order=[];
  books.forEach(function(b){
    (b.open_positions||[]).forEach(function(p){
      var k=p.code;
      if(!byCode[k]){byCode[k]={code:p.code,name:p.instrument_name,thesis:p.thesis,theme_id:p.theme_id,
        entry_px:p.entry_px,last_px:p.last_px,stop_px:p.stop_px,take_px:p.take_px,opened_d:p.opened_d,
        unrealized:0,value:0,cost:0,books:[],perBook:[]};order.push(k)}
      var mv=(p.qty||0)*(p.last_px||0);
      var cv=(p.qty||0)*(p.entry_px||0);
      byCode[k].unrealized+=(p.unrealized||0);
      byCode[k].value+=mv;byCode[k].cost+=cv;
      byCode[k].books.push(b.selector||b.book_id);
      byCode[k].perBook.push({sel:b.selector||b.book_id,unrealized:p.unrealized,qty:p.qty});
    });
  });
  return {byCode:byCode,order:order};
}

/* ── 主题敞口 ─────────────────────────────────────────────────
 * 「这个策略把钱压在哪几个宏观判断上」是账本层最先该回答的问题，
 * 而一张持仓明细表回答不了它：读者要自己把 8 行标的心算归到 5 个主题上。
 * 主题色在一次运行内是稳定的（按入选顺序取色），所以横着比较不同策略时，
 * 同一段颜色就是同一个主题——策略之间的差异一眼就是色块比例的差异。 */
/* 主题配色的唯一口径：本期入选主题占前几个色位，跨期持仓里的其他主题
 * 按字典序稳定顺延——同一主题在敞口图、策略分布图、账本明细里同色。 */
function themeColorOrder(){
  var chosen=topicChosen('hgep').map(String),extra={};
  (currentBooks()||[]).forEach(function(b){
    (b.open_positions||[]).forEach(function(p){
      var t=String(p.theme_id||'');
      if(t&&chosen.indexOf(t)<0)extra[t]=1;
    });
  });
  return chosen.concat(Object.keys(extra).sort());
}
function themeColor(tid){
  var i=themeColorOrder().indexOf(String(tid));
  if(i<0)return 'var(--color-fill-secondary)';
  return 'var(--color-data-'+((i%8)+1)+')';
}
function bookThemeMix(b){
  var pos=(b&&b.open_positions)||[];
  var by={},order=[],total=0;
  pos.forEach(function(p){
    var t=p.theme_id||'未归类';
    var v=Math.abs((Number(p.qty)||0)*(Number(p.last_px)||0));
    if(!by[t]){by[t]={theme:t,value:0,n:0,pnl:0};order.push(t)}
    by[t].value+=v;by[t].n++;by[t].pnl+=(Number(p.unrealized)||0);
    total+=v;
  });
  var mix=order.map(function(t){
    by[t].share=total?by[t].value/total*100:0;return by[t];
  });
  mix.sort(function(a,b2){return b2.value-a.value});
  return {mix:mix,total:total};
}
function themeBarHTML(b,compact){

        +(stale?'。该主题本期未入选，这些是更早一期建的仓，仍按原风控持有到期或触发止损止盈。':''))+'"></span>';
  }).join('');

    return '<button type="button" class="tx-key'+(stale?' stale':'')+'" onclick="openTopicDrawer(\''+jss(m.theme)+'\')" title="'+esc(topicLabel(m.theme)+(stale?'（本期未入选，仓位来自更早一期）':''))+'——点击看这个主题的打分与证据">'

/* ══════════ 会话记录 — 追问的运营视图 ══════════
 * 追问本身也是底账：一次追问 = 有人问了什么、系统当时把哪些材料交给了模型、
 * 模型引用了其中哪几件、答的是什么。这四样凑齐，事后才有办法判断某个回答
 * 是「有据」还是「听起来有据」——只看答案是判断不出来的。
 * 列表 → 详情 → 它当时拿到的材料 → 点进那件材料本身，一路可以往下追。 */
var ASKLOG=null,askLogErr='',askLogOpen={};
function openAskLogDrawer(){pushDrawer({t:'asklog',p:''})}
function ensureAskLog(){
  if(ASKLOG!==null)return ASKLOG;
  if(ensureAskLog._busy)return null;
  ensureAskLog._busy=true;
  fetch('/api/asks?limit=100').then(function(r){return r.json()}).then(function(j){
    ASKLOG=j.asks||[];askLogErr=j.error||'';ensureAskLog._busy=false;renderDrawers();
  }).catch(function(e){
    ASKLOG=[];askLogErr=String(e&&e.message||e);ensureAskLog._busy=false;renderDrawers();
  });
  return null;
}
function askLogSubject(a){
  var k=a.kind||'',id=a.id||'';
  if(k==='topic')return '主题 '+id;
  if(k==='selection')return '选题这一步';
  if(k==='selector')return '策略 '+(selMetaOf(id)[1]||id);
  if(k==='idea')return '想法 '+id;
  return (k?k+' ':'')+id;
}
/* 材料 → 它自己所在的那一层。追问详情不是终点，是入口。 */
function askMatOpen(m){
  var src=String(m.source||''),k=String(m.kind||'');
  if(k==='journal')return "openRunLogStacked()";
  /* 语料浏览器要按期查库，必须带上这次运行的 as_of——不带就取不到清单。 */
  if(k==='doc'){
    var ao=((S||{}).weekly||{}).as_of||'';
    return ao?("openCorpus('"+ao+"')"):'';
  }
  if(k==='selector'){
    var sm=src.match(/C_selectors\/([A-Za-z0-9_]+)\.json/);
    if(sm)return "openBookDrawer('"+sm[1]+"')";
    return "openStageStacked(4)";
  }
  if(k==='pool')return "openStageStacked(3)";
  if(k==='verdict'||k==='counting')return "openStageStacked(1)";
  if(k==='candidate')return "openStageStacked(3)";
  return '';
}
function askMatKindZH(k){

          selector:'策略判决',pool:'候选池',doc:'研报原文',

          +'<div class="card-note">这一条追问发生在系统开始记录材料清单之前，'
          +'只留下了引用编号（'+esc((a.cited||[]).join('、')||'无')+'）。'
          +'之后的追问都会完整记下交给模型的每一件材料。</div>';
      }

  }).join('');
  return head+'<div class="al-list">'+list+'</div>'

/* ══════════ 问当时的它 — 只依据封存材料的追问抽屉 ══════════ */
/* 追问必须按当期上下文回答，不得以当前推测替代。
   实现是检索+严格接地：/api/ask/context 只取那次运行封存的材料，
   /api/ask 的回答被限定在这些材料里，材料没有的它必须明说没有。 */
var ASKCTX={},ASKLOAD={},ASKH={},ASKS={};
/* 静态快照没有后端：/api/* 在 Pages 上返回的是 404 页面（HTML），
   直接 .json() 会炸成「Unexpected token '<'」——那是把「这里没有这个功能」
   说成了「接口坏了」。凡是要现场取材料的入口，先问这一句。 */
function isSnapshot(){return !!window.__STATIC__}
var SNAP_WHERE='要追问请在运行台打开：本机 http://localhost:8765/review，或飞书里那条隧道地址。';
function askSubjName(pstr){var i=pstr.indexOf(':');return i<0?pstr:pstr.slice(i+1)}
function askSubjKind(pstr){var i=pstr.indexOf(':');return i<0?'':pstr.slice(0,i)}
function askRunId(){return ((S||{}).weekly||{}).run_id||''}
function askKey(pstr){return askRunId()+'|'+pstr}
var ASK_KIND_ZH={topic:'主题',idea:'想法',selector:'选取策略'};
function ensureAskCtx(key,kind,id){
  if(ASKCTX[key])return ASKCTX[key];
  if(isSnapshot())return null;
  if(!ASKLOAD[key]){
    ASKLOAD[key]=true;
    fetch('/api/ask/context?run_id='+encodeURIComponent(askRunId())+'&kind='+encodeURIComponent(kind)+'&id='+encodeURIComponent(id),{cache:'no-store'})
      .then(function(r){return r.json().then(function(b){return {ok:r.ok,b:b}})})
      .then(function(res){
        if(res.b&&!res.b.error)ASKCTX[key]={c:res.b};
        else ASKCTX[key]={c:null,err:(res.b&&res.b.error)||('HTTP '+(res.ok?'格式不对':'错误'))};
      })
      .catch(function(e){ASKCTX[key]={c:null,err:e&&e.message?e.message:String(e)}})
      .then(function(){ASKLOAD[key]=false;renderDrawers()});
  }
  return null;
}
function askScrollBottom(){
  requestAnimationFrame(function(){
    var el=document.querySelector('.drawer:not(.under) .drawer-body');
    if(el)el.scrollTop=el.scrollHeight;
  });
}
function askSend(pstr,q){
  q=(q||'').trim();if(!q)return;
  var key=askKey(pstr),st=ASKS[key]=ASKS[key]||{};
  if(st.busy)return;
  st.busy=true;st.pending=q;st.draft='';
  renderDrawers();askScrollBottom();
  var hist=(ASKH[key]||[]).filter(function(h){return h.a}).map(function(h){return {q:h.q,a:h.a}});
  fetch('/api/ask',{method:'POST',cache:'no-store',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({run_id:askRunId(),kind:askSubjKind(pstr),id:askSubjName(pstr),question:q,history:hist})})
    .then(function(r){return r.json().then(function(b){return {ok:r.ok,b:b}})})
    .then(function(res){
      var h=ASKH[key]=ASKH[key]||[];
      if(res.b&&res.b.answer)h.push({q:q,a:res.b.answer,cited:res.b.cited||[],model:res.b.model,via:res.b.answered_by});
      else h.push({q:q,err:(res.b&&res.b.error)||('HTTP 错误（'+(res.ok?'响应格式不对':'请求失败')+'）')});
    })
    .catch(function(e){(ASKH[key]=ASKH[key]||[]).push({q:q,err:e&&e.message?e.message:String(e)})})
    .then(function(){st.busy=false;st.pending=null;renderDrawers();askScrollBottom()});

function askDrawerBody(d){

      +esc(SNAP_WHERE)

  }

    return '<div class="ask-scope" style="border-color:var(--color-feedback-error-default)">'

  if(prov.some(function(m){return m.kind==='generator'||m.kind==='candidate'||m.kind==='pool'}))parts.push('生成记录');
  if(!parts.length)parts.push(fmtInt(stats.n_materials||0)+' 件封存记录');

    shaLine='研报清单与运行时冻结的清单逐条一致，输入指纹（inputs_sha）校验通过，可逐篇复核';
  else if(corpus.verified_sha===true)

  else

    +(shaLine?'<div style="margin-top:4px;color:var(--color-text-'+(corpus.verified_sha?'metadata':'tertiary')+')">'+esc(shaLine)+'</div>':'')

    +'</div>'

  return html;
}

/* 错误信息的可读化映射 */
function plainRunError(e){
  if(!e)return null;
  if(e.indexOf('permanently missed')>=0)return '该期已错过且不补跑：当期研报无法按原深度取回，补跑将引入前视。';
  if(e.indexOf('没有任何语料')>=0)return '当期语料缺失，无法运行，记为失败。';
  if(e.indexOf('killed')>=0||e.indexOf('hung')>=0||e.indexOf('timeout')>=0)return '运行中途挂起，由超时保护终止。';
  if(e.indexOf('wisburg')>=0&&e.indexOf('0 行')>=0)return '研报源本期返回 0 条，按异常处理。';
  return e;
}
function plainFeedError(e){
  if(!e)return null;
  if(e.indexOf('returned 0 rows')>=0||e.indexOf('0 rows')>=0)return '来源有响应但本期返回 0 条，按异常处理。';
  return e;
}

/* 各数据源当前状态，供状态抽屉使用 */
function feedHealthRows(){
  var groups={};
  (S.feeds||[]).forEach(function(f){(groups[f.feed]=groups[f.feed]||[]).push(f)});
  return Object.keys(groups).map(function(k){
    var rows=groups[k].slice().sort(function(a,b){return String(b.as_of||'').localeCompare(String(a.as_of||''))});
    var meta=feedMeta(k);
    var lastGood=rows.find(function(r){return (r.n_rows||0)>0});
    var bad=rows.find(function(r){return !r.ok});
    return {name:meta[0],ok:!bad,
      line:lastGood?('最近一次 '+fmtInt(lastGood.n_rows)+' 条（'+lastGood.as_of+' 期）'):'尚无数据',
      err:bad?((plainFeedError(bad.error)||'')+'（'+bad.as_of+' 期）'):null};
  });
}

/* ── 运行记录抽屉：按期列出运行、数据与错误 ── */
function calDrawerBody(){
  var runs=S.runs||[],gaps=S.gaps||[],feeds=S.feeds||[];
  var curPeriod=(S.schedule||{}).current_period;
  var periods={};
  runs.forEach(function(r){
    if(r.kind!=='weekly'&&r.kind!=='weekly_missed')return;
    if(!periods[r.as_of])periods[r.as_of]={as_of:r.as_of,attempts:[],missed:false};
    if(r.kind==='weekly_missed')periods[r.as_of].missed=true;
    else periods[r.as_of].attempts.push(r);
  });
  gaps.forEach(function(g){
    if(!periods[g])periods[g]={as_of:g,attempts:[],missed:true};
    else periods[g].missed=true;
  });
  /* 上一次成功的周跑（weekly 摘要），runs 表可能已滚出 */
  var wsum=S.weekly||{};
  if(wsum.as_of&&!periods[wsum.as_of]){
    periods[wsum.as_of]={as_of:wsum.as_of,attempts:[],missed:false,
      summaryOk:!!wsum.ok,summaryCalls:wsum.calls,summaryRunId:wsum.run_id};
  }
  /* 本期结果只存在于心跳 outcomes 里（失败的 weekly 尝试不写 runs 表）时，也要在周历里出现 */
  var wkOut=hbOutcome('weekly');
  if(wkOut&&wkOut.period&&!periods[wkOut.period]){
    periods[wkOut.period]={as_of:wkOut.period,attempts:[],missed:false,hbAction:wkOut.action};
  }else if(wkOut&&wkOut.period&&periods[wkOut.period]&&!periods[wkOut.period].attempts.length){
    periods[wkOut.period].hbAction=wkOut.action;
  }
  /* 盯市一行置顶 */
  var todayStr=(function(){var p=hktParts();return p.y+'-'+String(p.m).padStart(2,'0')+'-'+String(p.d).padStart(2,'0')})();
  var mons=runs.filter(function(r){return r.kind==='monitor'});
  var monsToday=mons.filter(function(r){return (r.started_at||'').length&&hktDateOf(r.started_at)===todayStr});
  var latestMon=mons[0]||null;
  var monLine='';
  if(mons.length){
    var monBad=latestMon&&!latestMon.ok;
    monLine='<div class="cal-row"><div class="cal-main" style="cursor:default">'
      +'<span class="cal-date num">盯市</span>'
      +(monBad?badge('warning','有告警'):badge('success','正常'))
      +'<span class="cal-text">当日盯市 '+monsToday.length+' 次 · 最近 '+hktFmt(latestMon.started_at,false)
      +(monBad?'　·　'+esc(plainRunError(latestMon.error)||''):'')+'</span>'
      +'<button type="button" class="exp-btn" style="margin-left:auto;flex:none" onclick="openRunLogStacked(\''+jss(latestMon.run_id)+'\')">日志 ›</button>'
      +'</div></div>';
  }
  var plist=Object.keys(periods).sort().reverse().map(function(k){return periods[k]});
  var calRows=plist.map(function(p,pi){
    var label=p.as_of.slice(5);
    var isCur=p.as_of===curPeriod;
    var att=p.attempts.slice().sort(function(a,b){return String(b.started_at||'').localeCompare(String(a.started_at||''))});
    var okRun=att.find(function(r){return r.ok});
    var flying=att.find(function(r){return !r.ended_at});
    var state,chip;
    if(p.missed){chip=badge('error','永久缺失');state='该期已错过且不补跑：当期研报无法按原深度取回，补跑将引入前视。'}
    else if(okRun){chip=badge('success','完成');state='运行完成，模型调用 '+fmtInt(okRun.calls)+' 次。'}
    else if(p.summaryOk){chip=badge('success','完成');state='运行完成'+(p.summaryCalls?'，模型调用 '+fmtInt(p.summaryCalls)+' 次':'')+'（取自周跑摘要，明细已超出近 30 条运行记录窗口）。'}
    else if(p.hbAction==='failed'){chip=badge('error','失败');state='心跳记录：本期周跑失败，runs 表无该次尝试明细。'}
    else if(p.hbAction){chip=badge('neutral',esc(p.hbAction));state='心跳记录结果：'+esc(p.hbAction)+'。'}
    else if(flying){
      var mins=flying.started_at?Math.max(0,Math.round((Date.now()-new Date(flying.started_at).getTime())/60000)):null;
      chip=badge('info','进行中',true);
      state='选仓进行中'+(mins!==null?'，已运行 '+mins+' 分钟':'')+(att.length>1?'（第 '+att.length+' 次尝试，上次：'+(plainRunError(att[att.length-1].error)||'失败')+'）':'')+'。';
    }
    else{chip=badge('error','失败');state=plainRunError(att[0]&&att[0].error)||'运行失败，原因见展开。'}
    /* 展开:运行尝试 + 该期数据源 + 错误原文 */
    var attHtml=att.length?att.map(function(r){
      return '<div style="padding:4px 0">'
        +'<span class="mono" style="color:var(--color-text-tertiary)">'+esc(r.run_id)+'</span>　'
        +hktFmt(r.started_at,true)+' → '+(r.ended_at?hktFmt(r.ended_at,true):'仍在跑')
        +' · 调用 '+fmtInt(r.calls)+' 次'
        +'　<button type="button" class="exp-btn" onclick="event.stopPropagation();openRunLogStacked(\''+jss(r.run_id)+'\')">日志 ›</button>'
        +(r.error?'<div style="color:var(--color-text-tertiary);font-size:12px;line-height:18px">错误原文：'+esc(r.error)+'</div>':'')
        +'</div>';
    }).join(''):(p.summaryRunId
      ?'<div class="quiet">明细运行记录已超出近 30 条窗口，journal 快照仍可读：<button type="button" class="exp-btn" onclick="event.stopPropagation();openRunLogStacked(\''+jss(p.summaryRunId)+'\')">run '+esc(p.summaryRunId)+' 的日志 ›</button></div>'
      :'<div class="quiet">该期无运行记录。</div>');
    var pfSeen={};
    var pf=feeds.filter(function(f){
      if(f.as_of!==p.as_of)return false;
      var k=f.feed+'|'+f.n_rows+'|'+f.ok;
      if(pfSeen[k])return false;pfSeen[k]=1;return true;
    });
    var pfHtml=pf.length
      ?'<div style="margin-top:6px;padding-top:6px;border-top:1px solid var(--color-border-subtle)">该期数据源：'
        +pf.map(function(f){
          var nm=(FEED_NAMES[f.feed]||[f.feed])[0];
          return '<span style="white-space:nowrap">'+esc(nm)+' <span class="num">'+fmtInt(f.n_rows)+'</span> 条'
            +(f.ok?'':'<span style="color:var(--color-feedback-error-text)">（异常：'+esc(plainFeedError(f.error)||'')+'）</span>')+'</span>';
        }).join('　·　')
      +'</div>':'';
    return '<div class="cal-row">'
      +'<div class="cal-main expandable" onclick="toggleCal('+pi+')" title="展开本期完整记录">'
        +'<span class="cal-date num">'+esc(label)+(isCur?'<span class="tag tag-brand" style="margin-left:6px">本周</span>':'')+'</span>'
        +chip
        +'<span class="cal-text">'+esc(state)+'</span>'
        +(function(){var rid=(okRun&&okRun.run_id)||p.summaryRunId;return rid?'<button type="button" class="exp-btn" style="margin-left:auto;flex:none" onclick="event.stopPropagation();openRunLogStacked(\''+jss(rid)+'\')">日志 ›</button><span class="exp-btn" style="flex:none">详情 ›</span>':'<span class="exp-btn" style="margin-left:auto;flex:none">详情 ›</span>'})()
      +'</div>'
      +'<div class="cal-detail" data-cal="'+pi+'" style="display:none">'+attHtml+pfHtml+'</div>'
    +'</div>';
  }).join('');

  return '<div class="card-note" style="margin-bottom:var(--space-3)">每期一行，展开可见该期运行、数据与错误 · 时间为 HKT</div>'
    +monLine
    +(calRows||'<div class="empty-sm">暂无周跑记录</div>');
}

/* ── 可信度与局限抽屉：未验证假设 + 已修复缺陷 + 历史回测 ── */
function trustDrawerBody(){
  var assum=S.assumptions||[],fixes=S.fixes||[];
  var aRows=assum.map(function(a,ai){
    var qa=assumQA(a.claim||'');
    var q=qa?qa[0]:a.claim;
    var ans=qa?qa[1]:(a.status||'—');
    var big=/最大风险|地基/.test(a.nature||'');
    return '<div class="cal-row">'
      +'<div class="cal-main expandable" onclick="toggleQa('+ai+')" title="展开原始记录">'
        +(big?badge('warning','核心假设'):badge('neutral','待验证'))
        +'<span class="cal-text"><b style="color:var(--color-text-primary);font-weight:500">'+esc(q)+'</b><br>'+esc(ans)+'</span>'
        +'<span class="exp-btn" style="margin-left:auto;flex:none">›</span>'
      +'</div>'
      +'<div class="cal-detail" data-qa="'+ai+'" style="display:none;padding-left:0">'
        +'<div style="font:400 12px/18px var(--font-sans);color:var(--color-text-tertiary)">原始记录：'+esc(a.claim)+' · '+esc(a.nature||'')+' · '+esc(a.status||'')+'</div>'
      +'</div>'
    +'</div>';
  }).join('');
  var fRows=fixes.map(function(f,fi){
    var st=f.state||'';var chip;
    if(st.indexOf('✅')>=0)chip=badge('success','已修');
    else if(st.indexOf('🟡')>=0)chip=badge('warning',st.replace(/🟡\s*/,'')||'部分');
    else if(st.indexOf('❌')>=0)chip=badge('error','未开始');
    else chip=badge('neutral',st||'—');
    return '<div class="cal-row">'
      +'<div class="cal-main expandable" onclick="toggleFix('+fi+')" title="展开修复方式">'
        +chip
        +'<span class="cal-text">'+esc(plainFix(f.issue||''))+'</span>'
        +'<span class="exp-btn" style="margin-left:auto;flex:none">›</span>'
      +'</div>'
      +'<div class="cal-detail" data-fix="'+fi+'" style="display:none;padding-left:0">'
        +'<div style="font:400 12px/18px var(--font-sans);color:var(--color-text-tertiary)">原始记录：'+esc(f.issue)+'　·　修法：'+esc(f.how||'—')+'</div>'
      +'</div>'
    +'</div>';
  }).join('');
  var doneN=fixes.filter(function(f){return (f.state||'').indexOf('✅')>=0}).length;
  return ''
    +'<div class="trust-grid">'
      +'<div><h3 class="trust-h">未验证假设 · '+assum.length+'</h3>'+(aRows||'<div class="empty-sm">暂无</div>')+'</div>'
      +'<div><h3 class="trust-h">已修复缺陷 · '+doneN+' / '+fixes.length+'</h3>'+(fRows||'<div class="empty-sm">暂无</div>')+'</div>'
    +'</div>'
    +'<div style="margin-top:var(--space-6)">'+backtestSection()+'</div>';
}
function hktDateOf(iso){
  var d=new Date(iso);if(isNaN(d))return '';
  return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Hong_Kong',year:'numeric',month:'2-digit',day:'2-digit'}).format(d);
}
