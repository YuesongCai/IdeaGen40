    return '<tr><td class="primary">'+esc(backtestArmName(name))+'</td>'

      +'<td class="r num">'+fmtInt(a.n_scored)+'</td>'

      +'<td class="r num '+pctCls(a.mean_return_pct)+'">'+fmtPct(a.mean_return_pct)+'</td>'
      +'<td class="r num '+pctCls(a.median_return_pct)+'">'+fmtPct(a.median_return_pct)+'</td>'
      +'<td class="r num">'+(a.hit_rate==null?'—':fmtRate(a.hit_rate*100))+'</td>'
      +'<td class="r num">'+(a.window_complete_frac==null?'—':fmtRate(a.window_complete_frac*100))+'</td></tr>';
  }).join('');
  var metrics='<div class="card section"><div class="card-title-row"><h2 class="card-title">方法指标</h2>'
    +'<span class="card-note">UNKNOWN 不按 0% 填充</span></div>'
    +'<div class="table-wrap"><table><thead><tr><th>生成方法</th><th class="r">入选</th><th class="r">可计价</th>'
    +'<th class="r">覆盖率</th><th class="r">平均收益</th><th class="r">中位收益</th><th class="r">正收益率</th><th class="r">完整窗口</th>'
    +'</tr></thead><tbody>'+armRows+'</tbody></table></div>'+pairedSummary(filteredPaired)+'</div>';

  var latestPos=filteredPositions.filter(function(p){return p.period===latest});
  var posRows=latestPos.map(function(p){
    return '<tr><td class="primary">'+esc(backtestArmName(p.arm))+'</td>'
      +'<td class="mono">'+esc(p.instrument_id)+'</td>'
      +'<td class="num">'+esc(p.entry_d||'—')+'</td><td class="num">'+esc(p.exit_d||'—')+'</td>'
      +'<td class="r num">'+fmtMoney(p.entry_nav)+'</td><td class="r num">'+fmtMoney(p.exit_nav)+'</td>'
      +'<td class="r num '+pctCls(p.return_pct)+'">'+fmtPct(p.return_pct)+'</td>'
      +'<td>'+esc(p.status||'—')+'</td></tr>';

      +'<div class="bt-kpi"><div class="v num">'+fmtInt(filteredPositions.length)+'</div><div class="k">模拟持仓记录</div></div>'

function setBacktestStart(value){
  var b=(S&&S.backtest)||{};
  if(!value)return;
  backtestStart=value<b.window_start?b.window_start:(value>b.window_end?b.window_end:value);
  renderDrawers();
  requestAnimationFrame(function(){
    var body=document.querySelector('.drawer:last-of-type .drawer-body');
    var el=body?body.querySelector('#sec-backtest'):$('sec-backtest');
    if(el)el.scrollIntoView({block:'start'});
  });
}
function median(values){
  if(!values.length)return null;
  var sorted=values.slice().sort(function(a,b){return a-b}),mid=Math.floor(sorted.length/2);
  return sorted.length%2?sorted[mid]:(sorted[mid-1]+sorted[mid])/2;
}
function backtestArmMetrics(positions,names,horizonDays){
  var out={};
  names.forEach(function(name){
    var rows=positions.filter(function(p){return p.arm===name});
    var scored=rows.filter(function(p){return p.return_pct!==null&&p.return_pct!==undefined&&!isNaN(p.return_pct)});
    var returns=scored.map(function(p){return Number(p.return_pct)});
    var complete=rows.filter(function(p){
      if(!p.entry_d||!p.exit_d)return false;
      return (new Date(p.exit_d+'T00:00:00Z')-new Date(p.entry_d+'T00:00:00Z'))/86400000>=Number(horizonDays||0);
    }).length;
    out[name]={
      n_chosen:rows.length,n_scored:scored.length,
      coverage:rows.length?scored.length/rows.length:null,
      mean_return_pct:returns.length?returns.reduce(function(a,v){return a+v},0)/returns.length:null,
      median_return_pct:median(returns),
      hit_rate:returns.length?returns.filter(function(v){return v>0}).length/returns.length:null,
      window_complete_frac:rows.length?complete/rows.length:null
    };
  });
  return out;
}
function backtestPairedSummary(p,start,end){
  if(!p)return null;
  var pairs=(p.pairs||[]).filter(function(x){return x.as_of>=start&&x.as_of<=end});
  var diffs=pairs.map(function(x){return Number(x.diff)}).filter(function(v){return !isNaN(v)});
  var ratio=Number(p.n_pairs)>0?Number(p.n_eff)/Number(p.n_pairs):1;
  return {
    conclusive:false,n_pairs:pairs.length,
    n_eff:pairs.length?(pairs.length*(isFinite(ratio)?ratio:1)).toFixed(3):0,
    mean_diff:diffs.length?diffs.reduce(function(a,v){return a+v},0)/diffs.length:null,
    message:pairs.length?'所选窗口内的配对结果。':'所选窗口内暂无配对结果。'
  };
}
function pairedSummary(p){
  if(!p)return '';
  return '<div class="quiet" style="margin-top:var(--space-4)">'
    +badge('neutral','窗口统计')
    +'　配对 '+fmtInt(p.n_pairs)+' 期 · 有效独立样本 <span class="num">'+esc(p.n_eff)+'</span>'
    +(p.mean_diff==null?'':' · 平均差 <span class="num '+pctCls(p.mean_diff*100)+'">'+fmtPct(p.mean_diff*100)+'</span>')
    +'<div style="margin-top:6px">'+esc(p.message||'')+'</div></div>';
}
function backtestCurveSVG(points){
  if(!points.length)return '<div class="empty-sm">暂无净值点</div>';
  var byArm={},dates={};
  points.forEach(function(p){(byArm[p.arm]=byArm[p.arm]||[]).push(p);dates[p.d]=1});
  var ds=Object.keys(dates).sort(),names=Object.keys(byArm);
  var W=760,H=230,pl=44,pr=125,pt=14,pb=24,mn=Infinity,mx=-Infinity;
  var series=names.map(function(name,i){
    var map={};byArm[name].forEach(function(p){map[p.d]=Number(p.equity)});
    var values=ds.map(function(d){return map[d]===undefined?null:map[d]});
    values.forEach(function(v){if(v!==null){mn=Math.min(mn,v);mx=Math.max(mx,v)}});
    // 只定义了 8 个数据色；真实回测现在有 9 条臂，第 9 条会拿到不存在的
    // 变量而画成透明。循环取用，宁可两条同色也不要一条隐形。
    return {name:name,values:values,color:'var(--color-data-'+(i%8+1)+')'};
  });
  if(!isFinite(mn)||!isFinite(mx))return '<div class="empty-sm">净值点不可用</div>';
  if(mx-mn<0.5){mn-=0.5;mx+=0.5}
  function X(i){return pl+i*(W-pl-pr)/Math.max(1,ds.length-1)}
  function Y(v){return pt+(mx-v)/(mx-mn)*(H-pt-pb)}
  series.forEach(function(s){
    var first=s.values.find(function(v){return v!==null});
    if(first!==undefined&&first!==null&&first!==0){
      s.values=s.values.map(function(v){return v===null?null:v/first*100});
    }
  });
  mn=Infinity;mx=-Infinity;
  series.forEach(function(s){s.values.forEach(function(v){if(v!==null){mn=Math.min(mn,v);mx=Math.max(mx,v)}})});
  if(mx-mn<0.5){mn-=0.5;mx+=0.5}
  var svg='<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block;max-width:800px" role="img" aria-label="所选窗口两臂回测净值曲线">';
  [mx,100,mn].forEach(function(g){
    if(g<mn-0.01||g>mx+0.01)return;
    svg+='<line x1="'+pl+'" y1="'+Y(g)+'" x2="'+(W-pr)+'" y2="'+Y(g)+'" stroke="var(--color-border-subtle)" stroke-width="1"'+(g===100?' stroke-dasharray="4 3"':'')+'/>'
      +'<text x="'+(pl-6)+'" y="'+(Y(g)+4)+'" text-anchor="end" font-family="var(--font-mono)" font-size="11" fill="var(--color-text-tertiary)">'+g.toFixed(1)+'</text>';
  });
  series.forEach(function(s){
    var pts=[];s.values.forEach(function(v,i){if(v!==null)pts.push(X(i).toFixed(1)+','+Y(v).toFixed(1))});
    if(pts.length>=2){
      svg+='<polyline points="'+pts.join(' ')+'" fill="none" stroke="'+s.color+'" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>';
    }
    var li=s.values.length-1;while(li>=0&&s.values[li]===null)li--;
    if(li>=0)svg+='<circle cx="'+X(li)+'" cy="'+Y(s.values[li])+'" r="2.5" fill="'+s.color+'"/>'
      +'<text x="'+(X(li)+8)+'" y="'+(Y(s.values[li])+4)+'" font-family="var(--font-sans)" font-size="11" fill="'+s.color+'">'+esc(backtestArmName(s.name))+' '+s.values[li].toFixed(1)+'</text>';
  });
  svg+='<text x="'+pl+'" y="'+(H-6)+'" font-family="var(--font-mono)" font-size="11" fill="var(--color-text-tertiary)">'+esc(ds[0])+'</text>'
    +'<text x="'+(W-pr)+'" y="'+(H-6)+'" text-anchor="end" font-family="var(--font-mono)" font-size="11" fill="var(--color-text-tertiary)">'+esc(ds[ds.length-1])+'</text></svg>';
  return '<div class="funnel-wrap">'+svg+'</div>';
}

function pushDrawer(d){
  var top=drawerStack[drawerStack.length-1];

  drawerStack.push(d);

}

var CRUMB_KIND={stage0:'语料',stage1:'筛选A',stage2:'筛选B',stage3:'候选池',stage4:'筛选C',stage5:'建仓',topic:'主题',runlog:'日志',pos:'持仓',book:'账本',status:'状态',cal:'周历',trust:'可信度',ask:'追问'};
function crumbKind(d){return d.t==='stage'?(CRUMB_KIND['stage'+d.p]||'阶段'):(CRUMB_KIND[d.t]||'')}
function crumbName(d){
  if(d.t==='stage'){
    if(d.f!==null&&d.f!==undefined&&d.f!==''){
      if(d.p===1)return String(d.f);
      if(d.p===2)return methodName(d.f);
      if(d.p===3)return convLabel(String(d.f));
      if(d.p===4)return selMetaOf(d.f)[1];
    }
    return (STAGES[d.p]||{}).t||'';
  }
  if(d.t==='topic')return String(d.p);
  if(d.t==='ask')return askSubjName(String(d.p));
  if(d.t==='runlog')return String(d.p||'最近一次');
  if(d.t==='pos')return bareCode(d.p);
  if(d.t==='book')return selMetaOf(d.p)[1];
  if(d.t==='status')return '体征';
  if(d.t==='cal')return '每周';
  if(d.t==='trust')return '赌注与坑';
  return '';
}
function renderDrawers(){
  var root=$('drawerRoot');if(!root)return;
  hidePop();
  if(!drawerStack.length){root.innerHTML='';document.body.classList.remove('drawer-lock');return}
  document.body.classList.add('drawer-lock');
  var n=drawerStack.length;
  var rootLbl=(VIEWS.find(function(v){return v.id===current})||{}).label||'总览';
  var html='<div class="drawer-scrim" onclick="popDrawer()"></div>';
  /* 物理只有两张：底 = 第 1 层（露 22px 边条），顶 = 当前层；中间层活在面包屑里 */
  var sheets=(n===1)?[{d:drawerStack[0],i:0,top:true}]:[{d:drawerStack[0],i:0,top:false},{d:drawerStack[n-1],i:n-1,top:true}];
  sheets.forEach(function(sh){
    var d=sh.d;
    var crumbs='<button type="button" class="drawer-crumb" onclick="truncDrawers(0)">'+esc(rootLbl)+'</button>';
    for(var j=0;j<=sh.i;j++){
      var dj=drawerStack[j];
      var inner='<span class="crumb-k">'+esc(crumbKind(dj))+'</span>'+esc(crumbName(dj));
      crumbs+='<span aria-hidden="true">›</span>';
      crumbs+=(j===sh.i)
        ?'<span class="drawer-crumb cur">'+inner+'</span>'
        :'<button type="button" class="drawer-crumb" onclick="truncDrawers('+(j+1)+')" title="回到第 '+(j+1)+' 层">'+inner+'</button>';
    }
    var depth='';
    if(sh.top){
      var dots='';
      for(var k2=0;k2<n;k2++)dots+='<span class="dd'+(k2===n-1?' cur':'')+'"></span>';
      depth='<span class="depth-ind" title="抽屉深度：每往里点一层加一格">第 '+n+' 层 / 共 '+n+' 层<span class="depth-dots">'+dots+'</span></span>'
        +(n>1?'<button type="button" class="drawer-crumb" style="flex:none" onclick="closeDrawers()" title="也可按 Shift+Esc">关闭全部 ✕</button>':'');
    }
    var peekStrip=(!sh.top)?'<button type="button" class="peek-strip" onclick="truncDrawers(1)" title="回到第 1 层：'+esc(drawerLabel(d))+'"><span>'+esc(crumbKind(d))+' · '+esc(crumbName(d))+'</span></button>':'';
    html+='<section class="drawer'+(sh.top?'':' under')+'" style="z-index:'+(70+(sh.top?1:0))+';width:min(100vw,calc(clamp(480px,44vw,680px)'+(sh.top?'':' + 22px')+'))" role="dialog" aria-modal="true" aria-label="'+esc(drawerLabel(d))+'">'
      +peekStrip
      +'<div class="drawer-head">'
        +'<div class="drawer-crumbs">'+crumbs+(depth?'<span style="margin-left:auto;display:inline-flex;align-items:center;gap:8px">'+depth+'</span>':'')+'</div>'
        +'<div class="drawer-title-row">'
          +'<span class="drawer-title">'+esc(drawerLabel(d))+'</span>'
          +'<span class="drawer-q">'+esc(drawerQ(d))+'</span>'
          +'<button type="button" class="drawer-x" onclick="'+(sh.top?'popDrawer()':'truncDrawers('+sh.i+')')+'" aria-label="关闭本层">'
            +'<svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M3 3l8 8M11 3l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>'
          +'</button>'
        +'</div>'
      +'</div>'
      +'<div class="drawer-body scroll-thin" id="drawerBody-'+sh.i+'">'+drawerBodyHTML(d)+'</div>'
    +'</section>';
  });
  root.innerHTML=html;
  if($('candTable')){bindCandSort();renderCandBody()}
  if(drawerScrollSel){
    var sel=drawerScrollSel;drawerScrollSel=null;
    requestAnimationFrame(function(){
      var body=$('drawerBody-'+(drawerStack.length-1));
      var el=body?body.querySelector(sel):null;
      if(el)el.scrollIntoView({block:'center'});
    });
  }
}
function drawerBodyHTML(d){
  try{
    switch(d.t){
      case 'stage':return [stageCorpusBody,stageTopicsBody,stageGeneratorsBody,stagePoolBody,stageSelectorsBody,stageBookingBody][d.p](d);
      case 'topic':return topicDrawerBody(d.p);
      case 'ask':return askDrawerBody(d);
      case 'runlog':return runLogDrawerBody(d);
      case 'pos':return posDrawerBody(d.p);
      case 'book':return bookDrawerBody(d.p);
      case 'status':return statusDrawerBody();
      case 'cal':return calDrawerBody();
      case 'trust':return trustDrawerBody();
    }
  }catch(e){return '<div class="empty-sm">这个抽屉渲染失败了（'+esc(e&&e.message?e.message:String(e))+'）——数据可能还没就位</div>'}
  return '';

/* ══════════ hover 速览 popover ══════════ */
var POPS={},popSeq=0,popTimer=null,popCur=null,popX=0,popY=0;
function popRef(html){var id='pp'+(popSeq++);POPS[id]=html;return ' data-pop="'+id+'"'}
function showPop(html,x,y){
  var el=$('pcPop');if(!el||!html)return;
  el.innerHTML=html;el.classList.add('show');
  var r=el.getBoundingClientRect();
  var px=Math.min(x+16,window.innerWidth-r.width-10);
  var py=Math.min(y+18,window.innerHeight-r.height-10);
  el.style.left=Math.max(6,px)+'px';el.style.top=Math.max(6,py)+'px';
}
function hidePop(){
  clearTimeout(popTimer);popCur=null;
  var el=$('pcPop');if(el)el.classList.remove('show');
}
document.addEventListener('mouseover',function(e){
  var t=e.target;
  var el=(t&&t.closest)?t.closest('[data-pop]'):null;
  if(!el){if(popCur)hidePop();return}
  var id=el.getAttribute('data-pop');
  if(id===popCur)return;
  hidePop();popCur=id;popX=e.clientX;popY=e.clientY;
  popTimer=setTimeout(function(){if(popCur===id)showPop(POPS[id]||'',popX,popY)},150);
});
document.addEventListener('mousemove',function(e){popX=e.clientX;popY=e.clientY});
document.addEventListener('scroll',function(){hidePop()},true);

function selChosenId(ch){
  var id=typeof ch==='string'?ch:((ch&&ch.instrument_id)||'');
  if(id.indexOf('pool:')===0)id=id.slice(5);
  return id;
}
function poolMatch(c){
  if(!poolFilter)return true;
  var t=poolFilter.type,v=poolFilter.value;
  if(t==='topic')return c.topic_id===v;
  if(t==='code')return c.instrument_id===v||c.instrument_id===bareCode(v);
  if(t==='method')return (c.proposed_by||[]).some(function(m){return m===v||methodName(m)===methodName(v)});
  if(t==='mt')return c.topic_id===v.topic&&(c.proposed_by||[]).some(function(m){return m===v.method||methodName(m)===methodName(v.method)});
  if(t==='conv'){var n=c.n_methods!=null?c.n_methods:(function(){var uq={};(c.proposed_by||[]).forEach(function(m){uq[m]=1});return Object.keys(uq).length})();return String(n)===String(v)}
  if(t==='selector'){
    var s=(((S||{}).weekly||{}).selectors||[]).find(function(x){return x.name===v});
    if(!s)return false;
    return (s.chosen||[]).some(function(ch){return selChosenId(ch)===c.instrument_id});
  }
  return true;
}
function ensurePoolDrawer(){
  var idx=-1;
  drawerStack.forEach(function(d,i){if(d.t==='stage'&&d.p===3)idx=i});
  if(idx>=0)drawerStack.length=idx+1;
  else{if(drawerStack.length>=6)drawerStack.pop();drawerStack.push({t:'stage',p:3})}
}
function filterPool(type,value,label){
  poolFilter={type:type,value:value,label:label};
  ensurePoolDrawer();
  drawerScrollSel='#candCard';
  renderDrawers();
}
function filterPoolCode(code){filterPool('code',code,'标的 '+code)}
function convLabel(k){return k==='4'?'4 种方式都提出':(k==='1'?'仅 1 种方式提出':k+' 种方式共同提出')}
var CONV_GLOSS='「方式」= 筛选B 的 4 种写想法方法（AI 端到端 / 约束边界 / 传导链 / 共识缺口），互不通气、独立写想法。同一个标的被越多种方法不约而同提出，共识度越高——4/4 是机器内部的最高共识。';
function filterPoolConv(k){
  poolFilter={type:'conv',value:k,label:convLabel(k)};
  ensurePoolDrawer();
  var top=drawerStack[drawerStack.length-1];
  if(top&&top.t==='stage'&&top.p===3){top.f=k;top.scrolled=false}
  renderDrawers();
}
function filterPoolMT(method,topic){filterPool('mt',{method:method,topic:topic},'方式 '+methodName(method)+' × 主题 '+topic)}
function clearPoolFilter(){poolFilter=null;renderDrawers()}
function poolCountBy(type,value){
  var cands=((((S||{}).weekly||{}).pool)||{}).candidates||[];
  var save=poolFilter;poolFilter={type:type,value:value};
  var n=cands.filter(poolMatch).length;
  poolFilter=save;return n;
}
function goSelector(name){
  var sIdx=-1;
  drawerStack.forEach(function(d,i){if(d.t==='stage'&&d.p===4)sIdx=i});
  if(sIdx>=0){drawerStack.length=sIdx+1;drawerStack[sIdx].f=name;drawerStack[sIdx].scrolled=false}
  else{if(drawerStack.length>=6)drawerStack.pop();drawerStack.push({t:'stage',p:4,f:name})}
  renderDrawers();
}

function tierTag(t){
  var lbl={1:'一手',2:'投行',3:'资讯'}[t]||'';

function corpusRowsFor(asOf){
  var w=(S&&S.weekly)||{};
  if(w.as_of===asOf&&w.corpus_total)return w.corpus_total;
  var f=(S.feeds||[]).filter(function(x){return x.kind==='corpus'&&x.as_of===asOf});
  if(!f.length)return null;
  var n=Math.max.apply(null,f.map(function(x){return x.n_rows||0}));
  return n||null;
}

      s+='<g class="pc-click" onclick="goSelector(\''+esc(sel.name)+'\')"'+popRef(sp)+'>'

      +txt(sX1+sW/2,204,w.in_flight?'挑选中…':'还没出手',10.5,'var(--color-text-tertiary)','middle')+'</g>';

  /* ── 持仓束 ── */

    var byName={};books.forEach(function(b){byName[b.selector]=(b.open_positions||[]).length});
    if(haveSels)sels.forEach(function(sel,i){
      var n=byName[sel.name]||0;if(!n)return;
      s+=link(sX1+sW,sYs[i],bX,200,Math.max(1.2,n*0.7),'var(--color-fill-brand-green)',0.35);

var JCache={},JLoading={};
function runReceiptStrip(){
  if(!J||!J.journal){
    return '<button type="button" class="run-receipt section" onclick="openRunLog()">'
      +'<span class="dot bad"></span><span class="rr-main">运行日志读不到（/api/journal'+(JErr?'：'+esc(JErr):' 返回为空')+'）——不演，点开看原因</span>'
      +'<span class="go">详情 →</span></button>';
  }
  var j=J.journal;
  return '<button type="button" class="run-receipt section" onclick="openRunLog(\''+esc(j.run_id||'')+'\')" title="打开这次周跑的完整运行日志">'
    +'<span class="dot'+(j.ok?'':' bad')+'"></span>'
    +'<span class="rr-main">'+(j.ok?'● 完成':'● 失败')+' · run '+esc(j.run_id||'—')+' · '+esc(j.as_of||'')+' 期 · '+fmtInt((j.steps||[]).length)+' 步 · '+(j.duration_s!==undefined&&j.duration_s!==null?Number(j.duration_s).toFixed(2)+'s':'—')+' · '+fmtInt((j.artifacts||[]).length)+' 件产物</span>'
    +'<span class="go">查看完整日志 →</span></button>';
}
function ensureJournal(runId){
  var key=runId||'latest';
  if(JCache[key])return JCache[key];
  if(J&&J.journal&&(key==='latest'||J.run_id===runId)){
    JCache[key]={j:J.journal};return JCache[key];
  }
  if(!JLoading[key]){
    JLoading[key]=true;
    fetch('/api/journal'+(runId?'?run_id='+encodeURIComponent(runId):''),{cache:'no-store'})
      .then(function(r){return r.json().then(function(b){return {ok:r.ok,b:b}})})
      .then(function(res){
        if(res.b&&res.b.journal)JCache[key]={j:res.b.journal};
        else JCache[key]={j:null,err:(res.b&&res.b.error)||('HTTP '+(res.ok?'格式不对':'错误'))};
      })
      .catch(function(e){JCache[key]={j:null,err:e&&e.message?e.message:String(e)}})
      .then(function(){JLoading[key]=false;renderDrawers()});
  }
  return null;
}
function rlTime(iso){
  if(!iso)return '—';
  var d=new Date(iso);if(isNaN(d))return esc(iso);
  var hm=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Hong_Kong',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(d);
  var ms=String(d.getMilliseconds()).padStart(3,'0');
  return hm+'.'+ms;
}
function rlBytes(b){
  b=Number(b);if(isNaN(b))return '';
  if(b>=1048576)return (b/1048576).toFixed(1)+' MB';
  if(b>=1024)return (b/1024).toFixed(1)+' KB';
  return b+' B';
}
function rlKvHTML(st){
  var step=st.step||'';
  function kv(k,v){return '<b>'+k+'</b> '+v}
  var parts=[];
  if(step==='universe'){
    parts.push(kv('合格标的',fmtInt(st.eligible)));parts.push(kv('排除',fmtInt(st.excluded)));
    if(st.shelf_dating)parts.push(kv('货架',fmtInt(st.shelf_dating.total)));
  }else if(step.indexOf('feed:')===0){
    parts.push(kv('来源',esc(step.slice(5))));
    if(st.kind)parts.push(kv('类型',esc(st.kind)));
    parts.push(st.ok?'ok':'<span class="rl-err">失败'+(st.error?'：'+esc(st.error):'')+'</span>');
  }else if(step==='theme_discovery'){
    parts.push(kv('主题覆盖',esc(numOr(st.coverage_pct))+'%'));parts.push(kv('未匹配语料',fmtInt(st.unmatched)));parts.push(kv('新主题候选',fmtInt(st.candidates)));
  }else if(step==='inputs'){
    parts.push(kv('语料',fmtInt(st.corpus)));parts.push(kv('日历',fmtInt(st.calendar)));parts.push(kv('价格行',fmtInt(st.prices)));
    if(st.sha)parts.push(kv('输入指纹',esc(st.sha)));
  }else if(step==='topics'){
    parts.push(kv('策略',esc(st.strategy||'')+(st.version?' v'+esc(st.version):'')));
    if(st.chosen)parts.push(kv('选中',st.chosen.map(esc).join(' ')));
    if(st.calls!==undefined)parts.push(kv('模型调用',fmtInt(st.calls)));
  }else if(step==='generators'){
    var pr=st.produced||{};
    parts.push(kv('共写出',fmtInt(st.pool)+' 条'));
    parts.push(Object.keys(pr).map(function(k){return esc(methodName(k))+' '+fmtInt(pr[k])}).join(' · '));
    var ge=st.errors||{};
    Object.keys(ge).forEach(function(k){parts.push('<span class="rl-err">'+esc(methodName(k))+'：'+esc(ge[k])+'</span>')});
  }else if(step==='pool'){
    parts.push(kv('原始想法',fmtInt(st.raw)));parts.push(kv('合并后',fmtInt(st.merged)+' 条（一标一条）'));
    var cv=st.convergence||{};
    var cvs=Object.keys(cv).sort().reverse().map(function(k){return esc(k)+'×'+fmtInt(cv[k])}).join(' ');
    if(cvs)parts.push(kv('共识分布',cvs));
  }else if(step==='selectors'){
    parts.push(kv('同池候选',fmtInt(st.pool)));
    var ch=st.chosen||{};
    parts.push(Object.keys(ch).map(function(k){return esc(selMetaOf(k)[1])+' '+fmtInt(ch[k])}).join(' · '));
    var se=st.errors||{};
    Object.keys(se).forEach(function(k){parts.push('<span class="rl-err">'+esc(selMetaOf(k)[1])+'：'+esc(se[k])+'</span>')});
    if(st.inputs_sha)parts.push(kv('输入指纹',esc(st.inputs_sha)));
  }else{
    Object.keys(st).forEach(function(k){
      if(k==='step'||k==='at'||k==='n')return;
      var v=st[k];
      if(v===null||typeof v==='object')return;
      parts.push(kv(esc(k),esc(String(v))));
    });
  }
  return parts.join('　');
}
var RL_STEP_ZH={'universe':'货架核实','theme_discovery':'主题发现','inputs':'输入封存','topics':'筛选A 选题','generators':'筛选B 写想法','pool':'合并候选池','selectors':'筛选C 挑持仓'};
function rlStepName(step){
  if(RL_STEP_ZH[step])return RL_STEP_ZH[step];

}

  if(!cached.j){
    return '<div class="runlog"><div class="rl-empty">这条运行没有可读的日志'
      +(cached.err?'——API 说：'+esc(cached.err):'')
      +'。盯市（monitor）运行和较早的周跑没有留 journal 快照，这不是掩饰，是当时就没写。</div></div>';
  }
  var j=cached.j;
  var steps=j.steps||[];
  var arts=j.artifacts||[];
  var t0=j.started_at?new Date(j.started_at).getTime():null;
  var anim=!d.played;d.played=true;
  var stepMs=Math.min(90,Math.floor(1800/Math.max(1,steps.length+arts.length)));
  var li=0;
  function delay(){var v=anim?' style="animation-delay:'+(li*stepMs)+'ms"':'';li++;return v}
  var head='<div class="rl-head">'
    +'<span class="rl-title"><span class="cur"></span>运行日志</span>'
    +'<span class="rl-chip'+(j.ok?' ok':' bad')+'">'+(j.ok?'完成':'失败')+'</span>'
    +'<span class="rl-chip">'+esc(j.platform||'—')+'</span>'
    +'<span class="rl-chip">run '+esc(j.run_id||'—')+'</span>'
    +'<span class="rl-chip">'+esc(j.kind||'')+' · '+esc(j.as_of||'')+' 期</span>'
    +(j.started_at?'<span class="rl-chip">'+hktFmt(j.started_at,true)+' HKT 启动</span>':'')
    +(j.duration_s!==undefined&&j.duration_s!==null?'<span class="rl-chip">总时长 '+Number(j.duration_s).toFixed(2)+'s</span>':'')
    +'</div>';
  var lines=steps.map(function(st){
    var dt=(t0!==null&&st.at)?((new Date(st.at).getTime()-t0)/1000):null;
    return '<div class="rl-line"'+delay()+'>'
      +'<span class="rl-t">'+rlTime(st.at)+(dt!==null?' <span style="color:#525a56">+'+dt.toFixed(1)+'s</span>':'')+'</span>'
      +'<span class="rl-step">'+esc(rlStepName(st.step))+'</span>'
      +'<span class="rl-kv">'+rlKvHTML(st)+'</span>'
      +'</div>';
  }).join('');
  var artHtml='';
  if(arts.length){
    var totalB=0;arts.forEach(function(a){totalB+=Number(a.bytes)||0});
    artHtml='<div class="rl-sec">产物 · '+arts.length+' 件 · '+rlBytes(totalB)+' · 已写入对象存储</div>'
      +arts.map(function(a){
        return '<div class="rl-line rl-art"'+delay()+'><span class="rl-t">→</span><span class="rl-uri">'+esc(a.uri||a.name||'')+'</span>'
          +'<span style="color:#6f7a75;flex:none">'+rlBytes(a.bytes)+'</span></div>';
      }).join('');
  }
  var ports=(j.port_health||[]).map(function(p){
    return '<span class="rl-chip'+(p.ok?' ok':' bad')+'" title="'+esc(p.detail||'')+'">'+esc(p.name)+'</span>';
  }).join('');
  var portRow=ports?'<div class="rl-head" style="margin:var(--space-3) 0 0"><span style="color:#8fa39a;font:500 11px/18px var(--font-mono);letter-spacing:.06em">端口自检</span>'+ports+'</div>':'';
  var note='';
  var curPeriod=(S&&S.schedule||{}).current_period;
  if(j.error)note+='<div class="rl-note rl-err">运行错误：'+esc(j.error)+'</div>';
  if(j.as_of&&curPeriod&&j.as_of!==curPeriod&&j.kind==='weekly'){
    note+='<div class="rl-note">这是 '+esc(j.as_of)+' 期周跑的原始日志——本期（'+esc(curPeriod)+'）失败，没有可展示的成功记录。时间戳为真实时钟（HKT），产物 URI 指向对象存储。</div>';
  }else{
    note+='<div class="rl-note">原始步骤日志：真实时钟（HKT）、相对耗时、逐件产物。</div>';
  }
  return '<div class="runlog">'+head
    +'<div class="rl-scroll scroll-thin"><div class="rl-body'+(anim?' rl-anim':'')+'">'+lines+artHtml+'</div></div>'
    +portRow+note+'</div>';
}

/* ══════════ 决策现场（抽屉体） ══════════ */

/* ── 1 · 读研报 ── */
function stageCorpusBody(){
  var w=S.weekly||{};
  var rows=(S.feeds||[]).filter(function(x){return x.kind==='corpus'&&x.as_of===w.as_of});
  var n=corpusRowsFor(w.as_of);
  var evAll=(w.evidence)||{};
  var body;
  if(n){
    body='<div class="quiet" style="margin-bottom:var(--space-4)">这一期（'+esc(w.as_of||'')+'）一共读入 <b class="num" style="color:var(--color-text-primary)">'+fmtInt(n)+'</b> 条研报。这是后面所有判断的原材料。'
      +'　<button type="button" class="exp-btn" onclick="openCorpus(\''+esc(w.as_of||'')+'\')">逐篇浏览这一期语料 ›</button></div>';
  }else{
    body='<div class="empty-sm">这一期的研报还没读入'+(w.in_flight?'——正在收集':'')+'</div>';
  }
  var seen={},docs=[];
  Object.keys(evAll).forEach(function(t){
    ((evAll[t]||{}).docs||[]).forEach(function(d){
      if(d&&d.doc_id&&!seen[d.doc_id]){seen[d.doc_id]=1;docs.push(d)}
    });
  });
  var breakdown='';
  if(docs.length){
    var tiers={};docs.forEach(function(d){tiers[d.tier]=(tiers[d.tier]||0)+1});
    var insts={};docs.forEach(function(d){if(d.institution)insts[d.institution]=(insts[d.institution]||0)+1});
    var instTop=Object.keys(insts).sort(function(a,b){return insts[b]-insts[a]}).slice(0,8);
    breakdown='<div style="margin-top:var(--space-2)">'
      +'<div class="card-note" style="margin-bottom:6px">词表命中主题的研报（去重后 '+fmtInt(docs.length)+' 篇）按来源分：</div>'
      +'<div style="display:flex;flex-wrap:wrap;gap:6px">'
      +[1,2,3].filter(function(t){return tiers[t]}).map(function(t){return tierTag(t).replace('</span>',' · '+fmtInt(tiers[t])+' 篇</span>')}).join('')
      +'</div>'
      +(instTop.length?'<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px">'
        +instTop.map(function(k){return '<span class="tag">'+esc(k)+' · '+fmtInt(insts[k])+'</span>'}).join('')+'</div>':'')
      +'</div>';
  }
  var topicChips='';
  var evKeys=Object.keys(evAll).sort(function(a,b){return (evAll[b].n||0)-(evAll[a].n||0)});
  if(evKeys.length){
    topicChips='<div style="margin-top:var(--space-4)">'
      +'<div class="card-note" style="margin-bottom:6px">这些研报流向了哪些主题（点任意主题拉开它的证据抽屉，同一篇可命中多个主题）：</div>'
      +'<div style="display:flex;flex-wrap:wrap;gap:6px">'
      +evKeys.map(function(t){
        return '<button type="button" class="tag" style="cursor:pointer" onclick="openTopicDrawer(\''+esc(t)+'\')" title="'+esc(topicLabel(t))+'">'+esc(t)+' · '+fmtInt(evAll[t].n)+' 篇 ›</button>';
      }).join('')
      +'</div></div>';
  }
  var fgroups={};
  rows.forEach(function(f){var k=f.feed+'|'+f.as_of;(fgroups[k]=fgroups[k]||[]).push(f)});
  var feedTable=rows.length
    ?'<div class="table-wrap" style="margin-top:var(--space-4)"><table>'
      +'<thead><tr><th>来源</th><th>期次</th><th class="r">条数</th><th>状态</th></tr></thead><tbody>'
      +Object.keys(fgroups).map(function(k){
        var g=fgroups[k],f=g[0];
        return '<tr class="expandable" onclick="openCorpus(\''+esc(f.as_of)+'\')" title="点开浏览这一期存了哪些研报">'
          +'<td class="primary">'+esc(feedMeta(f.feed)[0])+'</td>'
          +'<td class="mono">'+esc(f.as_of||'')+'</td>'
          +'<td class="r num">'+fmtInt(f.n_rows)+'</td>'
          +'<td>'+(f.ok?badge('success','正常'):badge('error','异常'))
          +(g.length>1?' <span class="card-note">第 '+g.length+' 次尝试</span>':'')
          +' <span class="exp-btn">浏览 ›</span></td></tr>';
      }).join('')+'</tbody></table></div>'
    :'';
  return body+breakdown+topicChips+feedTable
    +epi('语料是唯一的信息来源——多种写想法的方式共用这一份，所以它们的「共识」不算独立证据');
}

/* ── 2 · 筛选A：赛马（focus = 主题 id：该行高亮+证据就地展开，其余压暗） ── */
function stageTopicsBody(d){
  var foc=(d&&d.f)?String(d.f):null;
  var w=S.weekly||{};
  var hgep=topicArm('hgep'),ctrl=topicArmNot('hgep');
  var chosenSet={};topicChosen('hgep').forEach(function(t){chosenSet[t]=1});
  var ctrlChosen={};(ctrl?(ctrl.chosen||[]):[]).forEach(function(t){ctrlChosen[t]=1});
  if(!(hgep&&hgep.scores&&Object.keys(hgep.scores).length)){
    return '<div class="empty-sm">本期打分还没出来'+(w.in_flight?'——正在进行，稍后自动刷新':'')+'</div>';
  }
  var rows=Object.keys(hgep.scores).map(function(k){var o=hgep.scores[k];o._id=k;return o});
  rows.sort(function(a,b){return (b.score||0)-(a.score||0)});
  var maxScore=Math.max.apply(null,rows.map(function(r){return r.score||0}).concat([1]));
  var cutScore=null,cutIdx=-1;
  rows.forEach(function(r,i){if(chosenSet[r._id]){cutIdx=i;if(cutScore===null||((r.score||0)<cutScore))cutScore=r.score||0}});
  var cScores=(ctrl&&ctrl.scores)||{};
  var cRank={},cMax=1;
  Object.keys(cScores).sort(function(a,b){return ((cScores[b]||{}).score||0)-((cScores[a]||{}).score||0)})
    .forEach(function(k,i){cRank[k]=i+1;cMax=Math.max(cMax,(cScores[k]||{}).score||0)});
  var SEGC=['var(--color-data-1)','var(--color-data-2)','var(--color-data-3)','var(--color-data-4)'];
  var SEGL=['H 热度','G 分歧','E 实据','P 已定价'];
  var SEGW=[0.30,0.25,0.25,0.20];
  var SEGG=[HGEP_GLOSS.H,HGEP_GLOSS.G,HGEP_GLOSS.E,HGEP_GLOSS.P];
  var tabs='';
  if(foc){
    tabs='<div class="ftabs"><button type="button" class="ftab" onclick="setDrawerFocus(null)">全景</button>'
      +topicChosen('hgep').map(function(t){
        return '<button type="button" class="ftab'+(t===foc?' on':'')+'" onclick="setDrawerFocus(\''+esc(t)+'\')">'+esc(t)+'</button>';
      }).join('')+'</div>';
  }
  var dotLegend='<div class="card-note" style="margin-bottom:var(--space-2)">带圈数字 = 纯数数对照给同一主题的排名 <span class="gloss" title="'+esc(COUNT_GLOSS)+'">ⓘ</span> · 绿圈 = 数数也选它进前 5 · 灰圈 = 数数没选 · 悬停每个圈看两边名次</div>';
  var agree0=topicChosen('hgep').filter(function(t){return ctrlChosen[t]});
  var hOnly0=topicChosen('hgep').filter(function(t){return !ctrlChosen[t]});
  var cOnly0=(ctrl?(ctrl.chosen||[]):[]).filter(function(t){return !chosenSet[t]});
  var disLine=ctrl?'<div class="card-note" style="margin-bottom:var(--space-3)">本期重合 '+agree0.length+'/'+topicChosen('hgep').length+'：双选 '+(agree0.map(esc).join('·')||'—')
    +'；仅语义 '+(hOnly0.map(esc).join('·')||'—')+'；仅数数 '+(cOnly0.map(esc).join('·')||'—')+'——分歧就是「语义理解值不值钱」的实时读数</div>':'';
  var html=tabs+dotLegend+disLine+'<div class="race">';
  rows.forEach(function(r,ri){
    var isIn=!!chosenSet[r._id];
    var focCls=foc?(r._id===foc?' foc':' dim'):'';
    var barPct=Math.max(2,(r.score||0)/maxScore*100);
    /* P 是「已定价」，越低越好——计分用 (100 − P)，与后端 WEIGHTS 同口径 */
    var comps=[0.30*(r.H||0),0.25*(r.G||0),0.25*(r.E||0),0.20*(100-(r.P||0))];
    var wsum=comps.reduce(function(a,b){return a+b},0);
    var segs='';
    if(isIn&&wsum>0){
      var vals=[r.H,r.G,r.E,r.P];
      segs=comps.map(function(c,i){
        return '<div class="race-seg" style="width:'+(c/wsum*100).toFixed(1)+'%;background:'+SEGC[i]+'" title="'+SEGG[i]+'。本主题 '+SEGL[i].slice(0,1)+' = '+numOr(vals[i])+'（权重 '+SEGW[i].toFixed(2)+(i===3?'，反向计分':'')+'，贡献 '+c.toFixed(1)+' 分）"></div>';
      }).join('');
    }else{
      segs='<div class="race-seg" style="width:100%;background:var(--color-surface-sunken)" title="未入选——综合分 '+numOr(r.score)+'"></div>';
    }
    var cnt='';
    var cs=cScores[r._id];
    if(cs){
      var pos=Math.max(3,Math.min(97,((cs.score||0)/cMax)*100));
      var hR=ri+1;
      var dotTip;
      var gap0=(cutScore!==null&&r.score!==undefined)?(cutScore-(r.score||0)):null;
      if(ctrlChosen[r._id]&&isIn)dotTip='纯数数把它排第 '+cRank[r._id]+'（HGEP 排第 '+hR+'）· 两种打分都选中（双选）';
      else if(ctrlChosen[r._id])dotTip='纯数数把它排第 '+cRank[r._id]+' 并选中，但 HGEP 没选'+(gap0!==null?'（差 '+gap0.toFixed(1)+' 分）':'')+'——本期两种打分的分歧之一';
      else if(isIn)dotTip='纯数数把它排第 '+cRank[r._id]+'、没选进前 5；HGEP 排第 '+hR+' 并选中——本期两种打分的分歧之一';
      else dotTip='纯数数把它排第 '+cRank[r._id]+'（HGEP 排第 '+hR+'）· 两边都没选';
      dotTip+='。提及 '+fmtInt(cs.mentions!==undefined?cs.mentions:cs.score)+' 次。'+COUNT_GLOSS;
      cnt='<span class="race-cnt'+(ctrlChosen[r._id]?' pick':'')+'" style="left:'+pos.toFixed(1)+'%" title="'+esc(dotTip)+'">'+cRank[r._id]+'</span>';
    }
    var side;
    if(isIn){
      side='<span class="sc num">'+numOr(r.score)+'</span>'
        +(ctrlChosen[r._id]?'<span class="d" title="两种打分都把它选进前 5">双选</span>':(cs?'<span class="d" title="语义臂选了它，纯数数臂没选——分歧之一">仅语义选</span>':''));
    }else{
      var gap=(cutScore!==null&&r.score!==undefined)?(cutScore-(r.score||0)):null;
      side='<span class="sc num">'+numOr(r.score)+'</span><span class="d">'+(gap!==null?'差 '+gap.toFixed(1)+' 分':'落选')+(ctrlChosen[r._id]?' · <span style="color:var(--color-text-brand)">仅数数选</span>':'')+'</span>';
    }
    html+='<button type="button" class="race-row'+(isIn?'':' lost')+focCls+'" id="topicrow-'+esc(r._id)+'" onclick="'+(foc===r._id?'setDrawerFocus(null)':'setDrawerFocus(\''+esc(r._id)+'\')')+'" title="'+(foc===r._id?'再点一次取消聚焦':'点击聚焦这个主题：高亮赛道并展开证据')+'">'
      +'<span class="race-name"><span class="id">'+esc(r._id)+'</span><span class="lbl">'+esc(r.label||'')+'</span></span>'
      +'<span class="race-track"><span class="race-bar" style="width:'+barPct.toFixed(1)+'%">'+segs+'</span>'+cnt+'</span>'
      +'<span class="race-side">'+side+'</span>'
      +'</button>';
    if(foc===r._id){
      html+='<div class="race-detail" style="margin-top:6px">'+topicDrawerBody(r._id)+'</div>';
    }
    if(ri===cutIdx&&cutIdx<rows.length-1){
      html+='<div class="race-cut'+(foc?' dim':'')+'">入选线 · 以上 '+topicChosen('hgep').length+' 个主题进入筛选B</div>';
    }
  });
  html+='</div>';
  var agree=topicChosen('hgep').filter(function(t){return ctrlChosen[t]});
  var hOnly=topicChosen('hgep').filter(function(t){return !ctrlChosen[t]});
  var cOnly=(ctrl?(ctrl.chosen||[]):[]).filter(function(t){return !chosenSet[t]});
  var cmp='';
  if(ctrl){
    cmp='<div style="margin-top:var(--space-4);font:400 13px/19px var(--font-sans);color:var(--color-text-secondary)">'
      +'两种打分本期重叠 <b class="num">'+agree.length+'</b> 个'
      +(hOnly.length?'；仅语义臂选了 '+hOnly.map(function(t){return '<span class="tag">'+esc(t)+'</span>'}).join(' '):'')
      +(cOnly.length?'；仅数数臂选了 '+cOnly.map(function(t){return '<span class="tag">'+esc(t)+'</span>'}).join(' '):'')
      +'——意见相左的主题就是这场实验正在积累的样本。</div>';
  }
  var legend='<div class="race-legend">'
    +'<span><span class="sw" style="background:var(--color-data-1)"></span>H 热度</span>'
    +'<span><span class="sw" style="background:var(--color-data-2)"></span>G 增长</span>'
    +'<span><span class="sw" style="background:var(--color-data-3)"></span>E 证据</span>'
    +'<span><span class="sw" style="background:var(--color-data-4)"></span>P 政策</span>'
    +'<span><span class="sw" style="background:var(--color-surface-sunken)"></span>落选（灰条）</span>'
    +'<span><span class="race-cnt" style="position:static;transform:none;display:inline-flex;margin-right:5px">2</span>纯数数对照的排名 <span class="gloss" title="'+esc(COUNT_GLOSS)+'">ⓘ</span>（绿圈 = 数数也选）</span>'
    +'</div>';
  if(foc&&d&&!d.scrolled){drawerScrollSel='#topicrow-'+foc;d.scrolled=true}
  return html+legend+cmp
    +epi('「AI 语义打分比纯数数强」还没被证明——对照臂每周并行记录，正在攒证据；条内色块 = 四个因子对综合分的贡献');
}

/* ── 主题证据抽屉（第 2/3 层） ── */
function topicDrawerBody(tid){
  var w=S.weekly||{};
  var hgep=topicArm('hgep'),ctrl=topicArmNot('hgep');
  var r=((hgep&&hgep.scores)||{})[tid];
  var ev=((w.evidence)||{})[tid];
  var chosen=topicChosen('hgep').indexOf(tid)>=0;
  var ctrlChosen=(ctrl?(ctrl.chosen||[]):[]).indexOf(tid)>=0;
  var html='';
  if(r){
    var wsum=0.30*(r.H||0)+0.25*(r.G||0)+0.25*(r.E||0)+0.20*(100-(r.P||0)); /* P 已定价，反向计分 */
    html+='<div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:var(--space-2)">'
      +'<span style="font:600 20px/28px var(--font-sans);color:var(--color-text-primary)">'+esc(r.label||tid)+'</span>'
      +(chosen?badge('success','入选'):badge('neutral','落选'))
      +(ctrl?'<span class="card-note">纯数数臂：'+(ctrlChosen?'也选了':'没选')+'</span>':'')
      +'</div>';
    html+='<div class="derive-formula num" title="'+esc(HGEP_GLOSS.H+'；'+HGEP_GLOSS.G+'；'+HGEP_GLOSS.E+'；'+HGEP_GLOSS.P)+'">综合分 '+numOr(r.score)+' ≈ 0.30×H热度('+numOr(r.H)+') + 0.25×G分歧('+numOr(r.G)+') + 0.25×E实据('+numOr(r.E)+') + 0.20×(100−P已定价('+numOr(r.P)+')) = '+wsum.toFixed(1)+' <span class="gloss" title="'+esc(HGEP_GLOSS.H+'。'+HGEP_GLOSS.G+'。'+HGEP_GLOSS.E+'。'+HGEP_GLOSS.P)+'">ⓘ</span></div>'
      +'<div class="derive-kv">'
      +'<span>打分用证据：'+fmtInt(r.n_evidence)+' 条 · '+fmtInt(r.n_institutions)+' 家机构</span>'
      +'<span>P 来源：'+esc(r.p_source||'—')+(r.p_source==='neutral_default'?'（中性默认 50，不代表判断）':'')+'</span>'
      +'<span>量尺标的：'+esc(r.indicator||'—')+'</span>'
      +'</div>';
    var nIdeas=poolCountBy('topic',tid);
    html+='<div class="derive-kv">'
      +(nIdeas>0?'<span><button type="button" class="exp-btn" onclick="filterPool(\'topic\',\''+esc(tid)+'\',\'主题 '+esc(tid)+'\')">这个主题往下变成的 '+fmtInt(nIdeas)+' 条候选 ›</button></span>':'<span style="color:var(--color-text-tertiary)">'+(chosen?'想法还没产出':'落选主题不进入筛选B')+'</span>')
      +'</div>';
    html+='<div style="margin:var(--space-2) 0 var(--space-4);font:400 12px/17px var(--font-sans);color:var(--color-text-tertiary)">四个因子的配比（0.30/0.25/0.25/0.20）是拍脑袋定的，大约 7 个月后才够样本逐个检验；「热度高会涨」本身也还没验证过。</div>';
  }else{
    html+='<div class="empty-sm" style="margin-bottom:var(--space-4)">语义臂本期没有给 '+esc(tid)+' 打分的记录</div>';
  }
  html+='<div style="margin:0 0 var(--space-4)"><button type="button" class="exp-btn" onclick="openAskDrawer(\'topic\',\''+esc(tid)+'\')" title="只依据这次运行当时封存的材料作答——不是现在临时编的">问它当时怎么想 ›</button></div>';
  if(ev){
    var docs=ev.docs||[];
    html+='<div style="font:600 14px/20px var(--font-sans);color:var(--color-text-primary);margin-bottom:4px">词表命中研报 · '+fmtInt(ev.n)+' 条</div>'
      +'<div style="font:400 12px/16px var(--font-sans);color:var(--color-text-tertiary);margin-bottom:6px">口径：'+esc(ev.matched_on||'标题关键词')+'——和打分内部的证据计数不是同一套口径，两个数都摆出来；点任意一篇看摘要、凭据和全文</div>'
      +'<div class="ev-list scroll-thin">'+docs.map(function(dd,di){return docRowHTML(dd,'td-'+esc(tid)+'-'+di)}).join('')+'</div>'
      +(ev.truncated?'<div style="font:400 12px/16px var(--font-sans);color:var(--color-text-tertiary);margin-top:6px">另有 '+fmtInt(ev.truncated)+' 条未显示</div>':'');
  }else{
    html+='<div class="empty-sm">这个主题没有词表命中的研报清单'+(r?'（打分依据的证据计数见上）':'')+'</div>';
  }
  return html;
}

/* ── 3 · 筛选B：生产网格（focus = 方法：焦点头 + 独有标的 + 重合率，其余行压暗） ── */
function stageGeneratorsBody(d){
  var w=S.weekly||{};
  var gens=w.generators||[];
  var chosen=topicChosen('hgep');
  var cands=((w.pool)||{}).candidates||[];
  if(!(gens.length&&chosen.length)){
    return '<div class="empty-sm">想法还没产出'+(w.in_flight?'——筛选A 完成后 4 种方式并行开写':'')+'</div>';
  }
  /* 归一 focus 到 GEN_ORDER 的 key */
  var focKey=null;
  if(d&&d.f){
    var fo=GEN_ORDER.find(function(o){return o[0]===d.f||methodName(o[0])===methodName(d.f)});
    if(fo)focKey=fo[0];
  }
  var tabs='<div class="ftabs"><button type="button" class="ftab'+(!focKey?' on':'')+'" onclick="setDrawerFocus(null)">全景</button>'
    +GEN_ORDER.map(function(o){
      return '<button type="button" class="ftab'+(focKey===o[0]?' on':'')+'" onclick="setDrawerFocus(\''+o[0]+'\')">'+esc(o[1])+'</button>';
    }).join('')+'</div>';
  /* 焦点头：它是谁 · 产出 · 独有标的（方法间最真实的 diff）· 重合率 */
  var focusHead='';
  if(focKey){
    var fo2=GEN_ORDER.find(function(o){return o[0]===focKey});
    var fg=genByKey(focKey);
    var mine=cands.filter(function(c){return (c.proposed_by||[]).indexOf(focKey)>=0});
    var uniq=mine.filter(function(c){
      var st={};(c.proposed_by||[]).forEach(function(m){st[m]=1});
      return Object.keys(st).length===1;
    });
    var overlap=mine.length-uniq.length;
    var pct=mine.length?Math.round(overlap/mine.length*100):0;
    focusHead='<div class="focus-head">'
      +'<b>'+esc(fo2[1])+'</b><span class="tag tag-brand" style="margin-left:6px">'+esc(fo2[2])+'</span>'
      +'<div style="margin-top:4px">'+esc(fo2[3])+'</div>'
      +'<div style="margin-top:4px;color:var(--color-text-metadata)">例：'+esc(fo2[4])+'</div>'
      +'<div style="margin-top:6px">'
      +(fg?'本期产出 <b class="num">'+fmtInt(fg.n)+'</b> 条 · 被拒 <b class="num">'+fmtInt(fg.rejected||0)+'</b> 条 · 合并后在池 <b class="num">'+fmtInt(mine.length)+'</b> 条。':'本期没有它的产出记录。')
      +'</div>'
      +'<div style="margin-top:6px"><b>它独有的 '+fmtInt(uniq.length)+' 个标的</b>（只有它提出、其余三种都没提——方法之间最真实的差别）：'
      +(uniq.length?'<span style="display:inline-flex;flex-wrap:wrap;gap:4px;vertical-align:middle;margin-left:4px">'
        +uniq.map(function(c){return '<button type="button" class="tag tag-brand mono" style="cursor:pointer" title="'+esc(c.instrument_name||'')+' · '+esc(c.topic_id||'')+' — 在候选池里看这条" onclick="filterPoolCode(\''+esc(c.instrument_id)+'\')">'+esc(c.instrument_id)+' ›</button>'}).join('')
        +'</span>':'<span style="color:var(--color-text-tertiary)">本期没有——它提的每一条都有别的方法也提了</span>')
      +'</div>'
      +'<div style="margin-top:4px;color:var(--color-text-metadata)">与其他方式重合 '+fmtInt(overlap)+' / '+fmtInt(mine.length)+' 条（'+pct+'%）——重合读的是同一批研报，不算独立证据</div>'
      +'</div>';
  }
  var perMax=1,target=null;
  GEN_ORDER.forEach(function(o){
    var g=genByKey(o[0]);if(!g)return;
    var per=(g.meta||{}).per_topic||{};
    chosen.forEach(function(t){perMax=Math.max(perMax,per[t]||0)});
    if((g.meta||{}).target_per_topic)target=g.meta.target_per_topic;
  });
  var cols='150px '+chosen.map(function(){return 'minmax(56px,1fr)'}).join(' ')+' 130px';
  var html='<div class="pgrid-wrap scroll-thin"><div class="pgrid" style="grid-template-columns:'+cols+'">';
  html+='<div class="pg-h" style="justify-content:flex-start;align-items:flex-end;text-align:left">方式 ＼ 主题</div>';
  chosen.forEach(function(t){html+='<div class="pg-h" title="'+esc(topicLabel(t))+'">'+esc(t)+'</div>'});
  html+='<div class="pg-h" style="justify-content:flex-end;text-align:right">合计</div>';
  GEN_ORDER.forEach(function(o){
    var g=genByKey(o[0]);
    var isFoc=focKey===o[0];
    var dimS=(focKey&&!isFoc)?';opacity:.35':'';
    html+='<div class="pg-m'+(isFoc?' foc':'')+'" style="padding:2px 6px'+dimS+'"><span class="t">'+esc(o[1])+' <span class="gloss" title="'+esc(genGlossTitle(o))+'">ⓘ</span></span><span class="s" title="'+esc(genGlossTitle(o))+'">'+esc(o[2])+'</span></div>';
    if(g){
      var per=(g.meta||{}).per_topic||{};
      chosen.forEach(function(t){
        var n=per[t]||0;
        if(n){
          var a=(0.08+0.55*n/perMax).toFixed(2);
          html+='<button type="button" class="pg-cell" style="background:rgba(47,131,85,'+a+')'+dimS+'" title="'+esc(o[1])+' × '+esc(t)+'：写出 '+n+' 条'+(target?'（目标 '+target+' 条/主题）':'')+' — 点击在候选池抽屉查看合并后的这批" onclick="filterPoolMT(\''+esc(g.method)+'\',\''+esc(t)+'\')">'+n+'<span class="u">条</span></button>';
        }else{
          html+='<div class="pg-cell empty" style="min-height:52px'+dimS+'" title="'+esc(o[1])+' × '+esc(t)+'：0 条">0</div>';
        }
      });
      var warn=[];
      var meta=g.meta||{};
      if(meta.truncated&&Object.keys(meta.truncated).length)warn.push('有截断');
      var noc=meta.topics_without_corpus_match;
      if(noc&&noc.length)warn.push('缺研报:'+noc.join('/'));
      html+='<div class="pg-tail" style="'+(dimS?dimS.slice(1):'')+'"><span>产出 <b>'+fmtInt(g.n)+'</b>'+(target?' / 目标 '+fmtInt(target*chosen.length):'')+'</span>'
        +'<span>被拒 <b>'+fmtInt(g.rejected||0)+'</b> 条'+(warn.length?' · <span style="color:var(--color-feedback-warning-text)">'+esc(warn.join(' '))+'</span>':'')+'</span></div>';
    }else{
      chosen.forEach(function(){html+='<div class="pg-cell empty" style="'+(dimS?dimS.slice(1):'')+'">—</div>'});
      html+='<div class="pg-tail"><span style="color:var(--color-text-tertiary)">'+(w.in_flight?'正在写':'无产出')+'</span></div>';
    }
  });
  html+='</div></div>';
  var total=gens.reduce(function(a,g){return a+(g.n||0)},0);
  return tabs+focusHead
    +'<div class="quiet" style="margin-bottom:var(--space-3)">4 种方式对同样 '+chosen.length+' 个主题并行写一个月期的结构化想法（带概率、上下行情景与论点），互不通气。色深 = 产量；点任意格子看那批想法。本期共写出 <b class="num" style="color:var(--color-text-primary)">'+fmtInt(total)+'</b> 条。</div>'
    +html
    +epi('目标是每方式每主题 '+(target||20)+' 条——没写满不硬凑：写不出就是写不出，缺口本身是信息');
}

/* ── 4 · 合并候选池 ── */
function stagePoolBody(d){
  var focTier=(d&&d.f)?String(d.f):null;
  var w=S.weekly||{};
  var pool=w.pool||{},cands=pool.candidates||[];
  var gens=w.generators||[];
  var raw=gens.reduce(function(s,g){return s+(g.n||0)},0);
  var conv=pool.convergence||{};
  var head,merge='';
  if(pool.n){
    head='<div class="merge-line">'
      +'<span class="big">'+fmtInt(raw)+'</span><span class="quiet">条原始想法</span>'
      +'<span class="arr">→ 同一标的合并、赔率取中位数 →</span>'
      +'<span class="big">'+fmtInt(pool.n)+'</span><span class="quiet">条候选（一标一条）</span>'
      +'</div>'
      +'<div class="card-note" style="margin-bottom:var(--space-2)">「方式」= 筛选B 的 4 种写想法方法：AI 端到端 / 约束边界 / 传导链 / 共识缺口——互不通气、独立写想法 <span class="gloss" title="'+esc(CONV_GLOSS)+'">ⓘ</span></div>';
    /* 共识度 = 几种不同方式提出（与 API convergence 同口径） */
    var groups={};cands.forEach(function(c){
      var uniq={};(c.proposed_by||[]).forEach(function(m){uniq[m]=1});
      var k=String(Object.keys(uniq).length||1);
      (groups[k]=groups[k]||[]).push(c);
    });
    var BUBBG={'4':'var(--color-surface-brand-sunken)','3':'var(--color-surface-brand-highlight)','2':'var(--color-surface-brand-muted)','1':'var(--color-surface-brand-subtle)'};
    ['4','3','2','1'].forEach(function(k){
      var arr=groups[k];if(!arr||!arr.length)return;
      arr.sort(function(a,b){return String(a.instrument_id).localeCompare(String(b.instrument_id))});
      var d=34+(Number(k)-1)*10;
      var gFoc=focTier?(k===focTier?' foc':' dim'):'';
      merge+='<div class="bub-group'+gFoc+'" style="padding-left:6px;padding-right:6px">'
        +'<div class="bub-k"><div class="t">'+convLabel(k)+' <span class="gloss" title="'+esc(CONV_GLOSS)+'">ⓘ</span></div><div class="s">'+fmtInt(conv[k]!==undefined?conv[k]:arr.length)+' 条'+(k==='4'?' · 最高共识':'')+'</div></div>'
        +'<div class="bub-cloud">'
        +arr.map(function(c){
          return '<button type="button" class="bub" style="width:'+d+'px;height:'+d+'px;background:'+BUBBG[k]+';box-shadow:inset 0 0 0 1px var(--color-border-brand-subtle)" '
            +'title="'+esc(c.instrument_id)+' '+esc(c.instrument_name||'')+' · 主题 '+esc(c.topic_id||'')+' · 上行 '+fmtPct(c.upside_pct)+' / 下行 '+fmtPct(c.downside_pct)+' — 点击在下方全表定位" '
            +'onclick="filterPoolCode(\''+esc(c.instrument_id)+'\')">'+esc(c.instrument_id)+'</button>';
        }).join('')
        +'</div></div>';
    });
    merge+=epi('「不约而同」不等于「更可能对」——各生成方式读的是同一批研报；共识度只是记录，不是加分项');
  }else{
    head='<div class="empty-sm">候选池还没合并'+(w.in_flight?'——各生成方式写完后自动合并':'')+'</div>';
  }
  var candCard;
  if(cands.length){
    var flt='';
    if(poolFilter){
      var matched=cands.filter(poolMatch).length;
      flt='<div class="filter-bar">'+fmtInt(cands.length)+' 条中的 '+fmtInt(matched)+' 条 · 筛选条件：'+esc(poolFilter.label)
        +'<button type="button" class="exp-btn" style="padding:0 4px" onclick="clearPoolFilter()" aria-label="清除筛选">×</button></div>';
    }
    candCard='<div id="candCard" style="margin-top:var(--space-6)">'
      +'<div class="card-title-row"><h2 class="card-title" style="margin-bottom:0">候选池全表</h2><span class="card-note">'+fmtInt(cands.length)+' 条 · 点列头排序 · 点行看论点和去向</span></div>'
      +flt
      +'<div class="table-wrap scroll-y scroll-thin" style="margin-top:var(--space-3)"><table id="candTable">'
      +'<thead><tr>'+candTh('instrument_id','标的')+candTh('instrument_name','名称')+candTh('topic_id','主题')
      +candTh('upside_pct','上行','r')+candTh('downside_pct','下行','r')
      +candTh('p_up','P↑','r')+candTh('p_base','P基','r')+candTh('p_down','P↓','r')
      +candTh('n_proposals','提出','r')+'<th>方式</th></tr></thead>'
      +'<tbody id="candBody"></tbody></table></div>'
      +epi('同一标的被多个方式提出时合并成一条，赔率取中位数；赚亏比低于 1.5 的进不来——差行情宁可留现金')
      +'</div>';
  }else{
    candCard='<div id="candCard" style="margin-top:var(--space-6)"><h2 class="card-title">候选池全表</h2>'
      +'<div class="empty-sm">候选池是空的'+(w.in_flight?'——合并完成后自动出现':'')+'</div></div>';
  }
  return head+merge+candCard;
}

/* ── 5 · 筛选C：闸门矩阵 ── */
function stageSelectorsBody(d){
  var foc=(d&&d.f)?String(d.f):null;
  var w=S.weekly||{};
  var sels=orderedSelectors();
  var cands=((w.pool)||{}).candidates||[];
  var books=currentBooks();
  if(!sels.length){
    return '<div class="empty-sm">本期挑法还没出手'+(w.in_flight?'——候选池合并后开始挑':'')+'</div>';
  }
  var tabs='<div class="ftabs"><button type="button" class="ftab'+(!foc?' on':'')+'" onclick="setDrawerFocus(null)">全景</button>'
    +sels.map(function(sl){
      return '<button type="button" class="ftab'+(foc===sl.name?' on':'')+'" onclick="setDrawerFocus(\''+esc(sl.name)+'\')">'+esc(selMetaOf(sl.name)[1])+'</button>';
    }).join('')+'</div>';
  var focusHead='';
  if(foc){
    var fs=sels.find(function(x){return x.name===foc});
    var fm=selMetaOf(foc);
    if(fs){
      var ids=(fs.chosen||[]).map(selChosenId);
      var hasB=books.some(function(b){return b.selector===foc});
      focusHead='<div class="focus-head">'
        +'<b>'+esc(fm[1])+'</b><span class="tag tag-brand" style="margin-left:6px">'+esc(fm[3])+'</span><span class="tag" style="margin-left:4px">'+esc(fm[2])+'</span>'
        +'<div style="margin-top:4px">'+esc(selPlain(foc))+'</div>'
        +'<div style="margin-top:6px"><b>它放行的 '+fmtInt(ids.length)+' / '+fmtInt(cands.length)+' 条</b>：'
        +(ids.length?'<span style="display:inline-flex;flex-wrap:wrap;gap:4px;vertical-align:middle;margin-left:4px">'
          +ids.map(function(id){return '<button type="button" class="tag tag-brand mono" style="cursor:pointer" title="在候选池里看这条" onclick="filterPoolCode(\''+esc(id)+'\')">'+esc(id)+' ›</button>'}).join('')
          +'</span>':'<span style="color:var(--color-text-tertiary)">空仓——没够门槛，留现金</span>')
        +'</div>'
        +(hasB?'<div style="margin-top:4px"><button type="button" class="exp-btn" onclick="openBookDrawer(\''+esc(foc)+'\')">看这本账的持仓与净值 ›</button></div>':'')
        +'</div>';
    }
  }
  var legend='<div class="sel-legend">'
    +sels.map(function(s,i){
      var m=selMetaOf(s.name);
      var isCtl=m[2]==='对照';
      var hasBook=books.some(function(b){return b.selector===s.name});
      var fCls=foc?(s.name===foc?' foc':' dim'):'';
      return '<div class="sel-leg'+fCls+'" id="selleg-'+i+'" style="background:'+(isCtl?'var(--color-feedback-neutral-subtle)':'var(--color-surface-brand-subtle)')+'">'
        +'<span class="nm">'+esc(m[1])+'</span>'
        +'<span class="tag" style="flex:none">'+esc(m[2])+'</span>'
        +'<span class="bel"><b style="color:var(--color-text-brand)">'+esc(m[3])+'</b> <span class="gloss" title="'+esc(selGlossTitle(m))+'">ⓘ</span>　'+esc(selPlain(s.name))+'　<b class="num" style="color:var(--color-text-primary)">'+fmtInt((s.chosen||[]).length)+' 只</b>'
        +((s.chosen||[]).length?'　<button type="button" class="exp-btn" onclick="filterPool(\'selector\',\''+esc(s.name)+'\',\'挑法 '+esc(m[1])+'\')">回池子看 ›</button>':'　<span style="color:var(--color-text-tertiary)">空仓——没够门槛，留现金</span>')
        +(hasBook?'　<button type="button" class="exp-btn" onclick="openBookDrawer(\''+esc(s.name)+'\')">这本账 ›</button>':'')
        +'</span></div>';
    }).join('')+'</div>';
  var matrix='';
  if(cands.length){
    var chSet=sels.map(function(s){
      var set={};(s.chosen||[]).forEach(function(ch){set[selChosenId(ch)]=1});
      return set;
    });
    var rows=cands.map(function(c){
      var pass=0;chSet.forEach(function(set){if(set[c.instrument_id])pass++});
      return {c:c,pass:pass};
    });
    rows.sort(function(a,b){return b.pass-a.pass||String(a.c.instrument_id).localeCompare(String(b.c.instrument_id))});
    matrix='<div class="table-wrap scroll-y scroll-thin" style="margin-top:var(--space-2)"><table class="gate-table">'
      +'<thead><tr><th>标的</th><th>主题</th>'
      +sels.map(function(s){var m=selMetaOf(s.name);return '<th class="rot'+(foc===s.name?' cf':'')+'"><span class="r-in">'+esc(m[1])+'</span></th>'}).join('')
      +'<th class="r">过闸</th></tr></thead><tbody>'
      +rows.map(function(r){
        var c=r.c;
        return '<tr>'
          +'<td class="primary mono"><button type="button" class="exp-btn" style="padding:2px 4px" onclick="filterPoolCode(\''+esc(c.instrument_id)+'\')" title="'+esc(c.instrument_name||'')+' — 回候选池核对原始赔率">'+esc(c.instrument_id)+'</button></td>'
          +'<td><span class="tag" title="'+esc(topicLabel(c.topic_id))+'">'+esc(c.topic_id||'')+'</span></td>'
          +sels.map(function(s,si){
            var m=selMetaOf(s.name);
            return '<td class="gd'+(foc===s.name?' cf':'')+'">'+(chSet[si][c.instrument_id]
              ?'<span class="gate-dot'+(m[2]==='对照'?' ctl':'')+'" title="'+esc(m[1])+' 放行"></span>'
              :'<span class="gate-miss">·</span>')+'</td>';
          }).join('')
          +'<td class="r num">'+r.pass+'/'+sels.length+'</td></tr>';
      }).join('')
      +'</tbody></table></div>'
      +'<div class="card-note" style="margin-top:var(--space-2)">灰点 = 对照挑法（全买对照按设计整列放行）；同一行亮点越多 = 越多挑法独立看上它</div>';
  }else{
    matrix='<div class="empty-sm" style="margin-top:var(--space-3)">候选池为空——闸门矩阵无从谈起</div>';
  }
  return tabs+focusHead+legend+matrix
    +epi('八道闸吃的是完全相同的候选池——账本之间的净值差只能来自挑法本身；谁更强要等同池配对样本攒够，单周不加冕');
}

/* ── 6 · 自动建仓 ── */
function rngBarHTML(p){
  var lo=p.stop_px,hi=p.take_px,en=p.entry_px,la=p.last_px;
  var has=function(v){return v!==undefined&&v!==null&&!isNaN(v)};
  if(!has(lo)||!has(hi)||!(hi>lo)){
    /* σ 算不出（如无价史的载体）：不画假条 */
    return '<span class="card-note">σ 无法计算 · 未设止损/止盈'+(has(la)?'（现价 '+fmtMoney(la)+'）':'')+'</span>';
  }
  /* 位置一律用百分比、并夹到 [0,100] —— 不做像素测量，抽屉过渡/就地换页也不会塌 */
  function pct(v){return Math.max(0,Math.min(100,(v-lo)/(hi-lo)*100))}
  var below=has(la)&&la<lo, above=has(la)&&la>hi;
  var upC=has(la)&&has(en)&&la>=en;
  var status='';
  if(below)status='<span class="rng-ofl down">◂ 现价已低于止损线（待触发退出）</span>';
  else if(above)status='<span class="rng-ofl up">现价已高于止盈线（待触发退出）▸</span>';
  return '<span class="rngwrap" title="止损 '+fmtMoney(lo)+'（σ×2）· 进场 '+fmtMoney(en)+' · 现价 '+fmtMoney(la)+' · 止盈 '+fmtMoney(hi)+'（σ×3）">'
    +'<span class="rng">'
    +'<span class="rng-track"></span>'
    +'<span class="rng-end" style="left:0"></span><span class="rng-end" style="right:0"></span>'
    +(has(en)?'<span class="rng-tick" style="left:'+pct(en).toFixed(1)+'%"></span>':'')
    +(has(la)?'<span class="rng-last'+((below||above)?' edge':'')+'" style="left:calc('+pct(la).toFixed(1)+'% - 5px);background:var(--color-stock-'+(upC?'up':'down')+'-default)"></span>':'')
    +'</span>'

  var books=currentBooks();

  books.forEach(function(b){

      if(!byCode[k]){byCode[k]={code:p.code,name:p.instrument_name,thesis:p.thesis,theme_id:p.theme_id,
        entry_px:p.entry_px,last_px:p.last_px,stop_px:p.stop_px,take_px:p.take_px,opened_d:p.opened_d,

/* ══════════ 问当时的它 — 只依据封存材料的追问抽屉 ══════════ */
/* Jon 的核心要求：AI 必须按「当时」的想法回答，不能现在临时编一个。
   实现是检索+严格接地：/api/ask/context 只取那次运行封存的材料，
   /api/ask 的回答被限定在这些材料里，材料没有的它必须明说没有。 */
var ASKCTX={},ASKLOAD={},ASKH={},ASKS={};
function askSubjName(pstr){var i=pstr.indexOf(':');return i<0?pstr:pstr.slice(i+1)}
function askSubjKind(pstr){var i=pstr.indexOf(':');return i<0?'':pstr.slice(0,i)}
function askRunId(){return ((S||{}).weekly||{}).run_id||''}
function askKey(pstr){return askRunId()+'|'+pstr}
var ASK_KIND_ZH={topic:'主题',idea:'想法',selector:'账本挑法'};
function ensureAskCtx(key,kind,id){
  if(ASKCTX[key])return ASKCTX[key];
  if(!ASKLOAD[key]){
    ASKLOAD[key]=true;
    fetch('/api/ask/context?run_id='+encodeURIComponent(askRunId())+'&kind='+encodeURIComponent(kind)+'&id='+encodeURIComponent(id),{cache:'no-store'})
      .then(function(r){return r.json().then(function(b){return {ok:r.ok,b:b}})})
      .then(function(res){
        if(res.b&&!res.b.error)ASKCTX[key]={c:res.b};
        else ASKCTX[key]={c:null,err:(res.b&&res.b.error)||('HTTP '+(res.ok?'格式不对':'错误'))};
      })
      .catch(function(e){ASKCTX[key]={c:null,err:e&&e.message?e.message:String(e)}})
      .then(function(){ASKLOAD[key]=false;renderDrawers()});
  }
  return null;
}
function askScrollBottom(){
  requestAnimationFrame(function(){
    var el=document.querySelector('.drawer:not(.under) .drawer-body');
    if(el)el.scrollTop=el.scrollHeight;
  });
}
function askSend(pstr,q){
  q=(q||'').trim();if(!q)return;
  var key=askKey(pstr),st=ASKS[key]=ASKS[key]||{};
  if(st.busy)return;
  st.busy=true;st.pending=q;st.draft='';
  renderDrawers();askScrollBottom();
  var hist=(ASKH[key]||[]).filter(function(h){return h.a}).map(function(h){return {q:h.q,a:h.a}});
  fetch('/api/ask',{method:'POST',cache:'no-store',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({run_id:askRunId(),kind:askSubjKind(pstr),id:askSubjName(pstr),question:q,history:hist})})
    .then(function(r){return r.json().then(function(b){return {ok:r.ok,b:b}})})
    .then(function(res){
      var h=ASKH[key]=ASKH[key]||[];
      if(res.b&&res.b.answer)h.push({q:q,a:res.b.answer,cited:res.b.cited||[],model:res.b.model,via:res.b.answered_by});
      else h.push({q:q,err:(res.b&&res.b.error)||('HTTP 错误（'+(res.ok?'响应格式不对':'请求失败')+'）')});
    })
    .catch(function(e){(ASKH[key]=ASKH[key]||[]).push({q:q,err:e&&e.message?e.message:String(e)})})
    .then(function(){st.busy=false;st.pending=null;renderDrawers();askScrollBottom()});
}
function askSendFromInput(pstr){
  var el=$('askInput');if(!el)return;
  askSend(pstr,el.value);
}
function askAnswerHTML(text){
  /* 把 [M3] 这样的引用标成可 hover 的编号；其余按纯文本转义 */
  return esc(text).replace(/\[(M\d+)\]/g,'<b style="color:var(--color-text-brand);font-weight:600">[$1]</b>');
}
function askChipsFor(kind,ctx){
  var nDocs=(ctx&&ctx.corpus&&ctx.corpus.n_docs)||((ctx&&ctx.stats&&ctx.stats.n_docs)||null);
  var nTxt=nDocs?String(nDocs):'N';
  if(kind==='topic')return ['为什么读了 '+nTxt+' 篇报告选出了这个主题？','当时反对它的证据是什么？','如果重来，材料里有什么被低估了？'];
  if(kind==='idea')return ['为什么当时提出并保留了这条想法？','当时反对它的证据是什么？','如果重来，材料里有什么被低估了？'];
  return ['为什么挑了这几条、拒了其余的？','被拒的候选里当时最可惜的是哪条？','如果重来，材料里有什么被低估了？'];
}
function askDrawerBody(d){
  var pstr=String(d.p),kind=askSubjKind(pstr),sid=askSubjName(pstr),key=askKey(pstr);
  var cached=ensureAskCtx(key,kind,sid);
  if(!cached)return '<div class="empty-sm">正在封存材料清单——只取那次运行当时存下的东西……</div>';
  if(!cached.c){
    return '<div class="ask-scope" style="border-color:var(--color-feedback-error-default)">'
      +'<b>这个对象的当时材料没拿到。</b><br>API 说：'+esc(cached.err||'未知错误')
      +'<br><span style="color:var(--color-text-tertiary)">没有封存材料就没法诚实作答——这里不会用现在的猜测顶替。</span></div>';
  }
  var ctx=cached.c,run=ctx.run||{},stats=ctx.stats||{},corpus=ctx.corpus||{},prov=ctx.provenance||[];
  var inf=ctx.inference||{};
  var subjLabel=(ctx.subject&&ctx.subject.label)||sid;
  var parts=[];

/* 把机器错误信息翻成人话 */
function plainRunError(e){
  if(!e)return null;
  if(e.indexOf('permanently missed')>=0)return '错过了，不补：当时的研报现在取不回同样的深度，补跑等于开卷考试。';
  if(e.indexOf('没有任何语料')>=0)return '当周研报没到位，跑不了——按失败记录，不装成功。';
  if(e.indexOf('killed')>=0||e.indexOf('hung')>=0||e.indexOf('timeout')>=0)return '跑到一半卡住了，被安全机制终止。';
  if(e.indexOf('wisburg')>=0&&e.indexOf('0 行')>=0)return '研报源上次一条数据都没给——可能断了，也可能真是安静的一周，先按告警处理。';
  return e;
}
function plainFeedError(e){
  if(!e)return null;
  if(e.indexOf('returned 0 rows')>=0||e.indexOf('0 rows')>=0)return '来源有响应，但这一期一条都没给——按异常处理。';
  return e;
}

/* 四个数据源的「当前健康」——给本周页状态点的展开面板用 */
function feedHealthRows(){
  var groups={};
  (S.feeds||[]).forEach(function(f){(groups[f.feed]=groups[f.feed]||[]).push(f)});
  return Object.keys(groups).map(function(k){
    var rows=groups[k].slice().sort(function(a,b){return String(b.as_of||'').localeCompare(String(a.as_of||''))});

    var lastGood=rows.find(function(r){return (r.n_rows||0)>0});

      err:bad?((plainFeedError(bad.error)||'')+'（'+bad.as_of+' 期）'):null};
  });

/* ── 周历抽屉：过去每周发生了什么（原「底账」第一段，日志在其上再叠一层） ── */
function calDrawerBody(){
  var runs=S.runs||[],gaps=S.gaps||[],feeds=S.feeds||[];
  var curPeriod=(S.schedule||{}).current_period;
  var periods={};
  runs.forEach(function(r){
    if(r.kind!=='weekly'&&r.kind!=='weekly_missed')return;
    if(!periods[r.as_of])periods[r.as_of]={as_of:r.as_of,attempts:[],missed:false};
    if(r.kind==='weekly_missed')periods[r.as_of].missed=true;
    else periods[r.as_of].attempts.push(r);
  });
  gaps.forEach(function(g){
    if(!periods[g])periods[g]={as_of:g,attempts:[],missed:true};
    else periods[g].missed=true;
  });
  /* 上一次成功的周跑（weekly 摘要），runs 表可能已滚出 */
  var wsum=S.weekly||{};
  if(wsum.as_of&&!periods[wsum.as_of]){
    periods[wsum.as_of]={as_of:wsum.as_of,attempts:[],missed:false,
      summaryOk:!!wsum.ok,summaryCalls:wsum.calls,summaryRunId:wsum.run_id};
  }
  /* 本期结果只存在于心跳 outcomes 里（失败的 weekly 尝试不写 runs 表）时，也要在周历里出现 */
  var wkOut=hbOutcome('weekly');
  if(wkOut&&wkOut.period&&!periods[wkOut.period]){
    periods[wkOut.period]={as_of:wkOut.period,attempts:[],missed:false,hbAction:wkOut.action};
  }else if(wkOut&&wkOut.period&&periods[wkOut.period]&&!periods[wkOut.period].attempts.length){
    periods[wkOut.period].hbAction=wkOut.action;
  }
  /* 盯市一行置顶 */
  var todayStr=(function(){var p=hktParts();return p.y+'-'+String(p.m).padStart(2,'0')+'-'+String(p.d).padStart(2,'0')})();
  var mons=runs.filter(function(r){return r.kind==='monitor'});
  var monsToday=mons.filter(function(r){return (r.started_at||'').length&&hktDateOf(r.started_at)===todayStr});
  var latestMon=mons[0]||null;
  var monLine='';
  if(mons.length){
    var monBad=latestMon&&!latestMon.ok;
    monLine='<div class="cal-row"><div class="cal-main" style="cursor:default">'
      +'<span class="cal-date num">盯市</span>'
      +(monBad?badge('warning','有告警'):badge('success','正常'))
      +'<span class="cal-text">今天已跑 '+monsToday.length+' 次 · 最近 '+hktFmt(latestMon.started_at,false)
      +(monBad?'　·　'+esc(plainRunError(latestMon.error)||''):'')+'</span>'
      +'<button type="button" class="exp-btn" style="margin-left:auto;flex:none" onclick="openRunLogStacked(\''+esc(latestMon.run_id)+'\')">日志 ›</button>'
      +'</div></div>';
  }
  var plist=Object.keys(periods).sort().reverse().map(function(k){return periods[k]});
  var calRows=plist.map(function(p,pi){
    var label=p.as_of.slice(5);
    var isCur=p.as_of===curPeriod;
    var att=p.attempts.slice().sort(function(a,b){return String(b.started_at||'').localeCompare(String(a.started_at||''))});
    var okRun=att.find(function(r){return r.ok});
    var flying=att.find(function(r){return !r.ended_at});
    var state,chip;
    if(p.missed){chip=badge('error','永久缺失');state='错过了，不补：当时的研报现在取不回同样的深度，补跑等于开卷考试。'}
    else if(okRun){chip=badge('success','完成');state='顺利跑完，调用模型 '+fmtInt(okRun.calls)+' 次。'}
    else if(p.summaryOk){chip=badge('success','完成');state='顺利跑完'+(p.summaryCalls?'，调用模型 '+fmtInt(p.summaryCalls)+' 次':'')+'（来自周跑摘要，明细运行记录已滚出近 30 条窗口）。'}
    else if(p.hbAction==='failed'){chip=badge('error','失败');state='心跳记录：这期的周跑尝试失败。runs 表没有这次尝试的明细——线索见「本周」页状态条与数据源健康。'}
    else if(p.hbAction){chip=badge('neutral',esc(p.hbAction));state='心跳记录的结果：'+esc(p.hbAction)+'。'}
    else if(flying){
      var mins=flying.started_at?Math.max(0,Math.round((Date.now()-new Date(flying.started_at).getTime())/60000)):null;
      chip=badge('info','进行中',true);
      state='选仓正在进行'+(mins!==null?'，已运行 '+mins+' 分钟':'')+(att.length>1?'（第 '+att.length+' 次尝试——上次'+(plainRunError(att[att.length-1].error)||'失败了')+'）':'')+'。';
    }
    else{chip=badge('error','失败');state=plainRunError(att[0]&&att[0].error)||'失败了，原因见展开。'}
    /* 展开:运行尝试 + 该期数据源 + 错误原文 */
    var attHtml=att.length?att.map(function(r){
      return '<div style="padding:4px 0">'
        +'<span class="mono" style="color:var(--color-text-tertiary)">'+esc(r.run_id)+'</span>　'
        +hktFmt(r.started_at,true)+' → '+(r.ended_at?hktFmt(r.ended_at,true):'仍在跑')
        +' · 调用 '+fmtInt(r.calls)+' 次'
        +'　<button type="button" class="exp-btn" onclick="event.stopPropagation();openRunLogStacked(\''+esc(r.run_id)+'\')">日志 ›</button>'
        +(r.error?'<div style="color:var(--color-text-tertiary);font-size:12px;line-height:18px">原文：'+esc(r.error)+'</div>':'')
        +'</div>';
    }).join(''):(p.summaryRunId
      ?'<div class="quiet">明细运行记录已滚出近 30 条窗口——但 journal 快照还在：<button type="button" class="exp-btn" onclick="event.stopPropagation();openRunLogStacked(\''+esc(p.summaryRunId)+'\')">run '+esc(p.summaryRunId)+' 的日志 ›</button></div>'

      +'<div class="cal-main expandable" onclick="toggleCal('+pi+')" title="点开看这一期的全部记录">'

      +'</div>'
      +'<div class="cal-detail" data-cal="'+pi+'" style="display:none">'+attHtml+pfHtml+'</div>'
    +'</div>';
  }).join('');

  return '<div class="card-note" style="margin-bottom:var(--space-3)">每期一行 · 这期的运行、数据、错误都在展开里 · 「日志」在上面再叠一层 · 时间为 HKT</div>'
    +monLine

/* ── 能信多少抽屉：未验证的赌注 + 出过的坑 + 历史回测（原「底账」第二三段） ── */
function trustDrawerBody(){
  var assum=S.assumptions||[],fixes=S.fixes||[];
  var aRows=assum.map(function(a,ai){
    var qa=assumQA(a.claim||'');
    var q=qa?qa[0]:a.claim;
    var ans=qa?qa[1]:(a.status||'—');
    var big=/最大风险|地基/.test(a.nature||'');
    return '<div class="cal-row">'
      +'<div class="cal-main expandable" onclick="toggleQa('+ai+')" title="点开看原始记录">'
        +(big?badge('warning','最大的赌注'):badge('neutral','待验证'))
        +'<span class="cal-text"><b style="color:var(--color-text-primary);font-weight:500">'+esc(q)+'</b><br>'+esc(ans)+'</span>'
        +'<span class="exp-btn" style="margin-left:auto;flex:none">›</span>'
      +'</div>'
      +'<div class="cal-detail" data-qa="'+ai+'" style="display:none;padding-left:0">'
        +'<div style="font:400 12px/18px var(--font-sans);color:var(--color-text-tertiary)">原始记录：'+esc(a.claim)+' · '+esc(a.nature||'')+' · '+esc(a.status||'')+'</div>'
      +'</div>'
    +'</div>';
  }).join('');
  var fRows=fixes.map(function(f,fi){
    var st=f.state||'';var chip;
    if(st.indexOf('✅')>=0)chip=badge('success','已修');
    else if(st.indexOf('🟡')>=0)chip=badge('warning',st.replace(/🟡\s*/,'')||'部分');
    else if(st.indexOf('❌')>=0)chip=badge('error','还没做');
    else chip=badge('neutral',st||'—');
    return '<div class="cal-row">'
      +'<div class="cal-main expandable" onclick="toggleFix('+fi+')" title="点开看修法">'
        +chip
        +'<span class="cal-text">'+esc(plainFix(f.issue||''))+'</span>'
        +'<span class="exp-btn" style="margin-left:auto;flex:none">›</span>'
      +'</div>'
      +'<div class="cal-detail" data-fix="'+fi+'" style="display:none;padding-left:0">'
        +'<div style="font:400 12px/18px var(--font-sans);color:var(--color-text-tertiary)">原始记录：'+esc(f.issue)+'　·　修法：'+esc(f.how||'—')+'</div>'
      +'</div>'
    +'</div>';
  }).join('');
  var doneN=fixes.filter(function(f){return (f.state||'').indexOf('✅')>=0}).length;
  return '<div class="quiet" style="margin-bottom:var(--space-4)">有些规则先定后验，有些坑修过——都摆在明面上。</div>'
    +'<div class="trust-grid">'
      +'<div><h3 class="trust-h">未验证的赌注 · '+assum.length+'</h3>'+(aRows||'<div class="empty-sm">暂无</div>')+'</div>'
      +'<div><h3 class="trust-h">出过的坑 · '+doneN+' / '+fixes.length+' 已修</h3>'+(fRows||'<div class="empty-sm">暂无</div>')+'</div>'
    +'</div>'
    +'<div style="margin-top:var(--space-6)">'+backtestSection()+'</div>';
}

function copyCmd(btn,text){
  function done(){btn.textContent='已复制';btn.classList.add('copied');
    setTimeout(function(){btn.textContent='复制';btn.classList.remove('copied')},1600)}
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done,function(){fallbackCopy(text);done()});
  }else{fallbackCopy(text);done()}
}
function fallbackCopy(text){
  var ta=document.createElement('textarea');
  ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy')}catch(e){}
  document.body.removeChild(ta);
}

/* ── 语料浏览器:每一条研报都能溯源 ─────────────────────────── */
var corpusOpen=false,corpusCache={},corpusQuery='',corpusTier=null,corpusAsOf=null,corpusLoading=false,corpusError=null;
var docReg={},docCache={};
function openCorpus(asOf){
  corpusOpen=true;corpusAsOf=asOf;corpusQuery='';corpusTier=null;corpusError=null;
  if(!corpusCache[asOf]){
    corpusLoading=true;renderCorpus();
    fetch('/api/corpus?as_of='+encodeURIComponent(asOf),{cache:'no-store'}).then(function(r){
      if(!r.ok)throw new Error('HTTP '+r.status);return r.json();
    }).then(function(j){corpusCache[asOf]=j;corpusLoading=false;renderCorpus()})
    .catch(function(e){corpusLoading=false;corpusError=e&&e.message?e.message:String(e);renderCorpus()});
  }else renderCorpus();
}
function closeCorpus(){corpusOpen=false;renderCorpus()}
function setCorpusTier(t){corpusTier=t;renderCorpus()}
function corpusInput(el){corpusQuery=el.value;renderCorpusList()}
function corpusFiltered(){
  var d=corpusCache[corpusAsOf];if(!d)return [];
  var q=corpusQuery.trim().toLowerCase();
  return (d.docs||[]).filter(function(x){
    if(corpusTier&&x.tier!==corpusTier)return false;
    if(!q)return true;
    return ((x.title||'')+' '+(x.institution||'')).toLowerCase().indexOf(q)>=0;
  });
}
function renderCorpus(){
  var root=$('corpusRoot');if(!root)return;
  if(!corpusOpen){root.innerHTML='';return}
  var d=corpusCache[corpusAsOf];
  var body;
  if(corpusLoading){
    body='<div class="quiet" style="padding:var(--space-6) 0">正在读取语料清单……</div>';
  }else if(corpusError){
    body='<div class="quiet" style="padding:var(--space-6) 0">取不到语料清单——服务没响应（'+esc(corpusError)+'）。'
      +'<button type="button" class="exp-btn" onclick="openCorpus(\''+esc(corpusAsOf)+'\')">再试一次</button></div>';
  }else if(d&&(d.docs||[]).length){
    var counts={1:0,2:0,3:0};(d.docs||[]).forEach(function(x){counts[x.tier]=(counts[x.tier]||0)+1});
    body='<input type="search" class="corpus-search" placeholder="搜标题或机构……" value="'+esc(corpusQuery)+'" oninput="corpusInput(this)" aria-label="搜索语料">'
      +'<div class="tier-chips">'
      +[[null,'全部 '+fmtInt((d.docs||[]).length)],[1,'T1 一手 '+fmtInt(counts[1]||0)],[2,'T2 投行 '+fmtInt(counts[2]||0)],[3,'T3 资讯 '+fmtInt(counts[3]||0)]]
        .map(function(c){return '<button type="button" class="tier-chip'+(corpusTier===c[0]?' on':'')+'" onclick="setCorpusTier('+(c[0]===null?'null':c[0])+')">'+c[1]+'</button>'}).join('')
      +'</div><div id="corpusList" class="scroll-thin" style="flex:1;overflow-y:auto;min-height:0"></div>';
  }else{
    body='<div class="quiet" style="padding:var(--space-6) 0">这一期还没有语料。</div>';
  }
  var win=(d&&d.window&&d.window.length)?('（窗口 '+esc(d.window[d.window.length-1].slice(5))+' ~ '+esc(d.window[0].slice(5))+'）'):'';
  root.innerHTML='<div class="toc-scrim" onclick="closeCorpus()"></div>'
    +'<div class="help-panel corpus-panel" role="dialog" aria-label="语料浏览器">'
    +'<div class="toc-h"><span>'+esc(corpusAsOf||'')+' 期语料'+(d?' · '+fmtInt(d.n)+' 条'+win:'')+'</span>'
    +'<button type="button" class="copy-btn" onclick="closeCorpus()">关闭</button></div>'
    +body+'</div>';
  if(d&&!corpusLoading&&!corpusError)renderCorpusList();
}
function renderCorpusList(){
  var el=$('corpusList');if(!el)return;
  var arr=corpusFiltered();
  var cap=300,shown=arr.slice(0,cap);
  el.innerHTML=(shown.map(function(x,i){return docRowHTML(x,'cb'+i)}).join('')
      ||'<div class="quiet" style="padding:var(--space-4) 0">没有匹配——换个词试试。</div>')
    +(arr.length>cap?'<div class="quiet" style="padding:8px 0">只显示前 '+cap+' 条（共 '+fmtInt(arr.length)+' 条匹配）——继续输入缩小范围</div>':'');
}
/* 共用文档组件:一份渲染,两个入口(语料浏览器 / 主题证据清单) */
function docRowHTML(d,uid){
  docReg[uid]=d;
  return '<div class="doc-row" onclick="toggleDoc(\''+uid+'\')" title="点开看摘要与凭据">'
    +'<span class="num" style="font-family:var(--font-mono);color:var(--color-text-tertiary);flex:none">'+esc((d.published_d||'').slice(5))+'</span>'
    +tierTag(d.tier)
    +'<span class="doc-title">'+esc(d.title||'')
    +(d.institution?'<span style="color:var(--color-text-tertiary)">　'+esc(d.institution)+'</span>':'')+'</span>'
    +'</div><div class="doc-detail" id="docd-'+uid+'" style="display:none"></div>';
}
function toggleDoc(uid){
  var el=$('docd-'+uid);if(!el)return;
  if(el.style.display!=='none'){el.style.display='none';return}
  el.style.display='';
  if(el.getAttribute('data-loaded'))return;
  var d=docReg[uid]||{};
  if(d.retrieval!==undefined||d.sha!==undefined){
    el.innerHTML=docDetailHTML(d,uid);el.setAttribute('data-loaded','1');
  }else{
    el.innerHTML='<span class="quiet">正在取这篇的档案……</span>';
    fetchDoc(d.doc_id).then(function(j){
      docReg[uid]=j;el.innerHTML=docDetailHTML(j,uid);el.setAttribute('data-loaded','1');
    }).catch(function(){
      el.innerHTML='<span class="quiet">取不到这篇的档案——服务没响应，收起后再点一次可重试。</span>';
    });
  }
}
function fetchDoc(id){
  if(docCache[id])return Promise.resolve(docCache[id]);
  return fetch('/api/doc?id='+encodeURIComponent(id),{cache:'no-store'}).then(function(r){
    if(!r.ok)throw new Error('HTTP '+r.status);return r.json();
  }).then(function(j){docCache[id]=j;return j});
}
function docDetailHTML(d,uid){
  var sha=String(d.sha||d.content_hash||'').slice(0,12);
  var hasBody=(d.body_len||0)>0;
  return (d.summary?'<div>'+esc(d.summary)+'</div>':'<div class="quiet">没有存摘要</div>')
    +'<div class="doc-cred scroll-thin">检索式：'+esc(d.retrieval||'—')+(sha?' · sha '+esc(sha):'')+'</div>'
    +(hasBody
      ?(d.body!==undefined
        ?'<div style="margin-top:6px"><button type="button" class="exp-btn" onclick="toggleDocBody(\''+uid+'\')">读全文（'+fmtInt(d.body_len)+' 字）›</button></div>'
          +'<div class="doc-body scroll-thin" id="docb-'+uid+'" style="display:none">'+esc(d.body)+'</div>'
        :'<div style="margin-top:6px"><button type="button" class="exp-btn" onclick="loadDocBody(\''+uid+'\')">读全文（'+fmtInt(d.body_len)+' 字）›</button></div>'
          +'<div id="docb-'+uid+'"></div>')
      :'<div class="quiet" style="margin-top:6px">只存了标题与摘要（全文仅对每日重点深抓）</div>');
}
function toggleDocBody(uid){
  var el=$('docb-'+uid);if(el)el.style.display=el.style.display==='none'?'':'none';
}
function loadDocBody(uid){
  var d=docReg[uid]||{};
  var el=$('docb-'+uid);if(!el)return;
  el.innerHTML='<span class="quiet">正在取全文……</span>';
  fetchDoc(d.doc_id).then(function(j){
    docReg[uid]=j;
    el.outerHTML='<div class="doc-body scroll-thin" id="docb-'+uid+'">'+esc(j.body||'（全文为空）')+'</div>';
  }).catch(function(){
    el.innerHTML='<span class="quiet">取不到全文——服务没响应，稍后再试。</span>';
  });
}

/* ── 1s ticker: countdown + clock ────────────────────────────── */
function tick(){
  if(!S)return;
  var nr=nextRunInfo();
  if(nr)document.querySelectorAll('.js-cd').forEach(function(el){el.textContent=cdShort(nr.secs)});
  var p=hktParts();
  document.querySelectorAll('.js-now').forEach(function(el){
    el.textContent=String(p.H).padStart(2,'0')+':'+String(p.M).padStart(2,'0');
  });
}

/* ── boot ────────────────────────────────────────────────────── */
buildNav();
var bootDrawer=null;
var initHash=(location.hash||'').replace('#','');
/* 旧链接：底账/回测已溶进抽屉——落到本周并自动拉开对应抽屉 */
if(initHash==='audit'){initHash='week';bootDrawer=function(){openCalDrawer()}}
if(initHash==='backtest'){initHash='week';bootDrawer=function(){openTrustDrawer()}}
if(VIEWS.some(function(v){return v.id===initHash}))switchView(initHash);else switchView('week');
refresh();
setInterval(refresh,60000);
setInterval(tick,1000);
</script>
</body>
</html>
