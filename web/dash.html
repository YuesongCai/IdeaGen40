      +'<div class="rl-scroll scroll-thin">'+rlPlainHTML(j)+'</div>'
      +'<div class="rl-note">数值均取自本次运行的日志字段。原始步骤、键值与产物清单见「工程」视图。</div>'
      +'</div>';
  }
  return '<div class="runlog">'+head
    +'<div class="rl-scroll scroll-thin"><div class="rl-body'+(anim?' rl-anim':'')+'">'+lines+artHtml+'</div></div>'
    +portRow+note+'</div>';
}

/* ══════════ 决策现场（抽屉体） ══════════ */

/* ── 1 · 读研报 ── */
function stageCorpusBody(){
  var w=S.weekly||{};
  var rows=(S.feeds||[]).filter(function(x){return x.kind==='corpus'&&x.as_of===w.as_of});
  var n=corpusRowsFor(w.as_of);
  var evAll=(w.evidence)||{};
  var body;
  if(n){
    body='<div class="quiet" style="margin-bottom:var(--space-4)">这一期（'+esc(w.as_of||'')+'）一共读入 <b class="num" style="color:var(--color-text-primary)">'+fmtInt(n)+'</b> 篇研报'
      +'</div>';
  }else{
    body='<div class="empty-sm">本期研报尚未读入'+(w.in_flight?'，收集中':'')+'</div>';
  }
  var seen={},docs=[];
  Object.keys(evAll).forEach(function(t){
    ((evAll[t]||{}).docs||[]).forEach(function(d){
      if(d&&d.doc_id&&!seen[d.doc_id]){seen[d.doc_id]=1;docs.push(d)}
    });
  });
  var breakdown='';
  if(docs.length){
    var tiers={};docs.forEach(function(d){tiers[d.tier]=(tiers[d.tier]||0)+1});
    var insts={};docs.forEach(function(d){if(d.institution)insts[d.institution]=(insts[d.institution]||0)+1});
    var instTop=Object.keys(insts).sort(function(a,b){return insts[b]-insts[a]}).slice(0,8);
    breakdown='<div style="margin-top:var(--space-2)">'
      /* 这里的「命中」只按标题算，主题发现那一步按全文算，两个数差很远。
       * 不写清楚，读者会以为 858 篇里只有两百多篇被用上，其余白读了。 */
      +'<div class="card-note" style="margin-bottom:6px">词表命中主题的研报（去重后 '+fmtInt(docs.length)+' 篇）按来源分'
      +'<span class="gloss gm" title="这一栏按标题关键词计数，用于给每个主题挂出可点开的证据清单，口径与主题打分一致。主题发现那一步另按全文（标题＋摘要＋正文前 3000 字）统计覆盖率，同一期通常在八成以上——两个数不一样是因为口径不同，不是说其余研报没被读到：它们进了同一份封存材料，写想法时四种方法都能用。">ⓘ</span>：</div>'
      +'<div style="display:flex;flex-wrap:wrap;gap:6px">'
      +[1,2,3].filter(function(t){return tiers[t]}).map(function(t){return tierTag(t).replace('</span>',' · '+fmtInt(tiers[t])+' 篇</span>')}).join('')
      +'</div>'
      +(instTop.length?'<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px">'
        +instTop.map(function(k){return '<span class="tag">'+esc(k)+' · '+fmtInt(insts[k])+'</span>'}).join('')+'</div>':'')
      +'</div>';
  }
  var topicChips='';
  var evKeys=Object.keys(evAll).sort(function(a,b){return (evAll[b].n||0)-(evAll[a].n||0)});
  if(evKeys.length){
    topicChips='<div style="margin-top:var(--space-4)">'
      +'<div class="card-note" style="margin-bottom:6px">研报的主题归属（同一篇可命中多个主题）</div>'
      +'<div style="display:flex;flex-wrap:wrap;gap:6px">'
      +evKeys.map(function(t){
        return '<button type="button" class="tag" style="cursor:pointer" onclick="openTopicDrawer(\''+jss(t)+'\')" title="'+esc(t)+'">'+esc(topicName(t))+' · '+fmtInt(evAll[t].n)+' 篇 ›</button>';
      }).join('')
      +'</div></div>';
  }
  var fgroups={};
  rows.forEach(function(f){var k=f.feed+'|'+f.as_of;(fgroups[k]=fgroups[k]||[]).push(f)});
  var feedTable=rows.length
    ?'<div class="table-wrap" style="margin-top:var(--space-4)"><table>'
      +'<thead><tr><th>来源</th><th>期次</th><th class="r">条数</th><th>状态</th></tr></thead><tbody>'
      +Object.keys(fgroups).map(function(k){
        var g=fgroups[k],f=g[0];
        return '<tr class="expandable" onclick="openCorpus(\''+jss(f.as_of)+'\')" title="点开浏览这一期存了哪些研报">'
          +'<td class="primary">'+esc(feedMeta(f.feed)[0])+'</td>'
          +'<td class="mono">'+esc(f.as_of||'')+'</td>'
          +'<td class="r num">'+fmtInt(f.n_rows)+'</td>'
          +'<td>'+(f.ok?badge('success','正常'):badge('error','异常'))
          +(g.length>1?' <span class="card-note">第 '+g.length+' 次尝试</span>':'')
          +' <span class="exp-btn">浏览 ›</span></td></tr>';
      }).join('')+'</tbody></table></div>'
    :'';
  /* 本期没有抓取记录，不等于本期没有研报：复用上一轮已入库语料的那一周
   * （如 2026-08-26）不产生 feed_runs 行，可它的 400 多篇就在库里。
   * 只看抓取表就会告诉读者「这期没有」，而点进去明明有。 */
  var curN=corpusPeriodN(w.as_of);
  if(!rows.length&&curN){
    feedTable='<div class="card-note" style="margin-top:var(--space-4)">'
      +'本期没有新的抓取记录——这一期复用了已入库的研报。'
      +'<button type="button" class="exp-btn" onclick="openCorpus(\''+jss(w.as_of)+'\')">浏览这 '+fmtInt(curN)+' 篇 ›</button></div>';
  }
  return body+breakdown+topicChips+feedTable+pastCorpusList(w.as_of)
    +epi('本期全部判断的唯一信息来源，4 种生成方法共用同一份');
}

/* ── 往期研报：这一列本来只可能有一个值 ──────────────────────────────
 * 来源表有一栏「期次」，但它只画本期那一行，于是那一栏永远只有一个值——
 * 一个只能取一个值的坐标轴不是坐标轴。历史各期的语料一直都在库里
 * （/api/corpus?as_of= 随时能取），只是这里没有入口。把入口摆出来。 */
function corpusPeriods(){return (S&&S.corpus_periods)||[]}
function corpusPeriodN(asOf){
  var hit=corpusPeriods().filter(function(x){return x.as_of===asOf})[0];
  return hit?hit.n:null;
}
function pastCorpusList(curAsOf){
  var past=corpusPeriods().filter(function(x){return x.as_of!==curAsOf});
  if(!past.length)return '';
  return '<div style="margin-top:var(--space-5)">'
    +'<div class="card-note" style="margin-bottom:6px">往期研报 · 共 '+fmtInt(past.length)+' 期'
    +'<span class="gloss gm" title="每一期读到的 = 截至该期日期的 3 天窗口内入库的全部研报，与本期同一口径。历史各期一直存着，点开就是当时读到的那一份。">ⓘ</span>：</div>'
    +'<div class="table-wrap"><table>'
    +'<thead><tr><th>期次</th><th class="r">条数</th><th>窗口</th></tr></thead><tbody>'
    +past.map(function(x){
      var win=(x.window&&x.window.length)?(x.window[x.window.length-1].slice(5)+' ~ '+x.window[0].slice(5)):'';
      return '<tr class="expandable" onclick="openCorpus(\''+jss(x.as_of)+'\')" title="点开浏览这一期存了哪些研报">'
        +'<td class="mono primary">'+esc(x.as_of)+'</td>'
        +'<td class="r num">'+fmtInt(x.n)+'</td>'
        +'<td class="mono">'+esc(win)+' <span class="exp-btn">浏览 ›</span></td></tr>';
    }).join('')
    +'</tbody></table></div></div>';
}

/* ── 2 · 筛选A：主题评分（focus = 主题 id：该行高亮+证据就地展开，其余压暗） ── */
/* 落选理由——用当时打分本身算出来的，不是事后编的说法。
 * 把落选主题的四个加权贡献，与入选主题在同一因子上的平均贡献相减，
 * 差得最多的那一项就是它的短板；再报出与入选线的分差。
 * 「差 0.1 分」只说明结果，「短板在 G 分歧」才说明原因。 */
function topicLossReason(r,avgComps,cutScore){
  var SEGL2=['H 热度','G 分歧','E 实据','P 已定价'];
  var comps=[0.30*(r.H||0),0.25*(r.G||0),0.25*(r.E||0),0.20*(100-(r.P||0))];
  var worst=0,worstGap=comps[0]-avgComps[0];
  for(var i=1;i<4;i++){var g=comps[i]-avgComps[i];if(g<worstGap){worstGap=g;worst=i}}
  var gap=(cutScore!==null&&r.score!==undefined)?(cutScore-(r.score||0)):null;
  var vals=[r.H,r.G,r.E,r.P];
  var txt='';
  /* 分差已经写在行末，这里只说原因：短在哪个因子、短多少 */
  if(worstGap<-0.2){
    txt='主要失分项 <b>'+SEGL2[worst]+'</b>（本主题 '+numOr(vals[worst])
      +(worst===3?'，该项反向计分，数值越低越好':'')+'，低于入选主题均值 '+Math.abs(worstGap).toFixed(1)+' 分）';
  }else{
    txt='四项因子均无明显缺口，综合分低于入选名额内主题';
  }
  /* 分差在行末已经印过一次（「差 0.1 分」）。这里再写「距入选线 0.1 分」，
   * 是同一个数换个说法说第二遍，读者会以为是两个不同的量。 */
  return txt;
}

function stageTopicsBody(d){
  var foc=(d&&d.f)?String(d.f):null;
  var w=S.weekly||{};
  var hgep=topicArm('hgep'),ctrl=topicArmNot('hgep');
  var chosenSet={};topicChosen('hgep').forEach(function(t){chosenSet[t]=1});
  var ctrlChosen={};(ctrl?(ctrl.chosen||[]):[]).forEach(function(t){ctrlChosen[t]=1});
  if(!(hgep&&hgep.scores&&Object.keys(hgep.scores).length)){
    return '<div class="empty-sm">本期评分尚未产出'+(w.in_flight?'，进行中，稍后自动刷新':'')+'</div>';
  }
  var rows=Object.keys(hgep.scores).map(function(k){var o=hgep.scores[k];o._id=k;return o});
  rows.sort(function(a,b){return (b.score||0)-(a.score||0)});
  var maxScore=Math.max.apply(null,rows.map(function(r){return r.score||0}).concat([1]));
  var cutScore=null,cutIdx=-1;
  rows.forEach(function(r,i){if(chosenSet[r._id]){cutIdx=i;if(cutScore===null||((r.score||0)<cutScore))cutScore=r.score||0}});
  var cScores=(ctrl&&ctrl.scores)||{};
  var cRank={},cMax=1;
  Object.keys(cScores).sort(function(a,b){return ((cScores[b]||{}).score||0)-((cScores[a]||{}).score||0)})
    .forEach(function(k,i){cRank[k]=i+1;cMax=Math.max(cMax,(cScores[k]||{}).score||0)});
  /* 入选主题在每个因子上的平均加权贡献——落选理由的参照系 */
  var inRows=rows.filter(function(r){return chosenSet[r._id]});
  var avgComps=[0,0,0,0];
  if(inRows.length){
    inRows.forEach(function(r){
      avgComps[0]+=0.30*(r.H||0);avgComps[1]+=0.25*(r.G||0);
      avgComps[2]+=0.25*(r.E||0);avgComps[3]+=0.20*(100-(r.P||0));
    });
    avgComps=avgComps.map(function(v){return v/inRows.length});
  }
  var SEGC=['var(--color-data-1)','var(--color-data-2)','var(--color-data-3)','var(--color-data-4)'];
  var SEGL=['H 热度','G 分歧','E 实据','P 已定价'];
  var SEGW=[0.30,0.25,0.25,0.20];
  var SEGG=[HGEP_GLOSS.H,HGEP_GLOSS.G,HGEP_GLOSS.E,HGEP_GLOSS.P];
  /* 这排药丸只列入选的 5 个，下面的表却有全部主题（含落选）——两边不是同一份
   * 清单，却长得像同一个筛选器；聚焦在落选主题上时药丸还一个都不亮。
   * 表本身就是清单，点行即可，这里只留状态。 */
  var inDrawer=!!(d&&d.p!==undefined);
  var tabs=foc?focusBar(inDrawer?'':foc+(topicLabel(foc)?'　'+topicLabel(foc):''),'主题'):'';
  var agree0=topicChosen('hgep').filter(function(t){return ctrlChosen[t]});
  var hOnly0=topicChosen('hgep').filter(function(t){return !ctrlChosen[t]});
  var cOnly0=(ctrl?(ctrl.chosen||[]):[]).filter(function(t){return !chosenSet[t]});
  /* 三串主题名。名字读不懂，「两种打分重合几个」这句话就只剩下那个分数。 */
  var tn=function(a){return a.map(function(t){return esc(topicName(t))}).join('·')||'—'};
  var disLine=ctrl?'<div class="card-note" style="margin-bottom:var(--space-3)">两种打分重合 '+agree0.length+'/'+topicChosen('hgep').length+'：双选 '+tn(agree0)
    +'；仅语义打分 '+tn(hOnly0)+'；仅计数打分 '+tn(cOnly0)+'</div>':'';
  var inHTML='',outHTML='';
  rows.forEach(function(r,ri){
    var rowHTML='';
    var isIn=!!chosenSet[r._id];
    var focCls=foc?(r._id===foc?' foc':' dim'):'';
    var barPct=Math.max(2,(r.score||0)/maxScore*100);
    /* P 是「已定价」，越低越好——计分用 (100 − P)，与后端 WEIGHTS 同口径 */
    var comps=[0.30*(r.H||0),0.25*(r.G||0),0.25*(r.E||0),0.20*(100-(r.P||0))];
    var wsum=comps.reduce(function(a,b){return a+b},0);
    var segs='';
    /* 落选行同样画出四个因子的构成，只是压暗：落选的理由是「哪一段短了」，
     * 一根没有分段的灰条把这个理由抹掉了，读者只能看到结果看不到原因。 */
    if(wsum>0){
      var vals=[r.H,r.G,r.E,r.P];
      segs=comps.map(function(c,i){
        return '<div class="race-seg" style="width:'+(c/wsum*100).toFixed(1)+'%;background:'+SEGC[i]+(isIn?'':';opacity:.34')+'" title="'+SEGG[i]+'。本主题 '+SEGL[i].slice(0,1)+' = '+numOr(vals[i])+'（权重 '+SEGW[i].toFixed(2)+(i===3?'，反向计分':'')+'，贡献 '+c.toFixed(1)+' 分）"></div>';
      }).join('');
    }else{
      segs='<div class="race-seg" style="width:100%;background:var(--color-surface-sunken)" title="未入选——综合分 '+numOr(r.score)+'"></div>';
    }
    var cnt='';
    var cs=cScores[r._id];
    if(cs){
      var pos=Math.max(3,Math.min(97,((cs.score||0)/cMax)*100));
      var hR=ri+1;
      var dotTip;
      var gap0=(cutScore!==null&&r.score!==undefined)?(cutScore-(r.score||0)):null;
      if(ctrlChosen[r._id]&&isIn)dotTip='计数打分第 '+cRank[r._id]+' 名，HGEP 第 '+hR+' 名 · 两种打分均选入';
      else if(ctrlChosen[r._id])dotTip='计数打分第 '+cRank[r._id]+' 名并选入，HGEP 未选入'+(gap0!==null?'（差 '+gap0.toFixed(1)+' 分）':'')+' · 两种打分分歧项';
      else if(isIn)dotTip='计数打分第 '+cRank[r._id]+' 名未选入前 5，HGEP 第 '+hR+' 名并选入 · 两种打分分歧项';
      else dotTip='计数打分第 '+cRank[r._id]+' 名，HGEP 第 '+hR+' 名 · 两种打分均未选入';
      dotTip+=' · 提及 '+fmtInt(cs.mentions!==undefined?cs.mentions:cs.score)+' 次。'+COUNT_GLOSS;
      cnt='<span class="race-cnt'+(ctrlChosen[r._id]?' pick':'')+'" style="left:'+pos.toFixed(1)+'%" title="'+esc(dotTip)+'">#'+cRank[r._id]+'</span>';
    }
    var side;
    if(isIn){
      side='<span class="sc num">'+numOr(r.score)+'</span>'
        +(ctrlChosen[r._id]?'<span class="d" title="两种打分均选入前 5">双选</span>':(cs?'<span class="d" title="仅语义打分选入">仅语义打分</span>':''));
    }else{
      var gap=(cutScore!==null&&r.score!==undefined)?(cutScore-(r.score||0)):null;
      side='<span class="sc num">'+numOr(r.score)+'</span><span class="d">'+(gap!==null?'差 '+gap.toFixed(1)+' 分':'落选')+(ctrlChosen[r._id]?' · <span style="color:var(--color-text-brand)">仅计数打分</span>':'')+'</span>';
    }
    rowHTML+='<button type="button" class="race-row'+(isIn?'':' lost')+focCls+'" id="topicrow-'+esc(r._id)+'" onclick="'+(foc===r._id?'setDrawerFocus(null)':'setDrawerFocus(\''+jss(r._id)+'\')')+'" title="'+(foc===r._id?'回到全景':'只看这一个主题：其余压暗，并就地展开它的研报证据')+'">'
      +'<span class="race-name"><span class="id">'+esc(r._id)+'</span><span class="lbl">'+esc(r.label||'')+'</span></span>'
      +'<span class="race-track"><span class="race-bar" style="width:'+barPct.toFixed(1)+'%">'+segs+'</span>'+cnt+'</span>'
      +'<span class="race-side">'+side+'</span>'
      +'</button>';
    if(!isIn){
      rowHTML+='<div class="race-why"><span class="w">'+topicLossReason(r,avgComps,cutScore)+'</span></div>';
    }
    if(foc===r._id){
      rowHTML+='<div class="race-detail" style="margin-top:6px">'+topicDrawerBody(r._id,true)+'</div>';
    }
    if(isIn)inHTML+=rowHTML; else outHTML+=rowHTML;
  });
  var nIn=topicChosen('hgep').length,nOut=rows.length-nIn;
  /* 整步追问的入口放在这一层最上面：读者看完这张表最先冒出来的问题是
   * 「凭什么是这几个」，而不是某一个主题的细节。整步追问交给模型的是
   * 完整打分表 + 计数对照打分，不附研报正文——这一步的取舍就是在表上做的。 */
  var askStep='<div style="margin:0 0 var(--space-3)">'+askBtn('selection','topics')+'</div>';
  var legend='<div class="race-legend">'
    +'<span><span class="sw" style="background:var(--color-data-1)"></span>H 热度<span class="gloss gm" title="'+esc(HGEP_GLOSS.H)+'">ⓘ</span></span>'
    +'<span><span class="sw" style="background:var(--color-data-2)"></span>G 分歧<span class="gloss gm" title="'+esc(HGEP_GLOSS.G)+'">ⓘ</span></span>'
    +'<span><span class="sw" style="background:var(--color-data-3)"></span>E 实据<span class="gloss gm" title="'+esc(HGEP_GLOSS.E)+'">ⓘ</span></span>'
    +'<span><span class="sw" style="background:var(--color-data-4)"></span>P 已定价<span class="gloss gm" title="'+esc(HGEP_GLOSS.P)+'">ⓘ</span></span>'
    +'<span><span class="sw" style="background:var(--color-data-1);opacity:.34"></span>落选</span>'
    +'<span><span class="race-cnt pick" style="position:static;transform:none;display:inline-flex;margin-right:5px">2</span>计数打分亦选入</span>'
    +'<span><span class="race-cnt" style="position:static;transform:none;display:inline-flex;margin-right:5px">7</span>计数打分未选入<span class="gloss gm" title="'+esc('圈内数字 = 计数对照打分对同一主题的排名。'+COUNT_GLOSS)+'">ⓘ</span></span>'
    +'</div>';
  var html=tabs+askStep+legend+disLine
    +'<div class="race-sec"><div class="race-sec-h"><span class="t">入选 · '+nIn+'</span><span class="s">进入筛选B，各生成方法据此写想法</span></div>'
    +'<div class="race">'+inHTML+'</div></div>'
    +(nOut?('<div class="race-sec lost"><div class="race-sec-h"><span class="t">落选 · '+nOut+'</span><span class="s">按综合分排序，每条标注落选理由与分差</span></div>'
      +'<div class="race">'+outHTML+'</div></div>'):'');
  if(foc&&d&&!d.scrolled){drawerScrollSel='#topicrow-'+foc;d.scrolled=true}
  return html+epi('语义打分相对计数打分的增量尚未验证，计数对照打分每周并行记录');
}

/* ── 主题证据抽屉（第 2/3 层） ── */
function topicDrawerBody(tid,embedded){
  var w=S.weekly||{};
  var hgep=topicArm('hgep'),ctrl=topicArmNot('hgep');
  var r=((hgep&&hgep.scores)||{})[tid];
  var ev=((w.evidence)||{})[tid];
  var chosen=topicChosen('hgep').indexOf(tid)>=0;
  var ctrlChosen=(ctrl?(ctrl.chosen||[]):[]).indexOf(tid)>=0;
  var html='',head='';
  if(r){
    if(!embedded){
      head='<div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:var(--space-2)">'
        +'<span style="font:600 20px/28px var(--font-sans);color:var(--color-text-primary)">'+esc(r.label||tid)+'</span>'
        +(chosen?badge('success','入选'):badge('neutral','落选'))
        +(ctrl?'<span class="card-note">计数打分：'+(ctrlChosen?'选入':'未选入')+'</span>':'')
        +'</div>';
    }
    /* 落选理由：内嵌时正上方那一行已经写了，不重复第二遍 */
    if(!chosen&&!embedded){
      var allSc=(hgep&&hgep.scores)||{};
      var inIds=topicChosen('hgep');
      var aC=[0,0,0,0],cut=null;
      inIds.forEach(function(t){
        var o=allSc[t]||{};
        aC[0]+=0.30*(o.H||0);aC[1]+=0.25*(o.G||0);aC[2]+=0.25*(o.E||0);aC[3]+=0.20*(100-(o.P||0));
        if(o.score!==undefined&&(cut===null||o.score<cut))cut=o.score;
      });
      if(inIds.length)aC=aC.map(function(v){return v/inIds.length});
      html+='<div class="rej-why">落选依据：'+topicLossReason(r,aC,cut)+'</div>';
    }
    /* 「P 来源」删掉：上面拆解里那个「未取到行情」标签说的是同一件事，
     * 同一个抽屉里同一个事实不讲两遍。 */
    html+=hgepBreakdown(r)
      +'<div class="derive-kv">'
      +'<span>证据 '+fmtInt(r.n_evidence)+' 条 · '+fmtInt(r.n_institutions)+' 家机构</span>'
      +'<span class="kv-t">指示标的 '+esc(r.indicator||'—')+'</span>'
      +'</div>';
  }else{
    html+='<div class="empty-sm" style="margin-bottom:var(--space-4)">语义打分本期无 '+esc(tid)+' 的评分记录</div>';
  }
  /* 词表命中的那份原始清单是这一组的最底层，体量最大。从前它整段铺在
   * 结论下面，一打开抽屉主视线就被它吃掉。收进盖子。 */
  if(ev){
    var docs=ev.docs||[];
    html+=foldBlock('topic.ev.'+tid,'词表命中研报','点任意一篇看摘要、凭据与全文',
        '<div class="card-note" style="margin-bottom:8px">按'+esc(ev.matched_on||'标题关键词')
        +'命中。与上面「证据 '+fmtInt(r&&r.n_evidence)+' 条」不是同一套口径——那是打分内部的计数，两个数都摆出来。</div>'
        +'<div class="ev-list scroll-thin">'+docs.map(function(dd,di){return docRowHTML(dd,'td-'+esc(tid)+'-'+di)}).join('')+'</div>'
        +(ev.truncated?'<div style="font:400 12px/16px var(--font-sans);color:var(--color-text-tertiary);margin-top:6px">另有 '+fmtInt(ev.truncated)+' 条未显示</div>':''),
        fmtInt(ev.n)+' 条');
  }else{
    var ee=(w&&w.evidence_error)||'';
    html+=ee
      ? '<div class="empty-sm" style="color:var(--color-feedback-warning-text)">词表命中清单这次没取出来——不是这个主题没有研报。服务端报的原因：'+esc(ee)+'</div>'
      : '<div class="empty-sm">这个主题没有词表命中的研报清单'+(r?'（打分依据的证据计数见上）':'')+'</div>';
  }
  /* 追问是「证据」这一组的最后一格：读完分数和研报还是不服气，就问它本人。
   * 它从前单占一行浮在两段中间，看着像个和上下文无关的功能按钮。 */
  html+='<div style="margin-top:var(--space-4)">'+askBtn('topic',tid)+'</div>';

  /* ── 第二组：产出 ── 这主题被选中之后，实际写出了什么。
   * 它和上面那一组回答的不是同一个问题，从前却和「证据 N 条」挤在同一行。 */
  var nIdeas=poolCountBy('topic',tid);
  html='<div class="dgrp"><div class="dgrp-h">证据<span class="sub">这主题凭什么'+(chosen?'入选':'落选')+'</span></div>'+html+'</div>'
    +'<div class="dgrp"><div class="dgrp-h">产出<span class="sub">它在本期写出了什么</span></div>'
    +(nIdeas>0
      ? '<button type="button" class="exp-btn" onclick="filterPool(\'topic\',\''+jss(tid)+'\',\'主题 '+esc(tid)+'\')">该主题产出的 '+fmtInt(nIdeas)+' 条候选 ›</button>'
        /* 这个抽屉常常从持仓页点进来，而持仓页上那一行是「跨 5 期、筛选C 之后、
           现在还在场」的标的，这里是「只有本期、筛选C 之前、不管有没有被选中」
           的候选。两个数天然不等，不说清楚就会被当成对不上。 */
        +'<div class="card-note" style="margin-top:6px">本期（'+esc(((S||{}).weekly||{}).as_of||'')+'）合并后候选池里属于这个主题的条数，'
        +'在<b>筛选C 之前</b>——和持仓页上那一行不是一个数：那边是筛选C 之后、跨多期、且现在还在场的标的。</div>'
      : '<div class="empty-sm">'+(chosen?'想法还没产出':'落选主题不进入筛选B，没有产出')+'</div>')
    +'</div>';
  return head+html;
}

/* ── 3 · 筛选B：生产网格（focus = 方法：焦点头 + 独有标的 + 重合率，其余行压暗） ── */
function stageGeneratorsBody(d){
  var w=S.weekly||{};
  var gens=w.generators||[];
  var chosen=topicChosen('hgep');
  var cands=((w.pool)||{}).candidates||[];
  if(!(gens.length&&chosen.length)){
    return '<div class="empty-sm">想法尚未产出'+(w.in_flight?'，筛选A 完成后 4 种方法并行生成':'')+'</div>';
  }
  /* 归一 focus 到 GEN_ORDER 的 key */
  var focKey=null;
  if(d&&d.f){
    var fo=genOrder().find(function(o){return o[0]===d.f||methodName(o[0])===methodName(d.f)});
    if(fo)focKey=fo[0];
  }
  /* 药丸列 4 种方法，下面网格的第一列也列同样 4 种方法，只有药丸能点——
   * 读者在网格里点方法名没反应，只好回到上面再点一次。现在反过来：
   * 网格里的方法名就是入口，这里只留状态。 */
  var focRow=focKey?genOrder().find(function(o){return o[0]===focKey}):null;
  var tabs=focRow?focusBar((d&&d.p!==undefined)?'':focRow[1],'方法'):'';
  /* 焦点头：它是谁 · 产出 · 独有标的（方法间最真实的 diff）· 重合率 */
  var focusHead='';
  if(focKey){
    var fo2=genOrder().find(function(o){return o[0]===focKey});
    var fg=genByKey(focKey);
    var mine=cands.filter(function(c){return (c.proposed_by||[]).indexOf(focKey)>=0});
    var uniq=mine.filter(function(c){
      var st={};(c.proposed_by||[]).forEach(function(m){st[m]=1});
      return Object.keys(st).length===1;
    });
    var overlap=mine.length-uniq.length;
    var pct=mine.length?Math.round(overlap/mine.length*100):0;
    focusHead='<div class="focus-head">'
      +'<b>'+esc(fo2[1])+'</b><span class="tag tag-brand" style="margin-left:6px">'+esc(fo2[2])+'</span>'
      +'<span style="margin-left:6px">'+pathTag(GEN_PATH[focKey])+'</span>'
      /* 说明与例子在方法卡片里已经是 genGlossTitle 的 ⓘ；这里曾把同一份内容
         铺成两行正文，同一个东西两种读法。统一收进 ⓘ。 */
      +'<span class="gloss gm" style="margin-left:6px" title="'+esc(genGlossTitle(fo2))+'">ⓘ</span>'
      +'<div style="margin-top:6px">'
      +(fg?'本期产出 <b class="num">'+fmtInt(fg.n)+'</b> 条 · 被拒 <b class="num">'+fmtInt(fg.rejected||0)+'</b> 条 · 合并后在池 <b class="num">'+fmtInt(mine.length)+'</b> 条。':'本期没有它的产出记录。')
      +'</div>'
      +'<div style="margin-top:6px"><b>独有标的 '+fmtInt(uniq.length)+' 个</b>（仅该方法提出）：'
      +(uniq.length?'<span style="display:inline-flex;flex-wrap:wrap;gap:4px;vertical-align:middle;margin-left:4px">'
        +uniq.map(function(c){return '<button type="button" class="tag tag-brand mono" style="cursor:pointer" title="'+esc(c.instrument_name||'')+' · '+esc(c.topic_id||'')+' — 在候选池里看这条" onclick="filterPoolCode(\''+jss(c.instrument_id)+'\')">'+esc(c.instrument_id)+' ›</button>'}).join('')
        +'</span>':'<span style="color:var(--color-text-tertiary)">本期无独有标的</span>')
      +'</div>'
      +'<div style="margin-top:4px;color:var(--color-text-metadata)">与其他方法重合 <b class="num">'+fmtInt(overlap)+'</b> / '+fmtInt(mine.length)+' 条（'+pct+'%）'+glossMark('各方法读取同一批研报，重合不构成独立证据。')+'</div>'
      +'</div>';
  }
  var perMax=1,target=null;
  genOrder().forEach(function(o){
    var g=genByKey(o[0]);if(!g)return;
    var per=(g.meta||{}).per_topic||{};
    chosen.forEach(function(t){perMax=Math.max(perMax,per[t]||0)});
    if((g.meta||{}).target_per_topic)target=g.meta.target_per_topic;
  });
  /* 两侧固定列在抽屉里会把网格顶出 34px，最右的「合计」被裁掉。
   * 给它们一个可压缩的下限：宽处照旧，窄处先让固定列让步，而不是让内容出界。 */
  var cols='minmax(112px,150px) '+chosen.map(function(){return 'minmax(72px,1fr)'}).join(' ')+' minmax(104px,130px)';
  var html='<div class="pgrid-wrap scroll-thin"><div class="pgrid" style="grid-template-columns:'+cols+'">';
  html+='<div class="pg-h" style="justify-content:flex-start;align-items:flex-end;text-align:left">方法 ＼ 主题</div>';
  chosen.forEach(function(t){html+='<div class="pg-h zh" title="'+esc(t)+'">'+esc(topicName(t))+'</div>'});
  html+='<div class="pg-h" style="justify-content:flex-end;text-align:right">合计</div>';
  genOrder().forEach(function(o){
    var g=genByKey(o[0]);
    var isFoc=focKey===o[0];
    var dimS=(focKey&&!isFoc)?';opacity:.35':'';
    html+='<button type="button" class="pg-m'+(isFoc?' foc':'')+'" style="padding:2px 6px'+dimS+'"'
      +' onclick="setDrawerFocus('+(isFoc?'null':'\''+o[0]+'\'')+')"'
      +' title="'+(isFoc?'回到全景':'只看这一种方法：其余压暗，并展开它的独有标的与重合率')+'">'
      +'<span class="t">'+esc(o[1])+'<span class="gloss gm" title="'+esc(genGlossTitle(o))+'">ⓘ</span></span>'
      +'<span class="s">'+esc(o[2])+'</span></button>';
    if(g){
      var per=(g.meta||{}).per_topic||{};
      chosen.forEach(function(t){
        var n=per[t]||0;
        if(n){
          var a=(0.08+0.55*n/perMax).toFixed(2);
          html+='<button type="button" class="pg-cell" style="background:rgba(47,131,85,'+a+')'+dimS+'" title="'+esc(o[1])+' × '+esc(t)+'：写出 '+n+' 条'+(target?'（目标 '+target+' 条/主题）':'')+' — 点击在候选池抽屉查看合并后的这批" onclick="filterPoolMT(\''+jss(g.method)+'\',\''+jss(t)+'\')">'+n+'<span class="u">条</span></button>';
        }else{
          html+='<div class="pg-cell empty" style="min-height:52px'+dimS+'" title="'+esc(o[1])+' × '+esc(t)+'：0 条">0</div>';
        }
      });
      var warn=[];
      var meta=g.meta||{};
      if(meta.truncated&&Object.keys(meta.truncated).length)warn.push('有截断');
      var noc=meta.topics_without_corpus_match;
      if(noc&&noc.length)warn.push('缺研报:'+noc.join('/'));
      html+='<div class="pg-tail" style="'+(dimS?dimS.slice(1):'')+'"><span>产出 <b>'+fmtInt(g.n)+'</b>'+(target?' / 目标 '+fmtInt(target*chosen.length):'')+'</span>'
        +'<span>被拒 <b>'+fmtInt(g.rejected||0)+'</b> 条'+(warn.length?' · <span style="color:var(--color-feedback-warning-text)">'+esc(warn.join(' '))+'</span>':'')+'</span></div>';
    }else{
      chosen.forEach(function(){html+='<div class="pg-cell empty" style="'+(dimS?dimS.slice(1):'')+'">—</div>'});
      html+='<div class="pg-tail"><span style="color:var(--color-text-tertiary)">'+(w.in_flight?'正在写':'无产出')+'</span></div>';
    }
  });
  html+='</div></div>';
  var total=gens.reduce(function(a,g){return a+(g.n||0)},0);
  return tabs+focusHead
    +pathLegend(GEN_PATH,genOrder().map(function(o){return o[0]}))
    +'<div class="quiet" style="margin-bottom:var(--space-3)">4 种方法 × '+chosen.length+' 个主题并行生成，彼此独立 '+glossMark('每条想法是 1 个月期限的结构化输出，含概率、上下行情景与论点。四种方法互不可见。')+' · 本期合计 <b class="num" style="color:var(--color-text-primary)">'+fmtInt(total)+'</b> 条 · 色深 = 产量'
+'</div>'
    +html
    +epi('目标为每方法每主题 '+(target||20)+' 条；未写满不补足，缺口本身为观测量');
}

/* ── 4 · 合并候选池 ── */
function stagePoolBody(d){
  var focTier=(d&&d.f)?String(d.f):null;
  var w=S.weekly||{};
  var pool=w.pool||{},cands=pool.candidates||[];
  var gens=w.generators||[];
  var raw=gens.reduce(function(s,g){return s+(g.n||0)},0);
  var conv=pool.convergence||{};
  var head,merge='';
  if(pool.n){
    head='<div class="merge-line">'
      +'<span class="big">'+fmtInt(raw)+'</span><span class="quiet">条原始想法</span>'
      +'<span class="arr">→ 同一标的合并、赔率取中位数 →</span>'
      +'<span class="big">'+fmtInt(pool.n)+'</span><span class="quiet">条候选（一标一条）</span>'
      +'</div>'
      +'<div class="card-note" style="margin-bottom:var(--space-2)">按跨方法共识度分档 '+glossMark(CONV_GLOSS)+'</div>';
    /* 共识度 = 几种不同方式提出（与 API convergence 同口径） */
    var groups={};cands.forEach(function(c){
      var uniq={};(c.proposed_by||[]).forEach(function(m){uniq[m]=1});
      var k=String(Object.keys(uniq).length||1);
      (groups[k]=groups[k]||[]).push(c);
    });
    var BUBBG={'4':'var(--color-surface-brand-sunken)','3':'var(--color-surface-brand-highlight)','2':'var(--color-surface-brand-muted)','1':'var(--color-surface-brand-subtle)'};
    ['4','3','2','1'].forEach(function(k){
      var arr=groups[k];if(!arr||!arr.length)return;
      arr.sort(function(a,b){return String(a.instrument_id).localeCompare(String(b.instrument_id))});
      var d=34+(Number(k)-1)*10;
      var gFoc=focTier?(k===focTier?' foc':' dim'):'';
      merge+='<div class="bub-group'+gFoc+'" style="padding-left:6px;padding-right:6px">'
        +'<div class="bub-k"><div class="t">'+convLabel(k)+'<span class="gloss gm" title="'+esc(CONV_GLOSS)+'">ⓘ</span></div><div class="s">'+fmtInt(conv[k]!==undefined?conv[k]:arr.length)+' 条'+(k==='4'?' · 最高共识':'')+'</div></div>'
        +'<div class="bub-cloud">'
        +arr.map(function(c){
          return '<button type="button" class="bub" style="width:'+d+'px;height:'+d+'px;background:'+BUBBG[k]+';box-shadow:inset 0 0 0 1px var(--color-border-brand-subtle)" '
            +'title="'+esc(c.instrument_id)+' '+esc(c.instrument_name||'')+' · 主题 '+esc(c.topic_id||'')+' · 上行 '+fmtPct(c.upside_pct)+' / 下行 '+fmtPct(c.downside_pct)+' — 点击在下方全表定位" '
            +'onclick="filterPoolCode(\''+jss(c.instrument_id)+'\')">'+esc(c.instrument_id)+'</button>';
        }).join('')
        +'</div></div>';
    });
    merge+=epi('各生成方法读取同一批研报，共识度不构成独立证据，仅作记录，不参与打分');
  }else{
    head='<div class="empty-sm">候选池尚未合并'+(w.in_flight?'，各生成方法完成后自动合并':'')+'</div>';
  }
  var candCard;
  if(cands.length){
    var flt='';
    if(poolFilter){
      var matched=cands.filter(poolMatch).length;
      flt='<div class="filter-bar">'+fmtInt(cands.length)+' 条中的 '+fmtInt(matched)+' 条 · 筛选条件：'+esc(poolFilter.label)
        +'<button type="button" class="exp-btn" style="padding:0 4px" onclick="clearPoolFilter()" aria-label="清除筛选">×</button></div>';
    }
    candCard='<div id="candCard" style="margin-top:var(--space-6)">'
      +'<div class="card-title-row"><h2 class="card-title" style="margin-bottom:0">候选池全表</h2><span class="card-note">'+fmtInt(cands.length)+' 条 · 列头排序</span></div>'
      +flt
      +'<div class="table-wrap scroll-y scroll-thin" style="margin-top:var(--space-3)"><table id="candTable" class="dense">'
      +'<thead><tr>'+candTh('instrument_id','标的')+candTh('instrument_name','名称')+candTh('topic_id','主题')
      +candTh('upside_pct','上行','r')+candTh('downside_pct','下行','r')
      +candTh('p_up','P↑','r')+candTh('p_base','P基','r')+candTh('p_down','P↓','r')
      +candTh('n_proposals','提出','r')+'<th>生成方法 '+glossMark('一行四个点，按 '+genOrder().map(function(o){return o[1]}).join(' · ')+' 排列；亮 = 该方法提出了这条。展开「详情」看方法名与各自的论点。')+'</th><th class="r">当时的理由</th></tr></thead>'
      +'<tbody id="candBody"></tbody></table></div>'
      +epi('赔率低于 1.5 的想法不进入候选池')
      +'</div>';
  }else{
    candCard='<div id="candCard" style="margin-top:var(--space-6)"><h2 class="card-title">候选池全表</h2>'
      +'<div class="empty-sm">候选池是空的'+(w.in_flight?'——合并完成后自动出现':'')+'</div></div>';
  }
  return head+merge+candCard;
}

/* ── 5 · 筛选C：闸门矩阵 ── */
function stageSelectorsBody(d){
  var foc=(d&&d.f)?String(d.f):null;
  var w=S.weekly||{};
  var sels=orderedSelectors();
  var cands=((w.pool)||{}).candidates||[];
  var books=currentBooks();
  if(!sels.length){
    return '<div class="empty-sm">本期选取策略尚未执行'+(w.in_flight?'，候选池合并后开始':'')+'</div>';
  }
  /* 同上：药丸和下面的策略卡片列的是同一批策略。入口收敛到卡片本身。 */
  var tabs=(foc?focusBar((d&&d.p!==undefined)?'':selMetaOf(foc)[1],'策略'):'')
    +pathLegend(SEL_PATH,sels.map(function(sl){return sl.name}))
    +(foc?'':'<div class="card-note" style="margin-bottom:var(--space-2)">点策略名只看它：其余压暗，并展开它放行的标的</div>');
  var focusHead='';
  if(foc){
    var fs=sels.find(function(x){return x.name===foc});
    var fm=selMetaOf(foc);
    if(fs){
      var ids=(fs.chosen||[]).map(selChosenId);
      var hasB=books.some(function(b){return b.selector===foc});
      focusHead='<div class="focus-head">'
        +'<b>'+esc(fm[1])+'</b><span class="tag tag-brand" style="margin-left:6px">'+esc(fm[3])+'</span><span class="tag" style="margin-left:4px">'+esc(fm[2])+'</span>'
        +'<span style="margin-left:6px">'+pathTag(SEL_PATH[foc])+'</span>'
        +'<span class="gloss gm" style="margin-left:6px" title="'+esc(selPlain(foc))+'">ⓘ</span>'
        +'<div style="margin-top:6px"><b>它放行的 '+fmtInt(ids.length)+' / '+fmtInt(cands.length)+' 条</b>：'
        +(ids.length?'<span style="display:inline-flex;flex-wrap:wrap;gap:4px;vertical-align:middle;margin-left:4px">'
          +ids.map(function(id){return '<button type="button" class="tag tag-brand mono" style="cursor:pointer" title="在候选池里看这条" onclick="filterPoolCode(\''+jss(id)+'\')">'+esc(id)+' ›</button>'}).join('')
          +'</span>':'<span style="color:var(--color-text-tertiary)">空仓：无标的达到门槛，留存现金</span>')
        +'</div>'
        +(hasB?'<div style="margin-top:4px"><button type="button" class="exp-btn" onclick="openBookDrawer(\''+jss(foc)+'\')">该组合的持仓与净值 ›</button></div>':'')
        +'</div>';
    }
  }
  var legend='<div class="sel-legend">'
    +sels.map(function(s,i){
      var m=selMetaOf(s.name);
      var isCtl=m[2]==='对照';
      var hasBook=books.some(function(b){return b.selector===s.name});
      var fCls=foc?(s.name===foc?' foc':' dim'):'';
      return '<div class="sel-leg'+fCls+'" id="selleg-'+i+'" style="background:'+(isCtl?'var(--color-feedback-neutral-subtle)':'var(--color-surface-brand-subtle)')+'">'
        +'<button type="button" class="nm nm-btn" onclick="setDrawerFocus('+(foc===s.name?'null':'\''+jss(s.name)+'\'')+')"'
          +' title="'+(foc===s.name?'回到全景':'只看这一个策略：其余压暗，并展开它放行的标的')+'">'+esc(m[1])+'</button>'
        +'<span class="tag" style="flex:none">'+esc(m[2])+'</span>'
        +'<span class="bel"><b style="color:var(--color-text-brand)">'+esc(m[3])+'</b><span class="gloss gm" title="'+esc(selPlain(s.name))+'">ⓘ</span>　<b class="num" style="color:var(--color-text-primary)">'+fmtInt((s.chosen||[]).length)+' 只</b>'
        +((s.chosen||[]).length?'　<button type="button" class="exp-btn" onclick="filterPool(\'selector\',\''+jss(s.name)+'\',\'策略 '+esc(m[1])+'\')">回候选池 ›</button>':'　<span style="color:var(--color-text-tertiary)">空仓：无标的达到门槛，留存现金</span>')
        +(hasBook?'　<button type="button" class="exp-btn" onclick="openBookDrawer(\''+jss(s.name)+'\')">该组合 ›</button>':'')
        +'</span>'
        /* 追问按钮原本挂在 .bel 末尾，于是它的左边缘跟着每行文字的长度走——
         * 十行策略十个位置，看着像没排过版。挪出来当 .sel-leg 的直接子元素，
         * 用 margin-left:auto 顶到右端，十行对齐成一列。 */
        +askBtn('selector',s.name,{cls:'sm ask-end'})
        /* 主题敞口的紧凑条：同一颜色在所有策略里是同一个主题，所以这一列
         * 竖着扫下来，就是「不同策略把钱压在了不同判断上」的直接对照。 */
        +(function(){
          var bk=books.find(function(b){return b.selector===s.name});
          if(!bk)return '';
          var bar=themeBarHTML(bk,true);
          /* 有组合但空条 = 选中了但还没成交。留白会让人以为是渲染丢了，
           * 所以把真正的原因写出来，而不是画一根空条。 */
          if(!bar){
            var pend=Number(bk.pending_orders)||0,exp=Number(bk.expired_orders)||0;
            if(!pend&&!exp)return '<span class="sel-tx"><span class="sel-tx-note">当前无在场持仓，无主题敞口</span></span>';
            return '<span class="sel-tx" title="未成交前不产生主题敞口，所以这里没有敞口条"><span class="sel-tx-note">'
              +(pend?fmtInt(pend)+' 笔挂单待成交':'')
              +(pend&&exp?' · ':'')
              +(exp?fmtInt(exp)+' 笔已过期':'')
              +'</span></span>';
          }
          return '<span class="sel-tx" title="主题敞口：'+esc(bookThemeMix(bk).mix.map(function(m){
            return m.theme+' '+m.share.toFixed(0)+'%'}).join('　'))+'">'+bar+'</span>';
        })()
        +'</div>';
    }).join('')+'</div>';
  var matrix='';
  if(cands.length){
    var chSet=sels.map(function(s){
      var set={};(s.chosen||[]).forEach(function(ch){set[selChosenId(ch)]=1});
      return set;
    });
    var rows=cands.map(function(c){
      var pass=0;chSet.forEach(function(set){if(set[c.instrument_id])pass++});
      return {c:c,pass:pass};
    });
    rows.sort(function(a,b){return b.pass-a.pass||String(a.c.instrument_id).localeCompare(String(b.c.instrument_id))});
    matrix='<div class="table-wrap scroll-y scroll-thin" style="margin-top:var(--space-2)"><table class="gate-table">'
      +'<thead><tr><th>标的</th><th>主题</th>'
      +sels.map(function(s){var m=selMetaOf(s.name);return '<th class="rot'+(foc===s.name?' cf':'')+'"><span class="r-in">'+esc(m[1])+'</span></th>'}).join('')
      +'<th class="r">过闸</th></tr></thead><tbody>'
      +rows.map(function(r){
        var c=r.c;
        return '<tr>'
          +'<td class="primary mono"><button type="button" class="exp-btn" style="padding:2px 4px" onclick="filterPoolCode(\''+jss(c.instrument_id)+'\')" title="'+esc(c.instrument_name||'')+' — 回候选池核对原始赔率">'+esc(c.instrument_id)+'</button></td>'
          +'<td><span class="tag" title="'+esc(c.topic_id||'')+'">'+esc(topicName(c.topic_id))+'</span></td>'
          +sels.map(function(s,si){
            var m=selMetaOf(s.name);
            return '<td class="gd'+(foc===s.name?' cf':'')+'">'+(chSet[si][c.instrument_id]
              ?'<span class="gate-dot'+(m[2]==='对照'?' ctl':'')+'" title="'+esc(m[1])+' 放行"></span>'
              :'<span class="gate-miss">·</span>')+'</td>';
          }).join('')
          +'<td class="r num">'+r.pass+'/'+sels.length+'</td></tr>';
      }).join('')
      +'</tbody></table></div>'
      /* 与「灰带」那处同型：图例只留「灰点 = 什么」，怎么读收进 ⓘ。 */
      +'<div class="card-note" style="margin-top:var(--space-2)">灰点 = 计数对照打分'
        +'<span class="gloss gm" title="全量基准按设计整列放行。同一行亮点越多 = 越多策略独立选中。">ⓘ</span></div>';
  }else{
    matrix='<div class="empty-sm" style="margin-top:var(--space-3)">候选池为空——闸门矩阵无从谈起</div>';
  }
  return tabs+focusHead+legend+matrix
    +epi('各策略同池同期，净值差异仅来自选取策略 '+glossMark('因此组合之间可以直接配对比较。但当前配对样本量尚未满足预注册要求，带内排名不构成结论。'));
}

/* ── 6 · 自动建仓 ── */
function rngBarHTML(p){
  var lo=p.stop_px,hi=p.take_px,en=p.entry_px,la=p.last_px;
  var has=function(v){return v!==undefined&&v!==null&&!isNaN(v)};
  if(!has(lo)||!has(hi)||!(hi>lo)){
    /* σ 算不出（如无价史的载体）：不画假条 */
    return '<span class="card-note">σ 无法计算 · 未设止损/止盈'+(has(la)?'（现价 '+fmtMoney(la)+'）':'')+'</span>';
  }
  /* 位置一律用百分比、并夹到 [0,100] —— 不做像素测量，抽屉过渡/就地换页也不会塌 */
  function pct(v){return Math.max(0,Math.min(100,(v-lo)/(hi-lo)*100))}
  var below=has(la)&&la<lo, above=has(la)&&la>hi;
  var upC=has(la)&&has(en)&&la>=en;
  var status='';
  if(below)status='<span class="rng-ofl down">◂ 现价已低于止损线（待触发退出）</span>';
  else if(above)status='<span class="rng-ofl up">现价已高于止盈线（待触发退出）▸</span>';
  return '<span class="rngwrap" title="止损 '+fmtMoney(lo)+'（σ×2）· 进场 '+fmtMoney(en)+' · 现价 '+fmtMoney(la)+' · 止盈 '+fmtMoney(hi)+'（σ×3）">'
    +'<span class="rng">'
    +'<span class="rng-track"></span>'

/* 全部组合按标的合并 */
function mergedPositions(){
  var books=currentBooks();
  var byCode={},order=[];
  books.forEach(function(b){
    (b.open_positions||[]).forEach(function(p){
      var k=p.code;
      if(!byCode[k]){byCode[k]={code:p.code,name:p.instrument_name,thesis:p.thesis,theme_id:p.theme_id,
        entry_px:p.entry_px,last_px:p.last_px,stop_px:p.stop_px,take_px:p.take_px,opened_d:p.opened_d,
        unrealized:0,value:0,cost:0,books:[],perBook:[],periods:{}};order.push(k)}
      if(p.as_of)byCode[k].periods[p.as_of]=1;
      var mv=(p.qty||0)*(p.last_px||0);
      var cv=(p.qty||0)*(p.entry_px||0);
      byCode[k].unrealized+=(p.unrealized||0);
      byCode[k].value+=mv;byCode[k].cost+=cv;
      /* 按不同的组合去重，不是按持仓条数累加。四周滚动下同一个组合会在
         好几期买同一只标的，逐条 push 会把「几个组合选中它」算成「它一共有
         几笔仓」——2026-09-05 实测 67 个标的里 64 个被灌水，22 个的徽标分子
         超过了分母（最高 21/10）。这个数还驱动着共识度散点图的横轴和
         「≥6 个加亮描边」，两处一起偏。每笔仓的明细在 perBook 里，不受影响。 */
      var sel=b.selector||b.book_id;
      if(byCode[k].books.indexOf(sel)<0)byCode[k].books.push(sel);
      byCode[k].perBook.push({sel:b.selector||b.book_id,unrealized:p.unrealized,qty:p.qty,
                              entry_px:p.entry_px,opened_d:p.opened_d});
    });
  });
  return {byCode:byCode,order:order};
}

/* ── 主题敞口 ─────────────────────────────────────────────────
 * 「这个策略把钱压在哪几个宏观判断上」是组合层最先该回答的问题，
 * 而一张持仓明细表回答不了它：读者要自己把 8 行标的心算归到 5 个主题上。
 * 主题色在一次运行内是稳定的（按入选顺序取色），所以横着比较不同策略时，
 * 同一段颜色就是同一个主题——策略之间的差异一眼就是色块比例的差异。 */
/* 主题配色的唯一口径：本期入选主题占前几个色位，跨期持仓里的其他主题
 * 按字典序稳定顺延——同一主题在敞口图、策略分布图、组合明细里同色。 */
function themeColorOrder(){
  var chosen=topicChosen('hgep').map(String),extra={};
  (currentBooks()||[]).forEach(function(b){
    (b.open_positions||[]).forEach(function(p){
      var t=String(p.theme_id||'');
      if(t&&chosen.indexOf(t)<0)extra[t]=1;
    });
  });
  return chosen.concat(Object.keys(extra).sort());
}
function themeColor(tid){
  var i=themeColorOrder().indexOf(String(tid));
  if(i<0)return 'var(--color-fill-secondary)';
  return 'var(--color-data-'+((i%8)+1)+')';
}
function bookThemeMix(b){
  var pos=(b&&b.open_positions)||[];
  var by={},order=[],total=0;
  pos.forEach(function(p){
    var t=p.theme_id||'未归类';
    var v=Math.abs((Number(p.qty)||0)*(Number(p.last_px)||0));
    if(!by[t]){by[t]={theme:t,value:0,n:0,pnl:0};order.push(t)}
    by[t].value+=v;by[t].n++;by[t].pnl+=(Number(p.unrealized)||0);
    total+=v;
  });
  var mix=order.map(function(t){
    by[t].share=total?by[t].value/total*100:0;return by[t];
  });
  mix.sort(function(a,b2){return b2.value-a.value});
  return {mix:mix,total:total};
}

      +((pend||exp)?'：'+(pend?fmtInt(pend)+' 笔挂单等待成交':'')+(pend&&exp?'，':'')
        +(exp?fmtInt(exp)+' 笔已过期未成交':'')+'。挂单成交后这里才会出现色条。':'。')

  }).join('');
  var nStale=r.mix.filter(function(m){return chosenNow.length&&chosenNow.indexOf(m.theme)<0}).length;
  if(compact)return '<span class="tx-bar compact">'+segs+'</span>';
  var legend=r.mix.map(function(m){
    var stale=chosenNow.length&&chosenNow.indexOf(m.theme)<0;

  }).join('');
  return '<div class="tx-wrap">'
    +'<div class="tx-h">主题敞口 · 这个策略把仓位压在哪几个宏观判断上'
    +'<span class="gloss gm" title="按各仓位当前市值占该组合在场市值的比例计算；主题取自标的所属主题。同色即同一主题，可跨策略横向比较。">ⓘ</span></div>'
    +'<span class="tx-bar">'+segs+'</span>'

    +'</div>';

      +'</tbody></table></div>';
  }else{
    html+='<div class="empty-sm" style="margin-top:var(--space-4)">该组合空仓：无标的达到门槛，留存现金</div>';
  }
  html+=epi('与其他组合同池同期，净值差异即选取策略差异 '+glossMark('当前配对样本量尚未满足预注册要求，排名不构成结论。'));
  return html;
}
/* ══════════ 追问记录 — 历次追问的运营视图 ══════════
 * 追问本身也是底账：一次追问 = 有人问了什么、系统当时把哪些材料交给了模型、
 * 模型引用了其中哪几件、答的是什么。这四样凑齐，事后才有办法判断某个回答
 * 是「有据」还是「听起来有据」——只看答案是判断不出来的。
 * 列表 → 详情 → 它当时拿到的材料 → 点进那件材料本身，一路可以往下追。 */
var ASKLOG=null,askLogErr='',askLogOpen={};
function openAskLogDrawer(){pushDrawer({t:'asklog',p:''})}
/* 全局入口：列出这一期能问的所有对象。四类都来自后端 SUBJECT_KINDS，
   页面不自造类型，也不承诺它答不了的东西。 */
function openAskPicker(){pushDrawer({t:'askpick',p:''})}
function askPickerBody(){
  var subs=askSubjects();
  if(!subs.length)return '<div class="empty-sm">本期还没有可追问的对象——周跑尚未产出主题与持仓。</div>';
  var groups={},order=[];
  subs.forEach(function(x){if(!groups[x.group]){groups[x.group]=[];order.push(x.group)}groups[x.group].push(x)});
  /* 全局入口要知道读者正站在哪一页：从持仓页点开，先列持仓；从证据页点开，
     先列选取策略。同一份清单，只是把手边的那组提到前面。 */
  var PREFER={holdings:'持仓',evidence:'选取策略',method:'这一步',overview:'这一步'};
  var first=PREFER[current];
  if(first&&groups[first])order=[first].concat(order.filter(function(g){return g!==first}));
  return '<div class="quiet" style="margin-bottom:var(--space-2)">'
      +'挑一个对象追问，答案只依据这次运行封存的材料 '
      +glossMark('封存的材料 = 运行日志、当期研报正文、评分与判定记录。材料里没有的，它会直说记录中不存在，不补全，也不用之后发生的事情回答。页面上那个绿色按钮问的是同一件事，只是替你把对象填好了。')
      +'</div>'
    +order.map(function(g){
      return '<div class="askpick-g">'+esc(g)+'</div>'
        +groups[g].map(function(x){
          return '<button type="button" class="askpick-i" data-el="ask.pick.'+esc(x.kind)+'"'
            +' onclick="truncDrawers(0);openAskDrawer(\''+jss(x.kind)+'\',\''+jss(String(x.id))+'\')">'
            +'<b>'+esc(x.label)+'</b><span>'+esc(x.sub)+'</span></button>';
        }).join('');
    }).join('')
    +'<div style="margin-top:var(--space-5);padding-top:var(--space-4);border-top:1px solid var(--color-border-subtle)">'
      +'<button type="button" class="exp-btn" data-el="ask.log" onclick="truncDrawers(0);openAskLogDrawer()">追问记录 ›</button>'
    +'</div>';
}
function ensureAskLog(){
  if(ASKLOG!==null)return ASKLOG;
  if(ensureAskLog._busy)return null;
  ensureAskLog._busy=true;
  fetch('/api/asks?limit=100').then(function(r){return r.json()}).then(function(j){
    ASKLOG=j.asks||[];askLogErr=j.error||'';ensureAskLog._busy=false;renderDrawers();
  }).catch(function(e){
    ASKLOG=[];askLogErr=String(e&&e.message||e);ensureAskLog._busy=false;renderDrawers();
  });
  return null;
}
function askLogSubject(a){
  var k=a.kind||'',id=a.id||'';
  if(k==='topic')return '主题 '+id;
  if(k==='selection')return '选题这一步';
  if(k==='selector')return '策略 '+(selMetaOf(id)[1]||id);
  if(k==='idea')return '想法 '+id;
  return (k?k+' ':'')+id;
}
/* 材料 → 它自己所在的那一层。追问详情不是终点，是入口。 */
function askMatOpen(m){
  var src=String(m.source||''),k=String(m.kind||'');
  /* 材料上写着 run_id=X，点开却是「最近一次」——两个不同的运行，同一个按钮。
     追问上下文里带着它自己的运行号，用它。 */
  if(k==='journal')return "openRunLogStacked('"+jss(askRunId())+"')";
  /* 研报浏览器要按期查库，必须带上这次运行的 as_of——不带就取不到清单。 */
  if(k==='doc'){
    var ao=((S||{}).weekly||{}).as_of||'';
    return ao?("openCorpus('"+ao+"')"):'';
  }
  if(k==='selector'){
    var sm=src.match(/C_selectors\/([A-Za-z0-9_]+)\.json/);
    if(sm)return "openBookDrawer('"+sm[1]+"')";
    return "openStageStacked(4)";
  }
  if(k==='pool')return "openStageStacked(3)";
  if(k==='verdict'||k==='counting')return "openStageStacked(1)";
  if(k==='candidate')return "openStageStacked(3)";
  return '';
}
function askMatKindZH(k){
  return {journal:'运行日志',verdict:'打分产物',counting:'计数对照打分产物',
          selector:'策略判决',pool:'候选池',doc:'研报原文',
          candidate:'候选条目'}[k]||k||'材料';
}
function toggleAskLog(i){askLogOpen[i]=!askLogOpen[i];renderDrawers()}
function askLogDrawerBody(d){
  var rows=ensureAskLog();
  if(rows===null)return '<div class="empty-sm">正在读取追问记录……</div>';
  if(askLogErr)return '<div class="empty-sm">追问记录读不到：'+esc(askLogErr)+'</div>';
  if(!rows.length){
    return '<div class="empty-sm">还没有人问过这个系统任何问题。'
      +'在主题、策略或某一仓上点「问它当时怎么想」，问过的每一次都会记到这里，'
      +'连同当时交给模型的材料清单。</div>';
  }
  var head='<div class="quiet" style="margin-bottom:var(--space-3)">'
    +'共 <b class="num">'+fmtInt(rows.length)+'</b> 次追问 · 最近的在最上面 '
    +'<span class="gloss gm" title="每一条都记下了：问了什么、系统把哪些材料交给了模型、模型引用了其中哪几件、答的是什么。把「交给了什么」和「引用了什么」分开记，是为了让「答得对不对」和「有没有依据」可以分开检验——引用 2 件和只有 2 件可引用，是两回事。">ⓘ</span></div>';
  var list=rows.map(function(a,i){
    var open=!!askLogOpen[i];
    var prov=a.provenance||[];
    var cited={};(a.cited||[]).forEach(function(c){cited[c]=1});
    var st=a.context_stats||{};
    var sub='<div class="al-meta">'
      +'<span class="al-time mono">'+esc(hktFmt(a.ts,true))+'</span>'
      +'<span class="tag">'+esc(askLogSubject(a))+'</span>'
      +(a.model?'<span class="tag mono">'+esc(a.model)+'</span>':'')
      +'<span class="al-n">'+(prov.length?('交给 '+prov.length+' 件材料 · 引用 '+(a.cited||[]).length+' 件')
        :(st.n_materials?('交给 '+fmtInt(st.n_materials)+' 件材料 · 引用 '+(a.cited||[]).length+' 件'):''))
      +(st.n_docs?' · 含研报 '+fmtInt(st.n_docs)+' 篇':'')+'</span>'
      +'</div>';
    var body='';
    if(open){
      body='<div class="al-body">'
        +'<div class="al-sec">问</div><div class="al-q">'+esc(a.question||'')+'</div>'
        +'<div class="al-sec">答</div><div class="al-a">'+askAnswerHTML(a.answer||'',a.provenance||[])+'</div>';
      if(prov.length){
        body+='<div class="al-sec">它当时拿到的材料 · '+prov.length+' 件'
          +'<span class="gloss gm" title="这是问答发生时系统实际交给模型的全部材料。带「引用」的是模型在答案里指名用到的；其余是它可以看、但没有用上的。">ⓘ</span></div>'
          +'<div class="al-mats">'+prov.map(function(m){
            var go=askMatOpen(m);
            var isC=!!cited[m.id];
            return '<'+(go?'button type="button"':'div')+' class="al-mat'+(isC?' cited':'')+'"'
              +(go?' onclick="'+go+'"':'')
              +' title="'+esc(m.source||'')+(go?'　点击打开这件材料所在的那一层':'')+'">'
              +'<span class="mid mono">'+esc(m.id)+'</span>'
              +'<span class="mk">'+esc(askMatKindZH(m.kind))+'</span>'
              +'<span class="mt">'+esc(m.title||'')+'</span>'
              +(isC?'<span class="mc">引用</span>':'')
              +(go?'<span class="mg">›</span>':'')
              +'</'+(go?'button':'div')+'>';
          }).join('')+'</div>';
      }else{
        body+='<div class="al-sec">它当时拿到的材料</div>'
          +'<div class="card-note">这一条追问发生在系统开始记录材料清单之前，'
          +'只留下了引用编号（'+esc((a.cited||[]).join('、')||'无')+'）。'
          +'之后的追问都会完整记下交给模型的每一件材料。</div>';
      }
      body+='</div>';
    }
    return '<div class="al-row'+(open?' open':'')+'">'
      +'<button type="button" class="al-head" onclick="toggleAskLog('+i+')">'
      +'<span class="al-chev">'+(open?'▾':'▸')+'</span>'
      +'<span class="al-main"><span class="al-qline">'+esc(String(a.question||'').slice(0,72))
      +(String(a.question||'').length>72?'…':'')+'</span>'+sub+'</span>'
      +'</button>'+body+'</div>';
  }).join('');
  return head+'<div class="al-list">'+list+'</div>'
    +epi('追问记录与运行产物一起打包在审计包的 06_追问记录.jsonl 里，可离线复核');
}

/* ══════════ 合并前的原始提案 ══════════
 * 候选池一个标的只有一行：合并后的论点 + 赔率中位数。那是「拿来挑」的正确单位，
 * 却正好把「这条想法是怎么来的」抹掉了——四种方法对同一个标的写了四套不同的
 * 理由，合并就是这些差异消失的地方。这一层把它们原样取回来，每条带上它当时
 * 引用的研报，点开就是那篇研报本身。 */
var PROPS={},propsErr={};
function openProposalsDrawer(code){pushDrawer({t:'props',p:bareCode(code)})}
function ensureProposals(code){
  if(PROPS[code]!==undefined)return PROPS[code];
  if(ensureProposals['_'+code])return null;
  ensureProposals['_'+code]=1;
  fetch('/api/proposals?instrument='+encodeURIComponent(code),{cache:'no-store'})
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
    .then(function(j){
      if(j.error){propsErr[code]=j.error;PROPS[code]={proposals:[],docs:{}}}
      else PROPS[code]=j;
      ensureProposals['_'+code]=0;renderDrawers();
    })
    .catch(function(e){propsErr[code]=(e&&e.message)||String(e);PROPS[code]={proposals:[],docs:{}};
      ensureProposals['_'+code]=0;renderDrawers()});
  return null;
}
function propOdds(x){
  var up=x.upside_pct,dn=x.downside_pct;
  var rr=(up!==null&&up!==undefined&&dn)?Math.abs(up/dn):null;
  return '<div class="pr-odds">'
    +'<span>上行 <b class="num up">'+fmtPct(up)+'</b></span>'
    +'<span>下行 <b class="num down">'+fmtPct(dn)+'</b></span>'
    +'<span>概率 <b class="num">'+fmtProb(x.p_up)+' / '+fmtProb(x.p_base)+' / '+fmtProb(x.p_down)+'</b>'
    +'<span class="gloss gm" title="上行 / 持平 / 下行三种情景的概率，由生成方法当时给出">ⓘ</span></span>'
    +(rr!==null?'<span>赚亏比 <b class="num">'+rr.toFixed(2)+'</b></span>':'')
    +(x.horizon_days?'<span>期限 '+fmtInt(x.horizon_days)+' 天</span>':'')
    +'</div>';
}
function proposalsDrawerBody(d){
  var code=String(d.p||'');
  var r=ensureProposals(code);
  if(r===null&&!propsErr[code])return '<div class="empty-sm">正在取回 '+esc(code)+' 合并前的原始提案……</div>';
  if(propsErr[code])return '<div class="empty-sm">取不到原始提案：'+esc(propsErr[code])+' '
    +glossMark('原始提案存在这次运行的生成产物里，需要后端现场读取。')+'</div>';
  var ps=(r&&r.proposals)||[],docs=(r&&r.docs)||{};
  if(!ps.length){
    /* 「没有这条的提案记录」外加一句「大概是更早一期的持仓」——四份生成产物
       全都读不到时，这是一个凭空给出的具体解释。服务端现在会说哪几份没读到。 */
    var ur=(r&&r.unread)||[];
    if(ur.length){
      return '<div class="empty-sm" style="color:var(--color-feedback-warning-text)">'
        +'读不到本期的生成产物，所以列不出 '+esc(code)+' 的提案——这不代表当时没写。<br>'
        +ur.map(esc).join('<br>')+'</div>';
    }
    return '<div class="empty-sm">本期生成产物里没有 '+esc(code)+' 的提案记录 '
      +glossMark('候选池里的这一行可能来自更早一期的持仓，而不是本期新写的想法。')+'</div>';
  }
  var byM={},order=[];
  ps.forEach(function(x){var m=x.method||'—';if(!byM[m]){byM[m]=[];order.push(m)}byM[m].push(x)});
  var nCites=0;ps.forEach(function(x){nCites+=(x.citations||[]).length});
  var head='<div class="quiet" style="margin-bottom:var(--space-3)">'
    +'<b class="num">'+ps.length+'</b> 条原始提案来自 <b class="num">'+order.length+'</b> 种生成方法，'
    +'合并成候选池里 '+esc(code)+' 的那一行（赔率取中位数）。'
    +'<span class="gloss gm" title="合并只对赔率取中位数、把提出方法记下来；论点没有被重写，下面每一条都是当时写下的原文。">ⓘ</span>'
    +'　四种方法互不通气，所以它们给出的理由不一样才是常态——一致的地方才值得注意。</div>'
    +'<div style="margin:0 0 var(--space-3)">'+askBtn('idea','pool:'+code)+'</div>';
  var body=order.map(function(m){
    var arr=byM[m];
    return '<div class="pr-grp">'
      +'<div class="pr-grp-h"><b>'+esc(methodName(m))+'</b><span class="tag">'+arr.length+' 条</span>'
      +'<button type="button" class="exp-btn" onclick="openStageStacked(2,\''+esc(m)+'\')">这个方法的全貌 ›</button></div>'
      +arr.map(function(x,i){
        var cites=(x.citations||[]);
        return '<div class="pr-card">'
          +'<div class="pr-top">'
          +(x.topic_id?'<button type="button" class="tag tag-brand mono" onclick="openTopicDrawer(\''+esc(x.topic_id)+'\')" title="'+esc(x.topic_id)+'——点击看这个主题">'+esc(topicName(x.topic_id))+' ›</button>':'')
          +(x.exposure?'<span class="tag">'+esc(x.exposure)+'</span>':'')
          +(x.vehicle?'<span class="tag">'+esc(x.vehicle)+'</span>':'')
          +'</div>'
          +'<div class="pr-thesis">'+esc(x.thesis||'（当时没写论点）')+'</div>'
          +propOdds(x)
          +(cites.length
            ?'<div class="pr-cites"><div class="pr-cites-h">它当时引用的研报 · '+cites.length+' 篇'
              +'<span class="gloss gm" title="生成时模型标注的出处。展开可查看该研报的摘要、检索凭据与全文长度——想法与其依据之间没有断点。">ⓘ</span></div>'
              +cites.map(function(cid,ci){
                var dd=docs[cid];
                if(dd)return docRowHTML(dd,'pr-'+esc(code)+'-'+esc(m)+'-'+i+'-'+ci);
                return '<div class="doc-row" style="cursor:default" title="这条引用在当期研报里查不到——可能是模型引了一个不存在的编号">'
                  +'<span class="tier-tag" style="background:var(--color-feedback-warning-subtle);color:var(--color-feedback-warning-text)">查无此篇</span>'
                  +'<span class="doc-title mono">'+esc(cid)+'</span></div>';
              }).join('')
              +'</div>'
            :'<div class="card-note" style="margin-top:6px">这一条没有标出处。</div>')
          +(x.bad_citations?'<div class="card-note" style="color:var(--color-feedback-warning-text);margin-top:4px">生成时有 '+fmtInt(x.bad_citations)+' 条引用编号对不上当期研报，已被剔除。</div>':'')
          +'</div>';
      }).join('')
      +'</div>';
  }).join('');
  return head+body
    +epi('这些是生成产物里的原文，未经改写；合并只发生在赔率上');
}

function statusDrawerBody(){
  var a=S.alive||{},hb=a.heartbeat||{};
  var wkOut=hbOutcome('weekly');
  var weeklyFailed=wkOut&&wkOut.action==='failed';
  var ports=(a.ports||[]).map(function(pt){
    var warn=pt.ok&&pt.detail&&pt.detail.indexOf('⚠')>=0;
    var c=pt.ok?(warn?'warn':'ok'):'bad';
    return '<span class="port-pill '+c+'" title="'+esc(pt.detail||'')+'"><span class="dot"></span>'+esc(pt.name)+'</span>';
  }).join('');
  var portStamp=a.ports_pending
    ? '端口自检尚未完成 — 这不代表端口异常'
    : (a.ports_checked_at
        ? '自检于 '+hktFmt(a.ports_checked_at,true)+' · '+ageWord(a.ports_age_s)
          +(a.ports_stale?' · 已过期，正在后台刷新':'')
        : '');
  var portStampHtml=portStamp
    ? '<div style="margin-top:var(--space-2);font:400 11px/16px var(--font-sans);color:var(--color-text-tertiary)">'+esc(portStamp)+'</div>'
    : '';
  return '<div class="meta-row" style="margin-top:0">'
      +'<div class="meta-kv"><div class="k">最近心跳</div><div class="v num">'+hktFmt(hb.at_hkt,true)+' HKT · '+ageWord(a.age_s)+'</div></div>'
      +'<div class="meta-kv"><div class="k">平台 / 交易场</div><div class="v">'+esc(hb.platform||S.platform||'—')+' / '+esc(hb.venue||'—')+'</div></div>'
      +((S.schedule||{}).tick_interval_s?'<div class="meta-kv"><div class="k">自检节奏</div><div class="v">每 '+Math.round(((S.schedule||{}).tick_interval_s)/60)+' 分钟一次</div></div>':'')
      +(hb.exit_code?'<div class="meta-kv"><div class="k">上次心跳退出码</div><div class="v num" style="color:var(--color-feedback-warning-text)">'+esc(hb.exit_code)+'（非 0 = 有任务失败）</div></div>':'')
    +'</div>'
    +(weeklyFailed?'<div style="margin-top:var(--space-3);font:400 12px/18px var(--font-sans);color:var(--color-feedback-warning-text)">本期（'+esc(wkOut.period||'')+'）周跑记为 <b>failed</b> '+glossMark('这是心跳里的记录；runs 表没有这次尝试的明细。下方「数据源健康」和「盯市」错误是目前 API 能给出的全部线索。')+'</div>':'')
    /* 没有正常收尾的周跑：首页不该把它当成「在跑」，但也不该当它不存在。
     * 它是一次中途退出的进程留下的记录，运维要能看到它跑到了哪一步。 */
    +(function(){
      var ab=abandonedRun();
      if(!ab)return '';
      return '<div style="margin-top:var(--space-3);padding:var(--space-2) var(--space-3);background:var(--color-feedback-warning-subtle);border-left:3px solid var(--color-feedback-warning-default);border-radius:var(--radius-xs);font:400 12px/18px var(--font-sans);color:var(--color-text-secondary)">'
        +'<b>有一次周跑没有正常收尾</b> '
        +glossMark(weeklyDurNote()+'它启动后再没写下结束时间，多半是进程中途退出、来不及记录结果。不影响上方展示的结果——那些来自后来跑成功的那一次。')
        +'<div class="gap-row" style="grid-template-columns:56px 1fr;margin-top:4px"><span class="gk">run</span><span class="gv mono" style="color:inherit">'+esc(String(ab.run_id||'').slice(0,24))+' · '+esc(ab.as_of||'')+' 期</span></div>'
        +'<div class="gap-row" style="grid-template-columns:56px 1fr"><span class="gk">启动</span><span class="gv" style="color:inherit">'+esc(hktFmt(ab.started_at,true))+' · 已过 <b class="num">'+fmtInt(runAgeMin(ab))+'</b> 分钟，无结束时间</span></div>'
        +'<div style="margin-top:4px"><button type="button" class="exp-btn" onclick="openRunLogStacked(\''+esc(ab.run_id||'')+'\')">看它跑到哪一步 ›</button></div>'
        +'</div>';
    })()
    +(hb.fatal?'<div style="margin-top:var(--space-2);font:400 12px/18px var(--font-sans);color:var(--color-feedback-error-text)">fatal：'+esc(hb.fatal)+'</div>':'')

/* ══════════ 问它当时怎么想 — 只依据封存材料的追问抽屉 ══════════ */
/* 追问必须按当期上下文回答，不得以当前推测替代。
   实现是检索+严格接地：/api/ask/context 只取那次运行封存的材料，
   /api/ask 的回答被限定在这些材料里，材料没有的它必须明说没有。 */
var ASKCTX={},ASKLOAD={},ASKH={},ASKS={};
/* 静态快照没有后端：/api/* 在 Pages 上返回的是 404 页面（HTML），
   直接 .json() 会炸成「Unexpected token '<'」——那是把「这里没有这个功能」
   说成了「接口坏了」。凡是要现场取材料的入口，先问这一句。 */
function isSnapshot(){return !!window.__STATIC__}
var SNAP_WHERE='要追问请在运行台打开：本机 http://localhost:8765/review，或飞书里那条隧道地址。';
function askSubjName(pstr){var i=pstr.indexOf(':');return i<0?pstr:pstr.slice(i+1)}
function askSubjKind(pstr){var i=pstr.indexOf(':');return i<0?'':pstr.slice(0,i)}
function askRunId(){return ((S||{}).weekly||{}).run_id||''}
function askKey(pstr){return askRunId()+'|'+pstr}
var ASK_KIND_ZH={topic:'主题',idea:'想法',selector:'选取策略'};
function ensureAskCtx(key,kind,id){
  if(ASKCTX[key])return ASKCTX[key];
  if(isSnapshot())return null;
  if(!ASKLOAD[key]){
    ASKLOAD[key]=true;
    fetch('/api/ask/context?run_id='+encodeURIComponent(askRunId())+'&kind='+encodeURIComponent(kind)+'&id='+encodeURIComponent(id),{cache:'no-store'})
      .then(function(r){return r.json().then(function(b){return {ok:r.ok,b:b}})})
      .then(function(res){
        if(res.b&&!res.b.error)ASKCTX[key]={c:res.b};
        else ASKCTX[key]={c:null,err:(res.b&&res.b.error)||('HTTP '+(res.ok?'格式不对':'错误'))};
      })
      .catch(function(e){ASKCTX[key]={c:null,err:e&&e.message?e.message:String(e)}})
      .then(function(){ASKLOAD[key]=false;renderDrawers()});
  }
  return null;
}
function askScrollBottom(){
  requestAnimationFrame(function(){
    var el=document.querySelector('.drawer:not(.under) .drawer-body');
    if(el)el.scrollTop=el.scrollHeight;
  });
}
/* ── 追问：全站唯一的入口组件 ─────────────────────────────────
   这套系统里最有价值的能力是「问它当时怎么想」——答案只从那次运行封存的
   材料里来，不用事后信息，不现编。但它此前只有 4 个入口，全部埋在下钻两层
   之后的抽屉里，而且同一个功能有三个名字（按钮「问它当时怎么想」、抽屉
   标题「问当时的它」、记录入口「会话记录」）。
   现在收敛为：一个组件、一个名字、一个图标、一个稳定的 element_id。
   凡是后端认的四类对象（主题 / 想法 / 选取策略 / 选主题这一步），
   在页面上出现的地方就该带上它。 */
var ASK_ICON='<svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true" style="flex:none">'
  +'<path d="M1.6 2.2h8.8v5.6H5.2L2.8 9.9V7.8H1.6z" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/>'
  +'<path d="M4.7 4.1a1.3 1.3 0 0 1 2.4.6c0 .9-1.2.9-1.2 1.6" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/>'
  +'<circle cx="5.9" cy="7" r=".5" fill="currentColor"/></svg>';
/* 默认文案随对象类型走，但一律以「问它为什么」开头：形状与图标全站统一，
   话术贴着读者此刻正看着的那个东西说，不让他自己去翻译「它」是谁。 */
var ASK_LABEL={
  topic:'问它为什么选它',
  idea:'问它为什么选它',
  selector:'问它为什么这么选',
  selection:'问它为什么选这几个主题'
};
/* 「1284.58s」要读者自己心算。秒只在真的只有几十秒时才是好单位。 */
function fmtDur(sec){
  var v=Number(sec);
  if(!isFinite(v)||v<0)return '—';
  if(v<60)return v.toFixed(1)+' 秒';
  var m=Math.floor(v/60),r=Math.round(v%60);
  if(m<60)return m+' 分 '+r+' 秒';
  return Math.floor(m/60)+' 小时 '+(m%60)+' 分';
}
function askBtn(kind,id,opts){
  opts=opts||{};
  if(!id)return '';
  var label=opts.label||ASK_LABEL[kind]||'问它为什么选它';
  /* 快照页没有后端，追问答不了。仍然渲染，但降一档配色 + 说清为什么。 */
  var snap=(typeof isSnapshot==='function')&&isSnapshot();
  return '<button type="button" class="ask-btn'+(opts.cls?' '+opts.cls:'')+(snap?' off':'')+'"'
    +' data-el="ask.'+esc(kind)+'"'
    +' aria-label="'+esc(label+'：'+String(id))+'"'
    +' title="'+esc(snap
        ? '静态快照答不了追问——它要现场取那次运行封存的研报原文与打分记录。点开看在哪能问。'
        : label+'——只依据本次运行当时封存的材料作答，不使用事后信息')+'"'
    +' onclick="'+(opts.stop?'event.stopPropagation();':'')+'openAskDrawer(\''+jss(kind)+'\',\''+jss(String(id))+'\')">'
    +ASK_ICON+'<span>'+esc(label)+'</span></button>';
}
/* 可追问对象清单：全局入口据此列出「能问什么」。四类都来自后端
   SUBJECT_KINDS，前端不自造类型。 */
function askSubjects(){
  var out=[],w=(S||{}).weekly||{};
  out.push({kind:'selection',id:'topics',group:'这一步',
            label:'本期为什么选这几个主题',sub:'选主题这一步的完整依据'});
  topicChosen('hgep').forEach(function(t){
    out.push({kind:'topic',id:t,group:'宏观主题',
              label:topicLabel(t)||t,sub:'为什么它入选、依据哪几篇研报'});
  });
  currentBooks().forEach(function(b){
    var m=selMetaOf(b.selector);
    out.push({kind:'selector',id:b.selector,group:'选取策略',
              label:m[1],sub:m[3]||'为什么这样选'});
  });
  /* 持仓按共识度排：被越多组合独立选中的标的越值得先问一句为什么。
     字母序不携带信息。 */
  var held={};
  (aggBooks()||{books:[]}).books.forEach(function(b){
    (b.open_positions||[]).forEach(function(pos){
      var c=bareCode(pos.code);
      if(!held[c])held[c]={n:0,theme:pos.theme_id||''};
      held[c].n++;
    });
  });
  var nb=currentBooks().length||1;
  Object.keys(held).sort(function(a,b){
    return held[b].n-held[a].n || (a<b?-1:1);
  }).forEach(function(c){
    out.push({kind:'idea',id:'pool:'+c,group:'持仓',label:c,
              sub:held[c].n+'/'+nb+' 个组合选中'
                 +(held[c].theme?' · '+(topicLabel(held[c].theme)||held[c].theme):'')});
  });
  return out;
}
function askSend(pstr,q){
  q=(q||'').trim();if(!q)return;
  var key=askKey(pstr),st=ASKS[key]=ASKS[key]||{};
  if(st.busy)return;
  st.busy=true;st.pending=q;st.draft='';
  renderDrawers();askScrollBottom();
  var hist=(ASKH[key]||[]).filter(function(h){return h.a}).map(function(h){return {q:h.q,a:h.a}});
  fetch('/api/ask',{method:'POST',cache:'no-store',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({run_id:askRunId(),kind:askSubjKind(pstr),id:askSubjName(pstr),question:q,history:hist})})
    .then(function(r){return r.json().then(function(b){return {ok:r.ok,b:b}})})
    .then(function(res){
      var h=ASKH[key]=ASKH[key]||[];
      if(res.b&&res.b.answer)h.push({q:q,a:res.b.answer,cited:res.b.cited||[],model:res.b.model,via:res.b.answered_by});
      else h.push({q:q,err:(res.b&&res.b.error)||('HTTP 错误（'+(res.ok?'响应格式不对':'请求失败')+'）')});
    })
    .catch(function(e){(ASKH[key]=ASKH[key]||[]).push({q:q,err:e&&e.message?e.message:String(e)})})
    .then(function(){st.busy=false;st.pending=null;renderDrawers();askScrollBottom()});
}
function askSendFromInput(pstr){
  var el=$('askInput');if(!el)return;
  askSend(pstr,el.value);
}
/* 答案里的 [M3] 之前只是换了个颜色：读者知道它引了「第三件材料」，
 * 却无从知道第三件是什么，更点不进去。Jon 要的是能一路追下去，
 * 所以这里把编号接回它自己的那条材料——悬停给标题，点击展开清单并高亮。 */
function askAnswerHTML(text,prov){
  var by={};
  (prov||[]).forEach(function(m){if(m&&m.id)by[m.id]=m});
  return esc(text).replace(/\[(M\d+)\]/g,function(all,id){
    var m=by[id];
    if(!m)return '<b style="color:var(--color-text-brand);font-weight:600">'+all+'</b>';
    return '<button type="button" class="mref" title="'+esc(m.title+'　'+(m.source||''))+'——点击在下面的材料清单里定位它" onclick="revealMaterial(this,\''+esc(id)+'\')">'+all+'</button>';
  });
}
function revealMaterial(btn,id){
  var root=btn.closest('.drawer-body')||document;
  var det=root.querySelector('details.ask-mats');
  if(det)det.open=true;
  var row=root.querySelector('.mrow[data-mid="'+id+'"]');
  if(!row)return;
  root.querySelectorAll('.mrow.hit').forEach(function(e){e.classList.remove('hit')});
  row.classList.add('hit');
  try{row.scrollIntoView({block:'nearest'})}catch(e){}
}
function askChipsFor(kind,ctx){
  var nDocs=(ctx&&ctx.corpus&&ctx.corpus.n_docs)||((ctx&&ctx.stats&&ctx.stats.n_docs)||null);
  var nTxt=nDocs?String(nDocs):'N';
  if(kind==='topic')return ['为什么读了 '+nTxt+' 篇报告选出了这个主题？','当时反对它的证据是什么？','如果重来，材料里有什么被低估了？'];
  if(kind==='idea')return ['为什么当时提出并保留了这条想法？','当时反对它的证据是什么？','如果重来，材料里有什么被低估了？'];
  /* 整步追问：问的是取舍本身，不是某一个主题 */
  if(kind==='selection'){
    var nIn2=topicChosen('hgep').length||5;
    return ['读了 '+nTxt+' 篇研报，为什么最后入选的是这 '+nIn2+' 个主题？',
            '落选的里面最接近入选线的是哪一个，差在哪个因子？',
            '计数对照打分和语义打分为什么选出了不同的主题？'];
  }
  return ['为什么挑了这几条、拒了其余的？','被拒的候选里当时最可惜的是哪条？','如果重来，材料里有什么被低估了？'];
}
function askDrawerBody(d){
  var pstr=String(d.p),kind=askSubjKind(pstr),sid=askSubjName(pstr),key=askKey(pstr);
  if(isSnapshot()){
    /* 快照带得动结论，带不动追问：追问要现场取那次运行封存的研报原文与
       打分记录，再让模型只依据它们作答——两步都要后端。 */
    return '<div class="ask-scope">'
      +'<b>静态快照不支持追问。</b><br>'
      +'追问需实时检索该次运行封存的研报原文与打分记录，快照无后端服务。<br>'
      +esc(SNAP_WHERE)
      +'</div>';
  }
  var cached=ensureAskCtx(key,kind,sid);
  if(!cached)return '<div class="empty-sm">正在载入当期封存材料清单</div>';
  if(!cached.c){
    return '<div class="ask-scope" style="border-color:var(--color-feedback-error-default)">'
      +'<b>未能取得该对象的当期封存材料。</b><br>接口返回：'+esc(cached.err||'未知错误')
      +'</div>';
  }
  var ctx=cached.c,run=ctx.run||{},stats=ctx.stats||{},corpus=ctx.corpus||{},prov=ctx.provenance||[];
  var inf=ctx.inference||{};
  var subjLabel=(ctx.subject&&ctx.subject.label)||sid;
  var parts=[];
  if(corpus.n_docs)parts.push(fmtInt(corpus.n_docs)+' 篇研报');
  if(prov.some(function(m){return m.kind==='verdict'||m.kind==='counting'||m.kind==='selector'}))parts.push('打分明细');
  if(prov.some(function(m){return m.kind==='generator'||m.kind==='candidate'||m.kind==='pool'}))parts.push('生成记录');
  if(!parts.length)parts.push(fmtInt(stats.n_materials||0)+' 件封存记录');
  /* 可核对到什么程度，分三层说清楚，不把「查不了」说成「查过了」，
     也不把「查不了」说成「对不上」——后者是指控，前者只是没有证据。 */
  var shaLine='';
  if(corpus.docs_match_journal===true&&corpus.verified_sha===true)
    shaLine='研报清单与运行时冻结的清单逐条一致，输入指纹（inputs_sha）校验通过，可逐篇复核';
  else if(corpus.verified_sha===true)
    shaLine='研报清单已按运行封存的输入指纹（inputs_sha）逐一核对，与当时一致';
  else if(corpus.docs_match_receipt===true)
    shaLine='重建的 '+fmtInt(corpus.n_docs||0)+' 篇与该次运行的研报回执数量一致；完整输入指纹含当时的日历，无法由当前日历表复算';
  else if(corpus.verified_sha===false)
    shaLine='⚠ 研报清单按当期口径重建，与封存的输入指纹不一致：研报库可能在运行后被修改，回答将一并说明';
  else if(corpus.journal_note)
    /* 「查不了」有两种：这次运行太早、没冻结输入清单（关于那次运行的事实），
       和这台机器读不到运行日志（关于这台机器的事实）。后者说成前者，就是
       把一个能修的故障讲成了一条修不了的历史局限。 */
    shaLine='⚠ 无法核对输入清单：'+corpus.journal_note;
  else if(corpus.n_docs===undefined)
    /* 追问筛选C 或某条想法时，根本没有重建过研报清单——材料是当时的判决
       产物和候选池。对着这种追问说「该期早于冻结输入清单的版本」，是在
       回答一个没人问过的问题，还顺带暗示材料有缺。这一层没有可核对的
       研报清单，就什么都别说。 */
    shaLine='';
  else
    shaLine='该期早于冻结输入清单的版本，仅能按当期口径重建，无法逐条核对';
  var gloss='仅依据当期封存材料 = 回答模型可见范围限于本次运行写下的运行日志、打分/生成/选取产物，以及证据指向的研报原文；材料未覆盖的内容须明确回答记录中不存在。'+(shaLine?'\n'+shaLine:'');
  var html='<div class="ask-scope">追问对象：<b>'+esc(sid)+(subjLabel&&subjLabel!==sid?'（'+esc(subjLabel)+'）':'')+'</b>'
    +' · '+esc(run.as_of||'—')+' 期'
    +' · 仅依据当期封存材料（'+esc(parts.join(' · '))+'）'
    +'<span class="gloss gm" title="'+esc(gloss)+'">ⓘ</span>'
    +(shaLine?'<div style="margin-top:4px;color:var(--color-text-'+(corpus.verified_sha?'metadata':'tertiary')+')">'+esc(shaLine)+'</div>':'')
    +((ctx.notes||[]).length?'<div style="margin-top:4px;color:var(--color-feedback-warning-text)">材料缺口：'+ctx.notes.map(esc).join('；')+'</div>':'')
    +(ctx.empty?'<div style="margin-top:4px;color:var(--color-feedback-warning-text)">'+esc(ctx.empty)+'</div>':'')
    +'<details class="ask-mats"><summary>材料清单 · '+fmtInt(stats.n_materials||prov.length)+' 件（'+fmtInt(stats.chars||0)+' 字）</summary>'
    +prov.map(function(m){
      var go=(typeof askMatOpen==='function')?askMatOpen(m):'';
      return '<div class="mrow" data-mid="'+esc(m.id)+'"><span class="mid">'+esc(m.id)+'</span>'
        +'<span style="flex:1;min-width:0"><span style="color:var(--color-text-primary)">'+esc(m.title)+'</span>'
        +'<br><span class="msrc">'+esc(m.source)+'</span></span>'
        +(go?'<button type="button" class="exp-btn" style="flex:none" onclick="'+go+'" title="打开这件材料所在的那一层">打开 ›</button>':'')
        +'</div>';
    }).join('')
    +'</details></div>';
  if(inf.ok===false){
    html+='<div class="ask-scope" style="margin-top:var(--space-2);border-color:var(--color-feedback-warning-default);color:var(--color-feedback-warning-text)">'+esc(inf.error||'推理端口不可用')+'</div>';
  }
  var hist=ASKH[key]||[],st=ASKS[key]||{};
  html+='<div class="ask-chat" id="askChat">';
  hist.forEach(function(h){
    html+='<div class="ask-q">'+esc(h.q)+'</div>';
    if(h.err){
      html+='<div class="ask-a err">'+esc(h.err)+'</div>';
    }else{
      html+='<div class="ask-a">'+askAnswerHTML(h.a,prov)
        +((h.cited||[]).length?'<div class="ask-cites">引用材料：'+h.cited.map(function(c){return '<span class="tag mono" title="'+esc((c.title||'')+' — '+(c.source||''))+'">'+esc(c.id)+' '+esc(c.title||'')+'</span>'}).join('')+'</div>':'')
        +(h.model?'<div style="margin-top:4px;font:400 11px/15px var(--font-sans);color:var(--color-text-metadata)">'+esc(h.model)+(h.via==='upstream'?' · 由生产实例作答':'')+' · 仅依据上列材料作答</div>':'')
        +'</div>';
    }
  });
  if(st.busy){
    html+='<div class="ask-q">'+esc(st.pending||'')+'</div>'
      +'<div class="ask-busy"><span class="cur"></span>正在依据当期材料作答</div>';
  }
  html+='</div>';
  if(!hist.length&&!st.busy){
    html+='<div class="ask-chips">'+askChipsFor(kind,ctx).map(function(c){
      return '<button type="button" class="ask-chip" onclick="askSend(\''+jss(pstr)+'\',this.textContent)">'+esc(c)+'</button>';
    }).join('')+'</div>';
  }
  var disabled=(inf.ok===false||st.busy)?' disabled':'';
  html+='<div class="ask-inrow">'
    +'<input id="askInput" class="ask-input" type="text" maxlength="2000" placeholder="'+(inf.ok===false?'推理服务不可用':'就当期推理提问')+'" value="'+esc(st.draft||'')+'"'+disabled
    +' oninput="(ASKS[askKey(\''+jss(pstr)+'\')]=ASKS[askKey(\''+jss(pstr)+'\')]||{}).draft=this.value"'
    +' onkeydown="if(event.key===\'Enter\')askSendFromInput(\''+jss(pstr)+'\')">'
    +'<button type="button" class="ask-send" onclick="askSendFromInput(\''+jss(pstr)+'\')"'+disabled+'>发送</button>'
    +'</div>'
    +epi('每次追问与回答均追加写入审计日志 data/ask_log.jsonl');
  return html;
}

/* Esc：先关抽屉，再关别的浮层 */
document.addEventListener('keydown',function(e){

     否则 Esc 会从它背后抽走一层抽屉，看起来像按错了键。 */
  if(typeof corpusOpen!=='undefined'&&corpusOpen){closeCorpus();return}
  if(drawerStack.length){if(e.shiftKey)closeDrawers();else popDrawer();return}
  if(typeof helpOpen!=='undefined'&&helpOpen){toggleHelp();return}
});

/* ── 整行可点的键盘补位 ──────────────────────────────────────────────
 * 页面上绝大多数可点的东西都是真的 <button>——但有三类做不成：整行可点的表格行、
 * 研报行、可排序表头。它们只有 onclick / addEventListener，Tab 停不下来、回车也
 * 没反应。而「打开这一仓」「展开这篇研报」「按上行排序」在别处没有等价入口，
 * 也就是说纯键盘的人到不了。
 * 不去改每一个生成器（它们散在十几处），统一在渲染之后补上：可聚焦 + 回车/空格
 * 触发 + 同一套焦点环。 */
var ROW_CLICKABLE='.doc-row[onclick],.cal-main.expandable[onclick],tr.expandable[onclick],#candTable th.sortable';
function armRowKeys(){
  var list=document.querySelectorAll(ROW_CLICKABLE);
  for(var i=0;i<list.length;i++){
    var el=list[i];
    if(el.hasAttribute('tabindex'))continue;
    el.setAttribute('tabindex','0');
    /* <tr> 和 <th> 不加 role=button：它们得继续被读成表格行、表头，
       否则读屏就报不出行列关系。div 就没有这层身份，加上才说得清它可以按。 */
    if(el.tagName==='DIV')el.setAttribute('role','button');
  }
}
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter'&&e.key!==' ')return;
  var t=e.target;
  if(!t||!t.matches||!t.matches(ROW_CLICKABLE))return;
  e.preventDefault();
  t.click();
});
if(window.MutationObserver){
  var _armQueued=false;
  new MutationObserver(function(){
    if(_armQueued)return;
    _armQueued=true;
    requestAnimationFrame(function(){_armQueued=false;armRowKeys()});
  }).observe(document.body,{childList:true,subtree:true});
  armRowKeys();
}

/* 错误信息的可读化映射 */
function plainRunError(e){
  if(!e)return null;
  if(e.indexOf('permanently missed')>=0)return '该期已错过且不补跑：当期研报无法按原深度取回，补跑将引入前视。';
  if(e.indexOf('没有任何研报')>=0)return '当期研报缺失，无法运行，记为失败。';
  if(e.indexOf('killed')>=0||e.indexOf('hung')>=0||e.indexOf('timeout')>=0)return '运行中途挂起，由超时保护终止。';
  if(e.indexOf('wisburg')>=0&&e.indexOf('0 行')>=0)return '研报源本期返回 0 条，按异常处理。';
  return e;
}
function plainFeedError(e){
  if(!e)return null;
  if(e.indexOf('returned 0 rows')>=0||e.indexOf('0 rows')>=0)return '来源有响应但本期返回 0 条，按异常处理。';
  return e;
}

function feedHealthRows(){

  return Object.keys(groups).map(function(k){

/* ── 运行记录抽屉：按期列出运行、数据与错误 ── */
function calDrawerBody(){
  var runs=S.runs||[],gaps=S.gaps||[],feeds=S.feeds||[];
  var curPeriod=(S.schedule||{}).current_period;
  var periods={};
  runs.forEach(function(r){
    if(r.kind!=='weekly'&&r.kind!=='weekly_missed')return;
    if(!periods[r.as_of])periods[r.as_of]={as_of:r.as_of,attempts:[],missed:false};
    if(r.kind==='weekly_missed')periods[r.as_of].missed=true;
    else periods[r.as_of].attempts.push(r);
  });
  gaps.forEach(function(g){
    if(!periods[g])periods[g]={as_of:g,attempts:[],missed:true};
    else periods[g].missed=true;
  });
  /* 上一次成功的周跑（weekly 摘要），runs 表可能已滚出 */
  var wsum=S.weekly||{};
  if(wsum.as_of&&!periods[wsum.as_of]){
    periods[wsum.as_of]={as_of:wsum.as_of,attempts:[],missed:false,
      summaryOk:!!wsum.ok,summaryCalls:wsum.calls,summaryRunId:wsum.run_id};
  }
  /* 本期结果只存在于心跳 outcomes 里（失败的 weekly 尝试不写 runs 表）时，也要在周历里出现 */
  var wkOut=hbOutcome('weekly');
  if(wkOut&&wkOut.period&&!periods[wkOut.period]){
    periods[wkOut.period]={as_of:wkOut.period,attempts:[],missed:false,hbAction:wkOut.action};
  }else if(wkOut&&wkOut.period&&periods[wkOut.period]&&!periods[wkOut.period].attempts.length){
    periods[wkOut.period].hbAction=wkOut.action;
  }
  /* 盯市一行置顶 */
  var todayStr=(function(){var p=hktParts();return p.y+'-'+String(p.m).padStart(2,'0')+'-'+String(p.d).padStart(2,'0')})();
  var mons=runs.filter(function(r){return r.kind==='monitor'});
  var monsToday=mons.filter(function(r){return (r.started_at||'').length&&hktDateOf(r.started_at)===todayStr});
  var latestMon=mons[0]||null;
  var monLine='';
  if(mons.length){
    var monBad=latestMon&&!latestMon.ok;
    monLine='<div class="cal-row"><div class="cal-main" style="cursor:default">'
      +'<span class="cal-date num">盯市</span>'
      +(monBad?badge('warning','有告警'):badge('success','正常'))
      +'<span class="cal-text">当日盯市 '+monsToday.length+' 次 · 最近 '+hktFmt(latestMon.started_at,false)
      +(monBad?'　·　'+esc(plainRunError(latestMon.error)||''):'')+'</span>'
      +'<button type="button" class="exp-btn" style="margin-left:auto;flex:none" onclick="openRunLogStacked(\''+jss(latestMon.run_id)+'\')">日志 ›</button>'
      +'</div></div>';
  }
  var plist=Object.keys(periods).sort().reverse().map(function(k){return periods[k]});
  var calRows=plist.map(function(p,pi){
    var label=p.as_of.slice(5);
    var isCur=p.as_of===curPeriod;
    var att=p.attempts.slice().sort(function(a,b){return String(b.started_at||'').localeCompare(String(a.started_at||''))});
    var okRun=att.find(function(r){return r.ok});
    var flying=att.find(function(r){return !r.ended_at});
    var state,chip;
    if(p.missed){chip=badge('error','永久缺失');state='该期已错过且不补跑：当期研报无法按原深度取回，补跑将引入前视。'}
    else if(okRun){chip=badge('success','完成');state='运行完成，模型调用 '+fmtInt(okRun.calls)+' 次。'}
    else if(p.summaryOk){chip=badge('success','完成');state='运行完成'+(p.summaryCalls?'，模型调用 '+fmtInt(p.summaryCalls)+' 次':'')+'（取自周跑摘要，明细已超出近 30 条运行记录窗口）。'}
    else if(p.hbAction==='failed'){chip=badge('error','失败');state='心跳记录：本期周跑失败，runs 表无该次尝试明细。'}
    else if(p.hbAction){chip=badge('neutral',esc(p.hbAction));state='心跳记录结果：'+esc(p.hbAction)+'。'}
    else if(flying){
      var mins=flying.started_at?Math.max(0,Math.round((Date.now()-new Date(flying.started_at).getTime())/60000)):null;
      chip=badge('info','进行中',true);
      state='选仓进行中'+(mins!==null?'，已运行 '+mins+' 分钟':'')+(att.length>1?'（第 '+att.length+' 次尝试，上次：'+(plainRunError(att[att.length-1].error)||'失败')+'）':'')+'。';
    }
    else{chip=badge('error','失败');state=plainRunError(att[0]&&att[0].error)||'运行失败，原因见展开。'}
    /* 展开:运行尝试 + 该期数据源 + 错误原文 */
    var attHtml=att.length?att.map(function(r){
      return '<div style="padding:4px 0">'
        +'<span class="mono" style="color:var(--color-text-tertiary)">'+esc(r.run_id)+'</span>　'
        +hktFmt(r.started_at,true)+' → '+(r.ended_at?hktFmt(r.ended_at,true):'仍在跑')
        +' · 调用 '+fmtInt(r.calls)+' 次'
        +'　<button type="button" class="exp-btn" onclick="event.stopPropagation();openRunLogStacked(\''+jss(r.run_id)+'\')">日志 ›</button>'
        +(r.error?'<div style="color:var(--color-text-tertiary);font-size:12px;line-height:18px">错误原文：'+esc(r.error)+'</div>':'')
        +'</div>';
    }).join(''):(p.summaryRunId
      ?'<div class="quiet">明细运行记录已超出近 30 条窗口，运行日志快照仍可读：<button type="button" class="exp-btn" onclick="event.stopPropagation();openRunLogStacked(\''+jss(p.summaryRunId)+'\')">run '+esc(p.summaryRunId)+' 的日志 ›</button></div>'
      :'<div class="quiet">该期无运行记录。</div>');
    var pfSeen={};
    var pf=feeds.filter(function(f){
      if(f.as_of!==p.as_of)return false;
      var k=f.feed+'|'+f.n_rows+'|'+f.ok;
      if(pfSeen[k])return false;pfSeen[k]=1;return true;
    });
    var pfHtml=pf.length
      ?'<div style="margin-top:6px;padding-top:6px;border-top:1px solid var(--color-border-subtle)">该期数据源：'
        +pf.map(function(f){
