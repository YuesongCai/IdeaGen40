<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IdeaGen40 · 数据源</title>
<style>
:root{
  --bg:#f5f6f7;--surface:#fff;--ink:#24211f;--muted:#706b65;
  --line:#dedbd6;--brand:#174b35;--brand-hover:#0f3c2a;
  --ok:#167447;--warn:#9a6712;--bad:#ad2f2f;--soft:#edf3ef;
  --sans:'SF Pro Display','PingFang SC','Noto Sans SC',-apple-system,
         BlinkMacSystemFont,'Helvetica Neue','Microsoft YaHei',sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/20px var(--sans)}
main{width:min(760px,calc(100% - 32px));margin:0 auto;padding:40px 0 64px}
.back{display:inline-flex;align-items:center;gap:8px;color:var(--muted);
  text-decoration:none;margin-bottom:28px}
.back:hover{color:var(--brand)}
h1{margin:0;font-size:28px;line-height:36px;font-weight:650;letter-spacing:0}
.lead{margin:8px 0 28px;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;
  padding:24px}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px}
.name{font-size:18px;line-height:26px;font-weight:650}
.meta{margin-top:4px;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:7px;min-height:28px;padding:3px 10px;
  border-radius:999px;background:#f0f1f2;color:var(--muted);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:#8c8c8c}
.badge.ok{background:#e8f4ed;color:var(--ok)}.badge.ok .dot{background:var(--ok)}
.badge.run{background:#fff4dc;color:var(--warn)}.badge.run .dot{background:var(--warn)}
.badge.bad{background:#fbeaea;color:var(--bad)}.badge.bad .dot{background:var(--bad)}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;
  background:var(--line);border:1px solid var(--line);margin:24px 0}
.fact{background:var(--surface);padding:14px}.k{color:var(--muted);font-size:12px}
.v{margin-top:3px;font-weight:600;overflow-wrap:anywhere}
.notice{padding:14px 16px;background:var(--soft);border-left:3px solid var(--brand);
  color:#3f4e46;margin:20px 0}
.error{background:#fbeaea;border-left-color:var(--bad);color:#812626}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
button,a.button{min-height:38px;padding:8px 16px;border-radius:6px;border:1px solid var(--line);
  background:#fff;color:var(--ink);font:600 14px/20px var(--sans);cursor:pointer;
  text-decoration:none}
button.primary{background:var(--brand);border-color:var(--brand);color:#fff}
button.primary:hover{background:var(--brand-hover)}
button:disabled{opacity:.55;cursor:not-allowed}
.foot{margin-top:18px;color:var(--muted);font-size:12px}
@media(max-width:640px){
  main{padding-top:24px}.head{flex-direction:column}.facts{grid-template-columns:1fr}
}
</style>
</head>
<body>
<main>
  <a class="back" href="/">← 返回运行台</a>
  <h1>数据源</h1>
  <p class="lead">管理授权数据连接。未授权时，运行台继续使用当前货架数据。</p>

  <section class="panel" aria-live="polite">
    <div class="head">
      <div>
        <div class="name">Olive MCP</div>
        <div class="meta">Noah SSO · OAuth 2.1 PKCE</div>
      </div>
      <div class="badge" id="badge"><span class="dot"></span><span id="badgeText">读取中</span></div>
    </div>

    <div class="facts">
      <div class="fact"><div class="k">授权</div><div class="v" id="authState">—</div></div>
      <div class="fact"><div class="k">真实货架</div><div class="v" id="shelfState">—</div></div>
      <div class="fact"><div class="k">最近同步</div><div class="v" id="syncTime">—</div></div>
    </div>

    <div id="notice" class="notice">正在检查连接状态。</div>

    <div class="actions">
      <form method="get" action="/api/olive/oauth/start" id="authForm">
        <button class="primary" type="submit" id="authButton">前往 Noah SSO 授权</button>
      </form>
      <form method="post" action="/api/olive/sync" id="syncForm" hidden>
        <button type="submit" id="syncButton">同步真实货架</button>
      </form>
    </div>
    <div class="foot">授权仅在点击后触发；后台周跑不会弹出登录页面。</div>
  </section>
</main>
<script>
'use strict';
var pollTimer=null;
function text(id,value){document.getElementById(id).textContent=value}
function hkt(iso){
  if(!iso)return '—';
  var d=new Date(iso);if(isNaN(d))return '—';
  return new Intl.DateTimeFormat('zh-Hans',{timeZone:'Asia/Hong_Kong',
    year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).format(d);
}
function render(s){
  var badge=document.getElementById('badge');
  var notice=document.getElementById('notice');
  var sync=s.sync||{},snap=s.live_snapshot;
  var connected=!!s.configured,running=sync.state==='running';
  badge.className='badge '+(running?'run':(connected?'ok':''));
  text('badgeText',running?'同步中':(connected?'已授权':'未授权'));
  text('authState',connected?(s.refreshable?'可自动续期':'访问令牌已保存'):'等待 Noah SSO');
  text('shelfState',snap?(snap.items+' 个产品 · '+snap.navs+' 个 NAV'):'尚无真实快照');
  text('syncTime',snap?hkt(snap.captured_at):(sync.finished_at?hkt(sync.finished_at):'—'));
  document.getElementById('authButton').textContent=connected?'重新授权':'前往 Noah SSO 授权';
  document.getElementById('syncForm').hidden=!connected;
  document.getElementById('syncButton').disabled=running;
  notice.className='notice'+(sync.state==='error'||s.status_error?' error':'');
  if(sync.state==='error'){
    notice.textContent='同步失败：'+(sync.error||'请稍后重试');
  }else if(s.status_error){
    notice.textContent='状态读取失败：'+s.status_error;
  }else if(running){
    notice.textContent='已完成授权，正在从 Olive MCP 读取目录并归档到 RDS/TOS。';
  }else if(snap){
    notice.textContent='真实货架快照已归档。运行台默认隐藏授权产品名称并显示不可逆别名。';
  }else if(connected){
    notice.textContent='授权已保存，可开始同步真实货架。';
  }else{
    notice.textContent='点击授权后，浏览器会跳转 Noah SSO；完成扫码后自动回到本站。';
  }
  if(running&&!pollTimer)pollTimer=setTimeout(load,3000);
}
function load(){
  pollTimer=null;
  fetch('/api/olive/status',{credentials:'same-origin'})
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
    .then(render)
    .catch(function(e){
      var n=document.getElementById('notice');n.className='notice error';
      n.textContent='连接状态读取失败：'+e.message;
    });
}
load();
</script>
</body>
</html>
