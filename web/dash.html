/* 合计收益与基准收益只算一次。首屏摘要和策略对比卡的合计行必须给出同一个
   数字，各算各的迟早会漂移——口径归一处，两边都从这里取。
   计算本身仍基于服务端 books/benchmark 的原始字段，前端只做换算与格式。 */
function aggReturnPct(ag){
  /* 服务端已经把跨组合聚合算好了（review._books_aggregate），口径写在
     books_aggregate.basis 里、有测试钉住、可回放。前端优先用它——跨源聚合
     不该由渲染层各自推导一遍。 */
  var sa=(S||{}).books_aggregate;
  if(sa&&sa.return_pct!==null&&sa.return_pct!==undefined)return sa.return_pct;
  if(!ag||!ag.capital)return null;
  var eq=ag.equity||[];
  var last=eq.length?eq[eq.length-1].equity:null;
  if(last!==null)return (last/ag.capital-1)*100;
  /* 合计净值曲线要求各组合日期轴完全一致，有组合晚一期建仓就拿不到。
     退而用各组合自己的收益率按本金加权——bookRet 是系统对「一个组合的
     收益率」的既有定义，这里只是把它们合起来，不是另造一套公式。 */
  var num=0,den=0;
  currentBooks().forEach(function(b){
    var r=bookRet(b);
    if(r!==null&&b.capital){num+=r*b.capital;den+=b.capital}
  });
  return den?num/den:null;
}
/* 基准必须和组合量同一段日期。基准序列比组合净值多起了几个交易日，
 * 直接用整条序列，就是拿 SPY 的额外几天去和组合比——「跑输 N 个百分点」
 * 这个头条结论会随之偏掉，而且偏多少取决于那几天涨跌，不可预测。
 * 起点取组合净值的最早日期，基准用该日或之前最近的一个收盘作基数。 */
function bookWindowStart(){
  var bs=currentBooks(),first=null;
  bs.forEach(function(b){
    var e=b.equity||[];
    if(e.length&&e[0].d&&(first===null||e[0].d<first))first=e[0].d;
  });
  return first;
}
function benchBase(){
  var sr=((S&&S.benchmark)||{}).series||[];
  if(sr.length<2)return null;
  var start=bookWindowStart();
  if(!start)return {i:0,aligned:false,start:sr[0].d};
  var idx=-1;
  for(var i=0;i<sr.length;i++){if(sr[i].d<=start)idx=i;else break}
  if(idx<0){                      /* 基准序列整体晚于组合起点：只能用它自己的第一天 */
    return {i:0,aligned:false,start:sr[0].d,wanted:start};
  }
  return {i:idx,aligned:true,start:sr[idx].d,wanted:start};
}
function benchReturnPct(){
  var sr=((S&&S.benchmark)||{}).series||[];
  var b=benchBase();
  if(!b||sr.length<2)return null;
  return (sr[sr.length-1].close/sr[b.i].close-1)*100;
}
function benchWindowNote(){
  var sr=((S&&S.benchmark)||{}).series||[];
  var b=benchBase();
  if(!b||!sr.length)return '';
  var raw=(sr[sr.length-1].close/sr[0].close-1)*100;
  var used=(sr[sr.length-1].close/sr[b.i].close-1)*100;
  var note=esc(benchName())+' 与组合取同一段日期：'+esc(b.start)+' → '+esc(sr[sr.length-1].d)+'。';
  if(Math.abs(raw-used)>0.05){
    note+='基准行情本身还多几个交易日（自 '+esc(sr[0].d)+' 起为 '+raw.toFixed(2)+'%），'
      +'那一段组合尚未建仓，计进来就不是同期比较了，所以这里按 '+esc(b.start)+' 起算。';
  }
  if(!b.aligned&&b.wanted)note+='注意：基准行情最早只到 '+esc(sr[0].d)+'，晚于组合起点 '+esc(b.wanted)+'，这个对照并不严格同期。';
  return note;
}
function benchName(){
  return (((S&&S.benchmark)||{}).code||'SPY').replace('US.','');
}

/* ── 首屏摘要：本期组合的收益，以及相对基准是跑赢还是跑输 ──────────
   这一页叫「组合」，可损益此前只出现在策略对比卡的合计行里，读者要往下
   滚过主链路和整张噪音带图才看得到。第一档信息上提到首屏，口径与合计行
   同源（aggReturnPct / benchReturnPct），不新增一套数字。 */
/* 已跑到第几周。首屏结论和策略对比卡必须引用同一个周数，各算各的会说出
   两个不同的「第 N 周」。 */
/* 「什么时候开始持有」= 最早一笔实际建仓日，不是 booked_as_of。
 * booked_as_of 是组合最新一批想法的期次标签；当前每个组合都写着 2026-09-02，
 * 而 114 笔持仓（111 在场 + 3 已平）全部建于 2026-08-26。用批次标签当建仓日，
 * 首屏就会说「09-02 才建仓、此前是现金」——差了整整一周，而且「建仓后第 N 周」
 * 也跟着少算一周，直接影响「还要多久才够判定」那句话。
 * 落回 booked_as_of 只发生在一笔持仓都没有的时候（那时它确实是最好的近似）。 */
function firstBookedDate(books){
  /* 服务端的 first_opened_d 覆盖在场与已平两类持仓；state 只带 open_positions，
     所以只看在场持仓会在最早那批全平掉之后把建仓日算晚。这个日期是
     「第 N 周 / 约 17 周」的分子，算晚一周就把实验进度说少一周。 */
  var minOpened=null;
  (books||[]).forEach(function(b){
    if(b.first_opened_d&&(minOpened===null||b.first_opened_d<minOpened))
      minOpened=b.first_opened_d;
  });
  if(minOpened)return minOpened;
  (books||[]).forEach(function(b){
    (b.open_positions||[]).forEach(function(p){
      if(p.opened_d&&(minOpened===null||p.opened_d<minOpened))minOpened=p.opened_d;
    });
  });
  if(minOpened)return minOpened;
  var minBooked=null;
  (books||[]).forEach(function(b){
    if(b.booked_as_of&&(minBooked===null||b.booked_as_of<minBooked))minBooked=b.booked_as_of;
  });
  return minBooked;
}
/* 首屏那两个大数的实际区间。组合的净值曲线从 bookWindowStart 起算，基准
 * 对齐到同一天——但建仓要晚得多，中间那段组合是现金。区间不写出来，
 * 「第 1 周」旁边挂着一个六周的 SPY 涨幅，读者只会算出 SPY 一周涨 6%。 */
function weekIndex(books){
  var minBooked=firstBookedDate(books);
  if(!minBooked)return 1;
  var days=(Date.now()-new Date(minBooked+'T00:00:00+08:00').getTime())/86400000;
  return Math.max(1,Math.ceil(days/7));
}
/* 组合 vs 基准的两条线，期初都归 100。两个数字说得清「跑赢还是跑输」，
   说不清「什么时候拉开的、中间回撤过没有」——那是 PM 看曲线的原因。
   数据全部来自服务端：books_aggregate.equity 与 benchmark.series。 */
/* 现金利率必须报系统实际在用的那个：货架 7 日收益中位数取到了就用它，
 * 取不到才落到 config.RISK_FREE_ANNUAL。页面以前直接写死兜底值还标「当前」，
 * 在货架有报价的那些周，印的是一个系统根本没用的数。 */
function cashRateNote(){
  var c=(S||{}).cash_rate;
  if(!c||c.annual===undefined||c.annual===null)return '未建仓的现金按货币市场利率计息。';
  var pct=(Number(c.annual)*100).toFixed(2)+'% 年化';
  return c.source==='shelf_median_7d'
    ? '未建仓的现金按货币市场利率计息（'+pct+'，取自货架 7 日收益中位数）。'
    : '未建仓的现金按货币市场利率计息（'+pct+'，货架未报价，用的是配置里的兜底值）。';
}
/* 组合与基准的差距，全站唯一的格式化入口。
   这个差就是读者拿两个头条数字相减能自己验的那一个（+0.46% 与 +5.99% →
   5.53），所以精度必须和那两个数对得上。之前概览写「5.53 个百分点」、
   证据写「−5.5pp」，同一个事实两个写法，谁去核对谁都会以为算错了。 */
function fmtGapPp(gap,opts){
  if(gap===null||gap===undefined||!isFinite(gap))return '—';
  opts=opts||{};
  var v=Math.abs(gap).toFixed(2);
  return opts.signed
    ? (gap>=0?'+':'−')+v+(opts.unit||'pp')
    : v+(opts.unit||'pp');
}
function spyLine(ret){
  // 同一段日期里持有基准指数的收益。合计收益没有这个零点就没有含义：
  // 组合 +1% 而 SPY +3%，相对收益为负。
  var bm=(S&&S.benchmark)||{},sr=bm.series||[];
  var r=benchReturnPct();
  if(r===null)return '';
  var t=' · 同期 '+benchName()+' <span class="num '+pctCls(r)+'" title="'+sr[0].d+' 至 '+sr[sr.length-1].d+' 的收盘价涨跌，作为满仓基准的参照">'+fmtPct(r)+'</span>';
  if(ret!==null&&isFinite(ret)){
    var d=ret-r;
    t+=' <span class="num '+pctCls(d)+'" title="合计收益减去同期基准收益：正 = 跑赢基准">（'+fmtGapPp(d,{signed:true})+' vs '+benchName()+'）</span>';
  }
  return t;
}
function fmtWinRate(wins,closed){
  // Jon 的硬门槛是胜率>50%。样本太小时不上色：1 平 1 亏染红整块面板，
  // 读出来是「这方法不行」，而真相是「还没什么可下结论的」。
  if(!closed)return '<span class="num" title="尚无已平仓记录，胜率不可计算">—</span>';
  var r=wins/closed,txt=(r*100).toFixed(0)+'%（'+wins+'/'+closed+'）';
  var cls=closed>=5?(r>0.5?'up':'down'):'';
  return '<span class="num '+cls+'" title="已平仓中赚钱的比例；打平算输。Jon 的门槛：>50% 才拿去见 PM'+(closed<5?'。样本仍太小（<5 单），先别下结论':'')+'">'+txt+'</span>';
}
function togglePos(pid){
  var row=document.querySelector('tr.thesis-row[data-pid="'+pid+'"]');
  if(row)row.style.display=(row.style.display==='none')?'':'none';
}

/* ── 可交易货架：本期可买入标的的来源与时效，包括已知缺口 ── */
function universeCard(){
  var shelf=(S&&S.shelf)||{};
  var feed=(S.feeds||[]).filter(function(f){return f.kind!=='corpus'&&/instrument|universe/.test(String(f.feed))})
    .sort(function(a,b){return String(b.as_of||'').localeCompare(String(a.as_of||''))})[0];
  var bsum=((S.backtest||{}).summary)||{};
  var undated=bsum.undated_shelf_instruments;
  var n=feed?feed.n_rows:null;
  if(n===null&&!shelf.snapshot_id)return '';

  var kv=function(k,v){return '<div class="meta-kv"><div class="k">'+k+'</div><div class="v">'+v+'</div></div>'};
  var meta='<div class="bt-meta">'
    /* 这个数是本期那次清单抓取的行数，不是货架里一共有多少标的，也不是
       其中有多少能取到行情。三个数同时存在，标签必须说清自己数的是哪一个，
       否则读者会把它当成「能买的标的有多少」。 */
    +kv('本期清单行数',n!==null?'<span class="num" title="本期最近一次标的清单抓取返回的行数。它既不是货架里标的总数，也不是其中能取到行情的数量——这三个数不相等。">'+fmtInt(n)+'</span>':'—')
    +kv('期次',feed&&feed.as_of?'<span class="num">'+esc(feed.as_of)+'</span>':'—')
    +kv('来源',feed?esc(feedMeta(feed.feed)[0]):'—')
    +kv('状态',feed?(feed.ok?badge('success','正常'):badge('error','异常')):'—')
    +(undated!==undefined&&undated!==null
      ?kv('缺上架日期','<span class="num" style="color:var(--color-feedback-warning-text)">'+fmtInt(undated)+'</span>')
      :'')
    +'</div>';

  var licensed=String(shelf.data_classification||'').indexOf('licensed-')===0;
  var navTable='';
  if(shelf.snapshot_id){
    var rows=(shelf.instruments||[]).slice(0,12).map(function(x){
      return '<tr><td class="primary mono">'+esc(x.instrument)+'</td>'
        +'<td>'+esc(x.name||'—')+'</td><td>'+esc(x.group||x.kind||'—')+'</td>'
        +'<td>'+esc(x.currency||'—')+'</td><td>'+esc(x.risk_level||'—')+'</td>'
        +'<td class="r num">'+fmtMoney(x.latest_nav)+'</td>'
        +'<td class="num">'+esc(x.nav_d||'—')+'</td></tr>';
    }).join('');
    var headline='<div class="card-title-row" style="margin-top:var(--space-4)">'
      +badge(licensed?'success':'neutral',licensed?'已授权货架':'当前货架')
      +'<span class="card-note">'+esc(shelf.as_of||'')+' · '+fmtInt(shelf.items)+' 个产品 · '+fmtInt(shelf.navs)+' 个 NAV</span></div>';
    /* 脱敏状态下「内部标识」和「产品」是同一个串、分组恒定、风险与 NAV 全空，
       这张表每一列都不携带信息。零信息的表比没有表更糟——它让人以为自己
       漏看了什么。等 NAV 接进来再渲染。 */
    /* 脱敏且无 NAV 时，原来这里还画一个「暂不展开」的空盒子——一整块高度
       只为说「这里没东西看」。那句话归到 headline 后面的 ⓘ，盒子删掉。 */
    navTable=(shelf.identifiers_redacted&&!shelf.navs)
      ? headline.replace('</div>',glossMark('已脱敏且尚无 NAV，暂不逐条展开：脱敏状态下内部标识与产品名是同一个串、分组恒定、风险与 NAV 全空，列出来每一列都不携带信息。等 NAV 接进来再渲染。')+'</div>')
      : headline+'<div class="table-wrap"><table><thead><tr>'
        +'<th>内部标识</th><th>产品</th><th>分组</th><th>币种</th><th>风险</th>'
        +'<th class="r">最新 NAV</th><th>NAV 日期</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
  }

  /* 这几条状态互相独立，而且不同向：上架日期核对是「已通过」，NAV 与脱敏是
     「确有缺口」。串成一句话、用同一个警示色写出来，会把通过的那条也读成警告。
     拆成一行一条、各自带状态点；长句退到 title 里。 */
  var gaps=[];
  /* 上架日期这条不能由前端自己从「有多少个未定日期」推断风险——服务端已经
     用实际持有的标的算过这件事，结论在 backtest.summary.shelf_dating 里。 */
  var sd=(((S||{}).backtest||{}).summary||{}).shelf_dating;
  if(sd&&sd.held_total){
    gaps.push(sd.held_after_window_start>0
      ? {ok:false,k:'上架日期',v:fmtInt(sd.held_after_window_start)+' / '+fmtInt(sd.held_total)+' 晚于窗口起点',
         d:'补跑期可能选入当时尚未上架的产品，该项前视风险成立。'}
      : {ok:true,k:'上架日期',v:fmtInt(sd.held_dated)+' / '+fmtInt(sd.held_total)+' 已定，早于窗口起点',
         d:'该项前视风险不成立。最新一个上架日期 '+(sd.held_latest_first_seen||'—')+'。其余 '
           +fmtInt(sd.held_total-sd.held_dated)+' 个是无行情代码的基金 / 结构化产品，仍未定日期。'});
  }else if(undated){
    gaps.push({ok:false,k:'上架日期',v:fmtInt(undated)+' 个未定',
      d:'按当期资格过滤时一律放行；服务端尚未给出持有标的的上架日期核对结果。'});
  }
  if(shelf.navs===0)gaps.push({ok:false,k:'NAV',v:fmtInt(shelf.items||0)+' 个产品 · 0 个 NAV',d:'这批标的暂时无法计价。'});
  if(!shelf.snapshot_id)gaps.push({ok:false,k:'NAV 快照',v:'未接入',d:'尚无已持久化的 NAV 快照，货架为静态清单。'});
  if(shelf.identifiers_redacted)gaps.push({ok:false,k:'产品标识',v:'默认脱敏',d:'完整快照仅存于受控 RDS/TOS。'});

  UNIV_GAPS=gaps.length;
  UNIV_ROWS=(n!==null?fmtInt(n)+' 行':'');
  return meta+navTable
    +(gaps.length?'<div class="gapl"><div class="gap-h">已知缺口</div>'+gaps.map(function(g){
        return '<div class="gap-row'+(g.ok?' ok':'')+'"><span class="gd"></span>'
          +'<span class="gk">'+esc(g.k)+'</span><span class="gv">'+esc(g.v)+'</span>'+glossMark(g.d)+'</div>';
      }).join('')+'</div>':'')
  +'</div>';
}

/* ── 回测摘要：真实候选池、真实收盘、零模型复算 ──
   置于首屏而非抽屉；详情仍在抽屉。 */
/* 胜率高不等于跑赢。配对检验才是结论判据，紧贴表格放置，
   避免单个胜率数字被读成结论。 */
function pairedVerdictLine(sum){
  var pr=(sum&&sum.paired)||{};
  var names=Object.keys(pr);
  if(!names.length)return '';
  var any=pr[names[0]]||{};
  var n=any.n_pairs||sum.periods||0;
  /* 三态而非两态：「样本量足够但未检出差异」同样是结论，且最易被误报为胜出——
     一个几乎复制对照的臂标准差极小，单周期即达到样本量，但与对照无实质差别。 */
  /* 输入指纹不一致意味着两组看的不是同一个候选池，后端的原话是「不可相减」。
     它会让该臂 conclusive=false，于是落进「样本量仍不足」那一档——一个数据
     完整性故障被显示成「样本太小」，而这两件事的严重程度差着一个数量级。
     当前所有臂都是空数组，这条路径平时不出现；但一条只有出事时才会走到、
     出事时又看不见的路径，等于没有。 */
  var broken=names.filter(function(k){
    var m=pr[k]&&pr[k].sha_mismatch;return m&&m.length;});
  if(broken.length){
    return '<div class="card-note" style="margin-top:var(--space-3);'
      +'color:var(--color-feedback-error-text)"><b>⚠ 配对检验不可用</b>：'
      +broken.map(function(k){return esc(backtestArmName(k))}).join('、')
      +' 与对照组合的输入指纹不一致，看的不是同一个候选池，两组不可相减。'
      +'下方结论在修复之前不成立。'
      +'<span class="gloss" title="'+esc((pr[broken[0]]||{}).message||'')+'">ⓘ</span></div>';
  }
  var won=names.filter(function(k){return pr[k]&&pr[k].conclusive});
  var flat=names.filter(function(k){return pr[k]&&pr[k].powered&&!pr[k].significant});
  if(won.length){
    return '<div class="card-note" style="margin-top:var(--space-3)">'
      +'配对检验：<b>'+won.map(function(k){return esc(backtestArmName(k))}).join('、')
      +'</b> 相对全量基准的差距已达到预注册门槛（样本量与显著性均满足，'
      +fmtInt(n)+' 个周期）。</div>';
  }
  if(flat.length){
    /* 「样本量已足够」是这一行里最强的一句话，而它站在很薄的地基上：
     * 达标的臂之所以达标，是因为它的实测标准差极小，把所需样本压到 1~2 个；
     * 而这个标准差是从 6 个互相重叠的窗口估出来的，后端自己也写着重叠会
     * 低估 sd、门槛只是下限。结论不改，但这个限定必须和结论同框——
     * 否则「已经够了」会被读成一个比它实际更硬的判定。 */
    var lim=flat.map(function(k){
      var v=pr[k]||{};
      return backtestArmName(k)+'：有效独立样本 n_eff='+(v.n_eff!==undefined?Number(v.n_eff).toFixed(1):'—')
        +'，所需 '+fmtInt(v.required_pairs)+'（门槛低是因为该组合实测标准差极小）';
    }).join('；');
    /* 结论一行、分组一行。原来这三件事串成一句 65 字的长句，
     * 最强的那句「无策略跑赢」被埋在中间。 */
    return '<div class="vd"><div class="vd-t">配对检验 <b>无选取策略被判定跑赢全量基准</b> '
      +glossMark('「样本量已足够」这个判定建立在实测标准差上，而标准差取自 '+fmtInt(n)+' 个互相重叠的持有窗口——重叠会低估标准差，因此所需样本量是下限，达标结论也应按下限理解。'+lim+'。换句话说：这是「在当前口径下没看出优势」，不等于「已经确证这个组合没有优势」。')+'</div>'
      +'<div class="vd-r"><span class="vk">样本已足、无差距</span><span class="vv">'
      +flat.map(function(k){return '<span class="tag">'+esc(backtestArmName(k))+'</span>'}).join(' ')+'</span></div>'
      +(names.length>flat.length?'<div class="vd-r"><span class="vk">样本量仍不足</span><span class="vv">其余 '+fmtInt(names.length-flat.length)+' 个组合</span></div>':'')
      +'</div>';
  }
  return '<div class="vd"><div class="vd-t">配对检验 <b>当前无选取策略被判定跑赢全量基准</b> '
    +glossMark('胜率是该窗口的历史描述，不构成预测，也不足以支持排名。')+'</div>'
    +'<div class="vd-r"><span class="vk">配对样本</span><span class="vv"><b class="num">'+fmtInt(n)+'</b> 对，远低于预注册门槛</span></div></div>';
}

/* ════════════════ 挑选过程本身可信吗 ════════════════════════════════════ */
/* 上面每张卡都在给某一条组合打分。这张卡打分的对象是**挑组合这个动作**，
   而它是唯一能为「养十一条组合」辩护的检验：九条存在，是为了能挑出一条。
   如果按此前成绩挑领先者，还不如随机挑一条，那这套装置就是只有成本没有产出，
   而任何一条组合自己的统计都看不出这一点——每条都可以很体面，同时挑选环节
   一点东西都不加。

   两个独立方法放一张卡：前推检验（按期，看决策）和 PBO（按日切块，看样本内
   赢家守不守得住）。它们方法不同、粒度不同，所以两个都指向同一边时才有分量。 */
function selectionCard(){
  var ts=(((S||{}).backtest||{}).summary||{}).tearsheet;
  if(!ts)return '';
  var wf=ts.walk_forward||{},pb=ts.pbo||{};
  if(!wf.all_arms&&!pb.splits)return '';
  var pct=function(v){return v==null?'—':fmtPct(v*100)};

  var wfRows=['all_arms','no_posthoc'].map(function(k){
    var b=wf[k];if(!b)return '';
    var tag=(k==='all_arms')?'含事后设计的组合':'剔除事后设计的组合';
    var beatsCtl=(b.control_mean!=null)&&(b.follow_leader_mean>b.control_mean);
    var beatsRnd=(b.all_arms_mean!=null)&&(b.follow_leader_mean>b.all_arms_mean);
    var ranks=(b.picks||[]).map(function(x){return x.rank_of_pick}).join(', ');
    var nLive=((b.picks||[])[0]||{}).n_arms_live;
    return '<tr'+(k==='no_posthoc'?' class="ls-ev"':'')+'>'
      +'<td class="primary">'+esc(tag)
        +(k==='no_posthoc'?' <span class="tag">该读这行</span>':'')+'</td>'
      +'<td class="r num '+(beatsCtl&&beatsRnd?'up':'down')+'">'+pct(b.follow_leader_mean)+'</td>'
      +'<td class="r num dim">'+pct(b.control_mean)+'</td>'
      +'<td class="r num dim">'+pct(b.all_arms_mean)+'</td>'
      +'<td class="r num dim">'+pct(b.hindsight_best_mean)+'</td>'
      +'<td class="r num dim">'+fmtInt(b.n_decisions)+'</td>'
      +'<td class="r num dim" title="被挑中的那条当期实际排名，共 '+fmtInt(nLive)+' 条">'
        +esc(ranks)+'</td></tr>';
  }).join('');

  var clean=wf.no_posthoc||wf.all_arms||{};
  var works=(clean.control_mean!=null&&clean.all_arms_mean!=null)
    ? (clean.follow_leader_mean>clean.control_mean&&clean.follow_leader_mean>clean.all_arms_mean)
    : null;
  var verdict=(works===null)?'':(works
    ? '<div class="card-note"><b>按此前成绩挑领先者，这段样本里既跑赢了全量基准也跑赢了随机挑一条。</b>'
      +'决策次数仍然很少，别当成结论。</div>'
    : '<div class="ls-note"><b>按此前成绩挑领先者，还不如随机挑一条。</b>'
      +'也就是说：这段样本里，「挑」这个动作本身没有产出。</div>');

  var pbRows=Object.keys(pb.splits||{}).sort(function(a,b){return a-b}).map(function(k){
    var b=pb.splits[k];if(b.pbo==null)return '';
    var ci=(b.null||{}).ci95||[null,null];
    return '<tr><td class="primary">切 '+esc(k)+' 块</td>'
      +'<td class="r num dim">'+fmtInt(b.n_combinations)+'</td>'
      +'<td class="r num">'+Number(b.pbo).toFixed(2)+'</td>'
      +'<td class="r num dim">'+((b.null||{}).median==null?'—':Number(b.null.median).toFixed(2))+'</td>'
      +'<td class="r num dim">'+(ci[0]==null?'—':'['+Number(ci[0]).toFixed(2)+', '+Number(ci[1]).toFixed(2)+']')+'</td>'
      +'<td class="r num dim">'+(b.p_value==null?'—':Number(b.p_value).toFixed(2))+'</td>'
      +'<td class="r">'+(b.better_than_noise?'优于噪声':'<span class="dim">与噪声分不开</span>')+'</td></tr>';
  }).join('');

  return '<div class="card section"><div class="card-title-row">'
    +'<h2 class="card-title">挑选过程本身可信吗</h2>'
    +'<span class="card-note">打分对象不是某一条组合，是「挑组合」这个动作</span></div>'
    +verdict
    +'<h3 class="sub-h">前推检验：每期只用此前的成绩挑领先者，再看它当期结果</h3>'
    +'<div class="table-wrap"><table class="data-table">'
      +'<thead><tr><th>口径</th>'
      +'<th class="r">跟随领先者</th><th class="r">全量基准</th>'
      +'<th class="r">随机挑一条<span class="gloss gm" title="当期所有组合的平均收益，也就是闭着眼睛挑一条的期望。跟随领先者跑不赢它，就说明挑选环节没有产出。">ⓘ</span></th>'
      +'<th class="r">事后最优</th><th class="r">决策次数</th><th class="r">被挑中那条的当期排名</th></tr></thead>'
      +'<tbody>'+wfRows+'</tbody></table></div>'
    +(wf.note?'<div class="card-note">'+esc(wf.note)+'</div>':'')
    +(pbRows?foldBlock('week.selection.pbo','回测过拟合概率 PBO',
      '样本内最优的那条，样本外守不守得住',
      '<div class="table-wrap"><table class="data-table">'
        +'<thead><tr><th>切法</th><th class="r">组合数</th><th class="r">实测 PBO</th>'
        +'<th class="r">同形状噪声<span class="gloss gm" title="零假设是「各条组合可交换」：在每个交易日内打乱组合标签，保留当天的横截面分布与相关结构，只抹掉组合身份。门槛是这一列，不是 0.5——样本内外取自同一段有限数据，赢家会机械性回归，偏移多少取决于组合数、观测数和块数。">ⓘ</span></th>'
        +'<th class="r">噪声 95% 区间</th><th class="r">p</th><th>判定</th></tr></thead>'
        +'<tbody>'+pbRows+'</tbody></table></div>'
      +(pb.note?'<div class="card-note">'+esc(pb.note)+'</div>':''),
      (pb.pbo_range?'PBO '+Number(pb.pbo_range[0]).toFixed(2)+'~'+Number(pb.pbo_range[1]).toFixed(2):'')):'')
    +'</div>';
}
/* ════════════════════ 业绩表 — 「拿着它这段时间会怎样」 ══════════════════════ */
/* 这张卡回答的问题和「历史回测」那张不同，所以是两张卡（一张卡一个问题）：
   那张问「A 挑得比 B 好吗」——配对、扣掉共同涨跌、看统计功效；
   这张问「拿着它这一段会怎样、路上有多难受」——净值本身、回撤、和指数比。
   在它存在之前，第二个问题的全部答案只有净值曲线的最后一点和回撤列的最小值，
   而机构读者（Jon、FOF 尽调、投委会）先问的恰恰是第二个。

   整张卡的排版只服从一件事：**先让人看见分不开，再让人看数**。
   区间图放在数字上面，是因为一张按收益排好序的表，读者在读到脚注之前
   就已经形成结论了——脚注改不动它。 */
function sharpeIntervalRow(label,pt,ci,isBench,lo,hi){
  var span=hi-lo||1;
  var X=function(v){return Math.max(0,Math.min(100,(v-lo)/span*100))};
  if(ci===null||ci===undefined||pt===null||pt===undefined){
    return '<div class="ts-row"><div class="ts-nm">'+esc(label)+'</div>'
      +'<div class="ts-track"><span class="card-note">区间算不出（样本过短或波动为 0）</span></div>'
      +'<div class="ts-v num">—</div></div>';
  }
  var a=X(ci[0]),b=X(ci[1]);
  return '<div class="ts-row'+(isBench?' ts-bench':'')+'">'
    +'<div class="ts-nm">'+esc(label)+'</div>'
    +'<div class="ts-track">'
      +'<i class="ts-bar" style="left:'+a.toFixed(1)+'%;width:'+Math.max(b-a,0.8).toFixed(1)+'%"></i>'
      +'<i class="ts-dot" style="left:'+X(pt).toFixed(1)+'%"></i>'
    +'</div>'
    +'<div class="ts-v num">'+Number(pt).toFixed(2)+'</div></div>';
}
/* 业绩表这一屏会同时出现三个条数，三个都对，但分母不同：
 *   n_trials    —— 折减用的试验次数：算得出夏普的组合 + 当初挑排序规则时
 *                  试过又弃掉的那几种（不算进去，冠军那条就被高估）
 *   n_measurable —— 算得出夏普置信区间、能参与「分不分得开」的组合
 *   fdr.m        —— 算得出 p 值、进这一族同时检验的组合
 * 三个数都从数据里取，别写死——它们会随可计价的组合数变。 */
function countsNote(fd,fdr,sep){
  var nT=Number(fd&&fd.n_trials)||0, nM=Number(sep&&sep.n_measurable)||0,
      nP=Number(fdr&&fdr.m)||0;
  if(!(nT&&nM&&nP))return '';
  var extra=nT-nM;
  return '<div class="card-note">这一屏有三个条数，它们不是同一批：<b>'+fmtInt(nT)
    +'</b> 是折减用的试验次数（'+fmtInt(nM)+' 条算得出夏普的组合'
    +(extra>0?('，加 '+fmtInt(extra)+' 种当初挑排序规则时试过又弃掉的排法——'
               +'不把它们算进去，冠军那条就被高估'):'')
    +'）；<b>'+fmtInt(nM)+'</b> 是能参与「分不分得开」判断的组合；<b>'+fmtInt(nP)
    +'</b> 是算得出 p 值、进这一族同时检验的组合。</div>';
}
function tearsheetCard(){
  var ts=(((S||{}).backtest||{}).summary||{}).tearsheet;
  if(!ts||!ts.arms||!Object.keys(ts.arms).length)return '';
  var arms=ts.arms,names=Object.keys(arms);
  var bp=ts.benchmark_performance||{},sep=ts.separability||{};
  var bench=ts.benchmark||'基准';
  var p0=(arms[names[0]]||{}).performance||{};

  /* 区间图的横轴：所有组合和基准的区间取并集，一把尺子量所有人。
     每条各自缩放会让最宽的那条看起来最窄，正好搞反。 */
  var lo=0,hi=0,any=false;
  names.concat(['__b']).forEach(function(n){
    var c=(n==='__b'?bp:(arms[n].performance||{})).sharpe_ci95;
    if(!c)return;
    if(!any){lo=c[0];hi=c[1];any=true}
    lo=Math.min(lo,c[0]);hi=Math.max(hi,c[1]);
  });
  if(!any){lo=-1;hi=1}
  var pad=(hi-lo)*0.04;lo-=pad;hi+=pad;
  var zeroX=Math.max(0,Math.min(100,(0-lo)/(hi-lo)*100));
  var benchX=(bp.sharpe==null)?null:Math.max(0,Math.min(100,(bp.sharpe-lo)/(hi-lo)*100));

  var ivRows=[['__b',bench+'（基准）',bp,true]].concat(
    names.slice().sort(function(x,y){
      return ((arms[y].performance||{}).sharpe||-99)-((arms[x].performance||{}).sharpe||-99);
    }).map(function(n){return [n,backtestArmName(n),arms[n].performance||{},false]})
  ).map(function(r){
    return sharpeIntervalRow(r[1],r[2].sharpe,r[2].sharpe_ci95,r[3],lo,hi);
  }).join('');

  var riskRows=[['__b',bench+'（基准）',bp,true]].concat(
    names.slice().sort(function(x,y){
      return ((arms[y].performance||{}).cum_return||-9)-((arms[x].performance||{}).cum_return||-9);
    }).map(function(n){return [n,backtestArmName(n),arms[n].performance||{},false]})
  ).map(function(r){
    var p=r[2];
    return '<tr'+(r[3]?' class="ls-ev"':'')+'><td class="primary">'+esc(r[1])+'</td>'
      +'<td class="r num '+pctCls((p.cum_return||0)*100)+'">'+fmtPct((p.cum_return==null?null:p.cum_return*100))+'</td>'
      +'<td class="r num">'+(p.ann_vol==null?'—':fmtRate(p.ann_vol*100))+'</td>'
      +'<td class="r num down">'+fmtPct((p.max_drawdown==null?null:p.max_drawdown*100))+'</td>'
      +'<td class="r num dim">'+(p.frac_underwater==null?'—':fmtRate(p.frac_underwater*100))+'</td>'
      +'<td class="r num dim">'+(p.pct_positive_days==null?'—':fmtRate(p.pct_positive_days*100))+'</td></tr>';
  }).join('');

  var relRows=names.slice().sort(function(x,y){
      return ((arms[y].relative||{}).information_ratio||-99)-((arms[x].relative||{}).information_ratio||-99);
    }).map(function(n){
      var r=arms[n].relative;if(!r)return '';
      return '<tr><td class="primary">'+esc(backtestArmName(n))+'</td>'
        +'<td class="r num">'+(r.beta==null?'—':Number(r.beta).toFixed(2))+'</td>'
        +'<td class="r num '+pctCls((r.alpha_ann||0)*100)+'">'+fmtPct((r.alpha_ann==null?null:r.alpha_ann*100))
          +(r.alpha_significant?' *':'')+'</td>'
        +'<td class="r num dim">'+(r.alpha_t==null?'—':Number(r.alpha_t).toFixed(2))+'</td>'
        +'<td class="r num dim">'+(r.r2==null?'—':Number(r.r2).toFixed(3))+'</td>'
        +'<td class="r num">'+(r.information_ratio==null?'—':Number(r.information_ratio).toFixed(2))+'</td>'
        +'<td class="r num dim">'+(r.up_capture==null?'—':fmtRate(r.up_capture*100))+'</td>'
        +'<td class="r num dim">'+(r.down_capture==null?'—':fmtRate(r.down_capture*100))+'</td></tr>';
    }).join('');

  var fd=ts.family_deflation||{},fdr=ts.fdr||{};
  var cost=ts.cost_reality||{};
  var costRows=Object.keys(cost).filter(function(n){return cost[n].n_positions}).sort(function(x,y){
      return (cost[y].breakeven_round_trip_pct||-99)-(cost[x].breakeven_round_trip_pct||-99);
    }).map(function(n){
      var c=cost[n],bad=c.breakeven_round_trip_pct<=c.applied_round_trip_pct;
      return '<tr><td class="primary">'+esc(backtestArmName(n))+'</td>'
        +'<td class="r num">'+Number(c.positions_per_period).toFixed(1)+'</td>'

function backtestCard(){

  var arms=sum.arms||{};

  names.forEach(function(n){

  var nBack=sum.n_backfill_periods||0;

      +sum.n_live_periods+' 期实盘记录 + '+nBack+' 期事后补跑 ⓘ</span>'
    : '<span>'+(sum.n_live_periods||sum.periods)+' 期全部为实盘记录</span>';
  var rows=names.sort(function(x,y){
      var ax=arms[x].hit_rate,ay=arms[y].hit_rate;

    }).slice(0,4).map(function(n){

  return '<div class="card section"><div class="card-title-row">'
    +'<h2 class="card-title">历史回测</h2>'
    +'<span class="card-note">真实候选池 · 真实收盘 · 零模型复算（'+fmtInt(sum.model_calls||0)+' 次模型调用）</span></div>'
    /* 结论先行——这句话代码里本来就写着，位置却是反的：判定排在窗口/期数/
       持有期/时间钳制四组元数据之后，读者要先跨过十五个数字才知道这张卡的
       结论是什么。本页其余每张卡都是标题之后一句话。元数据是这句话的脚注，
       不是它的前置条件。 */
    +pairedVerdictLine(sum)
    +'<div class="bt-meta">'
      +'<div class="meta-kv"><div class="k">窗口</div><div class="v num">'+esc(b.window_start||'—')+' → '+esc(b.window_end||'—')+'</div></div>'
      +'<div class="meta-kv"><div class="k">期数</div><div class="v">'+mix+'</div></div>'
      +(function(){
      var m=backtestMaturity();
      if(!m||!m.target)return '<div class="meta-kv"><div class="k">持有期</div><div class="v num">'+fmtInt(sum.horizon_days)+' 天</div></div>';
      var partial=m.n-m.full;

        +(partial?'其中 '+partial+' 期尚未满 '+m.target+' 天，它们的收益按最新收盘计价，是中途读数而不是已完成的交易——下表的胜率与平均收益把两类放在一起算，读的时候要记得这一点。'
                :'所有期次均已满 '+m.target+' 天。');
      return '<div class="meta-kv"><div class="k">持有期</div><div class="v num">目标 '+m.target+' 天'
        +'<span style="font-family:var(--font-sans);font-weight:400;color:var(--color-text-tertiary)"> · 实际已过 '+m.min+'~'+m.max+' 天'
        +(partial?'（'+partial+'/'+m.n+' 期未满）':'')+'</span>'

        +'<tbody>'+rows+'</tbody></table></div>'

        var cap='本表以单条想法为单位：候选池内每条想法按当时收盘价买入、'

          +'受选取条数、仓位、止损与现金约束，两者结论可以不一致。';
        var dis=humanizeKeys(sum.disclaimer||'');

          +'<b>本表与策略对比图口径不同</b>'

      })()
      +'<div style="margin-top:var(--space-5);padding-top:var(--space-4);border-top:1px solid var(--color-border-subtle)">'
      +backtestSection()+'</div>',

    +'</div>';

/* ════════════════════ 历史回测 — 底账内的一段（可选历史窗口） ═════════════════════ */
/* ── 排序力：系统自陈的期望回报，能不能排序真实结果 ─────────────
   每条候选生成时都写下上行/基准/下行三点情景与各自概率，折成一个期望回报。
   六期回测里它排得动结果，而在此之前没有任何一种挑法在用它——赔率策略按
   赚亏比排（对上行幅度是刻意盲的），校准策略按概率诚实度排，分散与左尾按
   组合形状排。这一段把「它排得动」和「它跑赢指数了吗」分开报：两个结论，
   合成一个数会把它们混掉。 */
function rankingQuintileBars(pooled,benchMean){
  var KEYS=['Q1','Q2','Q3','Q4','Q5'],vals=[];
  KEYS.forEach(function(k){var q=pooled[k];if(q)vals.push(q.mean_return_pct||0)});
  if(!vals.length)return '';
  var mx=Math.max.apply(null,vals.concat([benchMean||0]));
  if(!(mx>0))mx=1;
  var bpct=(benchMean||0)/mx*100;
  return '<div class="rk-bars">'
    +KEYS.map(function(k,i){
      var q=pooled[k];if(!q)return '';
      var w=Math.max((q.mean_return_pct||0)/mx*100,1.5);
      /* 越靠顶格越深：色深本身编码分位次序，不是装饰。 */
      var op=(0.34+0.66*(i/4)).toFixed(2);
      return '<div class="rk-row">'
        +'<div class="rk-k">'+k+'</div>'
        +'<div class="bar-track rk-track">'
          +'<div class="bar-fill" style="width:'+w.toFixed(1)+'%;opacity:'+op+'"></div>'
          +(bpct>0&&bpct<=100?'<i class="rk-bench" style="left:'+bpct.toFixed(1)+'%"></i>':'')
        +'</div>'
        +'<div class="rk-v num '+pctCls(q.mean_return_pct)+'">'+fmtPct(q.mean_return_pct)+'</div>'
        +'<div class="rk-n">胜率 '+fmtRate((q.hit_rate||0)*100)+' · '+fmtInt(q.n)+' 条想法</div>'
      +'</div>';
    }).join('')
    +'</div>'
    +'<div class="card-note" style="margin-top:var(--space-3)">'
      +'<i class="rk-bench-key"></i> 竖线为同期基准（SPY）六期均值 '+fmtPct(benchMean)
      +'——只有顶格分位越过它。</div>';
}
/* ── live 与补跑分开算 ─────────────────────────────────────────
   合并胜率是所有人会引用的那个数，而对 exploratory 注册的臂它是错的那个：
   ev_rank 是看过这六期结果之后才被挑出来检验的，跨这六期的数字量的是那次
   搜索，不是这条规则。所以把 live 列单独摆出来，并且在期数不够时明说它
   不该被读——把数算出来却没有一个屏幕指向它，和没算是一回事。 */
function liveSplitBlock(){
  var lb=(((S||{}).backtest||{}).summary||{}).live_vs_backfill;
  if(!lb||!lb.arms)return '';
  var rows=Object.keys(lb.arms).sort().map(function(name){
    var v=lb.arms[name],L=v.live||{},B=v.backfill||{};
    var isEv=v.evidence_column==='live';
    return '<tr'+(isEv?' class="ls-ev"':'')+'>'
      +'<td class="primary">'+esc(backtestArmName(name))
        +(isEv?' <span class="tag">看实跑列</span>':'')+'</td>'
      +'<td class="r num">'+fmtInt(L.n)+'</td>'
      +'<td class="r num">'+(L.hit_rate==null?'—':fmtRate(L.hit_rate*100))+'</td>'
      +'<td class="r num '+pctCls(L.mean_return_pct)+'">'+fmtPct(L.mean_return_pct)+'</td>'
      +'<td class="r num dim">'+fmtInt(B.n)+'</td>'
      +'<td class="r num dim">'+(B.hit_rate==null?'—':fmtRate(B.hit_rate*100))+'</td>'
      +'<td class="r num dim">'+fmtPct(B.mean_return_pct)+'</td></tr>';
  }).join('');
  var head=[
    ['选取策略','',''],
    ['实跑 条数','r','当期实跑的期次里，这个组合可计价的持仓条数。'],
    ['实跑 胜率','r','只算当期实跑期次。对常驻探索的组合，这是唯一能当证据的一列。'],
    ['实跑 均值','r','只算当期实跑期次的单笔平均收益。'],
    ['补跑 条数','r','事后补跑期次的条数。文档输入卡死在当期，但模型权重见过之后的世界。'],
    ['补跑 胜率','r','补跑期次的胜率。合并口径的数字主要由它撑起来。'],
    ['补跑 均值','r','补跑期次的单笔平均收益。']
  ].map(function(h){return '<th'+(h[1]?' class="'+h[1]+'"':'')+'>'+esc(h[0])
      +(h[2]?'<span class="gloss gm" title="'+esc(h[2])+'">ⓘ</span>':'')+'</th>'}).join('');
  var warn=lb.usable?'':'<div class="ls-note">现在只有 <b>'+fmtInt(lb.n_live_periods)
      +'</b> 期当期实跑（'+esc((lb.live_periods||[]).join('、'))
      +'），<b>实跑列还不该被读</b>——一期就是一个月一个市场里的几条持仓。还需要 '
      +fmtInt(lb.periods_needed)+' 期（四周是一轮完整的分批周期，不到一轮时'
      +'每条持仓都还开着）。</div>';
  /* 自己一张卡。它此前是「排序力」卡里的一个 h3 小节，于是那张卡同时回答
     两个问题——排序有没有梯度、实跑和补跑差多少——而本页其余每张卡都只回答
     一个。一张卡一个问题，是这一页自己的规矩。 */
  return '<div class="card section">'
    +'<div class="card-title-row"><h2 class="card-title">'
    +'当期实跑 vs 事后补跑</h2><span class="card-note">合并口径把两者混在一起</span></div>'
    +warn
    +'<div class="table-wrap"><table class="data-table"><thead><tr>'+head
    +'</tr></thead><tbody>'+rows+'</tbody></table></div></div>';
}
/* ── 证伪：这条排序是不是只是在排风险 ────────────────────────
   任何能排序收益的分数都要先过这一关，而这是它最可能挂掉的一关：上涨窗口里
   把风险从低到高排一遍，必然得到一条漂亮的收益阶梯。所以入场前波动和收益
   并排放，同一个分桶、同一张表——分开放等于让读者自己去发现它们形状相同。
   这块算出来了却一直没有屏幕指向它，而它是对上面那张图最强的反证。 */
function volControlBlock(){
  var rp=(((S||{}).backtest||{}).summary||{}).ranking_power||{};
  var vc=rp.volatility_control;
  if(!vc||!vc.buckets)return '';
  var KEYS=['Q1','Q2','Q3','Q4','Q5'].filter(function(k){return vc.buckets[k]});
  if(!KEYS.length)return '';
  var mr=0,mv=0;
  KEYS.forEach(function(k){
    mr=Math.max(mr,Math.abs(vc.buckets[k].mean_return_pct||0));
    mv=Math.max(mv,vc.buckets[k].mean_prior_vol_pct||0);
  });
  var rows=KEYS.map(function(k){
    var b=vc.buckets[k];
    return '<tr><td class="primary">'+k+'</td>'
      +'<td class="r num dim">'+fmtInt(b.n)+'</td>'
      +'<td class="vc"><i class="vcbar r" style="width:'
        +(mr?Math.max(Math.abs(b.mean_return_pct||0)/mr*100,1.5):1.5).toFixed(1)+'%"></i>'
        +'<em class="'+pctCls(b.mean_return_pct)+'">'+fmtPct(b.mean_return_pct)+'</em></td>'
      +'<td class="vc"><i class="vcbar v" style="width:'
        +(mv?Math.max((b.mean_prior_vol_pct||0)/mv*100,1.5):1.5).toFixed(1)+'%"></i>'
        +'<em>'+fmtRate(b.mean_prior_vol_pct)+'</em></td>'
      +'<td class="r num strong">'+(b.return_per_vol==null?'—'
        :Number(b.return_per_vol).toFixed(4))+'</td></tr>';
  }).join('');
  var hdr=[
    ['分位','',''],
    ['条数','r','该分桶里可计价的持仓条数。'],

function setBacktestStart(value){
  var b=(S&&S.backtest)||{};

  /* 完整回测已经从抽屉搬进「证据」页，重渲染的是那一页；抽屉里可能还开着
     别的东西，也一并刷新。用 setTimeout 而不是 rAF，理由同别处。 */
  renderEvidence();renderDrawers();
  setTimeout(function(){
    var body=document.querySelector('.drawer:last-of-type .drawer-body');
    var el=body?body.querySelector('#sec-backtest'):$('sec-backtest');
    if(el&&body)el.scrollIntoView({block:'start'});else scrollToEl($('sec-backtest'));

}
function median(values){
  if(!values.length)return null;
  var sorted=values.slice().sort(function(a,b){return a-b}),mid=Math.floor(sorted.length/2);
  return sorted.length%2?sorted[mid]:(sorted[mid-1]+sorted[mid])/2;
}

    var complete=rows.filter(function(p){

      return (new Date(p.exit_d+'T00:00:00Z')-new Date(p.entry_d+'T00:00:00Z'))/86400000>=Number(horizonDays||0);
    }).length;
    out[name]={

      coverage:rows.length?scored.length/rows.length:null,
      mean_return_pct:returns.length?returns.reduce(function(a,v){return a+v},0)/returns.length:null,
      median_return_pct:median(returns),
      hit_rate:returns.length?returns.filter(function(v){return v>0}).length/returns.length:null,

function backtestPairedSummary(p,start,end){
  if(!p)return null;
  var pairs=(p.pairs||[]).filter(function(x){return x.as_of>=start&&x.as_of<=end});
  var diffs=pairs.map(function(x){return Number(x.diff)}).filter(function(v){return !isNaN(v)});
  var ratio=Number(p.n_pairs)>0?Number(p.n_eff)/Number(p.n_pairs):1;
  return {
    conclusive:false,n_pairs:pairs.length,
    n_eff:pairs.length?(pairs.length*(isFinite(ratio)?ratio:1)).toFixed(3):0,
    mean_diff:diffs.length?diffs.reduce(function(a,v){return a+v},0)/diffs.length:null,
    message:pairs.length?'所选窗口内的配对结果。':'所选窗口内暂无配对结果。'
  };
}

function backtestCurveSVG(points){
  if(!points.length)return '<div class="empty-sm">暂无净值点</div>';
  var byArm={},dates={};
  points.forEach(function(p){(byArm[p.arm]=byArm[p.arm]||[]).push(p);dates[p.d]=1});
  var ds=Object.keys(dates).sort(),names=Object.keys(byArm);
  var W=760,H=230,pl=44,pr=125,pt=14,pb=24,mn=Infinity,mx=-Infinity;
  var series=names.map(function(name,i){
    var map={};byArm[name].forEach(function(p){map[p.d]=Number(p.equity)});
    var values=ds.map(function(d){return map[d]===undefined?null:map[d]});
    values.forEach(function(v){if(v!==null){mn=Math.min(mn,v);mx=Math.max(mx,v)}});
    // 只定义了 8 个数据色；真实回测现在有 9 条臂，第 9 条会拿到不存在的
    // 变量而画成透明。循环取用，宁可两条同色也不要一条隐形。
    return {name:name,values:values,color:'var(--color-data-'+(i%8+1)+')'};
  });
  if(!isFinite(mn)||!isFinite(mx))return '<div class="empty-sm">净值点不可用</div>';
  if(mx-mn<0.5){mn-=0.5;mx+=0.5}
  function X(i){return pl+i*(W-pl-pr)/Math.max(1,ds.length-1)}
  function Y(v){return pt+(mx-v)/(mx-mn)*(H-pt-pb)}
  series.forEach(function(s){
    var first=s.values.find(function(v){return v!==null});
    if(first!==undefined&&first!==null&&first!==0){
      s.values=s.values.map(function(v){return v===null?null:v/first*100});
    }
  });
  mn=Infinity;mx=-Infinity;
  series.forEach(function(s){s.values.forEach(function(v){if(v!==null){mn=Math.min(mn,v);mx=Math.max(mx,v)}})});
  if(mx-mn<0.5){mn-=0.5;mx+=0.5}
  var svg='<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block;max-width:800px" role="img" aria-label="所选窗口两种打分的回测净值曲线">';
  [mx,100,mn].forEach(function(g){
    if(g<mn-0.01||g>mx+0.01)return;
    svg+='<line x1="'+pl+'" y1="'+Y(g)+'" x2="'+(W-pr)+'" y2="'+Y(g)+'" stroke="var(--color-border-subtle)" stroke-width="1"'+(g===100?' stroke-dasharray="4 3"':'')+'/>'
      +'<text x="'+(pl-6)+'" y="'+(Y(g)+4)+'" text-anchor="end" font-family="var(--font-mono)" font-size="11" fill="var(--color-text-tertiary)">'+g.toFixed(1)+'</text>';
  });
  series.forEach(function(s){
    var pts=[];s.values.forEach(function(v,i){if(v!==null)pts.push(X(i).toFixed(1)+','+Y(v).toFixed(1))});
    if(pts.length>=2){
      svg+='<polyline points="'+pts.join(' ')+'" fill="none" stroke="'+s.color+'" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>';
    }
    var li=s.values.length-1;while(li>=0&&s.values[li]===null)li--;
    if(li>=0)svg+='<circle cx="'+X(li)+'" cy="'+Y(s.values[li])+'" r="2.5" fill="'+s.color+'"/>'
      +'<text x="'+(X(li)+8)+'" y="'+(Y(s.values[li])+4)+'" font-family="var(--font-sans)" font-size="11" fill="'+s.color+'">'+esc(backtestArmName(s.name))+' '+s.values[li].toFixed(1)+'</text>';
  });
  svg+='<text x="'+pl+'" y="'+(H-6)+'" font-family="var(--font-mono)" font-size="11" fill="var(--color-text-tertiary)">'+esc(ds[0])+'</text>'
    +'<text x="'+(W-pr)+'" y="'+(H-6)+'" text-anchor="end" font-family="var(--font-mono)" font-size="11" fill="var(--color-text-tertiary)">'+esc(ds[ds.length-1])+'</text></svg>';
  return '<div class="funnel-wrap">'+svg+'</div>';
}

  var px=Math.min(x+16,window.innerWidth-r.width-10);
  var py=Math.min(y+18,window.innerHeight-r.height-10);
  el.style.left=Math.max(6,px)+'px';el.style.top=Math.max(6,py)+'px';

function hidePop(){
  clearTimeout(popTimer);popCur=null;

}
/* ⓘ 的正路是「鼠标移上去就出字」。原生 title 要停留约一秒、样式还是系统的，
 * 所以这里把 .gloss 也接进同一个气泡：移上去 120ms 就出，移开就收。
 * 把 title 摘成 data-tip 是必须的——留着它，原生 tooltip 会在自己的气泡旁边
 * 再弹一个。摘的同时补 aria-label：.gloss 的可见文字只有一个「ⓘ」，
 * 读屏软件本来就靠 title，不能白摘。 */
function tipTextOf(el){
  if(!el)return '';
  if(el.hasAttribute('title')){
    var t=el.getAttribute('title')||'';
    el.setAttribute('data-tip',t);
    el.removeAttribute('title');
    if(t&&!el.getAttribute('aria-label'))el.setAttribute('aria-label',t);
  }
  return el.getAttribute('data-tip')||'';
}
function showTipFor(el){
  var txt=tipTextOf(el);
  if(!txt)return;
  var r=el.getBoundingClientRect();
  showPop('<div style="white-space:normal">'+esc(txt)+'</div>',r.left,r.bottom-8);
}
document.addEventListener('mouseover',function(e){
  var t=e.target;
  var el=(t&&t.closest)?t.closest('[data-pop]'):null;
  if(el){
    var id=el.getAttribute('data-pop');
    if(id===popCur)return;
    hidePop();popCur=id;popX=e.clientX;popY=e.clientY;
    popTimer=setTimeout(function(){if(popCur===id)showPop(POPS[id]||'',popX,popY)},150);
    return;
  }
  var g=(t&&t.closest)?t.closest('.gloss[title],.gloss[data-tip]'):null;
  if(g){
    if(popCur===g)return;
    hidePop();popCur=g;
    popTimer=setTimeout(function(){if(popCur===g)showTipFor(g)},120);
    return;
  }
  if(popCur)hidePop();
});
document.addEventListener('mouseout',function(e){
  if(!(popCur&&typeof popCur==='object'))return;      /* 只管 .gloss 那一路 */
  var to=e.relatedTarget;
  if(to&&popCur.contains&&popCur.contains(to))return;
  hidePop();
});
document.addEventListener('mousemove',function(e){popX=e.clientX;popY=e.clientY});
document.addEventListener('scroll',function(){hidePop()},true);

/* 触屏没有 hover，而 ⓘ 用的是原生 title——页面把大量口径、免责和推导都收在
 * 那里面，手机上等于全部读不到。这里让带 title 的 .gloss / ⓘ 也能点开，
 * 复用同一个气泡，不新增一套 UI。桌面维持 hover 原生 tooltip 不变。 */
document.addEventListener('click',function(e){
  var t=e.target;
  var g=(t&&t.closest)?t.closest('.gloss[title],.gloss[data-tip]'):null;
  if(!g){if(popCur&&popCur.nodeType===1)hidePop();return}
  /* ⓘ 不是按钮，点它不该连带触发外层那一行的 onclick——这一句在两种设备上都要。 */
  e.preventDefault();e.stopPropagation();
  /* 有 hover 的设备移上去就已经出字了，点击不能再当开关，否则点一下反而把它关掉。
   * 只有没有 hover 的设备（触屏）才靠点击开合。 */
  if(window.matchMedia&&!window.matchMedia('(hover:none)').matches)return;
  if(popCur===g){hidePop();return}
  hidePop();popCur=g;showTipFor(g);
},true);

/* ══════════ 渲染入口：画布 + 回执，就这两样 ══════════ */
/* 方法：它是怎么从 858 篇研报走到 73 条候选的。逐段可回溯。 */
/* force=true 表示这次重画是人点出来的，必须发生。
 * 不带 force 的调用来自每 60 秒的整页轮询，而这一页现在装着面板上唯一一个
 * 输入框——准则那句话。轮询重画会把打了一半的话连同光标一起换掉，所以
 * 正在往里打字时整页跳过；PH.say 由 oninput 实时同步，跳过不丢状态。 */
/* 有人正在写准则。表单曾经在页面上、现在在抽屉里，两处都归整页轮询重画。 */
function phTyping(){
  var t=$('phSay');
  if(!t||document.activeElement!==t)return false;
  PH.say=t.value;   /* 跳过之前先把话收好，跳过不丢状态 */
  return true;
}
/* 轮询中：只有 renderAll 会把它置 true。人点出来的重画一律照常发生，
   让路的只有每 60 秒那一次。 */
var PH_POLLING=false;

function renderMethod(force){
  var root=$('view-method');
  if(!S){root.innerHTML='';return}
  if(!force&&phTyping())return;
  root.innerHTML=
     procFailBanner()
    /* 「主链路」曾在这里画第二遍同一件事：它的 01/02/03 三段和下面流水线图的
       前三块点的是同一个 openStageDrawer(0/1/2)，858 与 73 两个数也和图上方那句
       导读逐字重复。同一个视图里一件事讲两遍、一个抽屉三个入口——留图，
       因为图多了筛选C 与建仓两段，而且图上的方块本身就是入口。 */
    +secWrap('method','canvas',pipeCanvasCard())
    /* 画布之后，研报之前。顺序不是排版偏好：上面那张图刚把筛选B 的四个框
       画完，这一段就是往那四个框旁边再加一个的地方。中间隔着别的东西，
       它就又变回一个孤零零的功能。 */
    +secWrap('method','rules',phSection())
    +secWrap('method','inputs',periodInputsCard());
  phBind();
  /* 主线第 03 段内嵌了候选池全表，它的行是 JS 填的。renderEvidence 里有同一句，
   * 但 toggleStage 只重跑 renderMethod —— 于是展开这一段之后，表头写着
   * 「73 条 · 列头排序」，底下一行都没有。谁生成这张表，谁负责把它填上。 */
  if($('candTable')){bindCandSort();renderCandBody()}
}

/* ── 本期输入 ───────────────────────────────────────────────────
 * 研报和货架从前各占一张卡，和上面「流水线」（过程层）平起平坐。它们其实
 * 是同一层、也是更下面一层：这一期喂进去的两样材料的体检，只有出问题时
 * 才需要翻。合成一张卡，外面只留一句话报体量，两样各收在自己的盖子里。 */
function periodInputsCard(){
  var corpusBody=corpusSourceCard();
  var univBody=universeCard();   /* 顺带回填 UNIV_GAPS / UNIV_ROWS */
  if(!corpusBody&&!univBody)return '';
  var cN=corpusCount();
  var lead=[cN?cN+'研报':'',UNIV_ROWS?'货架 '+UNIV_ROWS:'',
            UNIV_GAPS?UNIV_GAPS+' 项已知缺口':''].filter(Boolean).join(' · ');
  return '<div class="card section">'
    +'<div class="card-title-row"><h2 class="card-title" style="margin-bottom:0">本期输入</h2>'
    +'<span class="card-note">筛选A 读研报 · 筛选B 与筛选C 在货架里挑标的</span></div>'
    +(lead?'<div style="font:400 15px/23px var(--font-sans);color:var(--color-text-primary);margin:var(--space-2) 0 0">'+lead+'</div>':'')
    +(corpusBody?foldBlock('method.inputs.corpus','研报来源',
        '每个来源的期次 · 抓取次数 · 逐篇研报清单',corpusBody,cN||''):'')
    +(univBody?foldBlock('method.inputs.universe','可交易货架',
        '清单行数 · 期次 · 状态'+(UNIV_GAPS?' · 已知缺口':''),univBody,
        UNIV_ROWS+(UNIV_GAPS?' · '+UNIV_GAPS+' 项缺口':'')):'')
  +'</div>';
}

/* 研报来源：本期各来源的期次与条数，直达逐篇研报清单 */
function corpusSourceCard(){
  var w=S.weekly||{};
  var rows=(S.feeds||[]).filter(function(x){return x.kind==='corpus'&&x.as_of===w.as_of});
  var n=w.corpus_total||corpusRowsFor(w.as_of);
  var ce=stateErr('corpus_periods_error');
  if(!n&&!rows.length&&!corpusPeriods().length){
    /* 整块卡片消失是最不该有的失败方式：页面看起来就像本来没有这一节。 */
    if(!ce)return '';
    return '<div class="card section"><div class="qhead"><h2 class="qtitle">研报来源</h2></div>'
      +failNote('往期研报索引这次没建出来——不是没有研报。',ce)+'</div>';
  }
  var g={};rows.forEach(function(f){(g[f.feed]=g[f.feed]||[]).push(f)});
  var keys=Object.keys(g);
  var tbl=keys.length
    ?'<div class="table-wrap"><table>'
      +'<thead><tr><th>来源</th><th>期次</th><th class="r">条数</th><th>状态</th><th></th></tr></thead><tbody>'
      +keys.map(function(k){
        var arr=g[k],f=arr[0];
        var sum=arr.reduce(function(a,x){return Math.max(a,x.n_rows||0)},0);
        return '<tr class="expandable" onclick="openCorpus(\''+jss(f.as_of)+'\')">'
          +'<td class="primary">'+esc(feedMeta(f.feed)[0])+'</td>'
          +'<td class="mono">'+esc(f.as_of||'')+'</td>'
          +'<td class="r num">'+fmtInt(sum)+'</td>'
          +'<td>'+(arr.every(function(x){return x.ok})?badge('success','正常'):badge('error','异常'))
          +(arr.length>1?' <span class="card-note">'+arr.length+' 次抓取</span>':'')+'</td>'
          +'<td class="r"><span class="exp-btn">研报清单 ›</span></td></tr>';
      }).join('')+'</tbody></table></div>'
    :'';
  /* 这里曾再放一个「逐篇研报清单 ›」，而它上面那张表的每一行行末就写着
   * 「研报清单 ›」、整行可点，去的是同一个地方。后来又发现「来源分布与主题
   * 归属 ›」和流水线图上那个 858 的研报方块也是同一个 openStageDrawer(0)——
   * 同一视图同一抽屉两个入口。留图上那块：入口就该是内容本身。 */
  /* 抓取表只画本期，可「期次」这一栏摆在那里就是在说这是一根轴。往期语料
   * 一直在库里，缺的只是入口——补在同一张卡里，和抽屉里是同一份清单。 */
  var curN2=corpusPeriodN(w.as_of);
  if(!keys.length&&curN2){
    tbl='<div class="card-note">本期没有新的抓取记录——这一期复用了已入库的研报。'
      +'<button type="button" class="exp-btn" onclick="openCorpus(\''+jss(w.as_of)+'\')">浏览这 '+fmtInt(curN2)+' 篇 ›</button></div>';
  }
  return tbl+pastCorpusList(w.as_of);
}
/* 本期读入多少、多少家机构——盖子上要报的体量 */
function corpusCount(){
  var w=S.weekly||{};
  var n=w.corpus_total||corpusRowsFor(w.as_of);
  var insts={};
  Object.keys(w.evidence||{}).forEach(function(t){
    ((w.evidence[t]||{}).docs||[]).forEach(function(d){if(d&&d.institution)insts[d.institution]=1});
  });
  var ni=Object.keys(insts).length;
  return n?(fmtInt(n)+' 篇'+(ni?' · '+ni+' 家机构':'')):'';
}

/* 本期失败、展示上期时的诚实横幅 */
function procFailBanner(){
  var wkOut=hbOutcome('weekly');
  var curPeriod=(S.schedule||{}).current_period;
  var w=S.weekly||{};
  if(!(wkOut&&wkOut.action==='failed'))return '';
  if(!w.as_of||w.as_of===curPeriod)return '';
  return '<div class="card section" style="border-left:3px solid var(--color-feedback-warning-default);padding:var(--space-3) var(--space-5);margin-bottom:var(--space-5)">'
    +'<div style="font:500 13px/19px var(--font-sans);color:var(--color-feedback-warning-text)">本期（'+esc(wkOut.period||curPeriod||'')+'）周跑失败，下列为最近一次成功运行的完整过程（'+esc(w.as_of)+' 期）。</div>'
    +'</div>';
}

/* ══════════ 流水线画布 ══════════ */
function pipeCanvasCard(){
  var w=S.weekly||{};
  var svg=pipeCanvasSVG();
  /* 这张图先甩四十个数字和四行图例，却不说它证明了什么。读者要自己
     从「858 / 67 / 28 / 5 / 113 / 100 条·拒 3 …」里归纳出一句结论。
     先把结论写出来，图例收进 ⓘ——和本面板别处一致。 */
  var nDocs=w.corpus_total||0;
  var nTopics=topicChosen('hgep').length;
  var nGen=(w.generators||[]).reduce(function(a,g){return a+(g.n||0)},0);
  var nPool=(w.pool||{}).n||0;
  var ag=aggBooks();
  var lead=(nDocs&&nPool)
    ? '本期读入 <b>'+fmtInt(nDocs)+'</b> 篇研报，收敛出 <b>'+fmtInt(nTopics)+'</b> 个宏观主题，'
      +'<b>'+fmtInt(genOrder().length)+'</b> 种方法写出 <b>'+fmtInt(nGen)+'</b> 条想法、合并为 <b>'+fmtInt(nPool)+'</b> 条候选'
      +(ag&&ag.openN?('，10 个组合各自从中选出持仓，合计在持 <b>'+fmtInt(ag.openN)+'</b> 仓。'):'。')
    : '';
  var legend='筛选A：语义打分选出主题，灰色分流为落选。'
    +'筛选B：'+genOrder().length+' 种方法并行生成想法，线宽对应条数；'
    +'最下面那一格是空的，写一条你自己的准则就多一种生成方式。'
    +'合并：一个标的一条，同心环表示有几种方法同时提到它。'
    +'筛选C：各选取策略在同一候选池上并行，灰色为对照组合。'
    +'节点大小与连线宽度对应实际数量。';
  return '<div class="card" id="pipeCard">'
    +'<div class="card-title-row"><h2 class="card-title">本期流水线'+(w.as_of?' · <span class="num" style="font:600 15px/26px var(--font-mono)">'+esc(w.as_of)+'</span>':'')+'</h2>'
    +'<span class="card-note">每一段的收敛倍数就是这一段淘汰掉了多少'
      +'<span class="gloss" title="'+esc(legend)+'">ⓘ 怎么看</span></span></div>'
    +(lead?'<div style="font:400 15px/23px var(--font-sans);color:var(--color-text-primary);margin:var(--space-2) 0 var(--space-3)">'+lead+'</div>':'')
    +'<div class="pipe-wrap scroll-thin">'+svg+'</div>'
    /* 这一页读者最想问的就是「凭什么这么选」。原本挂在主链路卡上，
       主链路下线后跟着搬到图下面——图讲完了怎么选，紧接着就是问它为什么。 */
    +'<div style="margin-top:var(--space-4);padding-top:var(--space-4);border-top:1px solid var(--color-border-subtle);'
      +'display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap">'
      +askBtn('selection','topics')
      +'<span style="font:400 12px/18px var(--font-sans);color:var(--color-text-tertiary)">'
        +'问它当时凭什么从 '+fmtInt(Object.keys(((topicArm('hgep')||{}).scores)||{}).length)+' 个候选里选出这几个主题</span>'
    +'</div>'
  +'</div>';
}
function pipeCanvasSVG(){
  var w=S.weekly||{};
  var hgep=topicArm('hgep'),ctrl=topicArmNot('hgep');
  var chosen=topicChosen('hgep');
  var ctrlChosen={};(ctrl?(ctrl.chosen||[]):[]).forEach(function(t){ctrlChosen[t]=1});
  var evAll=w.evidence||{};
  var gens=w.generators||[];
  var pool=w.pool||{};
  var sels=orderedSelectors();
  var books=currentBooks();
  var corpusN=w.corpus_total||corpusRowsFor(w.as_of);
  var W=1120;
  var SEL_Y0=44,SEL_GAP=42,PAD_TOP=20;
  var H=Math.max(450,PAD_TOP+SEL_Y0+Math.max(0,sels.length-1)*SEL_GAP+31);
  var s='<svg class="pipe-svg" viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="本期选仓流水线">';
  var FS='var(--font-sans)',FM='var(--font-mono)';
  function txt(x,y,t,size,fill,anchor,weight,mono){
    return '<text x="'+x+'" y="'+y+'" font-family="'+(mono?FM:FS)+'" font-size="'+size+'" fill="'+fill+'"'
      +(anchor?' text-anchor="'+anchor+'"':'')+(weight?' font-weight="'+weight+'"':'')+'>'+esc(t)+'</text>';
  }
  function link(x1,y1,x2,y2,width,color,op){
    var mx=(x1+x2)/2;
    return '<path d="M'+x1+' '+y1+' C'+mx+' '+y1+' '+mx+' '+y2+' '+x2+' '+y2+'" fill="none" stroke="'+color+'" stroke-width="'+Math.max(1,width).toFixed(1)+'" stroke-linecap="round" opacity="'+(op||0.5)+'"/>';
  }
  function pop(title,nums,line){
    return '<div class="pp-t">'+title+'</div>'+(nums?'<div class="pp-n">'+nums+'</div>':'')+(line?'<div class="pp-s">'+line+'</div>':'');
  }
  /* 阶段级速览 */
  var overlapN=chosen.filter(function(t){return ctrlChosen[t]}).length;
  var scoresMap=(hgep&&hgep.scores)||{};
  var totalScored=Object.keys(scoresMap).length;
  var rawIdeas=gens.reduce(function(a,g){return a+(g.n||0)},0);
  var conv=pool.convergence||{};
  var openTotal=0;books.forEach(function(b){openTotal+=(b.open_positions||[]).length});
  var stagePop=[
    pop('研报'+(corpusN?' · '+fmtInt(corpusN)+' 篇研报':''),null,'本期全部判断的输入；4 种生成方法共用同一份研报'),
    pop('筛选A · 选主题',totalScored?fmtInt(totalScored)+' 个主题已评分 · 前 '+chosen.length+' 入选':'尚未评分',ctrl?'与计数对照打分重合 '+overlapN+'/'+chosen.length:''),
    pop('筛选B · 写想法',gens.length?'4 种方法合计 '+fmtInt(rawIdeas)+' 条':'尚无产出','彼此独立，输入为同一批 '+chosen.length+' 个主题'),
    pop('合并 · 候选池',pool.n?fmtInt(rawIdeas)+' → '+fmtInt(pool.n)+' 条（一标的一条）':'候选池为空','同标的合并，赔率取中位数；共识度仅作记录，不参与打分'),
    pop('筛选C · 选取策略',sels.length?sels.length+' 个策略同池并行':'尚未执行','同一候选池，唯一变量为选取策略'),
    pop('建仓',books.length?books.length+' 个组合 · '+fmtInt(openTotal)+' 个在持仓位':'未建仓','等权买入 · 进场即挂 σ×2 止损 / σ×3 止盈 · 逐日盯市')
  ];
  /* 每列标注数值口径，画布上不出现无单位的裸数字。
   * 一个非技术读者第一次看这张图时问的第一个问题就是「这个数是几什么」，
   * 而答案此前只藏在 hover 里；hover 不存在于截图、投屏和打印件中。 */
  var cols=[[60,'研报',0,'块内 = 研报篇数'],
            [255,'筛选A · 主题',1,'圆内 = 命中研报篇数'],
            [505,'筛选B · 写想法',2,'框内 = 写出想法条数'],
            [705,'合并 · 候选池',3,'环内 = 合并后候选条数'],
            [888,'筛选C · 选取策略',4,'行末 = 该策略选中条数'],
            [1058,'建仓',5,'块内 = 当前在持仓位数']];
  cols.forEach(function(c){
    /* 列头曾经也是 pc-click，和它正下方的节点点下去一模一样——一张图里
     * 同一个环节两个点击区。列头是这一列叫什么，不是控件；节点才是。
     * 速览浮层留着，鼠标停上去仍然解释这一列是什么。 */
    s+='<g'+popRef(stagePop[c[2]])+'>'
      +txt(c[0],14,c[1],11,'var(--color-text-metadata)','middle',600)
      +txt(c[0],28,c[3],9,'var(--color-text-tertiary)','middle',400)
      +'</g>';
  });
  /* 列头之下留出固定的净空，图形整体下移，避免第一行标签压在表头上 */
  s+='<g transform="translate(0,'+PAD_TOP+')">';

  /* ── 研报块 ── */
  var cX=110,cY=200;
  if(corpusN){
    s+='<g class="pc-click" onclick="openStageDrawer(0)"'+popRef(stagePop[0])+'>'
      +'<rect x="14" y="152" width="96" height="96" rx="14" fill="var(--color-surface-brand)"/>'
      +txt(62,196,fmtInt(corpusN),20,'var(--color-text-on-brand)','middle',600,true)
      +txt(62,216,'篇研报',11,'var(--color-surface-brand-sunken)','middle')
      +'</g>';
  }else{
    s+='<g class="pc-click" onclick="openStageDrawer(0)"'+popRef(stagePop[0])+'><rect x="14" y="152" width="96" height="96" rx="14" fill="none" stroke="var(--color-border-strong)" stroke-dasharray="4 4"/>'
      +txt(62,204,'未读入',11,'var(--color-text-tertiary)','middle')+'</g>';
  }

  /* ── 主题层 ── */
  var tX=255,tYs=[60,130,200,270,340];
  var lostN=Math.max(0,totalScored-chosen.length);
  var evMax=1;chosen.forEach(function(t){evMax=Math.max(evMax,((evAll[t]||{}).n)||1)});
  /* 数数臂名次 */
  var cScores=(ctrl&&ctrl.scores)||{};
  var cRank={};
  Object.keys(cScores).sort(function(a,b){return ((cScores[b]||{}).score||0)-((cScores[a]||{}).score||0)})
    .forEach(function(k,i){cRank[k]=i+1});
  if(chosen.length){
    chosen.forEach(function(t,i){
      var y=(tYs[i]!==undefined)?tYs[i]:60+i*70;
      var evN=((evAll[t]||{}).n)||0;
      var r=14+Math.round(10*evN/evMax);
      if(corpusN)s+=link(cX,cY,tX-r,y,2+evN/evMax*9,'var(--color-border-brand-subtle)',0.8);
      var sc=scoresMap[t]||{};
      var nIdeas=poolCountBy('topic',t);
      var tp=pop(esc(t)+(sc.label?' · '+esc(sc.label):''),
        '综合分 '+(sc.score!==undefined?Number(sc.score).toFixed(1):'—')+' · 词表命中研报 '+evN+' 篇 · 想法 '+nIdeas+' 条',
        (cRank[t]?'计数对照打分：第 '+cRank[t]+' 名'+(ctrlChosen[t]?'，亦选入':'，未选入'):''));
      s+='<g class="pc-click" onclick="openStageDrawer(1,\''+jss(t)+'\')"'+popRef(tp)+'>'
        +'<circle cx="'+tX+'" cy="'+y+'" r="'+r+'" fill="var(--color-surface-brand-strong)"/>'
        +txt(tX,y+4,String(evN),11,'var(--color-text-on-brand)','middle',600,true)
        +txt(tX,y-r-5,topicName(t),9.5,'var(--color-text-metadata)','middle',500)
        +'</g>';
    });
    if(lostN>0){
      if(corpusN)s+=link(cX,cY,tX-13,404,3,'var(--color-border-default)',0.9);
      s+='<g class="pc-click" onclick="openStageDrawer(1)"'+popRef(pop('落选主题 · '+lostN+' 个',null,'综合分未达入选线'))+'>'
        +'<circle cx="'+tX+'" cy="404" r="12" fill="var(--color-surface-sunken)"/>'
        +txt(tX,408,String(lostN),10,'var(--color-text-metadata)','middle',600,true)
        +txt(tX+20,408,'个主题落选',10,'var(--color-text-tertiary)','start')
        +'</g>';
    }
  }else{
    s+='<g class="pc-click" onclick="openStageDrawer(1)"'+popRef(stagePop[1])+'><rect x="200" y="170" width="110" height="60" rx="10" fill="none" stroke="var(--color-border-strong)" stroke-dasharray="4 4"/>'
      +txt(255,204,w.in_flight?'评分中':'尚未评分',11,'var(--color-text-tertiary)','middle')+'</g>';
  }

  /* ── 生成方式泳道 ── */
  /* 泳道坐标按实际条数算。写死四个 Y 值时，第五条臂（PM 准则派生的那条）
   * 拿到 undefined，整张 SVG 的 path/rect 全变 NaN——画布直接塌掉。 */
  var gX1=430,gX2=580;
  var GO=genOrder();
  /* 泳道底下那一格：「＋ 写一条你的准则」。它按泳道算进坐标，而不是浮在图
   * 旁边的一个按钮——因为它就是筛选B 里空着的那一格。准则从来不是面板的
   * 第六个话题，它是这一列多出来的一行；入口长在它自己的位置上，才不用
   * 靠一个左边栏标签去解释「这是干什么的」。 */
  var slotOn=phSlotOn();
  var pendRules=slotOn?phPendingRules():[];
  var graftArm=slotOn?phGraftArm():'';
  var graftIdx=-1;
  if(slotOn)GO.forEach(function(o,i){if(o[0]===graftArm)graftIdx=i});
  var gN=Math.max(1,GO.length+(slotOn?1:0));
  var gTop=96,gBot=312;
  var gYs=[];
  for(var gq=0;gq<gN;gq++)gYs.push(gN===1?((gTop+gBot)/2):(gTop+gq*(gBot-gTop)/(gN-1)));
  var gH=Math.max(26,Math.min(44,(gBot-gTop)/Math.max(1,gN-1)-8));
  GO.forEach(function(o,gi){
    var g=genByKey(o[0]);
    var y=gYs[gi];
    if(g){
      var per=(g.meta||{}).per_topic||{};
      chosen.forEach(function(t,ti){
        var n=per[t]||0;if(!n)return;
        var ty=(tYs[ti]!==undefined)?tYs[ti]:60+ti*70;
        s+=link(tX+22,ty,gX1,y,Math.max(1.2,n*0.9),'var(--color-surface-brand-strong)',0.3);
      });
      var k=poolCountBy('method',g.method);
      var gp=pop(esc(o[1])+' · '+esc(o[2]),esc(o[3]),'例：'+esc(o[4]));
      /* 嫁接目标那一格描成实线加粗：下面选择器选中的是哪根臂，图上就是它。 */
      var isGraft=(gi===graftIdx);
      s+='<g class="pc-click" onclick="openStageDrawer(2,\''+o[0]+'\')"'+popRef(gp)+'>'
        +'<rect x="'+gX1+'" y="'+(y-gH/2)+'" width="150" height="'+gH+'" rx="10" fill="var(--color-surface-brand-subtle)" stroke="'+(isGraft?'var(--color-surface-brand)':'var(--color-border-brand-subtle)')+'" stroke-width="'+(isGraft?2:1)+'"/>'
        +txt(gX1+12,y-3,o[1],12,'var(--color-text-brand)','start',600)
        +txt(gX1+12,y+13,(g.n||0)+' 条'+(g.rejected?' · 拒 '+g.rejected:''),10,'var(--color-text-metadata)','start',400,true)
        +'</g>';
    }else{
      s+='<g class="pc-click" onclick="openStageDrawer(2)"'+popRef(stagePop[2])+'><rect x="'+gX1+'" y="'+(y-gH/2)+'" width="150" height="'+gH+'" rx="10" fill="none" stroke="'+(gi===graftIdx?'var(--color-surface-brand)':'var(--color-border-strong)')+'" stroke-width="'+(gi===graftIdx?2:1)+'" stroke-dasharray="4 4"/>'
        +txt(gX1+12,y+4,o[1]+(w.in_flight?' · 写作中':' · 无产出'),10.5,'var(--color-text-tertiary)','start')+'</g>';
    }
  });

  /* ── 筛选B 空着的那一格：写一条你自己的准则 ──────────────────
   * 这是整张图上唯一一个「写未来」的地方，也是准则功能唯一的入口。它画在
   * 泳道里而不是图外，因为它要回答的问题是「这句话加进去会变成什么」——
   * 答案就是它左边那根被描粗的臂，和它自己这一行。
   * 一格一个 onclick，落到正下方那一段；没有第二个地方能做这件事。 */
  if(slotOn){
    var slY=gYs[GO.length];
    /* 嫁接虚线：从这一格绕到它要接的那根臂。在下面的选择器上换一格，
     * 这条线就换一根臂——「加到哪种生成方式上」终于在图上有了形状。 */
    if(graftIdx>=0){
      var tgY=gYs[graftIdx];
      s+='<path d="M'+(gX1-7)+' '+slY+' C'+(gX1-44)+' '+slY+' '+(gX1-44)+' '+tgY+' '+(gX1-7)+' '+tgY+'" '
        +'fill="none" stroke="var(--color-surface-brand)" stroke-width="1.4" stroke-dasharray="4 3" opacity="0.85"/>'
        +'<path d="M'+(gX1-7)+' '+(tgY-4)+' L'+gX1+' '+tgY+' L'+(gX1-7)+' '+(tgY+4)+' Z" fill="var(--color-surface-brand)" opacity="0.85"/>';
    }
    var slT,slS,slP;
    var graftLbl=graftArm?methodName(graftArm):'';
    if(pendRules.length){
      slT='你的准则 · '+pendRules.length+' 条待首跑';
      slS=(pendRules.length===1&&graftLbl?graftLbl+' · ':'')+'下周三首跑';
      slP=pop('你写的准则已生效，还没跑出过想法',
        pendRules.length+' 条 · 下一次周跑（周三）起，这一格会变成一种真的生成方式',
        '原来那种一字不改继续跑；两种生成方式的净值之差即这条准则的净效应');
    }else if(PH.proposal){
      slT='你的准则 · 草案待核对';
      slS=(methodName(PH.proposal.arm||graftArm)||'')+' · 尚未生效';
      slP=pop('草案已生成，等你拍板',null,
        '确认生效后才会新增这一种生成方式——先在下面核对系统把你那句话听懂成了什么');
    }else{
      slT='＋ 写一条你的准则';
      slS='派生第 '+(GO.length+1)+' 种生成方式';
      slP=pop('用一句话教它怎么选',
        '这一格是空的：筛选B 现在这 '+GO.length+' 种都是内置的',
        '你写下的准则会从'+(graftLbl||'你选的那种生成方式')+'派生一条对照，原来那种冻结不动');
    }
    s+='<g class="pc-click" onclick="openRulesDrawer()"'+popRef(slP)+'>'
      +'<rect x="'+gX1+'" y="'+(slY-gH/2)+'" width="150" height="'+gH+'" rx="10" fill="var(--color-surface-default)" stroke="var(--color-surface-brand)" stroke-width="1.2" stroke-dasharray="5 4"/>'
      +txt(gX1+12,slY-3,slT,11.5,'var(--color-text-brand)','start',600)
      +txt(gX1+12,slY+13,slS,9.5,'var(--color-text-tertiary)','start',400)
      +'</g>';
  }

  /* ── 候选池（同心环 = 共识度） ── */
  var pX=705,pY=200;
  var poolN=pool.n||0;
  if(poolN){
    var gMax=1;gens.forEach(function(g){gMax=Math.max(gMax,g.n||0)});
    GO.forEach(function(o,gi){
      var g=genByKey(o[0]);if(!g||!g.n)return;
      s+=link(gX2,gYs[gi],pX-56,pY,2+(g.n/gMax)*16,'var(--color-surface-brand-strong)',0.45);
    });
    var ringKeys=['4','3','2','1'].filter(function(k){return conv[k]});
    var ringR=[24,33,42,51];
    var ringCol={'4':'var(--color-surface-brand)','3':'var(--color-surface-brand-strong)','2':'var(--color-border-brand-subtle)','1':'var(--color-surface-sunken)'};
    s+='<g class="pc-click" onclick="openStageDrawer(3)"'+popRef(stagePop[3])+'>';
    ringKeys.forEach(function(k,i){
      var cnt=conv[k]||0;
      s+='<circle cx="'+pX+'" cy="'+pY+'" r="'+ringR[i]+'" fill="none" stroke="'+ringCol[k]+'" stroke-width="'+(2.5+cnt*0.42).toFixed(1)+'" opacity="0.9"/>';
    });
    s+='<circle cx="'+pX+'" cy="'+pY+'" r="17" fill="var(--color-surface-white)"/>'
      +txt(pX,pY+5,fmtInt(poolN),15,'var(--color-text-primary)','middle',600,true)
      +'</g>';
    var legY=278;
    ringKeys.forEach(function(k,i){
      var lp=pop(convLabel(k)+' · '+conv[k]+' 条',null,CONV_GLOSS);
      s+='<g class="pc-click" onclick="filterPoolConv(\''+k+'\')"'+popRef(lp)+'>'
        +'<circle cx="'+(pX-52)+'" cy="'+(legY+i*17-4)+'" r="4.5" fill="'+ringCol[k]+'"/>'
        +txt(pX-42,legY+i*17,k+' 种 × '+conv[k]+' 条',9.5,'var(--color-text-tertiary)','start',400,true)
        +'</g>';
    });
  }else{
    s+='<g class="pc-click" onclick="openStageDrawer(3)"'+popRef(stagePop[3])+'><circle cx="'+pX+'" cy="'+pY+'" r="46" fill="none" stroke="var(--color-border-strong)" stroke-dasharray="5 5"/>'
      +txt(pX,pY+4,w.in_flight?'合并中':'候选池为空',10.5,'var(--color-text-tertiary)','middle')+'</g>';
  }

  /* ── 选取策略闸门 ── */
  var sX1=800,sW=152,sYs=[];
  var haveSels=sels.length>0;
  if(haveSels){
    var chMax=1;sels.forEach(function(x){chMax=Math.max(chMax,(x.chosen||[]).length)});
    sels.forEach(function(sel,i){
      var y=SEL_Y0+i*SEL_GAP;sYs.push(y);
      var m=selMetaOf(sel.name);
      var isCtl=m[2]==='对照';
      var nCh=(sel.chosen||[]).length;
      if(poolN&&nCh)s+=link(pX+56,pY,sX1,y,1.5+(nCh/chMax)*11,isCtl?'var(--color-border-strong)':'var(--color-surface-brand-strong)',0.35);
      var sp=pop(esc(m[1])+' · '+esc(m[3])+'（'+esc(m[2])+'）',esc(selPlain(sel.name)),'放行 '+nCh+' / '+fmtInt(poolN)+' 条');
      s+='<g class="pc-click" onclick="goSelector(\''+jss(sel.name)+'\')"'+popRef(sp)+'>'
        +'<rect x="'+sX1+'" y="'+(y-15)+'" width="'+sW+'" height="30" rx="8" fill="'+(isCtl?'var(--color-feedback-neutral-subtle)':'var(--color-surface-brand-subtle)')+'" stroke="'+(isCtl?'var(--color-border-default)':'var(--color-border-brand-subtle)')+'"/>'
        +txt(sX1+9,y+4,m[1],10.5,isCtl?'var(--color-text-metadata)':'var(--color-text-brand)','start',500)
        +txt(sX1+sW-8,y+4,String(nCh),11,'var(--color-text-primary)','end',600,true)
        +'</g>';
    });
  }else{
    s+='<g class="pc-click" onclick="openStageDrawer(4)"'+popRef(stagePop[4])+'><rect x="'+sX1+'" y="170" width="'+sW+'" height="60" rx="10" fill="none" stroke="var(--color-border-strong)" stroke-dasharray="4 4"/>'
      +txt(sX1+sW/2,204,w.in_flight?'选取中':'尚未执行',10.5,'var(--color-text-tertiary)','middle')+'</g>';
  }

  /* ── 持仓束 ── */
  var bX=1014;
  if(books.length){
    var byName={};books.forEach(function(b){byName[b.selector]=(b.open_positions||[]).length});
    if(haveSels)sels.forEach(function(sel,i){
      var n=byName[sel.name]||0;if(!n)return;
      s+=link(sX1+sW,sYs[i],bX,200,Math.max(1.2,n*0.7),'var(--color-fill-brand-green)',0.35);
    });
    s+='<g class="pc-click" onclick="openStageDrawer(5)"'+popRef(stagePop[5])+'>'
      +'<rect x="'+bX+'" y="152" width="98" height="96" rx="14" fill="var(--color-surface-brand)"/>'
      +txt(bX+49,192,fmtInt(openTotal),20,'var(--color-text-on-brand)','middle',600,true)
      +txt(bX+49,212,books.length+' 个组合在持',10.5,'var(--color-surface-brand-sunken)','middle')
      +'</g>';
  }else{
    s+='<g class="pc-click" onclick="openStageDrawer(5)"'+popRef(stagePop[5])+'><rect x="'+bX+'" y="152" width="98" height="96" rx="14" fill="none" stroke="var(--color-border-strong)" stroke-dasharray="4 4"/>'
      +txt(bX+49,204,'未建仓',11,'var(--color-text-tertiary)','middle')+'</g>';
  }
  s+='</g></svg>';
  return s;
}

/* ══════════ 运行回执条 + 共享 RunLog 抽屉（底账同用） ══════════ */
var JCache={},JLoading={};
function runReceiptStrip(){
  if(!J||!J.journal){
    /* 即使没有日志，/api/journal 仍会交回 orch_runs 那一行——起止、成败、
       报错。先把这行真实存在的东西说出来，再说日志为什么没有；否则读者
       看到的是一条什么都没说的红杠。 */
    var rr=(J&&J.run)||null;
    var head=rr?((rr.ok?'● 完成':'● 失败')+' · run '+esc(rr.run_id||'—')
                 +' · '+esc(rr.as_of||'')+' 期 · '+esc(rr.kind||'')+'（无逐步日志）')
              :'运行日志不可读';
    return '<button type="button" class="run-receipt section" onclick="openRunLog('+(rr&&rr.run_id?'\''+jss(rr.run_id)+'\'':'')+')">'
      +'<span class="dot bad"></span><span class="rr-main">'+head
      +(JErr?'：'+esc(JErr):'（/api/journal 未给出原因）')+'</span>'
      +'<span class="go">详情 →</span></button>';
  }
  var j=J.journal;
  return '<div class="rr-row section">'
    +'<button type="button" class="run-receipt" onclick="openRunLog(\''+jss(j.run_id||'')+'\')" title="打开本次周跑的完整运行日志">'
    +'<span class="dot'+(j.ok?'':' bad')+'"></span>'
    +'<span class="rr-main">'+(j.ok?'● 完成':'● 失败')+' · run '+esc(j.run_id||'—')+' · '+esc(j.as_of||'')+' 期 · '+fmtInt((j.steps||[]).length)+' 步 · '+(j.duration_s!==undefined&&j.duration_s!==null?fmtDur(j.duration_s):'—')+' · '+fmtInt((j.artifacts||[]).length)+' 件产物</span>'
    +'<span class="go">查看完整日志 →</span></button>'
    +(isSnapshot()
      ?'<span class="rr-dl" style="opacity:.55;cursor:default" title="审计包为实时打包，静态快照不提供；请在运行台下载">↓ 下载审计包（快照不可用）</span>'
      :'<a class="rr-dl" href="/api/audit'+(j.run_id?'?run_id='+encodeURIComponent(j.run_id):'')+'" title="下载本次运行的完整审计包：逐步日志、各步产出、追问记录，附 SHA-256 校验">↓ 下载审计包</a>')
    +(isSnapshot()?'':'<button type="button" class="rr-dl" onclick="openAskLogDrawer()" title="历次追问的记录：问了什么、系统把哪些材料交给了模型、模型引用了其中哪几件、答的是什么——每一件材料都能点进它自己所在的那一层">追问记录 ›</button>')
    +'</div>';
}
function ensureJournal(runId){
  var key=runId||'latest';
  if(JCache[key])return JCache[key];
  if(J&&J.journal&&(key==='latest'||J.run_id===runId)){
    JCache[key]={j:J.journal,run:J.run||null};return JCache[key];
  }
  if(!JLoading[key]){
    JLoading[key]=true;
    fetch('/api/journal'+(runId?'?run_id='+encodeURIComponent(runId):''),{cache:'no-store'})
      .then(function(r){return r.json().then(function(b){return {ok:r.ok,b:b}})})
      .then(function(res){
        var run=(res.b&&res.b.run)||null;
        if(res.b&&res.b.journal)JCache[key]={j:res.b.journal,run:run};
        else JCache[key]={j:null,run:run,err:(res.b&&res.b.error)||('HTTP '+(res.ok?'格式不对':'错误'))};
      })
      .catch(function(e){JCache[key]={j:null,err:e&&e.message?e.message:String(e)}})
      .then(function(){JLoading[key]=false;renderDrawers()});
  }
  return null;
}
function rlTime(iso){
  if(!iso)return '—';
  var d=new Date(iso);if(isNaN(d))return esc(iso);
  var hm=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Hong_Kong',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(d);
  var ms=String(d.getMilliseconds()).padStart(3,'0');
  return hm+'.'+ms;
}
function rlBytes(b){
  b=Number(b);if(isNaN(b))return '';
  if(b>=1048576)return (b/1048576).toFixed(1)+' MB';
  if(b>=1024)return (b/1024).toFixed(1)+' KB';
  return b+' B';
}
function rlKvHTML(st){
  var step=st.step||'';
  function kv(k,v){return '<b>'+k+'</b> '+v}
  var parts=[];
  if(step==='universe'){
    parts.push(kv('合格标的',fmtInt(st.eligible)));parts.push(kv('排除',fmtInt(st.excluded)));
    if(st.shelf_dating)parts.push(kv('货架',fmtInt(st.shelf_dating.total)));
  }else if(step.indexOf('feed:')===0){
    parts.push(kv('来源',esc(step.slice(5))));
    if(st.kind)parts.push(kv('类型',esc(st.kind)));
    parts.push(st.ok?'ok':'<span class="rl-err">失败'+(st.error?'：'+esc(st.error):'')+'</span>');
  }else if(step==='theme_discovery'){
    parts.push(kv('主题覆盖',esc(numOr(st.coverage_pct))+'%'));parts.push(kv('未匹配研报',fmtInt(st.unmatched)));parts.push(kv('新主题候选',fmtInt(st.candidates)));
  }else if(step==='inputs'){
    parts.push(kv('研报',fmtInt(st.corpus)));parts.push(kv('日历',fmtInt(st.calendar)));parts.push(kv('价格行',fmtInt(st.prices)));
    if(st.sha)parts.push(kv('输入指纹',esc(st.sha)));
  }else if(step==='topics'){
    parts.push(kv('策略',esc(st.strategy||'')+(st.version?' v'+esc(st.version):'')));
    if(st.chosen)parts.push(kv('选中',st.chosen.map(esc).join(' ')));
    if(st.calls!==undefined)parts.push(kv('模型调用',fmtInt(st.calls)));
  }else if(step==='generators'){
    var pr=st.produced||{};
    parts.push(kv('共写出',fmtInt(st.pool)+' 条'));
    parts.push(Object.keys(pr).map(function(k){return esc(methodName(k))+' '+fmtInt(pr[k])}).join(' · '));
    var ge=st.errors||{};
    Object.keys(ge).forEach(function(k){parts.push('<span class="rl-err">'+esc(methodName(k))+'：'+esc(ge[k])+'</span>')});
  }else if(step==='pool'){
    parts.push(kv('原始想法',fmtInt(st.raw)));parts.push(kv('合并后',fmtInt(st.merged)+' 条（一标一条）'));
    var cv=st.convergence||{};
    var cvs=Object.keys(cv).sort().reverse().map(function(k){return esc(k)+'×'+fmtInt(cv[k])}).join(' ');
    if(cvs)parts.push(kv('共识分布',cvs));
  }else if(step==='selectors'){
    parts.push(kv('同池候选',fmtInt(st.pool)));
    var ch=st.chosen||{};
    parts.push(Object.keys(ch).map(function(k){return esc(selMetaOf(k)[1])+' '+fmtInt(ch[k])}).join(' · '));
    var se=st.errors||{};
    Object.keys(se).forEach(function(k){parts.push('<span class="rl-err">'+esc(selMetaOf(k)[1])+'：'+esc(se[k])+'</span>')});
    if(st.inputs_sha)parts.push(kv('输入指纹',esc(st.inputs_sha)));
  }else{
    Object.keys(st).forEach(function(k){
      if(k==='step'||k==='at'||k==='n')return;
      var v=st[k];
      if(v===null||typeof v==='object')return;
      parts.push(kv(esc(k),esc(String(v))));
    });
  }
  return parts.join('　');
}
/* ══════════ 运行日志摘要视图 ══════════
 * 同一份 journal，两种读法。工程视图是原始步骤 + 键值，给要核对的人；
 * 摘要视图把每一步写成一句完整的话：动作、产出、作用。
 * 数字全部来自同一个 journal 字段，没有一个是叙述时补出来的：
 * 摘要视图仅措辞不同，与工程视图同源。 */
function rlPlainStep(st,idx){
  var step=st.step||'';
  /* T.t / T.d 渲染时会 esc()，T.w 不会——它要内嵌 glossMark 产出的 HTML。
   * 所以 T.w 只能赋硬编码字面量或 glossMark(字面量)；往里塞 journal 字段、
   * 服务端返回或任何用户可控的值之前，先自己 esc()。T.chips 的 k/v 会被 esc。 */
  var T={};
  if(step==='universe'){
    T.t='可交易货架：本期可买入标的范围';
    T.d='货架共 '+fmtInt((st.shelf_dating||{}).total)+' 个标的，本期合格 '+fmtInt(st.eligible)
      +' 个，排除 '+fmtInt(st.excluded)+' 个。';
    T.w='合格集合 = 后续所有候选的取值范围 '+glossMark('不在货架上的标的，无法出现在任何一条候选里。');
  }else if(step.indexOf('feed:')===0){
    var src=step.slice(5);
    T.t='数据接入：'+src;
    T.d=st.ok?('该来源已取得'+(st.kind?'（'+st.kind+'）':'')+'。')
             :('该来源取数失败'+(st.error?'：'+st.error:'')+'。');
    T.w=st.ok?'':'该来源缺失，本期判断所依据的材料相应减少。';
    T.bad=!st.ok;
  }else if(step==='theme_discovery'){
    T.t='主题发现：检查现有主题表是否覆盖本期研报';
    T.d='本期研报 '+numOr(st.coverage_pct)+'% 可归入已登记主题；未匹配 '
      +fmtInt(st.unmatched)+' 篇，其中达标的新主题候选 '+fmtInt(st.candidates)+' 个。';
    T.w='防止主题表滞后于宏观环境 '+glossMark('达标的新主题自动登记；登记记录 append-only，不可回填。');
  }else if(step==='inputs'){
    T.t='输入封存：固定本期可用材料';
    T.d='封存研报 '+fmtInt(st.corpus)+' 篇、宏观日历 '+fmtInt(st.calendar)+' 条'
      +(st.sha?'，输入指纹 '+st.sha:'')+'。';
    T.w='封存后所有判断只能取用这一份材料 '+glossMark('事后追问决策依据时，模型读到的仍是这一份，因此回答无法在事后重构。');
  }else if(step==='topics'){
    T.t='筛选A 选主题：确定本期宏观主题';
    T.d='按 '+(st.strategy||'')+(st.version?' v'+st.version:'')+' 打分，入选 '+((st.chosen||[]).length||0)+' 个'
      +(st.calls!==undefined?' · 模型调用 '+fmtInt(st.calls)+' 次'+(st.calls===0?'（纯规则打分）':''):'');
    T.chips=(st.chosen||[]).map(function(t){return {k:t,v:''}});
    T.w='落选主题不进入筛选B，本期不会有任何候选出自这些主题。'
  }else if(step==='generators'){
    var pr=st.produced||{};
    var ks=Object.keys(pr);
    T.t='筛选B 生成候选：4 种方法并行，彼此不可见';
    T.d='共生成 '+fmtInt(st.pool)+' 条';
    var ge=st.errors||{};
    T.chips=ks.map(function(k){return {k:methodName(k),v:fmtInt(pr[k])+' 条',bad:!!ge[k]}})
      .concat(Object.keys(ge).filter(function(k){return !pr[k]}).map(function(k){return {k:methodName(k),v:'失败',bad:true}}));
    if(Object.keys(ge).length)T.bad=true;
    T.w='四种方法相互隔离 '+glossMark('多方法指向同一标的，方可视为跨方法信号。');
  }else if(step==='pool'){
    var cv=st.convergence||{};
    /* 共识分布的键是「4种方式」这样的中文串，不是数字键 */
    var four=0;Object.keys(cv).forEach(function(k){if(/^\s*4/.test(k))four=cv[k]||0});
    T.t='合并候选池：同一标的归并为一条';
    T.d=fmtInt(st.raw)+' 条原始候选归并为 '+fmtInt(st.merged)+' 条'
      +(four?'，其中 '+fmtInt(four)+' 条为 4 种生成方法共同指向的标的':'')+'。';
    T.w='合并后各选取策略面对同一候选池';
  }else if(step==='selectors'){
    var ch=st.chosen||{};
    var ks2=Object.keys(ch);
    T.t='选取持仓：各策略自同一候选池独立选取';
    T.d='候选池 '+fmtInt(st.pool)+' 条';
    var se=st.errors||{};
    T.chips=ks2.map(function(k){return {k:selMetaOf(k)[1],v:fmtInt(ch[k])+' 条',bad:!!se[k]}})
      .concat(Object.keys(se).filter(function(k){return ch[k]===undefined}).map(function(k){return {k:selMetaOf(k)[1],v:'失败',bad:true}}));
    if(Object.keys(se).length)T.bad=true;
    T.w='唯一变量是选取策略 '+glossMark('同池、同期、同风控规则——这是后续配对比较成立的前提。');
  }else{
    T.t=rlStepName(step);
    T.d=rlKvHTML(st).replace(/<[^>]+>/g,' ');
    T.w='';
  }
  return T;
}
/* 流水线的叙述顺序。写想法和合并候选池是同一毫秒落盘的，按时间戳排会读成
 * 「先合并再写」——时间没错，但顺序读起来是假的。同秒内改按管线顺序排，
 * 相隔超过 2 秒的仍以真实时钟为准。 */
var RL_ORDER={'universe':1,'theme_discovery':3,'inputs':4,'topics':5,'generators':6,'pool':7,'selectors':8};
function rlRank(st){
  var k=String(st.step||'');
  if(k.indexOf('feed:')===0)return 2;
  return RL_ORDER[k]!==undefined?RL_ORDER[k]:9;
}
function rlPlainHTML(j){
  var steps=(j.steps||[]).slice();
  if(!steps.length)return '<div class="rl-empty">这条运行没有留下步骤记录。</div>';
  steps.sort(function(a,b){
    var ta=a.at?new Date(a.at).getTime():0,tb=b.at?new Date(b.at).getTime():0;
    if(Math.abs(ta-tb)>2000)return ta-tb;
    return rlRank(a)-rlRank(b);
  });
  /* 同一来源的多条 feed 合成一句，否则「取数据」会连着刷四行 */
  var merged=[],feeds=[];
  steps.forEach(function(st){
    if(String(st.step||'').indexOf('feed:')===0){feeds.push(st);return}
    if(feeds.length){merged.push({_feeds:feeds});feeds=[]}
    merged.push(st);
  });
  if(feeds.length)merged.push({_feeds:feeds});
  var t0=j.started_at?new Date(j.started_at).getTime():null;
  var n=0;
  var body=merged.map(function(st){
    var T,at;
    if(st._feeds){
      var fs=st._feeds,okN=fs.filter(function(f){return f.ok}).length;
      at=fs[0].at;
      T={t:'数据接入：'+fs.length+' 路来源',
         d:okN+' / '+fs.length+' 路正常',
         chips:fs.map(function(f){return {k:(f.step||'').slice(5),v:f.ok?'正常':'失败',bad:!f.ok}}),
         w:okN<fs.length?'本期可用材料低于正常水平 '+glossMark('有来源取数失败。'):'',
         bad:okN<fs.length};
    }else{T=rlPlainStep(st);at=st.at}
    n++;
    var dt=(t0!==null&&at)?((new Date(at).getTime()-t0)/1000):null;
    return '<div class="rlp-item'+(T.bad?' bad':'')+'">'
      +'<div class="rlp-n">'+n+'</div>'
      +'<div class="rlp-main">'
      +'<div class="rlp-t">'+esc(T.t)+'</div>'
      +'<div class="rlp-d">'+esc(T.d)+'</div>'
      +((T.chips&&T.chips.length)?'<div class="rlp-chips">'+T.chips.map(function(c){
          return '<span class="rlp-chip'+(c.bad?' bad':'')+'">'+esc(c.k)+(c.v?'<b>'+esc(c.v)+'</b>':'')+'</span>';
        }).join('')+'</div>':'')
      +(T.w?'<div class="rlp-w">'+T.w+'</div>':'')
      +'</div>'
      +'<div class="rlp-time">'+rlTime(at)+(dt!==null?'<span>+'+dt.toFixed(0)+'s</span>':'')+'</div>'
      +'</div>';
  }).join('');
  return '<div class="rlp">'+body+'</div>';
}

var RL_STEP_ZH={'universe':'货架核实','theme_discovery':'主题发现','inputs':'输入封存','topics':'筛选A 选题','generators':'筛选B 写想法','pool':'合并候选池','selectors':'筛选C 挑持仓',/* 盯市这一趟的六步——周跑之外，日志里绝大多数运行是它。 */'feeds':'数据源体检','prices':'刷新行情','marks':'重估持仓','alerts':'检查触发','ingest':'增量研报','olive':'货架同步'};
function rlStepName(step){
  if(RL_STEP_ZH[step])return RL_STEP_ZH[step];
  if(String(step).indexOf('feed:')===0)return '写入数据源';
  return step;
}
var rlMode='plain'; /* 'plain' 摘要 | 'raw' 工程 */
function setRlMode(m){rlMode=m;renderDrawers()}
function runLogDrawerBody(d){
  var cached=ensureJournal(d.p);
  if(!cached){
    return '<div class="runlog"><div class="rl-empty">正在读取 run '+esc(d.p||'（最近一次）')+' 的运行日志……</div></div>';
  }
  if(!cached.j){
    /* 这里曾经写死一句「是当时就没写」。它在读不到产物存储的节点上是**假的**：
       产物存在，只是这台机器够不着。把「记录本身没有」说成已经查明，比不说更糟——
       现在只转述 API 给出的原因，并把 orch_runs 里那一行真实存在的事实摆出来，
       让读者自己看到「这一趟确实跑过、只是没有逐步日志」。 */
    var r=cached.run||null;
    var facts='';
    if(r){
      facts='<div class="rl-runrow">'
        +'<div><b>'+(r.ok?'● 完成':'● 失败')+'</b> · run '+esc(r.run_id||'—')+'</div>'
        +'<div>'+esc(r.kind||'—')+' · '+esc(r.as_of||'—')+' 期'
        +(r.started_at?' · 启动 '+esc(hktFmt(r.started_at,true))+' HKT':'')
        +(r.ended_at?' · 结束 '+esc(hktFmt(r.ended_at,true))+' HKT':'（没有结束时间——这一趟没跑完）')
        +'</div>'
        +(r.error?'<div style="color:var(--color-feedback-error-text)">当时报的错：'+esc(r.error)+'</div>':'')
        +'<div class="quiet">以上来自 orch_runs 的运行记录，和下面的日志缺口是两回事：这一趟确实跑过。</div>'
        +'</div>';
    }
    return '<div class="runlog">'+facts+'<div class="rl-empty">没有逐步日志可读'
      +(cached.err?'——'+esc(cached.err):'，而 API 没有说明原因')
      +'</div></div>';
  }
  var j=cached.j;
  var steps=j.steps||[];
  var arts=j.artifacts||[];
  var t0=j.started_at?new Date(j.started_at).getTime():null;
  var anim=!d.played;d.played=true;
  var stepMs=Math.min(90,Math.floor(1800/Math.max(1,steps.length+arts.length)));
  var li=0;
  function delay(){var v=anim?' style="animation-delay:'+(li*stepMs)+'ms"':'';li++;return v}
  var head='<div class="rl-head">'
    +'<span class="rl-title"><span class="cur"></span>运行日志</span>'
    +'<span class="rl-chip'+(j.ok?' ok':' bad')+'">'+(j.ok?'完成':'失败')+'</span>'
    +'<span class="rl-chip">'+esc(j.platform||'—')+'</span>'
    +'<span class="rl-chip">run '+esc(j.run_id||'—')+'</span>'
    +'<span class="rl-chip">'+esc(j.kind||'')+' · '+esc(j.as_of||'')+' 期</span>'
    +(j.started_at?'<span class="rl-chip">'+hktFmt(j.started_at,true)+' HKT 启动</span>':'')
    +(j.duration_s!==undefined&&j.duration_s!==null?'<span class="rl-chip">总时长 '+Number(j.duration_s).toFixed(2)+'s</span>':'')
    +(isSnapshot()
      ?'<span class="rl-dl" style="opacity:.55;cursor:default" title="审计包是现场打包的，静态快照下不到——在运行台上下载。">↓ 审计包（快照下不到）</span>'
      :'<a class="rl-dl" href="/api/audit'+(j.run_id?'?run_id='+encodeURIComponent(j.run_id):'')+'" title="下载本次运行的完整审计包：逐步日志、各步产出、追问记录，附 SHA-256 校验">↓ 审计包</a>')
    +'<span class="rl-seg">'
      +'<button type="button" class="'+(rlMode==='plain'?'on':'')+'" onclick="setRlMode(\'plain\')" title="每步以一句话概述：动作、产出、作用">摘要</button>'
      +'<button type="button" class="'+(rlMode==='raw'?'on':'')+'" onclick="setRlMode(\'raw\')" title="原始步骤 + 键值 + 产物 URI，用来核对">工程</button>'
    +'</span>'
    +'</div>';
  var lines=steps.map(function(st){
    var dt=(t0!==null&&st.at)?((new Date(st.at).getTime()-t0)/1000):null;
    return '<div class="rl-line"'+delay()+'>'
      +'<span class="rl-t">'+rlTime(st.at)+(dt!==null?' <span style="color:#525a56">+'+dt.toFixed(1)+'s</span>':'')+'</span>'
      +'<span class="rl-step">'+esc(rlStepName(st.step))+'</span>'
      +'<span class="rl-kv">'+rlKvHTML(st)+'</span>'
      +'</div>';
  }).join('');
  var artHtml='';
  if(arts.length){
    var totalB=0;arts.forEach(function(a){totalB+=Number(a.bytes)||0});
    artHtml='<div class="rl-sec">产物 · '+arts.length+' 件 · '+rlBytes(totalB)+' · 已写入对象存储</div>'
      +arts.map(function(a){
        return '<div class="rl-line rl-art"'+delay()+'><span class="rl-t">→</span><span class="rl-uri">'+esc(a.uri||a.name||'')+'</span>'
          +'<span style="color:#6f7a75;flex:none">'+rlBytes(a.bytes)+'</span></div>';
      }).join('');
  }
  var ports=(j.port_health||[]).map(function(p){
    return '<span class="rl-chip'+(p.ok?' ok':' bad')+'" title="'+esc(p.detail||'')+'">'+esc(p.name)+'</span>';
  }).join('');
  var portRow=ports?'<div class="rl-head" style="margin:var(--space-3) 0 0"><span style="color:#8fa39a;font:500 11px/18px var(--font-mono);letter-spacing:.06em">端口自检</span>'+ports+'</div>':'';
  var note='';
  var curPeriod=(S&&S.schedule||{}).current_period;
  if(j.error)note+='<div class="rl-note rl-err">运行错误：'+esc(j.error)+'</div>';
  if(j.as_of&&curPeriod&&j.as_of!==curPeriod&&j.kind==='weekly'){
    note+='<div class="rl-note">这是 '+esc(j.as_of)+' 期周跑的原始日志——本期（'+esc(curPeriod)+'）失败，没有可展示的成功记录。时间戳为真实时钟（HKT），产物 URI 指向对象存储。</div>';
  }else{
    note+='<div class="rl-note">原始步骤日志：真实时钟（HKT）、相对耗时、逐件产物。</div>';
  }
  if(rlMode==='plain'){
