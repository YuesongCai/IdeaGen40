# IdeaGen40 · ECS POC Compose（scheduler + dashboard + proxy）
#
# 事实源是 RDS MySQL + TOS，无持久卷。本文件不声明任何本地数据卷。
# 运行时凭证只从 /opt/ideagen/config/runtime.env 注入，绝不写入本文件、镜像或 git。
#
# 用法（ECS Cloud Assistant / 网页终端）：
#   export IMAGE_TAG=<git-short-sha>
#   podman-compose up -d scheduler dashboard proxy
#
# IMAGE_TAG 固定到干净 commit SHA；不要用 latest。

services:
  dashboard:
    image: "ideagen40:${IMAGE_TAG:?set IMAGE_TAG to the built git SHA}"
    # 同一镜像默认 ENTRYPOINT 跑 scheduler；这里覆盖为先建表、再起网页。
    # 不建表的话，页面第一次请求 /api/state 就会撞上「orch_runs 不存在」，
    # 变成一条引用 MySQL 报错的 500——看起来像部署坏了，其实只是库是空的。
    # 云端这条路上没有别的东西会建这些表：scheduler 要到第一次周跑才建，
    # 而新实例上那可能是一周以后。
    entrypoint: ["/app/deploy/dashboard_entrypoint.sh"]
    # 页面的存活面板报的就是 scheduler 的心跳。只起网页不起 scheduler，
    # 得到的是一个"一切正常地告诉你系统已经死了"的运行台——两者一起起。
    # 实例上那份开机脚本烙死在系统盘里、只写了 `up -d dashboard proxy`，
    # 改不动；依赖关系写在这里，compose 会把 scheduler 一并拉起来。
    depends_on:
      - scheduler
      - updater
    env_file:
      - /opt/ideagen/config/runtime.env
    environment:
      # 让反向代理能连到容器；仍受 IDEAGEN_DASH_KEY 门禁。
      IDEAGEN_DASH_HOST: "0.0.0.0"
      # 远端 OAuth 只在用户打开 /olive 并点击授权时触发。PKCE 回调必须
      # 使用外部 HTTPS origin，token 写入宿主机专用 0700 目录。
      IDEAGEN_PUBLIC_SITE: "${IDEAGEN_PUBLIC_SITE:-https://127.0.0.1}"
      IDEAGEN_OLIVE_TOKEN_FILE: "/run/ideagen-oauth/tokens.json"
      # 账号存本地文件（登录路径上不该有对象存储），但换容器会丢，
      # 所以每次写入顺带镜像一份到桶里，新容器起来时先找它再谈初始化。
      # 显式打开：笔记本同样配了云平台，靠推断会让本机测试去碰生产桶。
      IDEAGEN_ACCOUNTS_MIRROR: "1"
      # 显式指到一个具名卷上。原先靠自动选路落到 /run/ideagen-oauth，
      # 而那个宿主机目录是 0700、容器不是属主 —— 探测拿到 EACCES，账号退回
      # 容器内，只剩镜像那条腿在扛。具名卷换容器不会消失，而且镜像里已经把
      # 这个目录建好并 chown 给运行用户，docker 初始化新卷时会继承这个属主。
      IDEAGEN_ACCOUNTS_FILE: "/var/lib/ideagen-accounts/accounts.json"
    volumes:
      - accounts_data:/var/lib/ideagen-accounts
      - /opt/ideagen/oauth:/run/ideagen-oauth
      # 只读挂进来，好让 /deploy 能说出「云端现在是哪个 commit、跟 origin/main
      # 差多少、上一次自更新成功还是被测试拦下」。自更新如果没人看得见，
      # 它失败的那天和它正常的那天长得一模一样。
      - /opt/ideagen/health:/run/ideagen-health:ro
    expose:
      - "8765"            # 仅 compose 内网可见，不映射到宿主
    # Podman's podman-restart.service restores only policy=always at boot.
    restart: always
    # Dashboard 与 scheduler 是独立容器；这里覆盖为 HTTP 探针，不能读取
    # scheduler 容器内的短期 FileCache 心跳。
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/healthz', timeout=3).read()\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  scheduler:
    image: "ideagen40:${IMAGE_TAG:?set IMAGE_TAG to the built git SHA}"
    env_file:
      - /opt/ideagen/config/runtime.env
    environment:
      IDEAGEN_TICK_INTERVAL_S: "${IDEAGEN_TICK_INTERVAL_S:-300}"
      IDEAGEN_OLIVE_TOKEN_FILE: "/run/ideagen-oauth/tokens.json"
      # wisburg-auto 严格读取 RDS 中的 Wisburg 语料；Olive 未授权时仅在
      # 货架侧使用 fixture，真实快照落库后自动切换，不由 scheduler 触发 OAuth。
      IDEAGEN_POC_WEEKLY_MODE: "${IDEAGEN_POC_WEEKLY_MODE:-wisburg-auto}"
      IDEAGEN_CLOUD_WISBURG_ENABLED: "${IDEAGEN_CLOUD_WISBURG_ENABLED:-true}"
    volumes:
      - /opt/ideagen/oauth:/run/ideagen-oauth
    restart: always

  # 自更新：盯着 origin/main，变了就构建 → 跑测试 → 换掉自己。
  # 之前部署要手动重启实例，于是云端永远停在上次重启时的 commit——「云端是旧的」
  # 成了常态，而且不看没人知道旧多少。它轮询而不是被推送，是因为这台机器没有
  # 入站通道（没有 SSH、命令代理装不上），webhook 还要多开一个公网端点和一把
  # 共享密钥去保护它。
  #
  # 测试是这个服务的重点，不是附赠：main 上有多个 agent 在推，装了它之后
  # 「谁能推 main」就等于「谁能改生产」，中间没有人。构建出来的镜像先跑一遍
  # 测试再切换，失败就留在原来那版并把原因写进 /opt/ideagen/health/updater.json。
  updater:
    image: "docker:27-cli"
    entrypoint: ["/bin/sh", "/updater.sh"]
    environment:
      IDEAGEN_UPDATE_INTERVAL_S: "${IDEAGEN_UPDATE_INTERVAL_S:-120}"
      IDEAGEN_UPDATE_REQUIRE_TESTS: "${IDEAGEN_UPDATE_REQUIRE_TESTS:-1}"
      # 跟 origin/main = 推了就上（测试过了才上）。想把「写完」和
      # 「可以给人看」分开，把它改成一个 tag ref 即可，代码不用动。
      IDEAGEN_UPDATE_REF: "${IDEAGEN_UPDATE_REF:-origin/main}"
      IDEAGEN_PUBLIC_HOST: "${IDEAGEN_PUBLIC_HOST:-101.47.152.106}"
      IDEAGEN_PUBLIC_SITE: "${IDEAGEN_PUBLIC_SITE:-https://101.47.152.106}"
      IDEAGEN_DEFAULT_SNI: "${IDEAGEN_DEFAULT_SNI:-101.47.152.106}"
    volumes:
      # 构建上下文与 git 工作树；docker socket 用来构建和换容器。
      - /opt/ideagen/app:/opt/ideagen/app
      - /opt/ideagen/health:/opt/ideagen/health
      # compose 在**自己这个容器**的文件系统里找 env_file，找不到就整个
      # `up` 失败——代码更新了、部署没发生，而且失败信息只在容器日志里。
      # 口令确实因此进了这个容器，但它已经握着 docker socket（等于宿主 root），
      # 多一个只读挂载不改变它的权限级别。
      - /opt/ideagen/config:/opt/ideagen/config:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./updater.sh:/updater.sh:ro
    restart: always

  proxy:
    image: "caddy:2-alpine"
    depends_on:
      - dashboard
    environment:
      # :80 用于联调；生产设置为 https://<public-ip> 或正式域名。
      IDEAGEN_PUBLIC_SITE: "${IDEAGEN_PUBLIC_SITE:-:80}"
      # IP 客户端可能不发送 SNI；IP HTTPS 时设置为相同的公网 IP。
      IDEAGEN_DEFAULT_SNI: "${IDEAGEN_DEFAULT_SNI:-localhost}"
      IDEAGEN_PUBLIC_HOST: "${IDEAGEN_PUBLIC_HOST:-101.47.152.106}"
      # 代理不再持有任何凭证：登录页、会话和账号都在应用里。一个只负责
      # 转发的容器不该知道任何口令，现在它确实一个也不知道。
    ports:
      - "80:80"
      - "443:443"         # 配好域名与证书后启用；仅 HTTP 联调期可临时只留 80
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data   # 证书等由 Caddy 管理，非业务事实源
    restart: always

volumes:
  caddy_data:
  # 账号表。卷是空的那一次（第一次部署）由 accounts.bootstrap() 先去读
  # 对象存储上的镜像，读到就恢复、读不到就明确拒绝新建管理员 —— 所以换到
  # 卷上不会把已有的人弄丢。
  accounts_data:
