              +'<span class="gloss gm" title="按设计每周只投出四分之一本金（四周梯队），未投出的部分放在货币基金里。现在是第 '+wk+' 周，所以这一栏是一个部分建仓的组合，而右边的基准是满仓——两个数的分母不同，差距里有一部分来自仓位节奏而非选股。">ⓘ</span>';
          })()
        +'</div>'
        +'<div class="num '+pctCls(ret)+'" style="font:600 34px/40px var(--font-sans)">'+(ret===null?'—':fmtPct(ret))+'</div>'
      +'</div>'
      +'<div>'
        +'<div style="font:400 13px/18px var(--font-sans);color:var(--color-text-tertiary);margin-bottom:4px">同期 '+esc(benchName())+' · 基准<span style="color:var(--color-text-tertiary)"> · 满仓</span>'
          +(function(){var n=benchWindowNote();return n?'<span class="gloss gm" title="'+esc(n)+'">ⓘ</span>':''})()
        +'</div>'
        +'<div class="num" style="font:600 34px/40px var(--font-sans);color:var(--color-text-secondary)">'+(spy===null?'—':fmtPct(spy))+'</div>'
      +'</div>'
      +'<div style="padding-bottom:4px">'
        +'<div style="font:400 15px/22px var(--font-sans);color:var(--color-text-primary)">'+verdict+'</div>'
        /* 结论式写法有个副作用：读者会把它当成定论，下周反超就以为「翻盘了」。
           样本量限定必须和结论同框，不能只留在下面那张对比卡里。 */
        +'<div style="font:400 12px/17px var(--font-sans);color:var(--color-text-tertiary);margin-top:2px">'
          +(function(){var w=heroWindowNote(currentBooks());return w?esc(w)+' · ':''})()
          +'建仓后第 '+wk+' 周 · 样本尚不足以判定优劣'
          +'<span class="gloss gm" title="单周甚至单月的领先或落后大多来自噪声。预注册的判定口径是与全量基准的差距超出 ±2 个百分点，主策略里最慢的一条约需 '+targetWeeks()+' 期样本；在那之前的排名不构成结论。">ⓘ</span>'
        +'</div>'
      +'</div>'
    +'</div>'
    /* 两个数字说得清「跑赢还是跑输」，说不清「什么时候拉开的、中间回撤过
       没有」。PM 看的是形状。 */
    +overviewCurveSVG()
    /* 把这个头条数拆开——它是全页最容易被读错的一个数。
     * 合计 +0.46% 里只有约 0.10pp 来自选股，其余来自没投出去的钱吃的货币
     * 市场利息。而右边的基准是满仓的。不写出来，「跑输 4 个百分点」会被
     * 读成「AI 选股很差」，但真实情况是：四分之三的钱还没进场，比较的
     * 两边根本不是同一个仓位。 */
    +(function(){
      var gain=(ag.lastEquity!==null&&ag.capital)?(ag.lastEquity-ag.capital):null;
      var pos=(ag.unrealized||0)+(ag.realized||0);
      if(gain===null||!ag.capital)return '';
      var cash=gain-pos;
      var pp=function(v){return (v/ag.capital*100)};
      var depPct=ag.capital?(ag.deployed/ag.capital*100):0;
      if(Math.abs(cash)/Math.abs(gain||1)<0.05)return '';   /* 现金部分可忽略时不啰嗦 */
      return '<div class="hero-split">'
        +'<span class="hs-h">这 '+fmtPct(pp(gain))+' 从哪来</span>'
        +'<span class="hs-i"><b class="num '+pctCls(pos)+'">'+(pp(pos)>=0?'+':'')+pp(pos).toFixed(2)+' pp</b> 选出来的持仓</span>'
        +'<span class="hs-i"><b class="num">'+(pp(cash)>=0?'+':'')+pp(cash).toFixed(2)+' pp</b> 未投出资金的货币市场利息'
        +'<span class="gloss gm" title="'+esc(cashRateNote())+'这部分收益与选股好坏无关——它衡量的是钱停着的时间，不是判断的质量。'
          +'当前实际投出 '+depPct.toFixed(0)+'%'
          +(ag.pending?'，低于每周约四分之一的设计值，因为还有 '+fmtInt(ag.pending)+' 笔挂单没有成交':'')
          +'。">ⓘ</span></span>'
        /* 「已投出 N%」现在标在上面那个大数旁边，正对着基准栏的「满仓」——
         * 那是它该待的位置。这里不再说第二遍：同一个数字在半屏之内出现两次，
         * 读者会去想它们是不是两件事。它独有的那点信息（挂单没成交，所以
         * 实际投出比设计值还低）并进了上面现金那一项的说明里。 */
        +'</div>';
    })()
    /* 一个人看完这个数字，下一句必然是「为什么」。追问入口就该在这里，
       而不是让他自己去别的页面找。 */
    +'<div style="margin-top:var(--space-4);display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap">'
      +askBtn('selection','topics')
      +'<span style="font:400 12px/18px var(--font-sans);color:var(--color-text-tertiary)">'
        +'只依据这次运行当时封存的材料回答，不用事后信息</span>'
    +'</div>'
    +'<div class="card-note" style="margin-top:var(--space-3)">'
      +'浮动盈亏 <span class="num '+pctCls(ag.unrealized)+'">'+signedMoney(ag.unrealized)+'</span>'
      +' · 已实现 <span class="num '+pctCls(ag.realized)+'">'+signedMoney(ag.realized)+'</span>'
      +' · 在场 '+fmtInt(ag.openN||0)+' 仓'
      +' · 本金 '+fmtMoney(ag.capital)
      +' · 纸面成交（已计佣金与滑点 '+glossMark(COST_GLOSS)+'），非实盘'
      +'<button type="button" class="exp-btn" data-el="week.headline.trust" onclick="openTrustDrawer()">可信度与局限 ›</button>'
    +'</div>'
  +'</div>';
}

/* 组合与基准的差距，全站唯一的格式化入口。
   这个差就是读者拿两个头条数字相减能自己验的那一个（+0.46% 与 +5.99% →
   5.53），所以精度必须和那两个数对得上。之前概览写「5.53 个百分点」、
   证据写「−5.5pp」，同一个事实两个写法，谁去核对谁都会以为算错了。 */
function fmtGapPp(gap,opts){
  if(gap===null||gap===undefined||!isFinite(gap))return '—';
  opts=opts||{};
  var v=Math.abs(gap).toFixed(2);
  return opts.signed
    ? (gap>=0?'+':'−')+v+(opts.unit||'pp')
    : v+(opts.unit||'pp');
}
function spyLine(ret){
  // 同一段日期里持有基准指数的收益。合计收益没有这个零点就没有含义：
  // 组合 +1% 而 SPY +3%，相对收益为负。
  var bm=(S&&S.benchmark)||{},sr=bm.series||[];
  var r=benchReturnPct();
  if(r===null)return '';
  var t=' · 同期 '+benchName()+' <span class="num '+pctCls(r)+'" title="'+sr[0].d+' 至 '+sr[sr.length-1].d+' 的收盘价涨跌，作为满仓基准的参照">'+fmtPct(r)+'</span>';
  if(ret!==null&&isFinite(ret)){
    var d=ret-r;
    t+=' <span class="num '+pctCls(d)+'" title="合计收益减去同期基准收益：正 = 跑赢基准">（'+fmtGapPp(d,{signed:true})+' vs '+benchName()+'）</span>';
  }
  return t;
}
function fmtWinRate(wins,closed){
  // Jon 的硬门槛是胜率>50%。样本太小时不上色：1 平 1 亏染红整块面板，
  // 读出来是「这方法不行」，而真相是「还没什么可下结论的」。
  if(!closed)return '<span class="num" title="尚无已平仓记录，胜率不可计算">—</span>';
  var r=wins/closed,txt=(r*100).toFixed(0)+'%（'+wins+'/'+closed+'）';
  var cls=closed>=5?(r>0.5?'up':'down'):'';
  return '<span class="num '+cls+'" title="已平仓中赚钱的比例；打平算输。Jon 的门槛：>50% 才拿去见 PM'+(closed<5?'。样本仍太小（<5 单），先别下结论':'')+'">'+txt+'</span>';
}
function togglePos(pid){
  var row=document.querySelector('tr.thesis-row[data-pid="'+pid+'"]');
  if(row)row.style.display=(row.style.display==='none')?'':'none';
}

/* ── 可交易货架：本期可买入标的的来源与时效，包括已知缺口 ── */
function universeCard(){
  var shelf=(S&&S.shelf)||{};
  var feed=(S.feeds||[]).filter(function(f){return f.kind!=='corpus'&&/instrument|universe/.test(String(f.feed))})
    .sort(function(a,b){return String(b.as_of||'').localeCompare(String(a.as_of||''))})[0];
  var bsum=((S.backtest||{}).summary)||{};
  var undated=bsum.undated_shelf_instruments;
  var n=feed?feed.n_rows:null;
  if(n===null&&!shelf.snapshot_id)return '';

  var kv=function(k,v){return '<div class="meta-kv"><div class="k">'+k+'</div><div class="v">'+v+'</div></div>'};
  var meta='<div class="bt-meta">'
    /* 这个数是本期那次清单抓取的行数，不是货架里一共有多少标的，也不是
       其中有多少能取到行情。三个数同时存在，标签必须说清自己数的是哪一个，
       否则读者会把它当成「能买的标的有多少」。 */
    +kv('本期清单行数',n!==null?'<span class="num" title="本期最近一次标的清单抓取返回的行数。它既不是货架里标的总数，也不是其中能取到行情的数量——这三个数不相等。">'+fmtInt(n)+'</span>':'—')
    +kv('期次',feed&&feed.as_of?'<span class="num">'+esc(feed.as_of)+'</span>':'—')
    +kv('来源',feed?esc(feedMeta(feed.feed)[0]):'—')
    +kv('状态',feed?(feed.ok?badge('success','正常'):badge('error','异常')):'—')
    +(undated!==undefined&&undated!==null
      ?kv('缺上架日期','<span class="num" style="color:var(--color-feedback-warning-text)">'+fmtInt(undated)+'</span>')
      :'')
    +'</div>';

  var licensed=String(shelf.data_classification||'').indexOf('licensed-')===0;
  var navTable='';
  if(shelf.snapshot_id){
    var rows=(shelf.instruments||[]).slice(0,12).map(function(x){
      return '<tr><td class="primary mono">'+esc(x.instrument)+'</td>'
        +'<td>'+esc(x.name||'—')+'</td><td>'+esc(x.group||x.kind||'—')+'</td>'
        +'<td>'+esc(x.currency||'—')+'</td><td>'+esc(x.risk_level||'—')+'</td>'
        +'<td class="r num">'+fmtMoney(x.latest_nav)+'</td>'
        +'<td class="num">'+esc(x.nav_d||'—')+'</td></tr>';
    }).join('');
    var headline='<div class="card-title-row" style="margin-top:var(--space-4)">'
      +badge(licensed?'success':'neutral',licensed?'已授权货架':'当前货架')
      +'<span class="card-note">'+esc(shelf.as_of||'')+' · '+fmtInt(shelf.items)+' 个产品 · '+fmtInt(shelf.navs)+' 个 NAV</span></div>';
    /* 脱敏状态下「内部标识」和「产品」是同一个串、分组恒定、风险与 NAV 全空，
       这张表每一列都不携带信息。零信息的表比没有表更糟——它让人以为自己
       漏看了什么。等 NAV 接进来再渲染。 */
    navTable=(shelf.identifiers_redacted&&!shelf.navs)
      ? headline+'<div class="empty-sm">已脱敏且尚无 NAV，暂不展开 '+glossMark('脱敏状态下内部标识与产品名是同一个串、分组恒定、风险与 NAV 全空，逐条列出的表每一列都不携带信息。等 NAV 接进来再渲染。')+'</div>'
      : headline+'<div class="table-wrap"><table><thead><tr>'
        +'<th>内部标识</th><th>产品</th><th>分组</th><th>币种</th><th>风险</th>'
        +'<th class="r">最新 NAV</th><th>NAV 日期</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
  }

  /* 这几条状态互相独立，而且不同向：上架日期核对是「已通过」，NAV 与脱敏是
     「确有缺口」。串成一句话、用同一个警示色写出来，会把通过的那条也读成警告。
     拆成一行一条、各自带状态点；长句退到 title 里。 */
  var gaps=[];
  /* 上架日期这条不能由前端自己从「有多少个未定日期」推断风险——服务端已经
     用实际持有的标的算过这件事，结论在 backtest.summary.shelf_dating 里。 */
  var sd=(((S||{}).backtest||{}).summary||{}).shelf_dating;
  if(sd&&sd.held_total){
    gaps.push(sd.held_after_window_start>0
      ? {ok:false,k:'上架日期',v:fmtInt(sd.held_after_window_start)+' / '+fmtInt(sd.held_total)+' 晚于窗口起点',
         d:'补跑期可能选入当时尚未上架的产品，该项前视风险成立。'}
      : {ok:true,k:'上架日期',v:fmtInt(sd.held_dated)+' / '+fmtInt(sd.held_total)+' 已定，早于窗口起点',
         d:'该项前视风险不成立。最新一个上架日期 '+(sd.held_latest_first_seen||'—')+'。其余 '
           +fmtInt(sd.held_total-sd.held_dated)+' 个是无行情代码的基金 / 结构化产品，仍未定日期。'});
  }else if(undated){
    gaps.push({ok:false,k:'上架日期',v:fmtInt(undated)+' 个未定',
      d:'按当期资格过滤时一律放行；服务端尚未给出持有标的的上架日期核对结果。'});
  }
  if(shelf.navs===0)gaps.push({ok:false,k:'NAV',v:fmtInt(shelf.items||0)+' 个产品 · 0 个 NAV',d:'这批标的暂时无法计价。'});
  if(!shelf.snapshot_id)gaps.push({ok:false,k:'NAV 快照',v:'未接入',d:'尚无已持久化的 NAV 快照，货架为静态清单。'});
  if(shelf.identifiers_redacted)gaps.push({ok:false,k:'产品标识',v:'默认脱敏',d:'完整快照仅存于受控 RDS/TOS。'});

  return '<div class="card section">'
    +'<div class="card-title-row"><h2 class="card-title" style="margin-bottom:0">可交易货架</h2>'
    +'<span class="card-note">筛选B 与筛选C 的可选标的范围</span></div>'
    +meta+navTable
    +(gaps.length?'<div class="gapl"><div class="gap-h">已知缺口</div>'+gaps.map(function(g){
        return '<div class="gap-row'+(g.ok?' ok':'')+'"><span class="gd"></span>'
          +'<span class="gk">'+esc(g.k)+'</span><span class="gv">'+esc(g.v)+'</span>'+glossMark(g.d)+'</div>';
      }).join('')+'</div>':'')
  +'</div>';
}

/* ── 回测摘要：真实候选池、真实收盘、零模型复算 ──
   置于首屏而非抽屉；详情仍在抽屉。 */
/* 胜率高不等于跑赢。配对检验才是结论判据，紧贴表格放置，
   避免单个胜率数字被读成结论。 */
function pairedVerdictLine(sum){
  var pr=(sum&&sum.paired)||{};
  var names=Object.keys(pr);
  if(!names.length)return '';
  var any=pr[names[0]]||{};
  var n=any.n_pairs||sum.periods||0;
  /* 三态而非两态：「样本量足够但未检出差异」同样是结论，且最易被误报为胜出——
     一个几乎复制对照的臂标准差极小，单周期即达到样本量，但与对照无实质差别。 */
  var won=names.filter(function(k){return pr[k]&&pr[k].conclusive});
  var flat=names.filter(function(k){return pr[k]&&pr[k].powered&&!pr[k].significant});
  if(won.length){
    return '<div class="card-note" style="margin-top:var(--space-3)">'
      +'配对检验：<b>'+won.map(function(k){return esc(backtestArmName(k))}).join('、')
      +'</b> 相对全量基准的差距已达到预注册门槛（样本量与显著性均满足，'
      +fmtInt(n)+' 个周期）。</div>';
  }
  if(flat.length){
    /* 「样本量已足够」是这一行里最强的一句话，而它站在很薄的地基上：
     * 达标的臂之所以达标，是因为它的实测标准差极小，把所需样本压到 1~2 个；
     * 而这个标准差是从 6 个互相重叠的窗口估出来的，后端自己也写着重叠会
     * 低估 sd、门槛只是下限。结论不改，但这个限定必须和结论同框——
     * 否则「已经够了」会被读成一个比它实际更硬的判定。 */
    var lim=flat.map(function(k){
      var v=pr[k]||{};
      return backtestArmName(k)+'：有效独立样本 n_eff='+(v.n_eff!==undefined?Number(v.n_eff).toFixed(1):'—')
        +'，所需 '+fmtInt(v.required_pairs)+'（门槛低是因为该臂实测标准差极小）';
    }).join('；');
    /* 结论一行、分组一行。原来这三件事串成一句 65 字的长句，
     * 最强的那句「无策略跑赢」被埋在中间。 */
    return '<div class="vd"><div class="vd-t">配对检验 <b>无选取策略被判定跑赢全量基准</b> '
      +glossMark('「样本量已足够」这个判定建立在实测标准差上，而标准差取自 '+fmtInt(n)+' 个互相重叠的持有窗口——重叠会低估标准差，因此所需样本量是下限，达标结论也应按下限理解。'+lim+'。换句话说：这是「在当前口径下没看出优势」，不等于「已经确证这条臂没有优势」。')+'</div>'
      +'<div class="vd-r"><span class="vk">样本已足、无差距</span><span class="vv">'
      +flat.map(function(k){return '<span class="tag">'+esc(backtestArmName(k))+'</span>'}).join(' ')+'</span></div>'
      +(names.length>flat.length?'<div class="vd-r"><span class="vk">样本量仍不足</span><span class="vv">其余 '+fmtInt(names.length-flat.length)+' 条臂</span></div>':'')
      +'</div>';
  }
  return '<div class="vd"><div class="vd-t">配对检验 <b>当前无选取策略被判定跑赢全量基准</b> '
    +glossMark('胜率是该窗口的历史描述，不构成预测，也不足以支持排名。')+'</div>'
    +'<div class="vd-r"><span class="vk">配对样本</span><span class="vv"><b class="num">'+fmtInt(n)+'</b> 对，远低于预注册门槛</span></div></div>';
}

function backtestCard(){
  var b=(S&&S.backtest)||{};
  var sum=b.summary||{};
  if(!b.backtest_id){
    return '<div class="card section"><div class="card-title-row">'
      +'<h2 class="card-title">历史回测</h2>'
      +'<span class="card-note">真实候选池 · 真实收盘 · 零模型复算</span></div>'
      +'<div class="empty-sm">暂无回测记录。配对比较至少需要两期已存候选池——'
      +'每周三自动跑一期，也可以补跑历史期。</div></div>';
  }
  var arms=sum.arms||{};
  var names=Object.keys(arms);
  var best=null;
  names.forEach(function(n){
    var a=arms[n];
    if(a&&a.hit_rate!=null&&(best===null||a.hit_rate>arms[best].hit_rate))best=n;
  });
  var nBack=sum.n_backfill_periods||0;
  var mix=nBack
    ? '<span class="gloss" title="事后补跑的期：文档卡在当期，但模型权重见过之后的世界，货架上还有没有上架日期的标的无法按期过滤。结论以 live 期为准。">'
      +sum.n_live_periods+' 期实盘记录 + '+nBack+' 期事后补跑 ⓘ</span>'
    : '<span>'+(sum.n_live_periods||sum.periods)+' 期全部为实盘记录</span>';
  var rows=names.sort(function(x,y){
      var ax=arms[x].hit_rate,ay=arms[y].hit_rate;
      return (ay==null?-1:ay)-(ax==null?-1:ax);
    }).slice(0,4).map(function(n){
      var a=arms[n];
      return '<tr><td class="primary">'+esc(backtestArmName(n))+robustBadge(n)+'</td>'
        +'<td class="r">'+fmtWinRate(
            a.hit_rate==null?0:Math.round(a.hit_rate*(a.n_scored||0)),
            a.n_scored||0)+'</td>'
        +'<td class="r num '+pctCls(a.mean_return_pct)+'">'+fmtPct(a.mean_return_pct)+'</td>'
        +'<td class="r num">'+fmtInt(a.n_chosen)+'</td></tr>';
    }).join('');
  return '<div class="card section"><div class="card-title-row">'
    +'<h2 class="card-title">历史回测</h2>'
    +'<span class="card-note">真实候选池 · 真实收盘 · 零模型复算（'+fmtInt(sum.model_calls||0)+' 次模型调用）</span></div>'
    +'<div class="bt-meta">'
      +'<div class="meta-kv"><div class="k">窗口</div><div class="v num">'+esc(b.window_start||'—')+' → '+esc(b.window_end||'—')+'</div></div>'
      +'<div class="meta-kv"><div class="k">期数</div><div class="v">'+mix+'</div></div>'
      +(function(){
      var m=backtestMaturity();
      if(!m||!m.target)return '<div class="meta-kv"><div class="k">持有期</div><div class="v num">'+fmtInt(sum.horizon_days)+' 天</div></div>';
      var partial=m.n-m.full;
      var tip='目标持有期 '+m.target+' 天。各期起点不同，所以到今天为止实际已过 '
        +m.min+'~'+m.max+' 天：'+m.periods.map(function(k){return k+' '+m.byPeriod[k]+' 天'}).join('、')+'。'
        +(partial?'其中 '+partial+' 期尚未满 '+m.target+' 天，它们的收益按最新收盘计价，是中途读数而不是已完成的交易——下表的胜率与平均收益把两类放在一起算，读的时候要记得这一点。'
                :'所有期次均已满 '+m.target+' 天。');
      return '<div class="meta-kv"><div class="k">持有期</div><div class="v num">目标 '+m.target+' 天'
        +'<span style="font-family:var(--font-sans);font-weight:400;color:var(--color-text-tertiary)"> · 实际已过 '+m.min+'~'+m.max+' 天'
        +(partial?'（'+partial+'/'+m.n+' 期未满）':'')+'</span>'
        +'<span class="gloss gm" title="'+esc(tip)+'">ⓘ</span></div></div>';
    })()
      +(sum.asof_audit
        ?'<div class="meta-kv"><div class="k">时间钳制</div><div class="v" '
          +'title="'+esc(sum.asof_audit.checks||'')+'。回放是 strict 模式：任一项越界直接中止，'
          +'不会先出数字再报警。">'+fmtInt(sum.asof_audit.periods_audited)+' 期审计 · '
          +(sum.asof_audit.leaks===0?'零越界 ✓':fmtInt(sum.asof_audit.leaks)+' 项越界')
          +'</div></div>'
        :'')
    +'</div>'

        var cap='本表以单条想法为单位：候选池内每条想法按当时收盘价买入、'

/* ════════════════════ 历史回测 — 底账内的一段（可选历史窗口） ═════════════════════ */
function backtestSection(){
  var b=S.backtest||{},sum=b.summary||{},arms=sum.arms||{};
  if(!b.backtest_id){
    return '<div class="card section" id="sec-backtest"><h2 class="card-title">历史回测</h2>'

  }

  var windowStart=backtestStart||b.window_start;
  if(windowStart<b.window_start)windowStart=b.window_start;
  if(windowStart>b.window_end)windowStart=b.window_end;
  backtestStart=windowStart;
  var points=(b.points||[]).filter(function(p){return p.d>=windowStart&&p.d<=b.window_end});
  var filteredPositions=(b.positions||[]).filter(function(p){return p.period>=windowStart&&p.period<=b.window_end});
  var dates=(sum.dates||[]).filter(function(d){return d>=windowStart&&d<=b.window_end});
  var filteredArms=backtestArmMetrics(filteredPositions,Object.keys(arms),sum.horizon_days);
  var filteredPaired=backtestPairedSummary(sum.paired,windowStart,b.window_end);
  var names=Object.keys(filteredArms);
  var latest=dates.length?dates[dates.length-1]:null;
  var meta='<div class="bt-meta">'
    +'<div class="meta-kv"><div class="k">回测窗口</div><div class="v num">'+esc(windowStart)+' → '+esc(b.window_end)+'</div></div>'
    +'<div class="meta-kv"><div class="k">周频周期</div><div class="v num">'+fmtInt(dates.length)+' 期</div></div>'
    +(function(){
      var m=backtestMaturity();

        +(partial?'其中 '+partial+' 期尚未满 '+m.target+' 天，它们的收益按最新收盘计价，是中途读数而不是已完成的交易——下表的胜率与平均收益把两类放在一起算，读的时候要记得这一点。'
                :'所有期次均已满 '+m.target+' 天。');
      return '<div class="meta-kv"><div class="k">持有期</div><div class="v num">目标 '+m.target+' 天'
        +'<span style="font-family:var(--font-sans);font-weight:400;color:var(--color-text-tertiary)"> · 实际已过 '+m.min+'~'+m.max+' 天'
        +(partial?'（'+partial+'/'+m.n+' 期未满）':'')+'</span>'
        +'<span class="gloss gm" title="'+esc(tip)+'">ⓘ</span></div></div>';
    })()
    +'<div class="meta-kv"><div class="k">模型调用</div><div class="v num">'+fmtInt(sum.model_calls)+' 次</div></div>'
    +'<div class="meta-kv"><div class="k">持久化</div><div class="v">RDS 明细 · '+(b.artifact_archived?'TOS 不可变归档':'未归档')+'</div></div>'
    +'</div>';

  var curve='<div class="card section"><div class="card-title-row"><h2 class="card-title">两臂净值指数</h2>'
    +'<span class="card-note">所选窗口期初 = 100</span></div>'
    +backtestCurveSVG(points)
    +'<div class="bt-legend">'
      +names.map(function(n,i){return '<span><i class="bt-swatch" style="background:var(--color-data-'+(i%8+1)+')"></i>'+esc(backtestArmName(n))+'</span>'}).join('')
    +'</div></div>';

  var armRows=names.map(function(name){
    var a=filteredArms[name]||{};
    return '<tr><td class="primary">'+esc(backtestArmName(name))+'</td>'
      +'<td class="r num">'+fmtInt(a.n_chosen)+'</td>'
      +'<td class="r num">'+fmtInt(a.n_scored)+'</td>'
      +'<td class="r num">'+(a.coverage==null?'—':fmtRate(a.coverage*100))+'</td>'
      +'<td class="r num '+pctCls(a.mean_return_pct)+'">'+fmtPct(a.mean_return_pct)+'</td>'
      +'<td class="r num '+pctCls(a.median_return_pct)+'">'+fmtPct(a.median_return_pct)+'</td>'
      +'<td class="r num">'+(a.hit_rate==null?'—':fmtRate(a.hit_rate*100))+'</td>'
      +'<td class="r num">'+(a.window_complete_frac==null?'—':fmtRate(a.window_complete_frac*100))+'</td></tr>';
  }).join('');
  /* 「UNKNOWN 不按 0% 填充」是给工程师看的写法：一句英文常量夹在中文界面里，
   * 读者第一反应是没处理干净的占位符，而它其实说的是一件重要的事——取不到
   * 价格的标的不当成 0% 收益混进平均值。列名同理，逐个挂上口径。 */
  var HDR=[
    ['生成方法','',''],
    ['入选','r','这条臂在所选窗口内一共选中了多少条候选（按条计，不去重标的）。'],
    ['可计价','r','其中能取到进出场价格、可以算出收益的条数。取不到价格的不计入下面的收益统计，也不按 0% 填充。'],
    ['覆盖率','r','可计价 ÷ 入选。低于 100% 说明有标的当期取不到行情——常见于基金与结构化产品。'],
    ['平均收益','r','可计价那部分的算术平均收益。少数极端值会明显拉动它，所以旁边同时给出中位数。'],
    ['中位收益','r','可计价那部分的中位收益。与平均值差距大，说明收益集中在少数标的上。'],
    ['正收益率','r','可计价的条目里收益为正的比例。它衡量「多久对一次」，与「对的时候赚多少」是两件事。'],
    ['完整窗口','r','这些持仓里，已经跑满目标持有期的比例。比例低说明本表大部分是中途读数而非已完成的交易。']
  ];
  var metrics='<div class="card section"><div class="card-title-row"><h2 class="card-title">方法指标</h2>'
    +'<span class="card-note">取不到价格的标的不按 0% 计入'
    +'<span class="gloss gm" title="把取不到行情的标的当成 0% 收益，会把平均值往中间拉，让方法看起来比实际稳定。这里的做法是把它们排除在收益统计之外，并在「覆盖率」里如实报出占比。">ⓘ</span></span></div>'
    +'<div class="table-wrap"><table><thead><tr>'
    +HDR.map(function(h){
      return '<th'+(h[1]?' class="'+h[1]+'"':'')+'>'+esc(h[0])
        +(h[2]?'<span class="gloss gm" title="'+esc(h[2])+'">ⓘ</span>':'')+'</th>';
    }).join('')
    +'</tr></thead><tbody>'+armRows+'</tbody></table></div>'+pairedSummary(filteredPaired)+'</div>';

  var latestPos=filteredPositions.filter(function(p){return p.period===latest});
  var posRows=latestPos.map(function(p){
    return '<tr><td class="primary">'+esc(backtestArmName(p.arm))+'</td>'
      +'<td class="mono">'+esc(p.instrument_id)+'</td>'
      +'<td class="num">'+esc(p.entry_d||'—')+'</td><td class="num">'+esc(p.exit_d||'—')+'</td>'
      +'<td class="r num">'+fmtMoney(p.entry_nav)+'</td><td class="r num">'+fmtMoney(p.exit_nav)+'</td>'
      +'<td class="r num '+pctCls(p.return_pct)+'">'+fmtPct(p.return_pct)+'</td>'
      +'<td>'+esc(p.status||'—')+'</td></tr>';
  }).join('');
  var positionsCard='<div class="card section"><div class="card-title-row"><h2 class="card-title">最近一期模拟持仓</h2>'
    +'<span class="card-note">'+esc(latest||'—')+' · 所选窗口 '+fmtInt(filteredPositions.length)+' 条历史持仓</span></div>'
    +'<div class="table-wrap"><table><thead><tr><th>生成方法</th><th>标的</th><th>进场</th><th>退出</th>'
    +'<th class="r">进场 NAV</th><th class="r">退出 NAV</th><th class="r">收益</th><th>状态</th></tr></thead>'
    +'<tbody>'+posRows+'</tbody></table></div></div>';

  return '<div id="sec-backtest">'
    +'<div class="card section"><div class="card-title-row"><h2 class="card-title">历史回测</h2>'
    +'<div class="bt-date-control"><label for="backtestStart">起始日期</label>'
    +'<input id="backtestStart" type="date" min="'+esc(b.window_start)+'" max="'+esc(b.window_end)+'" value="'+esc(windowStart)+'" onchange="setBacktestStart(this.value)">'
    +badge('success','已完成')+'</div></div>'+meta
    +'<div class="bt-kpis">'
      +'<div class="bt-kpi"><div class="v num">'+fmtInt(dates.length)+'</div><div class="k">配对周期</div></div>'
      +'<div class="bt-kpi"><div class="v num">'+fmtInt(points.length)+'</div><div class="k">净值点</div></div>'
      +'<div class="bt-kpi"><div class="v num">'+fmtInt(filteredPositions.length)+'</div><div class="k">模拟持仓记录</div></div>'
      +'<div class="bt-kpi"><div class="v num">'+fmtInt(sum.model_calls)+'</div><div class="k">回测模型调用</div></div>'
    +'</div></div>'+curve+metrics+positionsCard+'</div>';
}
function setBacktestStart(value){
  var b=(S&&S.backtest)||{};
  if(!value)return;
  backtestStart=value<b.window_start?b.window_start:(value>b.window_end?b.window_end:value);
  /* 完整回测已经从抽屉搬进「证据」页，重渲染的是那一页；抽屉里可能还开着
     别的东西，也一并刷新。用 setTimeout 而不是 rAF，理由同别处。 */
  renderEvidence();renderDrawers();
  setTimeout(function(){
    var body=document.querySelector('.drawer:last-of-type .drawer-body');
    var el=body?body.querySelector('#sec-backtest'):$('sec-backtest');
    if(el&&body)el.scrollIntoView({block:'start'});else scrollToEl($('sec-backtest'));
  },0);
}
function median(values){
  if(!values.length)return null;
  var sorted=values.slice().sort(function(a,b){return a-b}),mid=Math.floor(sorted.length/2);
  return sorted.length%2?sorted[mid]:(sorted[mid-1]+sorted[mid])/2;
}
function backtestArmMetrics(positions,names,horizonDays){
  var out={};
  names.forEach(function(name){
    var rows=positions.filter(function(p){return p.arm===name});
    var scored=rows.filter(function(p){return p.return_pct!==null&&p.return_pct!==undefined&&!isNaN(p.return_pct)});
    var returns=scored.map(function(p){return Number(p.return_pct)});
    var complete=rows.filter(function(p){
      if(!p.entry_d||!p.exit_d)return false;
      return (new Date(p.exit_d+'T00:00:00Z')-new Date(p.entry_d+'T00:00:00Z'))/86400000>=Number(horizonDays||0);
    }).length;
    out[name]={
      n_chosen:rows.length,n_scored:scored.length,
      coverage:rows.length?scored.length/rows.length:null,
      mean_return_pct:returns.length?returns.reduce(function(a,v){return a+v},0)/returns.length:null,
      median_return_pct:median(returns),
      hit_rate:returns.length?returns.filter(function(v){return v>0}).length/returns.length:null,
      window_complete_frac:rows.length?complete/rows.length:null
    };
  });
  return out;
}
function backtestPairedSummary(p,start,end){
  if(!p)return null;
  var pairs=(p.pairs||[]).filter(function(x){return x.as_of>=start&&x.as_of<=end});
  var diffs=pairs.map(function(x){return Number(x.diff)}).filter(function(v){return !isNaN(v)});
  var ratio=Number(p.n_pairs)>0?Number(p.n_eff)/Number(p.n_pairs):1;
  return {
    conclusive:false,n_pairs:pairs.length,
    n_eff:pairs.length?(pairs.length*(isFinite(ratio)?ratio:1)).toFixed(3):0,
    mean_diff:diffs.length?diffs.reduce(function(a,v){return a+v},0)/diffs.length:null,
    message:pairs.length?'所选窗口内的配对结果。':'所选窗口内暂无配对结果。'
  };
}
function pairedSummary(p){
  if(!p)return '';
  return '<div class="quiet" style="margin-top:var(--space-4)">'
    +badge('neutral','窗口统计')
    +'　配对 '+fmtInt(p.n_pairs)+' 期 · 有效独立样本 <span class="num">'+esc(p.n_eff)+'</span>'
    +(p.mean_diff==null?'':' · 平均差 <span class="num '+pctCls(p.mean_diff*100)+'">'+fmtPct(p.mean_diff*100)+'</span>')
    +'<div style="margin-top:6px">'+esc(p.message||'')+'</div></div>';
}
function backtestCurveSVG(points){
  if(!points.length)return '<div class="empty-sm">暂无净值点</div>';
  var byArm={},dates={};
  points.forEach(function(p){(byArm[p.arm]=byArm[p.arm]||[]).push(p);dates[p.d]=1});
  var ds=Object.keys(dates).sort(),names=Object.keys(byArm);
  var W=760,H=230,pl=44,pr=125,pt=14,pb=24,mn=Infinity,mx=-Infinity;
  var series=names.map(function(name,i){
    var map={};byArm[name].forEach(function(p){map[p.d]=Number(p.equity)});
    var values=ds.map(function(d){return map[d]===undefined?null:map[d]});
    values.forEach(function(v){if(v!==null){mn=Math.min(mn,v);mx=Math.max(mx,v)}});
    // 只定义了 8 个数据色；真实回测现在有 9 条臂，第 9 条会拿到不存在的
    // 变量而画成透明。循环取用，宁可两条同色也不要一条隐形。
    return {name:name,values:values,color:'var(--color-data-'+(i%8+1)+')'};
  });
  if(!isFinite(mn)||!isFinite(mx))return '<div class="empty-sm">净值点不可用</div>';
  if(mx-mn<0.5){mn-=0.5;mx+=0.5}
  function X(i){return pl+i*(W-pl-pr)/Math.max(1,ds.length-1)}
  function Y(v){return pt+(mx-v)/(mx-mn)*(H-pt-pb)}
  series.forEach(function(s){
    var first=s.values.find(function(v){return v!==null});
    if(first!==undefined&&first!==null&&first!==0){
      s.values=s.values.map(function(v){return v===null?null:v/first*100});
    }
  });
  mn=Infinity;mx=-Infinity;
  series.forEach(function(s){s.values.forEach(function(v){if(v!==null){mn=Math.min(mn,v);mx=Math.max(mx,v)}})});
  if(mx-mn<0.5){mn-=0.5;mx+=0.5}
  var svg='<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block;max-width:800px" role="img" aria-label="所选窗口两臂回测净值曲线">';
  [mx,100,mn].forEach(function(g){
    if(g<mn-0.01||g>mx+0.01)return;
    svg+='<line x1="'+pl+'" y1="'+Y(g)+'" x2="'+(W-pr)+'" y2="'+Y(g)+'" stroke="var(--color-border-subtle)" stroke-width="1"'+(g===100?' stroke-dasharray="4 3"':'')+'/>'
      +'<text x="'+(pl-6)+'" y="'+(Y(g)+4)+'" text-anchor="end" font-family="var(--font-mono)" font-size="11" fill="var(--color-text-tertiary)">'+g.toFixed(1)+'</text>';
  });
  series.forEach(function(s){
    var pts=[];s.values.forEach(function(v,i){if(v!==null)pts.push(X(i).toFixed(1)+','+Y(v).toFixed(1))});
    if(pts.length>=2){
      svg+='<polyline points="'+pts.join(' ')+'" fill="none" stroke="'+s.color+'" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>';
    }
    var li=s.values.length-1;while(li>=0&&s.values[li]===null)li--;
    if(li>=0)svg+='<circle cx="'+X(li)+'" cy="'+Y(s.values[li])+'" r="2.5" fill="'+s.color+'"/>'
      +'<text x="'+(X(li)+8)+'" y="'+(Y(s.values[li])+4)+'" font-family="var(--font-sans)" font-size="11" fill="'+s.color+'">'+esc(backtestArmName(s.name))+' '+s.values[li].toFixed(1)+'</text>';
  });
  svg+='<text x="'+pl+'" y="'+(H-6)+'" font-family="var(--font-mono)" font-size="11" fill="var(--color-text-tertiary)">'+esc(ds[0])+'</text>'
    +'<text x="'+(W-pr)+'" y="'+(H-6)+'" text-anchor="end" font-family="var(--font-mono)" font-size="11" fill="var(--color-text-tertiary)">'+esc(ds[ds.length-1])+'</text></svg>';
  return '<div class="funnel-wrap">'+svg+'</div>';
}

/* ════════════════════ ② 过程 v3 — 画布即舞台，细节全在抽屉里 ════════════════════

var POPS={},popSeq=0,popTimer=null,popCur=null,popX=0,popY=0;
function popRef(html){var id='pp'+(popSeq++);POPS[id]=html;return ' data-pop="'+id+'"'}
function showPop(html,x,y){
  var el=$('pcPop');if(!el||!html)return;
  el.innerHTML=html;el.classList.add('show');
  var r=el.getBoundingClientRect();
  var px=Math.min(x+16,window.innerWidth-r.width-10);
  var py=Math.min(y+18,window.innerHeight-r.height-10);
  el.style.left=Math.max(6,px)+'px';el.style.top=Math.max(6,py)+'px';
}
function hidePop(){
  clearTimeout(popTimer);popCur=null;
  var el=$('pcPop');if(el)el.classList.remove('show');
}
document.addEventListener('mouseover',function(e){
  var t=e.target;
  var el=(t&&t.closest)?t.closest('[data-pop]'):null;
  if(!el){if(popCur)hidePop();return}
  var id=el.getAttribute('data-pop');
  if(id===popCur)return;
  hidePop();popCur=id;popX=e.clientX;popY=e.clientY;
  popTimer=setTimeout(function(){if(popCur===id)showPop(POPS[id]||'',popX,popY)},150);
});
document.addEventListener('mousemove',function(e){popX=e.clientX;popY=e.clientY});
document.addEventListener('scroll',function(){hidePop()},true);

/* 触屏没有 hover，而 ⓘ 用的是原生 title——页面把大量口径、免责和推导都收在
 * 那里面，手机上等于全部读不到。这里让带 title 的 .gloss / ⓘ 也能点开，
 * 复用同一个气泡，不新增一套 UI。桌面维持 hover 原生 tooltip 不变。 */
document.addEventListener('click',function(e){
  var t=e.target;
  var g=(t&&t.closest)?t.closest('.gloss[title],[data-tip]'):null;
  if(!g){if(popCur==='tip')hidePop();return}
  e.preventDefault();e.stopPropagation();
  var txt=g.getAttribute('title')||g.getAttribute('data-tip')||'';
  if(!txt)return;
  /* 只有在没有 hover 的设备上才把 title 摘掉（摘掉是为了不和原生 tooltip 打架）。
   * 桌面必须保留 title：否则点过一次之后，之后的 hover 就什么都不弹了。 */
  if(g.hasAttribute('title')&&window.matchMedia&&window.matchMedia('(hover:none)').matches){
    g.setAttribute('data-tip',txt);g.removeAttribute('title');
  }
  if(popCur==='tip'){hidePop();return}
  hidePop();popCur='tip';
  var r=g.getBoundingClientRect();
  showPop('<div style="max-width:280px;white-space:normal">'+esc(txt)+'</div>',
          r.left,r.bottom-8);
},true);

function poolMatch(c){
  if(!poolFilter)return true;

  if(t==='topic')return c.topic_id===v;
  if(t==='code')return c.instrument_id===v||c.instrument_id===bareCode(v);
  if(t==='method')return (c.proposed_by||[]).some(function(m){return m===v||methodName(m)===methodName(v)});
  if(t==='mt')return c.topic_id===v.topic&&(c.proposed_by||[]).some(function(m){return m===v.method||methodName(m)===methodName(v.method)});
  if(t==='conv'){var n=c.n_methods!=null?c.n_methods:(function(){var uq={};(c.proposed_by||[]).forEach(function(m){uq[m]=1});return Object.keys(uq).length})();return String(n)===String(v)}

    var s=(((S||{}).weekly||{}).selectors||[]).find(function(x){return x.name===v});

/* 后端的说明文字里会直接出现内部键名（例如「未参与：ai_native」）。
 * 页面其余地方一律用中文名，这里漏出英文键名，读者既不知道它指谁，
 * 也会以为是没处理干净的字符串。渲染时统一换掉。 */
function humanizeKeys(text){
  var t=String(text||'');
  if(!t)return t;
  var pairs=[];
  (typeof SEL_META!=='undefined'?SEL_META:[]).forEach(function(m){pairs.push([m[0],m[1]])});
  (typeof GEN_ORDER!=='undefined'?GEN_ORDER:[]).forEach(function(o){pairs.push([o[0],o[1]])});
  pairs.sort(function(a,b){return b[0].length-a[0].length});   /* 长键先替，避免前缀误伤 */
  pairs.forEach(function(kv){
    if(kv[0]===kv[1])return;
    t=t.split(kv[0]).join(kv[1]);
  });
  return t;
}
function selMetaOf(name){
  return SEL_META.find(function(m){return m[0]===name})||[name,name,'','',''];
}
function selPlain(name){
  var m=selMetaOf(name);var t=m[4]||'';
  return t.replace(/\{n:([a-z_]+)\}/g,function(_,nm){
    var sl=(((S||{}).weekly||{}).selectors||[]).find(function(x){return x.name===nm});
    return sl?String((sl.chosen||[]).length):'—';
  });
}
function selGlossTitle(m){return (m[3]?m[3]+'——':'')+selPlain(m[0])}
/* ── 执行路径：环节内每条路径的自动化程度，口径唯一 ── */

  frame:['约束边界','模型在人工规定的推理框架内作答（约束条件 / 因果链 / 定价背离），输出须通过框架校验，不满足即作废。'],
  code:['纯代码','确定性规则计算，无模型调用。同一输入必得同一输出，可离线复算与审计。']
};

var SEL_PATH={ai_native:'ai',omega_loose:'code',omega_strict:'code',spread:'code',calib:'code',
  left_tail:'code',buy_all:'code',random_pick:'code',
  generated_ai_native:'code',generated_carl_constraint:'code'};

function pathLegend(map,keys){

  var out=['ai','frame','code'].filter(function(t){return n[t]}).map(function(t){

  });

/* HGEP 四字母 & 其他必须挂 ⓘ 的口径 */
var HGEP_GLOSS={
  H:'H 热度 = 覆盖广度与提及增速',
  G:'G 分歧 = 多空观点分歧程度',
  E:'E 实据 = 证据落到订单与利润的程度，而非停留于叙事',
  P:'P 已定价 = 价格已计入的程度，反向计分 (100 − P)'
};
var COUNT_GLOSS='计数对照臂：不作语义判断，仅统计各主题的研报提及数并排序。与 HGEP 语义打分的分歧即语义判断增量价值的持续观测量。';
/* 交易成本是真的在算的。config.COSTS 的注释把原因写在了那里：v0.3 没有成本模型，
 * 「是回测虚高的单一最大来源」。页面此前两处都写着「未计交易费用」——既不实，
 * 也把这套账本比它实际更粗糙地说了出去。 */
var COST_GLOSS='买卖两条腿都计成本：美股每条腿 4bp（1bp 佣金 + 3bp 滑点），港股 7.5bp（2.5 + 5）。'
  +'其中一半做进场价上浮、一半作为手续费单独扣。所以「对成本」的收益是扣费后的，'
  +'比只看价格涨跌低一点——这个差额就是成本。没有成本模型是回测虚高最大的单一来源，所以这里不省。';
var SIGMA_GLOSS='σ = 标的近月波动率。止损与止盈按其倍数设定（−2σ / +3σ），使风控幅度在不同波动水平的资产间可比。触发后自动执行。';
var ARM_GLOSS='正式比较臂 = 预注册参与统计检验的策略（主策略）。限定比较次数以控制多重检验下的假阳性，对照与探索臂不参与结论判定。';
var RULER_GLOSS='基准 = 不作判断的对照账本（全量 / 随机）。跑不赢全量基准即选取环节无增量，跑不赢随机基准即排序为噪声。';
function orderedSelectors(){
  var sels=((S||{}).weekly||{}).selectors||[];
  var order={};SEL_META.forEach(function(m,i){order[m[0]]=i});
  return sels.slice().sort(function(a,b){
    var x=order[a.name]!==undefined?order[a.name]:99,y=order[b.name]!==undefined?order[b.name]:99;
    return x-y||String(a.name).localeCompare(String(b.name));
  });
}

/* 方法：它是怎么从 858 篇研报走到 73 条候选的。逐段可回溯。 */
function renderMethod(){
  var root=$('view-method');
  if(!S){root.innerHTML='';return}
  root.innerHTML=
     procFailBanner()
    +secWrap('method','mainline',mainLine(aggBooks()))
    +secWrap('method','canvas',pipeCanvasCard())
    +secWrap('method','corpus',corpusSourceCard())
    +secWrap('method','universe',universeCard());
  /* 主线第 03 段内嵌了候选池全表，它的行是 JS 填的。renderEvidence 里有同一句，
   * 但 toggleStage 只重跑 renderMethod —— 于是展开这一段之后，表头写着
   * 「73 条 · 列头排序」，底下一行都没有。谁生成这张表，谁负责把它填上。 */
  if($('candTable')){bindCandSort();renderCandBody()}
}

/* 语料来源：本期各来源的期次与条数，直达逐篇研报清单 */
function corpusSourceCard(){
  var w=S.weekly||{};
  var rows=(S.feeds||[]).filter(function(x){return x.kind==='corpus'&&x.as_of===w.as_of});
  var n=w.corpus_total||corpusRowsFor(w.as_of);
  if(!n&&!rows.length)return '';
  var g={};rows.forEach(function(f){(g[f.feed]=g[f.feed]||[]).push(f)});
  var keys=Object.keys(g);
  var tbl=keys.length
    ?'<div class="table-wrap"><table>'
      +'<thead><tr><th>来源</th><th>期次</th><th class="r">条数</th><th>状态</th><th></th></tr></thead><tbody>'
      +keys.map(function(k){
        var arr=g[k],f=arr[0];
        var sum=arr.reduce(function(a,x){return Math.max(a,x.n_rows||0)},0);
        return '<tr class="expandable" onclick="openCorpus(\''+jss(f.as_of)+'\')">'
          +'<td class="primary">'+esc(feedMeta(f.feed)[0])+'</td>'
          +'<td class="mono">'+esc(f.as_of||'')+'</td>'
          +'<td class="r num">'+fmtInt(sum)+'</td>'
          +'<td>'+(arr.every(function(x){return x.ok})?badge('success','正常'):badge('error','异常'))
          +(arr.length>1?' <span class="card-note">'+arr.length+' 次抓取</span>':'')+'</td>'
          +'<td class="r"><span class="exp-btn">研报清单 ›</span></td></tr>';
      }).join('')+'</tbody></table></div>'
    :'';
  return '<div class="card section">'
    +'<div class="card-title-row"><h2 class="card-title" style="margin-bottom:0">语料来源</h2>'
    +'<span class="card-note">本期读入 '+fmtInt(n)+' 条 · 各环节的唯一输入</span></div>'
    +tbl
    +'<div style="margin-top:var(--space-3)">'
    /* 这里曾再放一个「逐篇研报清单 ›」，而它上面那张表的每一行行末就写着
     * 「研报清单 ›」、整行可点，去的是同一个地方。 */
    +'<button type="button" class="exp-btn" style="margin-left:8px" onclick="openStageDrawer(0)">来源分布与主题归属 ›</button>'
    +'</div></div>';
}

/* 本期失败、展示上期时的诚实横幅 */

  var wkOut=hbOutcome('weekly');

function pipeCanvasSVG(){
  var w=S.weekly||{};

  var chosen=topicChosen('hgep');
  var ctrlChosen={};(ctrl?(ctrl.chosen||[]):[]).forEach(function(t){ctrlChosen[t]=1});
  var evAll=w.evidence||{};
  var gens=w.generators||[];
  var pool=w.pool||{};

    pop('筛选C · 选取策略',sels.length?sels.length+' 个策略同池并行':'尚未执行','同一候选池，唯一变量为选取策略'),

  ];
  /* 每列标注数值口径，画布上不出现无单位的裸数字。
   * 一个非技术读者第一次看这张图时问的第一个问题就是「这个数是几什么」，

  cols.forEach(function(c){

function ensureJournal(runId){
  var key=runId||'latest';
  if(JCache[key])return JCache[key];
  if(J&&J.journal&&(key==='latest'||J.run_id===runId)){
    JCache[key]={j:J.journal};return JCache[key];
  }
  if(!JLoading[key]){
    JLoading[key]=true;
    fetch('/api/journal'+(runId?'?run_id='+encodeURIComponent(runId):''),{cache:'no-store'})
      .then(function(r){return r.json().then(function(b){return {ok:r.ok,b:b}})})
      .then(function(res){
        if(res.b&&res.b.journal)JCache[key]={j:res.b.journal};
        else JCache[key]={j:null,err:(res.b&&res.b.error)||('HTTP '+(res.ok?'格式不对':'错误'))};
      })
      .catch(function(e){JCache[key]={j:null,err:e&&e.message?e.message:String(e)}})
      .then(function(){JLoading[key]=false;renderDrawers()});
  }
  return null;
}
function rlTime(iso){
  if(!iso)return '—';
  var d=new Date(iso);if(isNaN(d))return esc(iso);
  var hm=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Hong_Kong',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(d);
  var ms=String(d.getMilliseconds()).padStart(3,'0');
  return hm+'.'+ms;
}
function rlBytes(b){
  b=Number(b);if(isNaN(b))return '';
  if(b>=1048576)return (b/1048576).toFixed(1)+' MB';
  if(b>=1024)return (b/1024).toFixed(1)+' KB';
  return b+' B';
}
function rlKvHTML(st){
  var step=st.step||'';

    parts.push(kv('合格标的',fmtInt(st.eligible)));parts.push(kv('排除',fmtInt(st.excluded)));
    if(st.shelf_dating)parts.push(kv('货架',fmtInt(st.shelf_dating.total)));
  }else if(step.indexOf('feed:')===0){
    parts.push(kv('来源',esc(step.slice(5))));
    if(st.kind)parts.push(kv('类型',esc(st.kind)));
    parts.push(st.ok?'ok':'<span class="rl-err">失败'+(st.error?'：'+esc(st.error):'')+'</span>');
  }else if(step==='theme_discovery'){
    parts.push(kv('主题覆盖',esc(numOr(st.coverage_pct))+'%'));parts.push(kv('未匹配语料',fmtInt(st.unmatched)));parts.push(kv('新主题候选',fmtInt(st.candidates)));
  }else if(step==='inputs'){
    parts.push(kv('语料',fmtInt(st.corpus)));parts.push(kv('日历',fmtInt(st.calendar)));parts.push(kv('价格行',fmtInt(st.prices)));
    if(st.sha)parts.push(kv('输入指纹',esc(st.sha)));
  }else if(step==='topics'){
    parts.push(kv('策略',esc(st.strategy||'')+(st.version?' v'+esc(st.version):'')));
    if(st.chosen)parts.push(kv('选中',st.chosen.map(esc).join(' ')));
    if(st.calls!==undefined)parts.push(kv('模型调用',fmtInt(st.calls)));
  }else if(step==='generators'){
    var pr=st.produced||{};
    parts.push(kv('共写出',fmtInt(st.pool)+' 条'));
    parts.push(Object.keys(pr).map(function(k){return esc(methodName(k))+' '+fmtInt(pr[k])}).join(' · '));
    var ge=st.errors||{};
    Object.keys(ge).forEach(function(k){parts.push('<span class="rl-err">'+esc(methodName(k))+'：'+esc(ge[k])+'</span>')});
  }else if(step==='pool'){
    parts.push(kv('原始想法',fmtInt(st.raw)));parts.push(kv('合并后',fmtInt(st.merged)+' 条（一标一条）'));
    var cv=st.convergence||{};
    var cvs=Object.keys(cv).sort().reverse().map(function(k){return esc(k)+'×'+fmtInt(cv[k])}).join(' ');
    if(cvs)parts.push(kv('共识分布',cvs));
  }else if(step==='selectors'){
    parts.push(kv('同池候选',fmtInt(st.pool)));
    var ch=st.chosen||{};
    parts.push(Object.keys(ch).map(function(k){return esc(selMetaOf(k)[1])+' '+fmtInt(ch[k])}).join(' · '));
    var se=st.errors||{};
    Object.keys(se).forEach(function(k){parts.push('<span class="rl-err">'+esc(selMetaOf(k)[1])+'：'+esc(se[k])+'</span>')});
    if(st.inputs_sha)parts.push(kv('输入指纹',esc(st.inputs_sha)));
  }else{
    Object.keys(st).forEach(function(k){
      if(k==='step'||k==='at'||k==='n')return;
      var v=st[k];
      if(v===null||typeof v==='object')return;
      parts.push(kv(esc(k),esc(String(v))));
    });
  }
  return parts.join('　');
}
/* ══════════ 运行日志摘要视图 ══════════
 * 同一份 journal，两种读法。工程视图是原始步骤 + 键值，给要核对的人；
 * 摘要视图把每一步写成一句完整的话：动作、产出、作用。
 * 数字全部来自同一个 journal 字段，没有一个是叙述时补出来的：
 * 摘要视图仅措辞不同，与工程视图同源。 */
function rlPlainStep(st,idx){
  var step=st.step||'';
  /* T.t / T.d 渲染时会 esc()，T.w 不会——它要内嵌 glossMark 产出的 HTML。
   * 所以 T.w 只能赋硬编码字面量或 glossMark(字面量)；往里塞 journal 字段、
   * 服务端返回或任何用户可控的值之前，先自己 esc()。T.chips 的 k/v 会被 esc。 */
  var T={};
  if(step==='universe'){
    T.t='可交易货架：本期可买入标的范围';
    T.d='货架共 '+fmtInt((st.shelf_dating||{}).total)+' 个标的，本期合格 '+fmtInt(st.eligible)
      +' 个，排除 '+fmtInt(st.excluded)+' 个。';
    T.w='合格集合 = 后续所有候选的取值范围 '+glossMark('不在货架上的标的，无法出现在任何一条候选里。');
  }else if(step.indexOf('feed:')===0){
    var src=step.slice(5);
    T.t='数据接入：'+src;
    T.d=st.ok?('该来源已取得'+(st.kind?'（'+st.kind+'）':'')+'。')
             :('该来源取数失败'+(st.error?'：'+st.error:'')+'。');
    T.w=st.ok?'':'该来源缺失，本期判断所依据的材料相应减少。';
    T.bad=!st.ok;
  }else if(step==='theme_discovery'){
    T.t='主题发现：检查现有主题表是否覆盖本期语料';
    T.d='本期语料 '+numOr(st.coverage_pct)+'% 可归入已登记主题；未匹配 '
      +fmtInt(st.unmatched)+' 篇，其中达标的新主题候选 '+fmtInt(st.candidates)+' 个。';
    T.w='防止主题表滞后于宏观环境 '+glossMark('达标的新主题自动登记；登记记录 append-only，不可回填。');
  }else if(step==='inputs'){
    T.t='输入封存：固定本期可用材料';
    T.d='封存研报 '+fmtInt(st.corpus)+' 篇、宏观日历 '+fmtInt(st.calendar)+' 条'
      +(st.sha?'，输入指纹 '+st.sha:'')+'。';
    T.w='封存后所有判断只能取用这一份材料 '+glossMark('事后追问决策依据时，模型读到的仍是这一份，因此回答无法在事后重构。');
  }else if(step==='topics'){
    T.t='筛选A 选主题：确定本期宏观主题';
    T.d='按 '+(st.strategy||'')+(st.version?' v'+st.version:'')+' 打分，入选 '+((st.chosen||[]).length||0)+' 个'
      +(st.calls!==undefined?' · 模型调用 '+fmtInt(st.calls)+' 次'+(st.calls===0?'（纯规则打分）':''):'');
    T.chips=(st.chosen||[]).map(function(t){return {k:t,v:''}});
    T.w='落选主题不进入筛选B，本期不会有任何候选出自这些主题。'
  }else if(step==='generators'){
    var pr=st.produced||{};
    var ks=Object.keys(pr);
    T.t='筛选B 生成候选：4 种方法并行，彼此不可见';
    T.d='共生成 '+fmtInt(st.pool)+' 条';
    var ge=st.errors||{};
    T.chips=ks.map(function(k){return {k:methodName(k),v:fmtInt(pr[k])+' 条',bad:!!ge[k]}})
      .concat(Object.keys(ge).filter(function(k){return !pr[k]}).map(function(k){return {k:methodName(k),v:'失败',bad:true}}));
    if(Object.keys(ge).length)T.bad=true;
    T.w='四种方法相互隔离 '+glossMark('多方法指向同一标的，方可视为跨方法信号。');
  }else if(step==='pool'){
    var cv=st.convergence||{};
    /* 共识分布的键是「4种方式」这样的中文串，不是数字键 */
    var four=0;Object.keys(cv).forEach(function(k){if(/^\s*4/.test(k))four=cv[k]||0});
    T.t='合并候选池：同一标的归并为一条';
    T.d=fmtInt(st.raw)+' 条原始候选归并为 '+fmtInt(st.merged)+' 条'
      +(four?'，其中 '+fmtInt(four)+' 条为 4 种生成方法共同指向的标的':'')+'。';
    T.w='合并后各选取策略面对同一候选池';
  }else if(step==='selectors'){
    var ch=st.chosen||{};
    var ks2=Object.keys(ch);
    T.t='选取持仓：各策略自同一候选池独立选取';
    T.d='候选池 '+fmtInt(st.pool)+' 条';
    var se=st.errors||{};
    T.chips=ks2.map(function(k){return {k:selMetaOf(k)[1],v:fmtInt(ch[k])+' 条',bad:!!se[k]}})
      .concat(Object.keys(se).filter(function(k){return ch[k]===undefined}).map(function(k){return {k:selMetaOf(k)[1],v:'失败',bad:true}}));
    if(Object.keys(se).length)T.bad=true;

/* 流水线的叙述顺序。写想法和合并候选池是同一毫秒落盘的，按时间戳排会读成
 * 「先合并再写」——时间没错，但顺序读起来是假的。同秒内改按管线顺序排，
 * 相隔超过 2 秒的仍以真实时钟为准。 */
var RL_ORDER={'universe':1,'theme_discovery':3,'inputs':4,'topics':5,'generators':6,'pool':7,'selectors':8};
function rlRank(st){
  var k=String(st.step||'');

}
function rlPlainHTML(j){

    var ta=a.at?new Date(a.at).getTime():0,tb=b.at?new Date(b.at).getTime():0;
    if(Math.abs(ta-tb)>2000)return ta-tb;

  });

    if(feeds.length){merged.push({_feeds:feeds});feeds=[]}

  });

  var t0=j.started_at?new Date(j.started_at).getTime():null;
  var n=0;
  var body=merged.map(function(st){
    var T,at;
    if(st._feeds){
      var fs=st._feeds,okN=fs.filter(function(f){return f.ok}).length;
      at=fs[0].at;

         d:okN+' / '+fs.length+' 路正常',
         chips:fs.map(function(f){return {k:(f.step||'').slice(5),v:f.ok?'正常':'失败',bad:!f.ok}}),
         w:okN<fs.length?'本期可用材料低于正常水平 '+glossMark('有来源取数失败。'):'',
         bad:okN<fs.length};

/* ── 2 · 筛选A：主题评分（focus = 主题 id：该行高亮+证据就地展开，其余压暗） ── */
/* 落选理由——用当时打分本身算出来的，不是事后编的说法。
 * 把落选主题的四个加权贡献，与入选主题在同一因子上的平均贡献相减，
 * 差得最多的那一项就是它的短板；再报出与入选线的分差。
 * 「差 0.1 分」只说明结果，「短板在 G 分歧」才说明原因。 */
function topicLossReason(r,avgComps,cutScore){
  var SEGL2=['H 热度','G 分歧','E 实据','P 已定价'];
  var comps=[0.30*(r.H||0),0.25*(r.G||0),0.25*(r.E||0),0.20*(100-(r.P||0))];
  var worst=0,worstGap=comps[0]-avgComps[0];
  for(var i=1;i<4;i++){var g=comps[i]-avgComps[i];if(g<worstGap){worstGap=g;worst=i}}
  var gap=(cutScore!==null&&r.score!==undefined)?(cutScore-(r.score||0)):null;
  var vals=[r.H,r.G,r.E,r.P];
  var txt='';
  /* 分差已经写在行末，这里只说原因：短在哪个因子、短多少 */
  if(worstGap<-0.2){
    txt='主要失分项 <b>'+SEGL2[worst]+'</b>（本主题 '+numOr(vals[worst])
      +(worst===3?'，该项反向计分，数值越低越好':'')+'，低于入选主题均值 '+Math.abs(worstGap).toFixed(1)+' 分）';
  }else{
    txt='四项因子均无明显缺口，综合分低于入选名额内主题';
  }
  /* 分差在行末已经印过一次（「差 0.1 分」）。这里再写「距入选线 0.1 分」，
   * 是同一个数换个说法说第二遍，读者会以为是两个不同的量。 */
  return txt;
}

function stageTopicsBody(d){
  var foc=(d&&d.f)?String(d.f):null;
  var w=S.weekly||{};
  var hgep=topicArm('hgep'),ctrl=topicArmNot('hgep');
  var chosenSet={};topicChosen('hgep').forEach(function(t){chosenSet[t]=1});
  var ctrlChosen={};(ctrl?(ctrl.chosen||[]):[]).forEach(function(t){ctrlChosen[t]=1});
  if(!(hgep&&hgep.scores&&Object.keys(hgep.scores).length)){
    return '<div class="empty-sm">本期评分尚未产出'+(w.in_flight?'，进行中，稍后自动刷新':'')+'</div>';
  }
  var rows=Object.keys(hgep.scores).map(function(k){var o=hgep.scores[k];o._id=k;return o});
  rows.sort(function(a,b){return (b.score||0)-(a.score||0)});
  var maxScore=Math.max.apply(null,rows.map(function(r){return r.score||0}).concat([1]));
  var cutScore=null,cutIdx=-1;
  rows.forEach(function(r,i){if(chosenSet[r._id]){cutIdx=i;if(cutScore===null||((r.score||0)<cutScore))cutScore=r.score||0}});
  var cScores=(ctrl&&ctrl.scores)||{};
  var cRank={},cMax=1;
  Object.keys(cScores).sort(function(a,b){return ((cScores[b]||{}).score||0)-((cScores[a]||{}).score||0)})
    .forEach(function(k,i){cRank[k]=i+1;cMax=Math.max(cMax,(cScores[k]||{}).score||0)});
  /* 入选主题在每个因子上的平均加权贡献——落选理由的参照系 */
  var inRows=rows.filter(function(r){return chosenSet[r._id]});
  var avgComps=[0,0,0,0];
  if(inRows.length){
    inRows.forEach(function(r){
      avgComps[0]+=0.30*(r.H||0);avgComps[1]+=0.25*(r.G||0);
      avgComps[2]+=0.25*(r.E||0);avgComps[3]+=0.20*(100-(r.P||0));
    });
    avgComps=avgComps.map(function(v){return v/inRows.length});
  }
  var SEGC=['var(--color-data-1)','var(--color-data-2)','var(--color-data-3)','var(--color-data-4)'];
  var SEGL=['H 热度','G 分歧','E 实据','P 已定价'];
  var SEGW=[0.30,0.25,0.25,0.20];
  var SEGG=[HGEP_GLOSS.H,HGEP_GLOSS.G,HGEP_GLOSS.E,HGEP_GLOSS.P];
  /* 这排药丸只列入选的 5 个，下面的表却有全部主题（含落选）——两边不是同一份
   * 清单，却长得像同一个筛选器；聚焦在落选主题上时药丸还一个都不亮。
   * 表本身就是清单，点行即可，这里只留状态。 */
  var inDrawer=!!(d&&d.p!==undefined);
  var tabs=foc?focusBar(inDrawer?'':foc+(topicLabel(foc)?'　'+topicLabel(foc):''),'主题'):'';
  var agree0=topicChosen('hgep').filter(function(t){return ctrlChosen[t]});
  var hOnly0=topicChosen('hgep').filter(function(t){return !ctrlChosen[t]});
  var cOnly0=(ctrl?(ctrl.chosen||[]):[]).filter(function(t){return !chosenSet[t]});
  var disLine=ctrl?'<div class="card-note" style="margin-bottom:var(--space-3)">两臂重合 '+agree0.length+'/'+topicChosen('hgep').length+'：双选 '+(agree0.map(esc).join('·')||'—')
    +'；仅语义臂 '+(hOnly0.map(esc).join('·')||'—')+'；仅计数臂 '+(cOnly0.map(esc).join('·')||'—')+'</div>':'';
  var inHTML='',outHTML='';
  rows.forEach(function(r,ri){
    var rowHTML='';
    var isIn=!!chosenSet[r._id];
    var focCls=foc?(r._id===foc?' foc':' dim'):'';
    var barPct=Math.max(2,(r.score||0)/maxScore*100);
    /* P 是「已定价」，越低越好——计分用 (100 − P)，与后端 WEIGHTS 同口径 */
    var comps=[0.30*(r.H||0),0.25*(r.G||0),0.25*(r.E||0),0.20*(100-(r.P||0))];
    var wsum=comps.reduce(function(a,b){return a+b},0);
    var segs='';
    /* 落选行同样画出四个因子的构成，只是压暗：落选的理由是「哪一段短了」，
     * 一根没有分段的灰条把这个理由抹掉了，读者只能看到结果看不到原因。 */
    if(wsum>0){
      var vals=[r.H,r.G,r.E,r.P];
      segs=comps.map(function(c,i){
        return '<div class="race-seg" style="width:'+(c/wsum*100).toFixed(1)+'%;background:'+SEGC[i]+(isIn?'':';opacity:.34')+'" title="'+SEGG[i]+'。本主题 '+SEGL[i].slice(0,1)+' = '+numOr(vals[i])+'（权重 '+SEGW[i].toFixed(2)+(i===3?'，反向计分':'')+'，贡献 '+c.toFixed(1)+' 分）"></div>';
      }).join('');
    }else{
      segs='<div class="race-seg" style="width:100%;background:var(--color-surface-sunken)" title="未入选——综合分 '+numOr(r.score)+'"></div>';
    }
    var cnt='';
    var cs=cScores[r._id];
    if(cs){
      var pos=Math.max(3,Math.min(97,((cs.score||0)/cMax)*100));
      var hR=ri+1;
      var dotTip;
      var gap0=(cutScore!==null&&r.score!==undefined)?(cutScore-(r.score||0)):null;
      if(ctrlChosen[r._id]&&isIn)dotTip='计数臂第 '+cRank[r._id]+' 名，HGEP 第 '+hR+' 名 · 两臂均选入';
      else if(ctrlChosen[r._id])dotTip='计数臂第 '+cRank[r._id]+' 名并选入，HGEP 未选入'+(gap0!==null?'（差 '+gap0.toFixed(1)+' 分）':'')+' · 两臂分歧项';
      else if(isIn)dotTip='计数臂第 '+cRank[r._id]+' 名未选入前 5，HGEP 第 '+hR+' 名并选入 · 两臂分歧项';
      else dotTip='计数臂第 '+cRank[r._id]+' 名，HGEP 第 '+hR+' 名 · 两臂均未选入';
      dotTip+=' · 提及 '+fmtInt(cs.mentions!==undefined?cs.mentions:cs.score)+' 次。'+COUNT_GLOSS;
      cnt='<span class="race-cnt'+(ctrlChosen[r._id]?' pick':'')+'" style="left:'+pos.toFixed(1)+'%" title="'+esc(dotTip)+'">#'+cRank[r._id]+'</span>';
    }
    var side;
    if(isIn){
      side='<span class="sc num">'+numOr(r.score)+'</span>'
        +(ctrlChosen[r._id]?'<span class="d" title="两臂均选入前 5">双选</span>':(cs?'<span class="d" title="仅语义臂选入">仅语义臂</span>':''));
    }else{
      var gap=(cutScore!==null&&r.score!==undefined)?(cutScore-(r.score||0)):null;
      side='<span class="sc num">'+numOr(r.score)+'</span><span class="d">'+(gap!==null?'差 '+gap.toFixed(1)+' 分':'落选')+(ctrlChosen[r._id]?' · <span style="color:var(--color-text-brand)">仅计数臂</span>':'')+'</span>';
    }
    rowHTML+='<button type="button" class="race-row'+(isIn?'':' lost')+focCls+'" id="topicrow-'+esc(r._id)+'" onclick="'+(foc===r._id?'setDrawerFocus(null)':'setDrawerFocus(\''+jss(r._id)+'\')')+'" title="'+(foc===r._id?'回到全景':'只看这一个主题：其余压暗，并就地展开它的研报证据')+'">'
      +'<span class="race-name"><span class="id">'+esc(r._id)+'</span><span class="lbl">'+esc(r.label||'')+'</span></span>'
      +'<span class="race-track"><span class="race-bar" style="width:'+barPct.toFixed(1)+'%">'+segs+'</span>'+cnt+'</span>'
      +'<span class="race-side">'+side+'</span>'
      +'</button>';
    if(!isIn){
      rowHTML+='<div class="race-why"><span class="w">'+topicLossReason(r,avgComps,cutScore)+'</span></div>';
    }
    if(foc===r._id){
      rowHTML+='<div class="race-detail" style="margin-top:6px">'+topicDrawerBody(r._id,true)+'</div>';
    }
    if(isIn)inHTML+=rowHTML; else outHTML+=rowHTML;
  });
  var nIn=topicChosen('hgep').length,nOut=rows.length-nIn;
  /* 整步追问的入口放在这一层最上面：读者看完这张表最先冒出来的问题是
   * 「凭什么是这几个」，而不是某一个主题的细节。整步追问交给模型的是
   * 完整打分表 + 计数对照臂，不附研报正文——这一步的取舍就是在表上做的。 */
  var askStep='<div style="margin:0 0 var(--space-3)">'+askBtn('selection','topics')+'</div>';
  var legend='<div class="race-legend">'
    +'<span><span class="sw" style="background:var(--color-data-1)"></span>H 热度<span class="gloss gm" title="'+esc(HGEP_GLOSS.H)+'">ⓘ</span></span>'
    +'<span><span class="sw" style="background:var(--color-data-2)"></span>G 分歧<span class="gloss gm" title="'+esc(HGEP_GLOSS.G)+'">ⓘ</span></span>'
    +'<span><span class="sw" style="background:var(--color-data-3)"></span>E 实据<span class="gloss gm" title="'+esc(HGEP_GLOSS.E)+'">ⓘ</span></span>'
    +'<span><span class="sw" style="background:var(--color-data-4)"></span>P 已定价<span class="gloss gm" title="'+esc(HGEP_GLOSS.P)+'">ⓘ</span></span>'
    +'<span><span class="sw" style="background:var(--color-data-1);opacity:.34"></span>落选</span>'
    +'<span><span class="race-cnt pick" style="position:static;transform:none;display:inline-flex;margin-right:5px">2</span>计数臂亦选入</span>'
    +'<span><span class="race-cnt" style="position:static;transform:none;display:inline-flex;margin-right:5px">7</span>计数臂未选入<span class="gloss gm" title="'+esc('圈内数字 = 计数对照臂对同一主题的排名。'+COUNT_GLOSS)+'">ⓘ</span></span>'
    +'</div>';
  var html=tabs+askStep+legend+disLine
    +'<div class="race-sec"><div class="race-sec-h"><span class="t">入选 · '+nIn+'</span><span class="s">进入筛选B，各生成方法据此写想法</span></div>'
    +'<div class="race">'+inHTML+'</div></div>'
    +(nOut?('<div class="race-sec lost"><div class="race-sec-h"><span class="t">落选 · '+nOut+'</span><span class="s">按综合分排序，每条标注落选理由与分差</span></div>'
      +'<div class="race">'+outHTML+'</div></div>'):'');
  if(foc&&d&&!d.scrolled){drawerScrollSel='#topicrow-'+foc;d.scrolled=true}
  return html+epi('语义打分相对计数打分的增量尚未验证，对照臂每周并行记录');
}

/* ── 主题证据抽屉（第 2/3 层） ── */
function topicDrawerBody(tid,embedded){
  var w=S.weekly||{};
  var hgep=topicArm('hgep'),ctrl=topicArmNot('hgep');
  var r=((hgep&&hgep.scores)||{})[tid];
  var ev=((w.evidence)||{})[tid];
  var chosen=topicChosen('hgep').indexOf(tid)>=0;
  var ctrlChosen=(ctrl?(ctrl.chosen||[]):[]).indexOf(tid)>=0;
  var html='';
  if(r){
    if(!embedded){
      html+='<div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:var(--space-2)">'
        +'<span style="font:600 20px/28px var(--font-sans);color:var(--color-text-primary)">'+esc(r.label||tid)+'</span>'
        +(chosen?badge('success','入选'):badge('neutral','落选'))
        +(ctrl?'<span class="card-note">计数臂：'+(ctrlChosen?'选入':'未选入')+'</span>':'')
        +'</div>';
    }
    /* 落选理由：内嵌时正上方那一行已经写了，不重复第二遍 */
    if(!chosen&&!embedded){
      var allSc=(hgep&&hgep.scores)||{};
      var inIds=topicChosen('hgep');
      var aC=[0,0,0,0],cut=null;
      inIds.forEach(function(t){
        var o=allSc[t]||{};
        aC[0]+=0.30*(o.H||0);aC[1]+=0.25*(o.G||0);aC[2]+=0.25*(o.E||0);aC[3]+=0.20*(100-(o.P||0));
        if(o.score!==undefined&&(cut===null||o.score<cut))cut=o.score;
      });
      if(inIds.length)aC=aC.map(function(v){return v/inIds.length});
      html+='<div class="rej-why">落选依据：'+topicLossReason(r,aC,cut)+'</div>';
    }
    html+=hgepBreakdown(r)
      +'<div class="derive-kv">'
      +'<span>证据 '+fmtInt(r.n_evidence)+' 条 · '+fmtInt(r.n_institutions)+' 家机构</span>'
      +'<span>P 来源 <span'+(r.p_source==='neutral_default'?' class="gloss" title="中性默认 50——没有取到价格已定价程度的读数，不代表判断"':'')+'>'+esc(r.p_source||'—')+'</span></span>'
      +'<span class="kv-t">指示标的 '+esc(r.indicator||'—')+'</span>'
      +'</div>';
    var nIdeas=poolCountBy('topic',tid);
    html+='<div class="derive-kv">'
      +(nIdeas>0?'<span><button type="button" class="exp-btn" onclick="filterPool(\'topic\',\''+jss(tid)+'\',\'主题 '+esc(tid)+'\')">该主题产出的 '+fmtInt(nIdeas)+' 条候选 ›</button></span>':'<span style="color:var(--color-text-tertiary)">'+(chosen?'想法还没产出':'落选主题不进入筛选B')+'</span>')
      +'</div>';
  }else{
    html+='<div class="empty-sm" style="margin-bottom:var(--space-4)">语义臂本期无 '+esc(tid)+' 的评分记录</div>';
  }
  html+='<div style="margin:0 0 var(--space-4)">'+askBtn('topic',tid)+'</div>';
  if(ev){
    var docs=ev.docs||[];
    html+='<div style="font:600 14px/20px var(--font-sans);color:var(--color-text-primary);margin:0 0 6px">词表命中研报 · '+fmtInt(ev.n)+' 条 '
      +glossMark('按'+(ev.matched_on||'标题关键词')+'命中，与上方「证据 '+fmtInt(r&&r.n_evidence)+' 条」不是同一套口径——那是打分内部的计数，两个数都摆出来。点任意一篇看摘要、凭据与全文。')+'</div>'
      +'<div class="ev-list scroll-thin">'+docs.map(function(dd,di){return docRowHTML(dd,'td-'+esc(tid)+'-'+di)}).join('')+'</div>'
      +(ev.truncated?'<div style="font:400 12px/16px var(--font-sans);color:var(--color-text-tertiary);margin-top:6px">另有 '+fmtInt(ev.truncated)+' 条未显示</div>':'');
  }else{
    html+='<div class="empty-sm">这个主题没有词表命中的研报清单'+(r?'（打分依据的证据计数见上）':'')+'</div>';
  }
  return html;
}

/* ── 3 · 筛选B：生产网格（focus = 方法：焦点头 + 独有标的 + 重合率，其余行压暗） ── */
function stageGeneratorsBody(d){
  var w=S.weekly||{};
  var gens=w.generators||[];
  var chosen=topicChosen('hgep');
  var cands=((w.pool)||{}).candidates||[];
  if(!(gens.length&&chosen.length)){
    return '<div class="empty-sm">想法尚未产出'+(w.in_flight?'，筛选A 完成后 4 种方法并行生成':'')+'</div>';
  }
  /* 归一 focus 到 GEN_ORDER 的 key */
  var focKey=null;
  if(d&&d.f){
    var fo=GEN_ORDER.find(function(o){return o[0]===d.f||methodName(o[0])===methodName(d.f)});
    if(fo)focKey=fo[0];
  }
  /* 药丸列 4 种方法，下面网格的第一列也列同样 4 种方法，只有药丸能点——
   * 读者在网格里点方法名没反应，只好回到上面再点一次。现在反过来：
   * 网格里的方法名就是入口，这里只留状态。 */
  var focRow=focKey?GEN_ORDER.find(function(o){return o[0]===focKey}):null;
  var tabs=focRow?focusBar((d&&d.p!==undefined)?'':focRow[1],'方法'):'';
  /* 焦点头：它是谁 · 产出 · 独有标的（方法间最真实的 diff）· 重合率 */
  var focusHead='';
  if(focKey){
    var fo2=GEN_ORDER.find(function(o){return o[0]===focKey});
    var fg=genByKey(focKey);
    var mine=cands.filter(function(c){return (c.proposed_by||[]).indexOf(focKey)>=0});
    var uniq=mine.filter(function(c){
      var st={};(c.proposed_by||[]).forEach(function(m){st[m]=1});
      return Object.keys(st).length===1;
    });
    var overlap=mine.length-uniq.length;
    var pct=mine.length?Math.round(overlap/mine.length*100):0;
    focusHead='<div class="focus-head">'
      +'<b>'+esc(fo2[1])+'</b><span class="tag tag-brand" style="margin-left:6px">'+esc(fo2[2])+'</span>'
      +'<span style="margin-left:6px">'+pathTag(GEN_PATH[focKey])+'</span>'
      /* 说明与例子在方法卡片里已经是 genGlossTitle 的 ⓘ；这里曾把同一份内容
         铺成两行正文，同一个东西两种读法。统一收进 ⓘ。 */
      +'<span class="gloss gm" style="margin-left:6px" title="'+esc(genGlossTitle(fo2))+'">ⓘ</span>'
      +'<div style="margin-top:6px">'
      +(fg?'本期产出 <b class="num">'+fmtInt(fg.n)+'</b> 条 · 被拒 <b class="num">'+fmtInt(fg.rejected||0)+'</b> 条 · 合并后在池 <b class="num">'+fmtInt(mine.length)+'</b> 条。':'本期没有它的产出记录。')
      +'</div>'
      +'<div style="margin-top:6px"><b>独有标的 '+fmtInt(uniq.length)+' 个</b>（仅该方法提出）：'
      +(uniq.length?'<span style="display:inline-flex;flex-wrap:wrap;gap:4px;vertical-align:middle;margin-left:4px">'
        +uniq.map(function(c){return '<button type="button" class="tag tag-brand mono" style="cursor:pointer" title="'+esc(c.instrument_name||'')+' · '+esc(c.topic_id||'')+' — 在候选池里看这条" onclick="filterPoolCode(\''+jss(c.instrument_id)+'\')">'+esc(c.instrument_id)+' ›</button>'}).join('')
        +'</span>':'<span style="color:var(--color-text-tertiary)">本期无独有标的</span>')
      +'</div>'
      +'<div style="margin-top:4px;color:var(--color-text-metadata)">与其他方法重合 <b class="num">'+fmtInt(overlap)+'</b> / '+fmtInt(mine.length)+' 条（'+pct+'%）'+glossMark('各方法读取同一批研报，重合不构成独立证据。')+'</div>'
      +'</div>';
  }
  var perMax=1,target=null;
  GEN_ORDER.forEach(function(o){
    var g=genByKey(o[0]);if(!g)return;
    var per=(g.meta||{}).per_topic||{};
    chosen.forEach(function(t){perMax=Math.max(perMax,per[t]||0)});
    if((g.meta||{}).target_per_topic)target=g.meta.target_per_topic;
  });
  /* 两侧固定列在抽屉里会把网格顶出 34px，最右的「合计」被裁掉。
   * 给它们一个可压缩的下限：宽处照旧，窄处先让固定列让步，而不是让内容出界。 */
  var cols='minmax(112px,150px) '+chosen.map(function(){return 'minmax(56px,1fr)'}).join(' ')+' minmax(104px,130px)';
  var html='<div class="pgrid-wrap scroll-thin"><div class="pgrid" style="grid-template-columns:'+cols+'">';
  html+='<div class="pg-h" style="justify-content:flex-start;align-items:flex-end;text-align:left">方法 ＼ 主题</div>';
  chosen.forEach(function(t){html+='<div class="pg-h" title="'+esc(topicLabel(t))+'">'+esc(t)+'</div>'});
  html+='<div class="pg-h" style="justify-content:flex-end;text-align:right">合计</div>';
  GEN_ORDER.forEach(function(o){
    var g=genByKey(o[0]);
    var isFoc=focKey===o[0];
    var dimS=(focKey&&!isFoc)?';opacity:.35':'';
    html+='<button type="button" class="pg-m'+(isFoc?' foc':'')+'" style="padding:2px 6px'+dimS+'"'
      +' onclick="setDrawerFocus('+(isFoc?'null':'\''+o[0]+'\'')+')"'
      +' title="'+(isFoc?'回到全景':'只看这一种方法：其余压暗，并展开它的独有标的与重合率')+'">'
      +'<span class="t">'+esc(o[1])+'<span class="gloss gm" title="'+esc(genGlossTitle(o))+'">ⓘ</span></span>'
      +'<span class="s">'+esc(o[2])+'</span></button>';
    if(g){
      var per=(g.meta||{}).per_topic||{};
      chosen.forEach(function(t){
        var n=per[t]||0;
        if(n){
          var a=(0.08+0.55*n/perMax).toFixed(2);
          html+='<button type="button" class="pg-cell" style="background:rgba(47,131,85,'+a+')'+dimS+'" title="'+esc(o[1])+' × '+esc(t)+'：写出 '+n+' 条'+(target?'（目标 '+target+' 条/主题）':'')+' — 点击在候选池抽屉查看合并后的这批" onclick="filterPoolMT(\''+jss(g.method)+'\',\''+jss(t)+'\')">'+n+'<span class="u">条</span></button>';
        }else{
          html+='<div class="pg-cell empty" style="min-height:52px'+dimS+'" title="'+esc(o[1])+' × '+esc(t)+'：0 条">0</div>';
        }
      });
      var warn=[];
      var meta=g.meta||{};
      if(meta.truncated&&Object.keys(meta.truncated).length)warn.push('有截断');
      var noc=meta.topics_without_corpus_match;
      if(noc&&noc.length)warn.push('缺研报:'+noc.join('/'));
      html+='<div class="pg-tail" style="'+(dimS?dimS.slice(1):'')+'"><span>产出 <b>'+fmtInt(g.n)+'</b>'+(target?' / 目标 '+fmtInt(target*chosen.length):'')+'</span>'
        +'<span>被拒 <b>'+fmtInt(g.rejected||0)+'</b> 条'+(warn.length?' · <span style="color:var(--color-feedback-warning-text)">'+esc(warn.join(' '))+'</span>':'')+'</span></div>';
    }else{
      chosen.forEach(function(){html+='<div class="pg-cell empty" style="'+(dimS?dimS.slice(1):'')+'">—</div>'});
      html+='<div class="pg-tail"><span style="color:var(--color-text-tertiary)">'+(w.in_flight?'正在写':'无产出')+'</span></div>';
    }
  });
  html+='</div></div>';
  var total=gens.reduce(function(a,g){return a+(g.n||0)},0);
  return tabs+focusHead
    +pathLegend(GEN_PATH,GEN_ORDER.map(function(o){return o[0]}))
    +'<div class="quiet" style="margin-bottom:var(--space-3)">4 种方法 × '+chosen.length+' 个主题并行生成，彼此独立 '+glossMark('每条想法是 1 个月期限的结构化输出，含概率、上下行情景与论点。四种方法互不可见。')+' · 本期合计 <b class="num" style="color:var(--color-text-primary)">'+fmtInt(total)+'</b> 条 · 色深 = 产量'
+'</div>'
    +html
    +epi('目标为每方法每主题 '+(target||20)+' 条；未写满不补足，缺口本身为观测量');
}

/* ── 4 · 合并候选池 ── */
function stagePoolBody(d){
  var focTier=(d&&d.f)?String(d.f):null;
  var w=S.weekly||{};
  var pool=w.pool||{},cands=pool.candidates||[];
  var gens=w.generators||[];
  var raw=gens.reduce(function(s,g){return s+(g.n||0)},0);
  var conv=pool.convergence||{};
  var head,merge='';
  if(pool.n){
    head='<div class="merge-line">'
      +'<span class="big">'+fmtInt(raw)+'</span><span class="quiet">条原始想法</span>'
      +'<span class="arr">→ 同一标的合并、赔率取中位数 →</span>'
      +'<span class="big">'+fmtInt(pool.n)+'</span><span class="quiet">条候选（一标一条）</span>'
      +'</div>'
      +'<div class="card-note" style="margin-bottom:var(--space-2)">按跨方法共识度分档 '+glossMark(CONV_GLOSS)+'</div>';
    /* 共识度 = 几种不同方式提出（与 API convergence 同口径） */
    var groups={};cands.forEach(function(c){
      var uniq={};(c.proposed_by||[]).forEach(function(m){uniq[m]=1});
      var k=String(Object.keys(uniq).length||1);
      (groups[k]=groups[k]||[]).push(c);
    });
    var BUBBG={'4':'var(--color-surface-brand-sunken)','3':'var(--color-surface-brand-highlight)','2':'var(--color-surface-brand-muted)','1':'var(--color-surface-brand-subtle)'};
    ['4','3','2','1'].forEach(function(k){
      var arr=groups[k];if(!arr||!arr.length)return;
      arr.sort(function(a,b){return String(a.instrument_id).localeCompare(String(b.instrument_id))});
      var d=34+(Number(k)-1)*10;
      var gFoc=focTier?(k===focTier?' foc':' dim'):'';
      merge+='<div class="bub-group'+gFoc+'" style="padding-left:6px;padding-right:6px">'
        +'<div class="bub-k"><div class="t">'+convLabel(k)+'<span class="gloss gm" title="'+esc(CONV_GLOSS)+'">ⓘ</span></div><div class="s">'+fmtInt(conv[k]!==undefined?conv[k]:arr.length)+' 条'+(k==='4'?' · 最高共识':'')+'</div></div>'
        +'<div class="bub-cloud">'
        +arr.map(function(c){
          return '<button type="button" class="bub" style="width:'+d+'px;height:'+d+'px;background:'+BUBBG[k]+';box-shadow:inset 0 0 0 1px var(--color-border-brand-subtle)" '
            +'title="'+esc(c.instrument_id)+' '+esc(c.instrument_name||'')+' · 主题 '+esc(c.topic_id||'')+' · 上行 '+fmtPct(c.upside_pct)+' / 下行 '+fmtPct(c.downside_pct)+' — 点击在下方全表定位" '
            +'onclick="filterPoolCode(\''+jss(c.instrument_id)+'\')">'+esc(c.instrument_id)+'</button>';
        }).join('')
        +'</div></div>';
    });
    merge+=epi('各生成方法读取同一批研报，共识度不构成独立证据，仅作记录，不参与打分');
  }else{
    head='<div class="empty-sm">候选池尚未合并'+(w.in_flight?'，各生成方法完成后自动合并':'')+'</div>';
  }
  var candCard;
  if(cands.length){
    var flt='';
    if(poolFilter){
      var matched=cands.filter(poolMatch).length;
      flt='<div class="filter-bar">'+fmtInt(cands.length)+' 条中的 '+fmtInt(matched)+' 条 · 筛选条件：'+esc(poolFilter.label)
        +'<button type="button" class="exp-btn" style="padding:0 4px" onclick="clearPoolFilter()" aria-label="清除筛选">×</button></div>';
    }
    candCard='<div id="candCard" style="margin-top:var(--space-6)">'
      +'<div class="card-title-row"><h2 class="card-title" style="margin-bottom:0">候选池全表</h2><span class="card-note">'+fmtInt(cands.length)+' 条 · 列头排序</span></div>'
      +flt
      +'<div class="table-wrap scroll-y scroll-thin" style="margin-top:var(--space-3)"><table id="candTable" class="dense">'
      +'<thead><tr>'+candTh('instrument_id','标的')+candTh('instrument_name','名称')+candTh('topic_id','主题')
      +candTh('upside_pct','上行','r')+candTh('downside_pct','下行','r')
      +candTh('p_up','P↑','r')+candTh('p_base','P基','r')+candTh('p_down','P↓','r')
      +candTh('n_proposals','提出','r')+'<th>生成方法 '+glossMark('一行四个点，按 '+GEN_ORDER.map(function(o){return o[1]}).join(' · ')+' 排列；亮 = 该方法提出了这条。展开「详情」看方法名与各自的论点。')+'</th><th class="r">当时的理由</th></tr></thead>'
      +'<tbody id="candBody"></tbody></table></div>'
      +epi('赔率低于 1.5 的想法不进入候选池')
      +'</div>';
  }else{
    candCard='<div id="candCard" style="margin-top:var(--space-6)"><h2 class="card-title">候选池全表</h2>'
      +'<div class="empty-sm">候选池是空的'+(w.in_flight?'——合并完成后自动出现':'')+'</div></div>';
  }
  return head+merge+candCard;
}

/* ── 5 · 筛选C：闸门矩阵 ── */
function stageSelectorsBody(d){
  var foc=(d&&d.f)?String(d.f):null;
  var w=S.weekly||{};
  var sels=orderedSelectors();
  var cands=((w.pool)||{}).candidates||[];
  var books=currentBooks();
  if(!sels.length){
    return '<div class="empty-sm">本期选取策略尚未执行'+(w.in_flight?'，候选池合并后开始':'')+'</div>';
  }
  /* 同上：药丸和下面的策略卡片列的是同一批策略。入口收敛到卡片本身。 */
  var tabs=(foc?focusBar((d&&d.p!==undefined)?'':selMetaOf(foc)[1],'策略'):'')
    +pathLegend(SEL_PATH,sels.map(function(sl){return sl.name}))
    +(foc?'':'<div class="card-note" style="margin-bottom:var(--space-2)">点策略名只看它：其余压暗，并展开它放行的标的</div>');
  var focusHead='';
  if(foc){
    var fs=sels.find(function(x){return x.name===foc});
    var fm=selMetaOf(foc);
    if(fs){
      var ids=(fs.chosen||[]).map(selChosenId);

        +((s.chosen||[]).length?'　<button type="button" class="exp-btn" onclick="filterPool(\'selector\',\''+jss(s.name)+'\',\'策略 '+esc(m[1])+'\')">回候选池 ›</button>':'　<span style="color:var(--color-text-tertiary)">空仓：无标的达到门槛，留存现金</span>')

        +(function(){

          /* 有账本但空条 = 选中了但还没成交。留白会让人以为是渲染丢了，

          if(!bar){

      +'<div class="card-note" style="margin-top:var(--space-2)">灰点 = 对照臂'

/* ── 6 · 自动建仓 ── */
function rngBarHTML(p){
  var lo=p.stop_px,hi=p.take_px,en=p.entry_px,la=p.last_px;
  var has=function(v){return v!==undefined&&v!==null&&!isNaN(v)};
  if(!has(lo)||!has(hi)||!(hi>lo)){
    /* σ 算不出（如无价史的载体）：不画假条 */
    return '<span class="card-note">σ 无法计算 · 未设止损/止盈'+(has(la)?'（现价 '+fmtMoney(la)+'）':'')+'</span>';
  }
  /* 位置一律用百分比、并夹到 [0,100] —— 不做像素测量，抽屉过渡/就地换页也不会塌 */
  function pct(v){return Math.max(0,Math.min(100,(v-lo)/(hi-lo)*100))}
  var below=has(la)&&la<lo, above=has(la)&&la>hi;
  var upC=has(la)&&has(en)&&la>=en;
  var status='';
  if(below)status='<span class="rng-ofl down">◂ 现价已低于止损线（待触发退出）</span>';
  else if(above)status='<span class="rng-ofl up">现价已高于止盈线（待触发退出）▸</span>';
  return '<span class="rngwrap" title="止损 '+fmtMoney(lo)+'（σ×2）· 进场 '+fmtMoney(en)+' · 现价 '+fmtMoney(la)+' · 止盈 '+fmtMoney(hi)+'（σ×3）">'
    +'<span class="rng">'
    +'<span class="rng-track"></span>'
    +'<span class="rng-end" style="left:0"></span><span class="rng-end" style="right:0"></span>'
    +(has(en)?'<span class="rng-tick" style="left:'+pct(en).toFixed(1)+'%"></span>':'')
    +(has(la)?'<span class="rng-last'+((below||above)?' edge':'')+'" style="left:calc('+pct(la).toFixed(1)+'% - 5px);background:var(--color-stock-'+(upC?'up':'down')+'-default)"></span>':'')
    +'</span>'
    /* 四个价位固定在条下一行，各占一列——从根上消灭标签互撞 */
    +'<span class="rng-vals"><i>损 '+fmtMoney(lo)+'</i><i>进 '+fmtMoney(en)+'</i><i class="cur">现 '+fmtMoney(la)+'</i><i>盈 '+fmtMoney(hi)+'</i></span>'
    +status
  +'</span>';
}

/* ══════════ 持仓/账本/状态抽屉（本周页共用） ══════════ */
/* 全账本按标的合并 */
function mergedPositions(){
  var books=currentBooks();
  var byCode={},order=[];
  books.forEach(function(b){
    (b.open_positions||[]).forEach(function(p){
      var k=p.code;
      if(!byCode[k]){byCode[k]={code:p.code,name:p.instrument_name,thesis:p.thesis,theme_id:p.theme_id,
        entry_px:p.entry_px,last_px:p.last_px,stop_px:p.stop_px,take_px:p.take_px,opened_d:p.opened_d,
        unrealized:0,value:0,cost:0,books:[],perBook:[]};order.push(k)}
      var mv=(p.qty||0)*(p.last_px||0);
      var cv=(p.qty||0)*(p.entry_px||0);
      byCode[k].unrealized+=(p.unrealized||0);
      byCode[k].value+=mv;byCode[k].cost+=cv;
      byCode[k].books.push(b.selector||b.book_id);
      byCode[k].perBook.push({sel:b.selector||b.book_id,unrealized:p.unrealized,qty:p.qty,
                              entry_px:p.entry_px,opened_d:p.opened_d});
    });
  });
  return {byCode:byCode,order:order};
}
function posDrawerBody(code){
  var mp=mergedPositions();
  var p=mp.byCode[code]||mp.byCode[Object.keys(mp.byCode).find(function(k){return bareCode(k)===bareCode(code)})||''];
  if(!p)return '<div class="empty-sm">在场持仓里找不到 '+esc(code)+'——可能已平仓或来自更早批次</div>';
  var cand=candByCode(p.code);
  var chgPct=(p.entry_px&&p.last_px)?((p.last_px/p.entry_px-1)*100):null;
  var pnlPct=p.cost?(p.unrealized/p.cost*100):null;
  var html='<div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap">'
    +'<span style="font:600 20px/28px var(--font-sans);color:var(--color-text-primary)">'+esc(p.name||bareCode(p.code))+'</span>'
    +'<span class="mono" style="color:var(--color-text-tertiary)">'+esc(p.code)+'</span>'
    +(p.theme_id?'<button type="button" class="tag tag-brand mono" style="cursor:pointer" onclick="openTopicDrawer(\''+jss(p.theme_id)+'\')" title="'+esc(topicLabel(p.theme_id))+'">'+esc(p.theme_id)+' ›</button>':'')
    +'</div>'
    +'<div style="margin:var(--space-2) 0 var(--space-4);display:flex;gap:var(--space-5);flex-wrap:wrap;align-items:baseline">'
    +'<span class="num '+pctCls(p.unrealized)+'" style="font:600 26px/32px var(--font-sans)">'+signedMoney(p.unrealized)+'</span>'
    /* 两个百分比看着几乎一样却不相等，是这一屏最容易被当成 bug 的地方。
     * 「对成本」是所有持有它的账本按金额加权的真实回报；「价格」只是这只标的
     * 从某一个进场价到现价的涨跌。多个账本在不同日子、不同价位进场时，两者
     * 本来就该岔开——把口径写出来，比让人以为算错了强。 */
    +(function(){
      var pb=p.perBook||[];
      var pxs=pb.map(function(x){return x.entry_px}).filter(function(v){return v});
      var uniq={};pxs.forEach(function(v){uniq[Number(v).toFixed(4)]=1});
      var nPx=Object.keys(uniq).length;
      var days={};pb.forEach(function(x){if(x.opened_d)days[x.opened_d]=1});
      var nDay=Object.keys(days).length;
      var costTip='对成本 = 浮动盈亏 ÷ 总成本（含手续费），按所有持有它的账本的实际买入金额加权——这是这笔钱扣完成本后的真实回报。'+COST_GLOSS;
      var pxTip='价格 = 现价相对进场价的涨跌，只反映标的本身走势，不扣成本。'
        +'它比「对成本」高出的那一点，就是买入时计入的佣金与滑点。'
        +(nPx>1?'本仓还有 '+nPx+' 个不同的进场价'+(nDay>1?'（分 '+nDay+' 天建仓）':'')+'，这里显示的是其中一个。':'');
      return '<span class="num '+pctCls(pnlPct)+'">'+(pnlPct===null?'':fmtPct(pnlPct)+'（对成本）<span class="gloss gm" title="'+esc(costTip)+'">ⓘ</span>')+'</span>'
        +'<span class="num '+pctCls(chgPct)+'">'+(chgPct===null?'':'价格 '+fmtPct(chgPct)+'<span class="gloss gm" title="'+esc(pxTip)+'">ⓘ</span>')+'</span>'
        +'<span class="card-note">'+fmtInt(p.books.length)+' 个账本合计 · 开仓 '+esc(p.opened_d||'—')
        +(nDay>1?'<span class="gloss gm" title="各账本建仓日期不完全相同（共 '+nDay+' 个日期），这里显示的是其中一个。逐个账本的持有量见下方表格。">ⓘ</span>':'')
        +'</span>';
    })()
    +'</div>';
  /* 打开一仓，第一句想问的就是「为什么是它」。入口紧跟着盈亏数字，
     而且无条件给：候选池里找不到这条（更早批次建的仓）时最该能问，
     偏偏原来那种情况下按钮整个消失。 */
  html+='<div style="margin:0 0 var(--space-4)">'
    +askBtn('idea',(cand&&cand.id)||('pool:'+bareCode(p.code)))+'</div>';
  html+='<div style="margin-bottom:var(--space-3);color:var(--color-text-secondary)"><b style="font-weight:600;color:var(--color-text-primary)">论点</b>　'+esc(p.thesis||'（这仓没有存论点）')+'</div>';
  if(cand){
    html+='<div class="derive-kv" style="margin-top:0">'
      +'<span class="kv-t">生成方法：'+(cand.proposed_by||[]).map(methodName).map(esc).join(' / ')+'</span>'
      +'<span><button type="button" class="exp-btn" onclick="openProposalsDrawer(\''+esc(cand.instrument_id||'')+'\')" title="打开合并前的每一条提案：各方法自己写的论点、赔率，以及它当时引用的研报">看这 '+fmtInt(cand.n_proposals)+' 条提案的原文 ›</button></span>'
      +'</div>'
      +'<div class="derive-kv">'
      +'<span class="num">上行 '+fmtPct(cand.upside_pct)+'（P '+fmtProb(cand.p_up)+'）</span>'
      +'<span class="num">下行 '+fmtPct(cand.downside_pct)+'（P '+fmtProb(cand.p_down)+'）</span>'
      +'<span class="num">赚亏比 '+rrText(cand)+'</span>'
      +'<span><button type="button" class="exp-btn" onclick="filterPoolCode(\''+jss(bareCode(p.code))+'\')">在候选池里看这条 ›</button></span>'
      +'</div>';
  }else{
    html+='<div class="derive-kv"><span class="kv-t" style="color:var(--color-text-tertiary)">本期候选池里没有这条（可能来自更早批次）</span></div>';
  }
  html+='<div style="margin:var(--space-4) 0"><div class="pos-headr" style="grid-template-columns:minmax(0,1fr)"><span>σ×2 止损 ─ 进场（竖线）─ 现价（圆点）─ σ×3 止盈<span class="gloss gm" title="'+esc(SIGMA_GLOSS)+'">ⓘ</span></span></div>'
    +'<div style="max-width:420px">'+rngBarHTML(p)+'</div></div>';
  html+='<div style="font:600 14px/20px var(--font-sans);color:var(--color-text-primary);margin-bottom:4px">哪些账本在持有</div>'
    +'<div class="table-wrap"><table><thead><tr><th>账本（选取策略）</th><th class="r">数量</th><th class="r">浮动盈亏</th></tr></thead><tbody>'
    +p.perBook.map(function(pb){
      return '<tr><td class="primary"><button type="button" class="exp-btn" style="padding:2px 4px" onclick="openBookDrawer(\''+jss(pb.sel)+'\')">'+esc(selMetaOf(pb.sel)[1])+' ›</button></td>'
        +'<td class="r num">'+fmtInt(Math.round(pb.qty||0))+'</td>'
        +'<td class="r num '+pctCls(pb.unrealized)+'">'+signedMoney(pb.unrealized)+'</td></tr>';
    }).join('')
    +'</tbody></table></div>'
    +epi('等权买入 · 止损止盈自动执行 · 论点被证伪时次日收盘平仓');
  return html;
}
/* ── 主题敞口 ─────────────────────────────────────────────────
 * 「这个策略把钱压在哪几个宏观判断上」是账本层最先该回答的问题，
 * 而一张持仓明细表回答不了它：读者要自己把 8 行标的心算归到 5 个主题上。
 * 主题色在一次运行内是稳定的（按入选顺序取色），所以横着比较不同策略时，
 * 同一段颜色就是同一个主题——策略之间的差异一眼就是色块比例的差异。 */
/* 主题配色的唯一口径：本期入选主题占前几个色位，跨期持仓里的其他主题
 * 按字典序稳定顺延——同一主题在敞口图、策略分布图、账本明细里同色。 */
function themeColorOrder(){
  var chosen=topicChosen('hgep').map(String),extra={};
  (currentBooks()||[]).forEach(function(b){
    (b.open_positions||[]).forEach(function(p){
      var t=String(p.theme_id||'');
      if(t&&chosen.indexOf(t)<0)extra[t]=1;
    });
  });
  return chosen.concat(Object.keys(extra).sort());
}
function themeColor(tid){
  var i=themeColorOrder().indexOf(String(tid));
  if(i<0)return 'var(--color-fill-secondary)';
  return 'var(--color-data-'+((i%8)+1)+')';
}
function bookThemeMix(b){
  var pos=(b&&b.open_positions)||[];
  var by={},order=[],total=0;
  pos.forEach(function(p){
    var t=p.theme_id||'未归类';
    var v=Math.abs((Number(p.qty)||0)*(Number(p.last_px)||0));
    if(!by[t]){by[t]={theme:t,value:0,n:0,pnl:0};order.push(t)}
    by[t].value+=v;by[t].n++;by[t].pnl+=(Number(p.unrealized)||0);
    total+=v;
  });
  var mix=order.map(function(t){
    by[t].share=total?by[t].value/total*100:0;return by[t];
  });
  mix.sort(function(a,b2){return b2.value-a.value});
  return {mix:mix,total:total};
}
function themeBarHTML(b,compact){
  var r=bookThemeMix(b);
  if(!r.mix.length){
    if(compact)return '';
    var pend=Number((b||{}).pending_orders)||0,exp=Number((b||{}).expired_orders)||0;
    return '<div class="tx-wrap"><div class="tx-h">主题敞口</div>'
      +'<div class="card-note">当前没有在场持仓，因此没有主题敞口'
      +((pend||exp)?'：'+(pend?fmtInt(pend)+' 笔挂单等待成交':'')+(pend&&exp?'，':'')
        +(exp?fmtInt(exp)+' 笔已过期未成交':'')+'。挂单成交后这里才会出现色条。':'。')
      +'</div></div>';
  }
  /* 组合里会出现本期没入选的主题——那是更早一期建的仓还在场。
   * 只把它画成灰色是不够的：读者会以为配色出错，或以为主题层漏了一个。 */
  var chosenNow=topicChosen('hgep');
  var segs=r.mix.map(function(m){
    var stale=chosenNow.length&&chosenNow.indexOf(m.theme)<0;
    return '<span class="tx-seg'+(stale?' stale':'')+'" style="width:'+m.share.toFixed(1)+'%;background:'+themeColor(m.theme)+'"'
      +' title="'+esc(m.theme+'（'+topicLabel(m.theme)+'）：'+m.share.toFixed(0)+'% 仓位 · '+m.n+' 只 · 浮动 '+signedMoney(m.pnl)
        +(stale?'。该主题本期未入选，这些是更早一期建的仓，仍按原风控持有到期或触发止损止盈。':''))+'"></span>';
  }).join('');
  var nStale=r.mix.filter(function(m){return chosenNow.length&&chosenNow.indexOf(m.theme)<0}).length;
  if(compact)return '<span class="tx-bar compact">'+segs+'</span>';
  var legend=r.mix.map(function(m){
    var stale=chosenNow.length&&chosenNow.indexOf(m.theme)<0;
    return '<button type="button" class="tx-key'+(stale?' stale':'')+'" onclick="openTopicDrawer(\''+jss(m.theme)+'\')" title="'+esc(topicLabel(m.theme)+(stale?'（本期未入选，仓位来自更早一期）':''))+'——点击看这个主题的打分与证据">'
      +'<span class="sw" style="background:'+themeColor(m.theme)+'"></span>'
      +'<span class="id">'+esc(m.theme)+'</span>'
      +'<span class="v num">'+m.share.toFixed(0)+'%</span>'
      +'<span class="n">'+m.n+' 只'+(stale?' · 旧期':'')+'</span></button>';
  }).join('');
  return '<div class="tx-wrap">'
    +'<div class="tx-h">主题敞口 · 这个策略把仓位压在哪几个宏观判断上'
    +'<span class="gloss gm" title="按各仓位当前市值占该账本在场市值的比例计算；主题取自标的所属主题。同色即同一主题，可跨策略横向比较。">ⓘ</span></div>'
    +'<span class="tx-bar">'+segs+'</span>'
    +'<div class="tx-keys">'+legend+'</div>'
    +(nStale?'<div class="card-note" style="margin-top:6px">「旧期」= 本期未入选的主题，仓位来自更早的期 '+glossMark('按原风控继续持有到期或触发止损止盈——组合不会因为主题落选就被强制平掉。')+'</div>':'')
    +'</div>';
}
